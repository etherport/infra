name: Ansible Proxmox

on:
  workflow_dispatch:
    inputs:
      playbook:
        description: 'Playbook to run'
        required: true
        type: choice
        options:
          - proxmox-setup
          - proxmox
          - pve-network
          - pve-sshd
          - ceph-msgr2
          - ipmi-monitoring
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - check
          - apply
      allow_reboot:
        description: 'Allow reboot if needed (proxmox playbook only)'
        required: false
        type: boolean
        default: false
      pve_network_action:
        description: 'pve-network: add_storage_vlan (default) or remove_workload_subif'
        required: false
        type: choice
        default: add_storage_vlan
        options:
          - add_storage_vlan
          - remove_workload_subif

permissions:
  contents: read

env:
  WORKING_DIR: infra/ansible

jobs:
  ansible:
    name: Ansible ${{ github.event.inputs.playbook }} (${{ github.event.inputs.action }})
    # Lifecycle runner (gh-runner VM, outside the K8s cluster) — required
    # so Proxmox/cluster-management workflows still work if the cluster
    # is offline. `homelab-runner` runs inside K8s = chicken-and-egg.
    #
    # Container: pre-baked ansible-runner image. Built by
    # .github/workflows/ansible-runner-image.yml from
    # infra/ci/ansible-runner/Dockerfile. Pre-bake replaces the previous
    # `apt-get update + install ansible` step that was saturating the
    # gh-runner VM's outbound network and breaking the first ansible
    # SSH to PVE (2026-05-21 incident — debug-runner-net workflow
    # confirmed bare TCP probes succeed while the post-apt ansible SSH
    # times out from the same source IP).
    runs-on: [self-hosted, lifecycle]
    container:
      image: ghcr.io/etherport/ansible-runner:main
      # GHCR package auth-pulled with the workflow's GITHUB_TOKEN. NB (org
      # migration 2026-08): the namespace is now the etherport ORG, so the
      # make-public PATCH via /orgs/etherport should now work — the old
      # user-namespace 404 no longer applies. Revisit visibility per Phase 2.4
      # of docs/planning/github-org-migration-2026-08.md.
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Mint SSH cert (step-ca)
        id: sshcert
        uses: ./.github/actions/setup-ssh-cert
        with:
          jwk-password: ${{ secrets.STEP_JWK_PASSWORD }}

      - name: Build EXTRA_VARS
        id: extra
        run: |
          EXTRA_VARS=""
          if [ "${{ github.event.inputs.playbook }}" = "proxmox" ] && [ "${{ github.event.inputs.allow_reboot }}" = "true" ]; then
            EXTRA_VARS="$EXTRA_VARS -e allow_reboot=true"
          fi
          if [ "${{ github.event.inputs.playbook }}" = "pve-network" ]; then
            EXTRA_VARS="$EXTRA_VARS -e pve_network_action=${{ github.event.inputs.pve_network_action }}"
          fi
          echo "extra_vars=$EXTRA_VARS" >> "$GITHUB_OUTPUT"
          echo "Resolved EXTRA_VARS: $EXTRA_VARS"

      - name: Run Ansible playbook (check mode)
        if: github.event.inputs.action == 'check'
        env:
          ANSIBLE_PRIVATE_KEY_FILE: ${{ steps.sshcert.outputs.key-file }}
        run: |
          ansible-playbook \
            -i inventory/wind/inventory.ini \
            playbooks/${{ github.event.inputs.playbook }}.yml \
            --check --diff \
            ${{ steps.extra.outputs.extra_vars }} \
            -v
        working-directory: ${{ env.WORKING_DIR }}

      - name: Run Ansible playbook (apply)
        if: github.event.inputs.action == 'apply'
        env:
          ANSIBLE_PRIVATE_KEY_FILE: ${{ steps.sshcert.outputs.key-file }}
        run: |
          ansible-playbook \
            -i inventory/wind/inventory.ini \
            playbooks/${{ github.event.inputs.playbook }}.yml \
            --diff \
            ${{ steps.extra.outputs.extra_vars }} \
            -v
        working-directory: ${{ env.WORKING_DIR }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## Ansible Proxmox"
            echo ""
            echo "- **Playbook**: ${{ github.event.inputs.playbook }}"
            echo "- **Action**: ${{ github.event.inputs.action }}"
            echo "- **Allow Reboot**: ${{ github.event.inputs.allow_reboot }}"
          } >> $GITHUB_STEP_SUMMARY
