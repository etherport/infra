name: Build ansible-runner image

# Builds the CI ansible-runner container image and pushes to GHCR.
# Used by .github/workflows/ansible-proxmox.yml via `container:`.
#
# Trigger: any push to main that touches the Dockerfile or this workflow.

on:
  push:
    branches: [ "main" ]
    paths:
      - "infra/ci/ansible-runner/**"
      - ".github/workflows/ansible-runner-image.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "infra/ci/ansible-runner/**"
      - ".github/workflows/ansible-runner-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: infra/ci/ansible-runner
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/sparked-diamond/ansible-runner:main
            ghcr.io/sparked-diamond/ansible-runner:sha-${{ github.sha }}

      # No automated make-public: the GitHub API endpoint requires
      # PAT scope `delete:packages` (or admin:packages, which a workflow's
      # GITHUB_TOKEN does NOT receive even when `permissions: packages:
      # write` is set). User-owned namespaces (sparked-diamond is a user,
      # not an org) also use /users/, not /orgs/ — the previous PATCH
      # silently 404'd. Manual one-time flip via
      # https://github.com/users/sparked-diamond/packages/container/ansible-runner/settings
      # is sufficient since GHCR package visibility persists across image
      # rebuilds.
