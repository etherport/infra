name: Ansible VM Fleet (non-K8s + non-PVE)

# Generic dispatch wrapper for running ansible playbooks against the
# fleet of non-K8s VMs (AWS dns-aws/vpn-aws + local dns-fallback/
# vpn-fallback). Uses the same self-hosted runner + ansible-runner image
# as ansible-proxmox.yml.
#
# Examples:
#   - playbook=base, inventory=both          → install node_exporter +
#     base packages everywhere
#   - playbook=swap, inventory=aws           → add swap to AWS t4g.nano
#     instances (essential — they have only 512MB RAM)
#   - playbook=cloudwatch-agent, inventory=aws --limit dns-aws → install
#     CW agent on a single host
#
# Use the existing ansible-proxmox.yml for anything that targets the PVE
# host (pve-sshd, proxmox, pve-network, ceph-msgr2).

on:
  workflow_dispatch:
    inputs:
      playbook:
        description: 'Playbook to run'
        required: true
        type: choice
        options:
          - base
          - swap
          - cloudwatch-agent
          - technitium
          - wireguard
          - tailscale
          - etcd-backup        # K8s control-plane only — pass `-f limit=kube_control_plane`
          - asterisk-sbc       # Twilio⇄Talk SBC (task #80) — inventory=wind (targets [sbc_servers])
          - devbox             # persistent Claude Code workstation — inventory=wind (targets [devboxes])
          - step-ca-trust      # M76 cert-only SSH: trust the user CA (run vs inventory=aws to enroll the AWS box)
          - step-ca-hostcerts  # M76: mint host certs (kills known_hosts TOFU)
          - step-ca-remove-static-key  # M76: strip the static automation key — run ONLY after cert auth verified
          - runner-egress      # diagnostic: print the CI runner's public egress IP (localhost; M110 conn debug)
          - node-exporter      # standalone node_exporter only (H42) — for hosts where full base.yml is unsafe (pve!)
          - k8s-unattended-upgrades  # M116: security-only auto-patching on k8s nodes (reboots via kured) — inventory=wind limit=k8s_cluster
      inventory:
        description: 'Which inventory file(s)'
        required: true
        type: choice
        default: both
        options:
          - wind    # dns-fallback + vpn-fallback (and other local non-K8s)
          - aws     # dns-aws + vpn-aws
          - both    # both inventories (non-k8s_cluster hosts only)
      action:
        description: 'check (--check --diff) or apply'
        required: true
        type: choice
        default: check
        options:
          - check
          - apply
      limit:
        description: 'Optional --limit (host or group; blank = all in inventory)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  WORKING_DIR: infra/ansible

jobs:
  ansible:
    name: ansible ${{ github.event.inputs.playbook }} ${{ github.event.inputs.action }}${{ github.event.inputs.limit != '' && format(' --limit {0}', github.event.inputs.limit) || '' }}
    runs-on: [self-hosted, lifecycle]
    container:
      image: ghcr.io/sparked-diamond/ansible-runner:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Mint SSH cert (step-ca)
        id: sshcert
        uses: ./.github/actions/setup-ssh-cert
        with:
          jwk-password: ${{ secrets.STEP_JWK_PASSWORD }}

      # M76 cutover COMPLETE for the edge box (2026-07-02): vpn-aws trusts the
      # step-ca user CA (step-ca-trust applied via the static bootstrap key, then
      # cert-SSH verified) — aws runs now use the minted cert like the rest of the
      # fleet. This step keeps only the AWS connection tuning: ControlMaster
      # multiplexing for the intermittently-lossy homelab→AWS path (M124), and a
      # 60s timeout (the edge box's sudo stalled 12s+ on hostname lookup until
      # `ip-10-10-100-10` was added to /etc/hosts — root-caused 2026-07-02; the
      # generous timeout stays as a belt against path-loss retries).
      - name: AWS connection tuning (aws inventory only)
        if: github.event.inputs.inventory == 'aws'
        run: |
          echo "ANSIBLE_SSH_ARGS=-o ControlMaster=auto -o ControlPersist=120s -o StrictHostKeyChecking=no -o IdentitiesOnly=yes" >> "$GITHUB_ENV"
          echo "ANSIBLE_TIMEOUT=60" >> "$GITHUB_ENV"

      - name: Build inventory args + limit
        id: invargs
        run: |
          case "${{ github.event.inputs.inventory }}" in
            wind) INV="-i inventory/wind/inventory.ini" ;;
            aws)  INV="-i inventory/aws/inventory.ini"  ;;
            both) INV="-i inventory/wind/inventory.ini -i inventory/aws/inventory.ini" ;;
          esac
          echo "inv=$INV" >> "$GITHUB_OUTPUT"

          LIMIT=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            LIMIT="--limit ${{ github.event.inputs.limit }}"
          elif [ "${{ github.event.inputs.inventory }}" = "both" ]; then
            # When running across both inventories, exclude k8s_cluster
            # by default so we don't try to base.yml the worker nodes.
            LIMIT="--limit all:!k8s_cluster"
          fi
          echo "limit=$LIMIT" >> "$GITHUB_OUTPUT"

      - name: Run ansible (check)
        if: github.event.inputs.action == 'check'
        env:
          ANSIBLE_PRIVATE_KEY_FILE: ${{ steps.sshcert.outputs.key-file }}
          # age key for community.sops.load_vars (decrypt *.sops.yaml on the
          # runner). Empty for playbooks that don't use SOPS — harmless.
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          ansible-playbook ${{ steps.invargs.outputs.inv }} \
            playbooks/${{ github.event.inputs.playbook }}.yml \
            ${{ steps.invargs.outputs.limit }} \
            --check --diff -v
        working-directory: ${{ env.WORKING_DIR }}

      - name: Run ansible (apply)
        if: github.event.inputs.action == 'apply'
        env:
          ANSIBLE_PRIVATE_KEY_FILE: ${{ steps.sshcert.outputs.key-file }}
          # age key for community.sops.load_vars (decrypt *.sops.yaml on the
          # runner). Empty for playbooks that don't use SOPS — harmless.
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          ansible-playbook ${{ steps.invargs.outputs.inv }} \
            playbooks/${{ github.event.inputs.playbook }}.yml \
            ${{ steps.invargs.outputs.limit }} \
            --diff -v
        working-directory: ${{ env.WORKING_DIR }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## Ansible run summary"
            echo
            echo "- Playbook: \`${{ github.event.inputs.playbook }}\`"
            echo "- Inventory: \`${{ github.event.inputs.inventory }}\`"
            echo "- Action: \`${{ github.event.inputs.action }}\`"
            echo "- Limit: \`${{ steps.invargs.outputs.limit }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
