name: Build aws-s3-sync image

on:
  push:
    branches: [ "main" ]
    paths:
      - "platform/kubernetes/backups/aws-s3/image/**"
      - ".github/workflows/aws-s3-sync-image.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "platform/kubernetes/backups/aws-s3/image/**"
      - ".github/workflows/aws-s3-sync-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: platform/kubernetes/backups/aws-s3/image
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/sparked-diamond/aws-s3-sync:main
            ghcr.io/sparked-diamond/aws-s3-sync:sha-${{ github.sha }}

      - name: Make package public
        if: github.event_name != 'pull_request'
        run: |
          curl -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/orgs/sparked-diamond/packages/container/aws-s3-sync \
            -d '{"visibility":"public"}'
