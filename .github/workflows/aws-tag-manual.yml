# One-off IAM tagging for intentionally-manual bootstrap resources (cloud-tag-drift
# hygiene). The local terraform-homelab key can iam:TagUser but NOT TagPolicy/TagRole,
# and claude-admin is read-only — so ManagedBy=manual stamps on hand-created IAM
# policies/roles must run under the CI role (its gh-actions-terraform-iam policy
# carries the IAM management surface). Two fixed modes, no free-form commands:
#   map-ids    — print RoleId/PolicyId -> name for every customer role/policy, so a
#                cloud-tag-drift report's opaque AROA/ANPA ids can be resolved.
#   tag-manual — tag the given typed names ManagedBy=manual. Item format:
#                "policy:NAME" or "role:NAME", comma-separated. Names are validated
#                against a conservative charset; anything else is rejected.
name: AWS Tag Manual (IAM)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'map-ids (list id->name), tag-manual, or delete-fossils'
        required: true
        type: choice
        options: [map-ids, tag-manual, delete-fossils]
      items:
        description: 'tag-manual only: comma-separated policy:NAME / role:NAME'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write # H29 OIDC

env:
  AWS_REGION: us-west-2

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.1.1
        with:
          role-to-assume: arn:aws:iam::830881980142:role/gh-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Map ids to names
        if: github.event.inputs.mode == 'map-ids'
        run: |
          echo "## Customer IAM roles"
          aws iam list-roles --query 'Roles[?!contains(Arn, `aws-service-role`)].[RoleId,RoleName]' --output text
          echo "## Customer IAM policies"
          aws iam list-policies --scope Local --query 'Policies[].[PolicyId,PolicyName]' --output text

      - name: Delete fossils (2026-07-12 one-shot, operator-approved list — HARDCODED)
        if: github.event.inputs.mode == 'delete-fossils'
        run: |
          # Operator approved 2026-07-12 ("delete all 5"): dead WordPress/DataSync-era
          # IAM. Users w3tc/velero-backup/kubernetes-s3-backup were already deleted
          # with the local key; these 2 roles + 3 policies need the CI role's
          # ManageIAMRoles/ManageIAMPolicies. NO inputs are honored here — the list
          # is fixed so this mode can never delete anything else. Idempotent:
          # NoSuchEntity is treated as already-done.
          set -uo pipefail
          del() { "$@" 2>err.txt && echo "OK: $*" || { grep -q NoSuchEntity err.txt && echo "already gone: $*" || { cat err.txt; exit 1; }; }; }
          del aws iam detach-role-policy --role-name AWSDataSyncS3BucketAccess-backup.grahamsmith.net --policy-arn arn:aws:iam::830881980142:policy/service-role/AWSDataSyncS3BucketAccess-backup.grahamsmith.net
          del aws iam delete-role --role-name AWSDataSyncS3BucketAccess-backup.grahamsmith.net
          del aws iam delete-policy --policy-arn arn:aws:iam::830881980142:policy/service-role/AWSDataSyncS3BucketAccess-backup.grahamsmith.net
          del aws iam detach-role-policy --role-name AWSDataSyncS3BucketAccess-vmbackup.grahamsmith.net --policy-arn arn:aws:iam::830881980142:policy/service-role/AWSDataSyncS3BucketAccess-vmbackup.grahamsmith.net
          del aws iam delete-role --role-name AWSDataSyncS3BucketAccess-vmbackup.grahamsmith.net
          del aws iam delete-policy --policy-arn arn:aws:iam::830881980142:policy/service-role/AWSDataSyncS3BucketAccess-vmbackup.grahamsmith.net
          # delete-policy removes only the default version — non-default versions
          # must be purged first (bit on s3-backup-kubernetes-policy, DeleteConflict).
          purge_versions() {
            for v in $(aws iam list-policy-versions --policy-arn "$1" \
                         --query 'Versions[?IsDefaultVersion==`false`].VersionId' --output text 2>/dev/null); do
              del aws iam delete-policy-version --policy-arn "$1" --version-id "$v"
            done
          }
          del aws iam delete-policy --policy-arn arn:aws:iam::830881980142:policy/VeleroBackupPolicy
          purge_versions arn:aws:iam::830881980142:policy/s3-backup-kubernetes-policy
          del aws iam delete-policy --policy-arn arn:aws:iam::830881980142:policy/s3-backup-kubernetes-policy
          purge_versions arn:aws:iam::830881980142:policy/S3_stopthecastle
          del aws iam delete-policy --policy-arn arn:aws:iam::830881980142:policy/S3_stopthecastle

      - name: Tag manual
        if: github.event.inputs.mode == 'tag-manual'
        env:
          ITEMS: ${{ github.event.inputs.items }}
        run: |
          set -euo pipefail
          IFS=',' read -ra LIST <<< "$ITEMS"
          for item in "${LIST[@]}"; do
            kind="${item%%:*}"; name="${item#*:}"
            # conservative charset — reject anything shell-meaningful
            if ! [[ "$name" =~ ^[A-Za-z0-9+=,.@_./-]+$ ]]; then
              echo "REJECT invalid name: $name"; exit 1
            fi
            case "$kind" in
              policy) aws iam tag-policy --policy-arn "arn:aws:iam::830881980142:policy/${name}" \
                        --tags Key=ManagedBy,Value=manual && echo "tagged policy $name" ;;
              role)   aws iam tag-role --role-name "$name" \
                        --tags Key=ManagedBy,Value=manual && echo "tagged role $name" ;;
              # kms item format: kms:REGION/KEY-ID
              kms)    aws kms tag-resource --region "${name%%/*}" --key-id "${name#*/}" \
                        --tags TagKey=ManagedBy,TagValue=manual && echo "tagged kms $name" ;;
              *)      echo "REJECT unknown kind: $kind"; exit 1 ;;
            esac
          done
