name: Build cloudflare-ddns image

on:
  push:
    branches: [ "main" ]
    paths:
      - "platform/kubernetes/cloudflare-ddns/image/**"
      - ".github/workflows/cloudflare-ddns-image.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "platform/kubernetes/cloudflare-ddns/image/**"
      - ".github/workflows/cloudflare-ddns-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: platform/kubernetes/cloudflare-ddns/image
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/sparked-diamond/cloudflare-ddns:main
            ghcr.io/sparked-diamond/cloudflare-ddns:sha-${{ github.sha }}

      # The legacy "Make package public" step targeted
      # /orgs/sparked-diamond/... which 404s because sparked-diamond
      # is a USER, not an Org. For user-owned packages, the
      # GITHUB_TOKEN can't flip visibility — needs a PAT with
      # write:packages.
      #
      # First-time setup for any new package: visit
      # https://github.com/users/sparked-diamond/packages/container/cloudflare-ddns/settings
      # and set visibility to Public.
      # The CronJob pod's ImagePullBackOff is the symptom that this
      # step is needed.
      #
      # Belt-and-suspenders public-reachability check (no-op once the
      # first push is public — catches a regression on the first
      # build after a visibility flip back to private):
      - name: Verify image is publicly pullable
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          # Anonymous token request — only succeeds for public packages
          TOKEN=$(curl -fsS "https://ghcr.io/token?scope=repository:sparked-diamond/cloudflare-ddns:pull" | jq -r .token)
          if curl -fsS -H "Authorization: Bearer $TOKEN" \
               "https://ghcr.io/v2/sparked-diamond/cloudflare-ddns/manifests/main" \
               -o /dev/null; then
            echo "::notice::cloudflare-ddns:main is publicly pullable"
          else
            echo "::error::cloudflare-ddns:main NOT publicly pullable — flip visibility in package settings (see step comment above)"
            exit 1
          fi
