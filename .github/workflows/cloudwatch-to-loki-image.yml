name: Build cloudwatch-to-loki image

on:
  push:
    branches: [ "main" ]
    paths:
      - "platform/kubernetes/cloudwatch-to-loki/image/**"
      - ".github/workflows/cloudwatch-to-loki-image.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "platform/kubernetes/cloudwatch-to-loki/image/**"
      - ".github/workflows/cloudwatch-to-loki-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: platform/kubernetes/cloudwatch-to-loki/image
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/sparked-diamond/cloudwatch-to-loki:main
            ghcr.io/sparked-diamond/cloudwatch-to-loki:sha-${{ github.sha }}

      # First-time setup for a NEW package: GITHUB_TOKEN can't flip visibility on
      # a user-owned package, so the first build pushes a PRIVATE package and the
      # CronJob would ImagePullBackOff. One-time manual step:
      #   https://github.com/users/sparked-diamond/packages/container/cloudwatch-to-loki/settings
      #   -> set visibility to Public.
      # (Same gotcha documented in cloudflare-ddns-image.yml.)
      - name: Verify image is publicly pullable
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsS "https://ghcr.io/token?scope=repository:sparked-diamond/cloudwatch-to-loki:pull" | jq -r .token)
          if curl -fsS -H "Authorization: Bearer $TOKEN" \
               "https://ghcr.io/v2/sparked-diamond/cloudwatch-to-loki/manifests/main" \
               -o /dev/null; then
            echo "::notice::cloudwatch-to-loki:main is publicly pullable"
          else
            echo "::error::cloudwatch-to-loki:main NOT publicly pullable — flip visibility to Public in package settings (see step comment above)"
            exit 1
          fi
