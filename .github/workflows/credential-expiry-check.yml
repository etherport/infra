name: Credential expiry check

# 2026-07-03 sweep (gap #2): five credentials have HARD expiries with zero
# tracking — the M92 dispatch PAT + runner PAT (fine-grained, ≤1y) and the three
# 1y Cloudflare Access service tokens (alexa_skill, cue_healthkit,
# cue_health_probe). Expiry of the dispatch PAT breaks ALL Terraform operations
# (TF is CI-only, M82); token expiry silently kills Alexa→HA + HealthKit ingest.
# Weekly: read each expiry, push `credential_expiry_timestamp_seconds` to the
# in-cluster pushgateway; the CredentialExpirySoon rule alerts <30d, and an
# absent()-based staleness rule catches this job dying.

on:
  schedule:
    - cron: '20 9 * * 1'   # Mondays 09:20 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, lifecycle]
    steps:
      # Needed for the SOPS-sourced lookups below: without a checkout the
      # encrypted bundle is not on disk and `sops -d` fails (exit 128).
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Collect expiries + push metrics
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUSHGATEWAY: https://pushgateway.wind.etherport.net  # Traefik VIP .70; the runner carries a /32-via-.1 netplan route (VLAN-201 VIP gotcha)
        run: |
          set -euo pipefail
          METRICS=$(mktemp)
          echo '# TYPE credential_expiry_timestamp_seconds gauge' > "$METRICS"


          # --- GHCR pull token (read:packages) ---
          # Both remaining image-pull secrets share this ONE token: cue/ghcr-cue
          # (cue-api's pull) and flux-system/cue-ghcr (Flux's registry scan).
          # `cue` is the only etherport package still private -- aws-s3-sync,
          # cloudflare-ddns and cloudwatch-to-loki are public as of 2026-08-14 and
          # their ghcr-etherport secrets were deleted, so a lapse now breaks cue
          # image pulls + image automation rather than the whole cluster.
          # NB the token rotated in 2026-08-14 was minted with NO EXPIRY, so the
          # API returns no expiration header and this block records no metric --
          # absence of a series here means "non-expiring", not "healthy".
          # It cannot be replaced by the GitHub App: GHCR rejects App
          # installation tokens (403, tested), and classic PATs are always
          # user-owned -- so monitoring its expiry IS the mitigation.
          # See Phase 2e in docs/planning/github-org-migration-2026-08.md.
          # `|| true` is load-bearing: under `set -e` a failed decrypt here would
          # abort the WHOLE check and silently stop monitoring every other
          # credential too (hit exactly that on the first run).
          GHCR_TOK=$(sops -d infra/ansible/playbooks/secrets/homelab-ops.sops.yaml 2>/dev/null \
            | awk '/^ghcr_pull_token:/{print $2}' || true)
          if [ -n "${GHCR_TOK:-}" ]; then
            EXP=$(curl -s -D - -o /dev/null -H "Authorization: Bearer $GHCR_TOK" \
              https://api.github.com/rate_limit | grep -i '^github-authentication-token-expiration:' \
              | sed 's/^[^:]*: *//' | tr -d '\r')
            if [ -n "$EXP" ]; then
              TS=$(date -d "$EXP" +%s 2>/dev/null || echo "")
              [ -n "$TS" ] && echo "credential_expiry_timestamp_seconds{credential=\"ghcr_pull_token\"} $TS" >> "$METRICS"
            fi
          fi

          # --- Cloudflare Access service tokens (expires_at via API) ---
          if [ -n "${CF_TOKEN:-}" ] && [ -n "${CF_ACCOUNT_ID:-}" ]; then
            curl -s -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/access/service_tokens" \
            | python3 -c '
          import json,sys,datetime
          d=json.load(sys.stdin)
          for t in d.get("result") or []:
              exp=t.get("expires_at");  name=t.get("name","?").replace(" ","_")
              if exp:
                  ts=int(datetime.datetime.fromisoformat(exp.replace("Z","+00:00")).timestamp())
                  print(f"credential_expiry_timestamp_seconds{{credential=\"cf_token_{name}\"}} {ts}")' >> "$METRICS"
          fi

          echo "--- metrics ---"; cat "$METRICS"
          # freshness marker for the staleness alert
          echo "credential_expiry_check_last_run_timestamp_seconds $(date +%s)" >> "$METRICS"
          curl -s --data-binary @"$METRICS" "$PUSHGATEWAY/metrics/job/credential-expiry" && echo pushed
