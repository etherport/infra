name: Debug — print ANSIBLE_SSH_KEY pubkey

# One-off: derives and prints the public half of the ANSIBLE_SSH_KEY
# secret so we can add it to graham@pve's ~/.ssh/authorized_keys.
# Delete after the pubkey is captured.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  print:
    runs-on: [self-hosted, lifecycle]
    timeout-minutes: 2
    steps:
      - name: Derive pubkey from secret
        env:
          ANSIBLE_SSH_KEY: ${{ secrets.ANSIBLE_SSH_KEY }}
        run: |
          umask 077
          printf '%s\n' "$ANSIBLE_SSH_KEY" > /tmp/ansible_ed25519
          chmod 600 /tmp/ansible_ed25519
          echo "=== PUBKEY ==="
          ssh-keygen -y -f /tmp/ansible_ed25519
          echo "=== FINGERPRINT ==="
          ssh-keygen -lf /tmp/ansible_ed25519
          rm -f /tmp/ansible_ed25519
