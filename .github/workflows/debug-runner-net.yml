name: Debug gh-runner Network

# Ad-hoc diagnostic: prints network state from gh-runner's POV.
# Dispatch when gh-runner -> PVE SSH starts timing out (task #27 / #19 SDN
# migration after-effects). Delete after the root cause is committed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: [self-hosted, lifecycle]
    timeout-minutes: 5
    steps:
      - name: Setup ANSIBLE_SSH_KEY (same as ansible-proxmox.yml)
        env:
          ANSIBLE_SSH_KEY: ${{ secrets.ANSIBLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$ANSIBLE_SSH_KEY" > ~/.ssh/id_ed25519_ansible
          chmod 600 ~/.ssh/id_ed25519_ansible
          ssh-keyscan -H pve.wind.etherport.net >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "Key fingerprint:"; ssh-keygen -l -f ~/.ssh/id_ed25519_ansible 2>&1 | head -3
          echo "Key file size:"; wc -c ~/.ssh/id_ed25519_ansible

      - name: SSH with ANSIBLE_SSH_KEY (verbose)
        run: |
          set +e
          echo "## ssh -vvv graham@pve with -i ~/.ssh/id_ed25519_ansible"
          ssh -vvv -i ~/.ssh/id_ed25519_ansible -o IdentitiesOnly=yes \
              -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=no \
              -o PreferredAuthentications=publickey -o PubkeyAuthentication=yes \
              graham@pve.wind.etherport.net 'echo OK; hostname; whoami' 2>&1 | tail -40

      - name: Network state dump
        run: |
          set +e
          echo "## L2/L3"
          ip -4 -o addr show
          echo
          echo "## Routes"
          ip route
          echo
          echo "## Route to PVE mgmt (10.10.200.41)"
          ip route get 10.10.200.41
          echo
          echo "## DNS resolves for pve.wind.etherport.net"
          getent ahosts pve.wind.etherport.net | head -5
          dig +short +time=2 +tries=1 pve.wind.etherport.net @10.10.201.5
          dig +short +time=2 +tries=1 pve.wind.etherport.net @10.10.100.5
          echo
          echo "## Ping PVE (mgmt IP)"
          ping -c 3 -W 2 10.10.200.41 || true
          echo
          echo "## TCP/22 to PVE (mgmt IP)"
          nc -zvw 5 10.10.200.41 22 2>&1 || true
          echo
          echo "## TCP/22 to PVE (hostname)"
          nc -zvw 5 pve.wind.etherport.net 22 2>&1 || true
          echo
          echo "## TCP/8006 to PVE API"
          nc -zvw 5 10.10.200.41 8006 2>&1 || true
          echo
          echo "## Traceroute (UDP, may be slow)"
          traceroute -n -w 2 -q 1 -m 6 10.10.200.41 2>&1 || true
          echo
          echo "## ARP table"
          ip neigh show
          echo
          echo "## Repeated TCP/22 to PVE (10 trials, 2s timeout each)"
          for i in $(seq 1 10); do
            t0=$(date +%s%3N)
            out=$(nc -zvw 2 10.10.200.41 22 2>&1)
            rc=$?
            t1=$(date +%s%3N)
            printf "trial=%2d rc=%d elapsed=%4dms %s\n" "$i" "$rc" "$((t1-t0))" "$out"
          done
          echo
          echo "## Full SSH handshake test (ssh -vvv ... bash -c true, ConnectTimeout=15)"
          # No agent / no key — we only care whether the TCP+banner exchange completes.
          # Expect: 'Connection timed out' if blocked at L3/L4, 'Permission denied' if
          # banner exchanged + auth rejected (which is success for OUR diagnosis).
          ssh -vvv -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=no \
              -o PreferredAuthentications=none -o PubkeyAuthentication=no \
              graham@pve.wind.etherport.net true 2>&1 | tail -30 || true
