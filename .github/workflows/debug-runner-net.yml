name: Debug gh-runner Network
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: [self-hosted, lifecycle]
    timeout-minutes: 3
    steps:
      - name: Probe PVE
        run: |
          set +e
          echo "## L3 reachability"
          ping -c 3 -W 2 10.10.200.41 || true
          echo
          echo "## TCP/22 x5 trials"
          for i in 1 2 3 4 5; do
            t0=$(date +%s%3N)
            out=$(nc -zvw 3 10.10.200.41 22 2>&1)
            rc=$?
            t1=$(date +%s%3N)
            printf "trial=%d rc=%d elapsed=%dms %s\n" "$i" "$rc" "$((t1-t0))" "$out"
          done
          echo
          echo "## TCP/8006 (PVE API)"
          nc -zvw 3 10.10.200.41 8006 2>&1 || true
          echo
          echo "## Routing"
          ip route get 10.10.200.41
          echo
          echo "## ARP table for default gw"
          ip neigh show 10.10.201.1
          echo
          echo "## Local source IP"
          ip -4 -o addr show eth0
