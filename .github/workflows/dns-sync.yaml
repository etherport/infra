# DNS GitOps Sync Workflow
#
# Syncs DNS zone records from YAML files to Technitium DNS Server.
# Triggered on push to main branch when zone files change, or manually.
#
# Required secrets:
#   TECHNITIUM_URL: Base URL of Technitium DNS server
#   TECHNITIUM_USER: API username
#   TECHNITIUM_PASS: API password

name: DNS Sync

on:
  push:
    branches:
      - main
    paths:
      - 'platform/dns/zones/**'
      - 'platform/dns/scripts/**'
      - '.github/workflows/dns-sync.yaml'

  pull_request:
    branches:
      - main
    paths:
      - 'platform/dns/zones/**'
      - 'platform/dns/scripts/**'

  workflow_dispatch:
    inputs:
      zone:
        description: 'Zone to sync (leave empty for all zones)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (show changes without applying)'
        required: false
        type: boolean
        default: false

jobs:
  validate:
    name: Validate Zone Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate YAML syntax
        run: |
          echo "Validating zone files..."
          for file in platform/dns/zones/*.yaml; do
            echo "  Checking: $file"
            python -c "import yaml; yaml.safe_load(open('$file'))" || exit 1
          done
          echo "✅ All zone files are valid YAML"

      - name: Validate zone schema
        run: |
          python << 'EOF'
          import yaml
          import sys
          from pathlib import Path

          errors = []
          for zone_file in Path("platform/dns/zones").glob("*.yaml"):
              with open(zone_file) as f:
                  data = yaml.safe_load(f)

              if not data.get("zone"):
                  errors.append(f"{zone_file}: Missing 'zone' field")
                  continue

              for i, record in enumerate(data.get("records", [])):
                  if not record.get("name"):
                      errors.append(f"{zone_file}: Record {i} missing 'name'")
                  if not record.get("type"):
                      errors.append(f"{zone_file}: Record {i} missing 'type'")
                  if not record.get("value"):
                      errors.append(f"{zone_file}: Record {i} missing 'value'")
                  if record.get("type") not in ("A", "AAAA", "CNAME", "MX", "TXT", "SRV", "CAA", "NS", "PTR"):
                      errors.append(f"{zone_file}: Record {i} has invalid type '{record.get('type')}'")

          if errors:
              print("❌ Validation errors:")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)
          else:
              print("✅ All zone files pass schema validation")
          EOF

  diff:
    name: Show DNS Changes
    runs-on: self-hosted
    needs: validate
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Show changes (dry run)
        env:
          TECHNITIUM_URL: ${{ secrets.TECHNITIUM_URL }}
          TECHNITIUM_USER: ${{ secrets.TECHNITIUM_USER }}
          TECHNITIUM_PASS: ${{ secrets.TECHNITIUM_PASS }}
        run: |
          cd platform/dns
          for zone_file in zones/*.yaml; do
            zone=$(basename "$zone_file" .yaml)
            echo "=== Zone: $zone ==="
            python scripts/sync-dns.py --zone "$zone" --dry-run || true
            echo ""
          done

  sync:
    name: Sync DNS Records
    runs-on: self-hosted
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Determine sync mode
        id: mode
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            echo "mode=--dry-run" >> $GITHUB_OUTPUT
          else
            echo "mode=--apply" >> $GITHUB_OUTPUT
          fi

      - name: Sync DNS records
        env:
          TECHNITIUM_URL: ${{ secrets.TECHNITIUM_URL }}
          TECHNITIUM_USER: ${{ secrets.TECHNITIUM_USER }}
          TECHNITIUM_PASS: ${{ secrets.TECHNITIUM_PASS }}
        run: |
          cd platform/dns

          # Determine which zones to sync
          if [[ -n "${{ inputs.zone }}" ]]; then
            zones="${{ inputs.zone }}"
          else
            zones=$(ls zones/*.yaml | xargs -n1 basename | sed 's/.yaml$//')
          fi

          # Sync each zone
          for zone in $zones; do
            echo "========================================"
            echo "Syncing zone: $zone"
            echo "========================================"
            python scripts/sync-dns.py --zone "$zone" ${{ steps.mode.outputs.mode }}
            echo ""
          done

      - name: Summary
        if: always()
        run: |
          echo "## DNS Sync Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.mode.outputs.mode }}" == "--dry-run" ]]; then
            echo "🔍 **Dry run** - no changes were applied" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Applied** - changes synced to Technitium" >> $GITHUB_STEP_SUMMARY
          fi
