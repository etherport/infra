name: OIDC debug (print subject claim)

# TEMPORARY diagnostic (org migration, 2026-08-13). Every OIDC-using workflow
# began failing with "Not authorized to perform sts:AssumeRoleWithWebIdentity"
# right after the repos moved to the etherport org — even though the IAM trust
# policy demonstrably lists repo:etherport/infra:ref:refs/heads/main (verified
# directly against IAM with a static key). That means the `sub` GitHub actually
# presents no longer matches what we trust — most likely an org-level OIDC
# subject-claim customization inherited when the repo joined the org.
#
# Prints the token's PAYLOAD claims only — never the signature, never the raw
# token — so this is not a credential leak. DELETE once the trust is corrected.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the OIDC token and print its claims
        run: |
          set -euo pipefail
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          case $(( ${#PAYLOAD} % 4 )) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac
          echo "$PAYLOAD" | tr '_-' '/+' | base64 -d 2>/dev/null > /tmp/claims.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/claims.json'))
          print("=== OIDC claims that matter for the IAM trust ===")
          for k in ("iss", "aud", "sub", "repository", "repository_owner",
                    "ref", "event_name", "job_workflow_ref"):
              print(f"  {k} = {d.get(k)}")
          PY
