name: Packer Ubuntu Template

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - validate
          - build
  schedule:
    # Rebuild monthly on the 1st at 3am UTC (keep template updated)
    - cron: '0 3 1 * *'

permissions:
  contents: read

env:
  WORKING_DIR: infra/packer/ubuntu-cloud-init
  PKR_VAR_proxmox_token_id: ${{ secrets.PROXMOX_TOKEN_ID }}
  PKR_VAR_proxmox_token_secret: ${{ secrets.PROXMOX_TOKEN_SECRET }}
  PKR_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
  PKR_VAR_ssh_private_key_file: /home/runner/.ssh/id_ed25519
  # Force IPv4 - runner doesn't have IPv6 connectivity
  GODEBUG: netdns=go+only4

jobs:
  packer:
    name: Packer ${{ github.event.inputs.action || 'build' }}
    # Lifecycle runner (gh-runner VM, outside the K8s cluster) — required
    # so template rebuild works if the cluster is offline.
    runs-on: [self-hosted, lifecycle]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Packer
        uses: hashicorp/setup-packer@1aa358be5cf73883762b302a3a03abd66e75b232 # v3
        with:
          version: 1.12.0

      - name: Setup SSH key
        run: |
          mkdir -p /home/runner/.ssh
          echo "${{ secrets.ANSIBLE_SSH_KEY }}" > /home/runner/.ssh/id_ed25519
          chmod 600 /home/runner/.ssh/id_ed25519

      - name: Initialize Packer
        run: packer init .
        working-directory: ${{ env.WORKING_DIR }}

      - name: Validate template
        run: packer validate .
        working-directory: ${{ env.WORKING_DIR }}

      - name: Build template
        if: github.event.inputs.action == 'build' || github.event_name == 'schedule'
        run: packer build -force .
        working-directory: ${{ env.WORKING_DIR }}

      - name: Summary
        if: always()
        run: |
          echo "## Packer Ubuntu Template" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Action**: ${{ github.event.inputs.action || 'build' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Template**: ubuntu-2404-cloud-init (VM 9001, cloned from base 9000)" >> $GITHUB_STEP_SUMMARY
