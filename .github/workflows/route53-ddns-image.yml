name: Build route53-ddns image

on:
  push:
    branches: [ "main" ]
    paths:
      - "platform/kubernetes/route53-ddns/image/**"
      - ".github/workflows/route53-ddns-image.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "platform/kubernetes/route53-ddns/image/**"
      - ".github/workflows/route53-ddns-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: platform/kubernetes/route53-ddns/image
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/sparked-diamond/route53-ddns:main
            ghcr.io/sparked-diamond/route53-ddns:sha-${{ github.sha }}

      - name: Make package public
        if: github.event_name != 'pull_request'
        run: |
          curl -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/orgs/sparked-diamond/packages/container/route53-ddns \
            -d '{"visibility":"public"}'
