# Server-side secret scan (gitleaks). The pre-commit gitleaks hook only fires
# for contributors who run it locally — and the headless mini auto-pushes to
# main with no branch protection (L20). This gate runs on every PR + push so a
# plaintext secret can't reach main unscanned. Config + allowlist: .gitleaks.toml.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER=8.21.2
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | sudo tar xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan for secrets
        run: gitleaks detect --no-git --source . -c .gitleaks.toml --redact --no-banner
