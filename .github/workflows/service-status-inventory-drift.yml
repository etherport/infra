name: Service-status inventory drift check

# Weekly compare of the service-status inventory (the SERVICES list in
# platform/kubernetes/monitoring/service-status-report/services.py) against
# the live cluster. Opens / refreshes a GitHub Issue when entries in the
# inventory don't exist in the cluster (STALE) — those will render as
# DOWN/UNKNOWN forever in the dashboard + email until removed.
#
# Mirrors the pattern from terraform-drift-detection.yml. Runs on the
# self-hosted gh-runner so it can SSH to k8s-cp1 for a kubeconfig (the
# same pattern post-bootstrap.sh uses).

on:
  schedule:
    # Weekly on Mondays at 15:00 UTC (08:00 PT). Less hot than the daily
    # terraform drift because cluster workloads change less often than
    # AWS state.
    - cron: '0 15 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Compare inventory vs cluster
    runs-on: [self-hosted, lifecycle]
    timeout-minutes: 10
    outputs:
      stale: ${{ steps.check.outputs.stale }}
      report_b64: ${{ steps.check.outputs.report_b64 }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install kubectl + python3
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y python3 jq
          if ! command -v kubectl &>/dev/null; then
            curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
            rm /tmp/kubectl
          fi

      - name: Fetch kubeconfig from k8s-cp1
        env:
          ANSIBLE_SSH_KEY: ${{ secrets.ANSIBLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$ANSIBLE_SSH_KEY" > ~/.ssh/k8s_key
          chmod 600 ~/.ssh/k8s_key
          CP1_IP="${CP1_IP:-10.10.201.50}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              -i ~/.ssh/k8s_key ubuntu@"$CP1_IP" 'sudo cat /etc/kubernetes/admin.conf' \
              > /tmp/wind-kubeconfig
          sed -i "s|https://127.0.0.1:6443|https://${CP1_IP}:6443|g" /tmp/wind-kubeconfig
          chmod 600 /tmp/wind-kubeconfig

      - name: Run drift check
        id: check
        env:
          KUBECONFIG: /tmp/wind-kubeconfig
        run: |
          set +e
          python3 scripts/check-service-status-inventory.py --untracked > /tmp/report.txt 2>&1
          rc=$?
          set -e
          cat /tmp/report.txt | tee -a "$GITHUB_STEP_SUMMARY"
          # Encode report so multi-line text survives the outputs round-trip
          echo "report_b64=$(base64 -w0 < /tmp/report.txt)" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 1 ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cleanup kubeconfig + SSH key
        if: always()
        run: rm -f /tmp/wind-kubeconfig ~/.ssh/k8s_key

  report:
    name: Open / refresh drift issue
    needs: check
    if: needs.check.outputs.stale == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Open or update issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          REPORT_B64: ${{ needs.check.outputs.report_b64 }}
        with:
          script: |
            const report = Buffer.from(process.env.REPORT_B64, 'base64').toString('utf8');
            const title = 'Service-status inventory drift';
            const body = [
              '## Service-status inventory drift detected',
              '',
              'The `SERVICES` list at `platform/kubernetes/monitoring/service-status-report/services.py`',
              'references one or more workloads that no longer exist in the cluster. Until removed,',
              'they will render as **DOWN** or **UNKNOWN** in the Grafana dashboard + daily email.',
              '',
              '### Drift report',
              '```',
              report,
              '```',
              '',
              '### How to fix',
              '1. Edit `services.py` to remove the stale entry (or add the workload back to the cluster).',
              '2. Re-run `python3 platform/kubernetes/monitoring/service-status-report/gen-dashboard.py` to refresh the dashboard.',
              '3. Commit + push. Flux reconciles the ConfigMap; the next CronJob fire picks up the change.',
              '',
              '_Workflow: `.github/workflows/service-status-inventory-drift.yml`. Auto-refreshed weekly._',
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'inventory-drift',
              per_page: 1,
            });
            if (existing.length) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                title, body,
              });
              core.info(`Updated #${existing[0].number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title, body,
                labels: ['inventory-drift'],
              });
              core.info(`Opened #${created.data.number}`);
            }
