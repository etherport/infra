name: Tailscale Policy

# Push the tailnet policy file to Tailscale on every commit to main
# that touches it. Closes the IaC loop — git becomes the source of
# truth, the admin console becomes display-only.
#
# Auth (M152, 2026-07-28): mints a short-lived token from the
# `wind-policy-push` OAuth client (policy:write scope) — creds are
# SOPS-encrypted at infra/ansible/playbooks/secrets/
# tailscale-policy-push.sops.yaml, decrypted in-run with the SOPS_AGE_KEY
# GH secret. This replaced the 90-day-expiry TAILSCALE_API_KEY (which can
# now be deleted from repo secrets). The admin console policy editor is
# GitHub-synced (view-only) so this file is the source of truth.
#
# Tailnet ID for this tailnet: TwxNUjPekr11CNTRL. The API accepts
# `-` as a shortcut meaning "the tailnet of the API key being used",
# which is what we use here so the workflow doesn't need to know
# the specific ID.

on:
  push:
    branches: [main]
    paths:
      - 'infra/tailscale/policy.hujson'
      - '.github/workflows/tailscale-policy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/tailscale/policy.hujson'
      - '.github/workflows/tailscale-policy.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: HuJSON syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install hujson-cli (Tailscale's parser)
        run: |
          go install github.com/tailscale/hujson/cmd/hujsonfmt@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH
        # Falls back to a pure-jq check if go isn't available — jq
        # strict-mode rejects comments + trailing commas so we strip
        # them first as a poor man's HuJSON parser.

      - name: Validate policy.hujson parses
        run: |
          set -e
          if command -v hujsonfmt >/dev/null; then
            hujsonfmt infra/tailscale/policy.hujson > /dev/null
            echo "✓ HuJSON parses cleanly"
          else
            # Strip // comments + trailing commas, then jq -e
            sed -e 's://.*$::' -e 's/,\([[:space:]]*[}\]]\)/\1/g' \
              infra/tailscale/policy.hujson | jq -e . > /dev/null
            echo "✓ Policy passes pure-jq sanity check (hujsonfmt unavailable)"
          fi

  push:
    name: Push policy to Tailscale
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # M152 (2026-07-28): mint a short-lived token from the `wind-policy-push`
      # OAuth client (policy:write scope) instead of the 90-day-expiry
      # TAILSCALE_API_KEY. Creds live SOPS-encrypted in the repo
      # (infra/ansible/playbooks/secrets/tailscale-policy-push.sops.yaml),
      # decrypted here with the SOPS_AGE_KEY GH secret (same pattern as
      # terraform-drift-detection.yml). No standing token to rotate.
      - name: Install sops
        run: |
          TAG=$(curl -fsSL https://api.github.com/repos/getsops/sops/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          curl -fsSL -o /tmp/sops "https://github.com/getsops/sops/releases/download/${TAG}/sops-${TAG}.linux.amd64"
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops

      - name: POST policy to Tailscale API
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/sops/age
          printf '%s' "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt
          F=infra/ansible/playbooks/secrets/tailscale-policy-push.sops.yaml
          CID=$(sops -d "$F" | awk '/^ts_policy_client_id:/{print $2}')
          CSEC=$(sops -d "$F" | awk '/^ts_policy_client_secret:/{print $2}')
          rm -f ~/.config/sops/age/keys.txt
          TOK=$(curl -sS -d "client_id=$CID" -d "client_secret=$CSEC" \
            https://api.tailscale.com/api/v2/oauth/token \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          if [ -z "$TOK" ]; then
            echo "::error::Could not mint a Tailscale OAuth token from wind-policy-push (revoked/expired?)"
            exit 1
          fi

          HTTP=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $TOK" \
            -H "Content-Type: application/hujson" \
            --data-binary @infra/tailscale/policy.hujson \
            'https://api.tailscale.com/api/v2/tailnet/-/acl')

          echo "HTTP $HTTP"
          if [ "$HTTP" != "200" ]; then
            echo "::error::Tailscale API rejected the policy ($HTTP)"
            echo "--- Response ---"
            cat /tmp/resp.json
            exit 1
          fi

          echo "## Tailscale Policy Applied" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit**: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **HTTP**: $HTTP (success)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Policy is live on the tailnet within ~30s. Verify at" >> "$GITHUB_STEP_SUMMARY"
          echo "<https://login.tailscale.com/admin/acls/file>." >> "$GITHUB_STEP_SUMMARY"
