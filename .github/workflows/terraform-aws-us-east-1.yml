name: AWS US-East-1 Terraform

on:
  push:
    branches: [main]
    paths:
      - 'infra/terraform/aws-us-east-1/**'
      - '.github/workflows/terraform-aws-us-east-1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/terraform/aws-us-east-1/**'
      - '.github/workflows/terraform-aws-us-east-1.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  id-token: write   # H29 OIDC
  pull-requests: write

env:
  TF_VERSION: '1.14.3'
  AWS_REGION: us-east-1
  WORKING_DIR: infra/terraform/aws-us-east-1

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'plan' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6
        with:
          role-to-assume: arn:aws:iam::830881980142:role/gh-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Install SOPS
        uses: ./.github/actions/setup-sops

      - name: Configure SOPS age key
        run: |
          mkdir -p ~/.config/sops/age
          echo "${{ secrets.SOPS_AGE_KEY }}" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt

      - name: Terraform Init
        run: |
          terraform init -backend-config="profile=" -reconfigure

      - name: Terraform Plan (PR)
        if: github.event_name == 'pull_request'
        id: plan_pr
        run: |
          terraform plan -var="aws_profile=" -input=false -no-color -out=tfplan 2>&1 | tee plan_output.txt
          if [ $(wc -c < plan_output.txt) -gt 60000 ]; then
            head -c 30000 plan_output.txt > plan_truncated.txt
            echo -e "\n\n... (truncated) ...\n\n" >> plan_truncated.txt
            tail -c 30000 plan_output.txt >> plan_truncated.txt
            mv plan_truncated.txt plan_output.txt
          fi
        continue-on-error: true

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.WORKING_DIR }}/plan_output.txt', 'utf8');
            const outcome = '${{ steps.plan_pr.outcome }}';

            const body = `## AWS US-East-1 Terraform Plan

            **Result:** ${outcome === 'success' ? '✅ Success' : '❌ Failed'}

            <details>
            <summary>Show Plan Output</summary>

            \`\`\`hcl
            ${plan}
            \`\`\`

            </details>

            *Triggered by @${{ github.actor }} on \`${{ github.event.pull_request.head.ref }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Terraform Plan (Push)
        if: github.event_name == 'push'
        run: |
          echo "## AWS US-East-1 Changes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          terraform plan -var="aws_profile=" -input=false -no-color 2>&1 | head -100 >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*Run workflow manually with 'apply' action to deploy changes.*" >> $GITHUB_STEP_SUMMARY

      - name: Terraform Plan (Manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan'
        run: |
          terraform plan -var="aws_profile=" -input=false -no-color

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        run: |
          terraform apply -auto-approve -input=false -var="aws_profile="

      # M110 Phase 6 — full decommission of the us-east-1 spoke (VPC + peering +
      # hub route + t4g.nano vpn + EIP 35.169.37.16). No prevent_destroy in this
      # stack. Prints the destroy plan, then tears it down. After a green run the
      # state is empty and this whole stack dir + workflow are deleted from git.
      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: |
          terraform plan -destroy -var="aws_profile=" -input=false -no-color
          terraform destroy -auto-approve -input=false -var="aws_profile="

      - name: Summary
        if: always()
        run: |
          echo "## AWS US-East-1 Terraform Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Action**: ${{ github.event.inputs.action || 'plan' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Actor**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
