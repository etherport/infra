name: Cloudflare Terraform

on:
  # pull_request trigger REMOVED 2026-07-01 (H43): this workflow runs on the
  # in-network self-hosted runner; `terraform plan` executes PR-authored code
  # (module/provider fetch, data "external"), so PR-triggered runs were a
  # code-exec path onto the runner. This stack had no push trigger; plans run
  # via workflow_dispatch + the daily terraform-drift-detection sweep.
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
          - import-zone   # one-time: imports the manually-created etherport.net CF zone into TF state

# M112 (2026-07-01): one run per stack at a time. A dispatch apply racing a
# push-triggered plan on the same stack contends the S3 state lock (bit twice
# on 2026-07-01 — a killed run also left a stale .tflock for 2 weeks).
# cancel-in-progress stays false: never kill a mid-flight apply.
concurrency:
  group: tf-cloudflare
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # H29 OIDC
  pull-requests: write

env:
  WORKING_DIR: infra/terraform/cloudflare

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'plan' }}
    runs-on: [self-hosted, lifecycle]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure AWS credentials (for Route53 + S3 backend)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::830881980142:role/gh-actions-terraform

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.14.3
          # Self-hosted runner doesn't have Node; the wrapper requires it.
          # Matches the pattern in terraform-unifi.yml / other working workflows.
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        env:
          # Backend uses the S3 bucket — credentials via configure-aws-credentials above.
          # Strip the explicit profile from the backend so it falls through to env vars.
          AWS_PROFILE: ""
        run: |
          # Persistent provider cache on the self-hosted runner ($HOME survives across
          # runs; the workspace .terraform/ is wiped by checkout). Once a provider is
          # downloaded it's reused → immune to registry.terraform.io slowness. Plus a
          # retry loop for the first download / a transient registry blip (2026-06-25:
          # the cloudflare v5 provider metadata went ~20s TTFB registry-side and tripped
          # terraform's init timeout, failing this apply).
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          n=0
          until terraform init -backend-config="profile=" -reconfigure; do
            n=$((n+1))
            [ "$n" -ge 5 ] && { echo "::error::terraform init failed after $n attempts"; exit 1; }
            echo "init attempt $n failed (transient provider download?); retrying in $((n*15))s..."
            sleep $((n*15))
          done

      - name: Terraform Plan
        if: github.event.inputs.action != 'apply'
        working-directory: ${{ env.WORKING_DIR }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          AWS_PROFILE: ""
        # parallelism=2 to stay under CF API rate limits (default 10 trips
        # the limit during refresh of ~30 records across multiple zones).
        run: terraform plan -var "aws_profile=" -no-color -parallelism=2

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        working-directory: ${{ env.WORKING_DIR }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          AWS_PROFILE: ""
        run: terraform apply -auto-approve -var "aws_profile=" -no-color -parallelism=2

      # One-time bootstrap step: import the manually-created CF zone into
      # TF state. Skips silently if already imported (resource exists in state).
      - name: Terraform Import Zone (one-time)
        if: github.event.inputs.action == 'import-zone'
        working-directory: ${{ env.WORKING_DIR }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          AWS_PROFILE: ""
        run: |
          if terraform state list 2>/dev/null | grep -q '^cloudflare_zone\.etherport$'; then
            echo "✓ cloudflare_zone.etherport already in state — nothing to import"
            terraform state show cloudflare_zone.etherport | head -10
          else
            echo "Importing cloudflare_zone.etherport ${TF_VAR_cloudflare_zone_id}..."
            terraform import \
              -var "aws_profile=" \
              cloudflare_zone.etherport "${TF_VAR_cloudflare_zone_id}"
            echo "✓ import complete"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## Cloudflare Terraform run"
            echo
            echo "- Action: \`${{ github.event.inputs.action || 'plan (PR)' }}\`"
            echo
            if [ "${{ github.event.inputs.action }}" = "apply" ]; then
              echo "Next steps:"
              echo "1. Retrieve tunnel token: \`cd ${{ env.WORKING_DIR }} && terraform output -raw tunnel_token | pbcopy\`"
              echo "2. \`sops platform/kubernetes/cloudflared/01-tunnel-token.sops.yaml\` → paste."
              echo "3. Commit + push; Flux reconciles cloudflared Deployment within ~1min."
              echo "4. Verify: \`kubectl get pods -n cloudflared\` shows 2/2 Running, \`kubectl logs\` shows 'Connection registered'."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
