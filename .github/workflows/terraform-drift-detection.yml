name: Terraform Drift Detection

# Daily scheduled `terraform plan -detailed-exitcode` across ALL persistent TF
# stacks (24). Manual dispatch supported.
#
# Two plan jobs feed one report:
#   - `plan`          AWS modules on ubuntu-latest (OIDC). incl. ai-advisor-iam,
#                     twilio-webhook, github-oidc, cluster-irsa, roles-anywhere.
#   - `plan-internal` cloudflare / unifi / proxmox ×4 / google (GCP WIF) / twilio
#                     on the self-hosted lifecycle runner (cluster-internal reach
#                     + their GH-secret creds).
#
# NOTIFICATION (no console-watching needed): on drift the `report` job opens/
# refreshes a `tf-drift` GitHub Issue with the offending stacks AND calls
# core.setFailed → the scheduled run goes RED → GitHub emails the failed run to
# the repo owner. Clean runs stay green/silent.
#
# Corrections are applied via each stack's own workflow_dispatch `apply` (OIDC),
# never from a workstation. Excluded: aws-regional-vpn (deploy-on-demand, no
# persistent state); aws/iam-policies (JSON policy docs, not a TF stack).

on:
  schedule:
    # Daily at 14:00 UTC (07:00 PT / 10:00 ET) — outside CI maintenance
    # windows but during waking hours so a fired issue is seen quickly.
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write   # H29 OIDC

env:
  TF_VERSION: '1.14.3'
  TF_IN_AUTOMATION: 'true'

jobs:
  plan:
    name: ${{ matrix.module.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - { name: s3,                  dir: infra/terraform/aws/s3,                   region: us-west-2 }
          - { name: networking,          dir: infra/terraform/aws/networking,           region: us-west-2 }
          - { name: compute,             dir: infra/terraform/aws/compute,              region: us-west-2 }
          - { name: acm,                 dir: infra/terraform/aws/acm,                  region: us-west-2 }
          - { name: ses,                 dir: infra/terraform/aws/ses,                  region: us-west-2 }
          - { name: ddns-lambda,         dir: infra/terraform/aws/ddns-lambda,          region: us-west-2 }
          - { name: dns-restrict-ip,     dir: infra/terraform/aws/dns-restrict-ip,      region: us-west-2 }
          - { name: email-forward,       dir: infra/terraform/aws/email-forward,        region: us-west-2 }
          - { name: external-monitoring, dir: infra/terraform/aws/external-monitoring,  region: us-west-2 }
          - { name: homeassistant-alexa, dir: infra/terraform/aws/homeassistant-alexa,  region: us-east-1, needs_sops: false }
          - { name: aws-us-east-1,       dir: infra/terraform/aws-us-east-1,            region: us-east-1, needs_sops: true  }
          - { name: ai-advisor-iam,      dir: infra/terraform/aws/ai-advisor-iam,       region: us-west-2 }
          - { name: twilio-webhook,      dir: infra/terraform/aws/twilio-webhook,       region: us-west-2 }
          - { name: github-oidc,         dir: infra/terraform/aws/github-oidc,          region: us-west-2 }
          - { name: cluster-irsa,        dir: infra/terraform/aws/cluster-irsa,         region: us-west-2 }
          - { name: roles-anywhere,      dir: infra/terraform/aws/roles-anywhere,       region: us-west-2 }
          # aws-regional-vpn is deploy-on-demand (travel VPN); requires
          # `-var=region=X -var=region_short=Y -var=wg0_tunnel_ip=Z` and has no
          # persistent state to drift-check. Exclude.
    defaults:
      run:
        working-directory: ${{ matrix.module.dir }}
    outputs:
      drifted: ${{ steps.plan.outputs.drifted }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6
        with:
          role-to-assume: arn:aws:iam::830881980142:role/gh-actions-terraform
          aws-region: ${{ matrix.module.region }}

      - name: Per-module env (TF_VAR_*)
        run: |
          {
            [ -n "${{ secrets.ALERT_EMAIL }}" ]    && echo "TF_VAR_alert_email=${{ secrets.ALERT_EMAIL }}"
            [ -n "${{ secrets.HA_ACCESS_TOKEN }}" ] && echo "TF_VAR_ha_access_token=${{ secrets.HA_ACCESS_TOKEN }}"
          } >> "$GITHUB_ENV"

      - name: Install SOPS (only when needed)
        if: matrix.module.needs_sops
        uses: ./.github/actions/setup-sops

      - name: Configure SOPS age key (only when needed)
        if: matrix.module.needs_sops
        run: |
          mkdir -p ~/.config/sops/age
          echo "${{ secrets.SOPS_AGE_KEY }}" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt

      - name: terraform init
        run: terraform init -backend-config="profile=" -reconfigure -input=false

      - name: terraform plan -detailed-exitcode
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -lock=false -detailed-exitcode \
            $( grep -qs '"aws_profile"' *.tf && echo '-var=aws_profile=' ) \
            > plan.txt 2>&1
          rc=$?
          set -e
          # detailed-exitcode: 0 = no changes, 1 = error, 2 = changes
          echo "rc=$rc"
          {
            echo "## ${{ matrix.module.name }} (rc=$rc)"
            echo
            echo '```'
            tail -c 8000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case "$rc" in
            0) echo "drifted=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "drifted=error" >> "$GITHUB_OUTPUT"; exit 1 ;;
            2) echo "drifted=true"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Upload plan artifact
        if: steps.plan.outputs.drifted == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plan-${{ matrix.module.name }}
          path: ${{ matrix.module.dir }}/plan.txt
          retention-days: 14

  # Non-AWS stacks (cloudflare / unifi / proxmox) on the self-hosted lifecycle
  # runner — needs cluster-internal reach (PVE/UDM APIs) + their GH-secret creds.
  # (Previously excluded pending self-hosted runner stability; now proven by the
  # per-stack apply workflows.) Feeds the same `report` job via plan-* artifacts.
  plan-internal:
    name: ${{ matrix.module.name }}
    runs-on: [self-hosted, lifecycle]
    strategy:
      fail-fast: false
      matrix:
        module:
          - { name: cloudflare,             dir: infra/terraform/cloudflare }
          - { name: unifi,                  dir: infra/terraform/unifi }
          - { name: proxmox-firewall,       dir: infra/terraform/proxmox/firewall }
          - { name: proxmox-sdn,            dir: infra/terraform/proxmox/sdn }
          - { name: proxmox-standalone-vms, dir: infra/terraform/proxmox/standalone-vms }
          - { name: proxmox-k8s-vms,        dir: infra/terraform/proxmox/k8s-vms }
          - { name: google,                 dir: infra/terraform/google, gcp: true }
          - { name: twilio,                 dir: infra/terraform/twilio }
    defaults:
      run:
        working-directory: ${{ matrix.module.dir }}
    env:
      # Superset of creds; each stack uses only what it needs (the rest are
      # harmless unused env). Same GH secrets the per-stack workflows use.
      TF_VAR_proxmox_token_id: ${{ secrets.PROXMOX_TOKEN_ID }}
      TF_VAR_proxmox_token_secret: ${{ secrets.PROXMOX_TOKEN_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TF_VAR_unifi_username: ${{ secrets.UNIFI_USERNAME }}
      TF_VAR_unifi_password: ${{ secrets.UNIFI_PASSWORD }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_API_KEY: ${{ secrets.TWILIO_API_KEY }}
      TWILIO_API_SECRET: ${{ secrets.TWILIO_API_SECRET }}
      TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # unzip MUST be installed BEFORE setup-terraform — the self-hosted lifecycle
      # runner lacks it, and setup-terraform needs it to extract the binary (else
      # `terraform` is missing → init exits 127). Order matches the per-stack
      # self-hosted workflows.
      - name: Install unzip
        run: |
          if ! command -v unzip >/dev/null; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y unzip
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (S3 backend)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6
        with:
          role-to-assume: arn:aws:iam::830881980142:role/gh-actions-terraform
          aws-region: us-west-2

      # google stack only — GCP provider auth via WIF (S3 backend still uses the
      # AWS creds above). Mirrors terraform-google.yml.
      - name: Configure GCP credentials (WIF)
        if: matrix.module.gcp
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/909531984469/locations/global/workloadIdentityPools/github/providers/github
          service_account: gh-actions-terraform@homelab-infra-497414.iam.gserviceaccount.com

      - name: terraform init
        run: terraform init -backend-config="profile=" -reconfigure -input=false

      - name: terraform plan -detailed-exitcode
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -lock=false -detailed-exitcode \
            $( grep -qs '"aws_profile"' *.tf && echo '-var=aws_profile=' ) \
            > plan.txt 2>&1
          rc=$?
          set -e
          echo "rc=$rc"
          {
            echo "## ${{ matrix.module.name }} (rc=$rc)"
            echo
            echo '```'
            tail -c 8000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case "$rc" in
            0) echo "drifted=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "drifted=error" >> "$GITHUB_OUTPUT"; exit 1 ;;
            2) echo "drifted=true"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Upload plan artifact
        if: steps.plan.outputs.drifted == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plan-${{ matrix.module.name }}
          path: ${{ matrix.module.dir }}/plan.txt
          retention-days: 14

  report:
    name: Report drift
    needs: [plan, plan-internal]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: plan-*
        continue-on-error: true

      - name: Compose drift summary
        id: compose
        run: |
          set +e
          drifted=$(ls artifacts 2>/dev/null | sed 's/^plan-//' | sort | paste -sd, -)
          echo "drifted=$drifted" >> "$GITHUB_OUTPUT"
          if [ -z "$drifted" ]; then
            echo "No drift detected." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "# Drift detected"
            echo
            echo "Modules with non-zero plan: \`$drifted\`"
            echo
            for d in artifacts/plan-*; do
              [ -d "$d" ] || continue
              name=$(basename "$d" | sed 's/^plan-//')
              echo "## $name"
              echo
              echo '<details><summary>Plan output</summary>'
              echo
              echo '```'
              tail -c 6000 "$d/plan.txt"
              echo '```'
              echo
              echo '</details>'
            done
          } > drift.md
          cat drift.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open / refresh drift issue
        if: steps.compose.outputs.drifted != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('drift.md', 'utf8');
            const title = `Terraform drift: ${{ steps.compose.outputs.drifted }}`;
            // Find existing open drift issue (label `tf-drift`)
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'tf-drift',
              per_page: 1,
            });
            if (existing.length) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                title,
                body,
              });
              core.info(`Updated issue #${existing[0].number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['tf-drift'],
              });
              core.info(`Opened issue #${created.data.number}`);
            }
            // Fail the run so GitHub emails the scheduled-workflow failure to the
            // repo owner — drift is surfaced by EMAIL (+ the tf-drift issue),
            // no need to watch the Actions console. Clean runs stay green.
            core.setFailed(`Terraform drift detected: ${{ steps.compose.outputs.drifted }}`);

      - name: Close resolved drift issue (clean run)
        if: steps.compose.outputs.drifted == ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            // A clean run means no stack drifted -> close any lingering tf-drift
            // issue so resolved drift doesn't linger as stale noise (eroding trust
            // in the signal). Without this the workflow only ever OPENS/updates.
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'tf-drift',
              per_page: 20,
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '✅ Resolved — a clean drift run (0 stacks drifted) completed; auto-closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
              core.info(`Closed resolved drift issue #${issue.number}`);
            }
