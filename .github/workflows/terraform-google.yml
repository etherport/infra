name: Google Cloud Terraform

on:
  # pull_request trigger REMOVED 2026-07-01 (H43): this workflow runs on the
  # in-network self-hosted runner; `terraform plan` executes PR-authored code
  # (module/provider fetch, data "external"), so PR-triggered runs were a
  # code-exec path onto the runner. This stack had no push trigger; plans run
  # via workflow_dispatch + the daily terraform-drift-detection sweep.
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply

# M112 (2026-07-01): one run per stack at a time. A dispatch apply racing a
# push-triggered plan on the same stack contends the S3 state lock (bit twice
# on 2026-07-01 — a killed run also left a stale .tflock for 2 weeks).
# cancel-in-progress stays false: never kill a mid-flight apply.
concurrency:
  group: tf-google
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # H29 OIDC
  pull-requests: write

env:
  WORKING_DIR: infra/terraform/google

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'plan' }}
    runs-on: [self-hosted, lifecycle]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure AWS credentials (S3 backend)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::830881980142:role/gh-actions-terraform

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.14.3
          # Self-hosted runner doesn't have Node; the wrapper requires it.
          terraform_wrapper: false

      - name: Auth to GCP (Workload Identity Federation)
        # L21: GitHub OIDC -> GCP WIF — short-lived creds, no static key
        # (mirrors H29 for AWS). The action writes a credential file and
        # exports GOOGLE_APPLICATION_CREDENTIALS, which the google terraform
        # provider (ADC) picks up. Trust is scoped to this repo via the WIF
        # provider's attribute condition. SA gh-actions-terraform has
        # serviceUsageAdmin + projectIamAdmin + viewer on both projects.
        # See docs/planning/gcp-oidc-wif-l21.md.
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/909531984469/locations/global/workloadIdentityPools/github/providers/github
          service_account: gh-actions-terraform@homelab-infra-497414.iam.gserviceaccount.com

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        env:
          AWS_PROFILE: ""
        run: |
          terraform init \
            -backend-config="profile=" \
            -reconfigure

      - name: Terraform Plan
        if: github.event.inputs.action != 'apply'
        working-directory: ${{ env.WORKING_DIR }}
        env:
          AWS_PROFILE: ""
          TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
        run: terraform plan -no-color

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        working-directory: ${{ env.WORKING_DIR }}
        env:
          AWS_PROFILE: ""
          TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
        run: terraform apply -auto-approve -no-color

      - name: Summary
        if: always()
        run: |
          {
            echo "## Google Cloud Terraform run"
            echo
            echo "- Action: \`${{ github.event.inputs.action || 'plan (PR)' }}\`"
            echo
            echo "Scope: project + API enablements. OAuth consent screen + OAuth Client IDs remain manual"
            echo "(Google API doesn't expose them programmatically) — see infra/terraform/google/README.md."
          } >> "$GITHUB_STEP_SUMMARY"
