name: Proxmox Firewall Terraform

# Closes the last CI gap for the M82 "TF via CI, no standing creds on devbox" model.
# The PVE HOST firewall (H37) — three required allows: mgmt (22/3128/8006), Ceph storage
# VLAN → mon/OSD, IPMI :9290. See CLAUDE.md §5 + infra/terraform/proxmox/firewall/.
#
# ⚠️ This module configures the hypervisor's OWN host firewall. The lifecycle runner
# reaches PVE via the API (pve.wind.etherport.net:8006); `mgmt_admin_cidrs` MUST keep the
# runner's source path open or an apply can cut CI's PVE access. Review the plan (it should
# be 0-diff or exactly your change) before apply, same as any firewall change.

on:
  push:
    branches: [main]
    paths:
      - 'infra/terraform/proxmox/firewall/**'
      - '.github/workflows/terraform-proxmox-firewall.yml'
  # pull_request trigger REMOVED 2026-07-01 (H43): this workflow runs on the
  # in-network self-hosted runner; `terraform plan` executes PR-authored code
  # (module/provider fetch, data "external"), so PR-triggered runs were a
  # code-exec path onto the runner. Plans still run on push-to-main + dispatch.
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - plan
          - apply

# M112 (2026-07-01): one run per stack at a time. A dispatch apply racing a
# push-triggered plan on the same stack contends the S3 state lock (bit twice
# on 2026-07-01 — a killed run also left a stale .tflock for 2 weeks).
# cancel-in-progress stays false: never kill a mid-flight apply.
concurrency:
  group: tf-proxmox-firewall
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # H29 OIDC (S3 backend)
  pull-requests: write

env:
  WORKING_DIR: infra/terraform/proxmox/firewall

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'plan' }}
    runs-on: [self-hosted, lifecycle]
    env:
      AWS_DEFAULT_REGION: us-west-2
      TF_VAR_proxmox_token_id: ${{ secrets.PROXMOX_TOKEN_ID }}
      TF_VAR_proxmox_token_secret: ${{ secrets.PROXMOX_TOKEN_SECRET }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6
        with:
          role-to-assume: arn:aws:iam::830881980142:role/gh-actions-terraform
          aws-region: us-west-2

      - name: Install unzip
        run: |
          if ! command -v unzip >/dev/null; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y unzip
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.5   # state written by 1.15.5 (devbox) — do NOT downgrade
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -backend-config="profile=" -reconfigure

      - name: Terraform Plan
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'plan'
        run: terraform plan -input=false -no-color -var 'aws_profile='

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve -input=false -var 'aws_profile='
