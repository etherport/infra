name: Proxmox K8s VMs Terraform

on:
  push:
    branches: [main]
    paths:
      - 'infra/terraform/proxmox/k8s-vms/**'
      - '.github/workflows/terraform-proxmox-k8s-vms.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/terraform/proxmox/k8s-vms/**'
      - '.github/workflows/terraform-proxmox-k8s-vms.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: '1.14.3'
  WORKING_DIR: infra/terraform/proxmox/k8s-vms

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'plan' }}
    runs-on: homelab-runner
    container:
      image: hashicorp/terraform:${{ env.TF_VERSION }}
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-west-2
        TF_VAR_proxmox_token_id: ${{ secrets.PROXMOX_TOKEN_ID }}
        TF_VAR_proxmox_token_secret: ${{ secrets.PROXMOX_TOKEN_SECRET }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Install git
        run: apk add --no-cache git
        working-directory: /

      - name: Checkout
        run: |
          git clone --depth 1 --branch ${{ github.ref_name }} https://github.com/${{ github.repository }}.git .
        working-directory: ${{ github.workspace }}

      - name: Terraform Init
        run: terraform init -backend-config="profile=" -reconfigure

      - name: Terraform Plan
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'plan'
        run: terraform plan -input=false -no-color

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve -input=false
