name: Proxmox K8s VMs Terraform

on:
  push:
    branches: [main]
    paths:
      - 'infra/terraform/proxmox/k8s-vms/**'
      - '.github/workflows/terraform-proxmox-k8s-vms.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/terraform/proxmox/k8s-vms/**'
      - '.github/workflows/terraform-proxmox-k8s-vms.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - plan
          - apply
          - refresh-only
          - state-rebuild
      target:
        description: 'Optional -target resource (e.g. proxmox_virtual_environment_vm.workers["k8s-w4"]). Leave blank to apply all.'
        required: false
        type: string
        default: ''
      import_id:
        description: 'Required only for state-rebuild action. Import ID for the target resource (bpg/proxmox VM: <node>/<vm_id>, e.g. pve/102).'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: write

env:
  WORKING_DIR: infra/terraform/proxmox/k8s-vms

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'plan' }}
    # Lifecycle runner (gh-runner VM, outside the K8s cluster) — required
    # so VM lifecycle TF works if the cluster is offline.
    # No `container:` block: the gh-runner VM doesn't have Docker. Install
    # terraform on the runner directly via hashicorp/setup-terraform.
    runs-on: [self-hosted, lifecycle]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-west-2
      TF_VAR_proxmox_token_id: ${{ secrets.PROXMOX_TOKEN_ID }}
      TF_VAR_proxmox_token_secret: ${{ secrets.PROXMOX_TOKEN_SECRET }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # hashicorp/setup-terraform downloads + unzips the binary;
      # the standalone gh-runner VM doesn't have unzip by default.
      - name: Install unzip
        run: |
          if ! command -v unzip >/dev/null; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y unzip
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -backend-config="profile=" -reconfigure

      - name: Terraform Plan
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'plan'
        env:
          TARGET: ${{ github.event.inputs.target }}
        run: |
          if [ -n "$TARGET" ]; then
            terraform plan -input=false -no-color -target="$TARGET"
          else
            terraform plan -input=false -no-color
          fi

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        env:
          TARGET: ${{ github.event.inputs.target }}
        run: |
          if [ -n "$TARGET" ]; then
            echo "Applying with -target=$TARGET"
            terraform apply -auto-approve -input=false -target="$TARGET"
          else
            terraform apply -auto-approve -input=false
          fi

      # `apply -refresh-only` commits drift it finds during refresh into the
      # state file WITHOUT changing any remote infra. Use this when state and
      # the real PVE infra have drifted (e.g. a prior apply committed state
      # without finishing the PVE mutation, and provider refresh has stopped
      # detecting the drift). After a successful refresh-only, run a normal
      # `plan` — it should now show the real drift, and `apply` will reconcile.
      - name: Terraform Apply Refresh-Only
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'refresh-only'
        env:
          TARGET: ${{ github.event.inputs.target }}
        run: |
          if [ -n "$TARGET" ]; then
            echo "Refresh-only with -target=$TARGET"
            terraform apply -refresh-only -auto-approve -input=false -target="$TARGET"
          else
            terraform apply -refresh-only -auto-approve -input=false
          fi

      # `state-rebuild` action: state rm + import for a single target. Use
      # when refresh-only fails to detect drift (e.g., bpg/proxmox provider
      # not detecting missing array elements). state rm removes the resource
      # from state (doesn't touch PVE). import reads from PVE and rebuilds
      # state. After this, a normal plan should show real drift, and apply
      # will reconcile.
      #
      # Required inputs:
      #   target    — resource address (e.g. proxmox_virtual_environment_vm.control_planes["k8s-cp3"])
      #   import_id — import ID (e.g. pve/102 for bpg/proxmox VM)
      - name: Terraform State Rebuild
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'state-rebuild'
        env:
          TARGET: ${{ github.event.inputs.target }}
          IMPORT_ID: ${{ github.event.inputs.import_id }}
        run: |
          if [ -z "$TARGET" ] || [ -z "$IMPORT_ID" ]; then
            echo "ERROR: state-rebuild requires both target and import_id inputs"
            exit 1
          fi
          # NOTE: $TARGET contains [] and " (e.g. workers["k8s-w4"]). Wrap in
          # outer single quotes via heredoc/array so the shell doesn't word-
          # split them. Pass through xargs -0 with explicit null delimiter to
          # guarantee args.
          echo "Removing target from state: $TARGET"
          printf '%s\0' state rm -- "$TARGET" | xargs -0 terraform || echo "(not in state, continuing)"
          echo "Re-importing target from PVE (import_id=$IMPORT_ID)..."
          printf '%s\0' import -input=false -- "$TARGET" "$IMPORT_ID" | xargs -0 terraform
          echo "--- Post-import plan ---"
          printf '%s\0' plan -input=false -no-color -target="$TARGET" | xargs -0 terraform
