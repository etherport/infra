name: Proxmox Standalone VMs Terraform

on:
  push:
    branches: [main]
    paths:
      - 'infra/terraform/proxmox/standalone-vms/**'
      - '.github/workflows/terraform-proxmox-standalone-vms.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/terraform/proxmox/standalone-vms/**'
      - '.github/workflows/terraform-proxmox-standalone-vms.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write   # H29 OIDC
  pull-requests: write

env:
  WORKING_DIR: infra/terraform/proxmox/standalone-vms

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'plan' }}
    # Lifecycle runner (gh-runner VM, outside the K8s cluster) — required
    # so VM lifecycle TF works if the cluster is offline.
    # No `container:` block: the gh-runner VM doesn't have Docker. Install
    # terraform on the runner directly via hashicorp/setup-terraform.
    runs-on: [self-hosted, lifecycle]
    env:
      AWS_DEFAULT_REGION: us-west-2
      TF_VAR_proxmox_token_id: ${{ secrets.PROXMOX_TOKEN_ID }}
      TF_VAR_proxmox_token_secret: ${{ secrets.PROXMOX_TOKEN_SECRET }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6
        with:
          role-to-assume: arn:aws:iam::830881980142:role/gh-actions-terraform
          aws-region: us-west-2


      # hashicorp/setup-terraform downloads + unzips the binary;
      # the standalone gh-runner VM doesn't have unzip by default.
      - name: Install unzip
        run: |
          if ! command -v unzip >/dev/null; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y unzip
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -backend-config="profile=" -reconfigure

      - name: Terraform Plan
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'plan'
        run: terraform plan -input=false -no-color

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve -input=false
