name: Regional VPN Terraform

on:
  push:
    branches: [main]
    paths:
      - 'infra/terraform/aws-regional-vpn/**'
      - '.github/workflows/terraform-regional-vpn.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/terraform/aws-regional-vpn/**'
      - '.github/workflows/terraform-regional-vpn.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
      workspace:
        description: 'Terraform workspace (region name, e.g., mumbai, bahrain)'
        required: true
        type: string
        default: 'default'
      region:
        description: 'AWS region (e.g., ap-south-1, me-south-1)'
        required: true
        type: string
      region_short:
        description: 'Short name for region (e.g., mumbai, bahrain)'
        required: true
        type: string
      vpc_cidr:
        description: 'VPC CIDR (e.g., 10.10.112.0/24)'
        required: true
        type: string
      tunnel_ip:
        description: 'WireGuard tunnel IP (e.g., 10.255.255.3)'
        required: true
        type: string
        default: '10.255.255.3'

permissions:
  contents: write
  pull-requests: write
  id-token: write   # H29 OIDC

env:
  TF_VERSION: '1.14.3'
  AWS_REGION: us-west-2
  WORKING_DIR: infra/terraform/aws-regional-vpn

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'plan' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::830881980142:role/gh-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Install SOPS
        run: |
          curl -LO https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          sudo mv sops-v3.9.4.linux.amd64 /usr/local/bin/sops
          sudo chmod +x /usr/local/bin/sops

      - name: Configure SOPS age key
        run: |
          mkdir -p ~/.config/sops/age
          echo "${{ secrets.SOPS_AGE_KEY }}" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt

      - name: Terraform Init
        run: |
          # Override backend profile since we use env vars in CI
          terraform init -backend-config="profile=" -reconfigure

      - name: Select/Create Workspace
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.workspace != 'default'
        run: |
          terraform workspace select ${{ github.event.inputs.workspace }} || \
          terraform workspace new ${{ github.event.inputs.workspace }}

      # For PRs and pushes - just plan
      - name: Terraform Plan (PR/Push)
        if: github.event_name != 'workflow_dispatch'
        run: |
          # Use default workspace values for validation
          # aws_profile="" uses environment variables instead of profile
          terraform plan \
            -var="aws_profile=" \
            -var="region=ap-south-1" \
            -var="region_short=mumbai" \
            -var="vpc_cidr=10.10.112.0/24" \
            -var="wg0_tunnel_ip=10.255.255.3" \
            -no-color
        continue-on-error: true

      # Generate WireGuard keys for new deployments
      - name: Generate WireGuard Keys
        if: github.event.inputs.action == 'apply'
        id: wg_keys
        run: |
          # Check if keys exist in state
          if ! terraform state show aws_instance.vpn 2>/dev/null; then
            echo "Generating new WireGuard keys..."
            WG0_PRIVATE=$(wg genkey)
            WG0_PUBLIC=$(echo "$WG0_PRIVATE" | wg pubkey)
            echo "wg0_private=$WG0_PRIVATE" >> $GITHUB_OUTPUT
            echo "wg0_public=$WG0_PUBLIC" >> $GITHUB_OUTPUT
            echo "new_keys=true" >> $GITHUB_OUTPUT
          else
            echo "Using existing keys from state"
            echo "new_keys=false" >> $GITHUB_OUTPUT
          fi

      # Manual dispatch - plan
      - name: Terraform Plan (Manual)
        if: github.event.inputs.action == 'plan'
        run: |
          terraform plan \
            -var="aws_profile=" \
            -var="region=${{ github.event.inputs.region }}" \
            -var="region_short=${{ github.event.inputs.region_short }}" \
            -var="vpc_cidr=${{ github.event.inputs.vpc_cidr }}" \
            -var="wg0_tunnel_ip=${{ github.event.inputs.tunnel_ip }}" \
            -no-color

      # Manual dispatch - apply
      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        id: apply
        run: |
          if [ "${{ steps.wg_keys.outputs.new_keys }}" == "true" ]; then
            terraform apply -auto-approve \
              -var="aws_profile=" \
              -var="region=${{ github.event.inputs.region }}" \
              -var="region_short=${{ github.event.inputs.region_short }}" \
              -var="vpc_cidr=${{ github.event.inputs.vpc_cidr }}" \
              -var="wg0_tunnel_ip=${{ github.event.inputs.tunnel_ip }}" \
              -var="wg0_private_key=${{ steps.wg_keys.outputs.wg0_private }}" \
              -var="wg0_public_key=${{ steps.wg_keys.outputs.wg0_public }}"
          else
            terraform apply -auto-approve \
              -var="aws_profile=" \
              -var="region=${{ github.event.inputs.region }}" \
              -var="region_short=${{ github.event.inputs.region_short }}" \
              -var="vpc_cidr=${{ github.event.inputs.vpc_cidr }}" \
              -var="wg0_tunnel_ip=${{ github.event.inputs.tunnel_ip }}"
          fi

          # Capture outputs
          echo "vpn_ip=$(terraform output -raw vpn_public_ip)" >> $GITHUB_OUTPUT
          echo "wg0_public=$(terraform output -raw wg0_public_key 2>/dev/null || echo '${{ steps.wg_keys.outputs.wg0_public }}')" >> $GITHUB_OUTPUT

      # Manual dispatch - destroy
      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: |
          terraform destroy -auto-approve \
            -var="aws_profile=" \
            -var="region=${{ github.event.inputs.region }}" \
            -var="region_short=${{ github.event.inputs.region_short }}" \
            -var="vpc_cidr=${{ github.event.inputs.vpc_cidr }}" \
            -var="wg0_tunnel_ip=${{ github.event.inputs.tunnel_ip }}"

      # Update DNS after apply — UPSERT vpn-travel.etherport.net on
      # the Cloudflare zone. Migrated 2026-05-27 from Route53 (zone
      # deleted). CLOUDFLARE_API_TOKEN must have Zone:DNS:Edit on
      # etherport.net; CLOUDFLARE_ZONE_ID is the etherport.net zone.
      - name: Update vpn-travel DNS
        if: github.event.inputs.action == 'apply' && steps.apply.outputs.vpn_ip != ''
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          VPN_IP: ${{ steps.apply.outputs.vpn_ip }}
        run: |
          set -euo pipefail
          NAME="vpn-travel.etherport.net"
          # Look up existing record id (if any)
          RID=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records?type=A&name=$NAME" \
            | jq -r '.result[0].id // empty')
          BODY=$(jq -n --arg name "$NAME" --arg ip "$VPN_IP" \
            '{type:"A", name:$name, content:$ip, ttl:300, proxied:false, comment:"Managed by terraform-regional-vpn workflow"}')
          if [ -n "$RID" ]; then
            curl -fsS -X PUT -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records/$RID" \
              -d "$BODY" | jq -e '.success'
          else
            curl -fsS -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records" \
              -d "$BODY" | jq -e '.success'
          fi
          echo "vpn-travel.etherport.net → $VPN_IP"

      # Update regional peers config after apply
      - name: Update Regional Peers Config
        if: github.event.inputs.action == 'apply' && steps.apply.outputs.vpn_ip != ''
        run: |
          cd ${{ github.workspace }}

          # Create/update regional peers file
          cat > platform/wireguard/regional-peers.yaml << EOF
          # Auto-generated by GitHub Actions - DO NOT EDIT MANUALLY
          # Last updated: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          # Workflow run: ${{ github.run_id }}

          regional_vpn:
            name: vpn-${{ github.event.inputs.region_short }}
            region: ${{ github.event.inputs.region }}
            status: active
            public_ip: ${{ steps.apply.outputs.vpn_ip }}
            wg0_public_key: ${{ steps.apply.outputs.wg0_public }}
            wg0_endpoint: "${{ steps.apply.outputs.vpn_ip }}:51820"
            wg1_endpoint: "${{ steps.apply.outputs.vpn_ip }}:51821"
            vpc_cidr: ${{ github.event.inputs.vpc_cidr }}
            tunnel_ip: ${{ github.event.inputs.tunnel_ip }}
            allowed_ips: "${{ github.event.inputs.vpc_cidr }}, ${{ github.event.inputs.tunnel_ip }}/32"
          EOF

      # Commit changes after apply
      - name: Commit Regional Peers Update
        if: github.event.inputs.action == 'apply' && steps.apply.outputs.vpn_ip != ''
        run: |
          cd ${{ github.workspace }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add platform/wireguard/regional-peers.yaml
          git diff --staged --quiet || git commit -m "Update regional VPN peer config (${{ github.event.inputs.region_short }})

          Region: ${{ github.event.inputs.region }}
          IP: ${{ steps.apply.outputs.vpn_ip }}
          Tunnel IP: ${{ github.event.inputs.tunnel_ip }}

          Auto-generated by GitHub Actions
          Run: ${{ github.run_id }}"

          git push

      # Clear peers config on destroy
      - name: Clear Regional Peers Config
        if: github.event.inputs.action == 'destroy'
        run: |
          cd ${{ github.workspace }}

          cat > platform/wireguard/regional-peers.yaml << EOF
          # Auto-generated by GitHub Actions - DO NOT EDIT MANUALLY
          # Last updated: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          # Workflow run: ${{ github.run_id }}

          regional_vpn:
            status: destroyed
            # No active regional VPN
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add platform/wireguard/regional-peers.yaml
          git diff --staged --quiet || git commit -m "Clear regional VPN peer config (destroyed)

          Auto-generated by GitHub Actions
          Run: ${{ github.run_id }}"

          git push

      - name: Summary
        if: always()
        run: |
          echo "## Regional VPN Terraform Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Action**: ${{ github.event.inputs.action || 'plan' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: ${{ github.event.inputs.region || 'ap-south-1' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Workspace**: ${{ github.event.inputs.workspace || 'default' }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.apply.outputs.vpn_ip }}" ]; then
            echo "- **VPN IP**: ${{ steps.apply.outputs.vpn_ip }}" >> $GITHUB_STEP_SUMMARY
            echo "- **DNS**: vpn-travel.etherport.net → ${{ steps.apply.outputs.vpn_ip }}" >> $GITHUB_STEP_SUMMARY
          fi
