name: Twilio Webhook Lambda

on:
  # pull_request trigger REMOVED 2026-07-01 (H43): this workflow runs on the
  # in-network self-hosted runner; `terraform plan` executes PR-authored code
  # (module/provider fetch, data "external"), so PR-triggered runs were a
  # code-exec path onto the runner. This stack had no push trigger; plans run
  # via workflow_dispatch + the daily terraform-drift-detection sweep.
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply

# M112 (2026-07-01): one run per stack at a time. A dispatch apply racing a
# push-triggered plan on the same stack contends the S3 state lock (bit twice
# on 2026-07-01 — a killed run also left a stale .tflock for 2 weeks).
# cancel-in-progress stays false: never kill a mid-flight apply.
concurrency:
  group: tf-twilio-webhook
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # H29 OIDC
  pull-requests: write

env:
  WORKING_DIR: infra/terraform/aws/twilio-webhook

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'plan' }}
    runs-on: [self-hosted, lifecycle]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::830881980142:role/gh-actions-terraform

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        env:
          AWS_PROFILE: ""
        run: |
          terraform init \
            -backend-config="profile=" \
            -reconfigure

      - name: Terraform Plan
        if: github.event.inputs.action != 'apply'
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_twilio_auth_token: ${{ secrets.TWILIO_AUTH_TOKEN }}
          AWS_PROFILE: ""
        run: terraform plan -var "aws_profile=" -no-color

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_twilio_auth_token: ${{ secrets.TWILIO_AUTH_TOKEN }}
          AWS_PROFILE: ""
        run: terraform apply -auto-approve -var "aws_profile=" -no-color

      - name: Summary
        if: always()
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          {
            echo "## Twilio Webhook Lambda — Terraform run"
            echo
            echo "- Action: \`${{ github.event.inputs.action || 'plan (PR)' }}\`"
            echo
            if [ "${{ github.event.inputs.action }}" = "apply" ]; then
              echo "Next steps:"
              echo "1. Copy function_url: \`terraform output -raw function_url\`"
              echo "2. Update the 3 Twilio DIDs in infra/terraform/twilio/ to use that URL as voice_url + sms_url."
              echo "3. Apply the Twilio TF module."
              echo "4. Verify: call/text a migrated DID; check CloudWatch logs for /aws/lambda/twilio-webhook."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
