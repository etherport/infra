name: Twilio Terraform

on:
  # pull_request trigger REMOVED 2026-07-01 (H43): this workflow runs on the
  # in-network self-hosted runner; `terraform plan` executes PR-authored code
  # (module/provider fetch, data "external"), so PR-triggered runs were a
  # code-exec path onto the runner. This stack had no push trigger; plans run
  # via workflow_dispatch + the daily terraform-drift-detection sweep.
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply

# M112 (2026-07-01): one run per stack at a time. A dispatch apply racing a
# push-triggered plan on the same stack contends the S3 state lock (bit twice
# on 2026-07-01 — a killed run also left a stale .tflock for 2 weeks).
# cancel-in-progress stays false: never kill a mid-flight apply.
concurrency:
  group: tf-twilio
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # H29 OIDC
  pull-requests: write

env:
  WORKING_DIR: infra/terraform/twilio

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'plan' }}
    runs-on: [self-hosted, lifecycle]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure AWS credentials (for S3 backend)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::830881980142:role/gh-actions-terraform

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        env:
          AWS_PROFILE: ""
        run: |
          terraform init \
            -backend-config="profile=" \
            -reconfigure

      - name: Terraform Plan
        if: github.event.inputs.action != 'apply'
        working-directory: ${{ env.WORKING_DIR }}
        env:
          # Twilio provider reads these for auth. API Key (SK...) preferred
          # over master Auth Token — rotatable + scoped per CF best practice.
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_API_KEY: ${{ secrets.TWILIO_API_KEY }}
          TWILIO_API_SECRET: ${{ secrets.TWILIO_API_SECRET }}
          AWS_PROFILE: ""
        run: terraform plan -no-color

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_API_KEY: ${{ secrets.TWILIO_API_KEY }}
          TWILIO_API_SECRET: ${{ secrets.TWILIO_API_SECRET }}
          AWS_PROFILE: ""
        run: terraform apply -auto-approve -no-color

      - name: Summary
        if: always()
        run: |
          {
            echo "## Twilio Terraform run"
            echo
            echo "- Action: \`${{ github.event.inputs.action || 'plan (PR)' }}\`"
            echo
            echo "Module manages:"
            echo "- Primary DID +19094142433 + emergency address (Cabin, Skyforest CA)"
            echo "- Windtryst SIP trunk + origination URL"
            echo
            echo "Required GH secrets:"
            echo "- TWILIO_ACCOUNT_SID (AC...)"
            echo "- TWILIO_API_KEY (SK...)"
            echo "- TWILIO_API_SECRET (the secret)"
          } >> "$GITHUB_STEP_SUMMARY"
