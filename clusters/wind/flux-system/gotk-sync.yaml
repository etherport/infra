# Flux GitOps sync configuration
# Modified to enable SOPS decryption for encrypted secrets
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  # Phase 2b: GitHub App auth (etherport-automation) over HTTPS, replacing the
  # SSH deploy key. The etherport org disables deploy keys by policy; App
  # installation tokens are short-lived (1h), refreshed by source-controller.
  # image-automation-controller shares this source, so its digest-pin pushes use
  # the same App identity (needs contents:write, which the App has).
  # ROLLBACK: url -> ssh://git@github.com/etherport/infra, secretRef -> flux-system
  # (the SSH deploy-key secret is deliberately retained for that fallback).
  secretRef:
    name: flux-github-app
  url: https://github.com/etherport/infra
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./clusters/wind
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
