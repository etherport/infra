---
# Grafana Alloy — unified collector (DaemonSet). Replaces Promtail.
#
# Two responsibilities:
#   1. Tail every container log on each node (/var/log/pods/...) and
#      forward to Loki with Kubernetes pod/namespace/container labels.
#   2. Listen on UDP+TCP 514 for syslog from network gear (UDM-Pro, APs,
#      switches) and forward to Loki under job=syslog.
#
# Why DaemonSet (not Deployment): pod log scraping needs hostPath to
# /var/log/pods and /var/lib/docker/containers, which only works
# node-local. The syslog receiver is also bound here (one pod per node
# all listen on :514, but only the pod backing the LoadBalancer's
# externalTrafficPolicy=Local node receives traffic — see service block
# at bottom).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: flux-system
spec:
  releaseName: alloy
  interval: 1h
  # Loki has to exist before Alloy starts pushing — otherwise Alloy
  # spins retries and the syslog receiver buffers fill until OOM-kill.
  dependsOn:
    - name: loki
  chart:
    spec:
      chart: alloy
      version: "0.x"
      sourceRef:
        kind: HelmRepository
        name: grafana
  targetNamespace: monitoring
  timeout: 10m
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  values:
    alloy:
      # River config — the only thing Alloy executes. See
      # https://grafana.com/docs/alloy/latest/reference/components/
      configMap:
        create: true
        content: |
          // ---------- Loki write target ----------
          loki.write "default" {
            endpoint {
              url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
            }
            external_labels = {
              cluster = "wind",
            }
          }

          // ---------- Kubernetes pod log scraping ----------
          discovery.kubernetes "pods" {
            role = "pod"
          }

          // Build a label set from pod metadata.
          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pods.targets

            // Only scrape pods on this node (DaemonSet — each Alloy
            // pod tails only its own node's containers).
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "__host__"
            }

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "app"
            }
            // Path on the host for kubelet's per-container symlinked logs.
            rule {
              source_labels = [
                "__meta_kubernetes_pod_uid",
                "__meta_kubernetes_pod_container_name",
              ]
              target_label  = "__path__"
              separator     = "/"
              replacement   = "/var/log/pods/*$1/*.log"
            }
            rule {
              action = "replace"
              target_label = "job"
              replacement  = "kubernetes-pods"
            }
          }

          local.file_match "pod_logs" {
            path_targets = discovery.relabel.pod_logs.output
          }

          loki.source.file "pod_logs" {
            targets    = local.file_match.pod_logs.targets
            forward_to = [loki.process.pod_logs.receiver]
          }

          // CRI-format log lines: "2024-01-01T... stdout F <msg>".
          // Parse the timestamp + stream + drop the framing.
          loki.process "pod_logs" {
            forward_to = [loki.write.default.receiver]

            stage.cri { }
          }

          // ---------- Cilium Hubble AUDIT-verdict flows (H3 NetPol observation) ----------
          // Cilium policy-audit-mode logs would-be-denied flows as AUDIT and
          // exports them (allowlist={"verdict":["AUDIT"]}) to a per-node file.
          // We tail it → Loki under job=hubble-audit; the loki-ruler alerts on
          // new src→dst:port tuples (see 06-loki-rules-cilium-audit). This
          // replaces the interactive audit-report /loop. Each node ships its own
          // flows; the JSON is parsed at query time with LogQL `| json`.
          local.file_match "hubble_audit" {
            path_targets = [{
              __path__ = "/var/run/cilium/hubble/audit-events.json",
              job      = "hubble-audit",
            }]
          }

          loki.source.file "hubble_audit" {
            targets    = local.file_match.hubble_audit.targets
            forward_to = [loki.write.default.receiver]
          }

          // ---------- Syslog receiver (UDP+TCP 514) ----------
          // RFC3164 (BSD) — what UDM-Pro, USW, USG, most home gear
          // emit by default. RFC5424 is newer but few SOHO devices
          // speak it. Alloy's loki.source.syslog handles both.
          // Promote syslog metadata to real labels so Grafana queries
          // can filter by sender ("show me only UDM logs", "show only
          // PVE BMC logs"). Without this everything is jumbled under
          // a single {job="syslog"} stream.
          //
          // IMPORTANT pattern (verified 2026-05-23 from Alloy 1.7 docs
          // after first attempt failed): loki.relabel is referenced via
          // .rules on loki.source.syslog's relabel_rules argument
          // (NOT via forward_to chain to its .receiver). The relabel
          // happens INSIDE the syslog source, where it can see the
          // internal __syslog_* labels before they're stripped.
          loki.relabel "syslog" {
            forward_to = []  // unused; we wire via relabel_rules on the source

            rule {
              action      = "labelmap"
              regex       = "__syslog_message_(hostname|app_name|severity|facility)"
              replacement = "${1}"
            }
            rule {
              source_labels = ["__syslog_connection_ip_address"]
              target_label  = "source_ip"
            }
            // Promotion above leaves "hostname" + "app_name" labels;
            // alias to shorter names that match what the audit
            // doc + dashboards use.
            rule {
              source_labels = ["hostname"]
              target_label  = "host"
            }
            rule {
              source_labels = ["app_name"]
              target_label  = "app"
            }

            // Friendly-name remapping for noisy device hostnames so the
            // Grafana Service Browser / label selector is readable.
            // ASRock Rack BMC ships its mac-derived hostname; UniFi APs
            // and switches use the CamelCase name set in the controller
            // UI. Specific rewrites first, then a final lowercase pass.
            rule {
              source_labels = ["host"]
              regex         = "^AMI.*"
              target_label  = "host"
              replacement   = "pve-bmc"
              action        = "replace"
            }
            rule {
              source_labels = ["host"]
              regex         = "^UDM-Pro-Max$"
              target_label  = "host"
              replacement   = "udm"
              action        = "replace"
            }
            rule {
              source_labels = ["host"]
              regex         = "^AP(.+)"
              target_label  = "host"
              replacement   = "ap-${1}"
              action        = "replace"
            }
            rule {
              source_labels = ["host"]
              regex         = "^Switch(.+)"
              target_label  = "host"
              replacement   = "switch-${1}"
              action        = "replace"
            }
            // UniFi Protect / UNVR — usually emits hostname like
            // "UNVR-Pro" or "UNVRMax". Friendly target: "unvr".
            rule {
              source_labels = ["host"]
              regex         = "^UNVR.*"
              target_label  = "host"
              replacement   = "unvr"
              action        = "replace"
            }
            // UniFi NAS / Sequoia — emits "Sequoia*" or similar.
            // Friendly target: "unas-sequoia".
            rule {
              source_labels = ["host"]
              regex         = "^Sequoia.*"
              target_label  = "host"
              replacement   = "unas-sequoia"
              action        = "replace"
            }
            // Final pass: lowercase everything so {host="ap-deck"}
            // works regardless of which device generated it.
            rule {
              source_labels = ["host"]
              target_label  = "host"
              action        = "lowercase"
            }
            // Set service_name to match host so Grafana's "Service
            // Browser" view shows friendly device names instead of
            // collapsing everything under a single "syslog" service.
            // 2026-05-24: user reported the dashboard "still not
            // showing friendly names" — root cause was service_name
            // (default "syslog" for all) being what the Service
            // Browser groups by, while our friendly `host` label
            // was a separate dimension.
            rule {
              source_labels = ["host"]
              target_label  = "service_name"
              action        = "replace"
            }
          }

          loki.source.syslog "udp" {
            listener {
              address               = "0.0.0.0:514"
              protocol              = "udp"
              labels                = { job = "syslog", protocol = "udp" }
              // UDM-Pro + USW + USG all emit BSD-style (RFC3164).
              // Default is RFC5424 — leaving it default produces
              // "expecting a version value in the range 1-999"
              // parser errors on every datagram (saw this 2026-05-23
              // immediately after the UDM Traffic Logging → SIEM
              // toggle pointed at us). Switch to rfc3164.
              syslog_format         = "rfc3164"
              // use_incoming_timestamp must stay false for RFC3164 —
              // the BSD timestamp has no year, and Alloy's parser
              // defaults the missing year to 0001, which Loki then
              // rejects with "timestamp before 0001-01-01". Using
              // ingestion time is fine for our query needs (the
              // UDM-side clock is what generates the timestamp
              // a second or two earlier anyway).
              use_incoming_timestamp = false
            }
            relabel_rules = loki.relabel.syslog.rules
            forward_to    = [loki.write.default.receiver]
          }

          loki.source.syslog "tcp" {
            listener {
              address               = "0.0.0.0:514"
              protocol              = "tcp"
              labels                = { job = "syslog", protocol = "tcp" }
              syslog_format         = "rfc3164"
              use_incoming_timestamp = false
            }
            relabel_rules = loki.relabel.syslog.rules
            forward_to    = [loki.write.default.receiver]
          }

      # The DaemonSet must run on every node and needs hostPath access
      # to /var/log/pods + /var/lib/docker/containers (symlink targets).
      mounts:
        varlog: true
        dockercontainers: true
        # Read Cilium's per-node Hubble AUDIT export file (root:root; Alloy
        # runs as root, see securityContext below). Read-only.
        extra:
          - name: cilium-hubble-export
            mountPath: /var/run/cilium/hubble
            readOnly: true
      # Required for syslog receiver to bind :514 — privileged port.
      # NET_BIND_SERVICE is the minimal capability; we don't need root.
      securityContext:
        capabilities:
          add: ["NET_BIND_SERVICE"]
        runAsUser: 0  # log files are root:root on the host
        runAsNonRoot: false

      # M118 (2026-07-01): P95 working set ~315Mi — the 128Mi request
      # under-reserved ~190Mi per node (8 nodes). Request = P95 + headroom.
      resources:
        requests:
          memory: "384Mi"
          cpu: "50m"
        limits:
          memory: "512Mi"
          cpu: "500m"

      # Bind the syslog receivers on the host so the pod's :514 maps
      # cleanly when the LoadBalancer Service hits this node. The
      # cluster Service (below) round-robins between pods, but
      # externalTrafficPolicy=Local pins traffic to the receiving node
      # so syslog source IPs are preserved (UDM rate-based DNS).
      extraPorts:
        - name: syslog-udp
          port: 514
          targetPort: 514
          protocol: UDP
        - name: syslog-tcp
          port: 514
          targetPort: 514
          protocol: TCP

    # DaemonSet controller mode — one pod per node.
    controller:
      type: daemonset
      # Host volume backing the Hubble AUDIT export mount above. Cilium writes
      # /var/run/cilium/hubble/audit-events.json on each node (created lazily on
      # the first AUDIT flow); DirectoryOrCreate so Alloy mounts cleanly even on
      # nodes that haven't emitted an AUDIT flow yet.
      volumes:
        extra:
          - name: cilium-hubble-export
            hostPath:
              path: /var/run/cilium/hubble
              type: DirectoryOrCreate
      tolerations:
        # Run on control-plane nodes too so their logs ship.
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

    # Internal Service (ClusterIP) for the Alloy HTTP UI / metrics.
    service:
      enabled: true
      type: ClusterIP

    # Separate LoadBalancer Service for syslog ingestion. MetalLB
    # assigns 10.10.201.73 — see report; pool is 10.10.201.70-90,
    # .70=Traefik, .71/.72=Technitium cluster, so .73 is the next free.
    # externalTrafficPolicy=Local preserves the source IP so syslog
    # records show the actual device address, not a CNI-translated one.
    serviceMonitor:
      enabled: false  # avoid duplicate Alloy ServiceMonitor

    # Loki ServiceMonitor (chart key: serviceMonitor) is for Alloy's
    # own metrics; we leave it off to keep the kube-prometheus-stack
    # scrape simple (Alloy exposes /metrics anyway, can opt in later).

    # Custom syslog Service rendered via the chart's extraObjects hook.
    extraObjects:
      - apiVersion: v1
        kind: Service
        metadata:
          name: alloy-syslog
          namespace: monitoring
          labels:
            app.kubernetes.io/name: alloy
            app.kubernetes.io/component: syslog-receiver
        spec:
          type: LoadBalancer
          loadBalancerIP: 10.10.201.73
          # Preserve source IP for syslog; rules+dashboards filter on it.
          externalTrafficPolicy: Local
          selector:
            app.kubernetes.io/name: alloy
            app.kubernetes.io/instance: alloy
          ports:
            - name: syslog-udp
              port: 514
              targetPort: 514
              protocol: UDP
            - name: syslog-tcp
              port: 514
              targetPort: 514
              protocol: TCP
