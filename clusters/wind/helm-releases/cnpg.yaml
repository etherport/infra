---
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: flux-system
spec:
  releaseName: cnpg
  interval: 1h
  chart:
    spec:
      chart: cloudnative-pg
            # M122 (2026-07-02): EXACT pin — ranges silently froze majors (alloy sat 10
      # chart minors behind a '0.x' cap). Renovate's flux manager now PRs every bump
      # incl. majors; upgrades happen by merging PRs, never by silent drift.
      version: "0.22.1"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
  targetNamespace: cnpg-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    resources:
      requests:
        memory: "128Mi"
        cpu: "10m"
      limits:
        memory: "256Mi"
        cpu: "200m"
