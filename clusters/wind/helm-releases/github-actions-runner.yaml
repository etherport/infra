# ARC Controller
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-controller
  namespace: flux-system
spec:
  releaseName: arc-controller
  interval: 1h
  chart:
    spec:
      chart: gha-runner-scale-set-controller
            # M122 (2026-07-02): EXACT pin — ranges silently froze majors (alloy sat 10
      # chart minors behind a '0.x' cap). Renovate's flux manager now PRs every bump
      # incl. majors; upgrades happen by merging PRs, never by silent drift.
      version: "0.11.0"
      sourceRef:
        kind: HelmRepository
        name: github-actions
  targetNamespace: github-actions-runner
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
---
# Runner Scale Set for homelab-infra repo
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runner-homelab
  namespace: flux-system
spec:
  releaseName: arc-runner-homelab
  interval: 1h
  dependsOn:
    - name: arc-controller
  chart:
    spec:
      chart: gha-runner-scale-set
            # M122 (2026-07-02): EXACT pin — ranges silently froze majors (alloy sat 10
      # chart minors behind a '0.x' cap). Renovate's flux manager now PRs every bump
      # incl. majors; upgrades happen by merging PRs, never by silent drift.
      version: "0.11.0"
      sourceRef:
        kind: HelmRepository
        name: github-actions
  targetNamespace: github-actions-runner
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: github-actions-runner-config
      valuesKey: values.yaml
  values:
    runnerScaleSetName: "homelab-runner"
    githubConfigUrl: "https://github.com/etherport/infra"
    minRunners: 0
    maxRunners: 3
    containerMode:
      type: "dind"
    # Use host network so Packer HTTP server is reachable from Proxmox VMs
    template:
      spec:
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
