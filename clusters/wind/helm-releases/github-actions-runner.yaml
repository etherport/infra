---
apiVersion: v1
kind: Namespace
metadata:
  name: github-actions-runner
---
# ARC Controller
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-controller
  namespace: flux-system
spec:
  releaseName: arc-controller
  interval: 1h
  chart:
    spec:
      chart: gha-runner-scale-set-controller
      version: "0.11.x"
      sourceRef:
        kind: HelmRepository
        name: github-actions
  targetNamespace: github-actions-runner
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
---
# Runner Scale Set for homelab-infra repo
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runner-homelab
  namespace: flux-system
spec:
  releaseName: arc-runner-homelab
  interval: 1h
  dependsOn:
    - name: arc-controller
  chart:
    spec:
      chart: gha-runner-scale-set
      version: "0.11.x"
      sourceRef:
        kind: HelmRepository
        name: github-actions
  targetNamespace: github-actions-runner
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: github-actions-runner-config
      valuesKey: values.yaml
  values:
    runnerScaleSetName: "homelab-runner"
    githubConfigUrl: "https://github.com/sparked-diamond/infra"
    minRunners: 0
    maxRunners: 3
    containerMode:
      type: "dind"
    template:
      spec:
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:latest
            command: ["/home/runner/run.sh"]
            resources:
              requests:
                memory: "512Mi"
                cpu: "250m"
              limits:
                memory: "2Gi"
                cpu: "2000m"
