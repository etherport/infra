---
apiVersion: v1
kind: Namespace
metadata:
  name: gpu-operator-system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
  namespace: flux-system
spec:
  releaseName: gpu-operator
  interval: 1h
  # gpu-operator pulls in NFD validation CRDs that depend on cert-manager
  # CA bundle injection. Without this, cold-start hits a retry storm.
  dependsOn:
    - name: cert-manager
  chart:
    spec:
      chart: gpu-operator
            # M122 (2026-07-02): EXACT pin — ranges silently froze majors (alloy sat 10
      # chart minors behind a '0.x' cap). Renovate's flux manager now PRs every bump
      # incl. majors; upgrades happen by merging PRs, never by silent drift.
      version: "v25.10.1"
      sourceRef:
        kind: HelmRepository
        name: nvidia
  targetNamespace: gpu-operator-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    operator:
      defaultRuntime: containerd
    nodeSelector:
      nvidia.com/gpu: "true"
    tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
    nfd:
      enabled: true
    gfd:
      enabled: true
    mig:
      strategy: none
    driver:
      enabled: true
      upgradePolicy:
        # Enable automatic driver upgrades when new versions are available
        autoUpgrade: true
        # Drain GPU pods gracefully before upgrading
        drain:
          enable: true
          # Allow evicting pods with emptyDir volumes (plex uses these)
          deleteEmptyDir: true
          # Force eviction if pods don't terminate gracefully
          force: true
          # Wait up to 5 minutes for pods to terminate
          timeoutSeconds: 300
        # Fallback pod deletion settings
        podDeletion:
          deleteEmptyDir: true
          force: true
          timeoutSeconds: 300
        # Wait for driver to be fully ready before uncordoning
        waitForCompletion:
          timeoutSeconds: 600
    toolkit:
      enabled: true
    devicePlugin:
      enabled: true
      version: v0.17.0
      config:
        create: true
        name: time-slicing-config
        default: tesla-p40-shared
        data:
          tesla-p40-shared: |-
            version: v1
            flags:
              migStrategy: none
            sharing:
              timeSlicing:
                renameByDefault: true
                failRequestsGreaterThanOne: true
                resources:
                  - name: nvidia.com/gpu
                    replicas: 2
    dcgmExporter:
      enabled: true
      serviceMonitor:
        enabled: true
