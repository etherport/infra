apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - repositories.yaml
  - cert-manager.yaml
  - cnpg.yaml
  - gpu-operator.yaml
  - kured.yaml
  - monitoring.yaml
  - pushgateway.yaml
  - traefik.yaml
  - velero.yaml
  - tailscale-operator.yaml
  - tailscale-connector.yaml
  - github-actions-runner.yaml
  - kyverno.yaml          # M73 admission-policy engine (audit-first, no policies yet)
  - tetragon.yaml         # M74 eBPF runtime detection (observe-only; export off in v1)
  # Logging (Loki single-binary + Alloy DaemonSet for k8s + syslog)
  - loki.yaml
  - alloy.yaml
  # Note: cilium is managed by kubespray, not Flux
  # L24 Phase 2 DONE 2026-06-28: MetalLB migrated off the kubespray addon onto the
  # Helm chart in FRR mode (enables BGP TCP-MD5 + graceful-restart/BFD). The native
  # workloads were deleted by hand + this release installed in a maintenance window.
  # Mechanics in metallb.yaml + docs/planning/l24-metallb-frr-migration-plan.md.
  - metallb.yaml
