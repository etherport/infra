---
# M73 — Kyverno admission-policy engine. Deployed ENGINE-FIRST with NO policies, so it
# intercepts nothing until ClusterPolicies are added (in platform/kubernetes/kyverno/,
# all `validationFailureAction: Audit` + `failurePolicy: Ignore` + excluding kube-system/
# flux-system/kyverno). Audit-mode + fail-open + control-plane-excluded ⇒ it cannot wedge
# GitOps or the cluster. Flip individual policies to Enforce later once reports are clean.
apiVersion: v1
kind: Namespace
metadata:
  name: kyverno
  labels:
    tier: system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: flux-system
spec:
  releaseName: kyverno
  interval: 1h
  chart:
    spec:
      chart: kyverno
      version: "3.8.x"
      sourceRef:
        kind: HelmRepository
        name: kyverno
  targetNamespace: kyverno
  install:
    createNamespace: true
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Single-owner homelab footprint. failurePolicy is set PER-POLICY (Ignore) so a
    # restarting/absent admission pod fails OPEN rather than blocking admission.
    admissionController:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
    backgroundController:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
    reportsController:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
    cleanupController:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi
