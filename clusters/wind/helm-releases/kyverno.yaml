---
# M73 — Kyverno admission-policy engine. Deployed ENGINE-FIRST with NO policies, so it
# intercepts nothing until ClusterPolicies are added (in platform/kubernetes/kyverno/,
# all `validationFailureAction: Audit` + `failurePolicy: Ignore` + excluding kube-system/
# flux-system/kyverno). Audit-mode + fail-open + control-plane-excluded ⇒ it cannot wedge
# GitOps or the cluster. Flip individual policies to Enforce later once reports are clean.
apiVersion: v1
kind: Namespace
metadata:
  name: kyverno
  labels:
    tier: system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: flux-system
spec:
  releaseName: kyverno
  interval: 1h
  chart:
    spec:
      chart: kyverno
      version: "3.8.x"
      sourceRef:
        kind: HelmRepository
        name: kyverno
  targetNamespace: kyverno
  install:
    createNamespace: true
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # ⚠️ Disable ADMISSION reports (reporting-only; admission ENFORCEMENT is unaffected — :latest
    # is still blocked, requests still required). Kyverno generated an ephemeralreport per pod
    # admission; the daily ~10:00 UTC backup/CronJob fan-out (backups/rclone/cloudwatch-to-loki ns)
    # created a mass ephemeralreport create/aggregate/delete storm on etcd that saturated the raft
    # pipeline for ~15s → kube-apiserver 500s → cluster-wide leader-election cascade (~129 restarts/24h,
    # 06-28→06-30; health check 2026-06-30). Background-scan policyReports stay on for periodic
    # coverage. Sets --admissionReports=false on the controllers (verify in the live deploy args).
    features:
      admissionReports:
        enabled: false
    # Single-owner homelab footprint. failurePolicy is set PER-POLICY (Ignore) so a
    # restarting/absent admission pod fails OPEN rather than blocking admission.
    admissionController:
      # 2 replicas + a PDB (minAvailable 1) so a single admission-pod restart/eviction does NOT
      # blackhole the fail-closed mutate webhook — that amplified the 2026-06-30 leader-election
      # cascade (M109). Anti-affinity spreads them across nodes.
      replicas: 2
      podDisruptionBudget:
        minAvailable: 1
      antiAffinity:
        enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
    backgroundController:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
    reportsController:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
    cleanupController:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi
