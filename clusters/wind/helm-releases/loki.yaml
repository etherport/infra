---
# Loki — single-binary log store, Ceph RBD for hot chunks + index.
#
# Scope: homelab. ~50-100 GB/month log volume cap. 30 d retention. Single
# tenant (no multitenancy auth). Internal-only ClusterIP service; Grafana
# (same namespace) is the only intended reader, Alloy the only writer.
#
# Future: when log volume or query history outgrows local PVC, flip the
# storage stanza to s3 with our existing Velero S3 user. Schema is already
# tsdb so the migration is "add s3 config, leave existing chunks on PVC
# as a sealed period". Not done now — out of scope.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: flux-system
spec:
  releaseName: loki
  interval: 1h
  chart:
    spec:
      chart: loki
            # M122 (2026-07-02): EXACT pin — ranges silently froze majors (alloy sat 10
      # chart minors behind a '0.x' cap). Renovate's flux manager now PRs every bump
      # incl. majors; upgrades happen by merging PRs, never by silent drift.
      version: "6.55.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
  targetNamespace: monitoring
  timeout: 15m
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  values:
    # Single-binary deployment mode: read+write+backend in one pod. The
    # chart still ships the SimpleScalable (read/write split) and
    # Distributed (ingester/querier/etc.) modes — both are overkill at our
    # scale and either way require object storage. Single-binary with a
    # filesystem-backed object store is the supported "small" footprint.
    deploymentMode: SingleBinary

    loki:
      auth_enabled: false  # single tenant — no X-Scope-OrgID required
      # Tell Loki it's the `fake` tenant (auth_enabled=false default).
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      storage:
        type: filesystem
        # Filesystem object store path inside the pod; mapped onto the
        # Ceph RBD PVC via singleBinary.persistence below.
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
      # Retention enforced by the compactor. 30 d = 720 h.
      limits_config:
        retention_period: 720h
        # Conservative ingest rate caps — homelab won't hit these but
        # they cap blast radius from a runaway log producer.
        ingestion_rate_mb: 10
        ingestion_burst_size_mb: 20
        # Reject log lines older than 12 h (default 168 h). Tightens
        # the window an Alloy backlog or clock-skewed source can write
        # into past index periods.
        reject_old_samples: true
        reject_old_samples_max_age: 12h
        # L29 (2026-07-01): per-STREAM caps under the 10MB/s tenant budget —
        # without these a single runaway stream (hubble-audit during an audit
        # window, a tetragon detection storm) can starve every other stream
        # while still passing the tenant-level cap.
        per_stream_rate_limit: 3MB
        per_stream_rate_limit_burst: 10MB
        # Shorter retention for the two high-volume security-telemetry streams
        # (they're alert feedstock, not forensic archive — the ALERTS persist).
        # Everything else keeps the 30d default above.
        retention_stream:
          - selector: '{job="hubble-audit"}'
            priority: 1
            period: 168h
          - selector: '{namespace="tetragon", container="export-stdout"}'
            priority: 1
            period: 168h
          # apiserver-audit (M131) is the highest-volume stream even after the
          # Alloy-side lease/health-probe drop (see alloy.yaml). It's ruler-alert
          # feedstock, not a 30d forensic archive — the ALERTS persist. Cap at 72h
          # so the compactor bounds it (it was filling storage-loki-0, 2026-07-19).
          - selector: '{job="apiserver-audit"}'
            priority: 1
            period: 72h
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
        working_directory: /var/loki/compactor
      # Privacy: opt out of Grafana Labs' anonymous usage stats. Loki
      # otherwise phones home cluster/version metadata daily.
      analytics:
        reporting_enabled: false
      # Ruler: evaluates LokiRule resources (LogQL alert/recording
      # rules) and pushes alerts to Alertmanager. Enables alerts like
      # "syslog stream contains ipmievd assertion in last 5m" that
      # PrometheusRule can't express (PromQL only). M40 had a LogQL
      # rule placeholder that broke the kustomization until removed
      # 2026-05-23; this is the proper unblock (L4).
      #
      # ⚠️ 2026-06-28: this MUST live under `loki.structuredConfig.ruler`, NOT a bare
      # `loki.ruler` key. The grafana/loki 6.x chart renders the ruler section from
      # `loki.rulerConfig` / `loki.structuredConfig` (its config template does
      # `{{ include "loki.rulerConfig" . }}` + deep-merges structuredConfig) and SILENTLY
      # IGNORES `loki.ruler`. Under the wrong key the ruler ran on chart defaults — NO
      # alertmanager_url (alerts never reached Alertmanager) and a default rule_path that
      # mismatched the sidecar dir → loki_ruler_managers_total=0, every LogQL alert dead.
      # structuredConfig deep-merges (takes precedence), so this adds our fields on top of
      # the chart's base ruler block (storage.type:local, wal.dir).
      structuredConfig:
        ruler:
          enable_api: true
          enable_alertmanager_v2: true
          alertmanager_url: "http://monitoring-kube-prometheus-alertmanager.monitoring.svc.cluster.local:9093"
          storage:
            type: local
            local:
              directory: /var/loki/rules
          # The ruler COPIES each rule file from storage.local.directory into rule_path/<tenant>
          # for evaluation. rule_path must be a dir LOKI itself creates (writable by the loki
          # uid) — NOT /var/loki/rules-temp, whose /fake subdir is a stale root-owned emptyDir
          # mount point (the sidecar used to mount there) → "permission denied" mapping rules.
          rule_path: /var/loki/rules-scratch
          ring:
            kvstore:
              store: inmemory

    # Single-binary pod sizing + storage.
    singleBinary:
      replicas: 1
      resources:
        requests:
          memory: "256Mi"
          cpu: "100m"
        limits:
          memory: "1Gi"
          cpu: "1000m"
      persistence:
        enabled: true
        storageClass: ceph-rbd
        accessModes:
          - ReadWriteOnce
        size: 20Gi
      # Recreate so the old pod releases the RWO PVC before the new one
      # tries to attach (same pattern as Grafana in monitoring.yaml).
      extraArgs: []

    # Disable the components we don't use in SingleBinary mode. The
    # chart still renders empty Deployments/Services for these by
    # default; explicit replicas:0 keeps the namespace tidy.
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0

    # k8s-sidecar to pick up LogQL alert rules from labeled ConfigMaps.
    # Sidecar watches for ConfigMaps with label `loki_rule: "1"` (any
    # namespace) and writes them under <ruler.storage.local.directory>/fake/
    # (the "fake" tenant when auth_enabled=false). The ruler reads its rules
    # from storage.local.directory (= /var/loki/rules above) — so the sidecar
    # `folder` MUST be /var/loki/rules/fake, NOT /var/loki/rules-temp/fake.
    # ⚠️ 2026-06-28: it WAS /var/loki/rules-temp/fake (= the ruler's `rule_path`
    # SCRATCH dir, not its rule-source dir) → the ruler loaded ZERO rules
    # (loki_ruler_managers_total=0) so EVERY Loki alert (cilium-audit drop
    # alerts, IPMI, Tetragon) was silently dead. The sc-rules-volume emptyDir
    # mounts at this `folder` path in both the sidecar and the loki container,
    # so moving it to /var/loki/rules/fake makes the ruler see the files;
    # `rule_path: /var/loki/rules-temp` stays a SEPARATE scratch dir.
    # Same pattern as our Grafana dashboards sidecar (grafana_dashboard
    # label) — L4 from outstanding-work.md, 2026-05-24.
    sidecar:
      rules:
        enabled: true
        label: loki_rule
        labelValue: "1"
        folder: /var/loki/rules/fake
        searchNamespace: ALL

    # The chart wants to pull in a MinIO subchart for object storage by
    # default. We're on filesystem — disable the dependency entirely.
    minio:
      enabled: false

    # No nginx gateway needed; Grafana queries the loki-gateway-less
    # singleBinary Service directly at http://loki:3100.
    gateway:
      enabled: false

    # Skip the bundled monitoring (which would deploy its own Grafana
    # Agent + Mimir + Tempo). We have kube-prometheus-stack already.
    monitoring:
      selfMonitoring:
        enabled: false
        grafanaAgent:
          installOperator: false
      serviceMonitor:
        enabled: true  # let kube-prometheus-stack scrape loki itself
    # Disable the synthetic canary DaemonSet. In loki chart 6.x this
    # key moved from monitoring.lokiCanary to root lokiCanary (verified
    # 2026-05-23 — DS was running despite monitoring.lokiCanary.enabled=false).
    # It writes a counter log line every second and reads it back to
    # validate the pipeline; the logs show up in Grafana as service
    # "unknown_service" because the canary pods don't carry an
    # app.kubernetes.io/name=loki-canary label (the label is set to
    # "loki"). Loki's own /metrics endpoint already exposes ingest
    # health (loki_ingester_*, loki_request_duration_seconds), so the
    # canary's loki_canary_* metrics are redundant.
    lokiCanary:
      enabled: false
    test:
      enabled: false

    # Chunk + result cache — keep in-pod, no separate Memcached pods.
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
