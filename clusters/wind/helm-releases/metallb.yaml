# =============================================================================
# MetalLB — Helm/Flux-managed, FRR MODE (L24, since 2026-06-28).
#
# MetalLB runs from THIS Helm release in FRR mode (controller=metallb-controller,
# speaker=metallb-speaker DS with the frr/reloader/frr-metrics sidecars). The
# native kubespray addon is gone (`metallb_enabled: false` in kubespray
# addons.yml — never re-enable it; it would fight this release). The
# Flux-managed CRs in platform/kubernetes/metallb/ (IPAddressPool/BGPPeer/
# BGPAdvertisement) drive it: BGP-ONLY advertisement (no L2Advertisement),
# eBGP to the UDM with TCP-MD5 (BGPPeer spec.passwordSecret `bgp-md5` —
# honored ONLY in FRR mode, which is why FRR).
#
# CRDs: kept as the pre-existing cluster CRDs (crds.enabled:false +
# install/upgrade crds: Skip below) to avoid a Helm CRD-ownership conflict.
# Session health: metallb_bgp_session_up (frr-metrics :7473) →
# MetallbBGPAllSessionsDown alert — an MD5 mismatch on either end drops ALL
# sessions (no L2 fallback).
# Migration history (kubespray-native → Helm FRR, phases, gotchas):
# docs/planning/session-log.md + docs/planning/archive/l24-metallb-frr-migration-plan.md.
# =============================================================================
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: flux-system
spec:
  releaseName: metallb
  interval: 1h
  chart:
    spec:
      chart: metallb
            # M122 (2026-07-02): EXACT pin — ranges silently froze majors (alloy sat 10
      # chart minors behind a '0.x' cap). Renovate's flux manager now PRs every bump
      # incl. majors; upgrades happen by merging PRs, never by silent drift.
      version: "0.14.9"
      sourceRef:
        kind: HelmRepository
        name: metallb
  targetNamespace: metallb-system
  install:
    createNamespace: false       # metallb-system already exists
    crds: Skip                   # pre-existing CRDs (kubespray); don't let Flux manage them
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
  values:
    # CRDs are kept as the pre-existing cluster CRDs (see header). Suppress the
    # chart's CRD templates so Helm doesn't try to own them.
    crds:
      enabled: false
    speaker:
      # L24: FRR mode — required for TCP-MD5; graceful-restart is active (FRR default,
      # negotiated with the UDM). BFD still optional/not-enabled.
      frr:
        enabled: true
      # Velero (defaultVolumesToFsBackup=true) tries to fs-backup the FRR sidecars'
      # ephemeral emptyDir volumes → "BackupRepository not provisioned" → the
      # infrastructure-daily backup goes PartiallyFailed (8 errors, 2026-06-29). These
      # are runtime sockets/config/metrics, not data — exclude them from pod-volume backup.
      podAnnotations:
        backup.velero.io/backup-volumes-excludes: "frr-sockets,frr-conf,reloader,metrics"
      # speakers run on every node (incl. control-plane) as today.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    controller:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
