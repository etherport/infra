---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
  namespace: flux-system
spec:
  releaseName: monitoring
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "80.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  targetNamespace: monitoring
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    alertmanager:
      enabled: true
      alertmanagerSpec:
        # Select AlertmanagerConfig CRs from monitoring namespace
        alertmanagerConfigSelector:
          matchLabels:
            alertmanagerConfig: main
        alertmanagerConfigNamespaceSelector: {}
        # Apply routes to all alerts, not just those from the monitoring namespace
        alertmanagerConfigMatcherStrategy:
          type: None
        resources:
          requests:
            memory: "64Mi"
            cpu: "10m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-rbd
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 5Gi
    prometheus:
      enabled: true
      prometheusSpec:
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        # Retention settings
        retention: 15d
        retentionSize: 8GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-rbd
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi
    grafana:
      enabled: true
      admin:
        existingSecret: grafana-admin-credentials
        userKey: admin-user
        passwordKey: admin-password
      resources:
        requests:
          memory: "128Mi"
          cpu: "50m"
        limits:
          memory: "512Mi"
          cpu: "500m"
      persistence:
        enabled: true
        storageClassName: ceph-rbd
        accessModes:
          - ReadWriteOnce
        size: 5Gi
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - grafana.wind.etherport.net
        path: /
        pathType: Prefix
        annotations: {}
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: ALL
          resources:
            requests:
              memory: "64Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "100m"
    # Prometheus operator resource limits
    prometheusOperator:
      resources:
        requests:
          memory: "128Mi"
          cpu: "50m"
        limits:
          memory: "512Mi"
          cpu: "500m"
    # Node exporter on all nodes
    nodeExporter:
      resources:
        requests:
          memory: "32Mi"
          cpu: "10m"
        limits:
          memory: "64Mi"
          cpu: "100m"
    # Kube-state-metrics
    kube-state-metrics:
      resources:
        requests:
          memory: "64Mi"
          cpu: "10m"
        limits:
          memory: "256Mi"
          cpu: "200m"
