---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
  namespace: flux-system
spec:
  releaseName: monitoring
  interval: 1h
  # kube-prometheus-stack ships ServiceMonitor/PodMonitor/Probe CRDs *and*
  # consumes the cert-manager Certificate CRD for its admission webhook
  # TLS. Without dependsOn, Flux retries on every reconcile until
  # cert-manager finishes installing; this just makes cold-start clean.
  dependsOn:
    - name: cert-manager
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "80.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  targetNamespace: monitoring
  timeout: 15m
  install:
    createNamespace: true
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  values:
    alertmanager:
      enabled: true
      # HA: AlertManager dedupes alerts across replicas via gossip.
      # The chart provides shortcut values for anti-affinity.
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      alertmanagerSpec:
        replicas: 2
        podAntiAffinity: soft
        podAntiAffinityTopologyKey: kubernetes.io/hostname
        # Select AlertmanagerConfig CRs from monitoring namespace
        alertmanagerConfigSelector:
          matchLabels:
            alertmanagerConfig: main
        alertmanagerConfigNamespaceSelector: {}
        # Apply routes to all alerts, not just those from the monitoring namespace
        alertmanagerConfigMatcherStrategy:
          type: None
        resources:
          requests:
            memory: "64Mi"
            cpu: "10m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-rbd
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 5Gi
    prometheus:
      enabled: true
      # HA: 2 Prometheus replicas. Each scrapes everything independently,
      # so storage doubles (~16GB headroom + 2x retention overhead);
      # Grafana queries the first available replica.
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      prometheusSpec:
        replicas: 2
        podAntiAffinity: soft
        podAntiAffinityTopologyKey: kubernetes.io/hostname
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        # Wire the prometheus-additional-scrape-configs Secret (defined
        # in platform/kubernetes/monitoring/01-external-scrape-config.yaml)
        # so the `external-nodes` job — node_exporter on dns-fallback,
        # vpn-local, dns-aws, vpn-aws — actually loads. Without this,
        # the Secret exists but is never referenced; the four hosts show
        # as UNKNOWN in the service-status dashboard + email and the
        # ExternalHostDown / TechnitiumDNSDown / VPNGatewayDown alerts
        # could never fire. Caught 2026-05-23.
        additionalScrapeConfigsSecret:
          enabled: true
          name: prometheus-additional-scrape-configs
          key: additional-scrape-configs.yaml
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        # Retention settings
        retention: 15d
        retentionSize: 8GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-rbd
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi
    grafana:
      enabled: true
      # Use Recreate strategy so the old pod releases the RWO Ceph RBD PVC
      # before the new pod tries to attach. With the default RollingUpdate
      # the new pod can't bind the volume cross-node and Helm times out.
      deploymentStrategy:
        type: Recreate
      admin:
        existingSecret: grafana-admin-credentials
        userKey: admin-user
        passwordKey: admin-password
      resources:
        requests:
          memory: "128Mi"
          cpu: "50m"
        limits:
          memory: "512Mi"
          cpu: "500m"
      persistence:
        enabled: true
        storageClassName: ceph-rbd
        accessModes:
          - ReadWriteOnce
        size: 5Gi
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - grafana.wind.etherport.net
        path: /
        pathType: Prefix
        annotations: {}
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: ALL
          resources:
            requests:
              memory: "64Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "100m"
    # Prometheus operator resource limits
    prometheusOperator:
      resources:
        requests:
          memory: "128Mi"
          cpu: "50m"
        limits:
          memory: "512Mi"
          cpu: "500m"
    # Node exporter on all nodes
    nodeExporter:
      resources:
        requests:
          memory: "32Mi"
          cpu: "10m"
        limits:
          memory: "64Mi"
          cpu: "100m"
    # Kube-state-metrics
    kube-state-metrics:
      resources:
        requests:
          memory: "64Mi"
          cpu: "10m"
        limits:
          memory: "256Mi"
          cpu: "200m"
