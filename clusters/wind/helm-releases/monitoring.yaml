---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
  namespace: flux-system
spec:
  releaseName: monitoring
  interval: 1h
  # kube-prometheus-stack ships ServiceMonitor/PodMonitor/Probe CRDs *and*
  # consumes the cert-manager Certificate CRD for its admission webhook
  # TLS. Without dependsOn, Flux retries on every reconcile until
  # cert-manager finishes installing; this just makes cold-start clean.
  dependsOn:
    - name: cert-manager
  chart:
    spec:
      chart: kube-prometheus-stack
            # M122 (2026-07-02): EXACT pin — ranges silently froze majors (alloy sat 10
      # chart minors behind a '0.x' cap). Renovate's flux manager now PRs every bump
      # incl. majors; upgrades happen by merging PRs, never by silent drift.
      version: "80.14.4"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  targetNamespace: monitoring
  timeout: 15m
  install:
    createNamespace: true
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  values:
    # H41: scrape the external (systemd, not in-cluster) etcd on its no-auth :2381
    # metrics port — etcd_metrics_port=2381 in the kubespray inventory binds it on
    # each CP's node IP. Plain http, no client cert (the :2381 endpoint serves only
    # non-sensitive perf metrics — fsync/commit latency, leader changes). This
    # populates the kube-etcd Endpoints (were empty → no scrape) so the etcd
    # dashboards/alerts work.
    kubeEtcd:
      enabled: true
      endpoints:
        - 10.10.201.50
        - 10.10.201.51
        - 10.10.201.52
      service:
        enabled: true
        port: 2381
        targetPort: 2381
      serviceMonitor:
        scheme: http
    alertmanager:
      enabled: true
      # HA: AlertManager dedupes alerts across replicas via gossip.
      # The chart provides shortcut values for anti-affinity.
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      alertmanagerSpec:
        replicas: 2
        podAntiAffinity: soft
        podAntiAffinityTopologyKey: kubernetes.io/hostname
        # Select AlertmanagerConfig CRs from monitoring namespace
        alertmanagerConfigSelector:
          matchLabels:
            alertmanagerConfig: main
        alertmanagerConfigNamespaceSelector: {}
        # Apply routes to all alerts, not just those from the monitoring namespace
        alertmanagerConfigMatcherStrategy:
          type: None
        resources:
          requests:
            memory: "64Mi"
            cpu: "10m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-rbd
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 5Gi
    prometheus:
      enabled: true
      # HA: 2 Prometheus replicas. Each scrapes everything independently,
      # so storage doubles (~16GB headroom + 2x retention overhead);
      # Grafana queries the first available replica.
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      prometheusSpec:
        replicas: 2
        podAntiAffinity: soft
        podAntiAffinityTopologyKey: kubernetes.io/hostname
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        # Wire the prometheus-additional-scrape-configs Secret (defined
        # in platform/kubernetes/monitoring/01-external-scrape-config.yaml)
        # so the `external-nodes` job — node_exporter on dns-fallback,
        # vpn-local, dns-aws, vpn-aws — actually loads. Without this,
        # the Secret exists but is never referenced; the four hosts show
        # as UNKNOWN in the service-status dashboard + email and the
        # ExternalHostDown / TechnitiumDNSDown / VPNGatewayDown alerts
        # could never fire. Caught 2026-05-23.
        additionalScrapeConfigsSecret:
          enabled: true
          name: prometheus-additional-scrape-configs
          key: additional-scrape-configs.yaml
        # M118 (2026-07-01): P95 working set = ~1.83Gi per replica — the old
        # 512Mi request under-reserved by ~1.3Gi (evict-first under pressure)
        # and the 2Gi limit left <10% headroom to OOM. Request = observed P95;
        # limit raised to 3Gi.
        resources:
          requests:
            memory: "2Gi"
            cpu: "200m"
          limits:
            memory: "3Gi"
            cpu: "1000m"
        # Retention settings
        retention: 15d
        retentionSize: 8GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-rbd
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi
    grafana:
      enabled: true
      # Use Recreate strategy so the old pod releases the RWO Ceph RBD PVC
      # before the new pod tries to attach. With the default RollingUpdate
      # the new pod can't bind the volume cross-node and Helm times out.
      deploymentStrategy:
        type: Recreate
      admin:
        existingSecret: grafana-admin-credentials
        userKey: admin-user
        passwordKey: admin-password
      # H38 SSO: Authentik OIDC. Local admin (above) stays as a fallback — no
      # lockout. Client secret via env from the grafana-oidc Secret (overrides
      # grafana.ini). Maps the Authentik user to a Grafana Admin (single-owner).
      envFromSecret: grafana-oidc
      grafana.ini:
        server:
          root_url: https://grafana.wind.etherport.net
        auth.generic_oauth:
          enabled: true
          name: Authentik
          client_id: grafana
          scopes: "openid email profile"
          auth_url: https://auth.wind.etherport.net/application/o/authorize/
          token_url: https://auth.wind.etherport.net/application/o/token/
          api_url: https://auth.wind.etherport.net/application/o/userinfo/
          email_attribute_path: email
          login_attribute_path: preferred_username
          name_attribute_path: name
          allow_sign_up: true
          use_pkce: true
          # Authentik handles authentication; Grafana roles are managed MANUALLY.
          # The JMESPath literal role mapping (role_attribute_path: 'GrafanaAdmin')
          # evaluated to empty on this build (go-ini strips the wrapping quotes →
          # the literal becomes a missing-claim lookup), so every login reset the
          # user to Viewer — clobbering manual role grants. skip_org_role_sync
          # stops that; graham/akadmin are granted Grafana server admin directly
          # (persists). Promote any new OIDC user manually (single-owner). Revisit
          # with a groups-claim expression if multi-user role mapping is needed.
          skip_org_role_sync: true
      resources:
        requests:
          memory: "128Mi"
          cpu: "50m"
        limits:
          memory: "512Mi"
          cpu: "500m"
      persistence:
        enabled: true
        storageClassName: ceph-rbd
        accessModes:
          - ReadWriteOnce
        size: 5Gi
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - grafana.wind.etherport.net
        path: /
        pathType: Prefix
        annotations: {}
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: ALL
          resources:
            requests:
              memory: "64Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "100m"
    # Prometheus operator resource limits
    prometheusOperator:
      resources:
        requests:
          memory: "128Mi"
          cpu: "50m"
        limits:
          memory: "512Mi"
          cpu: "500m"
    # Node exporter on all nodes
    nodeExporter:
      resources:
        requests:
          memory: "32Mi"
          cpu: "10m"
        limits:
          memory: "64Mi"
          cpu: "100m"
    # Kube-state-metrics
    kube-state-metrics:
      resources:
        requests:
          memory: "64Mi"
          cpu: "10m"
        limits:
          memory: "256Mi"
          cpu: "200m"
