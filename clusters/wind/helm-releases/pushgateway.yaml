---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pushgateway
  namespace: flux-system
spec:
  releaseName: pushgateway
  interval: 1h
  chart:
    spec:
      chart: prometheus-pushgateway
            # M122 (2026-07-02): EXACT pin — ranges silently froze majors (alloy sat 10
      # chart minors behind a '0.x' cap). Renovate's flux manager now PRs every bump
      # incl. majors; upgrades happen by merging PRs, never by silent drift.
      version: "3.6.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  targetNamespace: monitoring
  dependsOn:
    - name: monitoring
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: pushgateway
    # Pin the ClusterIP so off-cluster pushers with a stable target (e.g. the
    # cp-node etcd-snapshot.sh host script, M62) don't break if the Service is
    # recreated. This is the IP it was already auto-assigned.
    service:
      clusterIP: 10.43.32.171
    serviceMonitor:
      enabled: true
      # Preserve the job/instance labels pushed by off-cluster sources (mini
      # photos-export, etcd-snapshot, backup jobs) instead of overwriting them
      # with the scrape target's labels.
      honorLabels: true
      # honorLabels only protects labels PRESENT in the pushed exposition
      # (job/instance). The SD-added `pod` target label is not — so every
      # pushgateway pod restart mints a fresh `pod` value and Prometheus sees a
      # NEW series for each pushed metric, multiplying dashboard lines (one stale
      # `source="gdrive"` series per past pod incarnation). Pushgateway is a
      # singleton aggregator; the pod identity is meaningless for pushed metrics.
      # Drop it so a restart can't fork the series.
      metricRelabelings:
        - action: labeldrop
          regex: pod
      additionalLabels:
        release: monitoring
    # Persist pushed metrics to a PVC. Pushgateway keeps metrics in memory, so a
    # pod restart would drop *_last_success_timestamp_seconds and false-fire the
    # staleness alerts (e.g. PhotosExportStale/NoMetrics). The flag set below
    # snapshots to /data every 5m and reloads on startup.
    persistentVolume:
      enabled: true
      storageClass: ceph-rbd
      accessModes:
        - ReadWriteOnce
      size: 2Gi
      mountPath: /data
    extraArgs:
      - --persistence.file=/data/pushgateway.store
      - --persistence.interval=5m
