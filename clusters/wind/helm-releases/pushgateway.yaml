---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pushgateway
  namespace: flux-system
spec:
  releaseName: pushgateway
  interval: 1h
  chart:
    spec:
      chart: prometheus-pushgateway
      version: "3.6.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  targetNamespace: monitoring
  dependsOn:
    - name: monitoring
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: pushgateway
    # Pin the ClusterIP so off-cluster pushers with a stable target (e.g. the
    # cp-node etcd-snapshot.sh host script, M62) don't break if the Service is
    # recreated. This is the IP it was already auto-assigned.
    service:
      clusterIP: 10.43.32.171
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
