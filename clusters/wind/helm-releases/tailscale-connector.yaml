---
# Tailscale Connector - deployed after operator installs CRDs
# Retries until the CRD exists from the operator HelmRelease
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-connector
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/kubernetes/tailscale/connector
  prune: true
  wait: true
  # Health check ensures the Connector CRD exists before applying
  healthChecks:
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: connectors.tailscale.com
  decryption:
    provider: sops
    secretRef:
      name: sops-age
