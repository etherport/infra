---
# Tailscale Connector - deployed after operator installs CRDs
# This Kustomization depends on the operator HelmRelease being ready
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-connector
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/kubernetes/tailscale/connector
  prune: true
  wait: true
  dependsOn:
    - name: tailscale-operator
      namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
