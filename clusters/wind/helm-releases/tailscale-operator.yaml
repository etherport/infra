---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: flux-system
spec:
  releaseName: tailscale-operator
  interval: 1h
  chart:
    spec:
      chart: tailscale-operator
            # M122 (2026-07-02): EXACT pin — ranges silently froze majors (alloy sat 10
      # chart minors behind a '0.x' cap). Renovate's flux manager now PRs every bump
      # incl. majors; upgrades happen by merging PRs, never by silent drift.
      version: "1.98.4"
      sourceRef:
        kind: HelmRepository
        name: tailscale
  targetNamespace: tailscale
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: tailscale-operator-oauth
      valuesKey: values.yaml
  values:
    # Operator configuration
    operatorConfig:
      # Tag for the operator itself - subnet-router tag is on the Connector resource
      defaultTags:
        - "tag:k8s-operator"
    # Subnet router configuration - expose on-prem network
    # This is configured via ProxyClass CRD after operator is installed
    # See platform/kubernetes/tailscale/subnet-router.yaml
