---
# M74 — Cilium Tetragon: eBPF runtime security / detection (assume-breach layer).
# OBSERVE-ONLY (no enforcement/kill). v1 deploys the agent with stdout export DISABLED:
# Alloy tails ALL pod logs → a naive Tetragon stdout firehose would flood the single-binary
# Loki. So v1 loads the eBPF sensors (on-demand forensics via `tetra getevents`) without any
# Loki firehose. v2 wires SELECTIVE export (TracingPolicy-matched/kprobe events only, with
# PROCESS_EXEC/EXIT denied) + a loki-ruler alert — see platform/kubernetes/tetragon/README.md.
apiVersion: v1
kind: Namespace
metadata:
  name: tetragon
  labels:
    tier: system  # privileged eBPF DaemonSet — PSA-exempt by design
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tetragon
  namespace: flux-system
spec:
  releaseName: tetragon
  interval: 1h
  chart:
    spec:
      chart: tetragon
      version: "1.7.x"
      sourceRef:
        kind: HelmRepository
        name: cilium   # tetragon ships from the cilium helm repo (already defined)
  targetNamespace: tetragon
  install:
    createNamespace: true
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # v2 (M74, 2026-06-28): SELECTIVE export. The stdout sidecar tails the agent's JSON
    # export to the pod log → Alloy → Loki ({namespace="tetragon",
    # container="export-stdout"}); the alert is monitoring/11-loki-rules-tetragon.yaml.
    # The firehose is kept OUT by restricting the export ALLOWLIST to policy-driven event
    # types only — PROCESS_EXEC/PROCESS_EXIT (the ~1.1M/day exec/exit stream) are NOT
    # listed, so the steady stream never flows. (Caveat: the allowlist does NOT suppress
    # Tetragon's process-cache warm-up dump — each agent emits a one-time ~80-line
    # PROCESS_EXEC/EXIT burst to Loki on restart. Harmless: alerts match policy_name, which
    # those lines lack. See the tetragon README.) exportDenyList drops health-checks + host/system
    # namespaces (so e.g. runc's container-setup setuid(0), which is host-ns, is filtered).
    # Net exported ≈ only real TracingPolicy matches in POD namespaces (near-zero steady
    # state). Verify volume after any change: `kubectl logs -n tetragon ds/tetragon -c
    # export-stdout --tail=20` should be quiet, not a stream.
    # ⚠️ DS pods are now 2/2 (tetragon + export-stdout). For v2 that is CORRECT (the
    # second container = export ON). Volume safety is the ALLOWLIST, not the sidecar's
    # absence — do NOT "fix" 2/2 back to 1/1 (that disables detection export).
    # NB chart-1.7 key locations (Helm silently drops unknowns): `export.mode`,
    # `tetragon.exportAllowList`, `tetragon.exportDenyList` (verified vs the chart values).
    export:
      mode: "stdout"
    tetragon:
      exportAllowList: |-
        {"event_set":["PROCESS_KPROBE", "PROCESS_TRACEPOINT", "PROCESS_UPROBE", "PROCESS_LSM"]}
      exportDenyList: |-
        {"health_check":true}
        {"namespace":["", "cilium", "kube-system"]}
      # M118 (2026-07-01): P95 ~219Mi → request 256Mi. NB the live DS carried
      # the LIMIT from these values but Kyverno-default requests (10m/32Mi) —
      # i.e. the requests key wasn't landing in the rendered chart. Verify after
      # this reconcile; if requests still show 10m/32Mi the chart drops
      # tetragon.resources.requests and this needs a postRenderer instead.
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi
    tetragonOperator:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi
