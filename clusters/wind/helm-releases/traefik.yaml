---
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  releaseName: traefik
  interval: 1h
  # Traefik consumes the cert-manager-issued wildcard via the default
  # TLSStore. Without cert-manager Ready first, Traefik comes up serving
  # its built-in self-signed cert until the wildcard appears — which
  # makes every HTTPS route return a cert error during a cold-start
  # window. Ordering keeps cold-start clean.
  dependsOn:
    - name: cert-manager
  chart:
    spec:
      chart: traefik
      version: "38.x"
      sourceRef:
        kind: HelmRepository
        name: traefik
  targetNamespace: traefik
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # HA setup: replicas=2 with podAntiAffinity, no RWO PVC.
    # Certs come from cert-manager — see platform/kubernetes/traefik/:
    #   * clusterissuer-letsencrypt.yaml (DNS-01 via Route53, 6-day certs)
    #   * certificate-wildcard.yaml (*.wind.etherport.net + apex)
    #   * tlsstore-default.yaml (default TLSStore points at the Secret)
    # All IngressRoutes use `tls: {}` so they pick up the wildcard via
    # the default TLSStore. Traefik no longer issues certs itself —
    # the old acme.json on traefik-ceph-pvc is dead weight, hence
    # persistence.enabled: false here.
    deployment:
      replicas: 2
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    affinity:
      # Keep Traefik off the GPU node so a GPU-only reboot can't take
      # down ingress with it.
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - k8s-gpu1
      # Spread the 2 replicas across hosts so a single node failure
      # never takes both pods.
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
                app.kubernetes.io/instance: traefik-traefik
            topologyKey: kubernetes.io/hostname
    # --ocsp=true previously was a no-op with cert-manager-issued certs;
    # LE stopped serving OCSP in Aug 2025 and the wildcard cert uses the
    # `shortlived` profile (6-day rotation) which makes OCSP irrelevant.
    #
    # Default middlewares on the websecure entrypoint: every HTTPS
    # IngressRoute inherits these unless it explicitly overrides with its
    # own `middlewares:` list at the route level. See
    # platform/kubernetes/traefik/middlewares/secure-headers.yaml for the
    # Middleware definition and opt-out instructions.
    additionalArguments:
      # allowCrossNamespace lets the entrypoint default middleware
      # (which lives in `traefik` namespace) be referenced by routers
      # in other namespaces (`monitoring/grafana`, etc.). Without this,
      # Traefik logs `middleware "traefik-secure-headers@kubernetescrd"
      # does not exist` and returns 503 for those routers. Caught
      # 2026-05-18 when grafana/traefik dashboards started returning
      # 503; the secure-headers Middleware was added 2026-05-16 with
      # commit 6d64c55 but cross-namespace defaulting only worked
      # until a subsequent Traefik restart re-read the args.
      - "--providers.kubernetescrd.allowCrossNamespace=true"
      - "--entrypoints.websecure.http.middlewares=traefik-secure-headers@kubernetescrd"
    env: []
    ingressClass:
      enabled: true
      isDefaultClass: true
    ingressRoute:
      dashboard:
        enabled: true
        entryPoints:
          - websecure
        matchRule: Host(`traefik.wind.etherport.net`)
    persistence:
      enabled: false
    ports:
      web:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
      websecure:
        tls:
          enabled: true
        http3:
          enabled: true
    service:
      enabled: true
      type: LoadBalancer
      spec:
        loadBalancerIP: 10.10.201.70
      labels: {}
      annotations: {}
