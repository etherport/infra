---
apiVersion: v1
kind: Namespace
metadata:
  name: velero
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: flux-system
spec:
  releaseName: velero
  interval: 1h
  chart:
    spec:
      chart: velero
      # Pinned exactly (was floating "11.x"). A floating range lets Flux
      # auto-upgrade velero on its 1h interval with no commit/review — a latent
      # durability risk on the critical backup path. Bump deliberately + verify
      # a backup completes. (11.4.0 = app v1.17.1, the version running since 05-30.)
      version: "11.4.0"
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
  targetNamespace: velero
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Resource REQUESTS only (no limits) — M5. Promotes velero server +
    # node-agent from BestEffort to Burstable QoS so they're not first in line
    # for eviction under node memory pressure (important: an evicted node-agent
    # mid-backup = a PartiallyFailed run). Deliberately NO limits — Kopia
    # fs-backup memory scales with repo size, and a too-low limit would OOM-kill
    # backups (the failure mode the comments below warn about). A namespace
    # ResourceQuota was evaluated and rejected: velero's pods are ephemeral with
    # variable footprints, so any compute quota risks silently rejecting backup
    # pods. Requests-only is the safe governance step; revisit a requests-based
    # quota only after profiling real backup memory use.
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
    configuration:
      # Use Kopia (not Restic) for filesystem PV backups. Restic is being
      # phased out in upstream Velero and Kopia is significantly faster on
      # large repos. Pin explicitly so this doesn't drift on chart bumps.
      uploaderType: kopia
      # Cluster-wide default: capture PV data on every backup unless a
      # specific Backup/Schedule opts out. The migration outage was caused
      # by an ad-hoc `velero backup create` that omitted
      # --default-volumes-to-fs-backup and produced a metadata-only backup
      # that was unrecoverable when PVs vanished with the old cluster.
      defaultVolumesToFsBackup: true
      backupStorageLocation:
        - provider: aws
          bucket: velero.wind.etherport.net
          default: true
          config:
            region: us-west-2
      volumeSnapshotLocation:
        - provider: aws
          config:
            region: us-west-2
      # M75 IRSA: server env so the AWS SDK assumes wind-irsa-velero via web identity.
      extraEnvVars:
        - name: AWS_ROLE_ARN
          value: "arn:aws:iam::830881980142:role/wind-irsa-velero"
        - name: AWS_WEB_IDENTITY_TOKEN_FILE
          value: "/var/run/secrets/eks.amazonaws.com/serviceaccount/token"
    credentials:
      # M75 IRSA: no static-key secret. velero (server + node-agent) uses the AWS
      # SDK default chain → AssumeRoleWithWebIdentity via the projected SA token +
      # AWS_ROLE_ARN/AWS_WEB_IDENTITY_TOKEN_FILE (role wind-irsa-velero, trust
      # system:serviceaccount:velero:velero-server). Both pods share that SA.
      useSecret: false
    # Server pod: projected SA token (aud sts.amazonaws.com).
    extraVolumes:
      - name: aws-iam-token
        projected:
          sources:
            - serviceAccountToken:
                audience: sts.amazonaws.com
                expirationSeconds: 3600
                path: token
    extraVolumeMounts:
      - name: aws-iam-token
        mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
        readOnly: true
    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.13.2
        volumeMounts:
          - name: plugins
            mountPath: /target
    deployNodeAgent: true
    # node-agent runs the Kopia fs-backups and must be on the SAME node as every
    # pod whose volumes are backed up. Without a control-plane toleration it only
    # lands on the 5 worker/gpu nodes, so kube-system-daily was PartiallyFailed
    # every run: cilium runs on all 8 nodes incl. cp1-3, defaultVolumesToFsBackup
    # is true, and there was no node-agent on the control planes to back up
    # cilium's `tmp` volume ("daemonset pod not found in running state in node
    # k8s-cpX" x3). Tolerate the taint -> node-agent on all 8 -> backup clean.
    nodeAgent:
      # M75 IRSA: the node-agent (Kopia → S3) needs creds too; same projected
      # token + web-identity env as the server (shares the velero-server SA).
      extraEnvVars:
        - name: AWS_ROLE_ARN
          value: "arn:aws:iam::830881980142:role/wind-irsa-velero"
        - name: AWS_WEB_IDENTITY_TOKEN_FILE
          value: "/var/run/secrets/eks.amazonaws.com/serviceaccount/token"
      extraVolumes:
        - name: aws-iam-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 3600
                  path: token
      extraVolumeMounts:
        - name: aws-iam-token
          mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
          readOnly: true
      # Requests-only (no limits) — see the `resources:` note above (M5).
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # M84 (2026-06-19): raise node-agent data-path concurrency from the default
      # 1 → 2 per node. With the default 1, a backup's PVBs serialize per node and
      # under the nightly burst the queued ones stall in `Prepared`/`timeout on
      # preparing PVB` → PartiallyFailed + a blocked serialized queue (06-19:
      # critical-apps, infrastructure). Points at the velero-node-agent-config CM
      # below. See docs/planning/outstanding-work.md M84 + session-log 2026-06-19.
      extraArgs:
        - --node-agent-configmap=velero-node-agent-config
    snapshotsEnabled: true
    metrics:
      enabled: true
      serviceMonitor:
        # Enabled 2026-05-24 so VeleroBackupFailed / VeleroBackupPartial
        # / VeleroLastBackupAgeHigh alerts (06-backup-alerts.yaml) get
        # real metric data. kube-prometheus-stack scrapes any SM
        # labeled `release: monitoring` — that's the default this
        # chart emits.
        enabled: true
        additionalLabels:
          release: monitoring
    kubectl:
      image:
        tag: "1.33"
    # M84: node-agent load-concurrency config, consumed via nodeAgent.extraArgs above.
    # The chart renders this as ConfigMap "velero-node-agent-config" (release-prefixed).
    # globalConfig=2 → up to 2 PVB data-paths per node concurrently (default is 1).
    configMaps:
      node-agent-config:
        data:
          node-agent-config.json: |
            {"loadConcurrency": {"globalConfig": 2}}
