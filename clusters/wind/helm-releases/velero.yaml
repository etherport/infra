---
apiVersion: v1
kind: Namespace
metadata:
  name: velero
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: flux-system
spec:
  releaseName: velero
  interval: 1h
  chart:
    spec:
      chart: velero
      # Pinned exactly (was floating "11.x"). A floating range lets Flux
      # auto-upgrade velero on its 1h interval with no commit/review — a latent
      # durability risk on the critical backup path. Bump deliberately + verify
      # a backup completes. (11.4.0 = app v1.17.1, the version running since 05-30.)
      version: "11.4.0"
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
  targetNamespace: velero
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Resource REQUESTS only (no limits) — M5. Promotes velero server +
    # node-agent from BestEffort to Burstable QoS so they're not first in line
    # for eviction under node memory pressure (important: an evicted node-agent
    # mid-backup = a PartiallyFailed run). Deliberately NO limits — Kopia
    # fs-backup memory scales with repo size, and a too-low limit would OOM-kill
    # backups (the failure mode the comments below warn about). A namespace
    # ResourceQuota was evaluated and rejected: velero's pods are ephemeral with
    # variable footprints, so any compute quota risks silently rejecting backup
    # pods. Requests-only is the safe governance step; revisit a requests-based
    # quota only after profiling real backup memory use.
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
    configuration:
      # Use Kopia (not Restic) for filesystem PV backups. Restic is being
      # phased out in upstream Velero and Kopia is significantly faster on
      # large repos. Pin explicitly so this doesn't drift on chart bumps.
      uploaderType: kopia
      # ⚠️ MUST be pinned to `garage`. The velero server's default-BSL controller
      # reads `--default-backup-storage-location`; if UNSET it falls back to the
      # literal string "default" and, on every velero restart, force-marks the BSL
      # *named* `default` (our ReadOnly offsite DR mirror) as THE default —
      # inverting the `default: true` the chart puts on `garage`. Schedules omit
      # storageLocation (inherit the default), so that inversion routes every
      # backup to the ReadOnly BSL → all schedules `FailedValidation`, no backups
      # for ~37h until caught (2026-07-18 incident). Pinning the name here makes
      # the controller keep `garage` default across restarts.
      defaultBackupStorageLocation: garage
      # Cluster-wide default: capture PV data on every backup unless a
      # specific Backup/Schedule opts out. The migration outage was caused
      # by an ad-hoc `velero backup create` that omitted
      # --default-volumes-to-fs-backup and produced a metadata-only backup
      # that was unrecoverable when PVs vanished with the old cluster.
      defaultVolumesToFsBackup: true
      # Kopia repo-maintenance cadence. Velero's default is HOURLY — the live
      # BackupRepository CRs showed maintenanceFrequency=1h0m0s, and each run
      # LISTs/GETs/rewrites the ENTIRE repo index in S3. Across 11 repos that was
      # ~$70/mo of S3 REQUEST cost (the May–June bill spike; storage is only
      # ~$7/mo). 24h (daily, matching the backup cadence) keeps the repo index
      # compact — which also makes each BACKUP cheaper — while cutting maintenance
      # request volume ~24x (~7200→~300 runs/mo). NB the flag only sets the default
      # for NEWLY created repos; the existing 11 CRs were patched live to 24h0m0s
      # (2026-07-01). See docs/planning/session-log.md 2026-07-01 (AWS cost).
      defaultRepoMaintainFrequency: 24h
      # M137 Phase 2 (2026-07-08): PRIMARY repo cut over to local Garage (S3 on the
      # NAS) so backups + Kopia maintenance run over the LAN — killing the S3
      # DataTransfer-Out egress from maintenance "rewriting contents from short
      # packs" ($75→$160). The old AWS/S3 BSL is kept READ-ONLY (non-default) so
      # existing restore points survive their 30-day TTL. New backups → Garage.
      backupStorageLocation:
        - name: garage
          provider: aws
          default: true
          bucket: velero
          # Garage has no IRSA → explicit static key (the read-only S3 BSL below
          # still uses IRSA via the server/node-agent env).
          credential:
            name: velero-garage-creds
            key: cloud
          config:
            region: garage
            s3Url: http://garage.garage.svc.cluster.local:3900
            s3ForcePathStyle: "true"
            # Garage/S3-compat stores reject AWS checksum-trailer uploads; disable.
            checksumAlgorithm: ""
        - name: default
          provider: aws
          default: false
          # Read-only OFFSITE DR mirror. Reads the `dr/` prefix — the velero-dr
          # CronJob rclones the local Garage repo → s3://…/dr/ (weekly). Without the
          # prefix this BSL read the bucket ROOT and velero rejected the `dr/`
          # subdir as an "invalid top-level directory" → BSL stuck Unavailable
          # (2026-07-09). Pointing it at `dr/` makes the offsite copy a valid,
          # usable restore source if Garage is ever lost. (The pre-cutover restore
          # points at the bucket root are transitional — 30-day TTL — and redundant
          # with Garage + this mirror.)
          accessMode: ReadOnly
          bucket: velero.wind.etherport.net
          prefix: dr
          config:
            region: us-west-2
      volumeSnapshotLocation:
        - provider: aws
          config:
            region: us-west-2
      # M75 IRSA: server env so the AWS SDK assumes wind-irsa-velero via web identity.
      # AWS_REGION is REQUIRED — the Kopia repo-maintenance jobs (which inherit these
      # env vars) build a REGIONAL STS endpoint for AssumeRoleWithWebIdentity; without
      # a region it becomes "sts..amazonaws.com" (empty) → DNS failure → maintenance
      # fails. The BSL region config covers S3 but not the maintenance job's STS call.
      extraEnvVars:
        - name: AWS_ROLE_ARN
          value: "arn:aws:iam::830881980142:role/wind-irsa-velero"
        - name: AWS_WEB_IDENTITY_TOKEN_FILE
          value: "/var/run/secrets/eks.amazonaws.com/serviceaccount/token"
        - name: AWS_REGION
          value: "us-west-2"
        - name: AWS_DEFAULT_REGION
          value: "us-west-2"
    credentials:
      # M75 IRSA: no static-key secret. velero (server + node-agent) uses the AWS
      # SDK default chain → AssumeRoleWithWebIdentity via the projected SA token +
      # AWS_ROLE_ARN/AWS_WEB_IDENTITY_TOKEN_FILE (role wind-irsa-velero, trust
      # system:serviceaccount:velero:velero-server). Both pods share that SA.
      useSecret: false
    # Server pod: projected SA token (aud sts.amazonaws.com).
    extraVolumes:
      - name: aws-iam-token
        projected:
          sources:
            - serviceAccountToken:
                audience: sts.amazonaws.com
                expirationSeconds: 3600
                path: token
    extraVolumeMounts:
      - name: aws-iam-token
        mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
        readOnly: true
    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.13.2
        volumeMounts:
          - name: plugins
            mountPath: /target
    deployNodeAgent: true
    # node-agent runs the Kopia fs-backups and must be on the SAME node as every
    # pod whose volumes are backed up. Without a control-plane toleration it only
    # lands on the 5 worker/gpu nodes, so kube-system-daily was PartiallyFailed
    # every run: cilium runs on all 8 nodes incl. cp1-3, defaultVolumesToFsBackup
    # is true, and there was no node-agent on the control planes to back up
    # cilium's `tmp` volume ("daemonset pod not found in running state in node
    # k8s-cpX" x3). Tolerate the taint -> node-agent on all 8 -> backup clean.
    nodeAgent:
      # M75 IRSA: the node-agent (Kopia → S3) needs creds too. NB the chart renders
      # `configuration.extraEnvVars` into the node-agent as well, so the AWS_ROLE_ARN
      # / AWS_WEB_IDENTITY_TOKEN_FILE env above already apply here — do NOT repeat
      # them under nodeAgent.extraEnvVars (that double-sets them → Helm patch fails).
      # Only the projected-token VOLUME is node-agent-scoped, so add that here:
      extraVolumes:
        - name: aws-iam-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 3600
                  path: token
      extraVolumeMounts:
        - name: aws-iam-token
          mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
          readOnly: true
      # Requests-only (no limits) — see the `resources:` note above (M5).
      # M118 (2026-07-01): right-sized from 200m/256Mi — 7d MAX (incl. backup
      # windows) was 138Mi / P95 CPU ~1m across all 8 pods, so the old requests
      # idled ~1.4 CPU + ~0.8Gi of schedulable capacity fleet-wide. No limits →
      # bursts are unaffected.
      resources:
        requests:
          cpu: 25m
          memory: 160Mi
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # M84 (2026-06-19): raise node-agent data-path concurrency from the default
      # 1 → 2 per node. With the default 1, a backup's PVBs serialize per node and
      # under the nightly burst the queued ones stall in `Prepared`/`timeout on
      # preparing PVB` → PartiallyFailed + a blocked serialized queue (06-19:
      # critical-apps, infrastructure). Points at the velero-node-agent-config CM
      # below. See docs/planning/outstanding-work.md M84 + session-log 2026-06-19.
      extraArgs:
        - --node-agent-configmap=velero-node-agent-config
    snapshotsEnabled: true
    metrics:
      enabled: true
      serviceMonitor:
        # Enabled 2026-05-24 so VeleroBackupFailed / VeleroBackupPartial
        # / VeleroLastBackupAgeHigh alerts (06-backup-alerts.yaml) get
        # real metric data. kube-prometheus-stack scrapes any SM
        # labeled `release: monitoring` — that's the default this
        # chart emits.
        enabled: true
        additionalLabels:
          release: monitoring
    kubectl:
      image:
        tag: "1.33"
    # M84: node-agent load-concurrency config, consumed via nodeAgent.extraArgs above.
    # The chart renders this as ConfigMap "velero-node-agent-config" (release-prefixed).
    # globalConfig=2 → up to 2 PVB data-paths per node concurrently (default is 1).
    configMaps:
      node-agent-config:
        data:
          node-agent-config.json: |
            {"loadConcurrency": {"globalConfig": 2}}
