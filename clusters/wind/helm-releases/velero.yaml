---
apiVersion: v1
kind: Namespace
metadata:
  name: velero
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: flux-system
spec:
  releaseName: velero
  interval: 1h
  chart:
    spec:
      chart: velero
      version: "11.x"
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
  targetNamespace: velero
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    configuration:
      # Use Kopia (not Restic) for filesystem PV backups. Restic is being
      # phased out in upstream Velero and Kopia is significantly faster on
      # large repos. Pin explicitly so this doesn't drift on chart bumps.
      uploaderType: kopia
      # Cluster-wide default: capture PV data on every backup unless a
      # specific Backup/Schedule opts out. The migration outage was caused
      # by an ad-hoc `velero backup create` that omitted
      # --default-volumes-to-fs-backup and produced a metadata-only backup
      # that was unrecoverable when PVs vanished with the old cluster.
      defaultVolumesToFsBackup: true
      backupStorageLocation:
        - provider: aws
          bucket: velero.wind.etherport.net
          default: true
          config:
            region: us-west-2
      volumeSnapshotLocation:
        - provider: aws
          config:
            region: us-west-2
    credentials:
      existingSecret: cloud-credentials
    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.13.2
        volumeMounts:
          - name: plugins
            mountPath: /target
    deployNodeAgent: true
    # node-agent runs the Kopia fs-backups and must be on the SAME node as every
    # pod whose volumes are backed up. Without a control-plane toleration it only
    # lands on the 5 worker/gpu nodes, so kube-system-daily was PartiallyFailed
    # every run: cilium runs on all 8 nodes incl. cp1-3, defaultVolumesToFsBackup
    # is true, and there was no node-agent on the control planes to back up
    # cilium's `tmp` volume ("daemonset pod not found in running state in node
    # k8s-cpX" x3). Tolerate the taint -> node-agent on all 8 -> backup clean.
    nodeAgent:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    snapshotsEnabled: true
    metrics:
      enabled: true
      serviceMonitor:
        # Enabled 2026-05-24 so VeleroBackupFailed / VeleroBackupPartial
        # / VeleroLastBackupAgeHigh alerts (06-backup-alerts.yaml) get
        # real metric data. kube-prometheus-stack scrapes any SM
        # labeled `release: monitoring` — that's the default this
        # chart emits.
        enabled: true
        additionalLabels:
          release: monitoring
    kubectl:
      image:
        tag: "1.33"
