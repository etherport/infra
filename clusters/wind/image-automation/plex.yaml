# Flux Image Automation for Plex Media Server
# Plex uses non-standard version format: X.Y.Z.BUILD-HASH
# Solution: Extract as semver prerelease (X.Y.Z-BUILD) for correct comparison
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: plex
  namespace: flux-system
spec:
  image: plexinc/pms-docker
  interval: 1h
  exclusionList:
    - "^latest$"
    - "^public$"
    - "^plexpass$"
    - "^beta$"
    - "^.*-test.*$"
    # Exclude architecture-specific tags (we want multi-arch manifest)
    - ".*-arm64$"
    - ".*-amd64$"
    - ".*-armhf$"
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: plex
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: plex
  filterTags:
    # Match Plex version format: X.Y.Z.BUILD-HASH (excluding arch-specific tags)
    # Extract as semver prerelease: X.Y.Z-BUILD (e.g., 1.43.0-10492)
    # Semver compares prereleases numerically, so 10492 > 10467
    pattern: '^(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)\.(?P<build>\d+)-[0-9a-f]+$'
    extract: '$major.$minor.$patch-$build'
  policy:
    semver:
      range: '>=1.0.0-0'
