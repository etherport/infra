# Flux Image Automation for Wiki.js
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: wikijs
  namespace: flux-system
spec:
  image: ghcr.io/requarks/wiki
  interval: 1h
  exclusionList:
    - "^.*-beta.*$"
    - "^.*-alpha.*$"
    - "^latest$"
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: wikijs
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: wikijs
  digestReflectionPolicy: Always  # digest-pin (H30)
  interval: 1h
  policy:
    semver:
      range: ">=2.0.0"
