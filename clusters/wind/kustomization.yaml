apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./flux-system
  - ./image-automation
  # Helm releases (managed by Flux)
  - ./helm-releases
  # Infrastructure
  - ../../platform/kubernetes/metallb
  - ../../platform/kubernetes/traefik
  - ../../platform/kubernetes/technitium
  # cert-manager DNS-01 secret (Cloudflare API token). Lives separately
  # from traefik/ because the secret targets cert-manager ns + the
  # kustomization there forces namespace=traefik. SOPS file is committed
  # as a template until the user pastes a real CF token — Flux reconciles
  # a no-op until the resource line is uncommented in the dir's
  # kustomization.yaml. See docs/runbooks/cert-manager-dns01-cf-migration.md.
  - ../../platform/kubernetes/cert-manager-issuer
  # Storage
  - ../../platform/kubernetes/storage/ceph-csi
  # Cluster utilities
  - ../../platform/kubernetes/auto-remediation
  # CloudWatch Logs -> Loki (M45 Phase C). 5-min CronJob in its own
  # ns; reads CW Logs via boto3 + pushes to in-cluster Loki. Closes
  # the on-prem/cloud log split — dashboards + advisor context now
  # span both. Populate the SOPS secret per
  # docs/runbooks/cloudwatch-to-loki-enable.md to activate.
  - ../../platform/kubernetes/cloudwatch-to-loki
  # Cloudflare Tunnel (cloudflared daemon). Outbound-only to CF edge;
  # no inbound ports opened. Routes approve.wind.etherport.net (and
  # future *.wind.etherport.net public-with-auth services) through
  # CF Access.
  #
  # DISABLED until the SOPS tunnel token is populated — without a real
  # token the pods CrashLoopBackOff ("Provided Tunnel token is not valid"),
  # which triggers the AI advisor on KubePodCrashLooping / TargetDown /
  # KubeDeploymentReplicasMismatch every couple of minutes. Re-enable
  # AFTER:
  #   1. terraform apply in infra/terraform/cloudflare
  #   2. terraform output -raw tunnel_token | pbcopy
  #   3. sops platform/kubernetes/cloudflared/01-tunnel-token.sops.yaml
  # See docs/runbooks/cloudflare-access-enable.md for the full flow.
  - ../../platform/kubernetes/cloudflared
  # blackbox-exporter for ICMP/HTTPS probes of non-K8s appliances
  # (UDM at 10.10.200.1, Protect at 10.10.212.10, UNAS at 10.10.209.10).
  # Surfaces them in service-status email + Grafana dashboard via
  # `kind="probe"` entries in services.py.
  - ../../platform/kubernetes/blackbox-exporter
  # Policy baseline (Pod Security Standards audit+warn, LimitRanges).
  # Phase 1 of the NetworkPolicies+Quotas+PDBs plan — observation-only,
  # no enforcement. See platform/kubernetes/policy-baseline/README.md.
  - ../../platform/kubernetes/policy-baseline
  # Database (CloudNativePG cluster - operator installed via Helm)
  - ../../platform/kubernetes/cnpg
  # Cue app database — dedicated single-instance CNPG cluster (cue ns).
  # Drizzle owns the schema; pgvector pre-enabled. See the dir README.
  - ../../platform/kubernetes/cue-db
  # Cue API — Node/Fastify app (cue ns). Image from ghcr (private); public via
  # CF tunnel, path-restricted to /health + /telegram/webhook. See dir README.
  - ../../platform/kubernetes/cue-api
  # Applications
  - ../../platform/kubernetes/home-automation
  - ../../platform/kubernetes/plex
  - ../../platform/kubernetes/rclone-gdrive
  - ../../platform/kubernetes/wikijs
  # Monitoring
  - ../../platform/kubernetes/monitoring
  # unifi-poller (unpoller) — UDM/network telemetry → Prometheus (M55 / task #15).
  # STAGED but DISABLED until the operator creates a UniFi View-Only local
  # account + encrypts the creds Secret. See
  # platform/kubernetes/unifi-poller/README.md.
  - ../../platform/kubernetes/unifi-poller
  # Utilities
  - ../../platform/kubernetes/cloudflare-ddns/base
  # Backups - S3 sync shares (all managed by Flux)
  - ../../platform/kubernetes/backups/aws-s3/shares/archive
  - ../../platform/kubernetes/backups/aws-s3/shares/backups
  - ../../platform/kubernetes/backups/aws-s3/shares/content
  - ../../platform/kubernetes/backups/aws-s3/shares/graham
  - ../../platform/kubernetes/backups/aws-s3/shares/mark
  - ../../platform/kubernetes/backups/aws-s3/shares/media
  - ../../platform/kubernetes/backups/aws-s3/shares/scans  # suspended
  - ../../platform/kubernetes/backups/aws-s3/daily-report
  # Velero backup schedules
  - ../../platform/kubernetes/backups/velero/schedules
  # LLM Services
  - ../../platform/kubernetes/ollama
  # VPN / Remote Access
  - ../../platform/kubernetes/tailscale
  - ../../platform/kubernetes/wireguard
  # CI/CD
  - ../../platform/kubernetes/github-actions-runner
  # Certificate management
  - ../../platform/kubernetes/unifi-cert-sync
  # UDM / Protect controller-DB + core-config nightly backup to S3
  - ../../platform/kubernetes/unifi-backup

# Pod Security Standards labels — applied as patches at the top of the
# kustomize build graph so they target Namespaces created by any nested
# kustomization (helm-releases/monitoring, home-automation/namespace, etc.).
# Patch file lives in this directory because kustomize forbids patch paths
# above the kustomization root. See policy-baseline/README.md for rationale.
patches:
  - path: namespace-pss-labels.yaml
