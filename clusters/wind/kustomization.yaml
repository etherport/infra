apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./flux-system
  - ./image-automation
  # Helm releases (managed by Flux)
  - ./helm-releases
  # Infrastructure
  - ../../platform/kubernetes/metallb
  - ../../platform/kubernetes/traefik
  - ../../platform/kubernetes/technitium
  # Storage
  - ../../platform/kubernetes/storage/ceph-csi
  # Cluster utilities
  - ../../platform/kubernetes/auto-remediation
  # Policy baseline (Pod Security Standards audit+warn, LimitRanges).
  # Phase 1 of the NetworkPolicies+Quotas+PDBs plan — observation-only,
  # no enforcement. See platform/kubernetes/policy-baseline/README.md.
  - ../../platform/kubernetes/policy-baseline
  # Database (CloudNativePG cluster - operator installed via Helm)
  - ../../platform/kubernetes/cnpg
  # Applications
  - ../../platform/kubernetes/home-automation
  - ../../platform/kubernetes/plex
  - ../../platform/kubernetes/rclone-gdrive
  - ../../platform/kubernetes/kopia
  - ../../platform/kubernetes/wikijs
  # Monitoring
  - ../../platform/kubernetes/monitoring
  # Utilities
  - ../../platform/kubernetes/route53-ddns/base
  # Backups - S3 sync shares (all managed by Flux)
  - ../../platform/kubernetes/backups/aws-s3/shares/archive
  - ../../platform/kubernetes/backups/aws-s3/shares/backups
  - ../../platform/kubernetes/backups/aws-s3/shares/content
  - ../../platform/kubernetes/backups/aws-s3/shares/graham
  - ../../platform/kubernetes/backups/aws-s3/shares/mark
  - ../../platform/kubernetes/backups/aws-s3/shares/media
  - ../../platform/kubernetes/backups/aws-s3/shares/scans  # suspended
  - ../../platform/kubernetes/backups/aws-s3/daily-report
  # Velero backup schedules
  - ../../platform/kubernetes/backups/velero/schedules
  # LLM Services
  - ../../platform/kubernetes/ollama
  # VPN / Remote Access
  - ../../platform/kubernetes/tailscale
  - ../../platform/kubernetes/wireguard
  # CI/CD
  - ../../platform/kubernetes/github-actions-runner
  # Certificate management
  - ../../platform/kubernetes/unifi-cert-sync

# Pod Security Standards labels — applied as patches at the top of the
# kustomize build graph so they target Namespaces created by any nested
# kustomization (helm-releases/monitoring, home-automation/namespace, etc.).
# Patch file lives in this directory because kustomize forbids patch paths
# above the kustomization root. See policy-baseline/README.md for rationale.
patches:
  - path: namespace-pss-labels.yaml
