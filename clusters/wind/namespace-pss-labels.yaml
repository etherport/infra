# Pod Security Standards labels per namespace (strategic-merge patches).
#
# IMPORTANT: This file is loaded via `patches:` in kustomization.yaml, not
# `resources:`. The namespaces themselves are created elsewhere (HelmRelease
# `createNamespace: true`, or per-app `00-namespace.yaml`); we just stamp the
# PSS labels onto them at kustomize-build time.
#
# Tier labels:
#   tier=data    → tenant application namespaces
#   tier=system  → cluster infrastructure (privileged workloads expected)
#
# Phase 2 (2026-06-02): tier=data namespaces with ZERO baseline violations
# (verified by scanning live pods) graduate to `enforce: baseline` — new
# violating pods are rejected at admission; existing pods are unaffected.
# audit+warn are kept alongside enforce so violations are still logged/surfaced.
# Three tier=data namespaces stay audit/warn-only because they run legitimately
# elevated pods that baseline would block:
#   - home-automation: Home Assistant runs privileged (USB/hardware access)
#   - monitoring:      node-exporter (hostNetwork/PID), alloy (hostPath), grafana
#   - tailscale:       operator/proxy pods need NET_ADMIN
# tier=system (plex, wireguard) stays unrestricted by design.
---
apiVersion: v1
kind: Namespace
metadata:
  name: home-automation
  labels:
    tier: data
    # audit/warn only — HA pod is privileged (hardware access). See header.
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    tier: data
    # audit/warn only — node-exporter/alloy/grafana need host access. See header.
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: postgres
  labels:
    tier: data
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
  labels:
    tier: data
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/enforce: baseline
    # H3 tier 4 (2026-06-22): opt into NetworkPolicy OBSERVATION. Applied while
    # policy-audit-mode is ON, so this logs would-be drops as AUDIT (enforces
    # nothing) — build/verify 13-tier-traefik.yaml from Loki {job="hubble-audit"},
    # then flip audit OFF to enforce. (Traefik ns is Helm-created; labelled here
    # via the PSS strategic-merge patch, not a 00-namespace.yaml.)
    netpol.wind/enforced: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: dns
  labels:
    tier: data
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: wikijs
  labels:
    tier: data
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: ollama
  labels:
    tier: data
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: backups
  labels:
    tier: data
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  labels:
    tier: data
    # audit/warn only — operator/proxy pods need NET_ADMIN. See header.
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
# Phase 2 extension (2026-06-02): additional tenant app namespaces, all scanned
# with zero baseline violations → straight to enforce. (cue deployed this round;
# cert-manager/cloudflare-ddns/rclone/auto-remediation/unifi-cert-sync/
# cloudwatch-to-loki were running unlabeled.)
apiVersion: v1
kind: Namespace
metadata:
  name: cue
  labels:
    tier: data
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/enforce: baseline
---
# NOTE: cert-manager + rclone-gdrive are intentionally NOT here — their
# Namespaces are created by HelmReleases/runtime, not in the kustomize build,
# so a strategic-merge patch has no target and breaks the whole build. PSS for
# those would need to be set on the namespace at its creation source instead.
apiVersion: v1
kind: Namespace
metadata:
  name: cloudflare-ddns
  labels:
    tier: data
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
