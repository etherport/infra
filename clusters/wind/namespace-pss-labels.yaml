---
# Privileged-by-design namespaces — tier=system, no PSS enforcement.
apiVersion: v1
kind: Namespace
metadata:
  name: plex
  labels:
    tier: system  # GPU passthrough needs privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: wireguard
  labels:
    tier: system  # hostNetwork + NET_ADMIN for VPN tunnels
