# Pod Security Standards labels per namespace (strategic-merge patches).
#
# IMPORTANT: This file is loaded via `patches:` in kustomization.yaml, not
# `resources:`. The namespaces themselves are created elsewhere (HelmRelease
# `createNamespace: true`, or per-app `00-namespace.yaml`); we just stamp the
# PSS labels onto them at kustomize-build time.
#
# audit + warn only — these do not block pod creation. Audit-log events
# fire on pods that violate the baseline PSS profile; kubectl apply
# warnings surface the same to developers.
#
# Tier labels:
#   tier=data    → tenant application namespaces
#   tier=system  → cluster infrastructure (privileged workloads expected)
#
# When graduating to enforce mode in Phase 2, only tier=data namespaces
# get `pod-security.kubernetes.io/enforce: baseline` initially. tier=system
# stays unrestricted because they legitimately need privileged access.
---
apiVersion: v1
kind: Namespace
metadata:
  name: home-automation
  labels:
    tier: data
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    tier: data
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
