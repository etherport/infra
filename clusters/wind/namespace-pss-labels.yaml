# Pod Security Standards labels per namespace (strategic-merge patches).
#
# IMPORTANT: This file is loaded via `patches:` in kustomization.yaml, not
# `resources:`. The namespaces themselves are created elsewhere (HelmRelease
# `createNamespace: true`, or per-app `00-namespace.yaml`); we just stamp the
# PSS labels onto them at kustomize-build time.
#
# Tier labels:
#   tier=data    → tenant application namespaces
#   tier=system  → cluster infrastructure (privileged workloads expected)
#
# Phase 2 (2026-06-02): tier=data namespaces with ZERO baseline violations
# (verified by scanning live pods) graduate to `enforce: baseline` — new
# violating pods are rejected at admission; existing pods are unaffected.
# audit+warn are kept alongside enforce so violations are still logged/surfaced.
# Three tier=data namespaces stay audit/warn-only because they run legitimately
# elevated pods that baseline would block:
#   - home-automation: Home Assistant runs privileged (USB/hardware access)
#   - monitoring:      node-exporter (hostNetwork/PID), alloy (hostPath), grafana
#   - tailscale:       operator/proxy pods need NET_ADMIN
# tier=system wireguard stays unrestricted by design (hostNetwork+NET_ADMIN);
# plex graduated to enforce=baseline 2026-07-01 (L27 — device-plugin GPU, not privileged).
#
# L36 (2026-07-09): namespaces whose LIVE pods already satisfy the `restricted`
# PSS (verified via `kubectl label ns <ns> enforce=restricted --dry-run=server` →
# zero existing-pod violations) graduate audit+warn to `restricted` while ENFORCE
# stays baseline — a non-blocking early-warning so any future sub-restricted pod
# surfaces as a warning/audit event (regression signal + a nudge toward eventual
# enforce=restricted, like unifi-poller). enforce is deliberately NOT bumped (a
# future baseline-but-not-restricted pod would be rejected). The nine clean today:
# authentik, cert-manager, cloudflare-ddns, cloudflared, cnpg-system, kyverno,
# postgres, traefik, unifi-cert-sync. (dns/cue/ollama/wikijs/backups/rclone/
# auto-remediation/cloudwatch-to-loki are baseline-clean but NOT restricted-clean —
# they run as root / lack seccompProfile — so they keep audit/warn=baseline.)
---
apiVersion: v1
kind: Namespace
metadata:
  name: home-automation
  labels:
    tier: data
    # audit/warn only — HA pod is privileged (hardware access). See header.
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    tier: data
    # audit/warn only — node-exporter/alloy/grafana need host access. See header.
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    # H3 tier 5 (2026-06-22): NetworkPolicy OBSERVATION (audit on). Widest-fanout
    # namespace (Prometheus scrapes everything). 14-tier-monitoring.yaml enforces
    # nothing while audit is on — observe Loki {job="hubble-audit"}, refine, then
    # flip audit OFF to enforce. Helm-created ns; labelled here via the PSS patch.
    netpol.wind/enforced: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: postgres
  labels:
    tier: data
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
  labels:
    tier: data
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/enforce: baseline
    # H3 tier 4 (2026-06-22): NetworkPolicy ENFORCED (13-tier-traefik.yaml),
    # validated via the audit toggle. (Traefik ns is Helm-created; labelled here
    # via the PSS strategic-merge patch, not a 00-namespace.yaml.)
    netpol.wind/enforced: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: dns
  labels:
    tier: data
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: wikijs
  labels:
    tier: data
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: ollama
  labels:
    tier: data
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: backups
  labels:
    tier: data
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  labels:
    tier: data
    # audit/warn only — operator/proxy pods need NET_ADMIN. See header.
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
# Phase 2 extension (2026-06-02): additional tenant app namespaces, all scanned
# with zero baseline violations → straight to enforce. (cue deployed this round;
# cert-manager/cloudflare-ddns/rclone/auto-remediation/unifi-cert-sync/
# cloudwatch-to-loki were running unlabeled.)
apiVersion: v1
kind: Namespace
metadata:
  name: cue
  labels:
    tier: data
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/enforce: baseline
---
# NOTE: cert-manager + rclone-gdrive are intentionally NOT here — their
# Namespaces are created by HelmReleases/runtime, not in the kustomize build,
# so a strategic-merge patch has no target and breaks the whole build. PSS for
# those would need to be set on the namespace at its creation source instead.
apiVersion: v1
kind: Namespace
metadata:
  name: cloudflare-ddns
  labels:
    tier: data
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: rclone
  labels:
    tier: data
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: auto-remediation
  labels:
    tier: data
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: unifi-cert-sync
  labels:
    tier: data
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: cloudwatch-to-loki
  labels:
    tier: data
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/enforce: baseline
---
# Cluster-infra namespaces that are baseline-clean → enforce baseline (M72 tail,
# 2026-06-28). tier=system (infra), but unlike plex/wireguard below these run NO
# privileged pods, so baseline IS enforced. Verified clean via
# `kubectl label ns <ns> pod-security.kubernetes.io/enforce=baseline --dry-run=server`
# (no existing-pod violation warnings). Namespaces are build targets here (the
# Namespace manifest ships in helm-releases/{cert-manager,cnpg}.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    tier: system
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-system
  labels:
    tier: system
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/enforce: baseline
---
# kyverno: the admission-policy engine itself (L27, 2026-07-01 — verified clean
# via server dry-run; webhooks/controllers run unprivileged).
apiVersion: v1
kind: Namespace
metadata:
  name: kyverno
  labels:
    tier: system
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/enforce: baseline
---
# Privileged-by-design namespaces — tier=system, no PSS enforcement.
apiVersion: v1
kind: Namespace
metadata:
  name: plex
  labels:
    tier: system
    # L27 (2026-07-01): the old "GPU passthrough needs privileged" note was STALE —
    # plex consumes nvidia.com/gpu.shared via the gpu-operator device plugin, no
    # privileged container. Verified clean via server dry-run → baseline enforced.
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: wireguard
  labels:
    tier: system  # hostNetwork + NET_ADMIN for VPN tunnels
---
# flux-system: GitOps engine. enforce=baseline (flux always complies; restricted is
# achievable per dry-run but baseline avoids any future-upgrade wedge risk on the
# critical reconciler). warn=restricted already set by the flux bootstrap (gotk-components).
apiVersion: v1
kind: Namespace
metadata:
  name: flux-system
  labels:
    pod-security.kubernetes.io/enforce: baseline
