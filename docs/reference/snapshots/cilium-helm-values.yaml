# Snapshot of the LIVE cilium helm user values (H45a/M126d, 2026-07-02).
# Regenerate after any `helm upgrade cilium`: `helm -n kube-system get values cilium`.
# NB policyAuditMode here is the DURABLE truth — the M115 upgrade nearly
# re-enabled audit mode because a ConfigMap hand-patch had drifted from these
# values (charter A7). Verify `cilium-dbg config | grep -i audit` after rollouts.
