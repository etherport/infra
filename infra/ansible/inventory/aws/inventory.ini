# AWS Infrastructure
# Connected via WireGuard VPN (10.10.100.0/24)
#
# Usage with playbooks:
#   ansible-playbook -i inventory/aws/ playbooks/base.yml
#   ansible-playbook -i inventory/aws/ playbooks/swap.yml
#   ansible-playbook -i inventory/aws/ playbooks/cloudwatch-agent.yml
#   ansible-playbook -i inventory/aws/ playbooks/technitium.yml --limit dns-aws
#   ansible-playbook -i inventory/aws/ playbooks/wireguard.yml --limit vpn-aws
#   ansible-playbook -i inventory/aws/ playbooks/tailscale.yml --limit vpn-aws
#
# For new instances, run in order:
#   1. base.yml (system config, packages, node_exporter)
#   2. swap.yml (create swap file - essential for t4g.nano)
#   3. cloudwatch-agent.yml (memory/swap metrics)
#   4. Service-specific playbook (technitium, wireguard, tailscale)

[all]
dns-aws      ansible_host=10.10.100.5   ip=10.10.100.5
vpn-aws      ansible_host=10.10.100.10  ip=10.10.100.10

[dns_servers]
dns-aws

[vpn_servers]
vpn-aws

[tailscale_nodes]
vpn-aws

[all:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
ansible_become=true
