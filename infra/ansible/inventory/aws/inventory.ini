# AWS Infrastructure — ONE consolidated edge box (M110, since 2026-07-02):
# vpn-aws = EC2 "private-infra_edge" (t4g.small, us-west-2), private 10.10.100.10,
# EIP 44.240.60.80. It carries WireGuard (wg0 S2S + wg1 remote), Tailscale
# (subnet router + exit node) AND Technitium DNS — the separate dns-aws
# instance was destroyed and its EIP released.
#
# SSH is CERT-ONLY (M76 parity 2026-07-02): the box trusts the step-ca user CA;
# CI mints a short-lived cert per run (setup-ssh-cert action). The static
# automation key is rejected (survives only as the cloud-init rebuild seed).
#
# Usage with playbooks:
#   ansible-playbook -i inventory/aws/ playbooks/base.yml
#   ansible-playbook -i inventory/aws/ playbooks/swap.yml
#   ansible-playbook -i inventory/aws/ playbooks/cloudwatch-agent.yml
#   ansible-playbook -i inventory/aws/ playbooks/technitium.yml
#   ansible-playbook -i inventory/aws/ playbooks/wireguard.yml
#   ansible-playbook -i inventory/aws/ playbooks/tailscale.yml
#
# For a rebuilt instance, run in order:
#   1. base.yml (system config, packages, node_exporter)
#   2. swap.yml (create swap file)
#   3. cloudwatch-agent.yml (memory/swap metrics)
#   4. Service-specific playbooks (technitium, wireguard, tailscale)
#   5. step-ca-trust.yml (via the bootstrap key), verify cert SSH, then
#      step-ca-remove-static-key.yml

[all]
# ansible_host = SSH target; ip = the box's private IP (service binding). vpn-aws
# is reached over its PUBLIC EIP: the homelab→AWS WireGuard site-to-site tunnel
# (10.10.100.0/22) rides a lossy ISP path (M124 packet-loss waves are ISP-side,
# not instance-side) while the public path is reliable; SSH there is SG-restricted
# to the homelab WANs (allow_ssh + the dns-restrict-ip Lambda), and the CI runner
# egresses via that WAN. CI keeps ANSIBLE_TIMEOUT=60 + ControlMaster for the same
# reason. (Part of the historic "CI can't reach vpn-aws" was also a 12s sudo stall
# on hostname lookup — fixed by an /etc/hosts entry on the box, 2026-07-02.)
vpn-aws      ansible_host=44.240.60.80   ip=10.10.100.10

[dns_servers]
# M110 (2026-07-02): the consolidated edge box carries the DNS role (dns-aws destroyed).
vpn-aws

[vpn_servers]
vpn-aws

[tailscale_nodes]
vpn-aws

[all:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
ansible_become=true
