# AWS Infrastructure
# Connected via WireGuard VPN (10.10.100.0/24)
#
# Usage with playbooks:
#   ansible-playbook -i inventory/aws/ playbooks/base.yml
#   ansible-playbook -i inventory/aws/ playbooks/swap.yml
#   ansible-playbook -i inventory/aws/ playbooks/cloudwatch-agent.yml
#   ansible-playbook -i inventory/aws/ playbooks/technitium.yml --limit vpn-aws
#   ansible-playbook -i inventory/aws/ playbooks/wireguard.yml --limit vpn-aws
#   ansible-playbook -i inventory/aws/ playbooks/tailscale.yml --limit vpn-aws
#
# For new instances, run in order:
#   1. base.yml (system config, packages, node_exporter)
#   2. swap.yml (create swap file - essential for t4g.nano)
#   3. cloudwatch-agent.yml (memory/swap metrics)
#   4. Service-specific playbook (technitium, wireguard, tailscale)

[all]
# ansible_host = SSH target; ip = the box's private IP (service binding). vpn-aws
# is reached over its PUBLIC EIP because the homelab→AWS WireGuard site-to-site
# tunnel (10.10.100.0/22) proved flaky for CI (1/3 reachable post-resize) while
# the public path is 3/3; SSH there is SG-restricted to the homelab WANs (allow_ssh
# + the dns-restrict-ip Lambda), and the CI runner egresses via that WAN. Revert to
# the private/Tailscale path once the tunnel is confirmed stable (M110 Phase 1 SG).
vpn-aws      ansible_host=44.240.60.80   ip=10.10.100.10

[dns_servers]
# M110 (2026-07-02): the consolidated edge box carries the DNS role (dns-aws destroyed).
vpn-aws

[vpn_servers]
vpn-aws

[tailscale_nodes]
vpn-aws

[all:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
ansible_become=true
