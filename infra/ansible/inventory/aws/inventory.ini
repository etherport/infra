# AWS Infrastructure
# Connected via WireGuard VPN (10.10.100.0/24)

[all]
dns-aws      ansible_host=10.10.100.5   ip=10.10.100.5
vpn-aws      ansible_host=10.10.100.10  ip=10.10.100.10

[dns_servers]
dns-aws

[vpn_servers]
vpn-aws

[tailscale_nodes]
vpn-aws

[all:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
ansible_become=true
