# Kubernetes Cluster - Wind
# 3 control planes (HA) + 5 workers (4 standard + 1 GPU)

[all]
# Control plane nodes
k8s-cp1      ansible_host=10.10.201.50 ip=10.10.201.50
k8s-cp2      ansible_host=10.10.201.51 ip=10.10.201.51
k8s-cp3      ansible_host=10.10.201.52 ip=10.10.201.52

# Worker nodes
k8s-w1       ansible_host=10.10.201.53 ip=10.10.201.53
k8s-w2       ansible_host=10.10.201.54 ip=10.10.201.54
k8s-w3       ansible_host=10.10.201.55 ip=10.10.201.55
k8s-w4       ansible_host=10.10.201.56 ip=10.10.201.56
k8s-gpu1     ansible_host=10.10.201.60 ip=10.10.201.60

# Standalone VMs (outside K8s)
dns-fallback ansible_host=10.10.201.6  ip=10.10.201.6
vpn-fallback    ansible_host=10.10.201.15 ip=10.10.201.15
gh-runner    ansible_host=10.10.201.30 ip=10.10.201.30
asterisk-sbc ansible_host=10.10.201.40 ip=10.10.201.40
devbox       ansible_host=10.10.201.45 ip=10.10.201.45
step-ca      ansible_host=10.10.201.46 ip=10.10.201.46
home-radio   ansible_host=10.10.201.41 ip=10.10.201.41
pve          ansible_host=pve.wind.etherport.net

[kube_control_plane]
k8s-cp1
k8s-cp2
k8s-cp3

[etcd:children]
kube_control_plane

[kube_node]
k8s-w1
k8s-w2
k8s-w3
k8s-w4
k8s-gpu1

[k8s_cluster:children]
kube_control_plane
kube_node

[dns_servers]
dns-fallback

[vpn_servers]
vpn-fallback

[tailscale_nodes]
vpn-fallback

[proxmox_hosts]
pve

[gh_runners]
gh-runner

[sbc_servers]
asterisk-sbc

[devboxes]
devbox

[step_ca]
step-ca

[all:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
ansible_become=true
ansible_ssh_common_args='-o PreferredAuthentications=publickey -o PubkeyAuthentication=yes -o StrictHostKeyChecking=accept-new'

# PVE is a hypervisor — root-over-SSH is the PVE convention (no
# multi-tenant admin model applies). graham is a personal interactive
# login on PVE; automation runs as root. Auth is CERT-ONLY (M76): pve
# trusts the step-ca user CA and the static automation@homelab key was
# removed from authorized_keys (it survives only as a bootstrap seed for
# rebuilds — enroll via console/local SSH, then strip it). pve-sshd.yml
# keeps the /root and /home/graham authorized_keys lists canonical.
[proxmox_hosts:vars]
ansible_user=root

# dns_servers + vpn_servers now use the standard `ubuntu` user
# (inherited from [all:vars]) since the rebuild on 2026-05-16 swapped
# their template from the old image to VM 9001.
