[all]
k8s-cp1      ansible_host=10.10.201.50 ip=10.10.201.50
k8s-w1       ansible_host=10.10.201.51 ip=10.10.201.51
k8s-w2       ansible_host=10.10.201.52 ip=10.10.201.52
k8s-w3       ansible_host=10.10.201.53 ip=10.10.201.53
k8s-gpu1     ansible_host=10.10.201.60 ip=10.10.201.60
dns-fallback ansible_host=10.10.201.6  ip=10.10.201.6
vpn-local    ansible_host=10.10.201.15 ip=10.10.201.15
pve          ansible_host=pve.wind.etherport.net

[kube_control_plane]
k8s-cp1

[etcd:children]
kube_control_plane

[kube_node]
k8s-w1
k8s-w2
k8s-w3
k8s-gpu1

[k8s_cluster:children]
kube_control_plane
kube_node

[dns_servers]
dns-fallback

[vpn_servers]
vpn-local

[tailscale_nodes]
vpn-local

[proxmox_hosts]
pve

[all:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
ansible_become=true
# Use PreferredAuthentications to skip GSSAPI and allow more key attempts
ansible_ssh_common_args='-o PreferredAuthentications=publickey -o PubkeyAuthentication=yes'

# Override for Proxmox host (uses graham until migrated)
[proxmox_hosts:vars]
ansible_user=graham