# Kubernetes Cluster - Wind
# 3 control planes (HA) + 5 workers (4 standard + 1 GPU)

[all]
# Control plane nodes
k8s-cp1      ansible_host=10.10.201.50 ip=10.10.201.50
k8s-cp2      ansible_host=10.10.201.51 ip=10.10.201.51
k8s-cp3      ansible_host=10.10.201.52 ip=10.10.201.52

# Worker nodes
k8s-w1       ansible_host=10.10.201.53 ip=10.10.201.53
k8s-w2       ansible_host=10.10.201.54 ip=10.10.201.54
k8s-w3       ansible_host=10.10.201.55 ip=10.10.201.55
k8s-w4       ansible_host=10.10.201.56 ip=10.10.201.56
k8s-gpu1     ansible_host=10.10.201.60 ip=10.10.201.60

# Standalone VMs (outside K8s)
dns-fallback ansible_host=10.10.201.6  ip=10.10.201.6
vpn-local    ansible_host=10.10.201.15 ip=10.10.201.15
pve          ansible_host=pve.wind.etherport.net

[kube_control_plane]
k8s-cp1
k8s-cp2
k8s-cp3

[etcd:children]
kube_control_plane

[kube_node]
k8s-w1
k8s-w2
k8s-w3
k8s-w4
k8s-gpu1

[k8s_cluster:children]
kube_control_plane
kube_node

[dns_servers]
dns-fallback

[vpn_servers]
vpn-local

[tailscale_nodes]
vpn-local

[proxmox_hosts]
pve

[all:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
ansible_become=true
ansible_ssh_common_args='-o PreferredAuthentications=publickey -o PubkeyAuthentication=yes'

# Override for Proxmox host (uses graham until migrated)
[proxmox_hosts:vars]
ansible_user=graham

# Override for standalone VMs (still using graham until rebuilt)
[dns_servers:vars]
ansible_user=graham

[vpn_servers:vars]
ansible_user=graham
