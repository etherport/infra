---
# Base System Configuration Playbook
# Configures common system settings for all non-K8s hosts
#
# Usage:
#   # All non-K8s hosts (local + AWS)
#   ansible-playbook -i inventory/wind/ -i inventory/aws/ playbooks/base.yml --limit 'all:!k8s_cluster'
#
#   # Local VMs only
#   ansible-playbook -i inventory/wind/ playbooks/base.yml --limit 'dns_servers,vpn_servers'
#
#   # AWS only
#   ansible-playbook -i inventory/aws/ playbooks/base.yml
#
#   # Check mode
#   ansible-playbook -i inventory/wind/ -i inventory/aws/ playbooks/base.yml --check --diff
#
# This playbook manages:
#   - Timezone configuration
#   - NTP (chrony/systemd-timesyncd)
#   - Unattended security upgrades
#   - Common packages
#   - SSH hardening basics

- name: Base System Configuration
  hosts: all:!k8s_cluster
  become: true

  vars:
    # Timezone - set for US Pacific
    system_timezone: "America/Los_Angeles"

    # NTP servers - use local NTP if available, fallback to public
    ntp_servers:
      - 10.10.200.1  # UDM Pro / local gateway
      - time.cloudflare.com
      - time.google.com

    # Base packages to install on all systems
    base_packages:
      - curl
      - wget
      - vim
      - htop
      - jq
      - unattended-upgrades
      - apt-listchanges
      - needrestart

    # Unattended upgrades configuration
    unattended_upgrades:
      # Security + regular (-updates) bug-fix updates. Broadened from
      # security-only 2026-06-23 (M101) so -updates packages auto-install too
      # (previously they accumulated unpatched). Third-party repos (1Password,
      # NodeSource) are still out of scope — not Ubuntu origins.
      allowed_origins:
        - "${distro_id}:${distro_codename}"
        - "${distro_id}:${distro_codename}-security"
        - "${distro_id}:${distro_codename}-updates"
        - "${distro_id}ESMApps:${distro_codename}-apps-security"
        - "${distro_id}ESM:${distro_codename}-infra-security"
      # Auto-reboot when kernel updates require it
      automatic_reboot: "true"
      # Remove unused dependencies
      remove_unused_deps: "true"
      # Mail notifications (set to empty to disable)
      mail_to: ""
      # Packages to never auto-upgrade
      blacklist:
        - wireguard
        - wireguard-tools

    # Staggered reboot times to avoid simultaneous outages
    # Format: "HH:MM" in local timezone
    reboot_times:
      dns-fallback: "02:00"
      dns-aws: "02:30"
      vpn-local: "03:00"
      vpn-aws: "03:30"
      devbox: "05:00"        # runs the persistent Claude tmux sessions; they auto-resume on reboot
      default: "04:00"

    # Node exporter for Prometheus monitoring
    node_exporter_version: "1.8.2"
    node_exporter_port: 9100

  tasks:
    # =========================================================================
    # System time and timezone
    # =========================================================================
    - name: Set timezone
      timezone:
        name: "{{ system_timezone }}"

    - name: Install chrony for NTP
      apt:
        name: chrony
        state: present
        update_cache: yes
        cache_valid_time: 3600

    - name: Configure chrony NTP servers
      template:
        src: chrony.conf.j2
        dest: /etc/chrony/chrony.conf
        owner: root
        group: root
        mode: "0644"
        backup: yes
      notify: Restart chrony

    - name: Enable and start chrony
      systemd:
        name: chrony
        enabled: yes
        state: started

    # =========================================================================
    # Base packages
    # =========================================================================
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install base packages
      apt:
        name: "{{ base_packages }}"
        state: present

    # =========================================================================
    # Unattended upgrades configuration
    # =========================================================================
    - name: Configure unattended-upgrades allowed origins
      copy:
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          // Automatically upgrade packages from these origins
          Unattended-Upgrade::Allowed-Origins {
          {% for origin in unattended_upgrades.allowed_origins %}
              "{{ origin }}";
          {% endfor %}
          };

          // Packages to NOT automatically upgrade
          Unattended-Upgrade::Package-Blacklist {
          {% for pkg in unattended_upgrades.blacklist %}
              "{{ pkg }}";
          {% endfor %}
          };

          // Automatically reboot if required
          Unattended-Upgrade::Automatic-Reboot "{{ unattended_upgrades.automatic_reboot }}";

          // Reboot time (staggered per host to avoid simultaneous outages)
          Unattended-Upgrade::Automatic-Reboot-Time "{{ reboot_times[inventory_hostname] | default(reboot_times.default) }}";

          // Remove unused automatically installed packages
          Unattended-Upgrade::Remove-Unused-Dependencies "{{ unattended_upgrades.remove_unused_deps }}";

          // Remove unused kernel packages
          Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";

          {% if unattended_upgrades.mail_to %}
          // Send email notifications
          Unattended-Upgrade::Mail "{{ unattended_upgrades.mail_to }}";
          Unattended-Upgrade::MailReport "on-change";
          {% endif %}

          // Enable logging
          Unattended-Upgrade::SyslogEnable "true";
          Unattended-Upgrade::SyslogFacility "daemon";
      notify: Restart unattended-upgrades

    - name: Configure apt periodic updates
      copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::Download-Upgradeable-Packages "1";
          APT::Periodic::AutocleanInterval "7";

    - name: Enable unattended-upgrades service
      systemd:
        name: unattended-upgrades
        enabled: yes
        state: started

    # =========================================================================
    # SSH hardening (basic settings)
    # =========================================================================
    - name: Ensure SSH key-based auth is preferred
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PasswordAuthentication"
        line: "PasswordAuthentication no"
        state: present
      notify: Restart SSH

    - name: Disable root login via SSH
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PermitRootLogin"
        line: "PermitRootLogin prohibit-password"
        state: present
      notify: Restart SSH

    # =========================================================================
    # System tuning
    # =========================================================================
    - name: Configure vm.swappiness
      sysctl:
        name: vm.swappiness
        value: "10"
        sysctl_file: /etc/sysctl.d/99-tuning.conf
        reload: yes

    - name: Configure fs.file-max
      sysctl:
        name: fs.file-max
        value: "2097152"
        sysctl_file: /etc/sysctl.d/99-tuning.conf
        reload: yes

    # =========================================================================
    # Prometheus Node Exporter for monitoring
    # =========================================================================
    - name: Check if node_exporter is installed
      stat:
        path: /usr/local/bin/node_exporter
      register: node_exporter_binary

    - name: Get installed node_exporter version
      command: /usr/local/bin/node_exporter --version
      register: installed_version
      changed_when: false
      failed_when: false
      when: node_exporter_binary.stat.exists

    - name: Determine system architecture
      set_fact:
        node_exporter_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

    - name: Download node_exporter
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
        dest: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
        mode: "0644"
      when: not node_exporter_binary.stat.exists or (installed_version.stdout is defined and node_exporter_version not in installed_version.stdout)

    - name: Extract node_exporter
      unarchive:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
        dest: /tmp
        remote_src: yes
      when: not node_exporter_binary.stat.exists or (installed_version.stdout is defined and node_exporter_version not in installed_version.stdout)

    - name: Install node_exporter binary
      copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"
        dest: /usr/local/bin/node_exporter
        mode: "0755"
        owner: root
        group: root
        remote_src: yes
      when: not node_exporter_binary.stat.exists or (installed_version.stdout is defined and node_exporter_version not in installed_version.stdout)
      notify: Restart node_exporter

    - name: Create node_exporter user
      user:
        name: node_exporter
        system: yes
        shell: /usr/sbin/nologin
        create_home: no

    - name: Create node_exporter systemd service
      copy:
        dest: /etc/systemd/system/node_exporter.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          Documentation=https://prometheus.io/docs/guides/node-exporter/
          After=network-online.target

          [Service]
          User=node_exporter
          Group=node_exporter
          Type=simple
          ExecStart=/usr/local/bin/node_exporter \
            --web.listen-address=:{{ node_exporter_port }} \
            --collector.systemd \
            --collector.processes
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify: Restart node_exporter

    - name: Enable and start node_exporter
      systemd:
        name: node_exporter
        enabled: yes
        state: started
        daemon_reload: yes

    - name: Clean up node_exporter download
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
        - "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}"
      ignore_errors: yes

    # =========================================================================
    # AI advisor SSH access — Phase 3 remediation actions
    # =========================================================================
    # The auto-remediation controller in K8s needs to SSH out to non-K8s
    # hosts to run a tight allowlist of remediation commands
    # (technitium log prune, systemd unit restart, journalctl vacuum).
    #
    # Security model:
    #   1. Dedicated `advisor-remediation` user (NOT graham, NOT ubuntu) —
    #      single-purpose, easy to audit + revoke.
    #   2. Authorized_key forced to specific commands via `command="..."`
    #      restriction — even with the key, SSH only runs the wrapped script.
    #   3. Wrapper script `/usr/local/sbin/advisor-remediation.sh` validates
    #      its own args against a hardcoded allowlist before dispatching.
    #   4. NOPASSWD sudo for the wrapper script only — nothing else.
    #
    # Public key: cluster-side, in K8s SOPS secret advisor-ssh-key. Updated
    # 2026-05-25 when key was generated. To rotate, regenerate the key in
    # 1P "AI Advisor SSH Key" item + re-encrypt the K8s secret + re-run
    # this play to push the new pubkey.
    - name: Create advisor-remediation user
      ansible.builtin.user:
        name: advisor-remediation
        comment: "AI advisor remediation actions (Phase 3 SSH)"
        shell: /bin/bash
        create_home: true
        state: present
      when: inventory_hostname in ['dns-aws', 'dns-fallback', 'vpn-local', 'vpn-aws']

    - name: Install advisor-remediation wrapper script
      ansible.builtin.copy:
        dest: /usr/local/sbin/advisor-remediation.sh
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/usr/bin/env bash
          # Wrapped command for the advisor's SSH key. Validates the action +
          # args against a hardcoded allowlist before dispatching. The key in
          # ~/.ssh/authorized_keys forces command="/usr/local/sbin/advisor-remediation.sh"
          # so the client's "original" command is ignored.
          #
          # The original SSH command lands in $SSH_ORIGINAL_COMMAND. Parse it
          # as: <action> <arg1> <arg2> ... (whitespace-separated, no shell).
          set -euo pipefail

          CMD="${SSH_ORIGINAL_COMMAND:-}"
          if [ -z "$CMD" ]; then
            echo "advisor-remediation: empty command" >&2
            exit 2
          fi

          # Tokenize on whitespace, NO shell expansion.
          read -r -a ARGS <<< "$CMD"
          ACTION="${ARGS[0]:-}"

          # Audit log every invocation (journald + syslog)
          logger -t advisor-remediation "invoked action=$ACTION args=${ARGS[*]:1}"

          case "$ACTION" in
            prune-logdir)
              # args: <logdir-key> <days>
              KEY="${ARGS[1]:-}"
              DAYS="${ARGS[2]:-7}"
              # Allowlist of log dirs (NOT user-input paths)
              case "$KEY" in
                technitium-logs)  DIR=/opt/technitium/config/logs ;;
                technitium-stats) DIR=/opt/technitium/config/stats ;;
                *) echo "advisor-remediation: unknown logdir key '$KEY'" >&2; exit 3 ;;
              esac
              # Validate days as integer between 1 and 365
              [[ "$DAYS" =~ ^[0-9]+$ ]] || { echo "days not integer"; exit 3; }
              [ "$DAYS" -ge 1 ] && [ "$DAYS" -le 365 ] || { echo "days out of range"; exit 3; }
              if [ -d "$DIR" ]; then
                sudo find "$DIR" -maxdepth 1 -type f -mtime "+${DAYS}" -delete
                echo "ok: pruned $DIR older than ${DAYS}d"
              else
                echo "ok: $DIR does not exist (nothing to prune)"
              fi
              ;;

            restart-unit)
              # args: <unit-key>
              KEY="${ARGS[1]:-}"
              # Allowlist of units we permit restart of
              case "$KEY" in
                technitium) UNIT=technitium ;;
                wireguard)  UNIT=wg-quick@wg0 ;;
                kubelet)    UNIT=kubelet ;;
                *) echo "advisor-remediation: unknown unit key '$KEY'" >&2; exit 3 ;;
              esac
              sudo systemctl restart "$UNIT"
              echo "ok: restarted $UNIT"
              ;;

            journal-vacuum)
              # args: <size-mb>
              SIZE="${ARGS[1]:-100}"
              [[ "$SIZE" =~ ^[0-9]+$ ]] || { echo "size not integer"; exit 3; }
              [ "$SIZE" -ge 10 ] && [ "$SIZE" -le 1000 ] || { echo "size out of range (10-1000 MB)"; exit 3; }
              sudo journalctl --vacuum-size="${SIZE}M"
              echo "ok: journalctl vacuumed to ${SIZE}M"
              ;;

            *)
              echo "advisor-remediation: unknown action '$ACTION'" >&2
              echo "allowed: prune-logdir, restart-unit, journal-vacuum" >&2
              exit 3
              ;;
          esac
      when: inventory_hostname in ['dns-aws', 'dns-fallback', 'vpn-local', 'vpn-aws']

    - name: Install sudoers rule for advisor-remediation
      ansible.builtin.copy:
        dest: /etc/sudoers.d/advisor-remediation
        owner: root
        group: root
        mode: '0440'
        validate: visudo -cf %s
        content: |
          # NOPASSWD sudo for the exact commands the advisor's wrapper
          # script invokes. Cmnd_Alias keeps the list narrow + auditable.
          Cmnd_Alias ADVISOR_FIND_DELETE = \
            /usr/bin/find /opt/technitium/config/logs -maxdepth 1 -type f -mtime *, \
            /usr/bin/find /opt/technitium/config/stats -maxdepth 1 -type f -mtime *
          Cmnd_Alias ADVISOR_SYSTEMCTL = \
            /usr/bin/systemctl restart technitium, \
            /usr/bin/systemctl restart wg-quick@wg0, \
            /usr/bin/systemctl restart kubelet
          Cmnd_Alias ADVISOR_JOURNALCTL = /usr/bin/journalctl --vacuum-size=*
          advisor-remediation ALL=(root) NOPASSWD: ADVISOR_FIND_DELETE, ADVISOR_SYSTEMCTL, ADVISOR_JOURNALCTL
      when: inventory_hostname in ['dns-aws', 'dns-fallback', 'vpn-local', 'vpn-aws']

    - name: Install advisor pubkey with command restriction
      ansible.posix.authorized_key:
        user: advisor-remediation
        state: present
        # command="..." forces every SSH session to run the wrapper script,
        # ignoring whatever the client tried to execute.
        # no-port-forwarding etc. further harden — no tunnels, no PTY, no env.
        key_options: 'command="/usr/local/sbin/advisor-remediation.sh",no-port-forwarding,no-X11-forwarding,no-agent-forwarding,no-pty,no-user-rc'
        key: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHXO0PZ9MkM+axg0Ml/fYMz3JEfJSGkATB3wGUYdjYug ai-advisor@auto-remediation'
        comment: 'AI advisor Phase 3 remediation (auto-remediation/remediation-controller)'
      when: inventory_hostname in ['dns-aws', 'dns-fallback', 'vpn-local', 'vpn-aws']

    # =========================================================================
    # Clean up
    # =========================================================================
    - name: Remove unnecessary packages
      apt:
        name:
          - popularity-contest
        state: absent
        purge: yes
      ignore_errors: yes

    - name: Run apt autoremove
      apt:
        autoremove: yes
        purge: yes

  # ===========================================================================
  # Handlers
  # ===========================================================================
  handlers:
    - name: Restart chrony
      systemd:
        name: chrony
        state: restarted

    - name: Restart unattended-upgrades
      systemd:
        name: unattended-upgrades
        state: restarted

    - name: Restart SSH
      systemd:
        name: ssh
        state: restarted

    - name: Restart node_exporter
      systemd:
        name: node_exporter
        state: restarted
        daemon_reload: yes
