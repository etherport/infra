---
# Re-enable Ceph msgr2 (v2 wire protocol) on port 3300.
#
# Why: PVE's Ceph mon currently listens only on 6789 (msgr v1). msgr2
# (Ceph Nautilus+ default) supports encryption-in-transit and is
# preferred by modern Ceph clients.
#
# Two-part fix:
#   1. Set `ms_bind_msgr2 = true` in ceph.conf [global]. This is the
#      runtime-binding flag; required for new mon starts.
#   2. Run `ceph mon enable-msgr2` to update the cluster monmap so
#      the mon's `public_addrs` advertises both v1 and v2 addresses.
#      Without this, the monmap stays v1-only even after restart and
#      clients won't discover the v2 endpoint.
#
# DISCOVERY 2026-05-21: inspecting ceph.conf showed `mon_host = 10.10.210.41`
# (no `[v2:...]` prefix), confirming the monmap is v1-only. ms_bind_msgr2
# is unset (defaults true on Pacific+), but the addrvec was never
# upgraded. `ceph mon enable-msgr2` is idempotent — safe to run.
#
# Risk: `ceph mon enable-msgr2` triggers a mon restart. Single-mon
# cluster (mon.pve) = NO HA → clients see a ~10s I/O pause. Sidecars
# retry; K8s PVCs may report transient bind errors. Run in a window.
#
# Verification:
#   - `ss -tlnp | grep 3300` on PVE → mon listening on :3300
#   - `ceph mon dump --format json | jq '.mons[0].public_addrs.addrvec'`
#     → array contains both `{type: "v2", port: 3300}` and `{type: "v1", port: 6789}`
#
# Follow-up (NOT done by this playbook):
#   - Update platform/kubernetes/storage/ceph-csi/csi-config-map.yaml to
#     list `10.10.210.41:3300` ahead of `10.10.210.41:6789` so new RBD
#     mounts prefer msgr2. Flux reconciles; existing connections keep
#     using v1 until next pod restart.
#
# Usage:
#   gh workflow run ansible-proxmox.yml -f playbook=ceph-msgr2 -f action=check
#   gh workflow run ansible-proxmox.yml -f playbook=ceph-msgr2 -f action=apply

- name: PVE Ceph msgr2 re-enable
  hosts: proxmox_hosts
  become: true
  gather_facts: false

  tasks:
    - name: Verify this is a Proxmox VE host with Ceph
      ansible.builtin.stat:
        path: /etc/ceph/ceph.conf
      register: ceph_conf
      failed_when: not ceph_conf.stat.exists

    - name: Read current ceph.conf
      ansible.builtin.slurp:
        src: /etc/ceph/ceph.conf
      register: ceph_conf_content

    - name: Show current ms_bind_msgr2 state
      ansible.builtin.debug:
        msg: >-
          ms_bind_msgr2 currently:
          {{ 'EXPLICITLY SET — ' + (ceph_conf_content.content | b64decode | regex_search('ms_bind_msgr2\s*=\s*\S+')) if (ceph_conf_content.content | b64decode | regex_search('ms_bind_msgr2'))
             else 'NOT SET (defaults to true on Pacific+, but port 3300 not listening — investigate)' }}

    - name: Probe port 3300 (msgr2) listening BEFORE change
      ansible.builtin.shell: |
        ss -tln | awk '$4 ~ /:3300$/ {print "LISTENING:", $4; found=1} END {if (!found) print "NOT LISTENING"}'
      args:
        executable: /bin/bash
      changed_when: false
      register: msgr2_before

    - name: BEFORE state
      ansible.builtin.debug:
        msg: "{{ msgr2_before.stdout }}"

    - name: Ensure [global] ms_bind_msgr2 = true in ceph.conf
      community.general.ini_file:
        path: /etc/ceph/ceph.conf
        section: global
        option: ms_bind_msgr2
        value: 'true'
        backup: true
        mode: '0644'
      register: ceph_conf_changed

    - name: Ensure [global] ms_bind_msgr1 = true in ceph.conf (keep v1 for legacy clients)
      community.general.ini_file:
        path: /etc/ceph/ceph.conf
        section: global
        option: ms_bind_msgr1
        value: 'true'
        backup: true
        mode: '0644'

    - name: Inspect current monmap for v2 endpoint
      ansible.builtin.shell: |
        ceph mon dump --format json 2>/dev/null \
          | jq -e '.mons[].public_addrs.addrvec[] | select(.type == "v2")' >/dev/null \
          && echo "MONMAP_HAS_V2" || echo "MONMAP_V1_ONLY"
      args:
        executable: /bin/bash
      changed_when: false
      register: monmap_state

    - name: Enable msgr2 in the monmap (idempotent — no-op if already v2)
      # ceph mon enable-msgr2 walks every mon in the monmap and upgrades
      # any v1-only address to a v1+v2 addrvec. Safe to re-run.
      # On a single-mon cluster this WILL restart the mon (brief I/O pause).
      ansible.builtin.command: ceph mon enable-msgr2
      when:
        - ceph_conf_changed is changed or monmap_state.stdout == "MONMAP_V1_ONLY"
      register: enable_msgr2_result
      changed_when: enable_msgr2_result.rc == 0

    - name: Restart ceph-mon (only if config changed but monmap was already v2)
      ansible.builtin.systemd:
        name: ceph-mon@pve
        state: restarted
      when:
        - ceph_conf_changed is changed
        - monmap_state.stdout == "MONMAP_HAS_V2"

    - name: Wait for port 3300 to come up (max 30s)
      ansible.builtin.wait_for:
        port: 3300
        host: 10.10.210.41
        timeout: 30
      when: ceph_conf_changed is changed or enable_msgr2_result is changed

    - name: Probe port 3300 listening AFTER change
      ansible.builtin.shell: |
        ss -tln | awk '$4 ~ /:3300$/ {print "LISTENING:", $4; found=1} END {if (!found) print "NOT LISTENING"}'
      args:
        executable: /bin/bash
      changed_when: false
      register: msgr2_after

    - name: AFTER state
      ansible.builtin.debug:
        msg: "{{ msgr2_after.stdout }}"

    - name: Show ceph mon dump (verify v2 endpoint registered)
      ansible.builtin.command: ceph mon dump --format json
      changed_when: false
      register: mon_dump
      failed_when: false

    - name: Parse mon dump for v2 endpoints
      ansible.builtin.debug:
        msg: >-
          {{ (mon_dump.stdout | from_json).mons | map(attribute='public_addrs.addrvec') | list }}
      when:
        - mon_dump is not skipped
        - mon_dump.rc | default(1) == 0
        - mon_dump.stdout | default('') | length > 0
