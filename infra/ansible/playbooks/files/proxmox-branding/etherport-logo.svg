<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 35" width="200" height="35">
  <!-- Black text for LIGHT mode. In DARK mode PVE applies
       filter: invert(1) hue-rotate(180deg) to the logo img → black text becomes
       white, the green ring stays green-ish (hue preserved). So do NOT set
       filter:none in etherport.css (that would keep the text black on the dark header). -->
  <circle cx="18" cy="17.5" r="11" fill="none" stroke="#46c46a" stroke-width="3.2"/>
  <circle cx="18" cy="17.5" r="3.6" fill="#46c46a"/>
  <text x="38" y="24" fill="#0a0e14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="-0.4">etherport</text>
</svg>
