---
# GitHub Actions self-hosted runner installation
#
# Installs the actions/runner binary as a systemd service on hosts in the
# gh_runners inventory group. Uses a GitHub PAT (passed via GH_TOKEN env)
# to fetch a one-time registration token from the repo API.
#
# Usage:
#   GH_TOKEN=$(op item get p4k7sihbwzls55lvt6qlf23fcu --fields token --reveal) \
#     ansible-playbook -i inventory/wind/ playbooks/gh-runner.yml
#
# Re-runs are idempotent: existing runner stays configured; only updates the
# binary if runner_version changed. To force re-registration, delete
# {{ runner_home }}/.runner on the host and re-run.

- name: GitHub Actions self-hosted runner
  hosts: gh_runners
  become: true
  gather_facts: true

  vars:
    runner_version: "2.328.0"
    runner_user: ubuntu
    runner_home: /home/{{ runner_user }}/actions-runner
    repo_url: https://github.com/sparked-diamond/infra
    runner_name: "{{ inventory_hostname }}"
    # Labels: keep 'homelab-runner' so existing workflows (runs-on: homelab-runner)
    # auto-dispatch. Add 'lifecycle' for workflows specifically targeting this
    # outside-the-cluster runner (kubespray, K8s VM TF, etc.).
    runner_labels: "homelab-runner,lifecycle,self-hosted,Linux,X64"
    runner_arch_map:
      x86_64: x64
      aarch64: arm64
    runner_arch: "{{ runner_arch_map[ansible_architecture] }}"

  pre_tasks:
    - name: Verify GH_TOKEN is provided via env
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'GH_TOKEN') | length > 0
        fail_msg: "GH_TOKEN env var must be set. Pass via `GH_TOKEN=<pat> ansible-playbook ...`."

  tasks:
    # Ensure the automation@homelab pubkey is present on this VM.
    # Cloud-init on the standalone-vms TF module sets it at FIRST
    # boot via initialization.user_account.keys — but if the VM was
    # provisioned before that default existed (or was created with
    # an override), the key may be missing. Without this key any
    # future `ssh ubuntu@<runner>` from a laptop fails, breaking
    # interactive ops + recovery.
    # Re-applying this play self-heals: a missing key gets installed,
    # an existing matching key is a no-op.
    - name: Ensure automation@homelab pubkey is authorized for {{ runner_user }}
      ansible.posix.authorized_key:
        user: "{{ runner_user }}"
        state: present
        key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDbuFR+hru9VgMct+C7pCxrxXB0O3mrhFcBP3QJ/D8IR automation@homelab"
        comment: "automation@homelab (managed by gh-runner.yml)"

    - name: Install runner dependencies
      ansible.builtin.apt:
        name:
          - curl
          - jq
          - git
          - libicu74  # required by .NET runtime in actions/runner
          - unzip     # hashicorp/setup-terraform action unzips its download
          - wget      # used by various install actions
          - docker.io # required for workflows that use `container:` (ansible-proxmox, etc.)
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: "Add runner user to docker group (for container: support)"
      ansible.builtin.user:
        name: "{{ runner_user }}"
        groups: docker
        append: true
      notify: Restart runner

    - name: Enable + start docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Create runner home directory
      ansible.builtin.file:
        path: "{{ runner_home }}"
        state: directory
        owner: "{{ runner_user }}"
        group: "{{ runner_user }}"
        mode: "0755"

    - name: Check installed runner version (if any)
      ansible.builtin.slurp:
        src: "{{ runner_home }}/.version"
      register: installed_version_raw
      failed_when: false
      changed_when: false

    - name: Set installed_version fact
      ansible.builtin.set_fact:
        installed_version: "{{ installed_version_raw.content | default('') | b64decode | trim }}"

    - name: Download actions-runner archive
      ansible.builtin.get_url:
        url: "https://github.com/actions/runner/releases/download/v{{ runner_version }}/actions-runner-linux-{{ runner_arch }}-{{ runner_version }}.tar.gz"
        dest: "/tmp/actions-runner-{{ runner_version }}.tar.gz"
        mode: "0644"
      when: installed_version != runner_version

    - name: Extract actions-runner
      ansible.builtin.unarchive:
        src: "/tmp/actions-runner-{{ runner_version }}.tar.gz"
        dest: "{{ runner_home }}"
        remote_src: true
        owner: "{{ runner_user }}"
        group: "{{ runner_user }}"
      when: installed_version != runner_version

    - name: Record installed version
      ansible.builtin.copy:
        content: "{{ runner_version }}"
        dest: "{{ runner_home }}/.version"
        owner: "{{ runner_user }}"
        group: "{{ runner_user }}"
        mode: "0644"
      when: installed_version != runner_version

    - name: Check if runner is already configured
      ansible.builtin.stat:
        path: "{{ runner_home }}/.runner"
      register: runner_config

    - name: Fetch one-time registration token from GitHub
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ repo_url | regex_replace('https://github.com/', '') }}/actions/runners/registration-token"
        method: POST
        headers:
          Authorization: "Bearer {{ lookup('ansible.builtin.env', 'GH_TOKEN') }}"
          Accept: "application/vnd.github+json"
          X-GitHub-Api-Version: "2022-11-28"
        status_code: 201
      register: reg_token
      no_log: true
      when: not runner_config.stat.exists

    - name: Configure runner (one-time)
      ansible.builtin.command:
        cmd: >-
          ./config.sh
            --url {{ repo_url }}
            --token {{ reg_token.json.token }}
            --name {{ runner_name }}
            --labels {{ runner_labels }}
            --unattended
            --replace
        chdir: "{{ runner_home }}"
      become_user: "{{ runner_user }}"
      when: not runner_config.stat.exists
      no_log: true

    - name: Install runner as systemd service
      ansible.builtin.command:
        cmd: ./svc.sh install {{ runner_user }}
        chdir: "{{ runner_home }}"
      args:
        creates: "/etc/systemd/system/actions.runner.sparked-diamond-infra.{{ runner_name }}.service"

    # ---- L11 fix: durable workspace cleanup via runner job-started hook ----
    # Some workflows (terraform-* in particular) interact with the work dir
    # in ways that leave .git/objects owned by root. The next workflow run
    # then fails with: "insufficient permission for adding an object to
    # repository database .git/objects". This hook runs at every job start
    # (before actions/checkout) and chowns the work dir back to the runner
    # user so checkout can clean stale state.
    #
    # Mechanism: ACTIONS_RUNNER_HOOK_JOB_STARTED env var points the runner
    # at a script that runs in the job-started lifecycle stage. See
    # https://github.com/actions/runner/blob/main/docs/adrs/1751-runner-job-hooks.md
    - name: Ensure hooks dir exists
      ansible.builtin.file:
        path: "{{ runner_home }}/hooks"
        state: directory
        owner: "{{ runner_user }}"
        group: "{{ runner_user }}"
        mode: "0755"

    - name: Drop job-started hook script
      ansible.builtin.copy:
        dest: "{{ runner_home }}/hooks/job-started.sh"
        owner: "{{ runner_user }}"
        group: "{{ runner_user }}"
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          # Runs before EVERY workflow job. Quickly normalize ownership of
          # the work tree so workflows that touch .git as a non-runner user
          # (e.g. via container: steps or sudo) don't break the next run.
          # Idempotent + cheap (no-op if everything's already owned right).
          set -u
          WORK="${RUNNER_WORKSPACE_BASE:-$(dirname "$(dirname "$0")")/_work}"
          if [ -d "$WORK" ]; then
            sudo -n chown -R {{ runner_user }}:{{ runner_user }} "$WORK" 2>/dev/null || \
              chown -R {{ runner_user }}:{{ runner_user }} "$WORK" 2>/dev/null || true
          fi
          exit 0
      notify: Restart runner

    - name: Allow runner user passwordless sudo for chown (job-started hook)
      ansible.builtin.copy:
        dest: /etc/sudoers.d/runner-chown
        content: "{{ runner_user }} ALL=(root) NOPASSWD: /usr/bin/chown\n"
        owner: root
        group: root
        mode: "0440"
        validate: visudo -cf %s

    - name: Set ACTIONS_RUNNER_HOOK_JOB_STARTED env in runner .env
      ansible.builtin.lineinfile:
        path: "{{ runner_home }}/.env"
        regexp: "^ACTIONS_RUNNER_HOOK_JOB_STARTED="
        line: "ACTIONS_RUNNER_HOOK_JOB_STARTED={{ runner_home }}/hooks/job-started.sh"
        owner: "{{ runner_user }}"
        group: "{{ runner_user }}"
        mode: "0644"
        create: true
      notify: Restart runner

    - name: One-off cleanup of stale root-owned files in work dir
      ansible.builtin.command:
        cmd: chown -R {{ runner_user }}:{{ runner_user }} {{ runner_home }}/_work
      changed_when: true
      failed_when: false   # work dir may not exist yet on a fresh runner

    - name: Start + enable runner service
      ansible.builtin.systemd:
        name: "actions.runner.sparked-diamond-infra.{{ runner_name }}.service"
        state: started
        enabled: true
        daemon_reload: true

  handlers:
    # Adding the runner user to the docker group requires a runner-service
    # restart for the new GID to take effect on subsequent workflow runs.
    #
    # When run LOCALLY (ansible_connection=local) the play is executing
    # ON the runner — restarting the service mid-handler will kill the
    # ansible-playbook process itself, leaving the workflow in a failed
    # state even though all changes landed. Use systemd-run to schedule
    # the restart for AFTER ansible exits, so the workflow can finish
    # cleanly and the next job picks up the new config.
    - name: Restart runner
      ansible.builtin.shell: |
        set -e
        if [ "{{ ansible_connection }}" = "local" ]; then
          # Defer 10s so this play and its calling workflow can finish.
          systemd-run --unit=runner-deferred-restart --on-active=10s \
            systemctl restart actions.runner.sparked-diamond-infra.{{ runner_name }}.service
        else
          systemctl restart actions.runner.sparked-diamond-infra.{{ runner_name }}.service
        fi
