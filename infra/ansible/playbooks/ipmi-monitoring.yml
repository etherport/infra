---
# IPMI / BMC observability on PVE (ASRock Rack B650D4U, AMI MegaRAC FW 6.04).
#
# Background — 2026-05-02 incident: CPU repeatedly tripped TEMP_CPU
# Upper Non-Critical (98 C) for ~1-2 seconds, deasserting before any
# operator could see it. Was only discovered later via manual BMC web
# login. Three problems compounded:
#   1. Thresholds were vendor defaults (98 warn / 99 crit, basically
#      at thermal throttle) so by the time warning fired, the CPU was
#      already throttling.
#   2. PEF was unarmed (no alert destinations, no policies enabled),
#      so even when warnings asserted the BMC sent no notification.
#   3. Sensors had no exporter on the Prometheus side, so the cluster
#      had no record of TEMP_CPU climbing or fans pegging.
#
# This playbook closes 1 + 3 with durable IaC (idempotent re-runs).
# It deliberately does NOT touch:
#   - BMC accounts (user explicit: "don't do anything to these accounts
#     yet bc i'm not onsite and if we lose access, there's no way of
#     getting it back" — 2026-05-23). Account hardening is M42.
#   - Fan curve / Smart Fan profile. Those live behind the proprietary
#     AMI Web UI under Settings -> Fan Control and aren't reachable
#     via standard IPMI or Redfish on this firmware. User needs to set
#     the curve interactively. See docs/runbooks/pve-bmc-tuning.md.
#   - PEF / LAN alert destinations. Cross-subnet PET traps from VLAN
#     200 (mgmt) -> VLAN 201 (loki) need the default gateway MAC
#     learned by the BMC, which it currently does not have. We're
#     relying instead on (a) BMC Remote Log syslog -> Alloy (enabled
#     in the BMC UI today), and (b) ipmievd -> local syslog -> Alloy.
#     PEF wire-up is M43.
#
# Idempotent. Safe to re-run.
#
# Usage:
#   ansible-playbook -i inventory/wind/inventory.ini playbooks/ipmi-monitoring.yml --check --diff
#   ansible-playbook -i inventory/wind/inventory.ini playbooks/ipmi-monitoring.yml --diff
# Or via .github/workflows/ansible-proxmox.yml (playbook: ipmi-monitoring).

- name: PVE IPMI observability — exporter, SEL forwarder, sensor thresholds
  hosts: proxmox_hosts
  become: true
  gather_facts: false

  # Override ansible.cfg's ControlMaster=no for this play only.
  # Multiple tasks here = many fresh SSH connections to PVE = fail2ban /
  # sshd MaxStartups trips and ssh: connect timed out. ControlPersist
  # keeps the master socket open across the play so we touch sshd
  # exactly once per host. Safe here because we don't use ProxyJump
  # for PVE (the original reason ControlMaster was disabled globally).
  vars:
    ansible_ssh_args: "-o ControlMaster=auto -o ControlPersist=120s -o ControlPath=/tmp/ansible-cm-%C -o StrictHostKeyChecking=no"
    # Loki/Alloy syslog receiver (MetalLB LB).
    alloy_syslog_host: 10.10.201.73
    alloy_syslog_port: 514
    # Where Prometheus scrapes the ipmi_exporter from.
    ipmi_exporter_listen: "0.0.0.0:9290"
    # Sensor thresholds applied (idempotently) on every run.
    # CPU: vendor defaults were 98 warn / 99 crit — useless because the
    # CPU is already throttling. AMD Ryzen 7000 TjMax is 95 C; we want
    # both warn and crit firing well below that. 82/90 gives early
    # warning + emergency without false flapping under load.
    # FAN1-4: vendor had only lnc=200 (catches stopped fan). Adding
    # unc=12500 catches "fans pegged at max" which is the canary for
    # cooling capacity exhaustion.
    sensor_thresholds:
      - { sensor: TEMP_CPU, threshold: unc, value: 82 }
      - { sensor: TEMP_CPU, threshold: ucr, value: 90 }
      - { sensor: FAN1, threshold: unc, value: 12500 }
      - { sensor: FAN2, threshold: unc, value: 12500 }
      - { sensor: FAN3, threshold: unc, value: 12500 }
      - { sensor: FAN4, threshold: unc, value: 12500 }

  tasks:
    # ---------------------------------------------------------------------
    # 1. Package install
    # ---------------------------------------------------------------------
    - name: Install IPMI tooling + exporter
      ansible.builtin.apt:
        name:
          - ipmitool             # ipmievd ships with this
          - freeipmi-tools       # backend the exporter prefers
          - prometheus-ipmi-exporter   # in Debian trixie main
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Load ipmi_devintf kernel module (needed for /dev/ipmi0 in-band)
      community.general.modprobe:
        name: ipmi_devintf
        state: present
        persistent: present

    # ---------------------------------------------------------------------
    # 2. Sensor thresholds (idempotent — read current, set only if drifted)
    # ---------------------------------------------------------------------
    # Read + diff + apply all in one bash task. Single SSH connection
    # (vs N+1 from Ansible loops), idempotent via bash-side comparison,
    # changed_when triggers off the "CHANGED=N" footer. Earlier attempts
    # to do this in Jinja with regex_search hit "NoneType object has no
    # attribute 'group'" on sensors where the threshold doesn't exist.
    # Render the bash script through a template so Ansible's
    # argument-splitter doesn't have to parse Jinja-mixed-with-bash
    # (it fails on {% for %} inside shell: literal blocks).
    - name: Render threshold-apply script
      ansible.builtin.copy:
        dest: /usr/local/sbin/ipmi-thresholds-apply.sh
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          # Generated by infra/ansible/playbooks/ipmi-monitoring.yml.
          # Idempotent: reads each sensor's current threshold, sets only
          # if drifted, prints SET/OK lines, emits CHANGED=N footer.
          set -uo pipefail
          declare -A want=(
          {% for t in sensor_thresholds %}
            ["{{ t.sensor }}|{{ t.threshold }}"]="{{ t.value }}"
          {% endfor %}
          )
          declare -A label_of=(
            [unc]="Upper Non-Critical"
            [ucr]="Upper Critical"
            [unr]="Upper Non-Recoverable"
            [lnc]="Lower Non-Critical"
            [lcr]="Lower Critical"
            [lnr]="Lower Non-Recoverable"
          )

          changed=0
          for key in "${!want[@]}"; do
            sensor="${key%|*}"
            thresh="${key##*|}"
            desired="${want[$key]}"
            label="${label_of[$thresh]}"

            # awk: trim leading/trailing whitespace from each label cell
            # (ipmitool right-pads the column) before comparing. Previous
            # version used $1 == lbl which never matched.
            current_raw=$(ipmitool sensor get "$sensor" 2>/dev/null \
              | awk -F':' -v lbl="$label" '
                  {
                    gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)
                    gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)
                    if ($1 == lbl) { print $2; exit }
                  }')

            # Numeric? Round to int. Anything else (empty / "na" / etc.) -> "unset".
            if [[ "$current_raw" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
              current=$(printf "%.0f" "$current_raw")
            else
              current="unset"
            fi

            if [ "$current" = "unset" ] || [ "$current" -ne "$desired" ]; then
              if ipmitool sensor thresh "$sensor" "$thresh" "$desired" >/dev/null 2>&1; then
                echo "SET $sensor $thresh $desired (was $current)"
                changed=$((changed+1))
              else
                echo "FAIL $sensor $thresh $desired (ipmitool refused, current=$current)"
              fi
            else
              echo "OK  $sensor $thresh $desired (matches)"
            fi
          done
          echo "CHANGED=$changed"

    - name: Apply sensor thresholds (single SSH, idempotent in bash)
      ansible.builtin.command:
        cmd: /usr/local/sbin/ipmi-thresholds-apply.sh
      changed_when: "'CHANGED=0' not in sensor_apply.stdout"
      register: sensor_apply

    # ---------------------------------------------------------------------
    # 3. ipmievd: daemonize SEL -> local syslog
    # ---------------------------------------------------------------------
    # ipmievd is shipped with ipmitool. It watches the BMC's System
    # Event Log and writes new entries to local syslog with programname
    # "ipmievd". Debian's ipmitool package ALREADY installs
    # /usr/lib/systemd/system/ipmievd.service — just enable + start it.
    # An earlier draft of this playbook installed a custom unit with
    # Type=forking + ExecStart=/usr/sbin/ipmievd -O /run/ipmievd.pid sel
    # which hung in "activating (start)" forever because -O selects the
    # IPMI interface type, NOT a pid file — ipmievd never forked, never
    # wrote a pidfile, and systemd waited for the fork that never came.
    - name: Remove obsolete custom ipmievd unit override (cleanup)
      ansible.builtin.file:
        path: /etc/systemd/system/ipmievd.service
        state: absent
      notify: daemon-reload

    - name: Enable + start packaged ipmievd
      ansible.builtin.systemd:
        name: ipmievd
        enabled: true
        state: started
        daemon_reload: true

    # ---------------------------------------------------------------------
    # 4. rsyslog forwarder: PVE syslog -> Alloy syslog receiver
    # ---------------------------------------------------------------------
    # Covers ipmievd output, kernel messages, systemd journal, and any
    # other syslog producer on the host. UDP because TCP can block the
    # host if the receiver is down (Loki/Alloy share fate with the
    # cluster; we don't want PVE's logging to wedge if K8s is down).
    - name: Configure rsyslog to forward to Alloy
      ansible.builtin.copy:
        dest: /etc/rsyslog.d/40-alloy-forward.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Forward every syslog message to the Loki/Alloy syslog receiver.
          # UDP so a Loki outage can't wedge local logging.
          *.* action(type="omfwd"
                     target="{{ alloy_syslog_host }}"
                     port="{{ alloy_syslog_port }}"
                     protocol="udp"
                     action.resumeRetryCount="100"
                     queue.type="LinkedList"
                     queue.size="10000")
      notify: Restart rsyslog

    # ---------------------------------------------------------------------
    # 5. ipmi_exporter: Prometheus scrape target
    # ---------------------------------------------------------------------
    # Debian package installs the binary at /usr/bin/prometheus-ipmi-exporter
    # and a systemd unit `prometheus-ipmi-exporter`. We override the
    # config + listen address via a drop-in so the service can be
    # scraped by kube-prometheus-stack from inside the cluster.
    - name: Ensure ipmi_exporter config dir exists
      ansible.builtin.file:
        path: /etc/prometheus
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write ipmi_exporter config
      ansible.builtin.copy:
        dest: /etc/prometheus/ipmi_local.yml
        owner: root
        group: prometheus
        mode: "0640"
        content: |
          # ipmi_exporter modules. The "default" module is what
          # Prometheus scrapes when no `module=...` query param is set,
          # which is fine for in-band/local scrape on the host itself.
          modules:
            default:
              collectors:
                - ipmi    # sensor readings (temps + fans + voltages)
                - dcmi    # power draw (if supported by BMC)
                - bmc     # BMC firmware version, watchdog
                - chassis # power state
      notify: Restart prometheus-ipmi-exporter

    - name: Override prometheus-ipmi-exporter ExecStart
      ansible.builtin.copy:
        dest: /etc/systemd/system/prometheus-ipmi-exporter.service.d/override.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Service]
          ExecStart=
          ExecStart=/usr/bin/prometheus-ipmi-exporter \
            --config.file=/etc/prometheus/ipmi_local.yml \
            --web.listen-address={{ ipmi_exporter_listen }} \
            --freeipmi.path=/usr/sbin
      notify: Restart prometheus-ipmi-exporter
      register: exporter_override

    - name: Ensure ExecStart drop-in dir exists (idempotent ahead of override)
      ansible.builtin.file:
        path: /etc/systemd/system/prometheus-ipmi-exporter.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Enable + start prometheus-ipmi-exporter
      ansible.builtin.systemd:
        name: prometheus-ipmi-exporter
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: daemon-reload
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart rsyslog
      ansible.builtin.systemd:
        name: rsyslog
        state: restarted

    - name: Restart prometheus-ipmi-exporter
      ansible.builtin.systemd:
        name: prometheus-ipmi-exporter
        state: restarted
        daemon_reload: true
