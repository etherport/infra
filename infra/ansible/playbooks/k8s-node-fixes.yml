---
# K8s Node Fixes Playbook
# Fixes issues discovered during cluster reboot testing
#
# Usage:
#   # All K8s nodes
#   ansible-playbook -i ../kubespray/kubespray/inventory/wind/inventory.ini playbooks/k8s-node-fixes.yml
#
#   # Single node
#   ansible-playbook -i ../kubespray/kubespray/inventory/wind/inventory.ini playbooks/k8s-node-fixes.yml --limit k8s-w3
#
#   # Check mode
#   ansible-playbook -i ../kubespray/kubespray/inventory/wind/inventory.ini playbooks/k8s-node-fixes.yml --check --diff
#
# This playbook fixes:
#   1. /opt/cni/bin permissions (Cilium mount-cgroup init container fails without write perms)
#   2. RBD kernel module loading at boot (CSI plugin fails if module not loaded)
#   3. Post-reboot stale pod cleanup (pods stuck in Unknown state after reboot)

- name: K8s Node Fixes
  hosts: all
  become: true

  vars:
    # Cleanup script settings
    cleanup_script_path: /usr/local/bin/k8s-post-reboot-cleanup.sh
    cleanup_service_name: k8s-post-reboot-cleanup

  tasks:
    # =========================================================================
    # Fix 1: CNI bin directory permissions
    # Cilium's mount-cgroup init container needs to write to /opt/cni/bin.
    # The durable fix is `cni_bin_owner: root` in kubespray group_vars
    # k8s-cluster.yml — kubespray then creates the dir root:root (mode 0755)
    # and Cilium's in-container root can write without CAP_DAC_OVERRIDE.
    # This task is the recovery for nodes provisioned before that flag was
    # set (or where someone re-chowned to `kube`). Idempotent: matches
    # what kubespray would produce.
    # =========================================================================
    - name: Ensure /opt/cni/bin is root:root 0755 (matches kubespray cni_bin_owner=root)
      file:
        path: /opt/cni/bin
        state: directory
        mode: "0755"
        owner: root
        group: root

    # =========================================================================
    # Fix 1b: VLAN parent interfaces UP for Multus macvlan
    # The extra vNICs on VLAN 202/204/205 (enp6s19/20/21) ship DOWN out of
    # the cloud image unless they're declared in netplan. Without them UP,
    # Multus macvlan can't attach virtual interfaces to pods, and HA loses
    # access to Hue/Tuya/Roomba/Tesla on IoT VLAN 204.
    # Idempotent: file written once, netplan apply only on change.
    # =========================================================================
    - name: Ensure VLAN parent interfaces are UP via netplan
      copy:
        dest: /etc/netplan/51-vlan-interfaces.yaml
        owner: root
        group: root
        mode: "0600"
        content: |
          network:
            version: 2
            ethernets:
              enp6s19:
                optional: true
                dhcp4: no
                dhcp6: no
              enp6s20:
                optional: true
                dhcp4: no
                dhcp6: no
              enp6s21:
                optional: true
                dhcp4: no
                dhcp6: no
      register: vlan_netplan

    - name: Apply netplan if VLAN config changed
      command: netplan apply
      when: vlan_netplan.changed

    # =========================================================================
    # Fix 2: Load RBD kernel module at boot
    # CSI RBD plugin fails if the rbd module isn't loaded:
    # "modprobe: ERROR: could not insert 'rbd': Key was rejected by service"
    # This can happen with SecureBoot if the module isn't loaded early enough
    # =========================================================================
    - name: Ensure rbd module loads at boot
      copy:
        dest: /etc/modules-load.d/ceph-rbd.conf
        content: |
          # Load Ceph RBD module at boot for CSI plugin
          rbd
        owner: root
        group: root
        mode: "0644"

    - name: Load rbd module now if not loaded
      modprobe:
        name: rbd
        state: present
      ignore_errors: yes

    # =========================================================================
    # Fix 3: Post-reboot stale pod cleanup
    # After node reboot, pods can get stuck in "Unknown" state because
    # kubelet doesn't properly clean them up. This service runs after
    # kubelet starts and cleans up stale pods.
    # =========================================================================
    - name: Create post-reboot cleanup script
      copy:
        dest: "{{ cleanup_script_path }}"
        mode: "0755"
        owner: root
        group: root
        content: |
          #!/bin/bash
          # K8s Post-Reboot Cleanup Script
          # Cleans up stale pods and volume attachments cluster-wide
          # Runs on control plane only (requires admin.conf)

          set -euo pipefail

          KUBECONFIG=/etc/kubernetes/admin.conf
          KUBECTL=/usr/local/bin/kubectl
          LOG_TAG="k8s-post-reboot-cleanup"

          log() {
              logger -t "$LOG_TAG" "$1"
              echo "$(date '+%Y-%m-%d %H:%M:%S') $1"
          }

          # Only run on control plane
          if [ ! -f "$KUBECONFIG" ]; then
              exit 0
          fi

          # Wait for kubelet to be ready
          for i in {1..30}; do
              if systemctl is-active --quiet kubelet; then
                  break
              fi
              sleep 2
          done

          # Wait for API server connectivity
          for i in {1..30}; do
              if $KUBECTL --kubeconfig=$KUBECONFIG get nodes &>/dev/null; then
                  break
              fi
              sleep 2
          done

          # Clean up pods in Unknown state across ALL nodes
          UNKNOWN_PODS=$($KUBECTL --kubeconfig=$KUBECONFIG get pods --all-namespaces \
              -o jsonpath='{range .items[?(@.status.phase=="Unknown")]}{.metadata.namespace}/{.metadata.name} {end}' 2>/dev/null || true)

          if [ -n "$UNKNOWN_PODS" ]; then
              log "Found pods in Unknown state: $UNKNOWN_PODS"
              for pod in $UNKNOWN_PODS; do
                  namespace=$(echo $pod | cut -d'/' -f1)
                  name=$(echo $pod | cut -d'/' -f2)
                  log "Force deleting pod $namespace/$name"
                  $KUBECTL --kubeconfig=$KUBECONFIG delete pod -n $namespace $name \
                      --force --grace-period=0 2>/dev/null || true
              done
          fi

          # Clean up pods with UnexpectedAdmissionError (can happen after node reboots)
          ERROR_PODS=$($KUBECTL --kubeconfig=$KUBECONFIG get pods --all-namespaces \
              -o jsonpath='{range .items[?(@.status.reason=="UnexpectedAdmissionError")]}{.metadata.namespace}/{.metadata.name} {end}' 2>/dev/null || true)

          if [ -n "$ERROR_PODS" ]; then
              log "Found pods with UnexpectedAdmissionError: $ERROR_PODS"
              for pod in $ERROR_PODS; do
                  namespace=$(echo $pod | cut -d'/' -f1)
                  name=$(echo $pod | cut -d'/' -f2)
                  log "Force deleting pod $namespace/$name"
                  $KUBECTL --kubeconfig=$KUBECONFIG delete pod -n $namespace $name \
                      --force --grace-period=0 2>/dev/null || true
              done
          fi

          # NOTE: deliberately no VolumeAttachment cleanup here.
          # An earlier version of this script deleted VAs for any PVC whose
          # pod wasn't in `Running` phase on the same node — but pods in
          # `ContainerCreating` (the normal state while a VA is being
          # mounted) also failed that check, so the script raced with
          # normal mounting: VA created → cleanup deletes it → kubelet
          # retries → infinite loop, pod never mounts. The CSI
          # external-attacher already handles VA lifecycle correctly,
          # including stale-VA cleanup on node reboot. This script's
          # job is just stuck-pod recovery (Unknown / UnexpectedAdmissionError).
      notify: Reload systemd

    - name: Create post-reboot cleanup systemd service
      copy:
        dest: /etc/systemd/system/{{ cleanup_service_name }}.service
        mode: "0644"
        owner: root
        group: root
        content: |
          [Unit]
          Description=Kubernetes Post-Reboot Cleanup
          Documentation=https://github.com/your-org/homelab-infra
          After=kubelet.service
          Wants=kubelet.service

          [Service]
          Type=oneshot
          ExecStart={{ cleanup_script_path }}
          StandardOutput=journal
          StandardError=journal
      notify: Reload systemd

    - name: Create cleanup timer (runs every 2 minutes)
      copy:
        dest: /etc/systemd/system/{{ cleanup_service_name }}.timer
        mode: "0644"
        owner: root
        group: root
        content: |
          [Unit]
          Description=Run K8s cleanup every 2 minutes

          [Timer]
          OnBootSec=60
          OnUnitActiveSec=120
          AccuracySec=30

          [Install]
          WantedBy=timers.target
      notify: Reload systemd

    - name: Enable cleanup timer (control plane only)
      systemd:
        name: "{{ cleanup_service_name }}.timer"
        enabled: yes
        state: started
        daemon_reload: yes
      when: "'kube_control_plane' in group_names"

    - name: Disable cleanup timer on worker nodes
      systemd:
        name: "{{ cleanup_service_name }}.timer"
        enabled: no
        state: stopped
        daemon_reload: yes
      when: "'kube_control_plane' not in group_names"
      ignore_errors: yes

    # =========================================================================
    # Fix 4: Increase kubelet node lease duration
    # This gives more time for graceful pod termination during reboots
    # =========================================================================
    - name: Check if kubelet config exists
      stat:
        path: /var/lib/kubelet/config.yaml
      register: kubelet_config

    # =========================================================================
    # Fix 5: Hardware watchdog (Proxmox i6300esb)
    #
    # Pair with the `watchdog { ... }` block in TF k8s-vms/main.tf which
    # attaches the emulated i6300esb PCI device to the VM. The guest
    # `watchdog` daemon writes to /dev/watchdog0 every few seconds; if
    # it stops (kernel hang, init death, runaway load that blocks the
    # daemon's scheduler slot past the timeout), Proxmox forcibly resets
    # the VM. Recovers from the K8s-VM-hang scenario that previously
    # required manual intervention.
    # =========================================================================
    - name: Install watchdog package
      apt:
        name: watchdog
        state: present
        update_cache: false

    - name: Configure watchdog daemon for i6300esb device
      copy:
        dest: /etc/watchdog.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by ansible: infra/ansible/playbooks/k8s-node-fixes.yml
          # The i6300esb device exposed by Proxmox surfaces as
          # /dev/watchdog0 with a 30s default timeout.
          watchdog-device     = /dev/watchdog0
          watchdog-timeout    = 30
          # Pet interval. Must be well under the timeout so a brief
          # daemon stutter doesn't trigger a false reset.
          interval            = 10
          realtime            = yes
          priority            = 1
          # Only fire on hard hangs; don't kick the watchdog for load.
          max-load-1          = 0
      notify: Restart watchdog

    - name: Enable + start watchdog daemon
      systemd:
        name: watchdog
        enabled: yes
        state: started

    # =========================================================================
    # Verification
    # =========================================================================
    - name: Verify /opt/cni/bin permissions
      stat:
        path: /opt/cni/bin
      register: cni_bin_stat

    - name: Display CNI bin permissions
      debug:
        msg: "CNI bin permissions: {{ cni_bin_stat.stat.mode }}"

    - name: Check if rbd module is loaded
      shell: lsmod | grep -q rbd && echo "loaded" || echo "not loaded"
      register: rbd_status
      changed_when: false

    - name: Display rbd module status
      debug:
        msg: "RBD module status: {{ rbd_status.stdout }}"

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: yes
    - name: Restart watchdog
      systemd:
        name: watchdog
        state: restarted
