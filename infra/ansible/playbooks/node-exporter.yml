---
# Standalone node_exporter deploy — a faithful mirror of base.yml's
# "Prometheus Node Exporter" section (H42, 2026-07-01).
#
# WHY THIS EXISTS: base.yml is the fleet baseline, but running it on the
# PVE HYPERVISOR is unsafe — it enables unattended-upgrades with
# Automatic-Reboot=true, and an unattended reboot of pve takes down every
# VM (the whole homelab). This playbook deploys ONLY the node_exporter
# piece so pve (and any similar full-baseline-unsafe host) still gets OS
# metrics + the ExternalHostDown alert coverage.
#
# Keep IN SYNC with base.yml (same version/port/service definition). If
# you bump node_exporter_version there, bump it here (or better: finish
# the extraction into a shared tasks file — tracked as part of M6-style
# dedup).
#
#   dispatch: ansible-vm-fleet.yml → playbook=node-exporter,
#             inventory=wind, action=apply, limit=pve
- name: Deploy Prometheus node_exporter (standalone)
  hosts: "{{ target_hosts | default('all:!k8s_cluster') }}"
  become: true
  vars:
    node_exporter_version: "1.8.2"
    node_exporter_port: 9100

  handlers:
    - name: Restart node_exporter
      systemd:
        name: node_exporter
        state: restarted
        daemon_reload: yes

  tasks:
    - name: Check if node_exporter is installed
      stat:
        path: /usr/local/bin/node_exporter
      register: node_exporter_binary

    - name: Get installed node_exporter version
      command: /usr/local/bin/node_exporter --version
      register: installed_version
      changed_when: false
      failed_when: false
      when: node_exporter_binary.stat.exists

    - name: Determine system architecture
      set_fact:
        node_exporter_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

    - name: Download node_exporter
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
        dest: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
        mode: "0644"
      when: not node_exporter_binary.stat.exists or (installed_version.stdout is defined and node_exporter_version not in installed_version.stdout)

    - name: Extract node_exporter
      unarchive:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
        dest: /tmp
        remote_src: yes
      when: not node_exporter_binary.stat.exists or (installed_version.stdout is defined and node_exporter_version not in installed_version.stdout)

    - name: Install node_exporter binary
      copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"
        dest: /usr/local/bin/node_exporter
        mode: "0755"
        owner: root
        group: root
        remote_src: yes
      when: not node_exporter_binary.stat.exists or (installed_version.stdout is defined and node_exporter_version not in installed_version.stdout)
      notify: Restart node_exporter

    - name: Create node_exporter user
      user:
        name: node_exporter
        system: yes
        shell: /usr/sbin/nologin
        create_home: no

    # Same convention as base.yml — devbox dir is ubuntu-owned, elsewhere node_exporter.
    - name: Create node_exporter textfile-collector directory
      file:
        path: /var/lib/node_exporter/textfile_collector
        state: directory
        owner: "{{ 'ubuntu' if 'devboxes' in group_names else 'node_exporter' }}"
        group: node_exporter
        mode: "0755"

    - name: Create node_exporter systemd service
      copy:
        dest: /etc/systemd/system/node_exporter.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          Documentation=https://prometheus.io/docs/guides/node-exporter/
          After=network-online.target

          [Service]
          User=node_exporter
          Group=node_exporter
          Type=simple
          ExecStart=/usr/local/bin/node_exporter \
            --web.listen-address=:{{ node_exporter_port }} \
            --collector.systemd \
            --collector.processes \
            --collector.textfile \
            --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify: Restart node_exporter

    - name: Enable and start node_exporter
      systemd:
        name: node_exporter
        enabled: yes
        state: started
        daemon_reload: yes

    - name: Clean up node_exporter download
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
        - "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}"
      ignore_errors: yes
