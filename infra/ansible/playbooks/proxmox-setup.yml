---
# Proxmox VE Host Initial Setup Playbook
# Configures IOMMU, GPU passthrough, and other host-level settings
#
# Usage:
#   # Dry run
#   ansible-playbook -i inventory/wind/ playbooks/proxmox-setup.yml --check
#
#   # Apply configuration
#   ansible-playbook -i inventory/wind/ playbooks/proxmox-setup.yml
#
#   # Apply and reboot if needed
#   ansible-playbook -i inventory/wind/ playbooks/proxmox-setup.yml -e "allow_reboot=true"
#
# NOTE: Some changes require a reboot to take effect (IOMMU, kernel modules)

- name: Proxmox VE Host Initial Setup
  hosts: proxmox_hosts
  become: true
  gather_facts: true
  vars:
    allow_reboot: false
    reboot_timeout: 600
    # GPU passthrough settings
    enable_gpu_passthrough: true
    gpu_pci_ids: []  # Will be auto-detected if empty
    # IOMMU settings
    enable_iommu: true

  tasks:
    - name: Verify this is a Proxmox VE host
      ansible.builtin.stat:
        path: /usr/bin/pveversion
      register: pve_check
      failed_when: not pve_check.stat.exists

    - name: Get current Proxmox VE version
      ansible.builtin.command: pveversion
      register: pve_version
      changed_when: false

    - name: Display current version
      ansible.builtin.debug:
        msg: "Proxmox VE: {{ pve_version.stdout }}"

    # ==================== IOMMU Configuration ====================
    - name: Check CPU vendor
      ansible.builtin.command: grep -m1 'vendor_id' /proc/cpuinfo
      register: cpu_vendor
      changed_when: false

    - name: Set IOMMU parameter based on CPU vendor
      ansible.builtin.set_fact:
        iommu_param: "{{ 'intel_iommu=on' if 'Intel' in cpu_vendor.stdout else 'amd_iommu=on' }}"

    - name: Check current GRUB configuration
      ansible.builtin.slurp:
        src: /etc/default/grub
      register: grub_config

    - name: Check if IOMMU is already configured
      ansible.builtin.set_fact:
        iommu_configured: "{{ iommu_param in (grub_config.content | b64decode) }}"

    - name: Configure IOMMU in GRUB
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX_DEFAULT='
        line: 'GRUB_CMDLINE_LINUX_DEFAULT="quiet {{ iommu_param }} iommu=pt"'
        backup: true
      when:
        - enable_iommu
        - not iommu_configured
      register: grub_updated
      notify: Update GRUB

    # ==================== VFIO Modules ====================
    - name: Ensure VFIO modules are loaded
      ansible.builtin.copy:
        dest: /etc/modules-load.d/vfio.conf
        content: |
          # VFIO modules for PCI passthrough
          vfio
          vfio_iommu_type1
          vfio_pci
          vfio_virqfd
        mode: '0644'
      register: vfio_modules
      when: enable_gpu_passthrough

    - name: Configure VFIO PCI options
      ansible.builtin.copy:
        dest: /etc/modprobe.d/vfio.conf
        content: |
          # VFIO PCI configuration
          options vfio_iommu_type1 allow_unsafe_interrupts=1
        mode: '0644'
      when: enable_gpu_passthrough

    # ==================== Blacklist Nouveau ====================
    - name: Blacklist nouveau driver for NVIDIA GPUs
      ansible.builtin.copy:
        dest: /etc/modprobe.d/blacklist-nouveau.conf
        content: |
          # Blacklist nouveau driver for GPU passthrough
          blacklist nouveau
          blacklist nvidiafb
          options nouveau modeset=0
        mode: '0644'
      register: nouveau_blacklisted
      when: enable_gpu_passthrough

    # ==================== Update initramfs ====================
    - name: Update initramfs
      ansible.builtin.command: update-initramfs -u -k all
      when: vfio_modules.changed or nouveau_blacklisted.changed
      register: initramfs_updated

    # ==================== Proxmox Repositories ====================
    - name: Ensure pve-no-subscription repo is configured
      ansible.builtin.apt_repository:
        repo: "deb http://download.proxmox.com/debian/pve {{ ansible_distribution_release }} pve-no-subscription"
        state: present
        filename: pve-no-subscription
      when: not use_enterprise_repo | default(false)

    - name: Disable enterprise repo if not subscribed
      ansible.builtin.lineinfile:
        path: /etc/apt/sources.list.d/pve-enterprise.list
        regexp: '^deb'
        line: '# deb https://enterprise.proxmox.com/debian/pve {{ ansible_distribution_release }} pve-enterprise'
        state: present
        create: false
      when: not use_enterprise_repo | default(false)
      ignore_errors: true

    # ==================== System Configuration ====================
    - name: Configure sysctl for networking
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-proxmox.conf
        content: |
          # Allow IP forwarding
          net.ipv4.ip_forward = 1
          net.ipv6.conf.all.forwarding = 1

          # Increase inotify limits (for many VMs)
          fs.inotify.max_user_watches = 1048576
          fs.inotify.max_user_instances = 1024

          # VM memory overcommit
          vm.overcommit_memory = 1
        mode: '0644'
      notify: Reload sysctl

    - name: Configure kernel to allow unsafe interrupts for GPU passthrough
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-gpu-passthrough.conf
        content: |
          # Allow unsafe interrupts for GPU passthrough
          # Required for some NVIDIA GPUs
        mode: '0644'
      when: enable_gpu_passthrough

    # ==================== Useful Tools ====================
    - name: Install useful management tools
      ansible.builtin.apt:
        name:
          - htop
          - iotop
          - vim
          - tmux
          - curl
          - wget
          - lm-sensors
          - nvme-cli
          - smartmontools
        state: present
        update_cache: true

    # ==================== GPU Detection ====================
    - name: Detect NVIDIA GPUs
      ansible.builtin.shell: |
        lspci -nn | grep -i nvidia | awk '{print $1}'
      register: nvidia_gpus
      changed_when: false
      when: enable_gpu_passthrough

    - name: Display detected NVIDIA GPUs
      ansible.builtin.debug:
        msg: "Detected NVIDIA GPUs at PCI addresses: {{ nvidia_gpus.stdout_lines }}"
      when:
        - enable_gpu_passthrough
        - nvidia_gpus.stdout_lines | length > 0

    - name: Get GPU PCI IDs for VFIO binding
      ansible.builtin.shell: |
        for addr in {{ nvidia_gpus.stdout_lines | join(' ') }}; do
          lspci -n -s "$addr" | awk '{print $3}'
        done
      register: gpu_pci_device_ids
      changed_when: false
      when:
        - enable_gpu_passthrough
        - nvidia_gpus.stdout_lines | length > 0

    - name: Display GPU PCI IDs
      ansible.builtin.debug:
        msg: "GPU PCI IDs for VFIO: {{ gpu_pci_device_ids.stdout_lines }}"
      when:
        - enable_gpu_passthrough
        - gpu_pci_device_ids.stdout_lines is defined

    # ==================== Reboot Check ====================
    - name: Check if reboot is required
      ansible.builtin.set_fact:
        reboot_required: "{{ grub_updated.changed or vfio_modules.changed or nouveau_blacklisted.changed or initramfs_updated.changed | default(false) }}"

    - name: Display reboot status
      ansible.builtin.debug:
        msg: "{{ 'REBOOT REQUIRED - Kernel/IOMMU changes need reboot to take effect' if reboot_required else 'No reboot required' }}"

    - name: Reboot if required and allowed
      ansible.builtin.reboot:
        msg: "Rebooting for Proxmox IOMMU/GPU configuration"
        reboot_timeout: "{{ reboot_timeout }}"
      when:
        - reboot_required
        - allow_reboot | bool

    # ==================== Post-Reboot Verification ====================
    - name: Verify IOMMU is enabled (after reboot)
      ansible.builtin.shell: dmesg | grep -i -e DMAR -e IOMMU | head -5
      register: iommu_status
      changed_when: false
      when:
        - allow_reboot | bool
        - reboot_required

    - name: Display IOMMU status
      ansible.builtin.debug:
        msg: "{{ iommu_status.stdout_lines }}"
      when: iommu_status.stdout_lines is defined

    # ==================== Summary ====================
    - name: Final summary
      ansible.builtin.debug:
        msg: |
          === Proxmox Setup Complete ===
          Host: {{ inventory_hostname }}
          Version: {{ pve_version.stdout }}
          CPU Vendor: {{ 'Intel' if 'Intel' in cpu_vendor.stdout else 'AMD' }}
          IOMMU Parameter: {{ iommu_param }}
          GPU Passthrough: {{ 'Enabled' if enable_gpu_passthrough else 'Disabled' }}
          NVIDIA GPUs Found: {{ nvidia_gpus.stdout_lines | length if nvidia_gpus.stdout_lines is defined else 0 }}
          Reboot Required: {{ 'Yes' if reboot_required else 'No' }}
          Reboot Performed: {{ 'Yes' if (reboot_required and allow_reboot | bool) else 'No' }}

          {% if reboot_required and not allow_reboot | bool %}
          *** Run with -e "allow_reboot=true" to apply changes ***
          {% endif %}

          {% if nvidia_gpus.stdout_lines is defined and nvidia_gpus.stdout_lines | length > 0 %}
          === Next Steps for GPU Passthrough ===
          1. Create resource mapping in Proxmox UI:
             Datacenter > Resource Mappings > PCI Devices > Add
          2. Use mapping name in Terraform: mapping = "gpu-tesla-p40"
          {% endif %}

  handlers:
    - name: Update GRUB
      ansible.builtin.command: update-grub

    - name: Reload sysctl
      ansible.builtin.command: sysctl --system
