---
# Proxmox VE host networking maintenance.
#
# Two modes (controlled by the `pve_network_action` variable):
#
#   add_storage_vlan  (default)
#     Adds the vmbr0.210 sub-interface holding the Ceph storage IP
#     (10.10.210.41/24). Additive — no other interface touched. Idempotent.
#
#   remove_workload_subif
#     Removes the vmbr0.201 sub-interface (10.10.201.41). Only safe AFTER
#     Ceph has been migrated off VLAN 201. Idempotent.
#
# Why two modes in one playbook: the Ceph migration is a multi-day project.
# Day 1 adds vmbr0.210 (zero impact). Day N (after Ceph cutover) removes
# vmbr0.201. Both touch /etc/network/interfaces with identical guards so
# the safety story is identical.
#
# IMPORTANT (lessons from 2026-05-18 incident):
#   Any change to /etc/network/interfaces can lose the host's mgmt IP if
#   applied incorrectly. ALWAYS:
#     1. Have iKVM access ready (via IPMI at 10.10.200.21) before applying
#     2. Run in `--check --diff` mode first to confirm the diff
#     3. Verify mgmt IP still up post-change before exiting
#
# Usage:
#   # Mode 1 — add Ceph storage sub-interface (default action)
#   ansible-playbook -i inventory/wind/ playbooks/pve-network.yml --check --diff
#   ansible-playbook -i inventory/wind/ playbooks/pve-network.yml --diff
#
#   # Mode 2 — remove vestigial vmbr0.201 (post-Ceph-migration)
#   ansible-playbook -i inventory/wind/ playbooks/pve-network.yml \
#     -e "pve_network_action=remove_workload_subif" --check --diff
#   ansible-playbook -i inventory/wind/ playbooks/pve-network.yml \
#     -e "pve_network_action=remove_workload_subif" --diff

- name: Proxmox VE host network maintenance
  hosts: proxmox_hosts
  become: true
  gather_facts: true
  vars:
    # Which mode to run in. Override with `-e pve_network_action=...`.
    pve_network_action: add_storage_vlan

    # Host IP we MUST still be able to reach after any change
    pve_mgmt_ip: 10.10.200.41

    # Ceph storage sub-interface params (mode add_storage_vlan)
    pve_storage_subif: vmbr0.210
    pve_storage_ip:    "10.10.210.41/24"
    pve_storage_mtu:   9000

    # Sub-interface to remove (mode remove_workload_subif)
    pve_workload_subif: vmbr0.201

  tasks:
    - name: Validate pve_network_action value
      ansible.builtin.assert:
        that:
          - pve_network_action in ['add_storage_vlan', 'remove_workload_subif']
        fail_msg: "pve_network_action must be 'add_storage_vlan' or 'remove_workload_subif'"

    - name: Verify this is a Proxmox VE host
      ansible.builtin.stat:
        path: /usr/bin/pveversion
      register: pve_check
      failed_when: not pve_check.stat.exists

    - name: Read /etc/network/interfaces
      ansible.builtin.slurp:
        src: /etc/network/interfaces
      register: interfaces_raw

    - name: Decode interfaces file
      ansible.builtin.set_fact:
        interfaces_content: "{{ interfaces_raw.content | b64decode }}"

    - name: Guard — vmbr0.200 stanza must exist (mgmt is intact)
      ansible.builtin.assert:
        that:
          - interfaces_content is search("(?m)^\\s*iface\\s+vmbr0\\.200\\b")
        fail_msg: |
          /etc/network/interfaces does not have a vmbr0.200 stanza — refusing
          to touch the file. Mgmt IP appears to be configured differently than
          expected; aborting before we could brick the host.

    - name: Backup current interfaces file
      ansible.builtin.copy:
        src: /etc/network/interfaces
        dest: "/etc/network/interfaces.bak-{{ ansible_date_time.iso8601_basic_short }}"
        remote_src: true
        owner: root
        group: root
        mode: '0644'

    # =========================================================================
    # MODE: add_storage_vlan — append vmbr0.210 stanza if missing
    # =========================================================================
    - name: "[add_storage_vlan] Detect if vmbr0.210 stanza already exists"
      ansible.builtin.set_fact:
        has_storage_subif: "{{ interfaces_content is search('(?m)^\\s*iface\\s+vmbr0\\.210\\b') }}"
      when: pve_network_action == 'add_storage_vlan'

    - name: "[add_storage_vlan] Append vmbr0.210 stanza"
      ansible.builtin.blockinfile:
        path: /etc/network/interfaces
        # Insert before the `source /etc/network/interfaces.d/*` line so PVE's
        # generated SDN config (when later present) still loads after our block
        insertbefore: '^source\s+/etc/network/interfaces\.d/'
        marker: "# {mark} ANSIBLE MANAGED: vmbr0.210 (Ceph storage)"
        block: |

          auto {{ pve_storage_subif }}
          iface {{ pve_storage_subif }} inet static
              address {{ pve_storage_ip }}
              mtu {{ pve_storage_mtu }}
      when:
        - pve_network_action == 'add_storage_vlan'
        - not has_storage_subif | default(false)
      register: added_storage

    # =========================================================================
    # MODE: remove_workload_subif — strip vmbr0.201 stanza if present
    # =========================================================================
    - name: "[remove_workload_subif] Detect if vmbr0.201 stanza exists"
      ansible.builtin.set_fact:
        has_workload_subif: "{{ interfaces_content is search('(?m)^\\s*(auto\\s+|allow-[a-z]+\\s+)?vmbr0\\.201\\b') or
                                interfaces_content is search('(?m)^\\s*iface\\s+vmbr0\\.201\\b') }}"
      when: pve_network_action == 'remove_workload_subif'

    - name: "[remove_workload_subif] Pre-flight: Ceph mon must NOT still be on 10.10.201.41"
      ansible.builtin.shell: |
        set -o pipefail
        ss -tlnp 2>/dev/null | awk '/10\.10\.201\.41:(3300|6789)/{print}'
      args:
        executable: /bin/bash
      register: ceph_still_on_201
      changed_when: false
      failed_when: ceph_still_on_201.stdout != ''
      when: pve_network_action == 'remove_workload_subif'

    - name: "[remove_workload_subif] Remove vmbr0.201 'auto' line"
      ansible.builtin.replace:
        path: /etc/network/interfaces
        regexp: '(?m)^auto\s+vmbr0\.201\s*\n'
        replace: ''
      register: removed_auto
      when:
        - pve_network_action == 'remove_workload_subif'
        - has_workload_subif | default(false)

    - name: "[remove_workload_subif] Remove vmbr0.201 iface block (header + indented body)"
      ansible.builtin.replace:
        path: /etc/network/interfaces
        regexp: '(?m)^iface\s+vmbr0\.201\b[^\n]*\n(?:[ \t]+[^\n]*\n)*'
        replace: ''
      register: removed_iface
      when:
        - pve_network_action == 'remove_workload_subif'
        - has_workload_subif | default(false)

    - name: "[remove_workload_subif] Collapse triple-blank gaps from removal"
      ansible.builtin.replace:
        path: /etc/network/interfaces
        regexp: '\n{3,}'
        replace: "\n\n"
      when:
        - pve_network_action == 'remove_workload_subif'
        - removed_auto is changed or removed_iface is changed

    # =========================================================================
    # COMMON: apply + verify
    # =========================================================================
    - name: Determine if any change was made
      ansible.builtin.set_fact:
        any_change: >-
          {{
            (added_storage is defined and added_storage is changed) or
            (removed_auto is defined and removed_auto is changed) or
            (removed_iface is defined and removed_iface is changed)
          }}

    - name: Apply network changes (ifreload -a)
      # ifreload is idempotent — it only brings up/down interfaces whose
      # config actually changed. vmbr0.200 (mgmt) and vmbr0 (bridge) are
      # untouched, so the mgmt IP should remain.
      ansible.builtin.command: ifreload -a
      when: any_change
      register: ifreload_result
      changed_when: true

    - name: Pause for mgmt-plane to settle
      ansible.builtin.pause:
        seconds: 5
      when: any_change

    - name: Verify mgmt IP is still configured on vmbr0.200
      ansible.builtin.shell: |
        set -o pipefail
        ip -4 addr show vmbr0.200 | awk '/inet /{print $2}'
      args:
        executable: /bin/bash
      register: mgmt_ip_post
      changed_when: false
      failed_when: pve_mgmt_ip not in (mgmt_ip_post.stdout | default(''))

    - name: "[add_storage_vlan] Verify storage sub-interface is UP with expected IP"
      ansible.builtin.shell: |
        set -o pipefail
        ip -4 addr show {{ pve_storage_subif }} 2>/dev/null | awk '/inet /{print $2}'
      args:
        executable: /bin/bash
      register: storage_ip_post
      changed_when: false
      failed_when: (pve_storage_ip.split('/')[0]) not in (storage_ip_post.stdout | default(''))
      when: pve_network_action == 'add_storage_vlan'

    - name: "[remove_workload_subif] Confirm vmbr0.201 is gone"
      ansible.builtin.shell: |
        ip -br link show vmbr0.201 2>&1 | grep -q vmbr0.201 && echo present || echo absent
      args:
        executable: /bin/bash
      register: workload_subif_status
      changed_when: false
      failed_when: workload_subif_status.stdout != 'absent'
      when: pve_network_action == 'remove_workload_subif'

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "action:           {{ pve_network_action }}"
          - "changed:          {{ any_change }}"
          - "vmbr0.200 (mgmt): {{ mgmt_ip_post.stdout }}"
          - "vmbr0.210 (ceph): {{ storage_ip_post.stdout | default('n/a — not in add mode') }}"
          - "vmbr0.201 state: {{ workload_subif_status.stdout | default('n/a — not in remove mode') }}"
          - "backup file:      /etc/network/interfaces.bak-{{ ansible_date_time.iso8601_basic_short }}"
