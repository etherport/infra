---
# Proxmox VE host sshd tuning.
#
# Why: all S2S VPN clients reach PVE through a single source-NAT'd IP
# (the K8s WireGuard pod's host). When multiple clients race SSH from
# the same perceived source IP, sshd's default `MaxStartups 10:30:100`
# starts refusing 30% of new pre-auth connections at 10 in-flight, and
# `LoginGraceTime 120` makes stuck connections clog slots for 2 min.
# Bumping the limits + shortening the grace eliminates the intermittent
# SSH timeouts we hit during the 2026-05-18 maintenance window.
#
# Idempotent.
#
# Usage:
#   ansible-playbook -i inventory/wind/inventory.ini playbooks/pve-sshd.yml --check --diff
#   ansible-playbook -i inventory/wind/inventory.ini playbooks/pve-sshd.yml --diff

- name: Proxmox VE sshd tuning
  hosts: proxmox_hosts
  become: true
  gather_facts: false

  vars:
    # Public keys authorized to log in via SSH on PVE.
    # ed25519 only — each line bound to a specific 1Password item.
    #
    # NOTE on bootstrap: the playbook runs AS root over SSH, so the
    # automation@homelab pubkey must be in /root/.ssh/authorized_keys
    # before the first CI run. Seed it via local SSH (any existing
    # user that has SSH access + can elevate). After that, this list
    # is the source of truth — `exclusive: yes` removes any
    # out-of-band entries on apply.
    pve_root_authorized_keys:
      # Personal — emergency direct root access.
      - >-
        ssh-ed25519
        AAAAC3NzaC1lZDI1NTE5AAAAIHJaxovJWESV+EyzJVzx120nYxIfG3DIYp24J8bzlR6s
        graham-mac
      # M76 cutover: automation@homelab REMOVED — root@pve is now cert-only
      # (TrustedUserCAKeys, step-ca user CA) for automation (CI + the devbox agent
      # mint short-lived certs). graham-mac above stays as operator break-glass.
      # unifi-cert-sync job (k8s unifi-cert-sync ns) — pushes the cert-manager
      # CF wildcard to PVE's pveproxy, replacing the broken native Route53 ACME.
      - >-
        ssh-ed25519
        AAAAC3NzaC1lZDI1NTE5AAAAICaABoTxNhGnkW/FqpF9ztYGAv3efgAMZnUWoH66Ythz
        unifi-cert-sync@homelab

    # Personal interactive login (graham) — kept for convenience but
    # NOT used by automation. Empty list would lock graham out, so
    # we manage it explicitly with just the personal key.
    pve_graham_authorized_keys:
      - >-
        ssh-ed25519
        AAAAC3NzaC1lZDI1NTE5AAAAIHJaxovJWESV+EyzJVzx120nYxIfG3DIYp24J8bzlR6s
        graham-mac

  tasks:
    - name: Verify this is a Proxmox VE host
      ansible.builtin.stat:
        path: /usr/bin/pveversion
      register: pve_check
      failed_when: not pve_check.stat.exists

    - name: Manage root@pve authorized_keys (additive)
      ansible.posix.authorized_key:
        user: root
        state: present
        # NOT exclusive: PVE auto-generates a `ssh-rsa root@pve` host
        # key on install and adds it to /root/.ssh/authorized_keys for
        # internal self-SSH operations (pmxcfs, backup, cluster join).
        # Stripping it would break Proxmox internals. Out-of-band root
        # keys must be removed by hand.
        exclusive: false
        key: "{{ pve_root_authorized_keys | join('\n') }}"

    - name: Manage graham@pve authorized_keys
      ansible.posix.authorized_key:
        user: graham
        state: present
        exclusive: true
        key: "{{ pve_graham_authorized_keys | join('\n') }}"

    - name: Drop sshd MaxStartups + LoginGraceTime tuning
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-maxstartups.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # MANAGED BY ANSIBLE — playbooks/pve-sshd.yml
          #
          # Why: zombie preauth slots can pile up faster than sshd reclaims them
          # and trip MaxStartups random-drop on the NEXT legitimate SSH attempt.
          # Two scenarios we hit repeatedly:
          #   1. K8s-WireGuard-NAT source-IP collapse — all S2S VPN clients
          #      appear from the same WG-pod IP (k8s-wN). Default MaxStartups
          #      10:30:100 fills in a handful of races.
          #   2. TCP-probe storms (CI diagnostic workflows or port scanners)
          #      open TCP, never send a banner; sshd holds the preauth slot for
          #      LoginGraceTime seconds even though the client is gone. With
          #      LoginGraceTime=120 (default), 10 probes occupy slots for 2 min.
          # Mitigations:
          #   - MaxStartups 100:30:300: huge headroom; "drop start" at 100
          #     concurrent unauth, not 10.
          #   - LoginGraceTime 10: zombie banner-less probes reclaim in 10s.
          #   - PerSourceMaxStartups 100 (OpenSSH 8.5+): one bad actor cannot
          #     exhaust the whole pool. Originally set to 20 (2026-05-19) but
          #     ansible-proxmox.yml runs that did 5–6 rapid SSH connections
          #     tripped the counter at 06:17 UTC 2026-05-21 — `drop connection
          #     #0 ... Maxstartups` in PVE's journal. Possibly an OpenSSH 10.0
          #     counter-leak after SIGHUP reload; bumped to 100 for headroom
          #     (still bounded enough to deny a real flood). A clean restart
          #     of ssh after applying this config also resets stuck counters.
          #   - PerSourcePenaltyExemptList: 2026-05-19 root cause. OpenSSH
          #     9.8 (PVE 9.x ships 9.6/9.7+) enabled PerSourcePenalties by
          #     default — `noauth:1` accrues every TCP-only probe (port
          #     scanners, monitoring agents, our own diagnostic scripts) and
          #     `min:15` rounds the per-source block UP TO 15s minimum.
          #     Result: any source that opens 2-3 SSH connections without
          #     completing auth gets temp-banned for 15s+, with the ban
          #     growing as more probes hit. Symptoms: "Connection timed out
          #     during banner exchange" and SYN-drop intermittently. Exempt
          #     the entire homelab /16 — we trust our own automation; this
          #     does NOT affect public-internet penalties.
          MaxStartups 100:30:300
          LoginGraceTime 10
          PerSourceMaxStartups 100
          PerSourcePenaltyExemptList 10.10.0.0/16,10.254.0.0/16,10.255.0.0/16
      register: sshd_dropin

    - name: Validate sshd config
      ansible.builtin.command: sshd -t
      changed_when: false
      when: sshd_dropin is changed

    - name: Restart sshd (full restart, not reload — resets internal counters)
      ansible.builtin.systemd:
        name: ssh
        state: restarted
      when: sshd_dropin is changed
      # Note: this drops the in-progress ansible SSH connection. Ansible
      # transparently reconnects on the next task. The 2026-05-21 incident
      # taught us SIGHUP reload doesn't reset PerSourceMaxStartups counters
      # on OpenSSH 10.0 — a fresh master process avoids stuck counters.

    - name: Show effective sshd values
      ansible.builtin.shell: |
        sshd -T | grep -E '^(maxstartups|logingracetime|maxsessions)'
      args:
        executable: /bin/bash
      register: sshd_effective
      changed_when: false

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "changed:    {{ sshd_dropin is changed }}"
          - "{{ sshd_effective.stdout_lines }}"
