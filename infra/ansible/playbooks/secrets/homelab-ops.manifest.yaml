# Homelab operational secrets — 1Password is the MASTER copy.
#
# This manifest maps SOPS-secret keys -> 1Password references (op://vault/item-id/field).
# `scripts/sync-secrets.py` reads each ref via `op read` (run on a machine where 1P
# is unlocked, e.g. your laptop) and writes the encrypted homelab-ops.sops.yaml.
# The dev box + CI consume that SOPS file headlessly (age key) — no `op`, no unlocks.
#
# To ADD a secret later: add one line here, re-run `python3 scripts/sync-secrets.py`,
# commit. To rotate: change it in 1Password, re-run the sync, commit. 1P stays truth.
#
# Items are referenced by 1P item-ID (names with spaces/parens are invalid in op://).
# NOT secret itself (just pointers) — committed in the clear on purpose.

# Homelab Automation SSH Key (SSH_KEY item) — SSH to PVE / k8s / SBC / standalone VMs
automation_ssh_private_key: "op://Private/xow32nxrvix5ismyupmheyevpe/private key"
