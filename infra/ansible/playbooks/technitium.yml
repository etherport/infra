---
- name: Install Technitium DNS Server
  hosts: dns_servers
  become: true

  vars:
    technitium_version: "latest"
    # Admin credentials sourced from the same SOPS secret that the K8s
    # technitium pods consume. The `lookup('pipe', ...)` runs on the
    # control node (always, regardless of play-level become or --limit)
    # and uses the local age key to decrypt. Doing this here (vs a
    # pre-play with `set_fact` + `delegate_facts`) means `--limit
    # dns-fallback` doesn't accidentally skip credential loading.
    # Repo root is THREE levels up from playbook_dir
    # (infra/ansible/playbooks/.. → infra/ansible → infra → repo root).
    technitium_admin_secret_file: "{{ playbook_dir }}/../../../platform/kubernetes/technitium/05-secret.sops.yaml"
    _technitium_admin_secret: "{{ lookup('pipe', 'sops -d ' ~ (technitium_admin_secret_file | quote)) | from_yaml }}"
    # Technitium's `DNS_SERVER_ADMIN_PASSWORD` env var ONLY sets the
    # password for the built-in `admin` user. The `username` field in
    # the SOPS secret is descriptive metadata (the K8s deployment also
    # only consumes `password` — see 02-statefulset.yaml).
    technitium_admin_user: "admin"
    technitium_admin_password: "{{ _technitium_admin_secret.stringData.password }}"
    cluster_addresses:
      - "10.10.201.5"  # K8s cluster VIP
      - "10.10.201.6"  # Local fallback
      - "10.10.100.10"  # AWS remote
    # Bootstrap config — only applied when admin/admin defaults are
    # detected. After password change the playbook is idempotent on
    # subsequent runs (login uses the SOPS password).
    technitium_primary_zone: "wind.etherport.net"
    technitium_upstream_forwarders:
      - "1.1.1.1"
      - "1.0.0.1"
      - "8.8.8.8"
    technitium_conditional_forwarders:
      # AWS EC2 internal hostnames. Forwarded to the AWS edge box vpn-aws
      # (10.10.100.10 — Technitium on the consolidated private-infra_edge
      # instance since M110; dns-aws destroyed 2026-07-02 — pointed at the
      # AWS Route53 Resolver Inbound endpoint). The aws.etherport.net forwarder was
      # removed 2026-05-27 — the Route53 private zone for that name
      # was deleted with the broader Route53 → CF migration. See
      # docs/runbooks/aws-private-dns.md for historical context.
      - { zone: "us-west-2.compute.internal", forwarder: "10.10.100.10" }

  tasks:
    - name: Gather service facts
      service_facts:

    # =========================================================================
    # Pin /etc/resolv.conf to a static upstream BEFORE stopping the local
    # DNS service.
    #
    # On a fresh Ubuntu cloud-init VM, /etc/resolv.conf is a symlink to
    # /run/systemd/resolve/stub-resolv.conf (127.0.0.53). Stopping
    # systemd-resolved leaves that stub address pointing at nothing →
    # subsequent apt installs / downloads in this playbook fail with
    # "Temporary failure resolving 'archive.ubuntu.com'". Bit us on
    # 2026-05-16 during the dns-fallback rebuild.
    #
    # Fix: write a static /etc/resolv.conf naming the OTHER technitium
    # peers (excluding `inventory_hostname`'s own IP — since this very
    # host is what we're about to install Technitium on, it can't serve
    # its own queries until the end of the playbook). After Technitium
    # is up, the file stays as a permanent static config — Technitium
    # will be reachable on 127.0.0.1 too, but resolving via peers
    # is preferable during cold start.
    # =========================================================================
    - name: Compute upstream resolvers (cluster peers excluding self)
      set_fact:
        bootstrap_resolvers: "{{ cluster_addresses | reject('equalto', ip | default(ansible_host)) | list }}"

    - name: Replace /etc/resolv.conf symlink with a static file
      copy:
        dest: /etc/resolv.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by ansible (infra/ansible/playbooks/technitium.yml).
          # Pinned away from systemd-resolved's stub because this host
          # IS a DNS server — stopping resolved would orphan the stub.
          {% for r in bootstrap_resolvers %}
          nameserver {{ r }}
          {% endfor %}
          search wind.etherport.net
      # Use force=yes equivalent to break the existing symlink first
      register: resolv_conf_write

    # Stop existing DNS services that conflict with Technitium
    - name: Stop and disable Pi-hole FTL
      systemd:
        name: pihole-FTL
        state: stopped
        enabled: no
      when: ansible_facts.services['pihole-FTL.service'] is defined
      ignore_errors: yes

    - name: Stop and disable BIND/named
      systemd:
        name: named
        state: stopped
        enabled: no
      when: ansible_facts.services['named.service'] is defined
      ignore_errors: yes

    - name: Stop and disable unbound
      systemd:
        name: unbound
        state: stopped
        enabled: no
      when: ansible_facts.services['unbound.service'] is defined
      ignore_errors: yes

    - name: Stop and disable systemd-resolved (if using port 53)
      systemd:
        name: systemd-resolved
        state: stopped
        enabled: no
      when: ansible_facts.services['systemd-resolved.service'] is defined
      ignore_errors: yes

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install dependencies
      apt:
        name:
          - curl
          - wget
          - apt-transport-https
        state: present

    - name: Download .NET install script
      get_url:
        url: https://dot.net/v1/dotnet-install.sh
        dest: /tmp/dotnet-install.sh
        mode: "0755"

    # Technitium DNS Server bumped its target framework to .NET 10 around
    # 2026-Q1. The dotnet-install.sh `--channel 10.0` resolves to the
    # latest 10.0.x release. (Previous version on 9.0 — leaving the dir
    # in place if already there since .NET runtimes are side-by-side.)
    - name: Install .NET 10.0 runtime
      shell: /tmp/dotnet-install.sh --channel 10.0 --runtime dotnet --install-dir /usr/share/dotnet
      args:
        creates: /usr/share/dotnet/shared/Microsoft.NETCore.App/10.0.0

    - name: Install ASP.NET Core 10.0 runtime
      shell: /tmp/dotnet-install.sh --channel 10.0 --runtime aspnetcore --install-dir /usr/share/dotnet
      args:
        creates: /usr/share/dotnet/shared/Microsoft.AspNetCore.App/10.0.0

    - name: Create dotnet symlink
      file:
        src: /usr/share/dotnet/dotnet
        dest: /usr/local/bin/dotnet
        state: link

    - name: Create Technitium install directory
      file:
        path: /opt/technitium
        state: directory
        mode: "0755"

    - name: Download Technitium DNS Server
      get_url:
        url: "https://download.technitium.com/dns/DnsServerPortable.tar.gz"
        dest: "/tmp/DnsServerPortable.tar.gz"
        mode: "0644"

    - name: Extract Technitium
      unarchive:
        src: /tmp/DnsServerPortable.tar.gz
        dest: /opt/technitium
        remote_src: yes
        creates: /opt/technitium/DnsServerApp.dll

    # =========================================================================
    # Admin credentials from SOPS — `technitium_admin_user` and
    # `technitium_admin_password` are resolved lazily from `vars:` via the
    # `lookup('pipe', 'sops -d ...')` pattern. Lookup runs on the control
    # node so the playbook's `become: true` doesn't interfere. Used here
    # to write an EnvironmentFile so DNS_SERVER_ADMIN_PASSWORD is set on
    # first start. After the admin user exists, Technitium ignores the
    # env var — safe to leave permanently.
    # =========================================================================
    - name: Create /etc/technitium directory for env override file
      file:
        path: /etc/technitium
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Write admin-password env override (mode 0600)
      copy:
        dest: /etc/technitium/admin-password.env
        owner: root
        group: root
        mode: "0600"
        content: |
          DNS_SERVER_ADMIN_PASSWORD={{ technitium_admin_password }}
      no_log: true
      notify: Restart technitium

    - name: Create systemd service file
      copy:
        dest: /etc/systemd/system/technitium.service
        mode: "0644"
        content: |
          [Unit]
          Description=Technitium DNS Server
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory=/opt/technitium
          # DNS_SERVER_ADMIN_PASSWORD only takes effect on FIRST start (when
          # the admin user doesn't exist yet). After that Technitium ignores
          # it — safe to leave configured.
          EnvironmentFile=/etc/technitium/admin-password.env
          ExecStart=/usr/share/dotnet/dotnet /opt/technitium/DnsServerApp.dll
          Restart=always
          RestartSec=10
          User=root

          [Install]
          WantedBy=multi-user.target
      notify: Restart technitium

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Enable and start Technitium service
      systemd:
        name: technitium
        enabled: yes
        state: started

    - name: Configure firewall - allow DNS (port 53)
      ufw:
        rule: allow
        port: "53"
        proto: "{{ item }}"
      loop:
        - tcp
        - udp
      when: ansible_facts.services['ufw.service'] is defined

    - name: Configure firewall - allow Technitium web UI (port 5380)
      ufw:
        rule: allow
        port: "5380"
        proto: tcp
      when: ansible_facts.services['ufw.service'] is defined

    - name: Wait for Technitium to be ready
      wait_for:
        port: 5380
        delay: 5
        timeout: 60

    # =========================================================================
    # Optional: Restore from backup
    # =========================================================================
    # To restore from a backup, set technitium_restore_backup to the local path
    # of the backup tarball. Example:
    #   ansible-playbook playbooks/technitium.yml -e "technitium_restore_backup=/path/to/backup.tar.gz"

    - name: Check if restore backup is specified
      set_fact:
        restore_backup: "{{ technitium_restore_backup | default('') }}"

    - name: Copy backup to server
      copy:
        src: "{{ restore_backup }}"
        dest: /tmp/technitium-backup.tar.gz
        mode: "0644"
      when: restore_backup | length > 0

    - name: Stop Technitium for restore
      systemd:
        name: technitium
        state: stopped
      when: restore_backup | length > 0

    - name: Remove existing config
      file:
        path: /opt/technitium/config
        state: absent
      when: restore_backup | length > 0

    - name: Restore config from backup
      unarchive:
        src: /tmp/technitium-backup.tar.gz
        dest: /opt/technitium/
        remote_src: yes
      when: restore_backup | length > 0

    - name: Start Technitium after restore
      systemd:
        name: technitium
        state: started
      when: restore_backup | length > 0

    # =========================================================================
    # Bootstrap config (idempotent, skipped when restoring from backup)
    # =========================================================================
    # Three pieces, all via Technitium's HTTP API at localhost:5380:
    #   1. Verify the admin password (set via env var on first boot)
    #   2. Create the wind.etherport.net primary zone if missing —
    #      dns-sync-watcher pushes RECORDS but won't create the zone
    #      itself, so this is a hard prerequisite for the cluster's
    #      DNS GitOps flow to work on a fresh install.
    #   3. Configure upstream + conditional forwarders.
    #
    # All API calls are idempotent: zone creation checks existence first;
    # forwarder settings are a wholesale set (PUTting the same value is
    # a no-op). Safe to re-run the playbook indefinitely.
    # =========================================================================

    - name: Login to Technitium API
      uri:
        url: "http://localhost:5380/api/user/login?user={{ technitium_admin_user }}&pass={{ technitium_admin_password | urlencode }}&includeInfo=false"
        method: GET
        return_content: yes
        body_format: json
      register: technitium_login
      until: technitium_login.json.status == "ok"
      retries: 10
      delay: 3
      no_log: true
      when: restore_backup | length == 0

    - name: Set API token fact
      set_fact:
        technitium_token: "{{ technitium_login.json.token }}"
      no_log: true
      when: restore_backup | length == 0

    # =========================================================================
    # Create the `graham` admin user so dns-sync-watcher (which auths as the
    # SOPS `username` field) can push records to this replica. The K8s
    # technitium pods get this user via a different bootstrap path; this
    # task ensures standalone replicas also have it.
    # =========================================================================
    - name: List existing users
      uri:
        url: "http://localhost:5380/api/admin/users/list?token={{ technitium_token }}"
        method: GET
        return_content: yes
      register: technitium_users
      no_log: true
      when: restore_backup | length == 0

    - name: Create sync user (graham) if missing
      uri:
        url: "http://localhost:5380/api/admin/users/create?token={{ technitium_token }}&user={{ _technitium_admin_secret.stringData.username }}&pass={{ _technitium_admin_secret.stringData.password | urlencode }}"
        method: POST
      no_log: true
      when:
        - restore_backup | length == 0
        - _technitium_admin_secret.stringData.username != "admin"
        - _technitium_admin_secret.stringData.username not in (technitium_users.json.response.users | default([]) | map(attribute='username') | list)

    # Use /users/set (not /users/update) — the latter exists but ignores
    # the memberOfGroups parameter in Technitium v13. The set endpoint is
    # the authoritative full-update operation.
    - name: Add sync user to Administrators group
      uri:
        url: "http://localhost:5380/api/admin/users/set?token={{ technitium_token }}&user={{ _technitium_admin_secret.stringData.username }}&memberOfGroups=Administrators"
        method: POST
      no_log: true
      when:
        - restore_backup | length == 0
        - _technitium_admin_secret.stringData.username != "admin"

    - name: List existing zones
      uri:
        url: "http://localhost:5380/api/zones/list?token={{ technitium_token }}&pageNumber=1&zonesPerPage=100"
        method: GET
        return_content: yes
      register: technitium_zones
      when: restore_backup | length == 0
      no_log: true

    - name: Create primary zone {{ technitium_primary_zone }} if missing
      uri:
        url: "http://localhost:5380/api/zones/create?token={{ technitium_token }}&zone={{ technitium_primary_zone }}&type=Primary"
        # L28: token travels in the URL — keep it out of ansible output on failure/-v
        method: POST
      no_log: true
      when:
        - restore_backup | length == 0
        - technitium_primary_zone not in (technitium_zones.json.response.zones | default([]) | map(attribute='name') | list)

    - name: Create conditional forwarder zones
      uri:
        url: "http://localhost:5380/api/zones/create?token={{ technitium_token }}&zone={{ item.zone }}&type=Forwarder&initializeForwarder=true&protocol=Udp&forwarder={{ item.forwarder }}"
        # L28: token travels in the URL — keep it out of ansible output on failure/-v
        method: POST
      no_log: true
      loop: "{{ technitium_conditional_forwarders }}"
      loop_control:
        label: "{{ item.zone }} → {{ item.forwarder }}"
      when:
        - restore_backup | length == 0
        - item.zone not in (technitium_zones.json.response.zones | default([]) | map(attribute='name') | list)

    - name: Configure upstream forwarders + server defaults
      uri:
        url: "http://localhost:5380/api/settings/set?token={{ technitium_token }}&forwarders={{ technitium_upstream_forwarders | join(',') }}&forwarderProtocol=Udp&dnssecValidation=true&logUsingLocalTime=true"
        # L28: token travels in the URL — keep it out of ansible output on failure/-v
        method: POST
      no_log: true
      when: restore_backup | length == 0

    # Filesystem-level log retention. Technitium's built-in maxLogFileDays
    # setting is the *preferred* way to bound log size, but it requires API
    # access with the admin password — and the standalone (non-cluster)
    # Technitium nodes (vpn-aws, dns-fallback) have different admin
    # credentials than the K8s cluster Technitium, so the
    # `technitium-set-log-retention` K8s CronJob can't reach them. This
    # systemd timer is the durable fallback: deletes log files older than
    # 7 days on every node managed by this playbook.
    # First-discovered 2026-05-25 when dns-aws hit 80% disk with 144 days
    # of query logs (1.3GB on a 6.8GB volume).
    - name: Install log-prune script for Technitium
      copy:
        dest: /usr/local/sbin/technitium-prune-logs.sh
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/usr/bin/env bash
          # Prune Technitium daily log files older than 7 days.
          # Matches Technitium's own maxLogFileDays=7 setting used in cluster.
          set -euo pipefail
          LOGS_DIR=/opt/technitium/config/logs
          if [ -d "$LOGS_DIR" ]; then
            find "$LOGS_DIR" -maxdepth 1 -type f -name '*.log' -mtime +7 -delete
          fi
          STATS_DIR=/opt/technitium/config/stats
          if [ -d "$STATS_DIR" ]; then
            # Stat files are JSON, much smaller (~5KB each), keep 90d.
            find "$STATS_DIR" -maxdepth 1 -type f -mtime +90 -delete
          fi

    - name: Install systemd service for log prune
      copy:
        dest: /etc/systemd/system/technitium-prune-logs.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Prune old Technitium DNS query logs

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/technitium-prune-logs.sh

    - name: Install systemd timer for log prune (daily at 03:15)
      copy:
        dest: /etc/systemd/system/technitium-prune-logs.timer
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Daily Technitium log prune

          [Timer]
          OnCalendar=*-*-* 03:15:00
          # Run shortly after boot if missed (e.g. instance was stopped at scheduled time)
          Persistent=true

          [Install]
          WantedBy=timers.target

    - name: Enable + start log-prune timer
      systemd:
        name: technitium-prune-logs.timer
        state: started
        enabled: true
        daemon_reload: true

    - name: Display access information
      debug:
        msg: |
          Technitium DNS Server installed successfully!
          Web UI: http://{{ ansible_host }}:5380
          DNS: {{ ansible_host }}:53

          {% if restore_backup | length > 0 %}
          Configuration restored from backup.
          {% else %}
          Bootstrap complete:
            - Admin user: {{ technitium_admin_user }} (password from SOPS)
            - Primary zone: {{ technitium_primary_zone }} (records pushed by
              dns-sync-watcher in the K8s `dns` namespace within ~5s)
            - Upstream forwarders: {{ technitium_upstream_forwarders | join(', ') }}
            - Conditional forwarders: {{ technitium_conditional_forwarders | map(attribute='zone') | join(', ') }}
          {% endif %}

  handlers:
    - name: Restart technitium
      systemd:
        name: technitium
        state: restarted
        daemon_reload: yes
