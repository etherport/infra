---
# UDM firewall policies via the UniFi 10+ zone-policy API.
#
# Why this playbook exists (and not Terraform):
#   The unifi TF provider (ubiquiti-community/unifi since M125; formerly
#   paultyng/unifi) only speaks the legacy /rest/firewallrule endpoint,
#   which on UniFi 10+ rejects address-group creates + applies stricter
#   rule_index ranges (FirewallGroupInvalidArgs, FirewallRuleIndexOutOfRange).
#   The "modern" zone-based v2 API at /proxy/network/v2/api/.../firewall-policies
#   has no Terraform provider with reliable coverage.
#
# This playbook drives that v2 API directly via uri{} tasks. Idempotent:
#   1. Login → capture TOKEN cookie + CSRF.
#   2. Resolve zone IDs by name (Internal, External, Gateway, IoT, …).
#   3. Reconcile address-groups + port-groups (objects). Update if drifted.
#   4. Reconcile firewall policies by name. Create or update.
#
# Configure rules via the `udm_firewall_*` vars below.
#
# Auth (in preference order): UDM_API_KEY env var (CI / SOPS `udm_api_key`,
# X-API-KEY header — M47) → UDM_USERNAME/UDM_PASSWORD env vars → 1Password
# "UDM (tf-admin)" via `op` (interactive-laptop fallback only; `op` does NOT
# work from agent shells).
#
# Usage (check / apply against the real UDM):
#   ansible-playbook -i inventory/wind/inventory.ini \
#     playbooks/udm-firewall.yml --check --diff
#   ansible-playbook -i inventory/wind/inventory.ini \
#     playbooks/udm-firewall.yml
#
# This playbook runs on `localhost` (your laptop or the gh-runner) using
# the local `op` CLI + HTTPS to the UDM at https://10.10.200.1.

- name: UDM firewall policies (zone-based v2 API)
  hosts: localhost
  connection: local
  gather_facts: false
  # Override any inherited become: true from group_vars — we're just
  # running local CLI + HTTPS calls, no sudo needed.
  become: false

  vars:
    udm_base: "https://10.10.200.1"
    udm_site: default
    # Validate the UDM controller cert? Defaults to no because it's a
    # self-signed UniFi-internal cert. Set true once a real cert is wired.
    udm_validate_certs: false

    # ---- Address-group objects to reconcile ----
    # Keys: name (str), members (list of CIDRs or IPs)
    udm_address_groups:
      - name: syslog-sources-unvr-unas
        members:
          - "10.10.212.10"   # UNVR / Protect controller (VLAN 212 Unifi zone=Internal)
          - "10.10.209.10"   # UNAS / Sequoia (VLAN 209 vSAN, currently zoneless)
      - name: syslog-receiver-alloy
        members:
          - "10.10.201.73"   # Alloy MetalLB LB (VLAN 201 Servers, currently zoneless)

      # ----------------------------------------------------------------
      # Zone-migration pre-flight (2026-05-27, M30 Phase 0).
      # Per-subnet IP groups so subsequent zone-policy rules can reference
      # them by name instead of hard-coded CIDRs. See
      # docs/planning/firewall-zones-future-state.md §2.4.
      # ----------------------------------------------------------------
      - name: Management-Network
        members: ["10.10.200.0/24"]
      - name: Servers-Network
        members: ["10.10.201.0/24"]
      - name: Client-Network
        members: ["10.10.202.0/24"]
      - name: IoT-Network
        members: ["10.10.204.0/24"]
      - name: Security-Network
        members: ["10.10.205.0/24"]
      - name: vSAN-Network
        members: ["10.10.209.0/24"]
      - name: Ceph-Network
        members: ["10.10.210.0/24"]
      - name: Unifi-Network
        members: ["10.10.212.0/24"]
      - name: Home-Assistant
        # HA's macvlan outbound IPs across the 3 IoT-adjacent VLANs.
        # All three reach the same pod; group makes the
        # Trusted-to-Hue / IoT-to-HA rules clean.
        members:
          - "10.10.202.25"
          - "10.10.204.25"
          - "10.10.205.25"
      - name: Router-Gateway
        # UDM's own LAN-facing IPs. Used by allows targeting UDM
        # services (DNS-fwd, NTP, UI). Add 10.10.199.1 (Default VLAN
        # interface) since Talk-SIP listens there.
        members:
          - "10.10.200.1"
          - "10.10.199.1"
      - name: AWS-Networks
        # AWS-side VPN destinations reachable through the WG tunnel.
        # Covers the us-west-2 VPC, the WG transit /29, and the
        # advisor's regional VPN supernet.
        members:
          - "10.10.100.0/22"
          - "10.255.255.0/29"
          - "10.254.0.0/24"

      # ----------------------------------------------------------------
      # Trusted/Management zone split (M56, 2026-05-31). Groups for the
      # cross-zone allows that other zones need into Trusted.
      # ----------------------------------------------------------------
      - name: DNS-Servers
        # The two on-net resolvers, both in Servers/201 → Trusted.
        members:
          - "10.10.201.5"    # K8s Technitium primary VIP (MetalLB)
          - "10.10.201.6"    # dns-fallback standalone VM (Technitium secondary)
      - name: WireGuard-VIP
        members:
          - "10.10.201.20"   # Keepalived WG endpoint VIP (Servers/201 → Trusted)

      # ----------------------------------------------------------------
      # Trusted admin clients → Management (2026-06-10). Named trusted hosts
      # on Clients/202 — the Mac mini RC/ops box + the admin laptop — that
      # administer the management plane (Proxmox, UDM, switches). They are
      # switch-routed/zoneless, so they enter the UDM via the Internal transit
      # (same match pattern as the syslog rule). Scoped to NAMED hosts, not all
      # of Clients/202. Risk-equivalent to the already-allowed Vpn→Management
      # path used for remote admin (which is why this is acceptable).
      # ----------------------------------------------------------------
      - name: trusted-admin-clients
        members:
          - "10.10.202.101"  # Mac mini — Claude Code RC / ops host (Clients/202)
          # - "10.10.202.NNN"  # admin laptop LAN IP — added on apply from the laptop
      - name: mgmt-admin-hosts
        # H34: Management-plane hosts the trusted clients reach. Narrows the
        # destination from the whole Management/200 zone to named hosts.
        members:
          - "10.10.200.41"   # pve.wind.etherport.net — Proxmox VE (tf provider :8006, SSH)

    # Reuse the syslog-port-514 port group that the legacy paultyng/unifi
    # attempt left behind (id `6a138b2e92b8269077a388a3` in our test).
    # If it doesn't exist (fresh rebuild), this task creates it.
    udm_port_groups:
      - name: syslog-port-514
        members: ["514"]

      # ---- Zone-migration pre-flight port groups (M30 Phase 0) ----
      - name: NTP-Port
        members: ["123"]
      - name: HomeAssistant-Port
        members: ["8123"]
      - name: UniFi-Adoption-Ports
        # 8080 (inform), 3478 (STUN). Used by APs/switches/phones
        # to register with the UDM controller.
        members: ["8080", "3478"]

      - name: WireGuard-Ports
        # Keepalived/WG listen ports behind the External→Trusted port-fwd.
        members: ["9820", "9821"]

      - name: DNS-Ports
        # Strict DNS (udp+tcp 53). Used to keep Management→Trusted to DNS only,
        # not any-port-to-the-resolvers.
        members: ["53"]

      - name: Mgmt-Admin-Ports
        # H34: admin-plane ports the trusted clients actually use — SSH(22),
        # HTTPS admin UIs(443), Proxmox VE web/API(8006). All TCP.
        members: ["22", "443", "8006"]

      - name: Vpn-Admin-Ports
        # M42: break-glass admin ports for the UDM backup WireGuard tunnel (Vpn zone),
        # so a future VPN client can fix the cluster/PVE when the primary VPN is down
        # WITHOUT getting full LAN reach. SSH(22), DNS(53), HTTP/S admin UIs(80/443),
        # kube-apiserver(6443), Proxmox(8006). All TCP. Widen on the spot in the UI if a
        # real incident needs more.
        members: ["22", "53", "80", "443", "6443", "8006"]

    # ---- Firewall policies (zone-based v2 API) ----
    # Each policy must specify:
    #   name, action (ALLOW|BLOCK), protocol (udp|tcp|tcp_udp|all|...),
    #   index (sort priority — lower=earlier; user rules typically 10000+),
    #   source: { zone_name, ip_group_name? | ips? | matching_target=ANY }
    #   destination: same shape + optional port_group_name
    # The playbook resolves zone_name → zone_id and ip_group_name → object_id
    # at runtime so the rules stay readable + survive controller rebuilds
    # (new IDs minted on rebuild won't break the manifests).
    udm_firewall_policies:
      - name: "Allow syslog UNVR+UNAS → Alloy UDP/514"
        action: ALLOW
        protocol: udp
        index: 11000
        enabled: true
        logging: false
        source:
          # Match by IP-object; zone=Internal works because UNVR's VLAN
          # is Internal. UNAS's vSAN VLAN isn't in any zone today, but
          # source-side matching is by IP-group, so the zone is just a
          # scope hint — actual match is on the IPs in the object.
          zone_name: Internal
          ip_group_name: syslog-sources-unvr-unas
        destination:
          # Destination Servers VLAN isn't in any zone; using "Internal"
          # as the destination zone with explicit IP-object matching
          # gives the policy a concrete target. If the rule fails to
          # match due to zone mismatch, switch dst zone to a wildcard
          # (UniFi may expose a 'Network' zone for unzoned nets).
          zone_name: Internal
          ip_group_name: syslog-receiver-alloy
          port_group_name: syslog-port-514

      # ===================================================================
      # M56 — Trusted / Management zone split (2026-05-31).
      # Target: Trusted = {Servers/201}; Management = {200}; Internal keeps
      # Default/199. These policies are created while 200/201 are STILL in
      # Internal — inert until the networks are moved into the new zones (UI),
      # so applying this is safe/additive.
      #
      # Design: Trusted is the trusted workload tier (broad egress, mirrors
      # Internal's current posture so the move is behaviour-neutral for
      # workloads). Management is CONTAINED — it may only reach Trusted for DNS
      # + syslog and the gateway/Internet; it is default-denied to IoT / Guest /
      # Security / etc. The cluster manages the infra, so Trusted→Management is
      # open (poller, gh-runner, backup, cert-sync) while Management→Trusted is
      # tight. Stateful returns are auto-created by UniFi (create_allow_respond).
      # ===================================================================

      # ---- Trusted intra-zone (REQUIRED) ----
      # Custom zones default intra-zone to BLOCK (unlike the built-in Internal,
      # which has a predefined Allow-All). The cluster reaches the AWS subnets
      # via a UDM static route whose next-hop (10.10.201.20) is back inside 201
      # — the UDM evaluates that hairpin as Trusted→Trusted. Without this allow,
      # the cluster→AWS (WG VIP) path is dropped. (Root cause of the 2026-05-31
      # dns-aws/vpn-aws TargetDown right after the zone move.)
      - { name: "Trusted → Trusted (intra-zone)", action: ALLOW, protocol: all, index: 11990, enabled: true, logging: false, source: { zone_name: Trusted }, destination: { zone_name: Trusted } }

      # ---- Trusted egress ----
      # External/Gateway dests reject create_allow_respond (egress uses stateful conntrack).
      - { name: "Trusted → External (all)",       action: ALLOW, protocol: all, index: 12000, enabled: true, logging: false, create_allow_respond: false, source: { zone_name: Trusted }, destination: { zone_name: External } }
      - { name: "Trusted → Gateway (all)",        action: ALLOW, protocol: all, index: 12010, enabled: true, logging: false, create_allow_respond: false, source: { zone_name: Trusted }, destination: { zone_name: Gateway } }
      - { name: "Trusted → Vpn (all)",            action: ALLOW, protocol: all, index: 12020, enabled: true, logging: false, source: { zone_name: Trusted }, destination: { zone_name: Vpn } }
      - { name: "Trusted → Internal (all)",       action: ALLOW, protocol: all, index: 12030, enabled: true, logging: false, source: { zone_name: Trusted }, destination: { zone_name: Internal } }
      - { name: "Trusted → Infrastructure (all)", action: ALLOW, protocol: all, index: 12040, enabled: true, logging: false, source: { zone_name: Trusted }, destination: { zone_name: Infrastructure } }
      - { name: "Trusted → Management (all)",      action: ALLOW, protocol: all, index: 12050, enabled: true, logging: false, source: { zone_name: Trusted }, destination: { zone_name: Management } }

      # ---- Trusted ingress ----
      - { name: "Internal → Trusted (all)",       action: ALLOW, protocol: all, index: 12070, enabled: true, logging: false, source: { zone_name: Internal },       destination: { zone_name: Trusted } }
      - { name: "Gateway → Trusted (all)",        action: ALLOW, protocol: all, index: 12080, enabled: true, logging: false, source: { zone_name: Gateway },        destination: { zone_name: Trusted } }
      - { name: "Vpn → Trusted (admin)",          action: ALLOW, protocol: tcp, index: 12091, enabled: true, logging: true,  source: { zone_name: Vpn },            destination: { zone_name: Trusted, port_group_name: Vpn-Admin-Ports } }
      - { name: "Infrastructure → Trusted (all)", action: ALLOW, protocol: all, index: 12100, enabled: true, logging: false, source: { zone_name: Infrastructure }, destination: { zone_name: Trusted } }
      - name: "IoT → Trusted (DNS)"
        action: ALLOW
        protocol: tcp_udp
        index: 12110
        enabled: true
        logging: false
        source: { zone_name: IoT }
        destination: { zone_name: Trusted, ip_group_name: DNS-Servers }
      - name: "Hotspot → Trusted (DNS)"
        action: ALLOW
        protocol: tcp_udp
        index: 12120
        enabled: true
        logging: false
        source: { zone_name: Hotspot }
        destination: { zone_name: Trusted, ip_group_name: DNS-Servers }
      - name: "External → Trusted (WireGuard)"
        action: ALLOW
        protocol: udp
        index: 12130
        enabled: true
        logging: false
        source: { zone_name: External }
        destination: { zone_name: Trusted, ip_group_name: WireGuard-VIP, port_group_name: WireGuard-Ports }

      # ---- Management (contained) ----
      - { name: "Management → External (all)", action: ALLOW, protocol: all, index: 12200, enabled: true, logging: false, create_allow_respond: false, source: { zone_name: Management }, destination: { zone_name: External } }
      - { name: "Management → Gateway (all)",  action: ALLOW, protocol: all, index: 12210, enabled: true, logging: false, create_allow_respond: false, source: { zone_name: Management }, destination: { zone_name: Gateway } }
      - { name: "Vpn → Management (admin)",     action: ALLOW, protocol: tcp, index: 12241, enabled: true, logging: true,  source: { zone_name: Vpn },        destination: { zone_name: Management, port_group_name: Vpn-Admin-Ports } }
      - { name: "Gateway → Management (all)",   action: ALLOW, protocol: all, index: 12250, enabled: true, logging: false, source: { zone_name: Gateway },    destination: { zone_name: Management } }
      - name: "Management → Trusted (DNS)"
        action: ALLOW
        protocol: tcp_udp
        index: 12220
        enabled: true
        logging: false
        source: { zone_name: Management }
        destination: { zone_name: Trusted, ip_group_name: DNS-Servers, port_group_name: DNS-Ports }
      - name: "Management → Trusted (syslog → Alloy)"
        action: ALLOW
        protocol: udp
        index: 12230
        enabled: true
        logging: false
        source: { zone_name: Management }
        destination: { zone_name: Trusted, ip_group_name: syslog-receiver-alloy, port_group_name: syslog-port-514 }

      # ---- Trusted admin clients (Clients/202) → Management admin ports (H34, 2026-06-11) ----
      # Named trusted hosts (mini RC box + admin laptop) reach the management
      # plane on the admin ports they actually use (SSH/HTTPS/PVE-API), NOT all
      # ports to the whole zone. Source matched by the trusted-admin-clients
      # IP-group (zone_name Internal is the transit scope-hint, same as the
      # syslog rule); destination scoped to mgmt-admin-hosts + Mgmt-Admin-Ports.
      # logging:true so client-VLAN→management access is auditable. The
      # UDM/Gateway itself is already reachable via Clients→Gateway.
      - name: "Trusted admin clients (Clients/202) → Management (admin ports)"
        action: ALLOW
        protocol: tcp
        index: 12260
        enabled: true
        logging: true
        source: { zone_name: Internal, ip_group_name: trusted-admin-clients }
        destination: { zone_name: Management, ip_group_name: mgmt-admin-hosts, port_group_name: Mgmt-Admin-Ports }

  pre_tasks:
    # M47 (2026-06-24): prefer the rotatable Integration-API key (X-API-Key). It also
    # authenticates the legacy /api/ + v2 /v2/api/ endpoints this playbook uses (verified
    # 2026-06-24: GET firewall-policies + firewallgroup → 200 with X-API-Key; bad key → 401).
    # Headless/devbox + CI source it from env UDM_API_KEY (SOPS bundle / GH secret).
    # If no key is present, fall back to the legacy username/password login below — a
    # non-breaking migration; drop the fallback once UDM_API_KEY is wired into CI.
    - name: Use env-var API key when present (preferred — M47)
      ansible.builtin.set_fact:
        udm_api_key: "{{ lookup('env', 'UDM_API_KEY') }}"
      no_log: true
      when: lookup('env', 'UDM_API_KEY') | length > 0

    - name: Resolve username/password (legacy fallback — only when no API key)
      when: udm_api_key | default('') | length == 0
      block:
        # Prefer env vars (CI — UDM_USERNAME/UDM_PASSWORD from GH secrets via
        # ansible-unifi.yml), fall back to the 1Password CLI (laptop, op agent unlocked).
        - name: Use env-var credentials when present (CI)
          ansible.builtin.set_fact:
            udm_username: "{{ lookup('env', 'UDM_USERNAME') }}"
            udm_password: "{{ lookup('env', 'UDM_PASSWORD') }}"
          no_log: true
          when: lookup('env', 'UDM_USERNAME') | length > 0

        # Use command modules (not pipe lookup) so we get proper terminal
        # access to the 1Password CLI session/agent. Lookups run in a stripped
        # subprocess that can't see OP_SESSION.
        - name: Fetch credentials from 1Password (laptop fallback)
          when: lookup('env', 'UDM_USERNAME') | length == 0
          block:
            - name: Verify op CLI present
              ansible.builtin.command: op --version
              changed_when: false
            - name: Fetch UDM username from 1Password
              ansible.builtin.command:
                argv: [op, item, get, "UDM (tf-admin)", --fields, username]
              register: udm_user_op
              changed_when: false
              no_log: true
            - name: Fetch UDM password from 1Password
              ansible.builtin.command:
                argv: [op, item, get, "UDM (tf-admin)", --fields, password, --reveal]
              register: udm_pass_op
              changed_when: false
              no_log: true
            - name: Set UDM credential facts from 1Password
              ansible.builtin.set_fact:
                udm_username: "{{ udm_user_op.stdout | trim }}"
                udm_password: "{{ udm_pass_op.stdout | trim }}"
              no_log: true

    - name: Assert UDM auth present (API key OR username+password)
      ansible.builtin.assert:
        that:
          - (udm_api_key | default('') | length > 0) or (udm_username | default('') | length > 0 and udm_password | default('') | length > 0)
        fail_msg: "No UDM auth — set UDM_API_KEY (preferred), or UDM_USERNAME/UDM_PASSWORD env, or 1Password 'UDM (tf-admin)'."

  tasks:
    # -----------------------------------------------------------------
    # 1. Login → capture TOKEN + CSRF
    # -----------------------------------------------------------------
    # Login flow runs ONLY in the legacy fallback (no UDM_API_KEY). With an API key
    # these three tasks are skipped — auth is the X-API-Key header built below.
    - name: UDM login
      check_mode: false # read-only auth; must run under --check for a real dry-run
      ansible.builtin.uri:
        url: "{{ udm_base }}/api/auth/login"
        method: POST
        validate_certs: "{{ udm_validate_certs }}"
        body_format: json
        body:
          username: "{{ udm_username }}"
          password: "{{ udm_password }}"
        status_code: 200
        return_content: false
      register: udm_login
      no_log: true
      when: udm_api_key | default('') | length == 0

    - name: Extract TOKEN cookie + CSRF from login headers
      ansible.builtin.set_fact:
        udm_token: "{{ udm_login.set_cookie | regex_search('TOKEN=([^;]+)', '\\1') | first }}"
        udm_csrf: "{{ udm_login['x_updated_csrf_token'] | default(udm_login.x_csrf_token | default('')) }}"
      no_log: true
      when: udm_api_key | default('') | length == 0

    - name: Sanity-check session captured
      ansible.builtin.assert:
        that:
          - udm_token | length > 0
          - udm_csrf | length > 0
        fail_msg: "Failed to capture UDM session (TOKEN+CSRF) from login response."
      when: udm_api_key | default('') | length == 0

    - name: Build common auth headers (X-API-Key when present, else login cookie+CSRF)
      ansible.builtin.set_fact:
        udm_headers: >-
          {{ ({'X-API-Key': udm_api_key}
              if (udm_api_key | default('') | length > 0)
              else {'Cookie': 'TOKEN=' + udm_token, 'X-Csrf-Token': udm_csrf})
             | combine({'Content-Type': 'application/json'}) }}
      no_log: true

    # -----------------------------------------------------------------
    # 2. Discover zones (resolve zone names → ids)
    # -----------------------------------------------------------------
    - name: GET zones
      check_mode: false # read-only; run under --check
      ansible.builtin.uri:
        url: "{{ udm_base }}/proxy/network/v2/api/site/{{ udm_site }}/firewall/zone"
        method: GET
        headers: "{{ udm_headers }}"
        validate_certs: "{{ udm_validate_certs }}"
        status_code: 200
        return_content: true
      register: udm_zones

    - name: Build zone-name → zone-id map
      ansible.builtin.set_fact:
        udm_zone_id_by_name: "{{ udm_zones.json | items2dict(key_name='name', value_name='_id') }}"

    - name: Show zone map
      ansible.builtin.debug:
        var: udm_zone_id_by_name

    # -----------------------------------------------------------------
    # 3. Reconcile address-group + port-group objects
    # -----------------------------------------------------------------
    - name: GET existing firewall groups (objects)
      check_mode: false # read-only; run under --check
      ansible.builtin.uri:
        url: "{{ udm_base }}/proxy/network/api/s/{{ udm_site }}/rest/firewallgroup"
        method: GET
        headers: "{{ udm_headers }}"
        validate_certs: "{{ udm_validate_certs }}"
        status_code: 200
        return_content: true
      register: udm_existing_groups

    - name: Build group-name → group dict
      ansible.builtin.set_fact:
        udm_group_by_name: >-
          {{ udm_existing_groups.json.data
             | items2dict(key_name='name', value_name='_id') }}

    # --- address-groups ---
    - name: Create missing address-groups
      ansible.builtin.uri:
        url: "{{ udm_base }}/proxy/network/api/s/{{ udm_site }}/rest/firewallgroup"
        method: POST
        headers: "{{ udm_headers }}"
        validate_certs: "{{ udm_validate_certs }}"
        body_format: json
        body:
          name: "{{ item.name }}"
          group_type: address-group
          group_members: "{{ item.members }}"
        status_code: [200, 201]
      loop: "{{ udm_address_groups }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.name not in udm_group_by_name
      register: udm_addr_grp_create

    - name: Update drifted address-groups (members changed)
      block:
        - name: GET each address-group's current members
          ansible.builtin.uri:
            url: "{{ udm_base }}/proxy/network/api/s/{{ udm_site }}/rest/firewallgroup/{{ udm_group_by_name[item.name] }}"
            method: GET
            headers: "{{ udm_headers }}"
            validate_certs: "{{ udm_validate_certs }}"
            status_code: 200
            return_content: true
          register: udm_addr_grp_current
          loop: "{{ udm_address_groups }}"
          loop_control:
            label: "{{ item.name }}"
          when: item.name in udm_group_by_name

        - name: PUT updated members where drifted
          ansible.builtin.uri:
            url: "{{ udm_base }}/proxy/network/api/s/{{ udm_site }}/rest/firewallgroup/{{ udm_group_by_name[item.item.name] }}"
            method: PUT
            headers: "{{ udm_headers }}"
            validate_certs: "{{ udm_validate_certs }}"
            body_format: json
            body:
              _id: "{{ udm_group_by_name[item.item.name] }}"
              name: "{{ item.item.name }}"
              group_type: address-group
              group_members: "{{ item.item.members }}"
            status_code: 200
          loop: "{{ udm_addr_grp_current.results | default([]) }}"
          loop_control:
            label: "{{ item.item.name }}"
          when:
            - item.json is defined
            - (item.json.data[0].group_members | default([]) | sort) != (item.item.members | sort)

    # --- port-groups ---
    - name: Create missing port-groups
      ansible.builtin.uri:
        url: "{{ udm_base }}/proxy/network/api/s/{{ udm_site }}/rest/firewallgroup"
        method: POST
        headers: "{{ udm_headers }}"
        validate_certs: "{{ udm_validate_certs }}"
        body_format: json
        body:
          name: "{{ item.name }}"
          group_type: port-group
          group_members: "{{ item.members | map('string') | list }}"
        status_code: [200, 201]
      loop: "{{ udm_port_groups }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.name not in udm_group_by_name

    # Refresh group map after creates (so policy resolution sees them)
    - name: GET firewall groups (refresh after creates)
      check_mode: false # read-only; run under --check
      ansible.builtin.uri:
        url: "{{ udm_base }}/proxy/network/api/s/{{ udm_site }}/rest/firewallgroup"
        method: GET
        headers: "{{ udm_headers }}"
        validate_certs: "{{ udm_validate_certs }}"
        status_code: 200
        return_content: true
      register: udm_groups_refresh

    - name: Rebuild group-name → id map
      ansible.builtin.set_fact:
        udm_group_by_name: "{{ udm_groups_refresh.json.data | items2dict(key_name='name', value_name='_id') }}"

    # -----------------------------------------------------------------
    # 4. Reconcile firewall policies (v2 zone-based)
    # -----------------------------------------------------------------
    - name: GET existing firewall policies (v2)
      check_mode: false # read-only; run under --check
      ansible.builtin.uri:
        url: "{{ udm_base }}/proxy/network/v2/api/site/{{ udm_site }}/firewall-policies"
        method: GET
        headers: "{{ udm_headers }}"
        validate_certs: "{{ udm_validate_certs }}"
        status_code: 200
        return_content: true
      register: udm_existing_policies

    - name: Build policy-name → id map (skip predefined)
      ansible.builtin.set_fact:
        udm_policy_id_by_name: >-
          {{ udm_existing_policies.json
             | selectattr('predefined', 'equalto', false)
             | items2dict(key_name='name', value_name='_id') }}

    - name: Render policy bodies (for create+update)
      ansible.builtin.set_fact:
        udm_policy_bodies: >-
          {{ udm_firewall_policies
             | map('combine', {})
             | list }}

    - name: Build full policy POST bodies (resolve zone/group names → ids)
      ansible.builtin.set_fact:
        udm_policy_rendered: >-
          {{ udm_policy_rendered | default([]) + [
            {
              "name": pol.name,
              "action": pol.action,
              "enabled": pol.enabled | default(true),
              "logging": pol.logging | default(false),
              "protocol": pol.protocol,
              "index": pol.index,
              "connection_state_type": "ALL",
              "connection_states": [],
              "create_allow_respond": pol.create_allow_respond | default(true),
              "icmp_typename": "ANY",
              "icmp_v6_typename": "ANY",
              "ip_version": "BOTH",
              "match_ip_sec": false,
              "match_opposite_protocol": false,
              "schedule": { "mode": "ALWAYS" },
              "source": {
                "zone_id": udm_zone_id_by_name[pol.source.zone_name],
                "matching_target": ("IP" if (pol.source.ip_group_name | default(false)) else "ANY"),
                "matching_target_type": ("OBJECT" if (pol.source.ip_group_name | default(false)) else None),
                "ip_group_id": (udm_group_by_name[pol.source.ip_group_name] if (pol.source.ip_group_name | default(false)) else None),
                "port_matching_type": "ANY",
                "match_opposite_ports": false,
                "ips": [],
                "match_mac": false,
                "match_opposite_ips": false
              },
              "destination": {
                "zone_id": udm_zone_id_by_name[pol.destination.zone_name],
                "matching_target": ("IP" if (pol.destination.ip_group_name | default(false)) else "ANY"),
                "matching_target_type": ("OBJECT" if (pol.destination.ip_group_name | default(false)) else None),
                "ip_group_id": (udm_group_by_name[pol.destination.ip_group_name] if (pol.destination.ip_group_name | default(false)) else None),
                "port_matching_type": ("OBJECT" if (pol.destination.port_group_name | default(false)) else "ANY"),
                "port_group_id": (udm_group_by_name[pol.destination.port_group_name] if (pol.destination.port_group_name | default(false)) else None),
                "match_opposite_ports": false
              }
            }
          ] }}
      loop: "{{ udm_firewall_policies }}"
      loop_control:
        loop_var: pol

    - name: Create policies that don't exist yet
      ansible.builtin.uri:
        url: "{{ udm_base }}/proxy/network/v2/api/site/{{ udm_site }}/firewall-policies"
        method: POST
        headers: "{{ udm_headers }}"
        validate_certs: "{{ udm_validate_certs }}"
        body_format: json
        body: "{{ item }}"
        status_code: [200, 201]
      loop: "{{ udm_policy_rendered }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.name not in udm_policy_id_by_name
      register: udm_policy_create_results

    - name: Show policy create results
      ansible.builtin.debug:
        msg: "Created {{ udm_policy_create_results.results | rejectattr('skipped', 'defined') | list | length }} new policy/policies"
