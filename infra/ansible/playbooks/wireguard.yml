---
# WireGuard VPN Configuration Playbook
# Manages WireGuard on vpn-local and vpn-aws
#
# Usage:
#   # All VPN servers (local + AWS)
#   ansible-playbook -i inventory/wind/ -i inventory/aws/ playbooks/wireguard.yml
#
#   # Local only
#   ansible-playbook -i inventory/wind/ playbooks/wireguard.yml --limit vpn-local
#
#   # AWS only
#   ansible-playbook -i inventory/aws/ playbooks/wireguard.yml --limit vpn-aws
#
#   # Check mode (dry-run)
#   ansible-playbook -i inventory/wind/ -i inventory/aws/ playbooks/wireguard.yml --check --diff
#
# KEYS MANAGEMENT:
#   Server private keys are stored encrypted with SOPS in:
#     platform/wireguard/servers/vpn-aws.sops.yaml
#     platform/wireguard/servers/vpn-local.sops.yaml
#
#   Client configs are stored encrypted in:
#     platform/wireguard/clients/<name>.sops.yaml
#
#   To add a new server or rotate keys:
#     1. Generate new keys: wg genkey | tee private.key | wg pubkey > public.key
#     2. Update the corresponding SOPS file
#     3. Run this playbook

- name: Configure WireGuard VPN
  hosts: vpn_servers
  become: true

  vars:
    # Path to SOPS-encrypted server keys (relative to repo root)
    sops_keys_path: "{{ playbook_dir }}/../../../platform/wireguard/servers"

    # Site-to-site tunnel configuration
    wg_mtu: 1420

    # vpn-local specific settings
    # NOTE: vpn-local is BACKUP to the K8s WireGuard pod. wg0/wg1 are NOT auto-started;
    # Keepalived notify scripts start/stop interfaces based on VRRP state.
    vpn_local:
      ip: "10.10.201.15"  # Host IP for policy routing
      wg0:
        tunnel_ip: "10.255.255.2/29"
        listen_port: 9820  # External port (UDM 9820→VIP:9820) - avoids Twilio range conflict
        peer_public_key: "kHjcUM33FcpYWHgsE4Nwchaqky+iuJ7JfLTzC7lgOmU="
        peer_endpoint: "44.240.60.80:51820"
        peer_allowed_ips: "10.10.100.0/22, 10.255.255.1/32"
        keepalive: 25
      wg1:
        tunnel_ip: "10.254.0.1/24"
        listen_port: 9821
      # Keepalived VIP for WireGuard failover (backup to K8s WG pod)
      vip: "10.10.201.20"
      vip_interface: "eth0"
      vrrp_priority: 100  # K8s pod has priority 150

    # vpn-aws specific settings
    vpn_aws:
      wg0:
        tunnel_ip: "10.255.255.1/29"
        listen_port: 51820
        peer_public_key: "MwsTBFT0FPsZO+Bpe2Exk3y7oeIyv+HDx3j+lRSISTw="
        peer_allowed_ips: "10.255.255.2/32, 10.10.192.0/19"
        keepalive: 25
      wg1:
        tunnel_ip: "10.254.0.1/24"
        listen_port: 51821

    # Remote access peers for wg1 (AWS and local when wg1 is configured)
    wg1_peers:
      - name: "Graham"
        public_key: "7FAI4YiWGRtKDl3AaG+jxjf0vDVaTtUisf68nQRFozA="
        allowed_ips: "10.254.0.10/32"

    # Network ranges for MSS clamping
    aws_networks: "10.10.100.0/22"
    local_networks: "10.10.192.0/19"

    # Regional VPN peers for wg0 (homelab side)
    # These are TEMPORARY regional VPNs for travel - add/remove as needed
    # Both K8s WireGuard pod and vpn-local need these peers for failover to work
    # Homelab initiates connection to regional VPNs (avoids UDM port forward issues)
    wg0_regional_peers: []
      # Travel/regional-VPN tooling DELETED 2026-07-01 (M110) — the
      # aws-regional-vpn stack, its module + workflow are gone (states were
      # empty). Tailscale covers travel access. The empty list + template
      # loop below are kept as the generic mechanism for any future
      # regional peer. Historical procedure:
      # docs/runbooks/archive/regional-vpn-deployment.md.
      # Per-peer block was:
      #   - name: "vpn-mumbai (ap-south-1)"
      #     public_key: "efcqDc4sRsq1yerx9gfTxDdnS3qj3+TH6XsWlmOxGT4="
      #     endpoint: "<NEW-IP>:51820"
      #     allowed_ips: "10.10.112.0/24, 10.255.255.3/32"
      #     keepalive: 25

    # =========================================================================
    # Client Config Template (for reference)
    # =========================================================================
    # Store actual configs encrypted with SOPS in:
    #   platform/wireguard/clients/<name>.sops.yaml
    #
    # Template:
    #   [Interface]
    #   PrivateKey = <client_private_key>
    #   Address = 10.254.0.X/32
    #   DNS = 10.10.201.5, 10.10.201.6, 10.10.100.10, 1.1.1.1
    #
    #   [Peer]
    #   PublicKey = Aav0cNl4osaEEISQLyKLt88foAPwdVYaeTuyLF/PNTo=
    #   AllowedIPs = 10.10.100.0/22, 10.10.192.0/19, 10.254.0.0/24, 10.255.255.0/29
    #   Endpoint = vpn-usw2.etherport.net:51821  # AWS US-West-2, or wind.etherport.net:9821 for direct
    #   PersistentKeepalive = 25
    # =========================================================================

  tasks:
    # =========================================================================
    # Load private keys from SOPS-encrypted files
    # =========================================================================
    - name: Load vpn-aws keys from SOPS
      community.sops.load_vars:
        file: "{{ sops_keys_path }}/vpn-aws.sops.yaml"
        name: vpn_aws_keys
      delegate_to: localhost
      become: false
      no_log: true  # don't echo decrypted WG keys into CI logs
      when: inventory_hostname == 'vpn-aws'

    - name: Load vpn-local keys from SOPS
      community.sops.load_vars:
        file: "{{ sops_keys_path }}/vpn-local.sops.yaml"
        name: vpn_local_keys
      delegate_to: localhost
      become: false
      no_log: true  # don't echo decrypted WG keys into CI logs
      when: inventory_hostname == 'vpn-local'

    # =========================================================================
    # Common tasks for all VPN servers
    # =========================================================================
    - name: Install WireGuard
      apt:
        name:
          - wireguard
          - wireguard-tools
        state: present
        update_cache: yes
        cache_valid_time: 3600

    - name: Enable IP forwarding
      sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_file: /etc/sysctl.d/99-wg-forward.conf
        reload: yes
        state: present

    - name: Ensure WireGuard directory exists
      file:
        path: /etc/wireguard
        state: directory
        owner: root
        group: root
        mode: "0700"

    # =========================================================================
    # Deploy private keys from SOPS
    # =========================================================================
    - name: Deploy wg0 private key (vpn-aws)
      copy:
        dest: /etc/wireguard/local_private.key
        content: "{{ vpn_aws_keys.stringData.wg0_private_key }}"
        owner: root
        group: root
        mode: "0600"
      when: inventory_hostname == 'vpn-aws'
      no_log: true

    - name: Deploy wg1 private key (vpn-aws)
      copy:
        dest: /etc/wireguard/aws_wg1_private.key
        content: "{{ vpn_aws_keys.stringData.wg1_private_key }}"
        owner: root
        group: root
        mode: "0600"
      when: inventory_hostname == 'vpn-aws'
      no_log: true

    - name: Deploy wg0 private key (vpn-local)
      copy:
        dest: /etc/wireguard/local_private.key
        content: "{{ vpn_local_keys.stringData.wg0_private_key }}"
        owner: root
        group: root
        mode: "0600"
      when: inventory_hostname == 'vpn-local'
      no_log: true

    - name: Deploy wg1 private key (vpn-local)
      copy:
        dest: /etc/wireguard/local_wg1_private.key
        content: "{{ vpn_local_keys.stringData.wg1_private_key }}"
        owner: root
        group: root
        mode: "0600"
      when: inventory_hostname == 'vpn-local'
      no_log: true

    # =========================================================================
    # vpn-local configuration
    # =========================================================================
    - name: Configure wg0 on vpn-local
      copy:
        dest: /etc/wireguard/wg0.conf
        owner: root
        group: root
        mode: "0600"
        content: |
          [Interface]
          Address = {{ vpn_local.wg0.tunnel_ip }}
          ListenPort = {{ vpn_local.wg0.listen_port }}
          PrivateKey = {{ vpn_local_keys.stringData.wg0_private_key }}
          MTU = {{ wg_mtu }}
          # NAT for regional VPN traffic (so replies route back via wg0)
          PostUp = iptables -t nat -I POSTROUTING 1 -s 10.255.255.0/29 -o eth0 -j MASQUERADE
          # NAT for LAN traffic going to AWS via wg0 (UDM tunnel → vpn-local → wg0 → AWS)
          PostUp = iptables -t nat -I POSTROUTING 1 -o wg0 -j MASQUERADE
          PostUp = iptables -I FORWARD 1 -i wg0 -o eth0 -j ACCEPT
          PostUp = iptables -I FORWARD 1 -i eth0 -o wg0 -j ACCEPT
          PostDown = iptables -t nat -D POSTROUTING -s 10.255.255.0/29 -o eth0 -j MASQUERADE || true
          PostDown = iptables -t nat -D POSTROUTING -o wg0 -j MASQUERADE || true
          PostDown = iptables -D FORWARD -i wg0 -o eth0 -j ACCEPT || true
          PostDown = iptables -D FORWARD -i eth0 -o wg0 -j ACCEPT || true

          # Peer: AWS hub (primary site-to-site)
          [Peer]
          PublicKey = {{ vpn_local.wg0.peer_public_key }}
          Endpoint = {{ vpn_local.wg0.peer_endpoint }}
          AllowedIPs = {{ vpn_local.wg0.peer_allowed_ips }}
          PersistentKeepalive = {{ vpn_local.wg0.keepalive }}

          {% for peer in wg0_regional_peers %}
          # {{ peer.name }}{% if peer.comment is defined %} - {{ peer.comment }}{% endif %}

          [Peer]
          PublicKey = {{ peer.public_key }}
          {% if peer.endpoint is defined %}Endpoint = {{ peer.endpoint }}
          {% endif %}AllowedIPs = {{ peer.allowed_ips }}
          PersistentKeepalive = {{ peer.keepalive }}

          {% endfor %}
      when: inventory_hostname == 'vpn-local'
      no_log: true
      notify: Restart WireGuard wg0

    - name: Configure wg1 on vpn-local (remote access - direct connection)
      copy:
        dest: /etc/wireguard/wg1.conf
        owner: root
        group: root
        mode: "0600"
        content: |
          [Interface]
          Address    = {{ vpn_local.wg1.tunnel_ip }}
          ListenPort = {{ vpn_local.wg1.listen_port }}
          PrivateKey = {{ vpn_local_keys.stringData.wg1_private_key }}
          MTU        = {{ wg_mtu }}
          # NAT for full-tunnel clients (route all traffic through VPN)
          # Use -I to insert at beginning - ensures rule runs before other chains
          PostUp = iptables -t nat -I POSTROUTING 1 -s 10.254.0.0/24 ! -d 10.0.0.0/8 -j MASQUERADE
          # NAT for VPN clients accessing homelab LAN (so replies route back correctly)
          PostUp = iptables -t nat -I POSTROUTING 1 -s 10.254.0.0/24 -o eth0 -j MASQUERADE
          PostDown = iptables -t nat -D POSTROUTING -s 10.254.0.0/24 ! -d 10.0.0.0/8 -j MASQUERADE
          PostDown = iptables -t nat -D POSTROUTING -s 10.254.0.0/24 -o eth0 -j MASQUERADE

          {% for peer in wg1_peers %}
          [Peer]
          # {{ peer.name }}
          PublicKey  = {{ peer.public_key }}
          AllowedIPs = {{ peer.allowed_ips }}

          {% endfor %}
      when: inventory_hostname == 'vpn-local'
      no_log: true
      notify: Restart WireGuard wg1

    # =========================================================================
    # vpn-aws configuration
    # =========================================================================
    - name: Configure wg0 on vpn-aws (site-to-site)
      copy:
        dest: /etc/wireguard/wg0.conf
        owner: root
        group: root
        mode: "0600"
        content: |
          [Interface]
          Address = {{ vpn_aws.wg0.tunnel_ip }}
          ListenPort = {{ vpn_aws.wg0.listen_port }}
          PrivateKey = {{ vpn_aws_keys.stringData.wg0_private_key }}
          MTU = {{ wg_mtu }}

          # Peer: Local site router
          [Peer]
          PublicKey = {{ vpn_aws.wg0.peer_public_key }}
          AllowedIPs = {{ vpn_aws.wg0.peer_allowed_ips }}
          PersistentKeepalive = {{ vpn_aws.wg0.keepalive }}
      when: inventory_hostname == 'vpn-aws'
      no_log: true
      notify: Restart WireGuard wg0

    - name: Configure wg1 on vpn-aws (remote access)
      copy:
        dest: /etc/wireguard/wg1.conf
        owner: root
        group: root
        mode: "0600"
        content: |
          [Interface]
          Address    = {{ vpn_aws.wg1.tunnel_ip }}
          ListenPort = {{ vpn_aws.wg1.listen_port }}
          PrivateKey = {{ vpn_aws_keys.stringData.wg1_private_key }}
          MTU        = {{ wg_mtu }}
          # NAT for full-tunnel clients (route all traffic through VPN)
          # Use -I to insert at beginning - ensures rule runs before other chains
          PostUp = iptables -t nat -I POSTROUTING 1 -s 10.254.0.0/24 ! -d 10.0.0.0/8 -j MASQUERADE
          # NAT for VPN clients accessing homelab via wg0 (so replies route back correctly)
          PostUp = iptables -t nat -I POSTROUTING 1 -s 10.254.0.0/24 -o wg0 -j MASQUERADE
          PostDown = iptables -t nat -D POSTROUTING -s 10.254.0.0/24 ! -d 10.0.0.0/8 -j MASQUERADE
          PostDown = iptables -t nat -D POSTROUTING -s 10.254.0.0/24 -o wg0 -j MASQUERADE

          {% for peer in wg1_peers %}
          [Peer]
          # {{ peer.name }}
          PublicKey  = {{ peer.public_key }}
          AllowedIPs = {{ peer.allowed_ips }}

          {% endfor %}
      when: inventory_hostname == 'vpn-aws'
      no_log: true
      notify: Restart WireGuard wg1

    # =========================================================================
    # MSS Clamping (AWS only) - fixes MTU issues over VPN
    # =========================================================================
    - name: Install nftables for MSS clamping
      apt:
        name: nftables
        state: present
      when: inventory_hostname == 'vpn-aws'

    - name: Configure nftables MSS clamping rules
      copy:
        dest: /etc/nftables.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          #!/usr/sbin/nft -f

          flush ruleset

          # MSS Clamping for VPN traffic to handle MTU issues
          # This ensures TCP connections don't fragment across the tunnel
          table ip mangle {
            chain PREROUTING {
              type filter hook prerouting priority mangle; policy accept;
            }

            chain INPUT {
              type filter hook input priority mangle; policy accept;
            }

            chain FORWARD {
              type filter hook forward priority mangle; policy accept;
              # Clamp MSS for traffic from AWS to local homelab
              ip saddr {{ aws_networks }} ip daddr {{ local_networks }} tcp flags syn / syn,rst counter tcp option maxseg size set rt mtu
              # Clamp MSS for traffic from local homelab to AWS
              ip saddr {{ local_networks }} ip daddr {{ aws_networks }} tcp flags syn / syn,rst counter tcp option maxseg size set rt mtu
            }

            chain OUTPUT {
              type route hook output priority mangle; policy accept;
            }

            chain POSTROUTING {
              type filter hook postrouting priority mangle; policy accept;
            }
          }

          # Basic filter table (no rules, just structure)
          table inet filter {
            chain input {
              type filter hook input priority filter; policy accept;
            }
            chain forward {
              type filter hook forward priority filter; policy accept;
            }
            chain output {
              type filter hook output priority filter; policy accept;
            }
          }

          # NAT table for WireGuard port redirect (restricted networks)
          # Note: Full-tunnel masquerade is handled via iptables PostUp/PostDown in wg1.conf
          # to avoid conflicts with Tailscale nftables rules
          table ip nat {
            chain PREROUTING {
              type nat hook prerouting priority dstnat; policy accept;
              # Redirect UDP 443 to 51821 for use behind restrictive firewalls
              udp dport 443 redirect to :51821
            }
          }
      when: inventory_hostname == 'vpn-aws'
      notify: Apply nftables rules

    - name: Enable nftables service
      systemd:
        name: nftables
        enabled: yes
        state: started
      when: inventory_hostname == 'vpn-aws'

    # =========================================================================
    # Keepalived for VIP failover (vpn-local only)
    # vpn-local acts as backup to the K8s WireGuard pod
    # =========================================================================
    - name: Install Keepalived
      apt:
        name: keepalived
        state: present
      when: inventory_hostname == 'vpn-local'

    - name: Create WireGuard failover script
      copy:
        dest: /usr/local/bin/wg-failover.sh
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/bash
          # WireGuard failover script for Keepalived
          # Called when VRRP state changes
          # Manages wg0 (site-to-site) and wg1 (remote access)

          TYPE=$1    # INSTANCE or GROUP
          NAME=$2    # Name of instance/group
          STATE=$3   # MASTER, BACKUP, or FAULT

          logger -t wg-failover "State change: $STATE for $NAME"

          case $STATE in
              MASTER)
                  logger -t wg-failover "Becoming MASTER - starting WireGuard interfaces"
                  # Clear any lingering 'failed' state from a prior interrupted
                  # start so this start is clean (see BACKUP/FAULT note below).
                  systemctl reset-failed wg-quick@wg0 wg-quick@wg1 2>/dev/null || true
                  systemctl start wg-quick@wg0
                  systemctl start wg-quick@wg1
                  sleep 2
                  wg show wg0 2>&1 | logger -t wg-failover
                  wg show wg1 2>&1 | logger -t wg-failover
                  ;;
              BACKUP|FAULT)
                  logger -t wg-failover "Becoming BACKUP/FAULT - stopping WireGuard interfaces"
                  systemctl stop wg-quick@wg1 2>/dev/null || true
                  systemctl stop wg-quick@wg0 2>/dev/null || true
                  # A near-simultaneous MASTER->BACKUP/FAULT flap can have this stop
                  # SIGTERM an in-flight wg-quick start, leaving the unit 'failed' —
                  # which lingers (and trips the systemd-failed alert) because a
                  # BACKUP never re-starts it. For a BACKUP the desired state is
                  # simply inactive, so clear the failed flag. (Root cause of the
                  # 2026-05-31 wg-quick@wg0 stuck-failed alert.)
                  systemctl reset-failed wg-quick@wg0 wg-quick@wg1 2>/dev/null || true
                  ;;
          esac
      when: inventory_hostname == 'vpn-local'

    - name: Configure Keepalived for WireGuard VIP
      copy:
        dest: /etc/keepalived/keepalived.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          global_defs {
            script_user root
            enable_script_security
          }

          # Health check: verify wg0/wg1 interfaces are up. weight -50
          # means a failed check drops effective priority from 100 to 50,
          # below the K8s pod's 150 → MASTER stays on K8s as expected.
          # Without this, vpn-local would advertise MASTER even if its
          # own wg-quick services died, black-holing VPN traffic.
          vrrp_script check_wg_local {
            script "/usr/local/bin/check-wireguard.sh"
            interval 2
            weight -50
            fall 3
            rise 2
          }

          vrrp_instance WG_VIP {
            state BACKUP
            interface {{ vpn_local.vip_interface }}
            virtual_router_id 51
            priority {{ vpn_local.vrrp_priority }}
            advert_int 1
            nopreempt

            authentication {
              auth_type PASS
              auth_pass wgvrrp51
            }

            virtual_ipaddress {
              {{ vpn_local.vip }}/24
            }

            track_script {
              check_wg_local
            }

            notify /usr/local/bin/wg-failover.sh
          }
      when: inventory_hostname == 'vpn-local'
      notify: Restart Keepalived

    - name: Install wireguard health-check script for keepalived
      copy:
        dest: /usr/local/bin/check-wireguard.sh
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/bash
          # Returns 0 if both wg interfaces exist (matches the K8s pod's
          # check). vpn-local is BACKUP — failing this drops priority
          # below the K8s pod's 150, keeping MASTER on K8s.
          ip link show wg0 >/dev/null 2>&1 || exit 1
          ip link show wg1 >/dev/null 2>&1 || exit 1
          exit 0
      when: inventory_hostname == 'vpn-local'

    - name: Enable and start Keepalived
      systemd:
        name: keepalived
        enabled: yes
        state: started
        daemon_reload: yes
      when: inventory_hostname == 'vpn-local'

    # =========================================================================
    # Service management
    # =========================================================================
    - name: Enable and start WireGuard wg0 (vpn-aws)
      systemd:
        name: wg-quick@wg0
        enabled: yes
        state: started
      when: inventory_hostname == 'vpn-aws'

    - name: Disable WireGuard wg0 auto-start (vpn-local - managed by Keepalived)
      systemd:
        name: wg-quick@wg0
        enabled: no
        state: stopped
      when: inventory_hostname == 'vpn-local'

    - name: Disable WireGuard wg1 auto-start (vpn-local - managed by Keepalived)
      systemd:
        name: wg-quick@wg1
        enabled: no
        state: stopped
      when: inventory_hostname == 'vpn-local'

    # =========================================================================
    # Policy routing for VPN clients connecting via AWS (vpn-local)
    # When traffic from VPN clients (10.254.0.0/24) arrives via wg0 (from AWS),
    # responses must go back via wg0, not via the local wg1 interface
    # =========================================================================
    - name: Create policy routing table entry
      lineinfile:
        path: /etc/iproute2/rt_tables
        line: "100 wg0_return"
        regexp: "^100\\s+wg0_return"
      when: inventory_hostname == 'vpn-local'

    - name: Create VPN policy routing script
      copy:
        dest: /usr/local/bin/wg-policy-routing.sh
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/bash
          # Policy routing for VPN clients connecting via AWS
          # Ensures responses to VPN clients go back via wg0 (to AWS), not wg1

          # Get default gateway
          DEFAULT_GW=$(ip route | grep "^default" | awk '{print $3}')
          HOST_IP={{ vpn_local.ip }}

          # Create route for VPN client traffic via default gateway
          ip route replace 10.254.0.0/24 via $DEFAULT_GW table wg0_return

          # Mark connections from VPN clients arriving via wg0 (not wg1)
          iptables -t mangle -C PREROUTING -s 10.254.0.0/24 ! -i wg1 -j CONNMARK --set-mark 100 2>/dev/null || \
          iptables -t mangle -A PREROUTING -s 10.254.0.0/24 ! -i wg1 -j CONNMARK --set-mark 100

          # Restore mark on response packets
          iptables -t mangle -C OUTPUT -d 10.254.0.0/24 -j CONNMARK --restore-mark 2>/dev/null || \
          iptables -t mangle -A OUTPUT -d 10.254.0.0/24 -j CONNMARK --restore-mark

          # Use wg0_return table for marked packets
          ip rule del fwmark 100 table wg0_return 2>/dev/null || true
          ip rule add fwmark 100 table wg0_return prio 99

          # Source-based rule for local host responses
          ip rule del from $HOST_IP to 10.254.0.0/24 lookup wg0_return 2>/dev/null || true
          ip rule add from $HOST_IP to 10.254.0.0/24 lookup wg0_return prio 97

          logger -t wg-policy-routing "Policy routing configured for VPN clients via AWS"
      when: inventory_hostname == 'vpn-local'

    - name: Create systemd service for VPN policy routing
      copy:
        dest: /etc/systemd/system/wg-policy-routing.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=WireGuard VPN Policy Routing
          After=network.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/wg-policy-routing.sh
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
      when: inventory_hostname == 'vpn-local'
      notify: Reload systemd

    - name: Enable and start VPN policy routing service
      systemd:
        name: wg-policy-routing
        enabled: yes
        state: started
        daemon_reload: yes
      when: inventory_hostname == 'vpn-local'

    - name: Enable and start WireGuard wg1 (vpn-aws only)
      systemd:
        name: wg-quick@wg1
        enabled: yes
        state: started
      when: inventory_hostname == 'vpn-aws'

  # ===========================================================================
  # Handlers
  # ===========================================================================
  handlers:
    - name: Restart WireGuard wg0
      systemd:
        name: wg-quick@wg0
        state: restarted

    - name: Restart WireGuard wg1
      systemd:
        name: wg-quick@wg1
        state: restarted

    - name: Apply nftables rules
      command: nft -f /etc/nftables.conf

    - name: Restart Keepalived
      systemd:
        name: keepalived
        state: restarted

    - name: Reload systemd
      systemd:
        daemon_reload: yes
