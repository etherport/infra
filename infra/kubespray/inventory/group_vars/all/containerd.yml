# H45b (2026-07-02): containerd 2.2.1 → 2.2.5 (the 2026-06-18 coordinated release —
# 3 Criticals incl. image-LABEL→host-root exec). kubespray v2.30 ships checksums only
# up to 2.2.1, so we pin the version AND supply the official amd64 checksum (from
# https://github.com/containerd/containerd/releases/download/v2.2.5/
# containerd-2.2.5-linux-amd64.tar.gz.sha256sum). Overriding the dict replaces it
# entirely — only amd64/2.2.5 is ever looked up on this all-amd64 fleet.
containerd_version: "2.2.5"
containerd_archive_checksums:
  amd64:
    2.2.5: sha256:d4031557773a8e969d604b4ee809c64ed3c6cd024d38d521d93984fa17d37b89
