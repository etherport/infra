# H45b (2026-07-02): containerd 2.2.1 → 2.2.5 (the 2026-06-18 coordinated release —
# 3 Criticals incl. image-LABEL→host-root exec). The kubespray submodule (v2.31)
# ships checksums only up to 2.2.1, so we pin the version AND supply the official
# amd64 checksum (from
# https://github.com/containerd/containerd/releases/download/v2.2.5/
# containerd-2.2.5-linux-amd64.tar.gz.sha256sum).
containerd_version: "2.2.5"
# NB: kubespray keeps the checksum DICT in role vars/ (beats inventory
# group_vars — a dict override here is silently ignored; bit us 2026-07-02:
# "dict object has no attribute 2.2.5"). Override the SCALAR instead — it lives
# in role defaults/ (download.yml), which inventory group_vars DOES beat.
containerd_archive_checksum: sha256:d4031557773a8e969d604b4ee809c64ed3c6cd024d38d521d93984fa17d37b89
