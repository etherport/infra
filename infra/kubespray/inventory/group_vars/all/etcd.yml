---
## Directory where etcd data stored
etcd_data_dir: /var/lib/etcd

## Container runtime
## docker for docker, crio for cri-o and containerd for containerd.
## Additionally you can set this to kubeadm if you want to install etcd using kubeadm
## Kubeadm etcd deployment is experimental and only available for new deployments
## If this is not set, container manager will be inherited from the Kubespray defaults
## and not from k8s_cluster/k8s-cluster.yml, which might not be what you want.
## Also this makes possible to use different container manager for etcd nodes.
# container_manager: containerd

## Settings for etcd deployment type
# Set this to docker if you are using container_manager: docker
etcd_deployment_type: host

## Auto-snapshot configuration - take snapshots every N committed transactions.
## etcdctl reads these snapshots; ours are also covered by Velero + Proxmox
## VM-level backups, so this is belt-and-suspenders.
etcd_snapshot_count: 100000

## Periodic compaction: discard etcd revisions older than this duration to
## prevent unbounded etcd disk growth.
etcd_compaction_retention: "8"

## H41: expose etcd metrics on a no-auth HTTP port (:2381) bound to the node IP
## + localhost, so Prometheus can scrape etcd health (fsync/commit latency, leader
## changes) WITHOUT an etcd client cert in a k8s secret. The :2381 endpoint serves
## only non-sensitive performance metrics (no key data). kube-prometheus-stack's
## kubeEtcd ServiceMonitor targets these node IPs:2381 (clusters/wind/helm-releases/
## monitoring.yaml). The etcd role templates ETCD_LISTEN_METRICS_URLS from this var.
etcd_metrics_port: 2381
