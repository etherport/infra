# macOS SMB client hardening for the mini's NAS mounts (M79 iCloud Photos pipeline).
#
# WHY: the Photos library lives in an APFS sparsebundle on an SMB share, so every
# block write to the "local" PhotosLib volume is really an SMB write to the NAS. On
# 2026-06-19 the SMB mounts dropped repeatedly — including Personal-Drive dropping
# while completely IDLE on a 10G wired link. We first blamed SMB multichannel and set
# mc_on=no, BUT the real cause turned out to be a **failing NVMe cache SSD on the UNAS**
# (nvme0 dropping off the PCIe bus; reads fine, metadata/writes stall). So multichannel
# was the wrong culprit — and mc_on=no also throttled bulk throughput onto one channel
# (made parallel deletes pathologically slow). 2026-06-21: **multichannel re-enabled.**
#
# Install — MUST be /etc/nsmb.conf. The macOS KERNEL SMB client (which `open smb://` /
# Finder / the automounter use) reads ONLY /etc/nsmb.conf. ~/Library/Preferences/nsmb.conf
# is NOT honored for these kernel-initiated mounts — writing it is a SILENT NO-OP (verified
# 2026-06-22: live `smbutil statshares -a` showed defaults despite the user file being present).
# /etc needs root, so it's installed by a root LaunchDaemon (survives reboot):
#   sudo cp infra/macos/mini/net.wind.nsmb-install.plist /Library/LaunchDaemons/
#   sudo chown root:wheel /Library/LaunchDaemons/net.wind.nsmb-install.plist
#   sudo launchctl bootstrap system /Library/LaunchDaemons/net.wind.nsmb-install.plist
#   sudo bash infra/macos/mini/install-nsmb-conf.sh   # immediate effect (no reboot)
# Changes take effect for the NEXT mount, so unmount + remount after installing.
# Verify a live mount actually negotiated what we asked: `smbutil statshares -a`.
# mount-nas.sh warns at runtime if /etc/nsmb.conf is missing/stale.
#
# If idle drops persist with this in place, escalate the dead timers (one-time, in VNC
# Terminal) so a transient server stall PAUSES I/O instead of erroring it up into APFS
# (prevents the dirty-journal/corruption event):
#   sudo sysctl -w net.smb.fs.kern_soft_deadtimer=120   # default 30s -> 120s
#   sudo sysctl -w net.smb.fs.kern_deadtimer=120        # default 60s
# Optional latency lever (trusted LAN only — security tradeoff): if the NAS doesn't REQUIRE
# signing, add `signing_required=no` below to drop per-packet signing CPU on small-file ops.

[default]
# SMB multichannel ON (default). It was briefly disabled (mc_on=no) while we wrongly
# suspected it of the idle drops; the real cause was the NVMe cache SSD. Multichannel
# gives parallel TCP channels = much better bulk throughput; single-channel made parallel
# ops crawl. If genuine multichannel instability ever appears, set mc_on=no here + remount.
mc_on=yes

# Negotiate SMB2/SMB3 only (never fall back to the buggy/insecure SMB1).
protocol_vers_map=6

# Don't subscribe to server change-notifications. Some NAS SMB stacks handle
# change-notify poorly under load; turning it off removes a class of stalls.
notify_off=yes
