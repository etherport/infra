# macOS SMB client hardening for the mini's NAS mounts (M79 iCloud Photos pipeline).
#
# WHY: the Photos library lives in an APFS sparsebundle on an SMB share, so every
# block write to the "local" PhotosLib volume is really an SMB write to the NAS. On
# 2026-06-19 the SMB mounts dropped repeatedly — including Personal-Drive dropping
# while completely IDLE on a 10G wired link — which force-quit Photos ("quit to
# prevent corruption") and left the sparsebundle's APFS journal dirty. Random idle
# drops on a fast link are the classic signature of macOS SMB **multichannel** fighting
# the NAS, not bandwidth/sleep. These defaults turn off the fragile bits.
#
# Install (user-level, no sudo, survives reboot — applies to this user's mounts):
#   cp infra/macos/mini/nsmb.conf ~/Library/Preferences/nsmb.conf
# Changes take effect for the NEXT mount, so unmount + remount after installing.
# Verify a live mount actually negotiated what we asked: `smbutil statshares -a`.
#
# If idle drops persist with this in place, escalate to the sudo levers (one-time,
# run in VNC Terminal): copy this to /etc/nsmb.conf (covers root-context mounts too)
# and raise the dead timers so a transient server stall PAUSES I/O instead of
# erroring it up into APFS (prevents the dirty-journal/corruption event):
#   sudo cp infra/macos/mini/nsmb.conf /etc/nsmb.conf
#   sudo sysctl -w net.smb.fs.kern_soft_deadtimer=120   # default 30s -> 120s
#   sudo sysctl -w net.smb.fs.kern_deadtimer=120        # default 60s

[default]
# Disable SMB multichannel. macOS opens multiple TCP channels to a multichannel-
# capable server on a 10G NIC; mismatches/instability here cause spontaneous session
# resets even when idle. Single-channel is slower in theory but stable in practice.
mc_on=no

# Negotiate SMB2/SMB3 only (never fall back to the buggy/insecure SMB1).
protocol_vers_map=6

# Don't subscribe to server change-notifications. Some NAS SMB stacks handle
# change-notify poorly under load; turning it off removes a class of stalls.
notify_off=yes
