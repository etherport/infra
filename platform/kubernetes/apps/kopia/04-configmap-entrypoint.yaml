apiVersion: v1
kind: ConfigMap
metadata:
  name: kopia-entrypoint
  namespace: backups
data:
  entrypoint.sh: |
    #!/bin/sh
    set -eu

    mkdir -p /root/.config/kopia /root/.cache/kopia /repo

    echo "[kopia] checking repository..."
    if kopia repository status >/dev/null 2>&1; then
      echo "[kopia] repository already connected"
    else
      echo "[kopia] attempting repository connect..."
      if kopia repository connect filesystem --path=/repo >/dev/null 2>&1; then
        echo "[kopia] repository connected"
      else
        echo "[kopia] repository not found; creating..."
        kopia repository create filesystem --path=/repo
        echo "[kopia] repository created"
      fi
    fi

    echo "[kopia] starting server..."
    exec kopia server start \
      --address=0.0.0.0:51515 \
      --insecure \
      --server-username="${KOPIA_SERVER_USER}" \
      --server-password="${KOPIA_SERVER_PASS}"