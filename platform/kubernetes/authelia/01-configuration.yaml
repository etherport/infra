# Authelia 4.38 configuration (H38 — internal forward-auth identity gate).
# Local-first by design: authentication is a file user DB + TOTP/WebAuthn, all
# validated IN-CLUSTER — so internal app login keeps working during an internet
# outage (no external IdP dependency). Secrets (session/storage/jwt) come from
# mounted files via AUTHELIA_*_FILE env (see 05-deployment.yaml); the user DB and
# those keys live in SOPS (03-users / 02-secrets).
apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: authelia
data:
  configuration.yml: |
    theme: dark
    server:
      address: 'tcp://0.0.0.0:9091/'
    log:
      level: info
      format: text
    totp:
      issuer: wind.etherport.net
      period: 30
      skew: 1
    authentication_backend:
      # Local file user DB (SOPS-managed). No password reset via portal unless a
      # notifier link is retrieved (filesystem notifier below).
      password_reset:
        disable: false
      refresh_interval: 1m
      file:
        path: /config/users_database.yml
        password:
          algorithm: argon2
          argon2:
            variant: argon2id
    access_control:
      # Default deny; protected apps require 2FA. Per-app rules can be added here
      # (e.g. tighten specific hosts to specific users/groups) as tiers roll out.
      default_policy: deny
      rules:
        - domain: '*.wind.etherport.net'
          policy: two_factor
    session:
      name: authelia_session
      # secret comes from AUTHELIA_SESSION_SECRET_FILE
      cookies:
        - domain: wind.etherport.net
          authelia_url: https://auth.wind.etherport.net
          default_redirection_url: https://wiki.wind.etherport.net
          expiration: 12h
          inactivity: 1h
          remember_me: 1M
    regulation:
      max_retries: 4
      find_time: 2m
      ban_time: 10m
    storage:
      # encryption_key from AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE
      local:
        path: /data/db.sqlite3
    notifier:
      # SES SMTP (reuses the Alertmanager SES creds). Used for 2FA-device
      # registration codes + password-reset codes — rare, online operations.
      # LOGIN stays fully local (file user DB + TOTP/WebAuthn), so internal app
      # access still works during an internet outage; only enroll/reset emails need
      # SES. disable_startup_check so a transient SES hiccup can't block boot.
      # Password via AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE (see 05-deployment.yaml).
      disable_startup_check: true
      smtp:
        address: 'submission://email-smtp.us-west-2.amazonaws.com:587'
        timeout: '10s'
        username: 'AKIA4C5DM33XKE5WUPG4'
        sender: 'Authelia <alerts@etherport.net>'
        identifier: 'wind.etherport.net'
        subject: '[Authelia] {title}'
    identity_validation:
      reset_password:
        # jwt_secret from AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE
        {}
