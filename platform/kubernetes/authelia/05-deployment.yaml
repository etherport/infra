apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  namespace: authelia
  labels:
    app.kubernetes.io/name: authelia
spec:
  replicas: 1
  strategy:
    type: Recreate   # single SQLite-backed replica (RWO PVC)
  selector:
    matchLabels:
      app.kubernetes.io/name: authelia
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authelia
    spec:
      # Stop k8s injecting AUTHELIA_SERVICE_*/AUTHELIA_PORT_* env vars (the Service
      # is named "authelia"); Authelia parses any AUTHELIA_* as config and they
      # collide with server.address → fatal "can't configure both" on boot.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Seed the users DB onto the WRITABLE PVC once. Authelia's file backend
        # rewrites users_database.yml on password change, so it cannot live on the
        # read-only Secret mount. The SOPS Secret is the bootstrap seed; runtime
        # password changes persist on /data (backed up via Velero). Guard: only
        # copy if absent, so a pod restart never clobbers a changed password.
        # (Adding/removing users later = edit /data directly or delete the file to
        # re-seed from the Secret.)
        - name: seed-users
          image: busybox:1.36
          command: ["sh", "-c", "[ -f /data/users_database.yml ] || cp /seed/users_database.yml /data/users_database.yml"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: users, mountPath: /seed, readOnly: true }
            - { name: data, mountPath: /data }
      containers:
        - name: authelia
          image: ghcr.io/authelia/authelia:4.38
          args: ["--config", "/config/configuration.yml"]
          env:
            - { name: AUTHELIA_SESSION_SECRET_FILE, value: /secrets/SESSION_SECRET }
            - { name: AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE, value: /secrets/STORAGE_ENCRYPTION_KEY }
            - { name: AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE, value: /secrets/JWT_SECRET }
            - { name: AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE, value: /secrets/SMTP_PASSWORD }
          ports:
            - { name: http, containerPort: 9091 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            # Authelia writes /app/.healthcheck.env at boot; a RO rootfs makes that
            # fatal. Kept the rest of the hardening (non-root, dropped caps, seccomp).
            readOnlyRootFilesystem: false
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: config, mountPath: /config/configuration.yml, subPath: configuration.yml, readOnly: true }
            # users DB read from the writable PVC (/data), seeded by the init container.
            - { name: secrets, mountPath: /secrets, readOnly: true }
            - { name: data, mountPath: /data }
      volumes:
        - { name: config, configMap: { name: authelia-config } }
        - { name: users, secret: { secretName: authelia-users } }
        - { name: secrets, secret: { secretName: authelia-secrets } }
        - { name: data, persistentVolumeClaim: { claimName: authelia-data } }
