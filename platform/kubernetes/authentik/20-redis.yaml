# Redis for Authentik (cache + Celery broker). Ephemeral — cache/broker only;
# repopulated on restart. Required dependency (no shared Redis in the cluster).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-redis
  namespace: authentik
  labels: { app.kubernetes.io/name: authentik-redis }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: authentik-redis } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: authentik-redis }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports: [{ name: redis, containerPort: 6379 }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] }, readOnlyRootFilesystem: true }
          resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { cpu: 250m, memory: 128Mi } }
          livenessProbe: { tcpSocket: { port: redis }, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata: { name: authentik-redis, namespace: authentik }
spec:
  selector: { app.kubernetes.io/name: authentik-redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
