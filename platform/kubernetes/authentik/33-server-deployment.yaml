apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-server
  namespace: authentik
  labels: { app.kubernetes.io/name: authentik, app.kubernetes.io/component: server }
spec:
  # M114 (2026-07-01): 2 replicas + zero-gap rollout + node spread + PDB (39-pdb.yaml).
  # The server was a 1-replica SPOF — every drain of its node took down SSO (all
  # OIDC apps + every forward-auth admin UI). Server state lives in the shared HA
  # postgres + redis, so 2 stateless replicas are safe. This required dropping the
  # RWO media PVC (Recreate-strategy blocker): the volume held ONLY login-bg.png,
  # which the seed-login-bg initContainer regenerates on every pod start — so media
  # is now an emptyDir per replica (same as the worker). If real uploaded media is
  # ever needed, that's an RWX/CephFS or S3 design decision — don't just re-add RWO.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # zero-gap rollouts
  selector: { matchLabels: { app.kubernetes.io/name: authentik, app.kubernetes.io/component: server } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: authentik, app.kubernetes.io/component: server }
    spec:
      enableServiceLinks: false
      # Spread across nodes so one node loss can't take both replicas.
      # ScheduleAnyway (not DoNotSchedule): on this 8-node cluster a hard
      # constraint could block rollouts during drains — same choice as cue-api.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: authentik, app.kubernetes.io/component: server }
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      initContainers:
        # Seed the login-page background into the media volume: a 1x1 solid
        # dark-gray (#202225) PNG that CSS background-size:cover stretches to a
        # solid fill. flow.background points at "login-bg.png" (40-blueprints.yaml).
        # Idempotent (overwrites each start); bytes embedded so it's git-reproducible.
        - name: seed-login-bg
          image: busybox:1.36
          command: ["sh","-c","mkdir -p /media/public && echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGPgFlIAAABpAD4z6GE4AAAAAElFTkSuQmCC' | base64 -d > /media/public/login-bg.png"]
          securityContext: { runAsNonRoot: true, runAsUser: 1000, allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] }, readOnlyRootFilesystem: true }
          volumeMounts:
            - { name: media, mountPath: /media }
        # Ensure the authentik DB exists (CNPG 1.24 has no Database CR). Runs as the
        # managed `authentik` role (createdb) against the maintenance `postgres` DB.
        # Idempotent; retries via the pod until the role/cluster is reachable.
        - name: create-db
          image: ghcr.io/cloudnative-pg/postgresql:16.4
          command: ["sh","-c","psql -v ON_ERROR_STOP=1 -tAc \"SELECT 1 FROM pg_database WHERE datname='authentik'\" | grep -q 1 || psql -v ON_ERROR_STOP=1 -c \"CREATE DATABASE authentik OWNER authentik\""]
          env:
            - { name: PGHOST, value: postgres-cluster-rw.postgres.svc.cluster.local }
            - { name: PGUSER, value: authentik }
            - { name: PGDATABASE, value: postgres }
            - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: authentik-secret, key: AUTHENTIK_POSTGRESQL__PASSWORD } } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] }, readOnlyRootFilesystem: true }
      containers:
        - name: server
          image: ghcr.io/goauthentik/server:2025.12.6
          args: ["server"]
          envFrom:
            - configMapRef: { name: authentik-env }
            - secretRef: { name: authentik-secret }
          ports:
            - { name: http, containerPort: 9000 }
            - { name: https, containerPort: 9443 }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          # startupProbe (H44, 2026-07-02): authentik runs DB migrations at container
          # start BEFORE the web server binds, so /-/health/* is connection-refused during
          # a migration. Without a startupProbe, a long migration (session cache→DB at
          # 2025.4, RBAC at 2025.12) trips liveness → k8s kills the pod mid-migration →
          # start-failure loop (upstream #14501). 60×10s = up to 10min for a migration to
          # finish before liveness is enforced. Permanent (protects every future upgrade).
          startupProbe: { httpGet: { path: /-/health/live/, port: http }, periodSeconds: 10, failureThreshold: 60 }
          livenessProbe: { httpGet: { path: /-/health/live/, port: http }, initialDelaySeconds: 30, periodSeconds: 30 }
          readinessProbe: { httpGet: { path: /-/health/ready/, port: http }, initialDelaySeconds: 20, periodSeconds: 15 }
          resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
          volumeMounts:
            - { name: media, mountPath: /media }
            - { name: blueprints, mountPath: /blueprints/custom, readOnly: true }
            - { name: custom-css, mountPath: /web/dist/custom.css, subPath: custom.css, readOnly: true }
      volumes:
        - { name: media, emptyDir: {} }   # seed-login-bg regenerates the only file each start (see M114 note above)
        - { name: blueprints, configMap: { name: authentik-blueprints } }
        - { name: custom-css, configMap: { name: authentik-custom-css } }
