# Authentik portal + embedded forward-auth outpost — auth.wind.etherport.net.
# Internal only (Technitium → Traefik VIP); the embedded outpost also serves the
# /outpost.goauthentik.io/ forward-auth endpoints used by gated apps.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: { name: authentik, namespace: authentik }
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`auth.wind.etherport.net`)
      kind: Rule
      services:
        - name: authentik-server
          port: 80
  tls: {}
