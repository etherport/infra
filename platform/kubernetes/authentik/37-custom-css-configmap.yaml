# Custom CSS for Authentik, served at /static/dist/custom.css (the data-inject
# <link> present on every interface) and mounted over /web/dist/custom.css on
# the server (subPath — needs a server restart to reload).
#
# 2026-07-17 REDESIGN (design agent "direction 5c"): Etherport terminal theme for
# the LOGIN FLOW — dark surface, a titlebar with traffic-light dots, a green
# prompt line, mono inputs, bracket "[ Sign in ]" button, + the Etherport logo
# (wired via branding_logo in 40-blueprints.yaml).
#
# SCOPE = login flow ONLY. The design shipped some unscoped selectors (body,
# .pf-c-form-control, .pf-c-button.pf-m-primary) that would bleed the terminal
# look into the admin / user-management UI (green [ Save ] buttons, mono inputs).
# Every rule here is prefixed with .pf-c-login / :has(ak-flow-executor) so the
# management UI keeps Authentik's native dark theme (forced via
# brand.attributes.settings.theme.base=dark in 40-blueprints.yaml). !important is
# needed to beat PatternFly's own utility CSS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-custom-css
  namespace: authentik
data:
  # ⚠️ Brand logo/favicon are served as FILES (mounted into /web/dist → served at
  # /static/dist/…) and referenced by PATH in the Brand blueprint, NOT as data
  # URIs. Authentik 2026.5.x validates branding_logo/branding_favicon with a
  # FILENAME validator ("letters, numbers, dots, hyphens, underscores, slashes,
  # %(theme)s") that REJECTS `data:` URIs — a data-URI logo makes the whole
  # `branding` blueprint fail validation (status=error) so nothing in it applies
  # (logo, favicon, AND theme.base=dark). Data URIs worked pre-2026.5 (2024.12);
  # the H44 upgrade broke them. Keep these as served files.
  # Logo: Authentik's .pf-c-brand already centers this (justify-content:center) +
  # scales it to a % of the card width. So centering depends ENTIRELY on the SVG
  # content being centered within its OWN viewBox. The wordmark (ring + "etherport")
  # spans ~x8–183, so in the old 236-wide viewBox it sat left-of-centre → looked
  # off-centre (2026-07-20). Tightened the viewBox to hug the content (8px margins
  # both sides) so the centred, scaled logo is actually centred.
  etherport-logo-dark.svg: |
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 191 48" width="191" height="48">
      <circle cx="24" cy="24" r="14" fill="none" stroke="#46c46a" stroke-width="4"></circle>
      <circle cx="24" cy="24" r="4.5" fill="#46c46a"></circle>
      <text x="52" y="33" font-family="-apple-system,BlinkMacSystemFont,&#39;Segoe UI&#39;,Helvetica,Arial,sans-serif" font-size="27" font-weight="700" letter-spacing="-0.5" fill="#e6edf3">etherport</text>
    </svg>
  # Favicon: TRANSPARENT (no background rect) per operator preference — a green ring
  # mark. NB Safari composites favicons onto a light tile in bookmarks/favourites, so
  # it can still look boxed there; in the actual (dark) browser tab it's transparent.
  # Aggressively cached by browsers — hard-refresh after changing.
  etherport-mark.svg: |
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
      <circle cx="24" cy="24" r="17" fill="none" stroke="#46c46a" stroke-width="5"></circle>
      <circle cx="24" cy="24" r="5.5" fill="#46c46a"></circle>
    </svg>
  custom.css: |
    /* ===== Etherport terminal theme — LOGIN FLOW ONLY ===== */
    :root {
      --ep-page: #05070b; --ep-surface: #0a0e14; --ep-titlebar: #0d1219;
      --ep-border: #1b232e; --ep-text: #e6edf3; --ep-dim: #6b7888;
      --ep-dim2: #3a4553; --ep-ok: #46c46a; --ep-ok-border: #2e6b3f;
      --ep-cyan: #5ac2d4;
      --ep-mono: ui-monospace, SFMono-Regular, Menlo, "JetBrains Mono", monospace;
      --ep-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
    }

    /* Page background (scoped to the flow page so mgmt UI keeps native dark) */
    html:has(ak-flow-executor),
    body:has(ak-flow-executor) { background: var(--ep-page) !important; margin: 0 !important; }
    .pf-c-login { background: var(--ep-page) !important; min-height: 100vh !important; font-family: var(--ep-sans); }
    .pf-c-background-image { display: none !important; }

    /* Etherport logo (branding_logo SVG) — show, size, and CENTER it above the card.
       Center defensively across the possible header DOM: make the header wrappers
       both text-align:center AND flex-center (whichever applies), and give the brand
       element auto side-margins so a block-level <img> also centers. */
    .pf-c-login__header,
    .pf-c-login .pf-c-login__main-header,
    .pf-c-login header {
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      text-align: center !important;
      width: 100% !important;
    }
    .pf-c-login .pf-c-brand {
      display: block !important;
      margin: 0 auto 14px auto !important;
      float: none !important;
      text-align: center;
    }
    .pf-c-login .pf-c-brand img,
    .pf-c-login img.pf-c-brand {
      display: block !important;
      height: 40px !important;
      width: auto !important;
      max-width: 236px;
      margin: 0 auto !important;
    }

    /* Card = terminal window */
    .pf-c-login .pf-c-login__main {
      background: var(--ep-surface) !important;
      border: 1px solid var(--ep-border) !important;
      border-radius: 11px !important;
      overflow: hidden !important;
      box-shadow: 0 18px 40px rgba(0, 0, 0, .4) !important;
    }

    /* Titlebar (traffic lights drawn with radial gradients) */
    .pf-c-login .pf-c-login__main::before {
      content: "etherport \00b7 sso";
      display: block;
      padding: 11px 16px 11px 76px;
      background:
        radial-gradient(circle 5.5px at 24px 50%, #f4685c 5.5px, transparent 6px),
        radial-gradient(circle 5.5px at 42px 50%, #e0a53a 5.5px, transparent 6px),
        radial-gradient(circle 5.5px at 60px 50%, #46c46a 5.5px, transparent 6px),
        var(--ep-titlebar);
      border-bottom: 1px solid var(--ep-border);
      font-family: var(--ep-mono);
      font-size: 12.5px;
      color: var(--ep-dim);
      text-align: center;
    }

    /* Prompt line above the form (static — CSS can't read the input) */
    .pf-c-login .pf-c-login__main-body::before {
      content: "guest@etherport:~$ ssh etherport \2589";
      display: block;
      margin: 4px 0 18px;
      font-family: var(--ep-mono);
      font-size: 13px;
      color: var(--ep-ok);
      animation: ep-blink 1.1s step-end infinite;
    }
    @keyframes ep-blink { 50% { opacity: .55; } }

    /* Header + text */
    .pf-c-login .pf-c-login__main-header,
    .pf-c-login .pf-c-title { color: var(--ep-text) !important; }
    .pf-c-login .pf-c-login__main-body { color: var(--ep-text); }
    .pf-c-login .pf-c-form__label-text {
      font-family: var(--ep-mono);
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--ep-dim);
    }

    /* Inputs */
    .pf-c-login .pf-c-form-control {
      background: var(--ep-titlebar) !important;
      border: 1px solid var(--ep-border) !important;
      border-radius: 6px !important;
      color: var(--ep-text) !important;
      font-family: var(--ep-mono);
    }
    .pf-c-login .pf-c-form-control:focus { border-color: var(--ep-ok) !important; box-shadow: none !important; }

    /* Primary button = bracket style */
    .pf-c-login .pf-c-button.pf-m-primary {
      background: rgba(70, 196, 106, .08) !important;
      border: 1px solid var(--ep-ok-border) !important;
      border-radius: 6px !important;
      color: var(--ep-ok) !important;
      font-family: var(--ep-mono);
      font-weight: 700;
    }
    .pf-c-login .pf-c-button.pf-m-primary::before { content: "[ "; }
    .pf-c-login .pf-c-button.pf-m-primary::after { content: " ]"; }
    .pf-c-login .pf-c-button.pf-m-primary:hover { background: rgba(70, 196, 106, .16) !important; }

    /* Links + footer */
    .pf-c-login .pf-c-login__main a { color: var(--ep-cyan); }
    .pf-c-login .pf-c-login__footer,
    .pf-c-login .pf-c-login__main-footer-band { color: var(--ep-dim2); font-family: var(--ep-mono); font-size: 11px; }
