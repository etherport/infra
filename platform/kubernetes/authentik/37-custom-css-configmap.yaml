# Custom CSS for Authentik, served at /static/dist/custom.css (the data-inject
# <link> present on every interface) and mounted over /web/dist/custom.css on
# the server (subPath — needs a server restart to reload).
#
# Dark mode: Authentik 2024.12 has no server-side/global theme toggle — its dark
# theme (theme-dark.css) is auto-selected from the browser's prefers-color-scheme
# and can't be forced via API/blueprint. theme-dark.css uses UNGATED :root/body
# rules + CSS custom properties (which inherit through shadow DOM), so importing
# it here forces Authentik's NATIVE dark theme on EVERY interface (login flow +
# admin/user management UI) — proper PatternFly dark, no per-component overrides,
# no JS. The few rules below are just login-flow polish layered on top (scoped to
# the flow via :has()/.pf-c-login so they don't touch the management UI).
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-custom-css
  namespace: authentik
data:
  custom.css: |
    /* Force Authentik's native dark theme globally (login + mgmt). MUST be first. */
    @import url("/static/dist/theme-dark.css");

    /* ----- Etherport SSO login-flow polish (on top of native dark) ----- */
    /* Deep-slate background matching the report emails (--bg #0b1220), full
       viewport, scoped to the flow page so the mgmt UI keeps the native dark bg. */
    html:has(ak-flow-executor),
    body:has(ak-flow-executor) {
      background-color: #0b1220 !important;
      margin: 0 !important;
    }
    .pf-c-login {
      background: #0b1220 !important;
      min-height: 100vh !important;
    }
    .pf-c-background-image {
      background: #0b1220 !important;
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
    }
    .pf-c-background-image::before,
    .pf-c-background-image svg { display: none !important; }

    /* Login card — slightly lifted surface, soft border, rounded (outer shadow
       root, so a plain .pf-c-login descendant selector reaches it reliably). */
    .pf-c-login .pf-c-login__main {
      background-color: #131c2e !important;
      border: 1px solid #243049 !important;
      border-radius: 12px !important;
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.40) !important;
      overflow: hidden !important;
    }
