# Custom CSS for Authentik, served at /static/dist/custom.css (the data-inject
# <link> present on every interface) and mounted over /web/dist/custom.css on
# the server (subPath — needs a server restart to reload).
#
# Dark mode is forced NATIVELY via the brand attribute settings.theme.base=dark
# (see 40-blueprints.yaml) — that's the supported way and themes every interface
# (login + admin/user mgmt) using Authentik's own PatternFly dark theme. The
# rules here are ONLY login-flow polish on top of that, scoped to the flow via
# :has()/.pf-c-login so they never touch the management UI.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-custom-css
  namespace: authentik
data:
  custom.css: |
    /* ----- Etherport SSO login-flow polish (on top of native dark) ----- */
    /* Deep-slate background matching the report emails (--bg #0b1220), full
       viewport, scoped to the flow page so the mgmt UI keeps the native dark bg. */
    html:has(ak-flow-executor),
    body:has(ak-flow-executor) {
      background-color: #0b1220 !important;
      margin: 0 !important;
    }
    .pf-c-login {
      background: #0b1220 !important;
      min-height: 100vh !important;
    }
    .pf-c-background-image {
      background: #0b1220 !important;
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
    }
    .pf-c-background-image::before,
    .pf-c-background-image svg { display: none !important; }

    /* Login card — slightly lifted surface, soft border, rounded (outer shadow
       root, so a plain .pf-c-login descendant selector reaches it reliably). */
    .pf-c-login .pf-c-login__main {
      background-color: #131c2e !important;
      border: 1px solid #243049 !important;
      border-radius: 12px !important;
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.40) !important;
      overflow: hidden !important;
    }
