# GitOps SSO config — Authentik blueprints (auto-applied by the worker from
# /blueprints/custom). Add an entry per app. Secrets come via !Env from the
# authentik-secret (so no secret material in this ConfigMap).
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
data:
  grafana.yaml: |
    version: 1
    metadata:
      name: grafana-oidc
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: grafana-provider
        identifiers:
          name: grafana
        attrs:
          name: grafana
          client_type: confidential
          client_id: grafana
          client_secret: !Env AUTHENTIK_GRAFANA_CLIENT_SECRET
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          redirect_uris:
            - matching_mode: strict
              url: https://grafana.wind.etherport.net/login/generic_oauth
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      - model: authentik_core.application
        id: grafana-app
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          slug: grafana
          provider: !KeyOf grafana-provider
          meta_launch_url: https://grafana.wind.etherport.net
  # M76: OIDC for `step ssh login` (human path to the step-ca SSH CA). The redirect
  # is the local listener the `step` CLI opens (provisioner --listen-address :10000).
  # Headless automation does NOT use this — it uses step-ca's JWK provisioner.
  step-ca.yaml: |
    version: 1
    metadata:
      name: step-ca-oidc
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: step-ca-provider
        identifiers:
          name: step-ca
        attrs:
          name: step-ca
          client_type: confidential
          client_id: step-ca
          client_secret: !Env AUTHENTIK_STEPCA_CLIENT_SECRET
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          redirect_uris:
            - matching_mode: strict
              url: http://127.0.0.1:10000
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      - model: authentik_core.application
        id: step-ca-app
        identifiers:
          slug: step-ca
        attrs:
          name: step-ca SSH CA
          slug: step-ca
          provider: !KeyOf step-ca-provider
          meta_description: "SSH certificate authority — `step ssh login` for short-lived node/VM SSH (M76)"
      # GATE: only the Admins group may use step-ca SSO (its cert grants ubuntu/root
      # on every host). Plex/HA/etc. users authenticate elsewhere and are NOT admins.
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf step-ca-app
          group: !Find [authentik_core.group, [name, "authentik Admins"]]
          order: 0
        attrs:
          enabled: true
  open-webui.yaml: |
    version: 1
    metadata:
      name: open-webui-oidc
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: open-webui-provider
        identifiers:
          name: open-webui
        attrs:
          name: open-webui
          client_type: confidential
          client_id: open-webui
          client_secret: !Env AUTHENTIK_OPENWEBUI_CLIENT_SECRET
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          redirect_uris:
            - matching_mode: strict
              url: https://chat.wind.etherport.net/oauth/oidc/callback
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      - model: authentik_core.application
        id: open-webui-app
        identifiers:
          slug: open-webui
        attrs:
          name: Open WebUI
          slug: open-webui
          provider: !KeyOf open-webui-provider
          meta_launch_url: https://chat.wind.etherport.net
  wikijs.yaml: |
    version: 1
    metadata:
      name: wikijs-oidc
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: wikijs-provider
        identifiers:
          name: wikijs
        attrs:
          name: wikijs
          client_type: confidential
          client_id: wikijs
          client_secret: !Env AUTHENTIK_WIKIJS_CLIENT_SECRET
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          # wiki.js generates the strategy key (and thus the callback path) when the
          # OIDC strategy is created in its admin UI, so match the callback by regex.
          redirect_uris:
            - matching_mode: regex
              url: "https://wiki\\.wind\\.etherport\\.net/login/[^/]+/callback"
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      - model: authentik_core.application
        id: wikijs-app
        identifiers:
          slug: wikijs
        attrs:
          name: Wiki.js
          slug: wikijs
          provider: !KeyOf wikijs-provider
          meta_launch_url: https://wiki.wind.etherport.net
  forward-auth.yaml: |
    # Domain-level forward-auth for browser admin UIs with no/weak built-in SSO
    # (Proxmox, IPMI, PDUs, UPSs, Technitium DNS, Traefik dashboard). One proxy
    # provider covers all *.wind hosts (cookie_domain), served by the embedded
    # outpost; Traefik's forwardAuth middleware (38-forward-auth-middleware.yaml)
    # gates each route. Single sign-on across all gated UIs.
    version: 1
    metadata:
      name: forward-auth
    entries:
      - model: authentik_providers_proxy.proxyprovider
        id: forward-auth-provider
        identifiers:
          name: forward-auth
        attrs:
          name: forward-auth
          mode: forward_domain
          external_host: https://auth.wind.etherport.net
          # Apex cookie (broadened from wind.etherport.net 2026-06-23 per owner) so
          # the forward-auth SSO session spans all *.etherport.net, not just *.wind.
          cookie_domain: etherport.net
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        id: forward-auth-app
        identifiers:
          slug: forward-auth
        attrs:
          name: Forward Auth (admin UIs)
          slug: forward-auth
          provider: !KeyOf forward-auth-provider
      # Attach the proxy provider to the built-in embedded outpost so the server
      # serves /outpost.goauthentik.io/auth/traefik for the middleware.
      - model: authentik_outposts.outpost
        identifiers:
          name: authentik Embedded Outpost
        attrs:
          type: proxy
          providers:
            - !KeyOf forward-auth-provider
  graham.yaml: |
    # Daily admin account (akadmin = break-glass). Member of the superuser group.
    # NB: deliberately NO `password` attr — Authentik re-applies a blueprint
    # password on EVERY apply (write-only field, can't diff), which clobbered
    # UI-set passwords on each worker restart. graham's password + passkey are
    # managed in the UI; the initial password was set once via the bootstrap
    # value (AUTHENTIK_GRAHAM_PASSWORD, now unused). On a rebuild, use akadmin
    # (break-glass) to re-set graham's password.
    version: 1
    metadata:
      name: graham-user
    entries:
      - model: authentik_core.user
        id: graham-user
        identifiers:
          username: graham
        attrs:
          username: graham
          name: Graham
          email: grahamsm@gmail.com
          is_active: true
          path: users
          groups:
            - !Find [authentik_core.group, [name, "authentik Admins"]]
  branding.yaml: |
    # Login-page chrome (pure cosmetic, GitOps). Solid dark-gray background
    # (#202225, 1x1 tiled PNG), no brand logo (transparent pixel), no
    # "Welcome to authentik!" title. Partial attr updates onto the built-in
    # brand + flows.
    version: 1
    metadata:
      name: branding
    entries:
      - model: authentik_brands.brand
        identifiers:
          domain: authentik-default
        attrs:
          # Etherport wordmark (green ring + text) + ring-only favicon. ⚠️ MUST be
          # served-file PATHS, not data URIs: Authentik 2026.5 validates these with a
          # filename validator that REJECTS `data:` URIs → the whole blueprint fails
          # (status=error, nothing applies incl. theme.base below). The SVGs are in
          # the authentik-custom-css ConfigMap (37-*), mounted into /web/dist/ (33-*)
          # and thus served at /static/dist/. Renders above the terminal login card;
          # custom.css sizes/centers it.
          branding_logo: "/static/dist/etherport-logo-dark.svg"
          branding_favicon: "/static/dist/etherport-mark.svg"
          # ⚠️ Login theme lives HERE (branding_custom_css), NOT the served
          # /static/dist/custom.css file (the FLOW interface never loads custom.css —
          # only the admin/user UI does). ⚠️⚠️ The login CARD, FORM and BUTTON render
          # inside SHADOW DOM (confirmed via DevTools 2026-07-20: 3 shadow roots;
          # `.pf-c-login` is light-DOM but `.pf-c-login__main`/inputs/button are
          # shadow-scoped). Selector rules like `.pf-c-login .pf-c-button` CANNOT
          # cross the shadow boundary, so the earlier titlebar/prompt/bracket
          # pseudo-elements were dead. The ONLY things that cross into shadow DOM are
          # (1) inherited CSS custom properties and (2) inherited props (font-family).
          # So the accent theme is done by overriding PatternFly v5 `--pf-c-*`
          # variables on the light-DOM `.pf-c-login` ancestor — those cascade INTO the
          # shadow components. The pure-chrome bits (fake terminal titlebar, shell
          # prompt, `[ ]` brackets) are NOT achievable via this injection and were
          # dropped. Scoped to .pf-c-login so the admin/user UI keeps native dark.
          branding_custom_css: |
            /* Only the reachable, confirmed-working bits are kept. The login CARD,
               FORM and BUTTON render in SHADOW DOM, and Authentik's dark theme
               redefines the PatternFly colour tokens (e.g. --pf-global--primary-color--100
               on `:host([theme=dark]) .pf-m-dark`) INSIDE the shadow root — closer in
               the cascade than any light-DOM injection — so button/input/card COLOURS
               cannot be overridden from here (verified against flow-2026.5.3.css,
               2026-07-20). What DOES cross the boundary: inherited props (font-family)
               + light-DOM elements (page bg, brand/logo). So this ships: dark page,
               mono font, centred etherport logo. The green button / terminal card
               chrome are not achievable without a custom flow-interface build. */
            html:has(ak-flow-executor),
            body:has(ak-flow-executor) { background: #05070b !important; margin: 0 !important; }
            .pf-c-login { background: #05070b !important; min-height: 100vh !important; text-align: center;
              /* mono font — font-family inherits across the shadow boundary (this works) */
              --pf-global--FontFamily--text: ui-monospace, SFMono-Regular, Menlo, "JetBrains Mono", monospace;
              --pf-global--FontFamily--sans-serif: ui-monospace, SFMono-Regular, Menlo, "JetBrains Mono", monospace;
              font-family: ui-monospace, SFMono-Regular, Menlo, "JetBrains Mono", monospace;
            }
            .pf-c-background-image { display: none !important; }
            .pf-c-login__header, .pf-c-login header { display: flex !important; justify-content: center !important; width: 100% !important; }
            .pf-c-login .pf-c-brand { display: block !important; margin: 0 auto 14px auto !important; float: none !important; }
            .pf-c-login .pf-c-brand img, .pf-c-login img.pf-c-brand {
              display: block !important; height: 40px !important; width: auto !important; max-width: 200px; margin: 0 auto !important;
            }
            /* Hide the "Powered by authentik" footer band (best-effort — if it's
               shadow-scoped like the button this won't reach it; verify after refresh). */
            .pf-c-login__main-footer-band,
            .pf-c-login__main-footer-band-item,
            .pf-c-login__footer { display: none !important; }
          # Force Authentik's NATIVE dark theme for every interface (login flow +
          # admin/user mgmt). 2024.12 has no theme column, but the web reads
          # brand.attributes.settings.theme.base — this is the supported way to
          # override the default "automatic" (OS prefers-color-scheme) theme.
          attributes:
            settings:
              theme:
                base: dark
      - model: authentik_flows.flow
        identifiers:
          slug: default-authentication-flow
        attrs:
          # name/slug/designation are required by the flow serializer (kept at
          # current values); only title + background are actually changed.
          name: "Welcome to authentik!"
          slug: default-authentication-flow
          designation: authentication
          title: "Etherport SSO"
          # flow.background is a FileField served from /media/public/<name>; a
          # data-URI gets stored as a bogus filename. The solid dark-gray PNG is
          # seeded into the media volume by the server's seed-login-bg init
          # container (33-server-deployment.yaml).
          background: "login-bg.png"
