# GitOps SSO config — Authentik blueprints (auto-applied by the worker from
# /blueprints/custom). Add an entry per app. Secrets come via !Env from the
# authentik-secret (so no secret material in this ConfigMap).
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
data:
  grafana.yaml: |
    version: 1
    metadata:
      name: grafana-oidc
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: grafana-provider
        identifiers:
          name: grafana
        attrs:
          name: grafana
          client_type: confidential
          client_id: grafana
          client_secret: !Env AUTHENTIK_GRAFANA_CLIENT_SECRET
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          redirect_uris:
            - matching_mode: strict
              url: https://grafana.wind.etherport.net/login/generic_oauth
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      - model: authentik_core.application
        id: grafana-app
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          slug: grafana
          provider: !KeyOf grafana-provider
          meta_launch_url: https://grafana.wind.etherport.net
  graham.yaml: |
    # Daily admin account (akadmin = break-glass). Member of the superuser group.
    # Bootstrap password via !Env (change it + enroll a passkey on first login).
    version: 1
    metadata:
      name: graham-user
    entries:
      - model: authentik_core.user
        id: graham-user
        identifiers:
          username: graham
        attrs:
          username: graham
          name: Graham
          email: grahamsm@gmail.com
          is_active: true
          path: users
          password: !Env AUTHENTIK_GRAHAM_PASSWORD
          groups:
            - !Find [authentik_core.group, [name, "authentik Admins"]]
  branding.yaml: |
    # Login-page chrome (pure cosmetic, GitOps). Solid dark-gray background
    # (#202225, 1x1 tiled PNG), no brand logo (transparent pixel), no
    # "Welcome to authentik!" title. Partial attr updates onto the built-in
    # brand + flows.
    version: 1
    metadata:
      name: branding
    entries:
      - model: authentik_brands.brand
        identifiers:
          domain: authentik-default
        attrs:
          branding_logo: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAC0lEQVR4nGNgAAIAAAUAAXpeqz8AAAAASUVORK5CYII="
      - model: authentik_flows.flow
        identifiers:
          slug: default-authentication-flow
        attrs:
          # name/slug/designation are required by the flow serializer (kept at
          # current values); only title + background are actually changed.
          name: "Welcome to authentik!"
          slug: default-authentication-flow
          designation: authentication
          title: "\u200B"   # zero-width space: non-blank (DRF rejects "") but renders empty
          # flow.background is a FileField served from /media/public/<name>; a
          # data-URI gets stored as a bogus filename. The solid dark-gray PNG is
          # seeded into the media volume by the server's seed-login-bg init
          # container (33-server-deployment.yaml).
          background: "login-bg.png"
