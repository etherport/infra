---
# LEGACY FALLBACK PUBLIC APPROVAL URL — kept for resilience.
#
# Current default: APPROVAL_BASE_URL=https://approve.etherport.net
# (CF Access gated, Google SSO) flipped 2026-05-26 in commit cb56187.
# Email links go to that apex-level URL; this Traefik IngressRoute is
# no longer the primary path.
#
# Why keep it?
# - Defense in depth — if the CF Tunnel or CF Access has an outage,
#   the Tailscale URL + this public-but-HMAC-gated URL still work as
#   manual approval paths.
# - Costs ~0 to leave deployed — it's a Traefik IngressRoute, no extra
#   resource consumption.
# - Removing requires a manual revert if we ever want to roll back the
#   CF setup. Keeping it costs nothing.
#
# Security posture (same as before):
# - HMAC token validates the click came from a recipient of the proposal
#   email; replay-protected via single-use proposal lookup.
# - No zero-trust gate in front of THIS path (unlike approve.etherport.net
#   which has Google SSO via CF Access).
# - DNS resolves via the *.wind.etherport.net wildcard → AWS ALB →
#   Traefik IngressRoute matches Host → controller.
#
# If you ever want to retire this route entirely: just delete the file
# + bump kustomization.yaml. The functionality is fully covered by the
# CF Tunnel path; this is purely defense-in-depth.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: remediation-approve-public
  namespace: auto-remediation
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`approve.wind.etherport.net`) && PathPrefix(`/approve`)
      kind: Rule
      services:
        - name: remediation-webhook
          port: 8080
  tls: {}   # uses the existing wind.etherport.net wildcard cert
