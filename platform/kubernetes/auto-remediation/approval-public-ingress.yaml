---
# Public approval URL for the AI advisor (M41 P2.5).
#
# DO NOT POINT EMAIL LINKS HERE YET. Default email links still go to
# the Tailscale-only URL. This Ingress exists but is unadvertised
# until an auth gate is in front (tracked as L13). The HMAC token
# alone is not a sufficient security boundary for a public URL —
# anyone with email access can approve.
#
# Sister to approval-ingress.yaml (Tailscale-only). Same backend
# service. Reasoning for keeping it deployed but unadvertised:
# - The Traefik IngressRoute is harmless on its own; you'd have to
#   know the URL pattern AND have a valid HMAC token to do anything.
#   Both come from access to the email inbox.
# - When L13 lands (Cloudflare Access or similar zero-trust gate in
#   front of *.wind.etherport.net for sensitive endpoints), flipping
#   APPROVAL_BASE_URL to the public URL becomes a 1-line change.
# - Removing + re-adding the Ingress later is fine but commits to a
#   "Tailscale forever" model. Keeping it positions for future.
#
# To advertise (after auth gate is in place):
#   1. Switch APPROVAL_BASE_URL in deployment.yaml.
#   2. Commit + push.
#   3. New advisor emails carry the public URL.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: remediation-approve-public
  namespace: auto-remediation
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`approve.wind.etherport.net`) && PathPrefix(`/approve`)
      kind: Rule
      services:
        - name: remediation-webhook
          port: 8080
  tls: {}   # uses the existing wind.etherport.net wildcard cert
