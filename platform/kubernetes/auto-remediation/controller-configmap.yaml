apiVersion: v1
kind: ConfigMap
metadata:
  name: remediation-script
  namespace: auto-remediation
data:
  remediate.py: |
    #!/usr/bin/env python3
    """
    Auto-Remediation Controller (with optional AI Advisor — M41 Phase 1)

    Receives Prometheus alerts via Alertmanager webhook. Two paths:

    1. Rule-based (original, always-on): if the alertname is in
       /etc/remediation/rules.yaml, take the canned action
       (restart_pods / scale_deployment) and stop.

    2. AI advisor (Phase 1 — advisory-only, opt-in via
       AI_ADVISOR_ENABLED=true): if no rule matches, gather context
       (pod logs, Loki query, K8s events, prior fires), call the
       Anthropic API for a diagnosis + proposed action, EMAIL the
       result to the operator. Does NOT execute the proposed action
       in Phase 1.

    Hard guardrails on the advisor path:
      - Per-day USD cost cap (AI_ADVISOR_DAILY_COST_USD_CAP, default $0.50).
        At cap, falls back to "advisory unavailable" with raw alert.
      - Token-budget per request (AI_ADVISOR_MAX_INPUT_TOKENS, default 8000).
      - Cooldown: same 15min as rule-based path, keyed on alertname.
      - Structured-JSON response from Claude is parsed strictly;
        proposed_action.type is enum-validated; anything else dropped.

    Audit log: every advisor call emits a structured JSON line to
    stdout with action="ai_advisor". Queryable via Loki LogQL as
    {namespace="auto-remediation"} |= "ai_advisor".
    """
    import os
    import json
    import hmac
    import hashlib
    import base64
    import logging
    import smtplib
    import ssl
    import urllib.request
    import urllib.error
    import urllib.parse
    import yaml
    from email.message import EmailMessage
    from email.mime.multipart import MIMEMultipart
    from email.mime.text import MIMEText
    from html import escape as html_escape
    from http.server import HTTPServer, BaseHTTPRequestHandler
    from kubernetes import client, config
    from datetime import datetime, timedelta, timezone

    logging.basicConfig(level=logging.INFO, format='%(asctime)s - %(levelname)s - %(message)s')
    logger = logging.getLogger(__name__)

    # Load Kubernetes config
    try:
        config.load_incluster_config()
    except:
        config.load_kube_config()

    v1 = client.CoreV1Api()
    apps_v1 = client.AppsV1Api()

    # Load remediation rules
    with open('/etc/remediation/rules.yaml', 'r') as f:
        RULES = yaml.safe_load(f)['rules']

    # ---- AI Advisor configuration (Phase 1 — advisory only) ----
    AI_ENABLED = os.environ.get('AI_ADVISOR_ENABLED', 'false').lower() == 'true'
    AI_DAILY_USD_CAP = float(os.environ.get('AI_ADVISOR_DAILY_COST_USD_CAP', '0.50'))
    AI_MAX_INPUT_TOKENS = int(os.environ.get('AI_ADVISOR_MAX_INPUT_TOKENS', '8000'))
    AI_MODEL = os.environ.get('AI_ADVISOR_MODEL', 'claude-sonnet-4-6')
    ANTHROPIC_API_KEY = os.environ.get('ANTHROPIC_API_KEY', '')
    EMAIL_TO = os.environ.get('EMAIL_TO', 'graham.m.smith@me.com')
    EMAIL_FROM = os.environ.get('EMAIL_FROM', 'ai-advisor@etherport.net')
    SMTP_HOST = os.environ.get('SMTP_HOST', 'email-smtp.us-west-2.amazonaws.com')
    SMTP_PORT = int(os.environ.get('SMTP_PORT', '587'))
    SMTP_USER = os.environ.get('SMTP_USER', '')
    SMTP_PASS = os.environ.get('SMTP_PASS', '')
    LOKI_URL = os.environ.get('LOKI_URL', 'http://loki.monitoring.svc.cluster.local:3100')
    PROMETHEUS_URL = os.environ.get('PROMETHEUS_URL', 'http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090')

    # M45 Phase B: CloudWatch Logs read for AWS-side context. Requires
    # the AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY env vars to be
    # populated from the ai-advisor-aws-cloudwatch SOPS secret; if
    # empty, the advisor silently skips the CW fetch step.
    AWS_REGION_PRIMARY = os.environ.get('AWS_REGION_PRIMARY', 'us-west-2')
    # Subnet CIDR for AWS-VPC instances — used to detect aws-related
    # alerts via the `instance` label.
    AWS_VPC_CIDR_PREFIX = os.environ.get('AWS_VPC_CIDR_PREFIX', '10.10.100.')

    # Pricing per million tokens — keep in sync with anthropic.com/pricing.
    # claude-sonnet-4-6: $3/M input, $15/M output.
    AI_PRICE_PER_M_INPUT = float(os.environ.get('AI_ADVISOR_PRICE_INPUT', '3.0'))
    AI_PRICE_PER_M_OUTPUT = float(os.environ.get('AI_ADVISOR_PRICE_OUTPUT', '15.0'))

    # ---- Phase 2: approve-via-email ----
    AI_PHASE2_ENABLED = os.environ.get('AI_PHASE2_ENABLED', 'false').lower() == 'true'
    APPROVAL_HMAC_KEY = os.environ.get('APPROVAL_HMAC_KEY', '')
    APPROVAL_BASE_URL = os.environ.get('APPROVAL_BASE_URL', '')  # e.g. https://remediation-approve.<tailnet>.ts.net
    APPROVAL_TTL_HOURS = int(os.environ.get('APPROVAL_TTL_HOURS', '24'))

    # ---- Phase 3: autonomous execution (opt-in per alert) ----
    # Top-level kill switch + per-alert opt-in via PrometheusRule
    # label `ai_remediation: "auto"`. Both must be true for autonomous
    # execute. Designed so a single env flip can revert ALL Phase 3
    # alerts to Phase 2 (approve-via-email) behavior immediately.
    AI_PHASE3_ENABLED = os.environ.get('AI_PHASE3_ENABLED', 'false').lower() == 'true'
    AI_PHASE3_CONFIDENCE_THRESHOLD = float(os.environ.get('AI_PHASE3_CONFIDENCE_THRESHOLD', '0.85'))
    # Phase 3 inherits the SAME action allowlist + namespace denylist
    # as Phase 2. No expansion. Phase 3 is purely about who pulls the
    # trigger (operator click vs controller itself), not what actions
    # are possible.

    # Known-noisy alertnames — short-circuit BEFORE calling Claude.
    # Saves API tokens on alerts that always diagnose to noop, plus
    # alerts that are structurally never-actionable (InfoInhibitor is
    # a kube-state-metrics placeholder; KubeJobCompleted/Watchdog
    # are health canaries; CPUThrottlingHigh is informational on
    # bursty workloads).
    # Added 2026-05-24 after first 24h burned $0.94 in cap with 44
    # InfoInhibitor + 18 NodeMemoryHigh diagnoses, all noop.
    AI_IGNORE_ALERTS = {
        'InfoInhibitor',
        'Watchdog',
        'KubeJobCompleted',
        'CPUThrottlingHigh',
        'KubeAggregatedAPIDown',  # transient on apiserver restart
    }

    # Allowlist of proposed_action.type values the LLM may return.
    # ANYTHING ELSE is dropped server-side before the diagnosis is
    # emailed. The LLM never sees a shell; this enum is the entire
    # action surface.
    AI_ACTION_TYPES_ALLOWED = {'noop', 'restart_pods', 'scale_deployment_temp'}
    # Namespaces that are off-limits even for the allowed action types.
    # Phase 1 doesn't execute anything but we still validate so the
    # email recommendation doesn't tell the human to do something
    # we'd later reject.
    AI_NAMESPACE_DENYLIST = {'kube-system', 'flux-system', 'cert-manager', 'cnpg-system', 'rook-ceph'}

    # Track recent actions to prevent loops (shared between rule path and advisor path)
    recent_actions = {}
    COOLDOWN_MINUTES = 15

    # Per-day cost tracker (resets at UTC midnight).
    _cost_tracker = {'date': None, 'usd_spent': 0.0}

    # Pending proposals awaiting approval (Phase 2). Keyed by proposal_id.
    # In-memory, single-replica controller, so a pod restart drops them
    # (operator gets "token expired" if they click after a restart).
    # GC'd opportunistically in _gc_pending().
    _pending_proposals = {}

    def _today_utc():
        return datetime.now(timezone.utc).date()

    def _add_cost(input_tokens, output_tokens):
        today = _today_utc()
        if _cost_tracker['date'] != today:
            _cost_tracker['date'] = today
            _cost_tracker['usd_spent'] = 0.0
        cost = (input_tokens / 1_000_000) * AI_PRICE_PER_M_INPUT + \
               (output_tokens / 1_000_000) * AI_PRICE_PER_M_OUTPUT
        _cost_tracker['usd_spent'] += cost
        return cost

    def _cap_reached():
        today = _today_utc()
        if _cost_tracker['date'] != today:
            return False
        return _cost_tracker['usd_spent'] >= AI_DAILY_USD_CAP

    def is_cooldown_active(alert_name):
        """Check if we're in cooldown period for this alert"""
        if alert_name in recent_actions:
            last_action = recent_actions[alert_name]
            if datetime.now() - last_action < timedelta(minutes=COOLDOWN_MINUTES):
                logger.info(f"Cooldown active for {alert_name}, skipping action")
                return True
        return False

    def restart_pods(namespace, selector):
        """Restart pods matching selector in namespace"""
        logger.info(f"Restarting pods in {namespace} with selector {selector}")
        try:
            pods = v1.list_namespaced_pod(namespace, label_selector=selector)
            deleted_count = 0
            for pod in pods.items:
                logger.info(f"Deleting pod {pod.metadata.name}")
                v1.delete_namespaced_pod(pod.metadata.name, namespace)
                deleted_count += 1
            logger.info(f"Deleted {deleted_count} pods")
            return True
        except Exception as e:
            logger.error(f"Error restarting pods: {e}")
            return False

    def scale_deployment(namespace, name, replicas=0):
        """Scale deployment to 0 then back to original"""
        logger.info(f"Scaling deployment {namespace}/{name}")
        try:
            deployment = apps_v1.read_namespaced_deployment(name, namespace)
            original_replicas = deployment.spec.replicas

            # Scale to 0
            deployment.spec.replicas = replicas
            apps_v1.patch_namespaced_deployment_scale(name, namespace, deployment)
            logger.info(f"Scaled {name} to {replicas}")

            # Scale back (would need to wait in production)
            if replicas == 0:
                import time
                time.sleep(10)
                deployment.spec.replicas = original_replicas
                apps_v1.patch_namespaced_deployment_scale(name, namespace, deployment)
                logger.info(f"Scaled {name} back to {original_replicas}")
            return True
        except Exception as e:
            logger.error(f"Error scaling deployment: {e}")
            return False

    # ===================================================================
    # AI Advisor — Phase 1 (advisory only, no execution)
    # ===================================================================

    def _audit(event, **kwargs):
        """Emit a structured JSON line for the audit log. Pure JSON
        (no logger prefix) so the Grafana dashboard's `| json` parser
        can read it directly without regex extraction. The `tag` field
        replaces the old "ai_advisor " text marker.
        Query in Loki: {namespace="auto-remediation"} | json | tag="ai_advisor"
        """
        record = {
            'tag': 'ai_advisor',
            'ts': datetime.now(timezone.utc).isoformat(),
            'event': event,
        }
        record.update(kwargs)
        # print() bypasses the logging formatter so the line is pure
        # JSON; Alloy still scrapes it from container stdout.
        print(json.dumps(record, default=str), flush=True)

    def _load_prompt():
        try:
            with open('/etc/prompts/advisor.md', 'r') as f:
                return f.read()
        except Exception as e:
            logger.error(f"Failed to load advisor prompt: {e}")
            return None

    def _fetch_loki_window(query, start_ts, end_ts, limit=200):
        """Query Loki for a time window. Returns list of (ts, line) tuples
        truncated to `limit` entries total. Best-effort; failures empty."""
        try:
            params = (
                f"query={urllib.parse.quote(query)}"
                f"&start={start_ts}000000000&end={end_ts}000000000"
                f"&limit={limit}&direction=backward"
            )
            url = f"{LOKI_URL}/loki/api/v1/query_range?{params}"
            with urllib.request.urlopen(url, timeout=10) as resp:
                data = json.loads(resp.read())
            entries = []
            for stream in data.get('data', {}).get('result', []):
                for ts, line in stream.get('values', []):
                    entries.append((ts, line[:500]))  # cap line length
            return entries[:limit]
        except Exception as e:
            logger.warning(f"Loki query failed: {e}")
            return []

    # ---- M45 Phase B: CloudWatch Logs context for AWS-side alerts ----

    # boto3 is imported lazily so a missing pip install doesn't crash
    # the controller at startup — the advisor just gracefully skips
    # the CW step.
    _boto3_logs = None
    _boto3_import_attempted = False

    def _get_logs_client():
        global _boto3_logs, _boto3_import_attempted
        if _boto3_logs is not None or _boto3_import_attempted:
            return _boto3_logs
        _boto3_import_attempted = True
        if not os.environ.get('AWS_ACCESS_KEY_ID') or not os.environ.get('AWS_SECRET_ACCESS_KEY'):
            return None
        try:
            import boto3  # type: ignore
            _boto3_logs = boto3.client('logs', region_name=AWS_REGION_PRIMARY)
            return _boto3_logs
        except Exception as e:
            logger.warning(f"boto3 unavailable for CloudWatch Logs: {e}")
            return None

    def _alert_is_aws(alert):
        """Heuristic — does this alert reference an AWS-side resource?
        Returns dict of context hints, or None if not AWS-related."""
        labels = alert.get('labels', {}) or {}
        ann = alert.get('annotations', {}) or {}
        instance = labels.get('instance', '')
        alertname = labels.get('alertname', '')
        # 1) job=external-nodes + location=aws (set in
        #    01-external-scrape-config.yaml relabel rules)
        if labels.get('job') == 'external-nodes' and labels.get('location') == 'aws':
            return {'kind': 'ec2', 'name': labels.get('instance', '?')}
        # 2) instance IP is in the AWS-VPC range (10.10.100.x)
        if instance.startswith(AWS_VPC_CIDR_PREFIX):
            return {'kind': 'ec2', 'name': instance}
        # 3) alertname contains "lambda" — try to pull a function name
        #    from labels.function or annotations.function
        if 'lambda' in alertname.lower() or 'lambda' in (ann.get('summary', '') + ann.get('description', '')).lower():
            return {
                'kind': 'lambda',
                'name': labels.get('function') or labels.get('function_name') or labels.get('functionname') or '?',
            }
        return None

    def _fetch_cloudwatch_logs(aws_hint, start_ts, end_ts, limit=80):
        """Fetch recent CW log events for the resource the alert points
        at. Returns list of (timestamp_ms, message) tuples truncated to
        `limit`. Failures empty + warn."""
        cwlogs = _get_logs_client()
        if not cwlogs:
            return []
        kind = aws_hint.get('kind')
        name = aws_hint.get('name')
        try:
            if kind == 'lambda':
                # /aws/lambda/<name>
                group_prefix = f"/aws/lambda/{name}" if name and name != '?' else "/aws/lambda"
            elif kind == 'ec2':
                # /aws/ec2/<instance-id> OR CloudWatchAgent<...> — try
                # both with prefix discovery.
                group_prefix = "/aws/ec2"
            else:
                return []

            # Discover up to 5 matching log groups under the prefix
            resp = cwlogs.describe_log_groups(logGroupNamePrefix=group_prefix, limit=5)
            groups = [g['logGroupName'] for g in resp.get('logGroups', [])]
            if not groups:
                # Fall back to broader prefix for ec2 (CloudWatchAgent*)
                if kind == 'ec2':
                    resp = cwlogs.describe_log_groups(logGroupNamePrefix='CloudWatchAgent', limit=5)
                    groups = [g['logGroupName'] for g in resp.get('logGroups', [])]
                if not groups:
                    return []

            entries = []
            for gname in groups[:3]:  # cap to 3 groups to keep token cost bounded
                try:
                    flt = cwlogs.filter_log_events(
                        logGroupName=gname,
                        startTime=start_ts * 1000,
                        endTime=end_ts * 1000,
                        limit=max(1, limit // max(len(groups), 1)),
                    )
                    for e in flt.get('events', []):
                        entries.append((e.get('timestamp', 0), e.get('message', '')[:500]))
                except Exception as inner:
                    logger.warning(f"CW Logs filter failed for {gname}: {inner}")
            entries.sort(key=lambda x: -x[0])
            return entries[:limit]
        except Exception as e:
            logger.warning(f"CloudWatch Logs fetch failed: {e}")
            return []

    def _fetch_alert_history(alertname):
        """Query Prometheus for prior fires of this alertname (last 24h)."""
        try:
            q = f'count_over_time(ALERTS{{alertname="{alertname}",alertstate="firing"}}[24h])'
            url = f"{PROMETHEUS_URL}/api/v1/query?query={urllib.parse.quote(q)}"
            with urllib.request.urlopen(url, timeout=5) as resp:
                data = json.loads(resp.read())
            results = data.get('data', {}).get('result', [])
            if results:
                return int(float(results[0].get('value', [0, 0])[1]))
        except Exception as e:
            logger.warning(f"Prometheus query failed: {e}")
        return 0

    def _build_context(alert):
        """Gather context the LLM needs to diagnose this alert."""
        labels = alert.get('labels', {})
        annotations = alert.get('annotations', {})
        namespace = labels.get('namespace')
        pod = labels.get('pod')
        alertname = labels.get('alertname', 'unknown')

        ctx = {
            'alert': {
                'alertname': alertname,
                'labels': labels,
                'annotations': annotations,
                'startsAt': alert.get('startsAt'),
                'status': alert.get('status'),
            },
            'pod_logs': [],
            'loki_window': [],
            'k8s_events': [],
            'history': {},
        }

        # Pod logs if namespace/pod given
        if namespace and pod:
            try:
                logs = v1.read_namespaced_pod_log(
                    name=pod, namespace=namespace,
                    tail_lines=100, timestamps=True,
                )
                ctx['pod_logs'] = logs.splitlines()[-100:]
            except Exception as e:
                ctx['pod_logs_error'] = str(e)

        # Loki window: 5min before, 1min after alert.startsAt by
        # default. Widen to 36h for backup/sync alerts (component=
        # backup OR known-backup alertnames) since backup runs are
        # infrequent — the actual failure may be hours before the
        # staleness alert fires.
        try:
            starts_at = alert.get('startsAt', '')
            if starts_at:
                start_dt = datetime.fromisoformat(starts_at.replace('Z', '+00:00'))
                is_backup_alert = (
                    labels.get('component') == 'backup'
                    or any(kw in alertname.lower() for kw in (
                        'backup', 'sync', 'rclone', 'velero', 'kopia',
                        'barman', 'cnpg', 'unificertsync', 's3sync',
                    ))
                )
                window_min = (60 * 36) if is_backup_alert else 5
                start_ts = int((start_dt - timedelta(minutes=window_min)).timestamp())
                end_ts = int((start_dt + timedelta(minutes=1)).timestamp())
                if namespace and pod:
                    q = '{namespace="%s",pod="%s"}' % (namespace, pod)
                elif namespace:
                    # No pod (typical for CronJob alerts since
                    # Alertmanager only knows the rule name, not the
                    # ephemeral pod). Query the whole namespace.
                    q = '{namespace="%s"}' % namespace
                elif labels.get('component') == 'backup' or is_backup_alert:
                    # No namespace on the alert (some custom-metric
                    # alerts publish only `share=` / `target=` labels).
                    # `component` is a Prometheus alert label, NOT a
                    # Loki log label — querying {component=...} returns
                    # nothing. Map to the actual backup workload
                    # namespaces instead.
                    q = '{namespace=~"backups|velero|rclone|postgres|unifi-cert-sync"}'
                else:
                    # No useful selector — leave loki_window empty
                    # rather than feeding the LLM noise from default ns.
                    q = None
                if q:
                    ctx['loki_window'] = _fetch_loki_window(q, start_ts, end_ts, limit=150)
                else:
                    ctx['loki_window'] = []
                ctx['loki_query_used'] = q or '(none — no usable selector)'
                ctx['loki_window_minutes'] = window_min
        except Exception as e:
            ctx['loki_error'] = str(e)

        # K8s events for the target
        if namespace:
            try:
                events = v1.list_namespaced_event(
                    namespace=namespace,
                    field_selector=(f"involvedObject.name={pod}" if pod else None),
                    limit=30,
                )
                ctx['k8s_events'] = [
                    {'type': e.type, 'reason': e.reason, 'message': e.message, 'lastTimestamp': str(e.last_timestamp)}
                    for e in events.items[-30:]
                ]
            except Exception as e:
                ctx['k8s_events_error'] = str(e)

        # History
        ctx['history']['last_24h_fires'] = _fetch_alert_history(alertname)

        # M45 Phase B: if the alert references an AWS-side resource,
        # pull a CloudWatch Logs window so the LLM sees Lambda /
        # EC2-agent logs alongside on-prem context. Bounded by the
        # same start/end times as the Loki window.
        aws_hint = _alert_is_aws(alert)
        if aws_hint:
            try:
                starts_at = alert.get('startsAt', '')
                if starts_at:
                    start_dt = datetime.fromisoformat(starts_at.replace('Z', '+00:00'))
                    start_ts = int((start_dt - timedelta(minutes=10)).timestamp())
                    end_ts = int((start_dt + timedelta(minutes=1)).timestamp())
                    ctx['cloudwatch'] = {
                        'aws_resource': aws_hint,
                        'window': _fetch_cloudwatch_logs(aws_hint, start_ts, end_ts),
                    }
            except Exception as e:
                ctx['cloudwatch_error'] = str(e)

        return ctx

    def _call_anthropic(system_prompt, user_payload):
        """Call the Anthropic Messages API. Returns (parsed_json, usage_dict)
        or (None, None) on failure."""
        body = json.dumps({
            'model': AI_MODEL,
            'max_tokens': 1024,
            'system': system_prompt,
            'messages': [{'role': 'user', 'content': json.dumps(user_payload, default=str)}],
        }).encode('utf-8')
        req = urllib.request.Request(
            'https://api.anthropic.com/v1/messages',
            data=body, method='POST',
            headers={
                'Content-Type': 'application/json',
                'x-api-key': ANTHROPIC_API_KEY,
                'anthropic-version': '2023-06-01',
            },
        )
        try:
            with urllib.request.urlopen(req, timeout=30) as resp:
                result = json.loads(resp.read())
            content = ''.join(b.get('text', '') for b in result.get('content', []))
            usage = result.get('usage', {})
            # Claude often wraps JSON in ```json fences; strip them.
            if '```' in content:
                start = content.find('{')
                end = content.rfind('}')
                if start >= 0 and end > start:
                    content = content[start:end+1]
            return json.loads(content), usage
        except urllib.error.HTTPError as e:
            logger.error(f"Anthropic API HTTP error: {e.code} {e.read().decode('utf-8', 'ignore')[:500]}")
            return None, None
        except (urllib.error.URLError, TimeoutError) as e:
            logger.error(f"Anthropic API network error: {e}")
            return None, None
        except (json.JSONDecodeError, KeyError) as e:
            logger.error(f"Failed to parse Anthropic response: {e}")
            return None, None

    def _validate_response(parsed):
        """Strip any field outside the schema. Enum-check proposed_action.type."""
        if not isinstance(parsed, dict):
            return None
        # Confidence: coerce safely. Claude has been known to send
        # strings ("high"), None, or omit it entirely; raw min/max
        # crashes the caller and the diagnosis silently disappears.
        try:
            _conf = float(parsed.get('confidence', 0.0) or 0.0)
        except (TypeError, ValueError):
            _conf = 0.0
        clean = {
            'diagnosis': str(parsed.get('diagnosis', ''))[:2000],
            'confidence': max(0.0, min(1.0, _conf)),
            'human_summary': str(parsed.get('human_summary', ''))[:2000],
        }
        action = parsed.get('proposed_action', {}) or {}
        atype = action.get('type', 'noop')
        if atype not in AI_ACTION_TYPES_ALLOWED:
            logger.warning(f"AI proposed_action.type='{atype}' rejected (not in allowlist); coercing to noop")
            atype = 'noop'
        # Validate params for the allowed types; downgrade to noop if malformed
        params = action.get('params', {}) or {}
        if atype in ('restart_pods', 'scale_deployment_temp'):
            ns = params.get('namespace', '')
            if not ns or ns in AI_NAMESPACE_DENYLIST:
                logger.warning(f"AI proposed_action targets denied/empty ns '{ns}'; coercing to noop")
                atype = 'noop'
                params = {}
        clean['proposed_action'] = {
            'type': atype,
            'params': params if atype != 'noop' else {},
            'reasoning': str(action.get('reasoning', ''))[:500],
        }
        return clean

    # ---------- Styled HTML email template (M41 P2 polish) ----------
    # Mirrors the visual language of service-status-report.py — light/dark
    # adaptive CSS variables, max-width 720px, pill components for
    # status, metric grid for stats, "card" surfaces with subtle borders.
    # Kept inline (vs imported helper) so the controller stays a single
    # self-contained script — no extra ConfigMaps to mount.
    _EMAIL_CSS = """
      :root {
        --bg: #f6f7f9; --surface: #ffffff; --text: #0f172a;
        --text-muted: #64748b; --border: #e5e7eb; --border-soft: #eef0f3;
        --ok: #047857; --ok-bg: #ecfdf5;
        --warn: #b45309; --warn-bg: #fffbeb;
        --err: #b91c1c; --err-bg: #fef2f2;
        --info: #1d4ed8; --info-bg: #eff6ff;
        --muted: #6b7280; --muted-bg: #f3f4f6;
        --accent: #1f2937;
        --btn-go: #2d8f4d; --btn-no: #8f2d2d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1220; --surface: #131c2e; --text: #e8eaf0;
          --text-muted: #94a3b8; --border: #243049; --border-soft: #1b2538;
          --ok: #34d399; --ok-bg: rgba(16,185,129,0.12);
          --warn: #fbbf24; --warn-bg: rgba(217,119,6,0.15);
          --err: #f87171; --err-bg: rgba(220,38,38,0.16);
          --info: #93c5fd; --info-bg: rgba(29,78,216,0.18);
          --muted: #94a3b8; --muted-bg: rgba(148,163,184,0.12);
          --accent: #f1f5f9;
        }
      }
      body { margin:0; padding:0; background:var(--bg); color:var(--text);
        font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;
        font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; }
      .wrap { max-width:720px; margin:0 auto; padding:36px 20px 56px; }
      .eyebrow { font-size:11px; font-weight:600; color:var(--text-muted);
        letter-spacing:0.12em; text-transform:uppercase; margin:0 0 10px; }
      h1 { font-size:24px; font-weight:700; letter-spacing:-0.015em;
        margin:0 0 6px; color:var(--accent); }
      .subhead { color:var(--text-muted); font-size:14px; margin:0 0 22px; }
      .pill { display:inline-flex; align-items:center; gap:7px;
        padding:5px 11px; border-radius:999px; font-size:13px;
        font-weight:500; line-height:1; }
      .pill .dot { width:7px; height:7px; border-radius:50%;
        background:currentColor; display:inline-block; }
      .pill-ok { background:var(--ok-bg); color:var(--ok); }
      .pill-warn { background:var(--warn-bg); color:var(--warn); }
      .pill-err { background:var(--err-bg); color:var(--err); }
      .pill-info { background:var(--info-bg); color:var(--info); }
      .pill-muted { background:var(--muted-bg); color:var(--muted); }
      .card { background:var(--surface); border:1px solid var(--border);
        border-radius:12px; padding:20px 22px; margin:0 0 16px; }
      .card-label { font-size:11px; font-weight:600; color:var(--text-muted);
        text-transform:uppercase; letter-spacing:0.08em; margin:0 0 8px; }
      .card-body { font-size:15px; color:var(--text); margin:0;
        word-wrap:break-word; }
      .card-body code { background:var(--muted-bg); padding:2px 6px;
        border-radius:4px; font-size:13px;
        font-family:"SF Mono","Monaco",Menlo,Consolas,monospace; }
      .btn-row { margin:24px 0 8px; }
      .btn { display:inline-block; padding:12px 22px;
        font-weight:600; font-size:14px; border-radius:6px;
        text-decoration:none; margin-right:10px; line-height:1.2; }
      .btn-approve { background:var(--btn-go); color:#fff; }
      .btn-reject { background:var(--btn-no); color:#fff; }
      .meta { display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
        margin:0 0 16px; }
      @media (max-width:520px) { .meta { grid-template-columns:1fr 1fr; } }
      .meta-item { background:var(--surface); border:1px solid var(--border);
        border-radius:8px; padding:10px 12px; }
      .meta-label { font-size:10px; color:var(--text-muted);
        text-transform:uppercase; letter-spacing:0.06em; margin:0 0 4px; }
      .meta-value { font-size:14px; color:var(--accent); font-weight:600;
        font-variant-numeric:tabular-nums; }
      .raw { background:var(--surface); border:1px solid var(--border);
        border-radius:8px; padding:12px;
        font-family:"SF Mono","Monaco",Menlo,Consolas,monospace;
        font-size:11px; line-height:1.45; color:var(--text-muted);
        overflow-x:auto; white-space:pre-wrap; word-wrap:break-word; }
      .footer { margin-top:32px; padding-top:18px;
        border-top:1px solid var(--border-soft);
        font-size:12px; color:var(--text-muted); }
      .footer code { font-family:"SF Mono","Monaco",Menlo,Consolas,monospace; }
    """

    def _confidence_pill(conf):
        if conf >= 0.85:
            cls, label = 'pill-ok', f'High {conf:.0%}'
        elif conf >= 0.6:
            cls, label = 'pill-info', f'Medium {conf:.0%}'
        else:
            cls, label = 'pill-warn', f'Low {conf:.0%}'
        return f'<span class="pill {cls}"><span class="dot"></span>{label}</span>'

    def _render_email(eyebrow, title, subhead, status_pill_html, body_html,
                      action_buttons_html=None, meta_pairs=None, raw_alert=None,
                      footer_extra=None):
        """Build a complete HTML email document with the advisor's styling."""
        parts = []
        parts.append('<!DOCTYPE html>')
        parts.append('<html><head><meta charset="utf-8">')
        parts.append('<meta name="viewport" content="width=device-width,initial-scale=1.0">')
        parts.append('<meta name="color-scheme" content="light dark">')
        parts.append('<meta name="supported-color-schemes" content="light dark">')
        parts.append('<title>' + html_escape(title) + '</title>')
        parts.append('<style>' + _EMAIL_CSS + '</style></head>')
        parts.append('<body><div class="wrap">')
        parts.append('<p class="eyebrow">' + html_escape(eyebrow) + '</p>')
        parts.append('<h1>' + html_escape(title) + '</h1>')
        if subhead:
            parts.append('<p class="subhead">' + html_escape(subhead) + '</p>')
        if status_pill_html:
            parts.append('<div style="margin:0 0 22px">' + status_pill_html + '</div>')
        if action_buttons_html:
            parts.append('<div class="btn-row">' + action_buttons_html + '</div>')
        if meta_pairs:
            parts.append('<div class="meta">')
            for label, value in meta_pairs:
                parts.append(
                    '<div class="meta-item">'
                    '<div class="meta-label">' + html_escape(label) + '</div>'
                    '<div class="meta-value">' + html_escape(str(value)) + '</div>'
                    '</div>')
            parts.append('</div>')
        parts.append(body_html or '')
        if raw_alert is not None:
            parts.append(
                '<div class="card">'
                '<div class="card-label">Raw alert payload</div>'
                '<div class="raw">' + html_escape(json.dumps(raw_alert, indent=2, default=str)[:2500]) + '</div>'
                '</div>'
            )
        parts.append('<div class="footer">')
        if footer_extra:
            parts.append(footer_extra + ' &middot; ')
        parts.append(
            'Audit log: <code>kubectl -n auto-remediation logs deploy/remediation-controller | grep ai_advisor</code>'
        )
        parts.append('</div></div></body></html>')
        return ''.join(parts)

    def _send_email(subject, body, html_body=None):
        """Send via SMTP using the same SES creds as alertmanager.
        If html_body provided, sends as multipart text+html."""
        if not (SMTP_USER and SMTP_PASS):
            logger.warning("SMTP creds not configured; skipping email send")
            return False
        try:
            if html_body:
                msg = MIMEMultipart('alternative')
                msg['Subject'] = subject
                msg['From'] = EMAIL_FROM
                msg['To'] = EMAIL_TO
                msg.attach(MIMEText(body, 'plain'))
                msg.attach(MIMEText(html_body, 'html'))
            else:
                msg = EmailMessage()
                msg['Subject'] = subject
                msg['From'] = EMAIL_FROM
                msg['To'] = EMAIL_TO
                msg.set_content(body)
            ctx = ssl.create_default_context()
            with smtplib.SMTP(SMTP_HOST, SMTP_PORT, timeout=20) as s:
                s.starttls(context=ctx)
                s.login(SMTP_USER, SMTP_PASS)
                s.send_message(msg)
            return True
        except Exception as e:
            logger.error(f"Email send failed: {e}")
            return False

    # ---- Phase 2: approval token + pending proposals ----

    def _sign(proposal_id):
        """HMAC-SHA256 sign a proposal_id. Returns base64url string."""
        if not APPROVAL_HMAC_KEY:
            return ''
        sig = hmac.new(APPROVAL_HMAC_KEY.encode(), proposal_id.encode(), hashlib.sha256).digest()
        return base64.urlsafe_b64encode(sig).rstrip(b'=').decode()

    def _verify(proposal_id, token):
        """Constant-time compare of provided token vs expected."""
        expected = _sign(proposal_id)
        if not expected or not token:
            return False
        return hmac.compare_digest(expected, token)

    def _new_proposal_id():
        """96-bit (12-byte) random id, base64url-encoded → 16 chars.
        Used as both _pending_proposals key and HMAC input."""
        return base64.urlsafe_b64encode(os.urandom(12)).rstrip(b'=').decode()

    def _gc_pending():
        """Drop expired proposals from the pending map."""
        now = datetime.now(timezone.utc)
        cutoff = now - timedelta(hours=APPROVAL_TTL_HOURS)
        expired = [k for k, v in _pending_proposals.items() if v['ts'] < cutoff]
        for k in expired:
            del _pending_proposals[k]
        return len(expired)

    def _store_proposal(proposal_id, alert, clean):
        """Stash a proposal for later approval."""
        _gc_pending()
        _pending_proposals[proposal_id] = {
            'ts': datetime.now(timezone.utc),
            'alert': alert,
            'proposal': clean,
        }

    def _execute_proposal(proposal):
        """Run the action specified in a stored proposal. Returns
        (success_bool, message_str)."""
        action = proposal['proposed_action']
        atype = action.get('type', 'noop')
        params = action.get('params', {}) or {}
        if atype == 'noop':
            return True, 'noop (no action taken)'
        if atype == 'restart_pods':
            ns = params.get('namespace', '')
            sel = params.get('selector', '')
            if not (ns and sel):
                return False, 'missing namespace/selector'
            if ns in AI_NAMESPACE_DENYLIST:
                return False, f'namespace {ns} in denylist'
            ok = restart_pods(ns, sel)
            return ok, f'restart_pods ns={ns} selector={sel}'
        if atype == 'scale_deployment_temp':
            ns = params.get('namespace', '')
            name = params.get('deployment', '')
            if not (ns and name):
                return False, 'missing namespace/deployment'
            if ns in AI_NAMESPACE_DENYLIST:
                return False, f'namespace {ns} in denylist'
            ok = scale_deployment(ns, name)
            return ok, f'scale_deployment_temp ns={ns} deploy={name}'
        return False, f'unknown action type {atype}'

    def _advise(alert):
        """Top-level: fetch context, call Claude, email diagnosis. Bounded
        by daily cost cap + cooldown."""
        alert_name = alert.get('labels', {}).get('alertname', 'unknown')

        if not AI_ENABLED:
            return
        if not ANTHROPIC_API_KEY:
            logger.warning(f"AI advisor enabled but ANTHROPIC_API_KEY empty — skipping {alert_name}")
            return
        if alert_name in AI_IGNORE_ALERTS:
            _audit('skipped_noisy', alertname=alert_name)
            return
        if is_cooldown_active(alert_name):
            return
        if _cap_reached():
            _audit('cap_reached', alertname=alert_name, daily_usd_spent=_cost_tracker['usd_spent'])
            _cap_text = (
                f"AI advisor hit its ${AI_DAILY_USD_CAP}/day cost cap. "
                f"Raw alert below.\n\n{json.dumps(alert, indent=2, default=str)}"
            )
            _cap_html = _render_email(
                eyebrow='AI Advisor &middot; Unavailable',
                title=alert_name,
                subhead=f"Daily cost cap of ${AI_DAILY_USD_CAP} reached. Diagnosis skipped.",
                status_pill_html='<span class="pill pill-warn"><span class="dot"></span>Cap reached</span>',
                body_html=(
                    '<div class="card"><div class="card-label">What this means</div>'
                    '<p class="card-body">The advisor has spent its daily budget. Further '
                    'alerts in the next ' + str(int((86400 - (datetime.now(timezone.utc) - datetime.combine(_today_utc(), datetime.min.time(), tzinfo=timezone.utc)).total_seconds()) / 3600)) + 'h will fall through to this notice with the raw payload only. '
                    'Resets at UTC midnight. To raise the cap, edit '
                    '<code>AI_ADVISOR_DAILY_COST_USD_CAP</code> in the deployment.</p></div>'
                ),
                meta_pairs=[
                    ('Spent today', f"${_cost_tracker['usd_spent']:.4f}"),
                    ('Cap', f"${AI_DAILY_USD_CAP}"),
                    ('Resets', 'UTC midnight'),
                ],
                raw_alert=alert,
                footer_extra='Cooldown enforced &mdash; same alertname will not re-notify for 15min',
            )
            _send_email(
                subject=f"[Etherport AI Advisor: unavailable] {alert_name}",
                body=_cap_text,
                html_body=_cap_html,
            )
            # Enter cooldown so flapping alertnames at AM repeat_interval
            # don't spam "[unavailable]" emails every 5min for the rest
            # of the day (caught in the 2026-05-24 code review).
            recent_actions[alert_name] = datetime.now()
            return

        prompt = _load_prompt()
        if not prompt:
            return

        _audit('start', alertname=alert_name)
        ctx = _build_context(alert)
        parsed, usage = _call_anthropic(prompt, ctx)

        if parsed is None:
            _audit('api_failed', alertname=alert_name)
            _err_text = (
                f"AI advisor API call failed for {alert_name}. Raw alert below.\n\n"
                f"{json.dumps(alert, indent=2, default=str)}"
            )
            _err_html = _render_email(
                eyebrow='AI Advisor &middot; Error',
                title=alert_name,
                subhead='Anthropic API call failed. The alert is shown raw below.',
                status_pill_html='<span class="pill pill-err"><span class="dot"></span>API error</span>',
                body_html=(
                    '<div class="card"><div class="card-label">What happened</div>'
                    '<p class="card-body">The advisor reached '
                    '<code>api.anthropic.com</code> but the response was unusable '
                    '(network error, HTTP non-2xx, or malformed JSON). Check the '
                    'controller logs for the exact reason. The static rule-based '
                    'path is unaffected.</p></div>'
                ),
                raw_alert=alert,
                footer_extra='Cooldown enforced &mdash; same alertname will not re-notify for 15min',
            )
            _send_email(
                subject=f"[Etherport AI Advisor: error] {alert_name}",
                body=_err_text,
                html_body=_err_html,
            )
            # Cooldown: don't spam "[advisor error]" mails if Anthropic
            # is having an outage and AM keeps re-firing the alert.
            recent_actions[alert_name] = datetime.now()
            return

        clean = _validate_response(parsed)
        if clean is None:
            _audit('invalid_response', alertname=alert_name, raw=str(parsed)[:500])
            return

        cost = _add_cost(usage.get('input_tokens', 0), usage.get('output_tokens', 0))
        _audit(
            'success',
            alertname=alert_name,
            confidence=clean['confidence'],
            proposed_action_type=clean['proposed_action']['type'],
            input_tokens=usage.get('input_tokens'),
            output_tokens=usage.get('output_tokens'),
            cost_usd=round(cost, 4),
            daily_usd_spent=round(_cost_tracker['usd_spent'], 4),
        )

        # ---- Phase 3: autonomous execution (gated per-alert) ----
        # If this alert is explicitly opted in via Alertmanager label
        # `ai_remediation: "auto"` AND the kill switch is on AND
        # confidence + action + namespace all clear the guardrails,
        # execute now without waiting for human approval. Emails a
        # receipt after the fact (not before).
        labels = alert.get('labels', {}) or {}
        action_info = clean['proposed_action']
        atype = action_info.get('type', 'noop')
        params = action_info.get('params', {}) or {}
        ns = params.get('namespace', '')
        auto_ok = (
            AI_PHASE3_ENABLED
            and labels.get('ai_remediation', '').lower() == 'auto'
            and atype in {'restart_pods', 'scale_deployment_temp'}
            and ns and ns not in AI_NAMESPACE_DENYLIST
            and float(clean.get('confidence', 0.0)) >= AI_PHASE3_CONFIDENCE_THRESHOLD
        )
        if auto_ok:
            ok, msg = _execute_proposal(clean)
            _audit(
                'auto_executed' if ok else 'auto_execute_failed',
                alertname=alert_name,
                action_type=atype,
                confidence=clean['confidence'],
                result_msg=msg,
            )
            # Cooldown on BOTH success and failure — a flapping
            # auto-execute failure (e.g. K8s API hiccup) shouldn't
            # re-burn LLM budget on every AM repeat (4h default).
            # Caught in 2026-05-24 code review.
            recent_actions[alert_name] = datetime.now()
            _exec_text = (
                f"AI advisor AUTO-EXECUTED an action for {alert_name}.\n\n"
                f"Action: {atype} {json.dumps(params)}\n"
                f"Confidence: {clean['confidence']:.2f}\n"
                f"Result: {'OK' if ok else 'FAILED'} — {msg}\n\n"
                f"Diagnosis: {clean['diagnosis']}\n\n"
                f"This alert was opted into Phase 3 autonomous execution via "
                f"the `ai_remediation: auto` label. To revert this alert to "
                f"Phase 2 (approve-by-click) behavior, remove that label "
                f"from the alert rule. To revert ALL alerts globally, set "
                f"AI_PHASE3_ENABLED=false in the controller deployment.\n\n"
                f"Raw alert payload:\n{json.dumps(alert, indent=2, default=str)[:2000]}"
            )
            _exec_html = _render_email(
                eyebrow='AI Advisor &middot; Auto-executed' if ok else 'AI Advisor &middot; Auto-execute FAILED',
                title=alert_name,
                subhead=clean['human_summary'],
                status_pill_html=(
                    '<span class="pill pill-ok"><span class="dot"></span>Auto-executed</span>'
                    if ok else
                    '<span class="pill pill-err"><span class="dot"></span>Auto-execute failed</span>'
                ),
                body_html=(
                    '<div class="card"><div class="card-label">Action taken</div>'
                    '<p class="card-body"><code>' + html_escape(atype) + '</code> &mdash; '
                    '<code>' + html_escape(json.dumps(params)) + '</code><br>'
                    'Result: <b>' + ('OK' if ok else 'FAILED') + '</b> &mdash; '
                    + html_escape(msg) + '</p></div>'
                    '<div class="card"><div class="card-label">Why</div>'
                    '<p class="card-body">' + html_escape(clean['diagnosis']) + '</p></div>'
                    '<p style="color:var(--text-muted);font-size:13px">'
                    'To revert to per-action approval for this alert, remove '
                    '<code>ai_remediation: "auto"</code> from its PrometheusRule label set.</p>'
                ),
                meta_pairs=[
                    ('Confidence', f"{clean['confidence']:.0%}"),
                    ('Action', atype),
                    ('Daily spend', f"${_cost_tracker['usd_spent']:.4f} / ${AI_DAILY_USD_CAP}"),
                ],
                raw_alert=alert,
                footer_extra='Phase 3 autonomous &mdash; receipt only, no approval needed',
            )
            _send_email(
                subject=f"[Etherport AI Advisor: AUTO-{atype}] {alert_name}",
                body=_exec_text,
                html_body=_exec_html,
            )
            return  # Phase 3 done; skip Phase 2 email path

        # Build email. Phase 2 adds Approve/Reject buttons when:
        #   - Phase 2 toggle is enabled
        #   - Proposed action is executable (not noop)
        #   - HMAC + base URL are configured
        action_info = clean['proposed_action']
        action_block = (
            f"Proposed action: {action_info['type']}\n"
            + (f"Target: {action_info['params']}\n" if action_info['type'] != 'noop' else "")
            + f"Reasoning: {action_info['reasoning']}\n"
        )

        approve_url = ''
        reject_url = ''
        proposal_id = ''
        if (AI_PHASE2_ENABLED and APPROVAL_HMAC_KEY and APPROVAL_BASE_URL
                and action_info['type'] != 'noop'):
            proposal_id = _new_proposal_id()
            _store_proposal(proposal_id, alert, clean)
            token = _sign(proposal_id)
            base = APPROVAL_BASE_URL.rstrip('/')
            approve_url = f"{base}/approve?id={proposal_id}&token={token}&decision=approve"
            reject_url = f"{base}/approve?id={proposal_id}&token={token}&decision=reject"

        # Plain-text body (always present)
        body = (
            f"{clean['human_summary']}\n\n"
            f"---\n"
            f"Diagnosis: {clean['diagnosis']}\n"
            f"Confidence: {clean['confidence']:.2f}\n\n"
            f"{action_block}\n"
        )
        if approve_url:
            body += (
                f"---\n"
                f"To EXECUTE this action, open: {approve_url}\n"
                f"To REJECT (mark false-positive), open: {reject_url}\n"
                f"Links expire in {APPROVAL_TTL_HOURS}h.\n\n"
            )
        else:
            body += (
                f"---\n"
                f"Phase 1 mode (no execute link). To execute manually, do so\n"
                f"yourself (or add a static rule in\n"
                f"platform/kubernetes/auto-remediation/configmap.yaml).\n\n"
            )
        body += (
            f"Daily spend: ${_cost_tracker['usd_spent']:.4f} of ${AI_DAILY_USD_CAP} cap.\n"
            f"Audit: kubectl -n auto-remediation logs deploy/remediation-controller | grep ai_advisor\n\n"
            f"---\n"
            f"Raw alert payload:\n{json.dumps(alert, indent=2, default=str)[:2000]}\n"
        )

        # Styled HTML email — _render_email handles layout; we just
        # build the body sections.
        action_type = action_info['type']
        if approve_url:
            buttons = (
                '<a href="' + html_escape(approve_url) + '" class="btn btn-approve">Approve + Execute</a>'
                '<a href="' + html_escape(reject_url) + '" class="btn btn-reject">Reject</a>'
            )
        else:
            buttons = None

        _body_blocks = []
        _body_blocks.append(
            '<div class="card"><div class="card-label">AI Diagnosis</div>'
            '<p class="card-body">' + html_escape(clean['diagnosis']) + '</p></div>'
        )
        _action_card = (
            '<div class="card"><div class="card-label">Proposed Action</div>'
            '<p class="card-body"><code>' + html_escape(action_type) + '</code>'
        )
        if action_type != 'noop':
            _action_card += (
                ' &mdash; <code>' + html_escape(json.dumps(action_info['params'])) + '</code>'
            )
        _action_card += (
            '<br><span style="color:var(--text-muted);font-size:14px">'
            + html_escape(action_info['reasoning']) + '</span></p></div>'
        )
        _body_blocks.append(_action_card)
        if approve_url:
            _body_blocks.append(
                '<p style="color:var(--text-muted);font-size:13px;margin:-4px 0 16px">'
                'Approval links are Tailscale-only and expire in ' + str(APPROVAL_TTL_HOURS) + 'h.'
                '</p>'
            )

        _eyebrow = 'AI Advisor &middot; ' + ('Action proposed' if action_type != 'noop' else 'Diagnosis only')
        _subhead = clean['human_summary']
        _meta = [
            ('Confidence', f"{clean['confidence']:.0%}"),
            ('Proposed action', action_type),
            ('Daily spend', f"${_cost_tracker['usd_spent']:.4f} / ${AI_DAILY_USD_CAP}"),
        ]
        html_body = _render_email(
            eyebrow=_eyebrow,
            title=alert_name,
            subhead=_subhead,
            status_pill_html=_confidence_pill(clean['confidence']),
            body_html=''.join(_body_blocks),
            action_buttons_html=buttons,
            meta_pairs=_meta,
            raw_alert=alert,
            footer_extra=(
                'Phase 2 enabled' if approve_url
                else 'Phase 1 (advisory only) &mdash; execute manually if needed'
            ),
        )

        _send_email(
            subject=f"[AI advisor: {clean['proposed_action']['type']}] {alert_name}",
            body=body,
            html_body=html_body,
        )
        # Phase 1 records the action in cooldown to prevent repeat
        # diagnoses of the same flap. Phase 2/3 would execute and
        # then cool down; here we cool down on advice given.
        recent_actions[alert_name] = datetime.now()

    # ===================================================================
    # Webhook (unchanged for rule-matched alerts; advisor on miss)
    # ===================================================================
    class AlertWebhook(BaseHTTPRequestHandler):
        def do_GET(self):
            """Phase 2 approval endpoint. URL:
               /approve?id=<proposal_id>&token=<HMAC>&decision=approve|reject
            Anything else 404s. No HTML form, no cookies; just GET the link."""
            if not self.path.startswith('/approve'):
                self.send_response(404)
                self.end_headers()
                return

            parsed = urllib.parse.urlparse(self.path)
            qs = urllib.parse.parse_qs(parsed.query)
            pid = (qs.get('id', [''])[0] or '').strip()
            tok = (qs.get('token', [''])[0] or '').strip()
            # Default to reject on missing/malformed decision — safer fail-mode.
            decision = (qs.get('decision', ['reject'])[0] or 'reject').strip().lower()

            def html_response(code, title, body, pill_class='pill-info', pill_text=None):
                """Styled confirmation page rendered via _render_email so
                the in-browser approval result matches email visual language."""
                self.send_response(code)
                self.send_header('Content-Type', 'text/html; charset=utf-8')
                self.end_headers()
                pill_html = ''
                if pill_text:
                    pill_html = (
                        '<span class="pill ' + pill_class + '">'
                        '<span class="dot"></span>' + html_escape(pill_text) + '</span>'
                    )
                page = _render_email(
                    eyebrow='AI Advisor &middot; Approval result',
                    title=title,
                    subhead=body,
                    status_pill_html=pill_html,
                    body_html='',
                    footer_extra=None,
                )
                self.wfile.write(page.encode())

            if not (pid and tok):
                html_response(400, "Bad request", "Missing id or token in URL.",
                              pill_class='pill-err', pill_text='400')
                return
            if not _verify(pid, tok):
                _audit('approve_bad_token', proposal_id=pid)
                html_response(403, "Invalid or expired token",
                              "Token verification failed. The link may have been corrupted or signed with a different HMAC key.",
                              pill_class='pill-err', pill_text='403 forbidden')
                return
            entry = _pending_proposals.get(pid)
            if not entry:
                _audit('approve_not_found', proposal_id=pid)
                html_response(410, "Proposal expired",
                              f"This proposal has expired or the controller restarted since the email was sent (TTL {APPROVAL_TTL_HOURS}h).",
                              pill_class='pill-muted', pill_text='Expired')
                return

            alertname = entry['alert'].get('labels', {}).get('alertname', '?')
            atype = entry['proposal']['proposed_action'].get('type', '?')

            if decision == 'reject':
                _audit('rejected', proposal_id=pid, alertname=alertname, action_type=atype)
                del _pending_proposals[pid]
                html_response(200, f"Rejected: {alertname}",
                              "Marked as false positive. No action taken. Same alertname will not re-notify for 15min.",
                              pill_class='pill-muted', pill_text='Rejected')
                return

            # Approve path
            ok, msg = _execute_proposal(entry['proposal'])
            _audit(
                'approved_executed' if ok else 'approved_failed',
                proposal_id=pid, alertname=alertname, action_type=atype, result_msg=msg,
            )
            if ok:
                recent_actions[alertname] = datetime.now()
            del _pending_proposals[pid]
            if ok:
                html_response(200, f"Executed: {alertname}",
                              f"{atype} dispatched successfully. {msg}",
                              pill_class='pill-ok', pill_text='Executed')
            else:
                html_response(500, f"Execution failed: {alertname}",
                              msg,
                              pill_class='pill-err', pill_text='Failed')

        def do_POST(self):
            """Handle incoming Prometheus alerts"""
            content_length = int(self.headers['Content-Length'])
            post_data = self.rfile.read(content_length)

            try:
                alert_data = json.loads(post_data)
                logger.info(f"Received alert: {json.dumps(alert_data, indent=2)}")

                # Process each alert
                for alert in alert_data.get('alerts', []):
                    alert_name = alert.get('labels', {}).get('alertname')
                    status = alert.get('status')

                    if status != 'firing':
                        continue

                    if alert_name in RULES:
                        if is_cooldown_active(alert_name):
                            continue

                        rule = RULES[alert_name]
                        action = rule.get('action')
                        namespace = rule.get('namespace') or alert.get('labels', {}).get('namespace')
                        selector = rule.get('selector')

                        logger.info(f"Taking action for {alert_name}: {rule.get('description')}")

                        success = False
                        if action == 'restart_pods' and namespace and selector:
                            success = restart_pods(namespace, selector)
                        elif action == 'scale_deployment':
                            deployment_name = alert.get('labels', {}).get('deployment')
                            if deployment_name and namespace:
                                success = scale_deployment(namespace, deployment_name)

                        if success:
                            recent_actions[alert_name] = datetime.now()
                    else:
                        # No rule — hand off to AI advisor (Phase 1, advisory only)
                        _advise(alert)

                self.send_response(200)
                self.send_header('Content-type', 'application/json')
                self.end_headers()
                self.wfile.write(json.dumps({"status": "ok"}).encode())

            except Exception as e:
                logger.error(f"Error processing alert: {e}")
                self.send_response(500)
                self.end_headers()

        def log_message(self, format, *args):
            """Suppress default logging"""
            pass

    if __name__ == '__main__':
        PORT = 8080
        server = HTTPServer(('', PORT), AlertWebhook)
        # Single-threaded HTTPServer (intentional — keeps the
        # _pending_proposals dict TOCTOU-free). Downside: a 30s
        # Anthropic call blocks /approve clicks + incoming webhooks
        # until it completes. Acceptable at homelab alert volumes.
        _phase2_ready = AI_PHASE2_ENABLED and bool(APPROVAL_HMAC_KEY) and bool(APPROVAL_BASE_URL)
        logger.info(
            f"Auto-remediation webhook server listening on port {PORT} "
            f"(ai_advisor={'on' if AI_ENABLED else 'off'}, "
            f"phase2={'ready' if _phase2_ready else ('toggled but unconfigured' if AI_PHASE2_ENABLED else 'off')}, "
            f"phase3={'on (opt-in via alert label)' if AI_PHASE3_ENABLED else 'off'}, "
            f"daily_cap=${AI_DAILY_USD_CAP}, model={AI_MODEL})"
        )
        server.serve_forever()
