    def _confidence_pill(conf):
        if conf >= 0.85:
            cls, label = 'pill-ok', f'High {conf:.0%}'
        elif conf >= 0.6:
            cls, label = 'pill-info', f'Medium {conf:.0%}'
        else:
            cls, label = 'pill-warn', f'Low {conf:.0%}'
        return f'<span class="pill {cls}"><span class="dot"></span>{label}</span>'

    def _render_email(eyebrow, title, subhead, status_pill_html, body_html,
                      action_buttons_html=None, meta_pairs=None, raw_alert=None,
                      footer_extra=None):
        """Build a complete HTML email document with the advisor's styling."""
        parts = []
        parts.append('<!DOCTYPE html>')
        parts.append('<html><head><meta charset="utf-8">')
        parts.append('<meta name="viewport" content="width=device-width,initial-scale=1.0">')
        parts.append('<meta name="color-scheme" content="light dark">')
        parts.append('<meta name="supported-color-schemes" content="light dark">')
        parts.append('<title>' + html_escape(title) + '</title>')
        parts.append('<style>' + _EMAIL_CSS + '</style></head>')
        parts.append('<body><div class="wrap">')
        parts.append('<p class="eyebrow">' + html_escape(eyebrow) + '</p>')
        parts.append('<h1>' + html_escape(title) + '</h1>')
        if subhead:
            parts.append('<p class="subhead">' + html_escape(subhead) + '</p>')
        if status_pill_html:
            parts.append('<div style="margin:0 0 22px">' + status_pill_html + '</div>')
        if action_buttons_html:
            parts.append('<div class="btn-row">' + action_buttons_html + '</div>')
        if meta_pairs:
            parts.append('<div class="meta">')
            for label, value in meta_pairs:
                parts.append(
                    '<div class="meta-item">'
                    '<div class="meta-label">' + html_escape(label) + '</div>'
                    '<div class="meta-value">' + html_escape(str(value)) + '</div>'
                    '</div>')
            parts.append('</div>')
        parts.append(body_html or '')
        if raw_alert is not None:
            parts.append(
                '<div class="card">'
                '<div class="card-label">Raw alert payload</div>'
                '<div class="raw">' + html_escape(json.dumps(raw_alert, indent=2, default=str)[:2500]) + '</div>'
                '</div>'
            )
        parts.append('<div class="footer">')
        if footer_extra:
            parts.append(footer_extra + ' &middot; ')
        parts.append(
            'Audit log: <code>kubectl -n auto-remediation logs deploy/remediation-controller | grep ai_advisor</code>'
        )
        parts.append('</div></div></body></html>')
        return ''.join(parts)

    def _send_email(subject, body, html_body=None):
        """Send via the SES API (boto3) using the pod's IRSA role — no static SMTP
        creds (M75 / email-transport consolidation). If html_body provided, sends as
        multipart text+html via SendRawEmail (preserves the approve-button HTML)."""
        try:
            if html_body:
                msg = MIMEMultipart('alternative')
                msg['Subject'] = subject
                msg['From'] = EMAIL_FROM
                msg['To'] = EMAIL_TO
                msg.attach(MIMEText(body, 'plain'))
                msg.attach(MIMEText(html_body, 'html'))
            else:
                msg = EmailMessage()
                msg['Subject'] = subject
                msg['From'] = EMAIL_FROM
                msg['To'] = EMAIL_TO
                msg.set_content(body)
            import boto3  # type: ignore
            ses = boto3.client('ses', region_name=AWS_REGION_PRIMARY)
            ses.send_raw_email(
                Source=EMAIL_FROM,
                Destinations=[EMAIL_TO],
                RawMessage={'Data': msg.as_string()},
            )
            return True
        except Exception as e:
            logger.error(f"Email send failed: {e}")
            return False

    # ---- Phase 2: approval token + pending proposals ----

    def _sign(proposal_id):
        """HMAC-SHA256 sign a proposal_id. Returns base64url string."""
        if not APPROVAL_HMAC_KEY:
            return ''
        sig = hmac.new(APPROVAL_HMAC_KEY.encode(), proposal_id.encode(), hashlib.sha256).digest()
        return base64.urlsafe_b64encode(sig).rstrip(b'=').decode()

    def _verify(proposal_id, token):
        """Constant-time compare of provided token vs expected."""
        expected = _sign(proposal_id)
        if not expected or not token:
            return False
        return hmac.compare_digest(expected, token)

    def _new_proposal_id():
        """96-bit (12-byte) random id, base64url-encoded → 16 chars.
        Used as both _pending_proposals key and HMAC input."""
        return base64.urlsafe_b64encode(os.urandom(12)).rstrip(b'=').decode()

    def _gc_pending():
        """Drop expired proposals from the pending map."""
        now = datetime.now(timezone.utc)
        cutoff = now - timedelta(hours=APPROVAL_TTL_HOURS)
        expired = [k for k, v in _pending_proposals.items() if v['ts'] < cutoff]
        for k in expired:
            del _pending_proposals[k]
        return len(expired)

    def _store_proposal(proposal_id, alert, clean):
        """Stash a proposal for later approval."""
        _gc_pending()
        # Stash alertname inside the proposal so _execute_proposal can
        # query it for the frequency-cap check without re-walking the
        # full alert payload.
        clean['_alertname_for_cap'] = alert.get('labels', {}).get('alertname', '')
        _pending_proposals[proposal_id] = {
            'ts': datetime.now(timezone.utc),
            'alert': alert,
            'proposal': clean,
        }

    def _count_recent_executions(alertname, action_type, hours=24):
        """Count successful executions of (alertname, action_type) in the
        last <hours> via Loki audit search. Used to enforce per-action
        daily caps and prevent runaway loops. Returns int (0 on any error
        — fail-open so a Loki outage doesn't block legitimate remediation)."""
        try:
            q = (f'{{namespace="auto-remediation"}} | json | tag="ai_advisor" '
                 f'| alertname="{alertname}" '
                 f'| action_type="{action_type}" '
                 f'| event=~"auto_executed|approved_executed"')
            now_ns = int(datetime.now(timezone.utc).timestamp() * 1_000_000_000)
            start_ns = now_ns - hours * 3600 * 1_000_000_000
            params = urllib.parse.urlencode({
                'query': q,
                'start': str(start_ns),
                'end': str(now_ns),
                'limit': '100',
                'direction': 'backward',
            })
            url = f"{LOKI_URL}/loki/api/v1/query_range?{params}"
            with urllib.request.urlopen(url, timeout=5) as resp:
                data = json.loads(resp.read())
            n = 0
            for stream in data.get('data', {}).get('result', []):
                n += len(stream.get('values', []))
            return n
        except Exception as e:
            logger.warning(f"_count_recent_executions Loki query failed for "
                           f"{alertname}/{action_type}: {e} — failing open (count=0)")
            return 0

    def _within_frequency_cap(alertname, action_type):
        """Per-action daily cap check. Returns (allowed_bool, message_str)."""
        if action_type == 'noop':
            return True, ''
        cap = AI_ACTION_DAILY_LIMITS.get(action_type, AI_ACTION_DAILY_LIMIT_DEFAULT)
        recent = _count_recent_executions(alertname, action_type)
        if recent >= cap:
            return False, (
                f"frequency cap hit: {action_type} for {alertname} executed "
                f"{recent} times in last 24h (cap={cap}). Repeated execution "
                f"isn't fixing the underlying issue — operator review needed."
            )
        return True, ''

    def _count_verification_failures(alertname, action_type, days=7):
        """Count verification_failed events for (alertname, action_type) in
        the last <days>. Used by _dynamic_threshold to self-tune Phase 3
        confidence requirements upward after observed repeat failures.
        Fail-open: returns 0 on Loki errors so observability outages don't
        artificially relax the gate."""
        try:
            q = (f'{{namespace="auto-remediation"}} | json | tag="ai_advisor" '
                 f'| alertname="{alertname}" '
                 f'| action_type="{action_type}" '
                 f'| event="verification_failed"')
            now_ns = int(datetime.now(timezone.utc).timestamp() * 1_000_000_000)
            start_ns = now_ns - days * 86400 * 1_000_000_000
            params = urllib.parse.urlencode({
                'query': q,
                'start': str(start_ns),
                'end': str(now_ns),
                'limit': '50',
                'direction': 'backward',
            })
            url = f"{LOKI_URL}/loki/api/v1/query_range?{params}"
            with urllib.request.urlopen(url, timeout=5) as resp:
                data = json.loads(resp.read())
            n = 0
            for stream in data.get('data', {}).get('result', []):
                n += len(stream.get('values', []))
            return n
        except Exception as e:
            logger.warning(f"_count_verification_failures query failed for "
                           f"{alertname}/{action_type}: {e} — failing open (count=0)")
            return 0

    def _dynamic_threshold(alertname, action_type, base_threshold):
        """Compute effective Phase 3 confidence threshold, self-tuned by
        recent verification failures. Each recent failure raises the bar
        by 0.05 (capped at 3 failures = +0.15). The result never exceeds
        0.99 (otherwise an alert pattern could become impossible to
        auto-fix even when an operator wants it). Audit-logs every bump
        so we can observe + tune in Grafana."""
        failures = _count_verification_failures(alertname, action_type)
        if failures == 0:
            return base_threshold
        bump = 0.05 * min(failures, 3)
        effective = min(base_threshold + bump, 0.99)
        if effective > base_threshold:
            _audit(
                'dynamic_threshold_applied',
                alertname=alertname,
                action_type=action_type,
                base_threshold=base_threshold,
                effective_threshold=round(effective, 2),
                recent_failures=failures,
            )
        return effective

    def _execute_proposal(proposal):
        """Run the action specified in a stored proposal. Returns
        (success_bool, message_str). _validate_response has already
        enforced required-params + denylist; this is the dispatch layer.
        Per-action daily-cap check happens before dispatch."""
        action = proposal['proposed_action']
        atype = action.get('type', 'noop')
        params = action.get('params', {}) or {}
        # Need alertname for the cap check — proposals carry it as a sibling
        # field set by _advise() before calling _store_proposal.
        alertname = proposal.get('_alertname_for_cap', '')

        if atype == 'noop':
            return True, 'noop (no action taken)'

        # Frequency cap — prevent runaway loops on alerts that keep firing.
        if alertname:
            ok_cap, cap_msg = _within_frequency_cap(alertname, atype)
            if not ok_cap:
                _audit('frequency_cap_hit', alertname=alertname, action_type=atype,
                       reason=cap_msg)
                return False, cap_msg

        # Original actions (kept for backwards compat)
        if atype == 'restart_pods':
            ok = restart_pods(params['namespace'], params['selector'])
            return ok, f"restart_pods ns={params['namespace']} sel={params['selector']}"
        if atype == 'scale_deployment_temp':
            ok = scale_deployment(params['namespace'], params['deployment'])
            return ok, f"scale_deployment_temp ns={params['namespace']} deploy={params['deployment']}"

        # Tier 1 — autonomous-eligible
        if atype == 'delete_completed_jobs':
            return delete_completed_jobs(
                params['namespace'],
                label_selector=params.get('label_selector', ''),
                older_than_hours=int(params.get('older_than_hours', 6)),
            )
        if atype == 'delete_evicted_pods':
            return delete_evicted_pods(params['namespace'])
        if atype == 'trigger_velero_backup_now':
            return trigger_velero_backup_now(params['schedule_name'])
        if atype == 'trigger_cnpg_backup_now':
            return trigger_cnpg_backup_now(
                params['cluster_name'],
                namespace=params.get('namespace', 'postgres'),
            )
        if atype == 'force_cert_renewal':
            return force_cert_renewal(params['namespace'], params['cert_name'])
        if atype == 'silence_alert_temporarily':
            return silence_alert_temporarily(
                params['alertname'],
                hours=int(params.get('hours', 2)),
                comment=params.get('comment', 'ai-advisor temporary silence'),
            )

        # Tier 2 — approve-via-email only
        if atype == 'rollout_restart':
            return rollout_restart(
                params['namespace'], params['name'],
                kind=params.get('kind', 'deployment'),
            )
        if atype == 'expand_pvc':
            return expand_pvc(
                params['namespace'], params['pvc_name'],
                percent=int(params.get('percent', 25)),
            )
        if atype == 'pause_cronjob':
            return pause_cronjob(params['namespace'], params['name'])
        if atype == 'unpause_cronjob':
            return unpause_cronjob(params['namespace'], params['name'])
        if atype == 'rollback_deployment':
            return rollback_deployment(params['namespace'], params['name'])
        if atype == 'cnpg_recreate_replica':
            return cnpg_recreate_replica(
                params['cluster_name'], params['instance'],
                namespace=params.get('namespace', 'postgres'),
            )
        if atype == 'bump_resource_request':
            return bump_resource_request(
                params['namespace'], params['deployment'], params['container'],
                resource=params.get('resource', 'memory'),
                percent=int(params.get('percent', 25)),
            )

        # Tier 3 — SSH to non-K8s hosts
        if atype == 'prune_host_logdir':
            return prune_host_logdir(
                params['host'], params['logdir_key'],
                days=int(params.get('days', 7)),
            )
        if atype == 'restart_systemd_unit':
            return restart_systemd_unit(params['host'], params['unit_key'])
        if atype == 'journal_vacuum':
            return journal_vacuum(params['host'], size_mb=int(params.get('size_mb', 100)))

        return False, f'unknown action type {atype}'

    # ===================================================================
    # Closed-loop verification: after an action executes, schedule a
    # check N minutes later. If the alert is still firing, the action
    # didn't work — emit an audit event + email the operator. If the
    # alert cleared, audit success (= confidence-boosting evidence for
    # future similar cases).
    # ===================================================================

    def _query_alert_active(fingerprint):
        """Return True iff Alertmanager currently has an active alert
        matching the given fingerprint."""
        try:
            req = urllib.request.Request(f"{ALERTMANAGER_URL}/api/v2/alerts?active=true")
            with urllib.request.urlopen(req, timeout=10) as r:
                alerts = json.loads(r.read())
            for a in alerts:
                if a.get('fingerprint') == fingerprint:
                    return True
            return False
        except Exception as e:
            logger.error(f"_query_alert_active error: {e}")
            return None  # None = uncertain (don't email a false-failure)

    def _verify_action_outcome(verification_id):
        """Timer callback: check if the alert is still firing after the
        action's verify delay. Emits audit + emails operator if failed."""
        entry = _pending_verifications.pop(verification_id, None)
        if entry is None:
            return
        fingerprint = entry['fingerprint']
        still_firing = _query_alert_active(fingerprint)
        if still_firing is None:
            _audit('verification_uncertain',
                   alertname=entry['alertname'], action_type=entry['action_type'],
                   verification_id=verification_id)
            return
        if not still_firing:
            _audit('verification_passed',
                   alertname=entry['alertname'], action_type=entry['action_type'],
                   verification_id=verification_id,
                   minutes_to_clear=AI_VERIFY_DELAY_MIN)
            return
        # Still firing → action didn't work. Audit + email.
        _audit('verification_failed',
               alertname=entry['alertname'], action_type=entry['action_type'],
               verification_id=verification_id,
               minutes_after_action=AI_VERIFY_DELAY_MIN)
        _fail_text = (
            f"AI advisor verification FAILED for {entry['alertname']}.\n\n"
            f"Action {AI_VERIFY_DELAY_MIN}min ago: {entry['action_type']} — {entry['action_msg']}\n"
            f"Result: alert is STILL FIRING. The action didn't resolve it.\n\n"
            f"Recommended next steps:\n"
            f"  1. Check what the action actually did (audit log: "
            f"{{namespace=\"auto-remediation\"}} | json | action_type=\"{entry['action_type']}\")\n"
            f"  2. Investigate the underlying cause directly — the alert "
            f"may need a non-allowlisted action or a deeper fix.\n"
            f"  3. Consider whether this alert should be removed from the "
            f"`ai_remediation: auto` opt-in if it's not auto-fixable.\n"
        )
        _fail_html = _render_email(
            eyebrow='AI Advisor &middot; Verification FAILED',
            title=entry['alertname'],
            subhead=f"{entry['action_type']} ran {AI_VERIFY_DELAY_MIN}min ago but the alert is still firing",
            status_pill_html='<span class="pill pill-err"><span class="dot"></span>Action didn\'t work</span>',
            body_html=(
                '<div class="card"><div class="card-label">What this means</div>'
                f'<p class="card-body">The auto-remediation took an action but the underlying '
                f'condition persists. This is a learning signal — either the diagnosis was wrong, '
                f'the action was insufficient, or the action allowlist doesn\'t cover this root '
                f'cause. Investigate manually + consider whether to remove this alert from '
                f'<code>ai_remediation: auto</code>.</p></div>'
                '<div class="card"><div class="card-label">Action that ran</div>'
                f'<p class="card-body"><code>{entry["action_type"]}</code> — {entry["action_msg"]}</p></div>'
            ),
            meta_pairs=[
                ('Action', entry['action_type']),
                ('Delay before check', f'{AI_VERIFY_DELAY_MIN}min'),
                ('Alert state', 'Still firing'),
            ],
            raw_alert={'alertname': entry['alertname'], 'fingerprint': fingerprint},
            footer_extra='Verification only checks alert state — it does NOT undo the action.',
        )
        _send_email(
            subject=f"[Etherport AI Advisor: verification FAILED] {entry['alertname']}",
            body=_fail_text,
            html_body=_fail_html,
        )

    def _schedule_verification(alert, action_type, action_msg):
        """Called after an action runs. Schedules a Timer to verify outcome."""
        import threading
        import uuid
        fingerprint = alert.get('fingerprint', '')
        if not fingerprint:
            return  # nothing to verify against
        vid = uuid.uuid4().hex
        timer = threading.Timer(
            AI_VERIFY_DELAY_MIN * 60,
            _verify_action_outcome,
            args=(vid,),
        )
        timer.daemon = True   # don't block shutdown
        _pending_verifications[vid] = {
            'fingerprint': fingerprint,
            'alertname': alert.get('labels', {}).get('alertname', 'unknown'),
            'action_type': action_type,
            'action_msg': action_msg,
            'executed_at': datetime.now(timezone.utc).isoformat(),
            'timer': timer,
        }
        timer.start()
        _audit('verification_scheduled',
               alertname=_pending_verifications[vid]['alertname'],
               action_type=action_type,
               verification_id=vid,
               check_in_min=AI_VERIFY_DELAY_MIN)

    def _advise(alert):
        """Top-level: fetch context, call Claude, email diagnosis. Bounded
        by daily cost cap + cooldown."""
        alert_name = alert.get('labels', {}).get('alertname', 'unknown')

        if not AI_ENABLED:
            return
        if not ANTHROPIC_API_KEY:
            logger.warning(f"AI advisor enabled but ANTHROPIC_API_KEY empty — skipping {alert_name}")
            return
        if alert_name in AI_IGNORE_ALERTS:
            _audit('skipped_noisy', alertname=alert_name)
            return
        if is_cooldown_active(alert_name):
            return
        # Transient-suppression (owner ask 2026-06-19): if the alert has already
        # RESOLVED by the time we get here — a rollout that finished, a pod that
        # recovered, a node that came back — there's nothing to diagnose. Skip the
        # Claude call + email entirely. This is why the night of the dcgm reboot /
        # postgres-6 churn produced ~6 diagnosis emails for issues that were gone by
        # the time they landed. Fail-open (see _alert_still_firing). NOT cooldowned:
        # a genuine re-fire still active next time will be diagnosed.
        if not _alert_still_firing(alert):
            _audit('skipped_resolved', alertname=alert_name)
            return
        if _cap_reached():
            _audit('cap_reached', alertname=alert_name, daily_usd_spent=_cost_tracker['usd_spent'])
            # Cooldown + once-per-day cap notice. A single broken subsystem can
            # flap many DISTINCT alertnames; emailing the "[unavailable]" notice
            # per-alertname floods the inbox after the cap is hit (2026-06-18
            # velero incident: cap hit 18:02, then dozens of cap-notice emails
            # because the 15min cooldown is per-alertname, not global). Send the
            # heads-up ONCE per UTC day; the audit log still records every
            # cap_reached for Loki.
            recent_actions[alert_name] = datetime.now()
            if _cost_tracker.get('cap_email_date') == _today_utc():
                return
            _cost_tracker['cap_email_date'] = _today_utc()
            _cap_text = (
                f"AI advisor hit its ${AI_DAILY_USD_CAP}/day cost cap. "
                f"Raw alert below.\n\n{json.dumps(alert, indent=2, default=str)}"
            )
            _cap_html = _render_email(
                eyebrow='AI Advisor &middot; Unavailable',
                title=alert_name,
                subhead=f"Daily cost cap of ${AI_DAILY_USD_CAP} reached. Diagnosis skipped.",
                status_pill_html='<span class="pill pill-warn"><span class="dot"></span>Cap reached</span>',
                body_html=(
                    '<div class="card"><div class="card-label">What this means</div>'
                    '<p class="card-body">The advisor has spent its daily budget. Further '
                    'alerts in the next ' + str(int((86400 - (datetime.now(timezone.utc) - datetime.combine(_today_utc(), datetime.min.time(), tzinfo=timezone.utc)).total_seconds()) / 3600)) + 'h will fall through to this notice with the raw payload only. '
                    'Resets at UTC midnight. To raise the cap, edit '
                    '<code>AI_ADVISOR_DAILY_COST_USD_CAP</code> in the deployment.</p></div>'
                ),
                meta_pairs=[
                    ('Spent today', f"${_cost_tracker['usd_spent']:.4f}"),
                    ('Cap', f"${AI_DAILY_USD_CAP}"),
                    ('Resets', 'UTC midnight'),
                ],
                raw_alert=alert,
                footer_extra='Cooldown enforced &mdash; same alertname will not re-notify for 15min',
            )
            _send_email(
                subject=f"[Etherport AI Advisor: unavailable] {alert_name}",
                body=_cap_text,
                html_body=_cap_html,
            )
            return

        prompt = _load_prompt()
        if not prompt:
            return

        # Deep-mode dispatch: alerts labeled `ai_advisor_mode: "deep"` get a
        # tool-use loop where Claude can iteratively query Loki/Prometheus/K8s
        # before proposing an action. Higher cost (N API calls vs 1) but
        # much better root-cause analysis for complex alerts.
        deep_mode = (alert.get('labels', {}) or {}).get('ai_advisor_mode', '').lower() == 'deep'

        _audit('start', alertname=alert_name, mode='deep' if deep_mode else 'single')
        ctx = _build_context(alert)
        tool_log = []
        if deep_mode:
            parsed, usage, tool_log = _call_anthropic_with_tools(prompt, ctx)
        else:
            parsed, usage = _call_anthropic(prompt, ctx)

        if parsed is None:
            _audit('api_failed', alertname=alert_name)
            _err_text = (
                f"AI advisor API call failed for {alert_name}. Raw alert below.\n\n"
                f"{json.dumps(alert, indent=2, default=str)}"
            )
            _err_html = _render_email(
                eyebrow='AI Advisor &middot; Error',
                title=alert_name,
                subhead='Anthropic API call failed. The alert is shown raw below.',
                status_pill_html='<span class="pill pill-err"><span class="dot"></span>API error</span>',
                body_html=(
                    '<div class="card"><div class="card-label">What happened</div>'
                    '<p class="card-body">The advisor reached '
                    '<code>api.anthropic.com</code> but the response was unusable '
                    '(network error, HTTP non-2xx, or malformed JSON). Check the '
                    'controller logs for the exact reason. The static rule-based '
                    'path is unaffected.</p></div>'
                ),
                raw_alert=alert,
                footer_extra='Cooldown enforced &mdash; same alertname will not re-notify for 15min',
            )
            _send_email(
                subject=f"[Etherport AI Advisor: error] {alert_name}",
                body=_err_text,
                html_body=_err_html,
            )
            # Cooldown: don't spam "[advisor error]" mails if Anthropic
            # is having an outage and AM keeps re-firing the alert.
            recent_actions[alert_name] = datetime.now()
            return

        clean = _validate_response(parsed)
        if clean is None:
            _audit('invalid_response', alertname=alert_name, raw=str(parsed)[:500])
            return

        cost = _add_cost(usage.get('input_tokens', 0), usage.get('output_tokens', 0))
        _audit(
            'success',
            alertname=alert_name,
            mode='deep' if deep_mode else 'single',
            confidence=clean['confidence'],
            proposed_action_type=clean['proposed_action']['type'],
            input_tokens=usage.get('input_tokens'),
            output_tokens=usage.get('output_tokens'),
            cost_usd=round(cost, 4),
            daily_usd_spent=round(_cost_tracker['usd_spent'], 4),
            tool_calls=len(tool_log) if deep_mode else 0,
            tools_used=[t['tool'] for t in tool_log] if deep_mode else [],
        )

        # ---- Phase 3: autonomous execution (gated per-alert) ----
        # If this alert is explicitly opted in via Alertmanager label
        # `ai_remediation: "auto"` AND the kill switch is on AND
        # confidence + action + namespace all clear the guardrails,
        # execute now without waiting for human approval. Emails a
        # receipt after the fact (not before).
        labels = alert.get('labels', {}) or {}
        action_info = clean['proposed_action']
        atype = action_info.get('type', 'noop')
        params = action_info.get('params', {}) or {}
        ns = params.get('namespace', '')
        # Phase 3 auto-execution conditions:
        #   - Global Phase 3 enabled
        #   - Alert opt-in via PrometheusRule label `ai_remediation: auto`
        #   - Action type is in AI_AUTO_ELIGIBLE_ACTIONS (Tier 1 only — Tier 2
        #     never autonomous regardless of label)
        #   - Confidence above threshold
        #   - Namespace not in denylist (skipped for actions without a `namespace` param)
        ns_check_ok = (not ns) or (ns not in AI_NAMESPACE_DENYLIST)
        # Per-action threshold override (clean-up actions can fire at 0.70;
        # high-stakes actions can require 0.95). Falls back to the global
        # default for any action type not in the table.
        base_threshold = AI_PHASE3_ACTION_THRESHOLDS.get(atype, AI_PHASE3_CONFIDENCE_THRESHOLD)
        # Self-tuning (R4 second half): if this (alertname, action_type)
        # has recently failed verification, raise the threshold so the
        # advisor is forced to be more confident before auto-executing
        # again. Encodes "if your last 2 tries didn't actually fix it,
        # don't try a 3rd at the same confidence level."
        threshold = _dynamic_threshold(alert_name, atype, base_threshold)
        auto_ok = (
            AI_PHASE3_ENABLED
            and labels.get('ai_remediation', '').lower() == 'auto'
            and atype in AI_AUTO_ELIGIBLE_ACTIONS
            and ns_check_ok
            and float(clean.get('confidence', 0.0)) >= threshold
        )
        if auto_ok:
            # Set alertname on the proposal so _execute_proposal's frequency
            # cap check has it (auto path doesn't go through _store_proposal).
            clean['_alertname_for_cap'] = alert_name
            ok, msg = _execute_proposal(clean)
            _audit(
                'auto_executed' if ok else 'auto_execute_failed',
                alertname=alert_name,
                action_type=atype,
                confidence=clean['confidence'],
                result_msg=msg,
            )
            # Closed-loop: after a successful auto-execute, schedule a
            # verification check N min later. If the alert is still firing
            # then, the action didn't actually fix the underlying issue —
            # operator gets a follow-up email + audit signal for tuning.
            if ok:
                _schedule_verification(alert, atype, msg)
            # Cooldown on BOTH success and failure — a flapping
            # auto-execute failure (e.g. K8s API hiccup) shouldn't
            # re-burn LLM budget on every AM repeat (4h default).
            # Caught in 2026-05-24 code review.
            recent_actions[alert_name] = datetime.now()
            _exec_text = (
                f"AI advisor AUTO-EXECUTED an action for {alert_name}.\n\n"
                f"Action: {atype} {json.dumps(params)}\n"
                f"Confidence: {clean['confidence']:.2f}\n"
                f"Result: {'OK' if ok else 'FAILED'} — {msg}\n\n"
                f"Diagnosis: {clean['diagnosis']}\n\n"
                f"This alert was opted into Phase 3 autonomous execution via "
                f"the `ai_remediation: auto` label. To revert this alert to "
                f"Phase 2 (approve-by-click) behavior, remove that label "
                f"from the alert rule. To revert ALL alerts globally, set "
                f"AI_PHASE3_ENABLED=false in the controller deployment.\n\n"
                f"Raw alert payload:\n{json.dumps(alert, indent=2, default=str)[:2000]}"
            )
            _exec_html = _render_email(
                eyebrow='AI Advisor &middot; Auto-executed' if ok else 'AI Advisor &middot; Auto-execute FAILED',
                title=alert_name,
                subhead=clean['human_summary'],
                status_pill_html=(
                    '<span class="pill pill-ok"><span class="dot"></span>Auto-executed</span>'
                    if ok else
                    '<span class="pill pill-err"><span class="dot"></span>Auto-execute failed</span>'
                ),
                body_html=(
                    '<div class="card"><div class="card-label">Action taken</div>'
                    '<p class="card-body"><code>' + html_escape(atype) + '</code> &mdash; '
                    '<code>' + html_escape(json.dumps(params)) + '</code><br>'
                    'Result: <b>' + ('OK' if ok else 'FAILED') + '</b> &mdash; '
                    + html_escape(msg) + '</p></div>'
                    '<div class="card"><div class="card-label">Why</div>'
                    '<p class="card-body">' + html_escape(clean['diagnosis']) + '</p></div>'
                    '<p style="color:var(--text-muted);font-size:13px">'
                    'To revert to per-action approval for this alert, remove '
                    '<code>ai_remediation: "auto"</code> from its PrometheusRule label set.</p>'
                ),
                meta_pairs=[
                    ('Confidence', f"{clean['confidence']:.0%}"),
                    ('Action', atype),
                    ('Daily spend', f"${_cost_tracker['usd_spent']:.4f} / ${AI_DAILY_USD_CAP}"),
                ],
                raw_alert=alert,
                footer_extra='Phase 3 autonomous &mdash; receipt only, no approval needed',
            )
            _send_email(
                subject=f"[Etherport AI Advisor: AUTO-{atype}] {alert_name}",
                body=_exec_text,
                html_body=_exec_html,
            )
            return  # Phase 3 done; skip Phase 2 email path

        # Build email. Phase 2 adds Approve/Reject buttons when:
        #   - Phase 2 toggle is enabled
        #   - Proposed action is executable (not noop)
        #   - HMAC + base URL are configured
        action_info = clean['proposed_action']
        action_block = (
            f"Proposed action: {action_info['type']}\n"
            + (f"Target: {action_info['params']}\n" if action_info['type'] != 'noop' else "")
            + f"Reasoning: {action_info['reasoning']}\n"
        )

        approve_url = ''
        reject_url = ''
        proposal_id = ''
        if (AI_PHASE2_ENABLED and APPROVAL_HMAC_KEY and APPROVAL_BASE_URL
                and action_info['type'] != 'noop'):
            proposal_id = _new_proposal_id()
            _store_proposal(proposal_id, alert, clean)
            token = _sign(proposal_id)
            base = APPROVAL_BASE_URL.rstrip('/')
            approve_url = f"{base}/approve?id={proposal_id}&token={token}&decision=approve"
            reject_url = f"{base}/approve?id={proposal_id}&token={token}&decision=reject"

        # Plain-text body (always present)
        body = (
            f"{clean['human_summary']}\n\n"
            f"---\n"
            f"Diagnosis: {clean['diagnosis']}\n"
            f"Confidence: {clean['confidence']:.2f}\n\n"
            f"{action_block}\n"
        )
        if approve_url:
            body += (
                f"---\n"
                f"To EXECUTE this action, open: {approve_url}\n"
                f"To REJECT (mark false-positive), open: {reject_url}\n"
                f"Links expire in {APPROVAL_TTL_HOURS}h.\n\n"
            )
        else:
            body += (
                f"---\n"
                f"Phase 1 mode (no execute link). To execute manually, do so\n"
                f"yourself (or add a static rule in\n"
                f"platform/kubernetes/auto-remediation/configmap.yaml).\n\n"
            )
        body += (
            f"Daily spend: ${_cost_tracker['usd_spent']:.4f} of ${AI_DAILY_USD_CAP} cap.\n"
            f"Audit: kubectl -n auto-remediation logs deploy/remediation-controller | grep ai_advisor\n\n"
            f"---\n"
            f"Raw alert payload:\n{json.dumps(alert, indent=2, default=str)[:2000]}\n"
        )

        # Styled HTML email — _render_email handles layout; we just
        # build the body sections.
        action_type = action_info['type']
        if approve_url:
            buttons = (
                '<a href="' + html_escape(approve_url) + '" class="btn btn-approve">Approve + Execute</a>'
                '<a href="' + html_escape(reject_url) + '" class="btn btn-reject">Reject</a>'
            )
        else:
            buttons = None

        _body_blocks = []
        _body_blocks.append(
            '<div class="card"><div class="card-label">AI Diagnosis</div>'
            '<p class="card-body">' + html_escape(clean['diagnosis']) + '</p></div>'
        )
        _action_card = (
            '<div class="card"><div class="card-label">Proposed Action</div>'
            '<p class="card-body"><code>' + html_escape(action_type) + '</code>'
        )
        if action_type != 'noop':
            _action_card += (
                ' &mdash; <code>' + html_escape(json.dumps(action_info['params'])) + '</code>'
            )
        _action_card += (
            '<br><span style="color:var(--text-muted);font-size:14px">'
            + html_escape(action_info['reasoning']) + '</span></p></div>'
        )
        _body_blocks.append(_action_card)
        if approve_url:
            _body_blocks.append(
                '<p style="color:var(--text-muted);font-size:13px;margin:-4px 0 16px">'
                'Approval links are Tailscale-only and expire in ' + str(APPROVAL_TTL_HOURS) + 'h.'
                '</p>'
            )

        _eyebrow = 'AI Advisor &middot; ' + ('Action proposed' if action_type != 'noop' else 'Diagnosis only')
        _subhead = clean['human_summary']
        _meta = [
            ('Confidence', f"{clean['confidence']:.0%}"),
            ('Proposed action', action_type),
            ('Daily spend', f"${_cost_tracker['usd_spent']:.4f} / ${AI_DAILY_USD_CAP}"),
        ]
        html_body = _render_email(
            eyebrow=_eyebrow,
            title=alert_name,
            subhead=_subhead,
            status_pill_html=_confidence_pill(clean['confidence']),
            body_html=''.join(_body_blocks),
            action_buttons_html=buttons,
            meta_pairs=_meta,
            raw_alert=alert,
            footer_extra=(
                'Phase 2 enabled' if approve_url
                else 'Phase 1 (advisory only) &mdash; execute manually if needed'
            ),
        )

        _send_email(
            subject=f"[AI advisor: {clean['proposed_action']['type']}] {alert_name}",
            body=body,
            html_body=html_body,
        )
        # Phase 1 records the action in cooldown to prevent repeat
        # diagnoses of the same flap. Phase 2/3 would execute and
        # then cool down; here we cool down on advice given.
        recent_actions[alert_name] = datetime.now()

    # ===================================================================
    # Webhook (unchanged for rule-matched alerts; advisor on miss)
    # ===================================================================
    class AlertWebhook(BaseHTTPRequestHandler):
        def do_GET(self):
            """Phase 2 approval endpoint. URL:
               /approve?id=<proposal_id>&token=<HMAC>&decision=approve|reject
            Anything else 404s. No HTML form, no cookies; just GET the link."""
            if not self.path.startswith('/approve'):
                self.send_response(404)
                self.end_headers()
                return

            parsed = urllib.parse.urlparse(self.path)
            qs = urllib.parse.parse_qs(parsed.query)
            pid = (qs.get('id', [''])[0] or '').strip()
            tok = (qs.get('token', [''])[0] or '').strip()
            # Default to reject on missing/malformed decision — safer fail-mode.
            decision = (qs.get('decision', ['reject'])[0] or 'reject').strip().lower()

            def html_response(code, title, body, pill_class='pill-info', pill_text=None):
                """Styled confirmation page rendered via _render_email so
                the in-browser approval result matches email visual language."""
                self.send_response(code)
                self.send_header('Content-Type', 'text/html; charset=utf-8')
                self.end_headers()
                pill_html = ''
                if pill_text:
                    pill_html = (
                        '<span class="pill ' + pill_class + '">'
                        '<span class="dot"></span>' + html_escape(pill_text) + '</span>'
                    )
                page = _render_email(
                    eyebrow='AI Advisor &middot; Approval result',
                    title=title,
                    subhead=body,
                    status_pill_html=pill_html,
                    body_html='',
                    footer_extra=None,
                )
                self.wfile.write(page.encode())

            if not (pid and tok):
                html_response(400, "Bad request", "Missing id or token in URL.",
                              pill_class='pill-err', pill_text='400')
                return
            if not _verify(pid, tok):
                _audit('approve_bad_token', proposal_id=pid)
                html_response(403, "Invalid or expired token",
                              "Token verification failed. The link may have been corrupted or signed with a different HMAC key.",
                              pill_class='pill-err', pill_text='403 forbidden')
                return
            entry = _pending_proposals.get(pid)
            if not entry:
                _audit('approve_not_found', proposal_id=pid)
                html_response(410, "Proposal expired",
                              f"This proposal has expired or the controller restarted since the email was sent (TTL {APPROVAL_TTL_HOURS}h).",
                              pill_class='pill-muted', pill_text='Expired')
                return

            alertname = entry['alert'].get('labels', {}).get('alertname', '?')
            atype = entry['proposal']['proposed_action'].get('type', '?')

            if decision == 'reject':
                _audit('rejected', proposal_id=pid, alertname=alertname, action_type=atype)
                del _pending_proposals[pid]
                html_response(200, f"Rejected: {alertname}",
                              "Marked as false positive. No action taken. Same alertname will not re-notify for 15min.",
                              pill_class='pill-muted', pill_text='Rejected')
                return

            # Approve path
            ok, msg = _execute_proposal(entry['proposal'])
            _audit(
                'approved_executed' if ok else 'approved_failed',
                proposal_id=pid, alertname=alertname, action_type=atype, result_msg=msg,
            )
            if ok:
                recent_actions[alertname] = datetime.now()
                # Closed-loop verification on operator-approved actions too —
                # if a click-to-approve fix didn't work, operator deserves
                # the same "I tried but it's still firing" feedback as auto.
                _schedule_verification(entry['alert'], atype, msg)
            del _pending_proposals[pid]
            if ok:
                html_response(200, f"Executed: {alertname}",
                              f"{atype} dispatched successfully. {msg}",
                              pill_class='pill-ok', pill_text='Executed')
            else:
                html_response(500, f"Execution failed: {alertname}",
                              msg,
                              pill_class='pill-err', pill_text='Failed')

        def do_POST(self):
            """Handle incoming Prometheus alerts"""
            content_length = int(self.headers['Content-Length'])
            post_data = self.rfile.read(content_length)

            try:
                alert_data = json.loads(post_data)
                logger.info(f"Received alert: {json.dumps(alert_data, indent=2)}")

                # Process each alert
                for alert in alert_data.get('alerts', []):
                    alert_name = alert.get('labels', {}).get('alertname')
                    status = alert.get('status')

                    if status != 'firing':
                        continue

                    if alert_name in RULES:
                        if is_cooldown_active(alert_name):
                            continue

                        rule = RULES[alert_name]
                        action = rule.get('action')
                        namespace = rule.get('namespace') or alert.get('labels', {}).get('namespace')
                        selector = rule.get('selector')

                        logger.info(f"Taking action for {alert_name}: {rule.get('description')}")

                        success = False
                        if action == 'restart_pods' and namespace and selector:
                            success = restart_pods(namespace, selector)
                        elif action == 'scale_deployment':
                            deployment_name = alert.get('labels', {}).get('deployment')
                            if deployment_name and namespace:
                                success = scale_deployment(namespace, deployment_name)

                        if success:
                            recent_actions[alert_name] = datetime.now()
                    else:
                        # No rule — hand off to AI advisor (Phase 1, advisory only)
                        _advise(alert)

                self.send_response(200)
                self.send_header('Content-type', 'application/json')
                self.end_headers()
                self.wfile.write(json.dumps({"status": "ok"}).encode())

            except Exception as e:
                logger.error(f"Error processing alert: {e}")
                self.send_response(500)
                self.end_headers()

        def log_message(self, format, *args):
            """Suppress default logging"""
            pass

    if __name__ == '__main__':
        PORT = 8080
        server = HTTPServer(('', PORT), AlertWebhook)
        # Single-threaded HTTPServer (intentional — keeps the
        # _pending_proposals dict TOCTOU-free). Downside: a 30s
        # Anthropic call blocks /approve clicks + incoming webhooks
        # until it completes. Acceptable at homelab alert volumes.
        _phase2_ready = AI_PHASE2_ENABLED and bool(APPROVAL_HMAC_KEY) and bool(APPROVAL_BASE_URL)
        logger.info(
            f"Auto-remediation webhook server listening on port {PORT} "
            f"(ai_advisor={'on' if AI_ENABLED else 'off'}, "
            f"phase2={'ready' if _phase2_ready else ('toggled but unconfigured' if AI_PHASE2_ENABLED else 'off')}, "
            f"phase3={'on (opt-in via alert label)' if AI_PHASE3_ENABLED else 'off'}, "
            f"daily_cap=${AI_DAILY_USD_CAP}, model={AI_MODEL})"
        )
        server.serve_forever()
