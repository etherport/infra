        font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;
        font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; }
      .wrap { max-width:720px; margin:0 auto; padding:36px 20px 56px; }
      .eyebrow { font-size:11px; font-weight:600; color:var(--text-muted);
        letter-spacing:0.12em; text-transform:uppercase; margin:0 0 10px; }
      h1 { font-size:24px; font-weight:700; letter-spacing:-0.015em;
        margin:0 0 6px; color:var(--accent); }
