apiVersion: v1
kind: ConfigMap
metadata:
  name: remediation-script
  namespace: auto-remediation
data:
  remediate.py: |
    #!/usr/bin/env python3
    """
    Auto-Remediation Controller (with optional AI Advisor — M41 Phase 1)

    Receives Prometheus alerts via Alertmanager webhook. Two paths:

    1. Rule-based (original, always-on): if the alertname is in
       /etc/remediation/rules.yaml, take the canned action
       (restart_pods / scale_deployment) and stop.

    2. AI advisor (Phase 1 — advisory-only, opt-in via
       AI_ADVISOR_ENABLED=true): if no rule matches, gather context
       (pod logs, Loki query, K8s events, prior fires), call the
       Anthropic API for a diagnosis + proposed action, EMAIL the
       result to the operator. Does NOT execute the proposed action
       in Phase 1.

    Hard guardrails on the advisor path:
      - Per-day USD cost cap (AI_ADVISOR_DAILY_COST_USD_CAP, default $0.50).
        At cap, falls back to "advisory unavailable" with raw alert.
      - Token-budget per request (AI_ADVISOR_MAX_INPUT_TOKENS, default 8000).
      - Cooldown: same 15min as rule-based path, keyed on alertname.
      - Structured-JSON response from Claude is parsed strictly;
        proposed_action.type is enum-validated; anything else dropped.

    Audit log: every advisor call emits a structured JSON line to
    stdout with action="ai_advisor". Queryable via Loki LogQL as
    {namespace="auto-remediation"} |= "ai_advisor".
    """
    import os
    import json
    import hmac
    import hashlib
    import base64
    import logging
    import smtplib
    import ssl
    import urllib.request
    import urllib.error
    import urllib.parse
    import yaml
    from email.message import EmailMessage
    from email.mime.multipart import MIMEMultipart
    from email.mime.text import MIMEText
    from html import escape as html_escape
    from http.server import HTTPServer, BaseHTTPRequestHandler
    from kubernetes import client, config
    from datetime import datetime, timedelta, timezone

    logging.basicConfig(level=logging.INFO, format='%(asctime)s - %(levelname)s - %(message)s')
    logger = logging.getLogger(__name__)

    # Load Kubernetes config
    try:
        config.load_incluster_config()
    except:
        config.load_kube_config()

    v1 = client.CoreV1Api()
    apps_v1 = client.AppsV1Api()
    batch_v1 = client.BatchV1Api()
    custom = client.CustomObjectsApi()

    # Load remediation rules
    with open('/etc/remediation/rules.yaml', 'r') as f:
        RULES = yaml.safe_load(f)['rules']

    # ---- AI Advisor configuration (Phase 1 — advisory only) ----
    AI_ENABLED = os.environ.get('AI_ADVISOR_ENABLED', 'false').lower() == 'true'
    AI_DAILY_USD_CAP = float(os.environ.get('AI_ADVISOR_DAILY_COST_USD_CAP', '0.50'))
    AI_MAX_INPUT_TOKENS = int(os.environ.get('AI_ADVISOR_MAX_INPUT_TOKENS', '8000'))
    AI_MODEL = os.environ.get('AI_ADVISOR_MODEL', 'claude-sonnet-4-6')
    ANTHROPIC_API_KEY = os.environ.get('ANTHROPIC_API_KEY', '')
    EMAIL_TO = os.environ.get('EMAIL_TO', 'graham.m.smith@me.com')
    EMAIL_FROM = os.environ.get('EMAIL_FROM', 'ai-advisor@etherport.net')
    SMTP_HOST = os.environ.get('SMTP_HOST', 'email-smtp.us-west-2.amazonaws.com')
    SMTP_PORT = int(os.environ.get('SMTP_PORT', '587'))
    SMTP_USER = os.environ.get('SMTP_USER', '')
    SMTP_PASS = os.environ.get('SMTP_PASS', '')
    LOKI_URL = os.environ.get('LOKI_URL', 'http://loki.monitoring.svc.cluster.local:3100')
    PROMETHEUS_URL = os.environ.get('PROMETHEUS_URL', 'http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090')

    # M45 Phase B: CloudWatch Logs read for AWS-side context. Requires
    # the AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY env vars to be
    # populated from the ai-advisor-aws-cloudwatch SOPS secret; if
    # empty, the advisor silently skips the CW fetch step.
    AWS_REGION_PRIMARY = os.environ.get('AWS_REGION_PRIMARY', 'us-west-2')
    # Subnet CIDR for AWS-VPC instances — used to detect aws-related
    # alerts via the `instance` label.
    AWS_VPC_CIDR_PREFIX = os.environ.get('AWS_VPC_CIDR_PREFIX', '10.10.100.')

    # Pricing per million tokens — keep in sync with anthropic.com/pricing.
    # claude-sonnet-4-6: $3/M input, $15/M output.
    AI_PRICE_PER_M_INPUT = float(os.environ.get('AI_ADVISOR_PRICE_INPUT', '3.0'))
    AI_PRICE_PER_M_OUTPUT = float(os.environ.get('AI_ADVISOR_PRICE_OUTPUT', '15.0'))

    # ---- Phase 2: approve-via-email ----
    AI_PHASE2_ENABLED = os.environ.get('AI_PHASE2_ENABLED', 'false').lower() == 'true'
    APPROVAL_HMAC_KEY = os.environ.get('APPROVAL_HMAC_KEY', '')
    APPROVAL_BASE_URL = os.environ.get('APPROVAL_BASE_URL', '')  # e.g. https://remediation-approve.<tailnet>.ts.net
    APPROVAL_TTL_HOURS = int(os.environ.get('APPROVAL_TTL_HOURS', '24'))

    # ---- Phase 3: autonomous execution (opt-in per alert) ----
    # Top-level kill switch + per-alert opt-in via PrometheusRule
    # label `ai_remediation: "auto"`. Both must be true for autonomous
    # execute. Designed so a single env flip can revert ALL Phase 3
    # alerts to Phase 2 (approve-via-email) behavior immediately.
    AI_PHASE3_ENABLED = os.environ.get('AI_PHASE3_ENABLED', 'false').lower() == 'true'
    AI_PHASE3_CONFIDENCE_THRESHOLD = float(os.environ.get('AI_PHASE3_CONFIDENCE_THRESHOLD', '0.85'))

    # Per-action confidence calibration. Override the global threshold for
    # specific action types where the risk profile differs from the default.
    # Lower bar (e.g. 0.70) for clearly-safe actions that just clean up
    # terminal state — even at 0.7, the operator gets an email so we still
    # see what happened. Higher bar (e.g. 0.95) for actions that cause real
    # change to running infra (PVC resize, deployment rollback).
    # Falls back to AI_PHASE3_CONFIDENCE_THRESHOLD for any action not listed.
    AI_PHASE3_ACTION_THRESHOLDS = {
        # Clean-up actions on terminal state — very low risk
        'delete_completed_jobs': 0.70,
        'delete_evicted_pods':   0.70,
        # Triggers + restarts — bounded but worth checking
        'trigger_velero_backup_now': 0.75,
        'trigger_cnpg_backup_now':   0.75,
        'force_cert_renewal':        0.80,
        'silence_alert_temporarily': 0.80,
        # SSH-host actions — extra layer (remote wrapper enum) gives confidence
        'prune_host_logdir': 0.75,
        'journal_vacuum':    0.75,
        # Default 0.85 covers restart_pods + scale_deployment_temp
    }
    # Phase 3 inherits the SAME action allowlist + namespace denylist
    # as Phase 2. No expansion. Phase 3 is purely about who pulls the
    # trigger (operator click vs controller itself), not what actions
    # are possible.

    # Known-noisy alertnames — short-circuit BEFORE calling Claude.
    # Saves API tokens on alerts that always diagnose to noop, plus
    # alerts that are structurally never-actionable (InfoInhibitor is
    # a kube-state-metrics placeholder; KubeJobCompleted/Watchdog
    # are health canaries; CPUThrottlingHigh is informational on
    # bursty workloads).
    # Added 2026-05-24 after first 24h burned $0.94 in cap with 44
    # InfoInhibitor + 18 NodeMemoryHigh diagnoses, all noop.
    AI_IGNORE_ALERTS = {
        'InfoInhibitor',
        'Watchdog',
        'KubeJobCompleted',
        'CPUThrottlingHigh',
        'KubeAggregatedAPIDown',  # transient on apiserver restart
    }

    # Allowlist of proposed_action.type values the LLM may return.
    # ANYTHING ELSE is dropped server-side before the diagnosis is
    # emailed. The LLM never sees a shell; this enum is the entire
    # action surface.
    #
    # Tier 1 (autonomous-eligible): tightly bounded, idempotent, reversible.
    #   - delete_completed_jobs: clean up old Failed K8s Jobs (KubeJobFailed noise)
    #   - delete_evicted_pods: clean up Evicted pods (always safe — already terminal)
    #   - trigger_velero_backup_now: create Job from velero Schedule
    #   - trigger_cnpg_backup_now: create CNPG Backup CR from ScheduledBackup
    #   - force_cert_renewal: annotate cert-manager Certificate to re-issue
    #   - silence_alert_temporarily: POST Alertmanager silence with TTL (auto-expires)
    #
    # Tier 2 (approve-via-email only — NEVER autonomous):
    #   - rollout_restart: kubectl rollout restart (PDB-respecting; preferred over restart_pods)
    #   - expand_pvc: bump PVC capacity by 25% (storage-pressure alerts)
    #   - pause_cronjob / unpause_cronjob: suspend noisy CronJobs
    #   - rollback_deployment: kubectl rollout undo to previous revision
    #   - cnpg_recreate_replica: delete pod+PVC, CNPG re-bootstraps (postgres-7 pattern)
    #   - bump_resource_request: increase memory request on OOMKilled pods (audit-tracked)
    AI_ACTION_TYPES_ALLOWED = {
        'noop',
        # Original (kept for backwards compat):
        'restart_pods',
        'scale_deployment_temp',
        # Tier 1 — Phase 3 auto-eligible:
        'delete_completed_jobs',
        'delete_evicted_pods',
        'trigger_velero_backup_now',
        'trigger_cnpg_backup_now',
        'force_cert_renewal',
        'silence_alert_temporarily',
        # Tier 2 — Phase 2 only (approve gate):
        'rollout_restart',
        'expand_pvc',
        'pause_cronjob',
        'unpause_cronjob',
        'rollback_deployment',
        'cnpg_recreate_replica',
        'bump_resource_request',
        # Tier 3 — SSH to non-K8s hosts (dns-aws, dns-fallback, vpn-local, vpn-aws).
        # Strictly bounded by host allowlist + wrapped script on remote side.
        'prune_host_logdir',
        'restart_systemd_unit',
        'journal_vacuum',
    }

    # Subset of action types eligible for Phase 3 autonomous execution.
    # Tier 2 actions live in AI_ACTION_TYPES_ALLOWED (so the advisor can
    # propose them and operators can approve via email) but never auto-run.
    AI_AUTO_ELIGIBLE_ACTIONS = {
        'restart_pods',
        'scale_deployment_temp',
        'delete_completed_jobs',
        'delete_evicted_pods',
        'trigger_velero_backup_now',
        'trigger_cnpg_backup_now',
        'force_cert_renewal',
        'silence_alert_temporarily',
        # Tier 3 SSH actions ARE auto-eligible because the remote-side wrapper
        # script enforces a hardcoded enum of (action, args) — even if Claude
        # hallucinates parameters, the worst case is the wrapper rejects them.
        'prune_host_logdir',
        'journal_vacuum',
        # restart_systemd_unit deliberately NOT auto — service restarts are
        # disruption-bearing and benefit from operator awareness.
    }

    # Tier 3 SSH host allowlist. Map alert.labels.instance → ssh target.
    # Keys are the names the advisor uses in proposed_action.params.host.
    # Values: (ip, ssh_user — always advisor-remediation per base.yml setup).
    ADVISOR_SSH_HOSTS = {
        'dns-aws':      '10.10.100.5',
        'dns-fallback': '10.10.201.6',
        'vpn-local':    '10.10.201.15',
        'vpn-aws':      '10.10.100.10',
    }
    ADVISOR_SSH_USER = 'advisor-remediation'
    ADVISOR_SSH_KEY_PATH = os.environ.get('ADVISOR_SSH_KEY_PATH', '/etc/advisor-ssh/id_ed25519')
    ADVISOR_SSH_TIMEOUT = int(os.environ.get('ADVISOR_SSH_TIMEOUT', '30'))

    # Namespaces that are off-limits even for the allowed action types.
    # Phase 1 doesn't execute anything but we still validate so the
    # email recommendation doesn't tell the human to do something
    # we'd later reject. Note: cnpg-system is denied for general actions
    # but the cnpg_recreate_replica action explicitly allows postgres
    # (the data namespace, not the operator).
    AI_NAMESPACE_DENYLIST = {'kube-system', 'flux-system', 'cert-manager', 'cnpg-system', 'rook-ceph'}

    # ---------------------------------------------------------------------------
    # Per-action daily execution caps (R4 robustness: prevent runaway loops).
    # Counted per (alertname, action_type) over the last 24h via Loki audit
    # search. When the cap is hit, _execute_proposal refuses with a clear
    # message rather than risk repeated execution of an action that didn't
    # actually fix the issue. Operator can still manually intervene; the cap
    # protects against autonomous + approval-loop runaways.
    AI_ACTION_DAILY_LIMITS = {
        # Aggressive cleanup actions — generous limit; they're cheap + reversible
        'delete_completed_jobs': 10,
        'delete_evicted_pods':   10,
        # Triggers — should rarely fire more than a couple times a day
        'trigger_velero_backup_now': 4,
        'trigger_cnpg_backup_now':   4,
        'force_cert_renewal':        3,
        'silence_alert_temporarily': 5,
        # Restart-class — fewer; if this isn't fixing it, more restarts won't help
        'rollout_restart':       3,
        'restart_pods':          5,
        'scale_deployment_temp': 5,
        # High-stakes — strictly limited
        'rollback_deployment':    2,
        'cnpg_recreate_replica':  1,
        'expand_pvc':             2,
        # Tier 3 SSH actions — moderate; cleanup-like
        'prune_host_logdir':   5,
        'restart_systemd_unit': 5,
        'journal_vacuum':      3,
    }
    # Default cap for any action type not listed above.
    AI_ACTION_DAILY_LIMIT_DEFAULT = 5

    # Alertmanager base URL — used by silence_alert_temporarily.
    ALERTMANAGER_URL = os.environ.get(
        'ALERTMANAGER_URL',
        'http://monitoring-kube-prometheus-alertmanager.monitoring.svc.cluster.local:9093',
    )
    # GitHub API access for deep-mode institutional-knowledge tools
    # (search_git_log + read_runbook). Repo is not mounted into the pod,
    # so the advisor reads commit history + runbooks via the public API
    # instead of shelling out to git. Token is optional — unauth requests
    # work but the 60/hr rate limit makes them unreliable.
    GITHUB_REPO = os.environ.get('GITHUB_REPO', 'sparked-diamond/infra')
    GITHUB_TOKEN = os.environ.get('GITHUB_TOKEN', '')
    # Max silence TTL the advisor can set (hours). Anything beyond this
    # should be a human-led operational decision.
    AI_SILENCE_MAX_HOURS = int(os.environ.get('AI_SILENCE_MAX_HOURS', '6'))
    # Max PVC expansion percent the advisor can request per action.
    AI_PVC_EXPAND_MAX_PCT = int(os.environ.get('AI_PVC_EXPAND_MAX_PCT', '25'))
    # Absolute cap on PVC size the advisor can grow to (GiB).
    AI_PVC_EXPAND_ABSOLUTE_MAX_GI = int(os.environ.get('AI_PVC_EXPAND_ABSOLUTE_MAX_GI', '500'))

    # Track recent actions to prevent loops (shared between rule path and advisor path)
    recent_actions = {}
    COOLDOWN_MINUTES = 15

    # Per-day cost tracker (resets at UTC midnight).
    _cost_tracker = {'date': None, 'usd_spent': 0.0}

    # Pending proposals awaiting approval (Phase 2). Keyed by proposal_id.
    # In-memory, single-replica controller, so a pod restart drops them
    # (operator gets "token expired" if they click after a restart).
    # GC'd opportunistically in _gc_pending().
    _pending_proposals = {}

    # Pending closed-loop verifications: after an action executes (auto
    # OR operator-approved), schedule a check N minutes later to confirm
    # the alert actually cleared. Keyed by verification_id (uuid).
    # Each value: {fingerprint, alertname, action_type, action_msg,
    #              executed_at, timer (threading.Timer obj)}
    # In-memory like _pending_proposals — pod restart cancels in-flight
    # verifications (the audit log still has the auto_executed entry
    # so nothing's silently lost).
    _pending_verifications = {}
    AI_VERIFY_DELAY_MIN = int(os.environ.get('AI_VERIFY_DELAY_MIN', '5'))

    def _today_utc():
        return datetime.now(timezone.utc).date()

    def _add_cost(input_tokens, output_tokens):
        today = _today_utc()
        if _cost_tracker['date'] != today:
            _cost_tracker['date'] = today
            _cost_tracker['usd_spent'] = 0.0
        cost = (input_tokens / 1_000_000) * AI_PRICE_PER_M_INPUT + \
               (output_tokens / 1_000_000) * AI_PRICE_PER_M_OUTPUT
        _cost_tracker['usd_spent'] += cost
        return cost

    def _cap_reached():
        today = _today_utc()
        if _cost_tracker['date'] != today:
            return False
        return _cost_tracker['usd_spent'] >= AI_DAILY_USD_CAP

    def is_cooldown_active(alert_name):
        """Check if we're in cooldown period for this alert"""
        if alert_name in recent_actions:
            last_action = recent_actions[alert_name]
            if datetime.now() - last_action < timedelta(minutes=COOLDOWN_MINUTES):
                logger.info(f"Cooldown active for {alert_name}, skipping action")
                return True
        return False

    def restart_pods(namespace, selector):
        """Restart pods matching selector in namespace"""
        logger.info(f"Restarting pods in {namespace} with selector {selector}")
        try:
            pods = v1.list_namespaced_pod(namespace, label_selector=selector)
            deleted_count = 0
            for pod in pods.items:
                logger.info(f"Deleting pod {pod.metadata.name}")
                v1.delete_namespaced_pod(pod.metadata.name, namespace)
                deleted_count += 1
            logger.info(f"Deleted {deleted_count} pods")
            return True
        except Exception as e:
            logger.error(f"Error restarting pods: {e}")
            return False

    def scale_deployment(namespace, name, replicas=0):
        """Scale deployment to 0 then back to original"""
        logger.info(f"Scaling deployment {namespace}/{name}")
        try:
            deployment = apps_v1.read_namespaced_deployment(name, namespace)
            original_replicas = deployment.spec.replicas

            # Scale to 0
            deployment.spec.replicas = replicas
            apps_v1.patch_namespaced_deployment_scale(name, namespace, deployment)
            logger.info(f"Scaled {name} to {replicas}")

            # Scale back (would need to wait in production)
            if replicas == 0:
                import time
                time.sleep(10)
                deployment.spec.replicas = original_replicas
                apps_v1.patch_namespaced_deployment_scale(name, namespace, deployment)
                logger.info(f"Scaled {name} back to {original_replicas}")
            return True
        except Exception as e:
            logger.error(f"Error scaling deployment: {e}")
            return False

    # ===================================================================
    # Tier 1 — Phase 3 auto-eligible actions
    # Tightly bounded, idempotent, reversible. Each returns (bool, str).
    # ===================================================================

    def delete_completed_jobs(namespace, label_selector='', older_than_hours=6):
        """Delete Failed K8s Jobs older than N hours in namespace.
        Skips Active or Complete jobs. Targets only Jobs the controller
        owns (no manual Jobs, no system Jobs)."""
        try:
            jobs = batch_v1.list_namespaced_job(namespace, label_selector=label_selector)
            cutoff = datetime.now(timezone.utc) - timedelta(hours=older_than_hours)
            deleted = 0
            for job in jobs.items:
                # Skip if still running or never-failed
                if job.status.active and job.status.active > 0:
                    continue
                if not job.status.failed:
                    continue
                started = job.status.start_time
                if started is None or started >= cutoff:
                    continue
                batch_v1.delete_namespaced_job(
                    job.metadata.name, namespace,
                    propagation_policy='Background',
                )
                deleted += 1
                logger.info(f"Deleted Failed Job {namespace}/{job.metadata.name}")
            return True, f'deleted {deleted} Failed jobs older than {older_than_hours}h'
        except Exception as e:
            logger.error(f"delete_completed_jobs error: {e}")
            return False, str(e)

    def delete_evicted_pods(namespace):
        """Delete pods in Evicted state. Always safe — pods are already terminal."""
        try:
            pods = v1.list_namespaced_pod(namespace)
            deleted = 0
            for pod in pods.items:
                if pod.status.phase == 'Failed' and pod.status.reason == 'Evicted':
                    v1.delete_namespaced_pod(pod.metadata.name, namespace)
                    deleted += 1
                    logger.info(f"Deleted Evicted pod {namespace}/{pod.metadata.name}")
            return True, f'deleted {deleted} Evicted pods'
        except Exception as e:
            logger.error(f"delete_evicted_pods error: {e}")
            return False, str(e)

    def trigger_velero_backup_now(schedule_name):
        """Create an immediate Velero Backup from a Schedule.
        Velero's pattern: `kubectl create job --from=schedule/X` wraps
        the schedule's template into a one-off Backup. We do the API
        equivalent by reading the Schedule then creating a Backup CR
        with its template spec."""
        try:
            sched = custom.get_namespaced_custom_object(
                'velero.io', 'v1', 'velero', 'schedules', schedule_name,
            )
            backup_name = f"{schedule_name}-adhoc-{int(datetime.now(timezone.utc).timestamp())}"
            backup = {
                'apiVersion': 'velero.io/v1',
                'kind': 'Backup',
                'metadata': {
                    'name': backup_name,
                    'namespace': 'velero',
                    'labels': {
                        'velero.io/schedule-name': schedule_name,
                        'remediation.ai/triggered-by': 'ai-advisor',
                    },
                },
                'spec': sched.get('spec', {}).get('template', {}),
            }
            custom.create_namespaced_custom_object(
                'velero.io', 'v1', 'velero', 'backups', backup,
            )
            logger.info(f"Triggered Velero backup {backup_name} from schedule {schedule_name}")
            return True, f'created Backup {backup_name}'
        except Exception as e:
            logger.error(f"trigger_velero_backup_now error: {e}")
            return False, str(e)

    def trigger_cnpg_backup_now(cluster_name, namespace='postgres'):
        """Create an immediate CNPG Backup CR for a Cluster.
        Operator handles execution + posts to barmanObjectStore."""
        try:
            backup_name = f"{cluster_name}-adhoc-{int(datetime.now(timezone.utc).timestamp())}"
            backup = {
                'apiVersion': 'postgresql.cnpg.io/v1',
                'kind': 'Backup',
                'metadata': {
                    'name': backup_name,
                    'namespace': namespace,
                    'labels': {'remediation.ai/triggered-by': 'ai-advisor'},
                },
                'spec': {
                    'cluster': {'name': cluster_name},
                    'method': 'barmanObjectStore',
                },
            }
            custom.create_namespaced_custom_object(
                'postgresql.cnpg.io', 'v1', namespace, 'backups', backup,
            )
            logger.info(f"Triggered CNPG backup {backup_name} for cluster {cluster_name}")
            return True, f'created Backup {backup_name}'
        except Exception as e:
            logger.error(f"trigger_cnpg_backup_now error: {e}")
            return False, str(e)

    def force_cert_renewal(namespace, cert_name):
        """Force cert-manager to re-issue a Certificate by annotating it.
        cert-manager watches the cert-manager.io/issue-temporary-certificate
        annotation; setting it triggers a new CertificateRequest."""
        try:
            patch = {
                'metadata': {
                    'annotations': {
                        'cert-manager.io/issue-temporary-certificate': 'true',
                        'remediation.ai/triggered-at': datetime.now(timezone.utc).isoformat(),
                    }
                }
            }
            custom.patch_namespaced_custom_object(
                'cert-manager.io', 'v1', namespace, 'certificates', cert_name, patch,
            )
            logger.info(f"Forced renewal of cert {namespace}/{cert_name}")
            return True, f'annotated {namespace}/{cert_name} for re-issue'
        except Exception as e:
            logger.error(f"force_cert_renewal error: {e}")
            return False, str(e)

    def silence_alert_temporarily(alertname, hours=2, comment='ai-advisor temporary silence'):
        """Add an Alertmanager silence with TTL. Auto-expires; max bounded
        by AI_SILENCE_MAX_HOURS."""
        hours = min(int(hours or 1), AI_SILENCE_MAX_HOURS)
        try:
            now = datetime.now(timezone.utc)
            body = {
                'matchers': [
                    {'name': 'alertname', 'value': alertname, 'isRegex': False, 'isEqual': True},
                ],
                'startsAt': now.isoformat(),
                'endsAt': (now + timedelta(hours=hours)).isoformat(),
                'createdBy': 'ai-advisor',
                'comment': comment[:200],
            }
            data = json.dumps(body).encode()
            req = urllib.request.Request(
                f"{ALERTMANAGER_URL}/api/v2/silences",
                data=data,
                method='POST',
                headers={'Content-Type': 'application/json'},
            )
            with urllib.request.urlopen(req, timeout=10) as resp:
                result = json.loads(resp.read())
            logger.info(f"Created silence {result.get('silenceID')} for {alertname} ({hours}h)")
            return True, f'silenced {alertname} for {hours}h (id={result.get("silenceID")})'
        except Exception as e:
            logger.error(f"silence_alert_temporarily error: {e}")
            return False, str(e)

    # ===================================================================
    # Tier 2 — Approve-via-email only (NEVER autonomous)
    # ===================================================================

    def rollout_restart(namespace, name, kind='deployment'):
        """kubectl rollout restart equivalent. Adds a timestamp annotation
        to pod template, which makes the controller re-roll respecting
        PodDisruptionBudgets. Safer than restart_pods (which just deletes
        without coordination)."""
        try:
            patch = {
                'spec': {'template': {'metadata': {'annotations': {
                    'kubectl.kubernetes.io/restartedAt': datetime.now(timezone.utc).isoformat(),
                    'remediation.ai/restarted-at': datetime.now(timezone.utc).isoformat(),
                }}}}
            }
            if kind == 'deployment':
                apps_v1.patch_namespaced_deployment(name, namespace, patch)
            elif kind == 'statefulset':
                apps_v1.patch_namespaced_stateful_set(name, namespace, patch)
            elif kind == 'daemonset':
                apps_v1.patch_namespaced_daemon_set(name, namespace, patch)
            else:
                return False, f'unknown kind {kind}'
            logger.info(f"Rolled out restart on {kind}/{namespace}/{name}")
            return True, f'rollout restart {kind} {namespace}/{name}'
        except Exception as e:
            logger.error(f"rollout_restart error: {e}")
            return False, str(e)

    def expand_pvc(namespace, pvc_name, percent=25):
        """Expand PVC by N% (capped at AI_PVC_EXPAND_MAX_PCT, absolute
        cap at AI_PVC_EXPAND_ABSOLUTE_MAX_GI). Requires StorageClass with
        allowVolumeExpansion=true (ceph-rbd has this)."""
        percent = min(int(percent or 25), AI_PVC_EXPAND_MAX_PCT)
        try:
            pvc = v1.read_namespaced_persistent_volume_claim(pvc_name, namespace)
            current_str = pvc.spec.resources.requests.get('storage', '0')
            # Parse Gi/Mi suffix
            if current_str.endswith('Gi'):
                current_gi = int(current_str[:-2])
            elif current_str.endswith('Ti'):
                current_gi = int(current_str[:-2]) * 1024
            elif current_str.endswith('Mi'):
                current_gi = max(1, int(current_str[:-2]) // 1024)
            else:
                return False, f'unparseable current size: {current_str}'
            new_gi = min(
                AI_PVC_EXPAND_ABSOLUTE_MAX_GI,
                current_gi + max(1, current_gi * percent // 100),
            )
            if new_gi <= current_gi:
                return False, f'no expansion (current={current_gi}Gi, cap={AI_PVC_EXPAND_ABSOLUTE_MAX_GI}Gi)'
            patch = {'spec': {'resources': {'requests': {'storage': f'{new_gi}Gi'}}}}
            v1.patch_namespaced_persistent_volume_claim(pvc_name, namespace, patch)
            logger.info(f"Expanded PVC {namespace}/{pvc_name}: {current_gi}Gi → {new_gi}Gi")
            return True, f'expanded {namespace}/{pvc_name} {current_gi}→{new_gi} Gi'
        except Exception as e:
            logger.error(f"expand_pvc error: {e}")
            return False, str(e)

    def pause_cronjob(namespace, name):
        """Set CronJob.spec.suspend=true. Stops scheduling new jobs."""
        try:
            batch_v1.patch_namespaced_cron_job(name, namespace, {'spec': {'suspend': True}})
            logger.info(f"Suspended CronJob {namespace}/{name}")
            return True, f'suspended cronjob {namespace}/{name}'
        except Exception as e:
            logger.error(f"pause_cronjob error: {e}")
            return False, str(e)

    def unpause_cronjob(namespace, name):
        """Set CronJob.spec.suspend=false. Resumes scheduling."""
        try:
            batch_v1.patch_namespaced_cron_job(name, namespace, {'spec': {'suspend': False}})
            logger.info(f"Resumed CronJob {namespace}/{name}")
            return True, f'resumed cronjob {namespace}/{name}'
        except Exception as e:
            logger.error(f"unpause_cronjob error: {e}")
            return False, str(e)

    def rollback_deployment(namespace, name):
        """Roll back a Deployment to its previous revision (kubectl rollout
        undo equivalent). Uses ReplicaSet history; picks the previous one
        by revision number."""
        try:
            d = apps_v1.read_namespaced_deployment(name, namespace)
            current_rev = int((d.metadata.annotations or {}).get(
                'deployment.kubernetes.io/revision', '0'))
            # Find prior ReplicaSet for this deployment
            owner_uid = d.metadata.uid
            rs_list = apps_v1.list_namespaced_replica_set(namespace).items
            owned_rs = []
            for rs in rs_list:
                for ref in (rs.metadata.owner_references or []):
                    if ref.uid == owner_uid:
                        rev = int((rs.metadata.annotations or {}).get(
                            'deployment.kubernetes.io/revision', '0'))
                        owned_rs.append((rev, rs))
                        break
            owned_rs.sort(key=lambda x: -x[0])
            prior = next((rs for rev, rs in owned_rs if rev < current_rev), None)
            if not prior:
                return False, 'no prior ReplicaSet revision found'
            # Patch deployment template back to prior RS's template
            patch = {'spec': {'template': prior.spec.template.to_dict()}}
            apps_v1.patch_namespaced_deployment(name, namespace, patch)
            logger.info(f"Rolled back deployment {namespace}/{name} from rev {current_rev} to prior")
            return True, f'rolled back {namespace}/{name} (was rev {current_rev})'
        except Exception as e:
            logger.error(f"rollback_deployment error: {e}")
            return False, str(e)

    def cnpg_recreate_replica(cluster_name, instance, namespace='postgres'):
        """Recreate a broken CNPG replica by deleting its pod + PVC.
        CNPG operator detects the missing instance and re-bootstraps from
        base backup. Only safe for REPLICAS — never primary. We guard by
        checking instanceRole label before delete."""
        try:
            pod_name = instance  # e.g. postgres-cluster-7
            pod = v1.read_namespaced_pod(pod_name, namespace)
            role = (pod.metadata.labels or {}).get('cnpg.io/instanceRole', '')
            if role == 'primary':
                return False, f'refusing to delete primary pod {pod_name} — use cnpg_failover first'
            # Delete pod then PVC (same name as pod by convention)
            v1.delete_namespaced_pod(pod_name, namespace, grace_period_seconds=10)
            v1.delete_namespaced_persistent_volume_claim(pod_name, namespace)
            logger.info(f"Recreated CNPG replica {namespace}/{pod_name} (cluster {cluster_name})")
            return True, f'deleted pod+PVC {namespace}/{pod_name}; CNPG will re-bootstrap'
        except Exception as e:
            logger.error(f"cnpg_recreate_replica error: {e}")
            return False, str(e)

    def bump_resource_request(namespace, deployment, container, resource='memory', percent=25):
        """Increase a container's resource request by N%. Used for
        OOMKilled-loop alerts. Audit-tracked so we can revert if it
        becomes a habit (vs solving the actual leak)."""
        percent = min(int(percent or 25), 50)  # hard cap 50% per bump
        try:
            d = apps_v1.read_namespaced_deployment(deployment, namespace)
            containers = d.spec.template.spec.containers
            target = next((c for c in containers if c.name == container), None)
            if not target:
                return False, f'container {container} not in {deployment}'
            requests = (target.resources.requests or {}) if target.resources else {}
            current_str = requests.get(resource, '0')
            # Parse Mi/Gi suffix
            if current_str.endswith('Gi'):
                current_mi = int(current_str[:-2]) * 1024
            elif current_str.endswith('Mi'):
                current_mi = int(current_str[:-2])
            elif current_str.endswith('m') and resource == 'cpu':
                current_mi = int(current_str[:-1])
            else:
                return False, f'unparseable current {resource}: {current_str}'
            new_mi = current_mi + max(1, current_mi * percent // 100)
            unit = 'Mi' if resource == 'memory' else 'm'
            new_val = f'{new_mi}{unit}'
            patch = {'spec': {'template': {'spec': {'containers': [{
                'name': container,
                'resources': {'requests': {resource: new_val}},
            }]}}}}
            apps_v1.patch_namespaced_deployment(deployment, namespace, patch)
            logger.info(f"Bumped {namespace}/{deployment}/{container} {resource} {current_str}→{new_val}")
            return True, f'bumped {resource} {current_str}→{new_val} (+{percent}%)'
        except Exception as e:
            logger.error(f"bump_resource_request error: {e}")
            return False, str(e)

    # ===================================================================
    # Tier 3 — SSH to non-K8s hosts via paramiko
    #
    # Defense-in-depth: cluster-side validates host + builds the command
    # from a hardcoded template (no string concat with user/AI input);
    # host-side wrapper script enforces an enum of (action, args) before
    # dispatching; sudoers rules permit only the exact commands the
    # wrapper invokes. Three layers of allowlist between Claude's
    # proposed_action and `rm -rf /`.
    # ===================================================================

    def _ssh_exec(host_key, original_command):
        """Execute `original_command` on host (resolved from ADVISOR_SSH_HOSTS).
        The remote authorized_keys entry pins SSH to /usr/local/sbin/advisor-remediation.sh,
        so original_command goes into $SSH_ORIGINAL_COMMAND on the wrapper.
        Returns (success_bool, message_str)."""
        if host_key not in ADVISOR_SSH_HOSTS:
            return False, f'host {host_key!r} not in allowlist'
        if not os.path.exists(ADVISOR_SSH_KEY_PATH):
            return False, f'SSH key missing at {ADVISOR_SSH_KEY_PATH}'
        ip = ADVISOR_SSH_HOSTS[host_key]
        try:
            import paramiko
        except ImportError:
            return False, 'paramiko not installed in controller image (add to pip install)'
        try:
            client = paramiko.SSHClient()
            client.set_missing_host_key_policy(paramiko.AutoAddPolicy())
            pkey = paramiko.Ed25519Key.from_private_key_file(ADVISOR_SSH_KEY_PATH)
            client.connect(
                hostname=ip,
                username=ADVISOR_SSH_USER,
                pkey=pkey,
                timeout=ADVISOR_SSH_TIMEOUT,
                allow_agent=False,
                look_for_keys=False,
            )
            stdin, stdout, stderr = client.exec_command(original_command, timeout=ADVISOR_SSH_TIMEOUT)
            exit_code = stdout.channel.recv_exit_status()
            out = stdout.read().decode(errors='replace').strip()
            err = stderr.read().decode(errors='replace').strip()
            client.close()
            ok = (exit_code == 0)
            logger.info(f"ssh_exec {host_key}: exit={exit_code} out={out[:200]!r} err={err[:200]!r}")
            msg = out if ok else f"exit={exit_code} stderr={err[:200]}"
            return ok, msg
        except Exception as e:
            logger.error(f"ssh_exec {host_key} failed: {e}")
            return False, str(e)

    def prune_host_logdir(host, logdir_key, days=7):
        """SSH to host, prune logdir (allowlisted key) older than N days.
        logdir_key MUST match the remote wrapper's allowlist:
          technitium-logs  | technitium-stats."""
        # Defense layer 1: validate days as int 1-365 here too
        try:
            days = int(days)
        except (TypeError, ValueError):
            return False, 'days must be int'
        if days < 1 or days > 365:
            return False, 'days out of range 1-365'
        # Defense layer 2: validate logdir_key cluster-side
        if logdir_key not in {'technitium-logs', 'technitium-stats'}:
            return False, f'logdir_key {logdir_key!r} not allowed'
        cmd = f'prune-logdir {logdir_key} {days}'
        return _ssh_exec(host, cmd)

    def restart_systemd_unit(host, unit_key):
        """SSH to host, restart a systemd unit (allowlisted key).
        unit_key MUST match the remote wrapper's allowlist:
          technitium | wireguard | kubelet."""
        if unit_key not in {'technitium', 'wireguard', 'kubelet'}:
            return False, f'unit_key {unit_key!r} not allowed'
        cmd = f'restart-unit {unit_key}'
        return _ssh_exec(host, cmd)

    def journal_vacuum(host, size_mb=100):
        """SSH to host, journalctl --vacuum-size=<size_mb>M."""
        try:
            size_mb = int(size_mb)
        except (TypeError, ValueError):
            return False, 'size_mb must be int'
        if size_mb < 10 or size_mb > 1000:
            return False, 'size_mb out of range 10-1000'
        cmd = f'journal-vacuum {size_mb}'
        return _ssh_exec(host, cmd)

    # ===================================================================
    # AI Advisor — Phase 1 (advisory only, no execution)
    # ===================================================================

    def _audit(event, **kwargs):
        """Emit a structured JSON line for the audit log. Pure JSON
        (no logger prefix) so the Grafana dashboard's `| json` parser
        can read it directly without regex extraction. The `tag` field
        replaces the old "ai_advisor " text marker.
        Query in Loki: {namespace="auto-remediation"} | json | tag="ai_advisor"
        """
        record = {
            'tag': 'ai_advisor',
            'ts': datetime.now(timezone.utc).isoformat(),
            'event': event,
        }
        record.update(kwargs)
        # print() bypasses the logging formatter so the line is pure
        # JSON; Alloy still scrapes it from container stdout.
        print(json.dumps(record, default=str), flush=True)

    def _load_prompt():
        try:
            with open('/etc/prompts/advisor.md', 'r') as f:
                return f.read()
        except Exception as e:
            logger.error(f"Failed to load advisor prompt: {e}")
            return None

    def _fetch_loki_window(query, start_ts, end_ts, limit=200):
        """Query Loki for a time window. Returns list of (ts, line) tuples
        truncated to `limit` entries total. Best-effort; failures empty."""
        try:
            params = (
                f"query={urllib.parse.quote(query)}"
                f"&start={start_ts}000000000&end={end_ts}000000000"
                f"&limit={limit}&direction=backward"
            )
            url = f"{LOKI_URL}/loki/api/v1/query_range?{params}"
            with urllib.request.urlopen(url, timeout=10) as resp:
                data = json.loads(resp.read())
            entries = []
            for stream in data.get('data', {}).get('result', []):
                for ts, line in stream.get('values', []):
                    entries.append((ts, line[:500]))  # cap line length
            return entries[:limit]
        except Exception as e:
            logger.warning(f"Loki query failed: {e}")
            return []

    # ---- M45 Phase B: CloudWatch Logs context for AWS-side alerts ----

    # boto3 is imported lazily so a missing pip install doesn't crash
    # the controller at startup — the advisor just gracefully skips
    # the CW step.
    _boto3_logs = None
    _boto3_import_attempted = False

    def _get_logs_client():
        global _boto3_logs, _boto3_import_attempted
        if _boto3_logs is not None or _boto3_import_attempted:
            return _boto3_logs
        _boto3_import_attempted = True
        # Credentials present either as static keys OR as IRSA web identity (M75).
        # boto3 resolves both from the default chain; gate on one being configured.
        _have_static = os.environ.get('AWS_ACCESS_KEY_ID') and os.environ.get('AWS_SECRET_ACCESS_KEY')
        _have_irsa = os.environ.get('AWS_WEB_IDENTITY_TOKEN_FILE') and os.environ.get('AWS_ROLE_ARN')
        if not _have_static and not _have_irsa:
            return None
        try:
            import boto3  # type: ignore
            _boto3_logs = boto3.client('logs', region_name=AWS_REGION_PRIMARY)
            return _boto3_logs
        except Exception as e:
            logger.warning(f"boto3 unavailable for CloudWatch Logs: {e}")
            return None

    def _alert_is_aws(alert):
        """Heuristic — does this alert reference an AWS-side resource?
        Returns dict of context hints, or None if not AWS-related."""
        labels = alert.get('labels', {}) or {}
        ann = alert.get('annotations', {}) or {}
        instance = labels.get('instance', '')
        alertname = labels.get('alertname', '')
        # 1) job=external-nodes + location=aws (set in
        #    01-external-scrape-config.yaml relabel rules)
        if labels.get('job') == 'external-nodes' and labels.get('location') == 'aws':
            return {'kind': 'ec2', 'name': labels.get('instance', '?')}
        # 2) instance IP is in the AWS-VPC range (10.10.100.x)
        if instance.startswith(AWS_VPC_CIDR_PREFIX):
            return {'kind': 'ec2', 'name': instance}
        # 3) alertname contains "lambda" — try to pull a function name
        #    from labels.function or annotations.function
        if 'lambda' in alertname.lower() or 'lambda' in (ann.get('summary', '') + ann.get('description', '')).lower():
            return {
                'kind': 'lambda',
                'name': labels.get('function') or labels.get('function_name') or labels.get('functionname') or '?',
            }
        return None

    def _fetch_cloudwatch_logs(aws_hint, start_ts, end_ts, limit=80):
        """Fetch recent CW log events for the resource the alert points
        at. Returns list of (timestamp_ms, message) tuples truncated to
        `limit`. Failures empty + warn."""
        cwlogs = _get_logs_client()
        if not cwlogs:
            return []
        kind = aws_hint.get('kind')
        name = aws_hint.get('name')
        try:
            if kind == 'lambda':
                # /aws/lambda/<name>
                group_prefix = f"/aws/lambda/{name}" if name and name != '?' else "/aws/lambda"
            elif kind == 'ec2':
                # /aws/ec2/<instance-id> OR CloudWatchAgent<...> — try
                # both with prefix discovery.
                group_prefix = "/aws/ec2"
            else:
                return []

            # Discover up to 5 matching log groups under the prefix
            resp = cwlogs.describe_log_groups(logGroupNamePrefix=group_prefix, limit=5)
            groups = [g['logGroupName'] for g in resp.get('logGroups', [])]
            if not groups:
                # Fall back to broader prefix for ec2 (CloudWatchAgent*)
                if kind == 'ec2':
                    resp = cwlogs.describe_log_groups(logGroupNamePrefix='CloudWatchAgent', limit=5)
                    groups = [g['logGroupName'] for g in resp.get('logGroups', [])]
                if not groups:
                    return []

            entries = []
            for gname in groups[:3]:  # cap to 3 groups to keep token cost bounded
                try:
                    flt = cwlogs.filter_log_events(
                        logGroupName=gname,
                        startTime=start_ts * 1000,
                        endTime=end_ts * 1000,
                        limit=max(1, limit // max(len(groups), 1)),
                    )
                    for e in flt.get('events', []):
                        entries.append((e.get('timestamp', 0), e.get('message', '')[:500]))
                except Exception as inner:
                    logger.warning(f"CW Logs filter failed for {gname}: {inner}")
            entries.sort(key=lambda x: -x[0])
            return entries[:limit]
        except Exception as e:
            logger.warning(f"CloudWatch Logs fetch failed: {e}")
            return []

    def _fetch_alert_history(alertname):
        """Query Prometheus for prior fires of this alertname (last 24h)."""
        try:
            q = f'count_over_time(ALERTS{{alertname="{alertname}",alertstate="firing"}}[24h])'
            url = f"{PROMETHEUS_URL}/api/v1/query?query={urllib.parse.quote(q)}"
            with urllib.request.urlopen(url, timeout=5) as resp:
                data = json.loads(resp.read())
            results = data.get('data', {}).get('result', [])
            if results:
                return int(float(results[0].get('value', [0, 0])[1]))
        except Exception as e:
            logger.warning(f"Prometheus query failed: {e}")
        return 0

    def _alert_still_firing(alert):
        """True if this alert is STILL firing right now (per Prometheus ALERTS).
        Used to suppress diagnosis+email for TRANSIENT alerts that already
        resolved by the time the advisor gets to them — e.g. a DaemonSet rollout
        that finished, a pod that recovered, a node that came back. No point
        emailing a diagnosis of something that's already gone. (Owner ask
        2026-06-19.) Fail-OPEN: if the check itself fails, return True so we never
        silently drop a real alert because Prometheus was briefly unreachable."""
        labels = alert.get('labels', {}) or {}
        alertname = labels.get('alertname', '')
        if not alertname:
            return True
        sel = f'alertname="{alertname}",alertstate="firing"'
        ns = labels.get('namespace')
        if ns:
            sel += f',namespace="{ns}"'
        try:
            q = f'ALERTS{{{sel}}}'
            url = f"{PROMETHEUS_URL}/api/v1/query?query={urllib.parse.quote(q)}"
            with urllib.request.urlopen(url, timeout=5) as resp:
                data = json.loads(resp.read())
            return len(data.get('data', {}).get('result', [])) > 0
        except Exception as e:
            logger.warning(f"still-firing check failed for {alertname}: {e}")
            return True

    def _past_actions_for_alert(alertname, days=7):
        """Query Loki for the advisor's past actions on this alertname,
        and any verification outcomes that followed. Returns a compact
        summary the LLM can use to avoid repeating known-bad actions.

        Returns dict like:
          {
            'action_attempts': [
              {'ts': ..., 'action_type': 'delete_completed_jobs',
               'mode': 'single', 'confidence': 0.72, 'event': 'auto_executed'},
              ...
            ],
            'verification_outcomes': {
              'delete_completed_jobs': {'passed': 3, 'failed': 1, 'uncertain': 0},
              ...
            },
            'summary': '3 attempts at delete_completed_jobs in last 7d, 2 cleared, 1 failed'
          }
        """
        try:
            q = (f'{{namespace="auto-remediation"}} | json | tag="ai_advisor" '
                 f'| alertname="{alertname}" '
                 f'| event=~"auto_executed|approved_executed|verification_(passed|failed|uncertain)"')
            now_ns = int(datetime.now(timezone.utc).timestamp() * 1_000_000_000)
            start_ns = now_ns - days * 86400 * 1_000_000_000
            params = urllib.parse.urlencode({
                'query': q,
                'start': str(start_ns),
                'end': str(now_ns),
                'limit': '50',
                'direction': 'backward',
            })
            url = f"{LOKI_URL}/loki/api/v1/query_range?{params}"
            with urllib.request.urlopen(url, timeout=10) as resp:
                data = json.loads(resp.read())
            entries = []
            for stream in data.get('data', {}).get('result', []):
                for ts_ns, line in stream.get('values', []):
                    try:
                        entries.append(json.loads(line))
                    except json.JSONDecodeError:
                        continue
            # Aggregate verification outcomes per action_type
            verif = {}
            attempts = []
            for e in entries:
                ev = e.get('event', '')
                at = e.get('action_type', '?')
                if ev in ('auto_executed', 'approved_executed'):
                    attempts.append({
                        'ts': e.get('ts', ''),
                        'action_type': at,
                        'mode': e.get('mode', ''),
                        'confidence': e.get('confidence'),
                        'event': ev,
                    })
                elif ev.startswith('verification_'):
                    outcome = ev.replace('verification_', '')
                    bucket = verif.setdefault(at, {'passed': 0, 'failed': 0, 'uncertain': 0})
                    bucket[outcome] = bucket.get(outcome, 0) + 1
            # Human summary line
            parts = []
            for at, counts in verif.items():
                total = sum(counts.values())
                if total > 0:
                    parts.append(f"{at}: {counts.get('passed', 0)}/{total} cleared")
            summary = ('; '.join(parts) if parts
                       else (f"{len(attempts)} attempts in last {days}d, no verification data yet"
                             if attempts else f"no advisor action history for {alertname} in last {days}d"))
            return {
                'action_attempts': attempts[:20],   # cap context size
                'verification_outcomes': verif,
                'summary': summary,
            }
        except Exception as e:
            logger.warning(f"_past_actions_for_alert error: {e}")
            return {'error': str(e)}

    def _build_context(alert):
        """Gather context the LLM needs to diagnose this alert."""
        labels = alert.get('labels', {})
        annotations = alert.get('annotations', {})
        namespace = labels.get('namespace')
        pod = labels.get('pod')
        alertname = labels.get('alertname', 'unknown')

        ctx = {
            'alert': {
                'alertname': alertname,
                'labels': labels,
                'annotations': annotations,
                'startsAt': alert.get('startsAt'),
                'status': alert.get('status'),
            },
            'pod_logs': [],
            'loki_window': [],
            'k8s_events': [],
            'history': {},
        }

        # Pod logs if namespace/pod given
        if namespace and pod:
            try:
                logs = v1.read_namespaced_pod_log(
                    name=pod, namespace=namespace,
                    tail_lines=100, timestamps=True,
                )
                ctx['pod_logs'] = logs.splitlines()[-100:]
            except Exception as e:
                ctx['pod_logs_error'] = str(e)

        # Loki window: 5min before, 1min after alert.startsAt by
        # default. Widen to 36h for backup/sync alerts (component=
        # backup OR known-backup alertnames) since backup runs are
        # infrequent — the actual failure may be hours before the
        # staleness alert fires.
        try:
            starts_at = alert.get('startsAt', '')
            if starts_at:
                start_dt = datetime.fromisoformat(starts_at.replace('Z', '+00:00'))
                is_backup_alert = (
                    labels.get('component') == 'backup'
                    or any(kw in alertname.lower() for kw in (
                        'backup', 'sync', 'rclone', 'velero', 'kopia',
                        'barman', 'cnpg', 'unificertsync', 's3sync',
                    ))
                )
                window_min = (60 * 36) if is_backup_alert else 5
                start_ts = int((start_dt - timedelta(minutes=window_min)).timestamp())
                end_ts = int((start_dt + timedelta(minutes=1)).timestamp())
                if namespace and pod:
                    q = '{namespace="%s",pod="%s"}' % (namespace, pod)
                elif namespace:
                    # No pod (typical for CronJob alerts since
                    # Alertmanager only knows the rule name, not the
                    # ephemeral pod). Query the whole namespace.
                    q = '{namespace="%s"}' % namespace
                elif labels.get('component') == 'backup' or is_backup_alert:
                    # No namespace on the alert (some custom-metric
                    # alerts publish only `share=` / `target=` labels).
                    # `component` is a Prometheus alert label, NOT a
                    # Loki log label — querying {component=...} returns
                    # nothing. Map to the actual backup workload
                    # namespaces instead.
                    q = '{namespace=~"backups|velero|rclone|postgres|unifi-cert-sync"}'
                else:
                    # No useful selector — leave loki_window empty
                    # rather than feeding the LLM noise from default ns.
                    q = None
                if q:
                    ctx['loki_window'] = _fetch_loki_window(q, start_ts, end_ts, limit=150)
                else:
                    ctx['loki_window'] = []
                ctx['loki_query_used'] = q or '(none — no usable selector)'
                ctx['loki_window_minutes'] = window_min
        except Exception as e:
            ctx['loki_error'] = str(e)

        # K8s events for the target
        if namespace:
            try:
                events = v1.list_namespaced_event(
                    namespace=namespace,
                    field_selector=(f"involvedObject.name={pod}" if pod else None),
                    limit=30,
                )
                ctx['k8s_events'] = [
                    {'type': e.type, 'reason': e.reason, 'message': e.message, 'lastTimestamp': str(e.last_timestamp)}
                    for e in events.items[-30:]
                ]
            except Exception as e:
                ctx['k8s_events_error'] = str(e)

        # History — alert fires + advisor actions over last 7d
        ctx['history']['last_24h_fires'] = _fetch_alert_history(alertname)
        # Cross-session memory: surface past advisor actions on THIS alertname
        # so Claude knows "we tried delete_completed_jobs 4× last week, 3
        # cleared the alert, 1 didn't" — informs whether to repeat the same
        # action or try something different.
        try:
            ctx['history']['past_actions'] = _past_actions_for_alert(alertname, days=7)
        except Exception as e:
            ctx['history']['past_actions_error'] = str(e)

        # M45 Phase B: if the alert references an AWS-side resource,
        # pull a CloudWatch Logs window so the LLM sees Lambda /
        # EC2-agent logs alongside on-prem context. Bounded by the
        # same start/end times as the Loki window.
        aws_hint = _alert_is_aws(alert)
        if aws_hint:
            try:
                starts_at = alert.get('startsAt', '')
                if starts_at:
                    start_dt = datetime.fromisoformat(starts_at.replace('Z', '+00:00'))
                    start_ts = int((start_dt - timedelta(minutes=10)).timestamp())
                    end_ts = int((start_dt + timedelta(minutes=1)).timestamp())
                    ctx['cloudwatch'] = {
                        'aws_resource': aws_hint,
                        'window': _fetch_cloudwatch_logs(aws_hint, start_ts, end_ts),
                    }
            except Exception as e:
                ctx['cloudwatch_error'] = str(e)

        return ctx

    def _call_anthropic(system_prompt, user_payload):
        """Call the Anthropic Messages API. Returns (parsed_json, usage_dict)
        or (None, None) on failure."""
        body = json.dumps({
            'model': AI_MODEL,
            'max_tokens': 1024,
            'system': system_prompt,
            'messages': [{'role': 'user', 'content': json.dumps(user_payload, default=str)}],
        }).encode('utf-8')
        req = urllib.request.Request(
            'https://api.anthropic.com/v1/messages',
            data=body, method='POST',
            headers={
                'Content-Type': 'application/json',
                'x-api-key': ANTHROPIC_API_KEY,
                'anthropic-version': '2023-06-01',
            },
        )
        try:
            with urllib.request.urlopen(req, timeout=30) as resp:
                result = json.loads(resp.read())
            content = ''.join(b.get('text', '') for b in result.get('content', []))
            usage = result.get('usage', {})
            # Claude often wraps JSON in ```json fences; strip them.
            if '```' in content:
                start = content.find('{')
                end = content.rfind('}')
                if start >= 0 and end > start:
                    content = content[start:end+1]
            return json.loads(content), usage
        except urllib.error.HTTPError as e:
            logger.error(f"Anthropic API HTTP error: {e.code} {e.read().decode('utf-8', 'ignore')[:500]}")
            return None, None
        except (urllib.error.URLError, TimeoutError) as e:
            logger.error(f"Anthropic API network error: {e}")
            return None, None
        except (json.JSONDecodeError, KeyError) as e:
            logger.error(f"Failed to parse Anthropic response: {e}")
            return None, None

    # ===================================================================
    # Tool-use mode (Anthropic Messages API tools)
    # ===================================================================
    # Per the user's "log event → MORE RESEARCH → root cause" spec,
    # alerts labeled `ai_advisor_mode: "deep"` get a multi-turn Claude
    # call where Claude can iteratively call tools (query Loki, read
    # pod logs, list events, etc.) until it has enough evidence to
    # propose a confident action. Single-call mode (default) still
    # works for simpler alerts where cost > value of iteration.
    # ===================================================================

    # Per-call iteration cap. Bounded to keep cost predictable —
    # at ~$0.06/call typical, 10 iterations = ~$0.60 worst case per
    # alert. Daily cap ($0.50 default) still applies on top.
    AI_DEEP_MAX_ITERATIONS = int(os.environ.get('AI_DEEP_MAX_ITERATIONS', '10'))

    def _advisor_tools():
        """Return JSON schemas for tools Claude can call in deep mode.
        Each tool maps to a function in _dispatch_tool below."""
        return [
            {
                'name': 'query_loki',
                'description': 'Run a LogQL query against the in-cluster Loki. Use this to read application logs, syslog, or any log stream. Examples: {namespace="postgres"} |~ "ERROR", {job="syslog", source_ip="10.10.200.1"}',
                'input_schema': {
                    'type': 'object',
                    'properties': {
                        'query': {'type': 'string', 'description': 'LogQL query (with stream selector + optional filters/parsers)'},
                        'since_min': {'type': 'integer', 'description': 'Lookback window in minutes (default 30, max 1440)', 'default': 30},
                        'limit': {'type': 'integer', 'description': 'Max log lines (default 50, max 200)', 'default': 50},
                    },
                    'required': ['query'],
                },
            },
            {
                'name': 'query_prometheus',
                'description': 'Run a PromQL instant query. Use this to check current values of metrics — pod status, node usage, alert state, custom app metrics.',
                'input_schema': {
                    'type': 'object',
                    'properties': {
                        'query': {'type': 'string', 'description': 'PromQL query'},
                    },
                    'required': ['query'],
                },
            },
            {
                'name': 'list_pods',
                'description': 'List pods in a namespace, optionally filtered by label selector. Returns name, status, restart count, age, node.',
                'input_schema': {
                    'type': 'object',
                    'properties': {
                        'namespace': {'type': 'string'},
                        'label_selector': {'type': 'string', 'description': 'K8s label selector, e.g. "app=foo" (optional)', 'default': ''},
                    },
                    'required': ['namespace'],
                },
            },
            {
                'name': 'read_pod_logs',
                'description': 'Read the last N lines of logs from a pod. Use this when you have a specific pod that you suspect is failing — the stack trace is usually in the last line before crash.',
                'input_schema': {
                    'type': 'object',
                    'properties': {
                        'namespace': {'type': 'string'},
                        'pod_name': {'type': 'string'},
                        'container': {'type': 'string', 'description': 'Container name (optional — defaults to first container)', 'default': ''},
                        'tail_lines': {'type': 'integer', 'description': 'Number of lines from end (default 100, max 500)', 'default': 100},
                        'previous': {'type': 'boolean', 'description': 'Read logs from the previous (crashed) container instance, not current. Use when pod is in CrashLoopBackOff.', 'default': False},
                    },
                    'required': ['namespace', 'pod_name'],
                },
            },
            {
                'name': 'describe_resource',
                'description': 'Get detailed status + recent events for a K8s resource. Equivalent of `kubectl describe`. Returns events, conditions, current status.',
                'input_schema': {
                    'type': 'object',
                    'properties': {
                        'kind': {'type': 'string', 'enum': ['pod', 'deployment', 'statefulset', 'job', 'cronjob', 'pvc', 'node'], 'description': 'Resource kind'},
                        'namespace': {'type': 'string', 'description': 'Required for namespaced kinds; empty for node'},
                        'name': {'type': 'string'},
                    },
                    'required': ['kind', 'name'],
                },
            },
            {
                'name': 'list_recent_events',
                'description': 'List recent K8s events in a namespace (or cluster-wide if empty). Events surface things like pod scheduling failures, image pull errors, volume mount issues.',
                'input_schema': {
                    'type': 'object',
                    'properties': {
                        'namespace': {'type': 'string', 'description': 'Namespace or empty for all-namespaces', 'default': ''},
                        'since_min': {'type': 'integer', 'description': 'Lookback minutes (default 30, max 360)', 'default': 30},
                        'type_filter': {'type': 'string', 'enum': ['', 'Warning', 'Normal'], 'description': 'Filter by event type', 'default': ''},
                    },
                },
            },
            {
                'name': 'list_recent_alerts',
                'description': 'List currently-firing alerts (optionally filtered by alertname) from Alertmanager. Use this to find correlated alerts that might share a root cause.',
                'input_schema': {
                    'type': 'object',
                    'properties': {
                        'alertname_filter': {'type': 'string', 'description': 'Optional alertname substring filter', 'default': ''},
                    },
                },
            },
            {
                'name': 'search_git_log',
                'description': 'Search the infra repo commit history for past fixes. Use this on recurring alerts — query by alertname, error keyword, or component to find the commit that fixed it before. Returns sha, date, author, subject, and first ~20 lines of the commit body. Backed by the GitHub Search API.',
                'input_schema': {
                    'type': 'object',
                    'properties': {
                        'query': {'type': 'string', 'description': 'Keywords for git log --grep (alertname, error keyword, component, etc.)'},
                        'days': {'type': 'integer', 'description': 'Lookback window in days (default 365)', 'default': 365},
                        'max_results': {'type': 'integer', 'description': 'Max commits to return (default 10, max 25)', 'default': 10},
                    },
                    'required': ['query'],
                },
            },
            {
                'name': 'read_runbook',
                'description': 'Read an operator-curated runbook from docs/runbooks/. Call this BEFORE proposing an action for any alert — the runbook (if present) names known root causes + the verified fix. Tries docs/runbooks/alerts/<name>.md first, then docs/runbooks/<name>.md. <name> can be the alertname or a topic slug, no .md extension.',
                'input_schema': {
                    'type': 'object',
                    'properties': {
                        'name': {'type': 'string', 'description': 'Runbook name (alertname or slug, no .md extension)'},
                    },
                    'required': ['name'],
                },
            },
        ]

    def _dispatch_tool(name, args):
        """Execute a tool call from Claude. Returns a string result (will be
        sent back as tool_result content)."""
        try:
            if name == 'query_loki':
                q = str(args.get('query', ''))[:500]
                since = min(int(args.get('since_min', 30) or 30), 1440)
                limit = min(int(args.get('limit', 50) or 50), 200)
                now = int(datetime.now(timezone.utc).timestamp() * 1_000_000_000)
                start = now - since * 60 * 1_000_000_000
                lines = _fetch_loki_window(q, start, now, limit=limit) or []
                if not lines:
                    return f'(no log lines for query in last {since}min)'
                return '\n'.join(f'  {line[:300]}' for line in lines[:limit])

            if name == 'query_prometheus':
                q = str(args.get('query', ''))[:500]
                url = f"{PROMETHEUS_URL}/api/v1/query?query={urllib.parse.quote(q)}"
                with urllib.request.urlopen(url, timeout=10) as r:
                    data = json.loads(r.read())
                results = data.get('data', {}).get('result', [])
                if not results:
                    return '(no result)'
                # Compact: metric labels + value, max 20 rows
                lines = []
                for r in results[:20]:
                    labels = ','.join(f'{k}={v}' for k, v in r.get('metric', {}).items() if k != '__name__')
                    val = r.get('value', [None, None])[1]
                    lines.append(f'  {labels} → {val}')
                if len(results) > 20:
                    lines.append(f'  ...({len(results)-20} more)')
                return '\n'.join(lines)

            if name == 'list_pods':
                ns = str(args.get('namespace', ''))
                sel = str(args.get('label_selector', ''))
                pods = v1.list_namespaced_pod(ns, label_selector=sel) if sel else v1.list_namespaced_pod(ns)
                if not pods.items:
                    return f'(no pods in {ns} matching {sel!r})'
                lines = []
                for p in pods.items[:30]:
                    age_s = (datetime.now(timezone.utc) - p.metadata.creation_timestamp).total_seconds()
                    age = f"{int(age_s // 3600)}h" if age_s >= 3600 else f"{int(age_s // 60)}m"
                    restarts = sum(cs.restart_count for cs in (p.status.container_statuses or []))
                    lines.append(f'  {p.metadata.name}\tphase={p.status.phase}\trestarts={restarts}\tage={age}\tnode={p.spec.node_name or "?"}')
                return '\n'.join(lines)

            if name == 'read_pod_logs':
                ns = str(args.get('namespace', ''))
                pod = str(args.get('pod_name', ''))
                container = str(args.get('container', '')) or None
                tail = min(int(args.get('tail_lines', 100) or 100), 500)
                prev = bool(args.get('previous', False))
                logs = v1.read_namespaced_pod_log(
                    pod, ns,
                    container=container,
                    tail_lines=tail,
                    previous=prev,
                    timestamps=False,
                )
                # Trim to ~12k chars to avoid swamping context
                if len(logs) > 12000:
                    logs = logs[-12000:]
                    logs = '...(truncated)...\n' + logs
                return logs or '(empty)'

            if name == 'describe_resource':
                kind = str(args.get('kind', '')).lower()
                ns = str(args.get('namespace', ''))
                nm = str(args.get('name', ''))
                # Get the resource + its recent events
                getters = {
                    'pod': lambda: v1.read_namespaced_pod(nm, ns),
                    'deployment': lambda: apps_v1.read_namespaced_deployment(nm, ns),
                    'statefulset': lambda: apps_v1.read_namespaced_stateful_set(nm, ns),
                    'job': lambda: batch_v1.read_namespaced_job(nm, ns),
                    'cronjob': lambda: batch_v1.read_namespaced_cron_job(nm, ns),
                    'pvc': lambda: v1.read_namespaced_persistent_volume_claim(nm, ns),
                    'node': lambda: v1.read_node(nm),
                }
                if kind not in getters:
                    return f'unknown kind {kind!r}'
                obj = getters[kind]()
                # Summarize: status conditions + first 80 lines of YAML
                out = {
                    'name': obj.metadata.name,
                    'namespace': getattr(obj.metadata, 'namespace', None),
                    'status_phase': getattr(obj.status, 'phase', None),
                    'creation_timestamp': str(obj.metadata.creation_timestamp),
                    'labels': obj.metadata.labels or {},
                    'conditions': [
                        {'type': c.type, 'status': c.status, 'reason': getattr(c, 'reason', ''), 'message': getattr(c, 'message', '')[:200]}
                        for c in (getattr(obj.status, 'conditions', None) or [])
                    ],
                }
                # Recent events for this object
                field_sel = f'involvedObject.name={nm},involvedObject.kind={kind.capitalize()}'
                events = v1.list_namespaced_event(ns, field_selector=field_sel) if ns else v1.list_event_for_all_namespaces(field_selector=field_sel)
                out['recent_events'] = [
                    {'type': e.type, 'reason': e.reason, 'message': e.message[:200], 'count': e.count, 'last_seen': str(e.last_timestamp)}
                    for e in events.items[-10:]
                ]
                return json.dumps(out, indent=2, default=str)[:8000]

            if name == 'list_recent_events':
                ns = str(args.get('namespace', ''))
                since = min(int(args.get('since_min', 30) or 30), 360)
                tf = str(args.get('type_filter', ''))
                cutoff = datetime.now(timezone.utc) - timedelta(minutes=since)
                events = v1.list_namespaced_event(ns) if ns else v1.list_event_for_all_namespaces()
                rows = []
                for e in events.items:
                    if e.last_timestamp and e.last_timestamp < cutoff:
                        continue
                    if tf and e.type != tf:
                        continue
                    rows.append(f"  {e.type}/{e.reason}\t{e.involved_object.kind}/{e.involved_object.name}\tcount={e.count}\t{e.message[:150]}")
                    if len(rows) >= 40:
                        break
                return '\n'.join(rows) if rows else f'(no events in last {since}min)'

            if name == 'list_recent_alerts':
                af = str(args.get('alertname_filter', ''))
                req = urllib.request.Request(f"{ALERTMANAGER_URL}/api/v2/alerts?active=true")
                with urllib.request.urlopen(req, timeout=10) as r:
                    alerts = json.loads(r.read())
                rows = []
                for a in alerts:
                    nm = a.get('labels', {}).get('alertname', '?')
                    if af and af.lower() not in nm.lower():
                        continue
                    sev = a.get('labels', {}).get('severity', '?')
                    ns = a.get('labels', {}).get('namespace', '-')
                    starts = a.get('startsAt', '')[:19]
                    rows.append(f'  {sev}\t{nm}\tns={ns}\tsince={starts}')
                    if len(rows) >= 30:
                        break
                return '\n'.join(rows) if rows else '(no active alerts matching filter)'

            if name == 'search_git_log':
                return _tool_search_git_log(args)

            if name == 'read_runbook':
                return _tool_read_runbook(args)

            return f'unknown tool {name!r}'
        except Exception as e:
            logger.error(f"_dispatch_tool {name} error: {e}")
            return f'ERROR: {type(e).__name__}: {str(e)[:200]}'

    def _github_request(url, accept='application/vnd.github+json'):
        """Authenticated GET against GitHub API/raw, returns (status, body_bytes)."""
        req = urllib.request.Request(url, headers={
            'Accept': accept,
            'User-Agent': 'wind-auto-remediation',
        })
        if GITHUB_TOKEN:
            req.add_header('Authorization', f'Bearer {GITHUB_TOKEN}')
        try:
            with urllib.request.urlopen(req, timeout=10) as r:
                return r.status, r.read()
        except urllib.error.HTTPError as e:
            return e.code, e.read()

    def _tool_search_git_log(args):
        q = str(args.get('query', '')).strip()
        if not q:
            return json.dumps({'error': 'query is required'})
        days = max(1, int(args.get('days', 365) or 365))
        max_results = min(max(1, int(args.get('max_results', 10) or 10)), 25)
        since = (datetime.now(timezone.utc) - timedelta(days=days)).strftime('%Y-%m-%d')
        # GitHub Search API expects `+` as the AND join inside `q=`, so we
        # build the query manually rather than urlencoding spaces to %20.
        terms = urllib.parse.quote(q, safe='') + f'+repo:{GITHUB_REPO}+committer-date:>={since}'
        url = f'https://api.github.com/search/commits?q={terms}&per_page={max_results}&sort=committer-date&order=desc'
        try:
            status, body = _github_request(url)
        except (urllib.error.URLError, TimeoutError) as e:
            return json.dumps({'error': f'github network error: {e}'})
        if status == 422:
            return json.dumps({'error': f'invalid query (422): {body[:200].decode("utf-8", "ignore")}'})
        if status == 403:
            return json.dumps({'error': 'github rate limit (403) — token may be missing or exhausted'})
        if status >= 400:
            return json.dumps({'error': f'github http {status}: {body[:200].decode("utf-8", "ignore")}'})
        try:
            data = json.loads(body)
        except json.JSONDecodeError:
            return json.dumps({'error': 'github returned non-json'})
        items = []
        for it in data.get('items', [])[:max_results]:
            commit = it.get('commit', {}) or {}
            message = commit.get('message', '') or ''
            subject, _, rest = message.partition('\n')
            body_preview = '\n'.join(rest.lstrip('\n').splitlines()[:20])
            items.append({
                'sha': (it.get('sha') or '')[:12],
                'date': (commit.get('committer', {}) or {}).get('date', ''),
                'author': (commit.get('author', {}) or {}).get('name', ''),
                'subject': subject[:200],
                'body_preview': body_preview[:1500],
            })
        if not items:
            return json.dumps({'results': [], 'message': f'no commits matching {q!r} in last {days}d'})
        return json.dumps({'results': items}, indent=2)

    def _tool_read_runbook(args):
        nm = str(args.get('name', '')).strip()
        if not nm:
            return json.dumps({'error': 'name is required'})
        nm = nm.replace('..', '').strip('/').removesuffix('.md')
        candidates = [
            f'docs/runbooks/alerts/{nm}.md',
            f'docs/runbooks/{nm}.md',
        ]
        for path in candidates:
            url = f'https://raw.githubusercontent.com/{GITHUB_REPO}/main/{urllib.parse.quote(path)}'
            try:
                status, body = _github_request(url, accept='text/plain')
            except (urllib.error.URLError, TimeoutError) as e:
                return json.dumps({'error': f'github network error: {e}'})
            if status == 200:
                content = body.decode('utf-8', 'replace')
                if len(content) > 16384:
                    content = content[:16384] + '\n...(truncated at 16KB)'
                return json.dumps({'path': path, 'content': content})
            if status == 403:
                return json.dumps({'error': 'github rate limit (403)'})
        return json.dumps({'error': f'not found at either {candidates[0]} or {candidates[1]}'})

    def _call_anthropic_with_tools(system_prompt, initial_user_payload, max_iter=None):
        """Multi-turn Claude call with tool-use. Returns (parsed_final_json,
        total_usage_dict, tool_call_log)."""
        max_iter = max_iter or AI_DEEP_MAX_ITERATIONS
        tools = _advisor_tools()
        # Conversation state
        messages = [{'role': 'user', 'content': json.dumps(initial_user_payload, default=str)}]
        total_usage = {'input_tokens': 0, 'output_tokens': 0}
        tool_log = []

        for turn in range(max_iter):
            body = json.dumps({
                'model': AI_MODEL,
                'max_tokens': 2048,
                'system': system_prompt,
                'tools': tools,
                'messages': messages,
            }).encode('utf-8')
            req = urllib.request.Request(
                'https://api.anthropic.com/v1/messages',
                data=body, method='POST',
                headers={
                    'Content-Type': 'application/json',
                    'x-api-key': ANTHROPIC_API_KEY,
                    'anthropic-version': '2023-06-01',
                },
            )
            try:
                with urllib.request.urlopen(req, timeout=60) as resp:
                    result = json.loads(resp.read())
            except urllib.error.HTTPError as e:
                logger.error(f"Anthropic tool-use HTTP error: {e.code} {e.read().decode('utf-8', 'ignore')[:500]}")
                return None, total_usage, tool_log
            except (urllib.error.URLError, TimeoutError) as e:
                logger.error(f"Anthropic tool-use network error: {e}")
                return None, total_usage, tool_log

            usage = result.get('usage', {})
            total_usage['input_tokens'] += usage.get('input_tokens', 0)
            total_usage['output_tokens'] += usage.get('output_tokens', 0)

            content_blocks = result.get('content', [])
            stop_reason = result.get('stop_reason')

            # Add Claude's response to history
            messages.append({'role': 'assistant', 'content': content_blocks})

            if stop_reason != 'tool_use':
                # Final response — extract JSON from text blocks
                text = ''.join(b.get('text', '') for b in content_blocks if b.get('type') == 'text')
                if '```' in text:
                    s = text.find('{'); e = text.rfind('}')
                    if s >= 0 and e > s:
                        text = text[s:e+1]
                try:
                    return json.loads(text), total_usage, tool_log
                except json.JSONDecodeError as e:
                    logger.error(f"Final response not parseable JSON: {e}; text[:500]={text[:500]!r}")
                    return None, total_usage, tool_log

            # Execute tool calls + send results back
            tool_results = []
            for block in content_blocks:
                if block.get('type') != 'tool_use':
                    continue
                tool_name = block.get('name', '')
                tool_input = block.get('input', {}) or {}
                tool_id = block.get('id', '')
                logger.info(f"tool_use turn={turn} {tool_name}({list(tool_input.keys())})")
                result_text = _dispatch_tool(tool_name, tool_input)
                # Cap result size to avoid blowing context
                if len(result_text) > 10000:
                    result_text = result_text[:10000] + '\n...(truncated)'
                tool_log.append({'turn': turn, 'tool': tool_name, 'input_keys': list(tool_input.keys()), 'result_len': len(result_text)})
                tool_results.append({
                    'type': 'tool_result',
                    'tool_use_id': tool_id,
                    'content': result_text,
                })
            messages.append({'role': 'user', 'content': tool_results})

        logger.warning(f"tool-use loop hit max_iter={max_iter} without final response")
        return None, total_usage, tool_log

    def _validate_response(parsed):
        """Strip any field outside the schema. Enum-check proposed_action.type."""
        if not isinstance(parsed, dict):
            return None
        # Confidence: coerce safely. Claude has been known to send
        # strings ("high"), None, or omit it entirely; raw min/max
        # crashes the caller and the diagnosis silently disappears.
        try:
            _conf = float(parsed.get('confidence', 0.0) or 0.0)
        except (TypeError, ValueError):
            _conf = 0.0
        clean = {
            'diagnosis': str(parsed.get('diagnosis', ''))[:2000],
            'confidence': max(0.0, min(1.0, _conf)),
            'human_summary': str(parsed.get('human_summary', ''))[:2000],
        }
        action = parsed.get('proposed_action', {}) or {}
        atype = action.get('type', 'noop')
        if atype not in AI_ACTION_TYPES_ALLOWED:
            logger.warning(f"AI proposed_action.type='{atype}' rejected (not in allowlist); coercing to noop")
            atype = 'noop'
        # Validate params for the allowed types; downgrade to noop if malformed.
        # Required-fields-per-type table avoids drift: add a new action here
        # at the same time you add the execute function.
        params = action.get('params', {}) or {}
        _required = {
            'restart_pods': {'namespace', 'selector'},
            'scale_deployment_temp': {'namespace', 'deployment'},
            'delete_completed_jobs': {'namespace'},
            'delete_evicted_pods': {'namespace'},
            'trigger_velero_backup_now': {'schedule_name'},
            'trigger_cnpg_backup_now': {'cluster_name'},
            'force_cert_renewal': {'namespace', 'cert_name'},
            'silence_alert_temporarily': {'alertname'},
            'rollout_restart': {'namespace', 'name'},
            'expand_pvc': {'namespace', 'pvc_name'},
            'pause_cronjob': {'namespace', 'name'},
            'unpause_cronjob': {'namespace', 'name'},
            'rollback_deployment': {'namespace', 'name'},
            'cnpg_recreate_replica': {'cluster_name', 'instance'},
            'bump_resource_request': {'namespace', 'deployment', 'container'},
            # Tier 3 SSH:
            'prune_host_logdir': {'host', 'logdir_key'},
            'restart_systemd_unit': {'host', 'unit_key'},
            'journal_vacuum': {'host'},
        }
        if atype != 'noop':
            req = _required.get(atype, set())
            missing = [k for k in req if not params.get(k)]
            if missing:
                logger.warning(f"AI proposed_action.type={atype} missing params {missing}; coercing to noop")
                atype = 'noop'
                params = {}
            else:
                # Namespace denylist check for actions targeting a specific ns.
                # Exemptions: trigger_velero_backup_now (velero ns is its workspace),
                # cnpg_recreate_replica (postgres ns is the data ns, cnpg-system is the
                # operator we deny separately).
                ns = params.get('namespace', '')
                if ns and ns in AI_NAMESPACE_DENYLIST:
                    logger.warning(f"AI proposed_action targets denied ns '{ns}'; coercing to noop")
                    atype = 'noop'
                    params = {}
        clean['proposed_action'] = {
            'type': atype,
            'params': params if atype != 'noop' else {},
            'reasoning': str(action.get('reasoning', ''))[:500],
        }
        return clean

