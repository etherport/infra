apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediation-controller
  namespace: auto-remediation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remediation-controller
  template:
    metadata:
      labels:
        app: remediation-controller
    spec:
      serviceAccountName: remediation-controller
      containers:
      - name: controller
        image: python:3.14-slim # {"$imagepolicy": "flux-system:python-slim"}
        command:
        - /bin/bash
        - -c
        - |
          pip install kubernetes pyyaml boto3
          python /scripts/remediate.py
        ports:
        - containerPort: 8080
          name: webhook
        env:
          # AI Advisor (M41 Phase 1 — advisory-only). Set
          # AI_ADVISOR_ENABLED=true to turn on after populating both
          # the anthropic-api-key and SMTP secrets.
          - name: AI_ADVISOR_ENABLED
            value: "true"
          - name: AI_ADVISOR_DAILY_COST_USD_CAP
            value: "0.50"
          # Phase 2 (approve-via-email). Set to "true" + populate the
          # approval-hmac secret + set APPROVAL_BASE_URL to your Tailscale
          # hostname for the controller. See:
          # docs/runbooks/ai-advisor-phase2-enable.md
          - name: AI_PHASE2_ENABLED
            value: "true"
          - name: APPROVAL_BASE_URL
            value: "https://remediation-approve.tail48f596.ts.net"
          - name: APPROVAL_TTL_HOURS
            value: "24"
          - name: APPROVAL_HMAC_KEY
            valueFrom:
              secretKeyRef:
                name: ai-advisor-approval-hmac
                key: hmac_key
                optional: true
          # M45 Phase B: CloudWatch Logs read for AWS-side alerts.
          # Optional; missing/empty creds = advisor silently skips
          # the CW fetch step (graceful degradation).
          - name: AWS_REGION_PRIMARY
            value: "us-west-2"
          - name: AWS_VPC_CIDR_PREFIX
            value: "10.10.100."
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: ai-advisor-aws-cloudwatch
                key: aws_access_key_id
                optional: true
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: ai-advisor-aws-cloudwatch
                key: aws_secret_access_key
                optional: true
          - name: AI_ADVISOR_MAX_INPUT_TOKENS
            value: "8000"
          - name: AI_ADVISOR_MODEL
            value: "claude-sonnet-4-6"
          - name: EMAIL_TO
            value: "graham.m.smith@me.com"
          - name: EMAIL_FROM
            value: "Etherport AI Advisor <ai-advisor@etherport.net>"
          - name: SMTP_HOST
            value: "email-smtp.us-west-2.amazonaws.com"
          - name: SMTP_PORT
            value: "587"
          - name: LOKI_URL
            value: "http://loki.monitoring.svc.cluster.local:3100"
          - name: PROMETHEUS_URL
            value: "http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
          - name: ANTHROPIC_API_KEY
            valueFrom:
              secretKeyRef:
                name: ai-advisor-anthropic-key
                key: api_key
          - name: SMTP_USER
            valueFrom:
              secretKeyRef:
                name: ai-advisor-smtp
                key: smtp_auth_username
          - name: SMTP_PASS
            valueFrom:
              secretKeyRef:
                name: ai-advisor-smtp
                key: smtp_auth_password
        volumeMounts:
        - name: script
          mountPath: /scripts
        - name: rules
          mountPath: /etc/remediation
        - name: prompts
          mountPath: /etc/prompts
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: script
        configMap:
          name: remediation-script
          defaultMode: 0755
      - name: rules
        configMap:
          name: remediation-rules
      - name: prompts
        configMap:
          name: ai-advisor-prompt
