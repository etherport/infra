apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediation-controller
  namespace: auto-remediation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remediation-controller
  template:
    metadata:
      labels:
        app: remediation-controller
    spec:
      serviceAccountName: remediation-controller
      containers:
      - name: controller
        image: python:3.14-slim@sha256:a7fb1e634c4a578f9e0bd6327f11a3cde11b7a9395f48e24360c0988bcc5c2bc # {"$imagepolicy": "flux-system:python-slim"}
        # M63: conservative container hardening. The controller runs kubectl/paramiko/
        # boto3/pip — all userspace, no privilege escalation or Linux caps needed — so
        # these are safe. Deliberately NOT runAsNonRoot/readOnlyRootFilesystem: the
        # command does `pip install` into the image at startup (needs a writable rootfs)
        # and runs as the image's root; narrowing the user is a separate, riskier change.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        command:
        - /bin/bash
        - -c
        - |
          # kubernetes pinned <31 — same v31+ auth bug as cw2loki on py3.14.
          # paramiko added 2026-05-25 for Tier 3 SSH-based advisor actions
          # (prune_host_logdir, restart_systemd_unit, journal_vacuum).
          pip install 'kubernetes>=30,<31' pyyaml boto3 paramiko
          python /scripts/remediate.py
        ports:
        - containerPort: 8080
          name: webhook
        env:
        # AI Advisor (M41 Phase 1 — advisory-only). Set
        # AI_ADVISOR_ENABLED=true to turn on after populating both
        # the anthropic-api-key and SMTP secrets.
        - name: AI_ADVISOR_ENABLED
          value: "true"
        # $0.50/day — reverted 2026-05-25 from a $5.00 bump that
        # wasn't operator-approved. Re-raise only after explicit
        # discussion if sustained cap-hits become a real problem.
        - name: AI_ADVISOR_DAILY_COST_USD_CAP
          value: "0.50"
        # Phase 2 (approve-via-email). Set to "true" + populate the
        # approval-hmac secret + set APPROVAL_BASE_URL to your Tailscale
        # hostname for the controller. See:
        # docs/runbooks/ai-advisor-phase2-enable.md
        - name: AI_PHASE2_ENABLED
          value: "true"
        # Phase 3 (autonomous execute, opt-in per alert). Kill switch.
        # When "true", alerts carrying `ai_remediation: "auto"` label
        # get auto-executed if confidence + action + namespace clear
        # the guardrails. Default OFF. See:
        # docs/runbooks/ai-advisor-phase3-enable.md
        - name: AI_PHASE3_ENABLED
          value: "true"
        - name: AI_PHASE3_CONFIDENCE_THRESHOLD
          value: "0.85"
        - name: APPROVAL_BASE_URL
          value: "https://approve.etherport.net"
        - name: APPROVAL_TTL_HOURS
          value: "24"
        - name: APPROVAL_HMAC_KEY
          valueFrom:
            secretKeyRef:
              name: ai-advisor-approval-hmac
              key: hmac_key
              optional: true
        # M45 Phase B: CloudWatch Logs read for AWS-side alerts.
        # Optional; missing/empty creds = advisor silently skips
        # the CW fetch step (graceful degradation).
        - name: AWS_REGION_PRIMARY
          value: "us-west-2"
        - name: AWS_VPC_CIDR_PREFIX
          value: "10.10.100."
        # M75 IRSA: read-only CloudWatch via AssumeRoleWithWebIdentity
        # (wind-irsa-cloudwatch-read) instead of a static key. boto3 picks
        # these up from the default chain; _get_logs_client() gates on them.
        - name: AWS_ROLE_ARN
          value: "arn:aws:iam::830881980142:role/wind-irsa-cloudwatch-read"
        - name: AWS_WEB_IDENTITY_TOKEN_FILE
          value: "/var/run/secrets/eks.amazonaws.com/serviceaccount/token"
        - name: AI_ADVISOR_MAX_INPUT_TOKENS
          value: "8000"
        - name: AI_ADVISOR_MODEL
          value: "claude-sonnet-4-6"
        # M139b: deep-mode (multi-turn tool-use root-cause + auto-execute path) runs
        # on the stronger model for diagnosis accuracy; single-call stays on Sonnet.
        # Cost cap unchanged ($0.50/day) — deep-mode Opus calls are priced at Opus
        # rates in the cap math, so at cap the advisor falls back to raw-alert emails.
        - name: AI_ADVISOR_MODEL_DEEP
          value: "claude-opus-4-8"
        - name: EMAIL_TO
          value: "graham.m.smith@me.com"
        - name: EMAIL_FROM
          value: "Etherport AI Advisor <ai-advisor@wind.etherport.net>"
        # Email sends via the SES API (boto3 + IRSA role wind-irsa-cloudwatch-read),
        # not SMTP — no static SMTP creds. Region from AWS_REGION_PRIMARY above.
        - name: LOKI_URL
          value: "http://loki.monitoring.svc.cluster.local:3100"
        - name: PROMETHEUS_URL
          value: "http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-advisor-anthropic-key
              key: api_key
        # Deep-mode institutional-knowledge tools (search_git_log,
        # read_runbook) talk to the GitHub API. Token is optional —
        # without it, requests are unauthenticated and rate-limited
        # to 60/hr per source IP, which is enough for occasional
        # deep-mode calls but will rate-limit under bursts. Create
        # secret `ai-advisor-github` with key `token` to populate
        # (fine-grained PAT, public-repo read access only).
        - name: GITHUB_REPO
          value: "etherport/infra"
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: ai-advisor-github
              key: token
              optional: true
        volumeMounts:
        - name: script
          mountPath: /scripts
        - name: rules
          mountPath: /etc/remediation
        - name: prompts
          mountPath: /etc/prompts
        # Phase 3 SSH key for non-K8s host actions.
        - name: advisor-ssh-key
          mountPath: /etc/advisor-ssh
          readOnly: true
        # M75 IRSA: projected SA token (aud sts.amazonaws.com) for web identity.
        - name: aws-iam-token
          mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
          readOnly: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: script
        configMap:
          name: remediation-script
          defaultMode: 0755
      - name: rules
        configMap:
          name: remediation-rules
      - name: prompts
        configMap:
          name: ai-advisor-prompt
      - name: advisor-ssh-key
        secret:
          secretName: advisor-ssh-key
          defaultMode: 0400
          items:
          - key: id_ed25519
            path: id_ed25519
            mode: 0400
      # M75 IRSA: projected SA token (aud sts.amazonaws.com) for web identity.
      - name: aws-iam-token
        projected:
          sources:
          - serviceAccountToken:
              audience: sts.amazonaws.com
              expirationSeconds: 3600
              path: token
