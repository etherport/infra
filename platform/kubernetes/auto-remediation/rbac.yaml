apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediation-controller
  namespace: auto-remediation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: remediation-controller
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "delete"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
# Events: used by the AI advisor's _build_context() to fetch the
# recent K8s event stream for the alert's target pod. Read-only.
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list"]
# Nodes: in case a node-level alert (NodeNotReady etc) gets handed
# to the advisor — it'll want to read node conditions.
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments", "daemonsets", "statefulsets"]
  verbs: ["get", "list", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments/scale", "statefulsets/scale"]
  verbs: ["get", "update"]
# ReplicaSets: rollback_deployment action lists RS history to find the
# previous revision before patching the Deployment spec back.
- apiGroups: ["apps"]
  resources: ["replicasets"]
  verbs: ["get", "list"]
# Jobs + CronJobs: delete_completed_jobs / prune_completed_jobs scan
# batch.Jobs and delete the failed/completed ones. suspend_cronjob /
# resume_cronjob patch the .spec.suspend field on CronJobs.
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "delete"]
- apiGroups: ["batch"]
  resources: ["cronjobs"]
  verbs: ["get", "list", "patch"]
# PVCs: expand_pvc patches .spec.resources.requests.storage. CNPG replica
# reseed (recreate_replica) deletes the PVC for the failed replica so the
# operator re-provisions it from the primary.
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "patch", "delete"]
# CNPG (postgresql.cnpg.io/v1): cnpg_recreate_replica patches the Cluster
# CR's status to drop a misbehaving replica; the operator reseeds.
- apiGroups: ["postgresql.cnpg.io"]
  resources: ["clusters"]
  verbs: ["get", "patch", "update"]
# Velero: trigger_backup creates an ad-hoc Backup CR off an existing Schedule.
- apiGroups: ["velero.io"]
  resources: ["backups", "schedules"]
  verbs: ["get", "list", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: remediation-controller
subjects:
- kind: ServiceAccount
  name: remediation-controller
  namespace: auto-remediation
roleRef:
  kind: ClusterRole
  name: remediation-controller
  apiGroup: rbac.authorization.k8s.io
