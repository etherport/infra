apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediation-controller
  namespace: auto-remediation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: remediation-controller
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "delete"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
# Events: used by the AI advisor's _build_context() to fetch the
# recent K8s event stream for the alert's target pod. Read-only.
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list"]
# Nodes: in case a node-level alert (NodeNotReady etc) gets handed
# to the advisor — it'll want to read node conditions.
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments", "daemonsets", "statefulsets"]
  verbs: ["get", "list", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments/scale", "statefulsets/scale"]
  verbs: ["get", "update"]
# ReplicaSets: rollback_deployment action lists RS history to find the
# previous revision before patching the Deployment spec back.
- apiGroups: ["apps"]
  resources: ["replicasets"]
  verbs: ["get", "list"]
# Jobs + CronJobs: delete_completed_jobs / prune_completed_jobs scan
# batch.Jobs and delete the failed/completed ones. suspend_cronjob /
# resume_cronjob patch the .spec.suspend field on CronJobs.
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "delete"]
- apiGroups: ["batch"]
  resources: ["cronjobs"]
  verbs: ["get", "list", "patch"]
# PVCs: cluster-wide is EXPAND ONLY (patch) — expand_pvc grows storage,
# recoverable. The DATA-LOSS verb (delete) is NOT here; it is confined to the
# postgres namespace via platform/kubernetes/auto-remediation-rbac/ (H32, 2026-06-11).
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "patch"]
# H32: cnpg cluster patch (cnpg_recreate_replica) and velero backup create
# (trigger_backup) were moved OUT of cluster scope into per-namespace Roles in
# platform/kubernetes/auto-remediation-rbac/ (postgres + velero only), so these
# irreversible/data-affecting verbs are reachable only where they legitimately
# run — not in cnpg-system / rook-ceph / any other namespace.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: remediation-controller
subjects:
- kind: ServiceAccount
  name: remediation-controller
  namespace: auto-remediation
roleRef:
  kind: ClusterRole
  name: remediation-controller
  apiGroup: rbac.authorization.k8s.io
