apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediation-controller
  namespace: auto-remediation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: remediation-controller
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "delete"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
# Events: used by the AI advisor's _build_context() to fetch the
# recent K8s event stream for the alert's target pod. Read-only.
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list"]
# Nodes: in case a node-level alert (NodeNotReady etc) gets handed
# to the advisor — it'll want to read node conditions.
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments", "daemonsets", "statefulsets"]
  verbs: ["get", "list", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments/scale", "statefulsets/scale"]
  verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: remediation-controller
subjects:
- kind: ServiceAccount
  name: remediation-controller
  namespace: auto-remediation
roleRef:
  kind: ClusterRole
  name: remediation-controller
  apiGroup: rbac.authorization.k8s.io
