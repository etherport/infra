apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-approval
  namespace: backups
  labels:
    app: backup-approval
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backup-approval
  template:
    metadata:
      labels:
        app: backup-approval
    spec:
      # Reuse the s3-sync ServiceAccount (proven to pull the shared image). The
      # approval server needs no k8s RBAC — it only talks to S3.
      serviceAccountName: s3-sync
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: approval
          # Same image as the sync job — it already has python3 + aws-cli + jq.
          image: ghcr.io/etherport/aws-s3-sync:main
          imagePullPolicy: Always
          command: ["python3", "/scripts/approval-server.py"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: METADATA_BUCKET
              value: "logs.archive.wind.etherport.net"
            - name: AWS_REGION
              value: "us-west-2"
            - name: AWS_DEFAULT_REGION
              value: "us-west-2"
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: AWS_PAGER
              value: ""
            - name: LISTEN_PORT
              value: "8080"
            - name: APPROVAL_MARKER_TTL_HOURS
              value: "48"
            - name: APPROVAL_TOLERANCE_PERCENT
              value: "10"
            # CF Access enforces identity at the edge and the HMAC token binds each
            # request to a real pending deletion. Kept "false" deliberately:
            # backup-approve resolves split-horizon, so an ON-network operator
            # (home/VPN/Tailscale) reaches the INTERNAL Traefik route, which carries
            # no Cf-Access-Authenticated-User-Email header — turning this on would
            # reject the operator's own approval click. The token in the email is the
            # gate on that path, and (since the M5 fix) is no longer echoed to pod
            # logs. Only set true (+ ALLOWED_EMAILS) if approvals are always done via
            # the external CF-Access URL.
            - name: APPROVAL_REQUIRE_CF_EMAIL
              value: "false"
            - name: APPROVAL_ALLOWED_EMAILS
              value: ""
            # M75 IRSA — short-lived creds via web identity (replaces the
            # aws-backup-credentials static key). AWS_ACCOUNT_ID was provided by
            # that secret (used as EXPECTED_BUCKET_OWNER) — set it explicitly now.
            - name: AWS_ACCOUNT_ID
              value: "830881980142"
            - name: AWS_ROLE_ARN
              value: "arn:aws:iam::830881980142:role/wind-irsa-s3-sync"
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: "/var/run/secrets/eks.amazonaws.com/serviceaccount/token"
            # aws CLI v2 web-identity cache needs a writable $HOME (pod HOME=/).
            - name: HOME
              value: "/tmp"
          envFrom:
            # APPROVAL_HMAC_SECRET — shared with the sync job that mints tokens
            - secretRef:
                name: approval-hmac
          volumeMounts:
            - name: aws-iam-token
              mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        # M75 IRSA: projected SA token (aud sts.amazonaws.com) for web identity.
        - name: aws-iam-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 3600
                  path: token
