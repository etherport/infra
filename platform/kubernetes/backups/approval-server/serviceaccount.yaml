# The `s3-sync` ServiceAccount that backup-approval runs as.
#
# WHY IT LIVES HERE and not in aws-s3/base: the base SA of the same name is only
# ever consumed through the per-share overlays, every one of which applies a
# `namePrefix` (s3-sync-archive-, s3-sync-backups-, …). The rendered cluster
# therefore contains SEVEN prefixed SAs and no plain `s3-sync` — but
# approval-server/deployment.yaml asks for exactly `s3-sync`.
#
# Until 2026-08-14 that name resolved only because a Velero restore
# (post-migration-20260512-2102) had recreated the object in May; it carried no
# Flux ownership and `kubectl kustomize clusters/wind` rendered no replacement.
# A namespace or cluster rebuild from git would have left backup-approval with a
# missing ServiceAccount — pods unschedulable, and the M94 S3 delete-approval
# flow silently down.
#
# The name is load-bearing beyond kubernetes: the M75 IRSA role trust policy
# binds `system:serviceaccount:backups:s3-sync`, so this must stay `s3-sync` for
# the projected-token web-identity exchange in deployment.yaml to keep working.
#
# Deliberately NO imagePullSecrets: ghcr.io/etherport/aws-s3-sync is a public org
# package. The restored object carried a stale `ghcr-etherport` reference to a
# secret deleted during the org-migration cleanup.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s3-sync
  namespace: backups
