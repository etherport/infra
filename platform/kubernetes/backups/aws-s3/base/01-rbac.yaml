apiVersion: v1
kind: ServiceAccount
metadata:
  name: daily-report
  namespace: backups
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: daily-report-reader
  namespace: backups
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: daily-report-reader
  namespace: backups
subjects:
  - kind: ServiceAccount
    name: daily-report
    namespace: backups
roleRef:
  kind: Role
  name: daily-report-reader
  apiGroup: rbac.authorization.k8s.io
