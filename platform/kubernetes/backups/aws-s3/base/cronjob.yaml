apiVersion: batch/v1
kind: CronJob
metadata:
  name: s3-sync-template
  namespace: backups
spec:
  schedule: "0 1 * * *"    # 1:00 AM PT daily
  timeZone: "America/Los_Angeles"
  suspend: false           # Backups run automatically at 1:00 AM PT
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          annotations:
            # Exclude NFS volumes from Velero file-system backup
            backup.velero.io/backup-volumes-excludes: "nfs-src,work"
        spec:
          serviceAccountName: s3-sync
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: ghcr.io/sparked-diamond/aws-s3-sync:main
              imagePullPolicy: Always
              command: ["/bin/bash", "-lc"]
              args:
                - |
                  set -euo pipefail

                  # --- AWS auth preflight ---
                  echo "[preflight] aws sts get-caller-identity" >&2
                  acct="$(aws sts get-caller-identity --query Account --output text)"
                  echo "[preflight] AWS Account: ${acct}" >&2

                  if [[ "${acct}" != "${AWS_ACCOUNT_ID}" ]]; then
                    echo "[preflight] ERROR: AWS account mismatch. Expected ${AWS_ACCOUNT_ID}, got ${acct}" >&2
                    exit 2
                  fi

                  /scripts/sync-and-verify.sh
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: false
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "200m"
                limits:
                  memory: "4Gi"
                  cpu: "2000m"
              env:
                # --- per-share values (overridden by patches) ---
                - name: SHARE_NAME
                  value: "REPLACE_ME"
                - name: SRC_PATH
                  value: "/src"
                - name: DEST_BUCKET
                  value: "archive-test.wind.etherport.net"   # overridden per share
                - name: DEST_PREFIX
                  value: "objects/REPLACE_ME"                # overridden per share
                - name: METADATA_BUCKET
                  value: "logs.archive.wind.etherport.net"   # shared metadata bucket for all shares

                # --- centralized AWS + behavior settings ---
                - name: AWS_REGION
                  value: "us-west-2"
                - name: AWS_DEFAULT_REGION
                  value: "us-west-2"
                - name: AWS_EC2_METADATA_DISABLED
                  value: "true"
                - name: AWS_PAGER
                  value: ""

                # AWS Account ID - centralized definition
                - name: AWS_ACCOUNT_ID
                  value: "830881980142"
                # EXPECTED_BUCKET_OWNER defaults to AWS_ACCOUNT_ID in script

                - name: BATCH_PREFIX
                  value: "batch"

                # Use direct verification only (HEAD requests) to avoid $1/job batch costs
                - name: WAIT_FOR_BATCH
                  value: "false"
                - name: BATCH_POLL_INTERVAL_SECONDS
                  value: "15"
                - name: BATCH_MAX_WAIT_SECONDS
                  value: "7200"

                # Prometheus Pushgateway
                - name: PUSHGATEWAY_URL
                  value: "http://pushgateway.monitoring.svc.cluster.local:9091"
                - name: PUSHGATEWAY_JOB
                  value: "aws-s3-sync"
                - name: DEBUG_PUSHGATEWAY
                  value: "false"
              envFrom:
                - secretRef:
                    name: aws-backup-credentials
                - configMapRef:
                    name: aws-s3-sync-email
              volumeMounts:
                - name: nfs-src
                  mountPath: /src
                  readOnly: true
                - name: work
                  mountPath: /work
          volumes:
            # NFS will be patched per share
            - name: nfs-src
              nfs:
                server: sequoia.wind.etherport.net
                path: /var/nfs/shared/REPLACE_ME
            - name: work
              emptyDir: {}
