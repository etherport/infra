apiVersion: batch/v1
kind: CronJob
metadata:
  name: s3-sync-template
  namespace: backups
spec:
  schedule: "0 1 * * *"    # 1:00 AM PT daily
  timeZone: "America/Los_Angeles"
  suspend: false           # Backups run automatically at 1:00 AM PT
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # 0 = no Job-level retry. The script already retries transient sync
      # failures internally (run_sync_with_retry / SYNC_MAX_RETRIES), so a
      # Job retry mostly just re-ran the terminal guard/approval exits — which
      # re-sent the approval email once per attempt (the "2 emails ~5min apart"
      # symptom). One attempt → one approval email. A genuine infra failure is
      # picked up by the next nightly run.
      backoffLimit: 0
      # GC Job records 25h after they finish. Originally set to 3600
      # (1h) on 2026-05-22 to clear stuck Failed jobs that were
      # producing ~4k KubeJobFailed alertmanager emails — but 1h was
      # too aggressive: the 06:00 PT s3-sync-daily-report enumerates
      # jobs from the last 24h and the 01:00 PT runs were already
      # ttl-deleted by then, producing "no executions in window"
      # emails (caught 2026-05-23). 25h = 24h window + 1h slop.
      # Failed-job noise is handled by alertmanager routing (M8) and
      # InfoInhibitor pruning, not by aggressive TTL.
      ttlSecondsAfterFinished: 90000
      template:
        metadata:
          annotations:
            # Exclude NFS volumes from Velero file-system backup
            backup.velero.io/backup-volumes-excludes: "nfs-src,work"
        spec:
          serviceAccountName: s3-sync
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: ghcr.io/sparked-diamond/aws-s3-sync:main
              imagePullPolicy: Always
              command: ["/bin/bash", "-lc"]
              args:
                - |
                  set -euo pipefail

                  # --- AWS auth preflight ---
                  echo "[preflight] aws sts get-caller-identity" >&2
                  acct="$(aws sts get-caller-identity --query Account --output text)"
                  echo "[preflight] AWS Account: ${acct}" >&2

                  if [[ "${acct}" != "${AWS_ACCOUNT_ID}" ]]; then
                    echo "[preflight] ERROR: AWS account mismatch. Expected ${AWS_ACCOUNT_ID}, got ${acct}" >&2
                    exit 2
                  fi

                  /scripts/sync-and-verify.sh
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: false
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "200m"
                  # Bound node-local scratch (the `work` emptyDir holds one JSON
                  # per uploaded object + sync/dest listings). Without a limit a
                  # huge share could fill node ephemeral storage and trigger a
                  # node-wide disk-pressure eviction; with it, only this pod is
                  # evicted (a clean, bounded failure).
                  ephemeral-storage: "1Gi"
                limits:
                  memory: "4Gi"
                  cpu: "2000m"
                  ephemeral-storage: "8Gi"
              env:
                # --- per-share values (overridden by patches) ---
                - name: SHARE_NAME
                  value: "REPLACE_ME"
                - name: SRC_PATH
                  value: "/src"
                - name: DEST_BUCKET
                  value: "archive-test.wind.etherport.net"   # overridden per share
                - name: DEST_PREFIX
                  value: "objects/REPLACE_ME"                # overridden per share
                - name: METADATA_BUCKET
                  value: "logs.archive.wind.etherport.net"   # shared metadata bucket for all shares

                # --- centralized AWS + behavior settings ---
                - name: AWS_REGION
                  value: "us-west-2"
                - name: AWS_DEFAULT_REGION
                  value: "us-west-2"
                - name: AWS_EC2_METADATA_DISABLED
                  value: "true"
                - name: AWS_PAGER
                  value: ""

                # AWS Account ID - centralized definition
                - name: AWS_ACCOUNT_ID
                  value: "830881980142"
                # EXPECTED_BUCKET_OWNER defaults to AWS_ACCOUNT_ID in script

                - name: BATCH_PREFIX
                  value: "batch"

                # Use direct verification only (HEAD requests) to avoid $1/job batch costs
                - name: WAIT_FOR_BATCH
                  value: "false"
                - name: BATCH_POLL_INTERVAL_SECONDS
                  value: "15"
                - name: BATCH_MAX_WAIT_SECONDS
                  value: "7200"

                # --- Destructive-delete safety guard ---
                # aws s3 sync --delete mirrors source deletions to S3. These
                # guards refuse a destructive run when the source looks
                # empty/unmounted or when a single run would delete an
                # anomalous volume of objects (catches a downed NAS share
                # wiping the backup). Legit small deletions pass through.
                # Defaults live in sync-and-verify.sh; set here for visibility
                # and easy per-share override via patches.
                - name: DELETE_GUARD_ENABLED
                  value: "true"
                - name: DELETE_GUARD_MIN_SOURCE_ENTRIES
                  value: "1"          # abort if /src has fewer top-level entries (empty/unmounted)
                - name: DELETE_GUARD_MAX_PERCENT
                  value: "10"         # abort if > this % of dest objects would be deleted
                - name: DELETE_GUARD_MAX_ABSOLUTE
                  value: "1000"       # abort if > this many objects would be deleted in one run (0=off)
                - name: DELETE_GUARD_MIN_DEST_FOR_PERCENT
                  value: "50"         # only apply the % rule when dest has at least this many objects

                # --- Delete-approval flow (human-in-the-loop via CF Access) ---
                # When the guard trips, the sync writes a pending-deletion record
                # + emails a signed "Review & approve" button (backup-approve
                # hostname, behind CF Access). Approving drops a scoped one-time
                # marker the next run consumes. APPROVAL_HMAC_SECRET comes from the
                # approval-hmac secret (envFrom below), shared with the server.
                - name: APPROVAL_ENABLED
                  value: "true"
                - name: APPROVAL_BASE_URL
                  value: "https://backup-approve.wind.etherport.net"

                # Prometheus Pushgateway
                - name: PUSHGATEWAY_URL
                  value: "http://pushgateway.monitoring.svc.cluster.local:9091"
                - name: PUSHGATEWAY_JOB
                  value: "aws-s3-sync"
                - name: DEBUG_PUSHGATEWAY
                  value: "false"

                # M75 IRSA: short-lived creds via AssumeRoleWithWebIdentity (aws CLI
                # v2 picks these up from the default chain). Replaces the static key
                # that came from the aws-backup-credentials secret (removed from
                # envFrom below). AWS_ACCOUNT_ID/AWS_REGION are set explicitly above,
                # so dropping that secret is safe; S3_BATCH_ROLE_ARN is only needed
                # when WAIT_FOR_BATCH=true (it's false). Role wind-irsa-s3-sync; trust
                # covers system:serviceaccount:backups:s3-sync-* (+ unifi-backup,
                # daily-report) — the per-share kustomize namePrefix renames this SA.
                - name: AWS_ROLE_ARN
                  value: "arn:aws:iam::830881980142:role/wind-irsa-s3-sync"
                - name: AWS_WEB_IDENTITY_TOKEN_FILE
                  value: "/var/run/secrets/eks.amazonaws.com/serviceaccount/token"
                # The pod runs as uid 1000 with HOME=/ (unwritable); the aws CLI v2
                # web-identity provider caches assumed creds under $HOME/.aws → point
                # HOME at a writable dir or it fails with "Permission denied: /.aws".
                - name: HOME
                  value: "/tmp"
              envFrom:
                - secretRef:
                    name: approval-hmac          # APPROVAL_HMAC_SECRET (mint approval tokens)
                - configMapRef:
                    name: aws-s3-sync-email
              volumeMounts:
                - name: nfs-src
                  mountPath: /src
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: aws-iam-token
                  mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
                  readOnly: true
          volumes:
            # NFS will be patched per share
            - name: nfs-src
              nfs:
                server: sequoia.wind.etherport.net
                path: /var/nfs/shared/REPLACE_ME
            - name: work
              emptyDir: {}
            # M75 IRSA: projected SA token (aud sts.amazonaws.com) for web identity.
            - name: aws-iam-token
              projected:
                sources:
                  - serviceAccountToken:
                      audience: sts.amazonaws.com
                      expirationSeconds: 3600
                      path: token
