apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: backups

resources:
  # Note: namespace.yaml removed to avoid collision when multiple shares
  # are included. Namespace is now defined in daily-report/namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - cronjob.yaml
  - 01-aws-secret.sops.yaml

configMapGenerator:
  - name: aws-s3-sync-excludes-global
    files:
      - excludes-global.txt

generatorOptions:
  disableNameSuffixHash: true
