apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: backups

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - cronjob.yaml

configMapGenerator:
  - name: aws-s3-sync-excludes-global
    files:
      - excludes-global.txt

generatorOptions:
  disableNameSuffixHash: true