apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: s3-sync-lock-manager
  namespace: backups
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: s3-sync-lock-manager
  namespace: backups
subjects:
  - kind: ServiceAccount
    name: s3-sync
    namespace: backups
roleRef:
  kind: Role
  name: s3-sync-lock-manager
  apiGroup: rbac.authorization.k8s.io
