# The GHCR image (ghcr.io/etherport/aws-s3-sync) is a PUBLIC org package again as
# of 2026-08-14, so no imagePullSecret is needed. It was briefly private after the
# org migration (org packages default to private), which required a pull secret;
# that secret was removed once visibility was restored. If it ever goes private
# again, re-add a dockerconfigjson secret + imagePullSecrets here (the base SA
# propagates to the per-share prefixed SAs via kustomize namePrefix).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s3-sync
  namespace: backups
