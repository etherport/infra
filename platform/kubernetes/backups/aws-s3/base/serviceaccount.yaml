# The GHCR image (ghcr.io/etherport/aws-s3-sync) is a PRIVATE org package (org
# migration 2026-08 — etherport org packages default to private and the org
# disables making them public/using deploy keys). Pull via the ghcr-etherport
# secret (05-ghcr-etherport.sops.yaml). imagePullSecrets on the base SA propagate
# to the per-share prefixed SAs (s3-sync-backups, …) via kustomize namePrefix.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s3-sync
  namespace: backups
imagePullSecrets:
  - name: ghcr-etherport
