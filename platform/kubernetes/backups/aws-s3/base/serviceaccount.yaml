# The GHCR image (ghcr.io/sparked-diamond/aws-s3-sync) is a PUBLIC package, so no
# imagePullSecret is required. A `ghcr-creds` secret was referenced here but never
# existed in the cluster (nor in git) — a dead reference removed 2026-06-23. If the
# package is ever made private, recreate the secret and re-add imagePullSecrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s3-sync
  namespace: backups
