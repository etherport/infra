# Daily email report summarizing all backup executions over the last 24 hours
# Queries Prometheus for job discovery, then fetches detailed metrics from S3 summary JSON files
# Sends HTML email via AWS SES with per-execution status and metrics
apiVersion: batch/v1
kind: CronJob
metadata:
  name: s3-sync-daily-report
  namespace: backups
spec:
  schedule: "0 6 * * *"  # 6:00 AM PT daily
  timeZone: "America/Los_Angeles"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # GC after 25h — bumped from 1h on 2026-05-23 so the daily-
      # report Job itself is visible for at least one full report
      # window (helps when debugging "did today's email send?").
      # Failed-job noise is handled by alertmanager routing (M8).
      ttlSecondsAfterFinished: 90000
      template:
        spec:
          serviceAccountName: daily-report  # Has permissions to list jobs/cronjobs for status
          restartPolicy: Never
          containers:
            - name: report
              image: ghcr.io/sparked-diamond/aws-s3-sync:main
              imagePullPolicy: Always
              command: ["/bin/bash", "-lc"]
              args:
                - |
                  /scripts/daily-report.sh
              env:
                # Prometheus URL for initial metrics discovery
                - name: PROM_URL
                  value: "http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"

                # Space-separated list of all shares to monitor
                - name: SHARES
                  value: "scans archive backups content graham mark media"

                # S3 bucket containing run summary JSON files and batch artifacts
                - name: METADATA_BUCKET
                  value: "logs.archive.wind.etherport.net"

                # S3 key prefix for batch operation artifacts
                - name: BATCH_PREFIX
                  value: "batch"

                # AWS region for S3 operations
                - name: AWS_REGION
                  value: "us-west-2"
                # M75 IRSA — short-lived creds via web identity (replaces the
                # aws-backup-credentials static key, removed from envFrom below).
                - name: AWS_ROLE_ARN
                  value: "arn:aws:iam::830881980142:role/wind-irsa-s3-sync"
                - name: AWS_WEB_IDENTITY_TOKEN_FILE
                  value: "/var/run/secrets/eks.amazonaws.com/serviceaccount/token"
              envFrom:
                # Email configuration (EMAIL_FROM, EMAIL_TO, etc.)
                - configMapRef:
                    name: aws-s3-sync-email
              volumeMounts:
                - name: aws-iam-token
                  mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
                  readOnly: true
          volumes:
            # M75 IRSA: projected SA token (aud sts.amazonaws.com) for web identity.
            - name: aws-iam-token
              projected:
                sources:
                  - serviceAccountToken:
                      audience: sts.amazonaws.com
                      expirationSeconds: 3600
                      path: token
