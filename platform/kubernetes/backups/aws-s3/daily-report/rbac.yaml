# daily-report ServiceAccount + RBAC.
#
# The s3-sync-daily-report CronJob runs daily-report.sh, which lists Jobs in the
# backups namespace (`kubectl -n backups get jobs`) to enumerate each share's
# nightly run for the daily email. These objects existed in-cluster but were
# MISSING FROM GIT (drift caught 2026-06-23) — captured here so a cluster rebuild
# keeps the daily report working. Rules match what was deployed (jobs + cronjobs,
# get + list). The GHCR image is public, so no imagePullSecret is needed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: daily-report
  namespace: backups
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: daily-report-reader
  namespace: backups
rules:
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: daily-report-reader
  namespace: backups
subjects:
  - kind: ServiceAccount
    name: daily-report
    namespace: backups
roleRef:
  kind: Role
  name: daily-report-reader
  apiGroup: rbac.authorization.k8s.io
