apiVersion: batch/v1
kind: CronJob
metadata:
  name: s3-sync-template
  namespace: backups
spec:
  # TEMPORARILY SUSPENDED 2026-06-21: a Mac mini osxphotos export landed ~200GB
  # of duplicates under Graham/iCloud/Photos in this share (and in S3). The sync
  # is paused so it does not propagate the in-progress source dedup (which would
  # create delete markers on governance-locked S3 versions). Re-enable
  # (suspend: false) after the dupes are purged from S3. See session-log.
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: sync
              env:
                # --- share identity / destination ---
                - name: SHARE_NAME
                  value: "backups"
                - name: DEST_BUCKET
                  value: "archive.wind.etherport.net"
                - name: DEST_PREFIX
                  value: "objects/backups"

                # --- exclude file locations (read by sync-and-verify.sh) ---
                - name: EXCLUDES_GLOBAL_FILE
                  value: "/etc/aws-s3-sync/excludes-global.txt"
                - name: EXCLUDES_SHARE_FILE
                  value: "/etc/aws-s3-sync/excludes-share.txt"

              volumeMounts:
                - name: excludes-global
                  mountPath: /etc/aws-s3-sync/excludes-global.txt
                  subPath: excludes-global.txt
                  readOnly: true
                - name: excludes-share
                  mountPath: /etc/aws-s3-sync/excludes-share.txt
                  subPath: excludes-share.txt
                  readOnly: true

          volumes:
            # --- NFS source mount (share-specific) ---
            - name: nfs-src
              nfs:
                server: sequoia.wind.etherport.net
                path: /var/nfs/shared/Backups

            # --- exclude configmaps ---
            - name: excludes-global
              configMap:
                name: aws-s3-sync-excludes-global
                defaultMode: 0444
            - name: excludes-share
              configMap:
                name: aws-s3-sync-excludes-share
                optional: true
                defaultMode: 0444
