apiVersion: batch/v1
kind: CronJob
metadata:
  name: s3-sync-scans
  namespace: backups
spec:
  schedule: "15 9 * * *"   # daily @ 09:15 UTC (01:15 PT during standard time)
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: sync
              image: public.ecr.aws/aws-cli/aws-cli:2.32.16
              command: ["/bin/bash","-lc"]
              args:
                - |
                  set -euo pipefail

                  # Ensure runtime deps for report parsing and optional verification artifacts.
                  # (The aws-cli image doesn't always include jq/python3 by default.)
                  if command -v yum >/dev/null 2>&1; then
                    yum -y -q install jq python3 >/dev/null
                  elif command -v microdnf >/dev/null 2>&1; then
                    microdnf -y install jq python3 >/dev/null
                  fi

                  /scripts/sync-and-verify.sh
              env:
                - name: SHARE_NAME
                  value: "scans"
                - name: SRC_PATH
                  value: "/src"
                - name: DEST_BUCKET
                  value: "archive-test.wind.etherport.net"
                - name: DEST_PREFIX
                  value: "objects/scans"
                - name: AWS_REGION
                  value: "us-west-2"
                - name: EXPECTED_BUCKET_OWNER
                  value: "830881980142"
                - name: AWS_ACCOUNT_ID
                  value: "830881980142"
                - name: S3_BATCH_ROLE_ARN
                  value: "arn:aws:iam::830881980142:role/s3-batch-ops-checksum-role"
                - name: BATCH_PREFIX
                  value: "batch"

                # For now, wait for the S3 Batch Operations checksum job to finish so we
                # can download the report, build verification JSONL, and produce summaries.
                - name: WAIT_FOR_BATCH
                  value: "true"
                - name: BATCH_POLL_INTERVAL_SECONDS
                  value: "15"
                - name: BATCH_MAX_WAIT_SECONDS
                  value: "7200"

                - name: PUSHGATEWAY_URL
                  value: "http://pushgateway.monitoring.svc.cluster.local:9091"
                - name: PUSHGATEWAY_JOB
                  value: "aws-s3-sync"
                - name: DEBUG_PUSHGATEWAY
                  value: "false"
              envFrom:
                - secretRef:
                    name: aws-backup-credentials
              volumeMounts:
                - name: nfs-src
                  mountPath: /src
                  readOnly: true
                - name: script
                  mountPath: /scripts
                - name: work
                  mountPath: /work
          volumes:
            - name: nfs-src
              nfs:
                server: sequoia.wind.etherport.net
                path: /var/nfs/shared/Scans
            - name: script
              configMap:
                name: aws-s3-sync-script
                defaultMode: 0755
            - name: work
              emptyDir: {}
