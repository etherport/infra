apiVersion: batch/v1
kind: CronJob
metadata:
  name: s3-sync-template
  namespace: backups
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: sync
              env:
                - name: SHARE_NAME
                  value: "scans"
                - name: DEST_BUCKET
                  value: "archive-test.wind.etherport.net"
                - name: DEST_PREFIX
                  value: "objects/scans"
          volumes:
            - name: nfs-src
              nfs:
                server: sequoia.wind.etherport.net
                path: /var/nfs/shared/Scans