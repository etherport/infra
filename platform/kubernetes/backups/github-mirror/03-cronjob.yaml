apiVersion: batch/v1
kind: CronJob
metadata:
  name: github-repo-mirror
  namespace: backups
spec:
  # 00:40 PT — 30 min BEFORE the 01:10 PT s3-sync-backups run, so each night's
  # fresh bundles are swept to S3 the same night. Bundles are published
  # atomically (tmp + mv) so a long-running mirror can't hand the sync a
  # half-written file.
  schedule: "40 0 * * *"
  timeZone: "America/Los_Angeles"
  # Activated 2026-08-06 once the read-only PAT landed in github-mirror-token
  # (verified: manual run bundled all 6 repos, restore from a NAS bundle works).
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # One attempt → one KubeJobFailed alert on a real failure. The script
      # already fails loudly on empty discovery / clone / bundle errors.
      backoffLimit: 0
      ttlSecondsAfterFinished: 90000   # 25h, matches the s3-sync fleet
      template:
        metadata:
          annotations:
            backup.velero.io/backup-volumes-excludes: "nas,work"
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # Mint a 1h GitHub App INSTALLATION token and hand it to the mirror
            # via the shared `token` emptyDir. WHY an init container: the App
            # flow needs an RS256 JWT, and alpine/git has no `openssl`. This
            # keeps the git image unchanged and avoids a runtime `apk add`.
            # WHY the App at all: the org migration made user-scoped PATs
            # useless here — the old github-mirror-token could only see 1 of 6
            # org repos, silently backing up almost nothing. Requested scope is
            # contents:read only (least privilege per mint).
            - name: mint-token
              image: alpine/openssl:3.5.7
              command: ["/bin/sh", "/scripts/gh-app-token-init.sh"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              resources:
                requests: {cpu: "50m", memory: "64Mi", ephemeral-storage: "64Mi"}
                limits: {cpu: "500m", memory: "256Mi", ephemeral-storage: "256Mi"}
              env:
                - name: GH_APP_ID
                  valueFrom:
                    secretKeyRef: {name: github-app-creds, key: app_id}
                - name: GH_APP_INSTALLATION_ID
                  valueFrom:
                    secretKeyRef: {name: github-app-creds, key: installation_id}
              volumeMounts:
                - name: app-key
                  mountPath: /app-key
                  readOnly: true
                - name: token
                  mountPath: /token
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          containers:
            - name: mirror
              # alpine/git has git + busybox (wget does HTTPS + auth headers), so
              # no curl/jq/aws needed. Real version tag (not :latest) → passes
              # Kyverno; Renovate digest-pins on its next run.
              image: alpine/git:2.54.0
              command: ["/bin/sh", "/scripts/mirror-repos.sh"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                  ephemeral-storage: "512Mi"
                limits:
                  cpu: "1000m"
                  memory: "1Gi"
                  ephemeral-storage: "8Gi"
              env:
                - name: GH_OWNER
                  value: "etherport"
                - name: DEST_DIR
                  value: "/nas/repos"
                - name: PUSHGATEWAY_URL
                  value: "http://pushgateway.monitoring.svc.cluster.local:9091"
                # GH_TOKEN is no longer a PAT: the init container writes a 1h
                # App installation token to /token/token, and the script reads it
                # via GH_TOKEN_FILE. (A user PAT cannot see org repos.)
                - name: GH_TOKEN_FILE
                  value: /token/token
              volumeMounts:
                - name: nas
                  mountPath: /nas
                - name: token
                  mountPath: /token
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            # Backups share on the NAS — the SAME share s3-sync-backups sweeps to
            # s3://archive.wind.etherport.net/objects/backups. We write repos/ here.
            - name: nas
              nfs:
                server: sequoia.wind.etherport.net
                path: /var/nfs/shared/Backups
            # scratch for git clone --mirror + HOME/TMPDIR (token lives in
            # /work/.gitconfig, never in the URL or `ps`); emptyDir so it's wiped.
            - name: work
              emptyDir: {}
            # App private key (SOPS) — mounted read-only into the init container only.
            - name: app-key
              secret:
                secretName: github-app-creds
                items:
                  - key: private_key
                    path: private-key.pem
                defaultMode: 0400
            # in-memory handoff of the short-lived token: init writes, mirror reads.
            - name: token
              emptyDir:
                medium: Memory
            - name: scripts
              configMap:
                name: github-mirror-script
                defaultMode: 0555
