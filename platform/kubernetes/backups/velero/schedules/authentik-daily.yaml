apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: authentik-daily
  namespace: velero
spec:
  schedule: "0 5 * * *"   # M145: heavy/light interleave, 30-min spacing (light)
  template:
    includedNamespaces:
      - authentik
    # Authentik state lives in the shared `postgres-cluster` (authentik DB), backed
    # up by CNPG Barman (continuous WAL + daily base to S3) — NOT here. This captures
    # the namespace's K8s resources + FS-backs-up the media PVC (uploaded icons/etc.).
    # Redis is ephemeral (emptyDir, cache/broker) — nothing to back up there.
    defaultVolumesToFsBackup: true
    ttl: 720h0m0s
