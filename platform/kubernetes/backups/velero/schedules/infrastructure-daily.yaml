apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: infrastructure-daily
  namespace: velero
spec:
  schedule: "0 6 * * *"   # M145: heavy/light interleave, 30-min spacing (light)
  template:
    includedNamespaces:
      - cloudflare-ddns
      - monitoring
      - traefik
      - cert-manager
      - rclone
      - metallb-system
      # icloudpd removed 2026-05-24: namespace doesn't exist (never
      # deployed in this cluster), and listing a missing namespace
      # makes Velero mark the whole backup PartiallyFailed →
      # velero_backup_last_successful_timestamp doesn't advance →
      # VeleroLastBackupAgeHigh alert fires forever. Re-add when
      # icloudpd is actually deployed.
    defaultVolumesToFsBackup: true
    ttl: 720h0m0s
