apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: kube-system-daily
  namespace: velero
spec:
  schedule: "30 3 * * *"   # M145: heavy/light interleave, 30-min spacing (heavy — kopia hits the CONTROL-PLANE disks (etcd co-tenant))
  template:
    includedNamespaces:
      - kube-system
    defaultVolumesToFsBackup: true
    ttl: 720h0m0s
