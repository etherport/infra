apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: monitoring-daily
  namespace: velero
spec:
  schedule: "30 4 * * *"   # M145: heavy/light interleave, 30-min spacing (heavy (prometheus TSDB))
  template:
    includedNamespaces:
      - monitoring
    defaultVolumesToFsBackup: true
    ttl: 168h0m0s
