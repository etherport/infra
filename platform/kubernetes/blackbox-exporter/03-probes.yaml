---
# Cue API — public health endpoint through the Cloudflare tunnel. Probes the
# full external path (DNS → CF edge → tunnel → cue-api Service), so it catches
# tunnel/DNS/cert failures the in-cluster deployment check would miss. /health
# is one of only two publicly-routed paths. http_2xx_insecure expects 2xx;
# /health returns 200.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: cue-api
  namespace: blackbox-exporter
  labels:
    appliance: cue-api
    release: monitoring
spec:
  jobName: blackbox-appliance
  interval: 30s
  module: http_2xx_insecure
  prober:
    url: blackbox-exporter.blackbox-exporter.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://cue.etherport.net/health
      labels:
        appliance: cue-api
---
# step-ca (VM 1006) — the SSH user/host CA the ENTIRE fleet's cert-only SSH
# depends on (M76). H42 (2026-07-01): this was a triple blind spot (no scrape,
# no probe, no alert) — a wedged CA silently breaks cert renewal and the
# devbox/CI lose fleet access at the next ≤13h cert expiry. /health returns
# 200 over the CA's self-signed TLS → http_2xx_insecure. Alert: StepCADown
# (monitoring/02-external-alerts.yaml).
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: step-ca
  namespace: blackbox-exporter
  labels:
    appliance: step-ca
    release: monitoring
spec:
  jobName: blackbox-appliance
  interval: 30s
  module: http_2xx_insecure
  prober:
    url: blackbox-exporter.blackbox-exporter.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://10.10.201.46:8443/health
      labels:
        appliance: step-ca
---
# authentik (SSO IdP) — gates every OIDC app + all forward-auth admin UIs (H38).
# M113 (2026-07-01): authentik had zero alert coverage. Probes the in-cluster
# Service /-/health/live/ (plain http_2xx module — see 01-configmap). Pairs with
# the AuthentikDown rule (monitoring/13-service-alerts.yaml). NB the pod-level
# liveness probes restart a sick pod; this catches the SERVICE being dark (both
# replicas down / Service broken / namespace-level failure).
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: authentik
  namespace: blackbox-exporter
  labels:
    appliance: authentik
    release: monitoring
spec:
  jobName: blackbox-appliance
  interval: 30s
  module: http_2xx
  prober:
    url: blackbox-exporter.blackbox-exporter.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - http://authentik-server.authentik.svc.cluster.local/-/health/live/
      labels:
        appliance: authentik
