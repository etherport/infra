apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# DELIBERATELY no `namespace:` field at this level — the resources here
# pin their own namespace (cert-manager). Forcing a namespace transform
# would override the in-resource setting and break the ClusterIssuer's
# secret lookup (it reads from cert-manager namespace by default).

resources:
  # SOPS-encrypted Secret with the CF API token (Zone:DNS:Edit on
  # etherport.net). Created from cloudflare-credentials.sops.yaml.template
  # 2026-05-27 — see docs/runbooks/cert-manager-dns01-cf-migration.md
  # for the cutover history.
  - cloudflare-credentials.sops.yaml
