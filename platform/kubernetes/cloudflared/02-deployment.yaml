apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
  labels:
    app: cloudflared
spec:
  # 2 replicas → cloudflared opens 4 outbound HA tunnels to CF edge POPs
  # (2 per replica by default). One replica down still leaves you fully
  # connected to the CF edge.
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      # Spread replicas across nodes so a single-node loss doesn't
      # take both tunnel replicas with it.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: cloudflared
      # Outbound-only — no inbound ports needed. Don't run with hostNetwork.
      automountServiceAccountToken: false
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.8.1@sha256:d9ff527dc19799e24d3689058161fb01e752a24be1823577bae54c9c2489275f # {"$imagepolicy": "flux-system:cloudflared"}
          # `--token <TOKEN>` carries everything cloudflared needs (tunnel
          # ID + secret + routes + ingress config from the cloudflare_tunnel_config
          # TF resource). No mounted credentials file required.
          args:
            - tunnel
            - --no-autoupdate # we pin via image automation; let CI bump
            - --metrics
            - 0.0.0.0:2000
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-tunnel
                  key: token
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          # CF docs: livenessProbe should hit the metrics endpoint
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 1
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
---
# ServiceMonitor for cloudflared metrics — surfaces tunnel connectivity
# in Grafana (cloudflared_tunnel_active_connections, etc.)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cloudflared
  namespace: cloudflared
  labels:
    # Convention: kube-prometheus-stack's selectors are currently match-all so this
    # is already scraped, but every other SM carries this — keep it consistent +
    # safe if the selector is ever tightened to release=monitoring (M63).
    release: monitoring
spec:
  selector:
    matchLabels:
      app: cloudflared
  endpoints:
    - port: metrics
      interval: 30s
---
# Headless service for ServiceMonitor scrape target discovery
apiVersion: v1
kind: Service
metadata:
  name: cloudflared
  namespace: cloudflared
  labels:
    app: cloudflared
spec:
  clusterIP: None
  selector:
    app: cloudflared
  ports:
    - name: metrics
      port: 2000
      targetPort: metrics
