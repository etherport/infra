---
# Keep at least one cloudflared replica serving the tunnel during voluntary
# disruptions (node drains, rollouts). The Deployment runs 2 replicas; without a
# PDB a drain could evict both at once and drop the public tunnel briefly (M63).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cloudflared
