---
# Service account + RBAC for the cloudwatch-to-loki forwarder.
# Needs only:
#   - read/write ConfigMap state in its own namespace (watermark
#     tracking)
# No cluster-wide perms; AWS perms come from boto3 env-var creds
# (the IAM user is `ai-advisor-readonly` scoped to CloudWatch
# Logs read; see infra/terraform/aws/ai-advisor-iam/).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudwatch-to-loki
  namespace: cloudwatch-to-loki
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudwatch-to-loki-state
  namespace: cloudwatch-to-loki
rules:
  # `create` cannot be filtered by resourceNames in RBAC — the
  # resource doesn't exist yet, so name-matching can't apply.
  # Split into two rules: create scoped only to namespace (no
  # resourceNames), other verbs scoped to the specific CM.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "update", "patch", "replace"]
    resourceNames:
      - "cloudwatch-to-loki-state"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudwatch-to-loki-state
  namespace: cloudwatch-to-loki
subjects:
  - kind: ServiceAccount
    name: cloudwatch-to-loki
    namespace: cloudwatch-to-loki
roleRef:
  kind: Role
  name: cloudwatch-to-loki-state
  apiGroup: rbac.authorization.k8s.io
