---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cloudwatch-to-loki
  namespace: cloudwatch-to-loki
spec:
  # Every 5 minutes. Each run scans only events since the last
  # successful run's watermark (or 30min if the group is new).
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # 3 (was 0): a transient pip/network/AWS blip used to fail the job
      # instantly (BackoffLimitExceeded) and page — 2026-06-20 overnight. With
      # retries the next attempt almost always succeeds within the 5-min window.
      # (The runtime pip install is being baked into an image — see image/.)
      backoffLimit: 3
      ttlSecondsAfterFinished: 90000   # 25h — matches sibling backup CronJobs
      template:
        spec:
          serviceAccountName: cloudwatch-to-loki
          restartPolicy: Never
          containers:
            - name: forward
              # Baked image (boto3 + kubernetes>=30,<31 pre-installed) — no more
              # per-run `pip install` (the runtime install + backoffLimit:0 caused
              # an overnight BackoffLimitExceeded, 2026-06-20). Built by
              # .github/workflows/cloudwatch-to-loki-image.yml; the kubernetes pin
              # rationale lives in image/Dockerfile. :main is mutable, so
              # imagePullPolicy: Always picks up new builds (same scheme as
              # cloudflare-ddns / aws-s3-sync). Script still mounted from the CM.
              image: ghcr.io/sparked-diamond/cloudwatch-to-loki:main
              imagePullPolicy: Always
              command: ["python", "/scripts/forward.py"]
              env:
                - name: LOG_GROUP_PREFIXES
                  value: "/aws/lambda,/aws/ec2,CloudWatchAgent"
                - name: LOKI_PUSH_URL
                  value: "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
                - name: AWS_REGION
                  value: "us-west-2"
                # M75 IRSA: short-lived creds via AssumeRoleWithWebIdentity (boto3
                # picks these up from the default chain). No static key in etcd.
                - name: AWS_ROLE_ARN
                  value: "arn:aws:iam::830881980142:role/wind-irsa-cloudwatch-read"
                - name: AWS_WEB_IDENTITY_TOKEN_FILE
                  value: "/var/run/secrets/eks.amazonaws.com/serviceaccount/token"
              volumeMounts:
                - name: script
                  mountPath: /scripts
                - name: aws-iam-token
                  mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
                  readOnly: true
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "500m"
          volumes:
            - name: script
              configMap:
                name: cloudwatch-to-loki-script
                defaultMode: 0755
            # M75 IRSA: projected SA token (aud sts.amazonaws.com) for web identity.
            - name: aws-iam-token
              projected:
                sources:
                  - serviceAccountToken:
                      audience: sts.amazonaws.com
                      expirationSeconds: 3600
                      path: token
