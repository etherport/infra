apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cluster
  namespace: postgres
spec:
  description: "Shared PostgreSQL cluster for homelab applications"

  # 3 instances for HA — one primary + two streaming replicas. CNPG
  # operator handles automatic failover (RTO ~30s) and creates a
  # cluster-rw / cluster-ro / cluster-r Service trio. Applications
  # using postgres should connect to `postgres-cluster-rw.postgres.svc`
  # for read-write traffic so they survive primary failover.
  instances: 3

  # Spread instances across nodes — primary on a different host from
  # replicas so a single node failure can't drop more than one replica.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          cnpg.io/cluster: postgres-cluster

  # PostgreSQL version
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4

  # Primary update strategy
  primaryUpdateStrategy: unsupervised

  # Storage configuration
  storage:
    size: 10Gi
    storageClass: ceph-rbd

  # Resource limits
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

  # PostgreSQL configuration
  postgresql:
    parameters:
      # Memory settings (tuned for small instance)
      shared_buffers: "128MB"
      effective_cache_size: "256MB"
      work_mem: "8MB"
      maintenance_work_mem: "64MB"

      # Connection settings
      max_connections: "100"

      # Logging
      log_statement: "ddl"
      log_min_duration_statement: "1000"

  # Bootstrap configuration - creates initial databases
  bootstrap:
    initdb:
      database: wikijs
      owner: wikijs
      secret:
        name: postgres-app-credentials

  # Continuous WAL archiving + scheduled full backups to S3 via Barman
  # Cloud. Pairs with the daily ScheduledBackup CR in 06-scheduled-backup.yaml.
  # Restore via `bootstrap.recovery` referencing an externalCluster
  # — see docs/runbooks/postgres-barman.md for the full restore flow.
  backup:
    barmanObjectStore:
      destinationPath: s3://postgres-barman.wind.etherport.net
      s3Credentials:
        accessKeyId:
          name: barman-s3-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: barman-s3-credentials
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
        encryption: AES256
      data:
        compression: gzip
        encryption: AES256
    retentionPolicy: "30d"

  # Monitoring
  monitoring:
    enablePodMonitor: true
