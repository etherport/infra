# Dedicated SA for cue-api so its projected web-identity token can assume the
# wind-irsa-cue-media IRSA role (S3 media bucket). The IAM trust policy is locked
# to system:serviceaccount:cue:cue-api (infra/terraform/aws/cluster-irsa).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cue-api
  labels:
    app: cue-api
