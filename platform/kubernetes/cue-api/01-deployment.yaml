apiVersion: apps/v1
kind: Deployment
metadata:
  name: cue-api
  namespace: cue
  labels:
    app: cue-api
spec:
  replicas: 1 # single-owner dev instance
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cue-api
  template:
    metadata:
      labels:
        app: cue-api
      annotations:
        # No persistent volumes — nothing for Velero to FS-backup here
        # (state lives in cue-db). Keeps it off the kopia repo regardless.
        backup.velero.io/backup-volumes-excludes: ""
    spec:
      terminationGracePeriodSeconds: 15 # app does graceful SIGTERM <=10s
      imagePullSecrets:
        - name: ghcr-cue # read-only ghcr pull cred (private package)
      # ---- DB migrations run to completion before the app container starts.
      # Same image, idempotent (`node dist/db/migrate.js`), safe every deploy.
      initContainers:
        - name: migrate
          image: ghcr.io/sparked-diamond/cue:latest # {"$imagepolicy": "flux-system:cue-api"}
          imagePullPolicy: Always
          command: ['node', 'dist/db/migrate.js']
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cue-db-app # CNPG-generated; in-cluster rw URI
                  key: uri
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      containers:
        - name: cue-api
          image: ghcr.io/sparked-diamond/cue:latest # {"$imagepolicy": "flux-system:cue-api"}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            # In-cluster Postgres (CNPG cue-db). `uri` key = the rw service URL.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cue-db-app
                  key: uri
            # Enable the interaction-style learn loop in dev (per deploy spec).
            - name: CUE_INTERACTION_LEARNING
              value: 'true'
            # 2026-06-02: enable the daily-state + surfaces features (built + adversarially
            # reviewed + eval-validated, no regression). today-state extraction (chat →
            # daily_state), inbound-photo classification (workout photos log cardio), and
            # the proactive condition check-in push (in-process scheduler; safe at-most-once
            # via the proactive_pings ledger; tz-aware window; /quiet to opt out).
            - name: CUE_TODAY_STATE_EXTRACTION
              value: 'true'
            - name: CUE_PHOTO_CLASSIFY
              value: 'true'
            - name: CUE_PROACTIVE_CHECKINS
              value: 'true'
            # 2026-06-02: enable meal-assist Phase-1 (built + adversarially reviewed,
            # 17 findings fixed, 222 tests green). CUE_MEAL_ROUTER = the where-router
            # (delivery/out/cook) + pending_flow continuation (fixes lost-context); the
            # always-on deep-link CTA is host-anchored. CUE_MEAL_COACH = text/photo
            # meal-log → coach take + ONE clarifying-answer loop (roll:false re-estimate,
            # no double-count). Migration 0009 adds the pending_flows table.
            - name: CUE_MEAL_ROUTER
              value: 'true'
            - name: CUE_MEAL_COACH
              value: 'true'
            # 2026-06-02 (later): enable meal-assist §3a published-macro tightening (a clean
            # named-chain meal-log pulls the chain's official macros to tighten the estimate;
            # found:false → estimate unchanged), and capturing a GI symptom mentioned in chat
            # into the day's digestion_status (escalation-only, positive-only). Both built +
            # adversarially reviewed; ship dormant-by-default, enabled here.
            - name: CUE_MEAL_MACRO_LOOKUP
              value: 'true'
            - name: CUE_DIGESTION_FROM_CHAT
              value: 'true'
            # 2026-06-02 (dogfooding round 2): location-aware delivery lookup, meal-log
            # double-count dedup, and concise meal-log replies. Built + adversarially
            # reviewed (impl review: 4 confirmed of 14; the two MAJOR dedup atomicity/
            # flag-flip bugs FIXED in commit 117af56 before enabling). DEDUP+BRIEF enabled
            # together (the brief single total is only truthful once dedup prevents
            # double-counts). 250 tests green. User-authorized enable.
            - name: CUE_MEAL_LOCATION
              value: 'true'
            - name: CUE_MEAL_DEDUP
              value: 'true'
            - name: CUE_MEAL_BRIEF
              value: 'true'
            # 2026-06-02 (coach quality): surface the digestion/quiet-gut avoid-list ONLY when
            # the turn is about food/gut, and collapse durable GI-trigger facts to a conditional
            # reference — kills the "no orzo every time" boilerplate. A/B-validated (avoid-
            # relevance subscore up; no correctness regression). The honest-specifics /
            # no-state-recital / variation prompt changes ride the COACH_PROMPT_VERSION bump.
            - name: CUE_AVOID_RELEVANCE
              value: 'true'
            # 2026-06-03 (coach quality, prose overhaul): the user-facing reply is now rich
            # adaptive coaching PROSE (the `reply` field) instead of the structured
            # Decision/Why/Target template — closing the gap to the original GPT-thread voice.
            # Tuned + A/B-validated on a 13-turn gold set mined verbatim from the real thread:
            # prose 75.4 vs template 70.0 overall, 85% vs 62% pass; clears template on
            # correctness + specificity, with avoidRelevance +22 and voice +11. Rides the
            # COACH_PROMPT_VERSION bump (prose-meal-anchor-scoped): meal-log macro anchor,
            # time-neutral framing, training-day carbs, food-turn-only avoids. User-authorized.
            - name: CUE_PROSE_REPLY
              value: 'true'
            # 2026-06-03 (delivery deep-links): render up to 3 real nearby storefront links
            # (Uber Eats / DoorDash / Talabat / Deliveroo, from the live-lookup citations) as
            # one-tap Telegram inline URL buttons instead of a single pasted link. Host+path
            # anchored (rejects listicles/lookalikes); search pushed to surface specific
            # storefronts. Honest limit: opens the store in the user's app (no pre-filled cart).
            # Unit-tested (262 green); not gold-set-evaluable (needs live search). User-authorized.
            - name: CUE_DELIVERY_LINKS
              value: 'true'
            # 2026-06-04 (multi-photo): a 2nd meal photo within ~3 min is treated as another
            # ANGLE of the same meal — the two reads are FUSED into one higher-confidence estimate
            # and rolled ONCE (replaces the first via correctsRecommendationId), so the day total
            # never double-counts; reply says "got both angles". Pure fusion unit-tested; rides
            # cue@b058b4c+. User-authorized after dogfooding.
            - name: CUE_MEAL_MULTIPHOTO
              value: 'true'
          # ANTHROPIC_API_KEY + TELEGRAM_* come from the cue-app Secret.
          # optional: true so the pod is healthy before the secret is populated
          # (all of these are optional at boot — see src/config/env.ts; the
          # Telegram route 503s and the AI gateway asserts only when used).
          envFrom:
            - secretRef:
                name: cue-app
                optional: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 20 # allow ~60s for first boot + migrations
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
