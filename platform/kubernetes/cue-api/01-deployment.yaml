apiVersion: apps/v1
kind: Deployment
metadata:
  name: cue-api
  namespace: cue
  labels:
    app: cue-api
spec:
  replicas: 2 # HA: zero-gap rollouts (CF tunnel keep-alive never drops mid-swap) + node-failure tolerance
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cue-api
  template:
    metadata:
      labels:
        app: cue-api
      annotations:
        # No persistent volumes — nothing for Velero to FS-backup here
        # (state lives in cue-db). Keeps it off the kopia repo regardless.
        backup.velero.io/backup-volumes-excludes: ""
    spec:
      terminationGracePeriodSeconds: 15 # app does graceful SIGTERM <=10s
      serviceAccountName: cue-api # M75 IRSA — assumes wind-irsa-cue-media (S3 media bucket)
      # Spread the 2 replicas across nodes so a single node failure can't take both down.
      # Soft (ScheduleAnyway) so scheduling never blocks if only one node is free.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: cue-api
      imagePullSecrets:
        - name: ghcr-cue # read-only ghcr pull cred (private package)
      # ---- DB migrations run to completion before the app container starts.
      # Same image, idempotent (`node dist/db/migrate.js`), safe every deploy.
      initContainers:
        - name: migrate
          # Flux image automation (ImagePolicy flux-system:cue-api, digestReflectionPolicy
          # :Always tracking :latest): a code push → new :latest → ImageUpdateAutomation
          # commits the reflected digest onto this line → Flux rolls it (no manual step,
          # the deployed digest is recorded in git). `kubectl rollout restart` does NOT
          # work here (Flux SSA strips the annotation); image automation is the trigger.
          # BOTH image lines (migrate init + app) carry the marker so they pin the SAME
          # digest — migration + serving code stay in lockstep (no schema-ahead-of-code).
          image: ghcr.io/sparked-diamond/cue:latest@sha256:815d8d8ff62782718e676b45c71f79ae1af80417244604008fe5a1b5d3bc8900 # {"$imagepolicy": "flux-system:cue-api"}
          imagePullPolicy: Always
          command: ['node', 'dist/db/migrate.js']
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cue-db-app # CNPG-generated; in-cluster rw URI
                  key: uri
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      containers:
        - name: cue-api
          # Flux image automation (ImagePolicy flux-system:cue-api, digestReflectionPolicy
          # :Always tracking :latest): a code push → new :latest → ImageUpdateAutomation
          # commits the reflected digest onto this line → Flux rolls it (no manual step,
          # the deployed digest is recorded in git). `kubectl rollout restart` does NOT
          # work here (Flux SSA strips the annotation); image automation is the trigger.
          # BOTH image lines (migrate init + app) carry the marker so they pin the SAME
          # digest — migration + serving code stay in lockstep (no schema-ahead-of-code).
          image: ghcr.io/sparked-diamond/cue:latest@sha256:815d8d8ff62782718e676b45c71f79ae1af80417244604008fe5a1b5d3bc8900 # {"$imagepolicy": "flux-system:cue-api"}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            # In-cluster Postgres (CNPG cue-db). `uri` key = the rw service URL.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cue-db-app
                  key: uri
            # M75 IRSA — Cue media S3 bucket (bug screenshots now; workout media next).
            # No static keys: the AWS SDK auto-assumes wind-irsa-cue-media from these
            # vars using the cue-api SA's projected web-identity token (mounted below).
            - name: AWS_ROLE_ARN
              value: 'arn:aws:iam::830881980142:role/wind-irsa-cue-media'
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/eks.amazonaws.com/serviceaccount/token
            - name: AWS_REGION
              value: us-west-2
            - name: CUE_MEDIA_BUCKET
              value: 'cue-media.etherport.net'
            # Cloudflare Access — the app verifies the injected Cf-Access-Jwt-Assertion
            # (signature + iss + aud against the team JWKS) and maps the Google email to
            # the Cue user, so a forwarded link can't impersonate. Non-secret identifiers
            # (the AUD is in every JWT; team domain is public). Set up in
            # infra/terraform/cloudflare/cue-access.tf.
            - name: CUE_CF_ACCESS_TEAM_DOMAIN
              value: 'etherport.cloudflareaccess.com'
            - name: CUE_CF_ACCESS_AUD
              value: '8b91aee4901cf89710ab95cd3a9008830c687f72ce70bd2eafc0759288010ad3'
            # Enable the interaction-style learn loop in dev (per deploy spec).
            - name: CUE_INTERACTION_LEARNING
              value: 'true'
            # 2026-06-27: enable user bug reporting + the owner bug-admin approval view
            # (cue repo docs/bug-reporting-plan.md). CUE_GITHUB_TOKEN lives in the SOPS cue-app
            # secret; CUE_MEDIA_BUCKET (S3 screenshots) is set above. The /ui/admin/* path is
            # owner-gated in-app (CF-email == CUE_OWNER_EMAIL, fail-closed); a CF Access edge
            # policy restricting /ui/admin/* to the owner is a recommended defense-in-depth add.
            - name: CUE_BUG_REPORTS
              value: 'true'
            - name: CUE_OWNER_EMAIL
              # Comma-separated bug-admin allow-list (owner + co-admin Aidan) — gates /ui/admin/bugs
              # + the owner /bug chat commands (CF-Access email match, fail-closed).
              value: 'grahamsm@gmail.com,aidan.eichman@gmail.com'
            # 2026-06-02: enable the daily-state + surfaces features (built + adversarially
            # reviewed + eval-validated, no regression). today-state extraction (chat →
            # daily_state), inbound-photo classification (workout photos log cardio), and
            # the proactive condition check-in push (in-process scheduler; safe at-most-once
            # via the proactive_pings ledger; tz-aware window; /quiet to opt out).
            - name: CUE_TODAY_STATE_EXTRACTION
              value: 'true'
            - name: CUE_PROACTIVE_CHECKINS
              value: 'true'
            # 2026-06-23: enable Web Push (browser push notifications). VAPID_PUBLIC_KEY /
            # VAPID_PRIVATE_KEY / VAPID_SUBJECT are sourced from the cue-app secret
            # (envFrom). Keys generated via `pnpm vapid-keys` (src/cli/vapid-keys.ts);
            # subject = mailto:grahamsm@gmail.com.
            - name: CUE_WEB_PUSH
              value: 'true'
            # 2026-06-02: enable meal-assist Phase-1 (built + adversarially reviewed,
            # 17 findings fixed, 222 tests green). CUE_MEAL_ROUTER = the where-router
            # (delivery/out/cook) + pending_flow continuation (fixes lost-context); the
            # always-on deep-link CTA is host-anchored. CUE_MEAL_COACH = text/photo
            # meal-log → coach take + ONE clarifying-answer loop (roll:false re-estimate,
            # no double-count). Migration 0009 adds the pending_flows table.
            # 2026-06-02 (later): enable meal-assist §3a published-macro tightening (a clean
            # named-chain meal-log pulls the chain's official macros to tighten the estimate;
            # found:false → estimate unchanged), and capturing a GI symptom mentioned in chat
            # into the day's digestion_status (escalation-only, positive-only). Both built +
            # adversarially reviewed; ship dormant-by-default, enabled here.
            - name: CUE_MEAL_MACRO_LOOKUP
              value: 'true'
            - name: CUE_DIGESTION_FROM_CHAT
              value: 'true'
            # 2026-06-02 (dogfooding round 2): location-aware delivery lookup, meal-log
            # double-count dedup, and concise meal-log replies. Built + adversarially
            # reviewed (impl review: 4 confirmed of 14; the two MAJOR dedup atomicity/
            # flag-flip bugs FIXED in commit 117af56 before enabling). DEDUP+BRIEF enabled
            # together (the brief single total is only truthful once dedup prevents
            # double-counts). 250 tests green. User-authorized enable.
            # 2026-07-02 (ledger phase 3 start, owner-approved): dual-write ON — meal_entries
            # written alongside the legacy path (which stays authoritative), shadow-compare
            # logs any divergence. History backfilled same day (27 created / 20 pre-stamping
            # rows unresolvable, all ≤06-24). Read flip only after N clean dogfooding days.
            - name: CUE_MEAL_LEDGER
              value: 'true'
            # 2026-06-02 (coach quality): surface the digestion/quiet-gut avoid-list ONLY when
            # the turn is about food/gut, and collapse durable GI-trigger facts to a conditional
            # reference — kills the "no orzo every time" boilerplate. A/B-validated (avoid-
            # relevance subscore up; no correctness regression). The honest-specifics /
            # no-state-recital / variation prompt changes ride the COACH_PROMPT_VERSION bump.
            # 2026-06-03 (coach quality, prose overhaul): the user-facing reply is now rich
            # adaptive coaching PROSE (the `reply` field) instead of the structured
            # Decision/Why/Target template — closing the gap to the original GPT-thread voice.
            # Tuned + A/B-validated on a 13-turn gold set mined verbatim from the real thread:
            # prose 75.4 vs template 70.0 overall, 85% vs 62% pass; clears template on
            # correctness + specificity, with avoidRelevance +22 and voice +11. Rides the
            # COACH_PROMPT_VERSION bump (prose-meal-anchor-scoped): meal-log macro anchor,
            # time-neutral framing, training-day carbs, food-turn-only avoids. User-authorized.
            # 2026-06-03 (delivery deep-links): render up to 3 real nearby storefront links
            # (Uber Eats / DoorDash / Talabat / Deliveroo, from the live-lookup citations) as
            # one-tap inline URL buttons instead of a single pasted link. Host+path
            # anchored (rejects listicles/lookalikes); search pushed to surface specific
            # storefronts. Honest limit: opens the store in the user's app (no pre-filled cart).
            # Unit-tested (262 green); not gold-set-evaluable (needs live search). User-authorized.
            - name: CUE_DELIVERY_LINKS
              value: 'true'
            # 2026-06-04 (multi-photo): a 2nd meal photo within ~3 min is treated as another
            # ANGLE of the same meal — the two reads are FUSED into one higher-confidence estimate
            # and rolled ONCE (replaces the first via correctsRecommendationId), so the day total
            # never double-counts; reply says "got both angles". Pure fusion unit-tested; rides
            # cue@b058b4c+. User-authorized after dogfooding.
            # 2026-06-04 (photo UX): when a meal PHOTO's vision confidence isn't HIGH, the coach
            # OPENS by hedging WHAT the food is ("that looks like a salad with chicken…") + invites a
            # one-line correction, instead of asserting a possibly-wrong dish (the "bulgogi bowl"
            # mis-ID). Photo-only (a text log is the user's own words). Needs CUE_MEAL_COACH (on).
            # Pure mealCoachMessage directive, unit-tested; rides cue@20b4c5b+. User-authorized.
            # 2026-06-04 (album fusion): multiple photos of the same meal sent close together
            # arrive as racing requests → without buffering they fuse-miss and reply N times. When ON,
            # album items are buffered (2.5s debounce) and fused into ONE estimate + ONE reply by
            # chaining the existing fusion path (forceMeal + skipCoach intermediates; replaces the roll,
            # never double-counts; converges on the meal_photo dedup flow so a straggler/stray angle
            # fuses too). Needs CUE_MEAL_MULTIPHOTO (on). Adversarially reviewed (all 4 majors fixed) +
            # tested (AlbumCollector + flushAlbum chain); rides cue@eba57db (image :latest, CI green).
            # User-authorized.
            # 2026-06-07 (food-search + coach quality, from owner dogfooding in NYC):
            # CUE_FOOD_FOLLOWUP — after live restaurant picks, a follow-up refinement ("something
            # egg-y", "anything closer", "find me a spot") re-enters the LIVE lookup instead of
            # falling to /coach/chat (which has no feed → "no live listings"); a short food_search
            # flow carries the location + the last ~3 requests so a stated preference ("not the
            # usual protein bowl") survives the re-search. CUE_LOOKUP_PROXIMITY — a coords pin is
            # parsed as real coordinates (not a bogus city-wide search term), so the lookup ranks
            # CLOSEST-first + names the neighborhood (fixes "recommended LES while in Midtown");
            # verified live: all picks returned in Hell's Kitchen for the user's coords.
            # CUE_ACTIVITY_LEADIN — weaves ONE activity question into a nutrition turn when today's
            # training is unknown, throttled to <=1x/day via proactive_pings (the integrative ask).
            # All flag-gated, unit-tested + live-validated; ride cue@020d21d. User-authorized.
            # 2026-06-07 (daily_state write path): CUE_TODAY_FROM_MEALS — run the today-state
            # extractor on a meal LOG / photo caption too (not just /coach/chat), so "had eggs
            # after my run" or a "post-gym lunch" photo sets completedCardio/Strength in
            # daily_state BEFORE the meal take — the real food<->activity integration (and the
            # activity lead-in then correctly stays quiet because training is KNOWN). Needs
            # CUE_TODAY_STATE_EXTRACTION (on). CUE_TODAY_WEB — a read-only, auto-refreshing web
            # view at GET /ui/today?userId=<uuid> (now also reachable via CF Access SSO on the
            # public tunnel). Both unit-tested; ride cue@e9488cc.
            # User-authorized. (parseCoords false-positive fix from the adversarial review: cue@e8977b0.)
            # 2026-06-08: capture meals stated in CHAT into daily_state — a /coach/chat turn that
            # reports eaten food ("today I've had the omelette + a bar") estimates + rolls it (via
            # /meals/log skipCoach) BEFORE the reply, so Today + the coach's running totals agree.
            # TWICE adversarially reviewed; both double-count blockers fixed (B1 one-running-roll/day
            # dedup via correctsRecommendationId; B2 planned-meal strip + estimator backstop). Rides
            # cue@ab8c096+. Documented residuals accepted behind the flag: cross-surface dedup (chat
            # mention + later explicit photo of the SAME meal not yet linked — mitigated by the meal
            # showing on the dashboard) and the pre-existing dedup concurrent-replace race (single-
            # device assumption). Needs CUE_MEAL_COACH (on). User-authorized after review.
            # 2026-06-08: record an EXPLICIT "no workout today" (rest day). The today-state extractor
            # sets daily_states.rest_day on a no-training statement ("no workout", "rest day",
            # "skipping the gym"); the coach then honors a declared rest day and never assumes a
            # workout from an earlier day's messages. Positive-only (never clears a logged workout);
            # a real completedStrength/Cardio overrides it in the prompt. Needs
            # CUE_TODAY_STATE_EXTRACTION (on); migration 0010 adds the column. Rides cue@fb36d47.
            - name: CUE_REST_DAY
              value: 'true'
            # 2026-06-08: multi-thing meal parsing — a text meal-LOG (and chat-capture, via
            # /meals/log) estimates the COMBINED total of EVERY meal/snack reported in one message
            # + ignores non-food (activity, plans, questions), so "had the sweetgreen for lunch, a
            # barbells bar for a snack, no workout today" captures BOTH foods instead of dropping one
            # / returning 0. Adversarially reviewed: NO code blockers (lead synthesis; the cautious
            # holds were behavioral + one misframed — the roll uses the LLM total, not a code-sum of
            # items). Required: CUE_MEAL_DEDUP on (it is). Watch-items to monitor: intra-estimate
            # dedup on a restated cumulative, non-food leakage in mixed sentences, vague-item typical
            # estimates. Rides cue@80b0a6c. User-authorized after review.
            # ITEMIZE (needs CUE_MEAL_MULTI): a multi-item log estimates each item separately and the
            # day total becomes the SUM of the items (not the model's holistic best_guess, which low-
            # balled a big multi-meal day — dogfooding: sweetgreen 2x-chicken + bar + sushi + mochi
            # came back ~1,100 for ~1,800 of food), and Today shows ONE ROW PER ITEM that reconciles
            # to the total. Twice adversarially reviewed: NO-GO (2 must-fixes) → fixed → re-review GO.
            # Blocker fixed: macro-lookup no longer collapses a summed multi-item total to one chain
            # item (shouldLookupPublishedMacros skips items>=2). Major fixed: only rows STAMPED
            # itemized (text path, itemizeTotals actually ran) explode — photos/fallbacks stay one
            # combined row, so rows always reconcile to Eaten. Rides cue@ffd418b. User-authorized
            # after review.
            # MACRO CACHE (needs CUE_MEAL_MACRO_LOOKUP): cache a named-chain item's PUBLISHED macros
            # in published_macro_cache (migration 0011) so a repeat of the user's regular order is an
            # instant, free hit instead of another web search. HIT TTL 90d / MISS TTL 7d (self-heals).
            # Cache I/O is best-effort — any DB error falls back to a live lookup. Adversarially
            # reviewed: GO (correct TTL/upsert/zero-cost, chain-scoped key, dormant-gated). Rides
            # cue@44fb97a. User-authorized after review.
            # PER-ITEM macro tightening (needs MULTI + ITEMIZE + MACRO_LOOKUP + MACRO_CACHE +
            # DATABASE_URL; enforced fail-closed in env superRefine). In a multi-item log, tighten
            # ONLY the clean named-chain item(s) from published macros and re-sum (never rewrite the
            # whole total — that was the collapse bug). Twice reviewed: NO-GO (chain-detection major)
            # → fixed (detect from full message, sole-chain attribution with other-source guard,
            # text-level customization suppression) → re-review GO, no must-fix. Rides cue@44fb97a.
            # User-authorized after review.
            # Point the coach (reasoning capability) at Claude Fable 5. First attempt
            # (8f2f842) was reverted (5f25d28) because the gateway forced tool_choice and
            # Fable 5 400s on that. SAFE NOW: cue@baf383f added an auto/fallback tool-choice
            # path (createStructured) — forced first, on the specific 400 it degrades to
            # tool_choice:auto + a nudge — verified LIVE against claude-fable-5 (2026-06-10
            # probe: structured estimate returned via the fallback). Standing user directive
            # "OK while in testing mode". If a live coach turn fails, REVERT immediately.
            # NOTE: src/config/pricing.ts claude-fable-5 rates are PROVISIONAL (Opus-4.8).
            # Reverted to Opus 4.8 (2026-06-14): Anthropic RETIRED claude-fable-5 — the
            # API now 404s "Claude Fable 5 is not available. Please use Opus 4.8." cue@<next>
            # adds an automatic model-unavailable fallback, but the explicit default is Opus.
            - name: CUE_MODEL_REASONING
              value: 'claude-opus-4-8'
            # Per-user web auth (cue@PR#2, 2026-06-11): every route except /health +
            # the PWA shell assets needs a verified CF-Access JWT or a SIGNED access link
            # (pnpm mint-web-token) or the in-process internal header. Closes the
            # DECISIONS 2026-06-08 IDOR hard gate for multi-user.
            # web client. CUE_WEB_TOKEN_SECRET rides the cue-app SOPS secret;
            # fail-closed superRefine (auth on without the secret refuses to boot).
            # Conversational intake (cue PR #3): a bare-provisioned user (pnpm
            # provision-user) is interviewed by the coach for the required profile fields;
            # answers fill the profile (fill-only); afterwards optional gaps are asked at
            # most 1x/day (proactive_pings-throttled). Collaborator #2 registers in-chat.
            - name: CUE_CHAT_INTAKE
              value: 'true'
            # Apple Health ingest (cue PR #10, Phase 1 wiring): registers POST
            # /ingest/healthkit (auth = the web-auth token as Bearer). Reachable on the
            # tailnet Ingress; nothing posts until the phone exporter is configured.
            - name: CUE_HEALTHKIT_INGEST
              value: 'true'
            # Apple Health setup capture — DONE. The HAE metrics + workouts adapters are
            # built and live (cue 43d9906), so exports route through them, not capture.
            # Left OFF; re-enable only to map a NEW unsupported payload shape. cue PR #11.
            - name: CUE_HEALTHKIT_CAPTURE
              value: 'false'
            # Testing-phase budget (owner-directed 2026-06-12): $100/mo ALL-IN across all
            # users (global calendar-month cap; cue PR #5). Tripped -> a deterministic
            # "budget reached" reply, no AI call. Safety gates are never cost-gated.
            - name: CUE_MONTHLY_COST_CAP_USD
              value: '100'
            # W3 (cue PR #6): reuse live-lookup findings for the same (area, craving)
            # within 2h — refinements/re-asks skip the billed web search.
            - name: CUE_LOOKUP_CACHE
              value: 'true'
            - name: CUE_FIND_FOOD
              value: 'true'
          # ANTHROPIC_API_KEY, CUE_WEB_TOKEN_SECRET, VAPID_*, and the CF healthkit
          # service token come from the cue-app Secret.
          # optional: true so the pod is healthy before the secret is populated
          # (all of these are optional at boot — see src/config/env.ts; the
          # AI gateway asserts only when used).
          envFrom:
            - secretRef:
                name: cue-app
                optional: true
          volumeMounts:
            # M75 IRSA: projected SA token (aud sts.amazonaws.com) for web identity.
            - name: aws-iam-token
              mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 20 # allow ~60s for first boot + migrations
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
      # M75 IRSA: projected SA token (aud sts.amazonaws.com) → the AWS SDK exchanges
      # it for short-lived creds for wind-irsa-cue-media. No static keys on the pod.
      volumes:
        - name: aws-iam-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 3600
                  path: token
