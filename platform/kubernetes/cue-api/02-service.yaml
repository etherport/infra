apiVersion: v1
kind: Service
metadata:
  name: cue-api
  namespace: cue
  labels:
    app: cue-api
spec:
  # ClusterIP only — reached publicly via the cloudflared tunnel + CF Access
  # (per-path: /health bypass, /ingest/healthkit service token, else Google SSO —
  # cue-access.tf) and otherwise over the tailnet / in-cluster. No LB/Ingress/cert-manager.
  type: ClusterIP
  selector:
    app: cue-api
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
