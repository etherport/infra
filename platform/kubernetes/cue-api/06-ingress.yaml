---
# HTTPS exposure of the Cue API on the tailnet, via the Tailscale operator's Ingress
# (ingressClassName: tailscale). Unlike the raw-TCP LoadBalancer (05-tailscale-svc.yaml,
# http://cue-api…:3000), this terminates TLS with a real *.ts.net cert, giving a SECURE
# CONTEXT at https://cue.<tailnet>.ts.net — REQUIRED for the PWA's browser Geolocation
# ("share my location"): browsers silently deny geolocation on plain-HTTP origins (no prompt).
# Also a cleaner URL (no :3000). Same tailnet-ACL trust model; the public cloudflared tunnel
# (CF Access per-path: SSO for the app, service tokens for /ingest and /health — the
# /health bypass was replaced by the cue-health-probe service token 2026-07-03) is the
# other reach. tag:cluster-ingress is the dedicated
# K8s-operator ingress tag (in infra/tailscale/policy.hujson).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cue-api
  namespace: cue
  annotations:
    # tag:k8s — the tag the operator's OAuth client is permitted to apply (same as the
    # cue-db-ts / cue-api-ts LoadBalancers). tag:cluster-ingress 400s here ("invalid or not
    # permitted" — it's not in this operator's allowed tags), so the cert/proxy never
    # provisions. Add tag:cluster-ingress to the operator OAuth client in the Tailscale admin
    # later if cleaner ingress-vs-service tag separation is wanted; tag:k8s works today.
    tailscale.com/tags: "tag:k8s"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: cue-api # the ClusterIP Service (02-service.yaml)
      port:
        number: 3000
  tls:
    - hosts:
        - cue # → https://cue.<tailnet>.ts.net
