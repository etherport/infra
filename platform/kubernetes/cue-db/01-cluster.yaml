---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cue-db
  namespace: cue
spec:
  description: "PostgreSQL 16 for the Cue app. Drizzle owns the schema (app runs its own migrations); pgvector pre-enabled."

  # Single instance — this is a single-user dogfood. CNPG can scale to HA
  # (instances: 3) later by bumping this; storage class supports expansion.
  instances: 1

  # Same operand image as the shared postgres-cluster. Confirmed to ship
  # PostgreSQL 16.4 + pgvector 0.8.0 available, gen_random_uuid() (core).
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  primaryUpdateStrategy: unsupervised

  storage:
    size: 5Gi              # modest; ceph-rbd allows online expansion
    storageClass: ceph-rbd

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

  postgresql:
    parameters:
      shared_buffers: "128MB"
      effective_cache_size: "256MB"
      work_mem: "8MB"
      maintenance_work_mem: "64MB"
      max_connections: "100"
      log_statement: "ddl"
      log_min_duration_statement: "1000"

  # Bootstrap: create the `cue` database (UTF8 default) owned by a login role
  # `cue`. NO `secret:` is specified, so CNPG auto-generates the `cue-db-app`
  # Secret with a strong random password + ready-made connection URIs — the
  # password never lands in git.
  bootstrap:
    initdb:
      database: cue
      owner: cue
      # pgvector ships in the image but is NOT a "trusted" extension, so the
      # non-superuser `cue` owner can't CREATE EXTENSION vector itself. Enable
      # it once here (postInitApplicationSQL runs in the `cue` DB as the
      # bootstrap superuser). The app's `CREATE EXTENSION IF NOT EXISTS vector`
      # migration then becomes a no-op. gen_random_uuid() is core — no ext.
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;

  monitoring:
    enablePodMonitor: true

  # Continuous WAL archiving + scheduled full backups to S3 via Barman, same as
  # the shared postgres-cluster. Reuses the existing postgres-barman bucket —
  # CNPG isolates each cluster under its own serverName (= cluster name), so
  # cue-db writes to s3://postgres-barman.wind.etherport.net/cue-db/ with no
  # collision. Creds in the barman-s3-credentials secret (03, this dir).
  # Daily base backup is triggered by the ScheduledBackup CR (04). Restore via
  # bootstrap.recovery against an externalCluster — see cnpg/README.md.
  backup:
    barmanObjectStore:
      destinationPath: s3://postgres-barman.wind.etherport.net
      s3Credentials:
        accessKeyId:
          name: barman-s3-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: barman-s3-credentials
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
        encryption: AES256
      data:
        compression: gzip
        encryption: AES256
    retentionPolicy: "30d"
