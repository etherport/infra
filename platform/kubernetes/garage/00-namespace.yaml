---
# Garage — single-node S3 server = velero's PRIMARY backup repo (M137). Chosen
# over MinIO because MinIO's erasure backend rejects NFS ("insufficient drives
# online"); Garage supports SPLIT storage: metadata on a small Ceph-RBD PVC
# (block — 10Gi, ~20Gi raw, trivial) + immutable data blocks on the NAS over NFS
# (22 TB free). Velero backups + Kopia maintenance run against the NAS over the
# LAN → zero S3 egress. S3 is offsite DR only.
apiVersion: v1
kind: Namespace
metadata:
  name: garage
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
    # M151 tier 13 (networkpolicies/22-tier-garage.yaml): garage holds the PRIMARY
    # velero backups — the in-cluster ransomware target. Audit-first rollout 2026-07-25.
    netpol.wind/enforced: "true"
