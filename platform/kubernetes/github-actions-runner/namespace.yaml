apiVersion: v1
kind: Namespace
metadata:
  name: github-actions-runner
  labels:
    # M72 tail (2026-06-28): tier=system infra, baseline-clean. ARC controller +
    # runner pods pass `baseline` but fail `restricted` (they need caps /
    # allowPrivilegeEscalation), so baseline is the enforced ceiling. Verified via
    # `kubectl label ns github-actions-runner pod-security.kubernetes.io/enforce=baseline
    # --dry-run=server` (no existing-pod violations). Labeled here (not the central
    # clusters/wind namespace-pss-labels.yaml patch) because this ns is applied by the
    # platform-level kustomization, outside clusters/wind's build.
    tier: system
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/enforce: baseline
