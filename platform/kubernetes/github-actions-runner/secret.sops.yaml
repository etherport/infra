# GitHub Actions Runner Secret
# This file should be encrypted with SOPS before committing
#
# Create a GitHub PAT at: https://github.com/settings/tokens
# Required scopes: repo (full control)
#
# To encrypt: sops -e -i secret.yaml
---
apiVersion: v1
kind: Secret
metadata:
  name: github-actions-runner-config
  namespace: github-actions-runner
type: Opaque
stringData:
  values.yaml: |
    githubConfigSecret:
      github_token: "ghp_YOUR_TOKEN_HERE"
