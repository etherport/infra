apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-automation
spec:
  replicas: 1
  strategy:
    type: Recreate # Ensures PVC is unmounted before new pod starts
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [
            {
              "name": "vlan202-client",
              "namespace": "multus-system",
              "ips": ["10.10.202.25/24"],
              "gateway": ["10.10.202.1"]
            },
            {
              "name": "vlan204-iot",
              "namespace": "multus-system",
              "ips": ["10.10.204.25/24"],
              "gateway": ["10.10.204.1"]
            },
            {
              "name": "vlan205-security",
              "namespace": "multus-system",
              "ips": ["10.10.205.25/24"],
              "gateway": ["10.10.205.1"]
            }
          ]
    spec:
      containers:
      - name: home-assistant
        image: ghcr.io/home-assistant/home-assistant:2026.4.4 # {"$imagepolicy": "flux-system:home-assistant"}
        ports:
        - name: http
          containerPort: 8123
          protocol: TCP
        env:
        - name: TZ
          value: "America/Los_Angeles"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: config-yaml
          mountPath: /config/configuration.yaml
          subPath: configuration.yaml
          readOnly: true
        - name: secrets
          mountPath: /config/secrets.yaml
          subPath: secrets.yaml
          readOnly: true
        livenessProbe:
          httpGet:
            path: /
            port: 8123
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8123
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
        securityContext:
          privileged: true # Required for device access
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: home-assistant-config
      - name: config-yaml
        configMap:
          name: home-assistant-config
      - name: secrets
        secret:
          secretName: home-assistant-secrets
