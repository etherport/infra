apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-automation
spec:
  replicas: 1
  strategy:
    type: Recreate # Ensures PVC is unmounted before new pod starts
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [
            {
              "name": "vlan202-client",
              "namespace": "multus-system",
              "ips": ["10.10.202.25/24"],
              "gateway": ["10.10.202.1"]
            },
            {
              "name": "vlan204-iot",
              "namespace": "multus-system",
              "ips": ["10.10.204.25/24"],
              "gateway": ["10.10.204.1"]
            },
            {
              "name": "vlan205-security",
              "namespace": "multus-system",
              "ips": ["10.10.205.25/24"],
              "gateway": ["10.10.205.1"]
            }
          ]
    spec:
      # HA is a singleton (Multus macvlan IPs would collide across replicas
      # and integrations like Z-Wave/Zigbee would fight for device state),
      # so we maximise survival of the single instance instead of true HA:
      #   * priorityClassName ensures HA is the last thing the scheduler
      #     evicts under resource pressure
      #   * toleration tolerationSeconds: 10 makes node-loss failover
      #     take 10s instead of the default 5 min
      #   * nodeAffinity prefers non-GPU workers (same lesson as Traefik —
      #     a GPU reboot shouldn't drag HA down with it)
      priorityClassName: k8s-cluster-critical
      terminationGracePeriodSeconds: 30
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - k8s-gpu1
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.5.3 # {"$imagepolicy": "flux-system:home-assistant"}
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          env:
            - name: TZ
              value: "America/Los_Angeles"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: config-yaml
              mountPath: /config/configuration.yaml
              subPath: configuration.yaml
              readOnly: true
            - name: secrets
              mountPath: /config/secrets.yaml
              subPath: secrets.yaml
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: 8123
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8123
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            privileged: true # Required for device access
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: config-yaml
          configMap:
            name: home-assistant-config
        - name: secrets
          secret:
            secretName: home-assistant-secrets
