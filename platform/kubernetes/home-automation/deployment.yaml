apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-automation
spec:
  replicas: 1
  strategy:
    type: Recreate # Ensures PVC is unmounted before new pod starts
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [
            {
              "name": "vlan202-client",
              "namespace": "multus-system",
              "ips": ["10.10.202.25/24"],
              "gateway": ["10.10.202.1"]
            },
            {
              "name": "vlan204-iot",
              "namespace": "multus-system",
              "ips": ["10.10.204.25/24"],
              "gateway": ["10.10.204.1"]
            },
            {
              "name": "vlan205-security",
              "namespace": "multus-system",
              "ips": ["10.10.205.25/24"],
              "gateway": ["10.10.205.1"]
            }
          ]
    spec:
      # L26 (2026-07-01): this workload never calls the kube API — don't hand
      # every pod a cluster credential by default.
      automountServiceAccountToken: false
      # HA is a singleton (Multus macvlan IPs would collide across replicas
      # and integrations like Z-Wave/Zigbee would fight for device state),
      # so we maximise survival of the single instance instead of true HA:
      #   * priorityClassName ensures HA is the last thing the scheduler
      #     evicts under resource pressure
      #   * toleration tolerationSeconds: 10 makes node-loss failover
      #     take 10s instead of the default 5 min
      #   * nodeAffinity prefers non-GPU workers (same lesson as Traefik —
      #     a GPU reboot shouldn't drag HA down with it)
      priorityClassName: k8s-cluster-critical
      terminationGracePeriodSeconds: 30
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - k8s-gpu1
      initContainers:
        # Install the localtuya custom component into the config volume so HA can
        # do LOCAL Tuya control (no cloud dependency / no expiring subscription).
        # Pinned to an IMMUTABLE COMMIT SHA (a tag can move); verifies the manifest
        # version before installing; idempotent (skips if that SHA is installed).
        # HA loads any component under /config/custom_components on startup.
        # Source: github.com/xZetsubou/hass-localtuya (the maintained localtuya fork).
        - name: install-localtuya
          image: alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              SHA=ea1954154ca485b5c82429c3da6a39f08ec6eec3   # tag 2025.11.0
              VER=2025.11.0
              DEST=/config/custom_components/localtuya
              if [ -f "$DEST/.installed-$SHA" ]; then echo "localtuya $SHA already installed"; exit 0; fi
              mkdir -p /config/custom_components /tmp/lt && cd /tmp/lt
              wget -qO- "https://codeload.github.com/xZetsubou/hass-localtuya/tar.gz/$SHA" | tar xz
              SRC="hass-localtuya-$SHA/custom_components/localtuya"
              grep -q "\"version\": *\"$VER\"" "$SRC/manifest.json" || { echo "manifest version != $VER, aborting"; exit 1; }
              rm -rf "$DEST"
              cp -r "$SRC" "$DEST"
              touch "$DEST/.installed-$SHA"
              echo "installed localtuya $VER ($SHA)"
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.8.0@sha256:a21689ef0510df9760ee11bab4d6b2fef3ed5c1a29ed9c3224271597a23729eb # {"$imagepolicy": "flux-system:home-assistant"}
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          env:
            - name: TZ
              value: "America/Los_Angeles"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: config-yaml
              mountPath: /config/configuration.yaml
              subPath: configuration.yaml
              readOnly: true
            - name: secrets
              mountPath: /config/secrets.yaml
              subPath: secrets.yaml
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: 8123
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8123
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
          # H46 (2026-07-25): privileged REMOVED. The old `privileged: true
          # # Required for device access` was cargo cult — this HA uses only
          # network integrations (HomeKit/Hue/Roomba/Nest/SmartThings/…), mounts
          # no /dev devices or hostPaths, and LAN presence (mDNS/HomeKit) comes
          # from the Multus vlan202 interface, which the CNI wires up BEFORE the
          # container starts (no container privilege involved). HA was the only
          # privileged app pod in the cluster while also being edge-reachable —
          # the worst exposure combination (see remote-access-zt-review-2026-07-25).
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: config-yaml
          configMap:
            name: home-assistant-config
        - name: secrets
          secret:
            secretName: home-assistant-secrets
