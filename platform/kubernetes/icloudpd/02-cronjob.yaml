apiVersion: batch/v1
kind: CronJob
metadata:
  name: icloud-photos-sync
  namespace: icloudpd
spec:
  schedule: "0 1 * * *"  # Daily at 1:00 AM Pacific time
  timeZone: "America/Los_Angeles"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid  # Don't allow overlapping syncs
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: icloud-photos-sync
        spec:
          restartPolicy: Never
          containers:
          - name: icloudpd
            image: icloudpd/icloudpd:latest
            command:
              - /bin/sh
              - -c
              - |
                #!/bin/sh
                set -e

                START_TIME=$(date +%s)

                # Run icloudpd and capture exit code
                if icloudpd \
                  --directory /backup/iCloud \
                  --username "$APPLE_ID" \
                  --password "$APPLE_PASSWORD" \
                  --recent 5000 \
                  --folder-structure "{:%Y/%Y-%m-%d}" \
                  --set-exif-datetime; then
                  EXIT_CODE=0
                  STATUS="success"
                else
                  EXIT_CODE=$?
                  STATUS="failure"
                fi

                END_TIME=$(date +%s)
                DURATION=$((END_TIME - START_TIME))

                # Push metrics to Prometheus PushGateway
                METRICS_FILE="/tmp/icloud-metrics.txt"
                cat <<EOF > "$METRICS_FILE"
                # HELP icloud_sync_success Whether the last sync was successful (1=success, 0=failure)
                # TYPE icloud_sync_success gauge
                icloud_sync_success{source="icloud",destination="nfs"} $([ "$STATUS" = "success" ] && echo 1 || echo 0)

                # HELP icloud_sync_duration_seconds Duration of the sync in seconds
                # TYPE icloud_sync_duration_seconds gauge
                icloud_sync_duration_seconds{source="icloud",destination="nfs"} ${DURATION}

                # HELP icloud_sync_last_run_timestamp Unix timestamp of last sync
                # TYPE icloud_sync_last_run_timestamp gauge
                icloud_sync_last_run_timestamp{source="icloud",destination="nfs"} ${END_TIME}
                EOF

                # Post metrics to PushGateway
                wget --post-file="$METRICS_FILE" -O- -q "http://pushgateway.monitoring.svc.cluster.local:9091/metrics/job/icloud_photos_sync/instance/icloud"

                exit $EXIT_CODE
            env:
            - name: APPLE_ID
              valueFrom:
                secretKeyRef:
                  name: icloud-credentials
                  key: apple-id
            - name: APPLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: icloud-credentials
                  key: app-password
            volumeMounts:
            - name: backup-nfs
              mountPath: /backup
            resources:
              requests:
                memory: 512Mi
                cpu: 200m
              limits:
                memory: 2Gi
                cpu: 2000m
          volumes:
          - name: backup-nfs
            nfs:
              server: sequoia.wind.etherport.net
              path: /var/nfs/shared/Backups/Graham
