apiVersion: batch/v1
kind: CronJob
metadata:
  name: icloud-photos-sync
  namespace: icloudpd
spec:
  schedule: "0 0 * * *"  # Daily at midnight Pacific time
  timeZone: "America/Los_Angeles"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid  # Don't allow overlapping syncs
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: icloud-photos-sync
        spec:
          restartPolicy: Never
          containers:
          - name: icloudpd
            image: icloudpd/icloudpd:latest
            command:
              - /bin/sh
              - /scripts/sync-and-report.sh
            volumeMounts:
            - name: backup-nfs
              mountPath: /backup
            - name: sync-script
              mountPath: /scripts
              readOnly: true
            - name: icloud-cookies
              mountPath: /cookie-dir
              readOnly: true
            resources:
              requests:
                memory: 512Mi
                cpu: 200m
              limits:
                memory: 2Gi
                cpu: 2000m
          volumes:
          - name: backup-nfs
            nfs:
              server: sequoia.wind.etherport.net
              path: /var/nfs/shared/Backups/Graham
          - name: sync-script
            configMap:
              name: icloud-sync-script
              defaultMode: 0755
          - name: icloud-cookies
            secret:
              secretName: icloud-cookies
              defaultMode: 0400
