apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: icloud-photos-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
  - name: icloud-photos-sync
    interval: 5m
    rules:
    - alert: iCloudPhotosSyncFailed
      expr: icloud_sync_success{source="icloud",destination="nfs"} == 0
      for: 5m
      labels:
        severity: critical
        component: backup
      annotations:
        summary: "iCloud Photos sync failed"
        description: "iCloud Photos sync job has failed. Last sync status: {{ $value }}"

    - alert: iCloudPhotosSyncNotRunning
      expr: (time() - icloud_sync_last_run_timestamp{source="icloud",destination="nfs"}) > 90000
      for: 10m
      labels:
        severity: warning
        component: backup
      annotations:
        summary: "iCloud Photos sync hasn't run in 25+ hours"
        description: "iCloud Photos sync hasn't completed successfully in over 25 hours. Last run: {{ $value | humanizeDuration }} ago"

    - alert: iCloudPhotosSyncSlow
      expr: icloud_sync_duration_seconds{source="icloud",destination="nfs"} > 3600
      for: 5m
      labels:
        severity: info
        component: backup
      annotations:
        summary: "iCloud Photos sync taking longer than expected"
        description: "iCloud Photos sync took {{ $value | humanizeDuration }} to complete (>1 hour). This may indicate network issues or large photo library."
