apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kopia-repo-pvc
  namespace: backups
  annotations:
    # Bound to static PV kopia-repo-pvc-recovery (original RBD image —
    # contains the Kopia backup repository).
    # See docs/planning/long-term-stability-review-2026-05-12.md.
    kustomize.toolkit.fluxcd.io/reconcile: disabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 200Gi
  # storageClassName: ""  # omit to use your default (Ceph)
