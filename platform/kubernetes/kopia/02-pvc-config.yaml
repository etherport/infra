apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kopia-config-pvc
  namespace: backups
  annotations:
    # Bound to static PV kopia-config-pvc-recovery (original RBD image).
    # See docs/planning/long-term-stability-review-2026-05-12.md.
    kustomize.toolkit.fluxcd.io/reconcile: disabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # storageClassName: ""  # omit to use default (Ceph)
