---
# Ansible playbook to configure unattended-upgrades on all Kubernetes nodes
# Run from kubespray directory:
#   cd ~/code/infra/infra/kubespray
#   ./venv/bin/ansible-playbook -i inventory/mycluster/hosts.yaml \
#     ../platform/kubernetes/kured/configure-unattended-upgrades.yml

- name: Configure automated OS updates
  hosts: k8s_cluster
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install unattended-upgrades and dependencies
      apt:
        name:
          - unattended-upgrades
          - apt-listchanges
          - update-notifier-common
        state: present

    - name: Configure unattended-upgrades
      copy:
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        content: |
          // Automatically upgrade packages from these origins
          Unattended-Upgrade::Allowed-Origins {
              "${distro_id}:${distro_codename}-security";
              "${distro_id}ESMApps:${distro_codename}-apps-security";
              "${distro_id}ESM:${distro_codename}-infra-security";
          };

          // List of packages to NOT automatically upgrade
          Unattended-Upgrade::Package-Blacklist {
              // Example: "kubernetes*";
          };

          // Split the upgrade into the smallest possible chunks
          Unattended-Upgrade::MinimalSteps "true";

          // Automatically reboot *WITHOUT CONFIRMATION* if required
          // Kured will handle safe reboots during maintenance window
          Unattended-Upgrade::Automatic-Reboot "false";

          // If automatic reboot is enabled, reboot at this time
          Unattended-Upgrade::Automatic-Reboot-Time "03:00";

          // Automatically remove unused kernel packages
          Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";

          // Remove unused dependencies after upgrade
          Unattended-Upgrade::Remove-Unused-Dependencies "true";

          // Automatically fix interruptions
          Unattended-Upgrade::AutoFixInterruptedDpkg "true";

          // Email settings (optional)
          // Unattended-Upgrade::Mail "admin@example.com";
          // Unattended-Upgrade::MailReport "on-change";

          // Logging
          Unattended-Upgrade::SyslogEnable "true";
          Unattended-Upgrade::SyslogFacility "daemon";
        mode: '0644'
        owner: root
        group: root
      notify: Restart unattended-upgrades

    - name: Enable auto-updates
      copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          // Enable automatic updates
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Download-Upgradeable-Packages "1";
          APT::Periodic::AutocleanInterval "7";
          APT::Periodic::Unattended-Upgrade "1";
        mode: '0644'
        owner: root
        group: root
      notify: Restart unattended-upgrades

    - name: Create systemd override directory
      file:
        path: /etc/systemd/system/unattended-upgrades.service.d
        state: directory
        mode: '0755'
        owner: root
        group: root

    - name: Create unattended-upgrades systemd override
      copy:
        dest: /etc/systemd/system/unattended-upgrades.service.d/override.conf
        content: |
          [Service]
          # Run at lower priority to not impact cluster workloads
          Nice=10
          IOSchedulingClass=idle
        mode: '0644'
        owner: root
        group: root
      notify:
        - Reload systemd
        - Restart unattended-upgrades

    - name: Ensure unattended-upgrades is enabled and running
      systemd:
        name: unattended-upgrades
        enabled: yes
        state: started

    - name: Check if reboot is required
      stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Display reboot status
      debug:
        msg: "{{ 'Reboot REQUIRED (Kured will handle during maintenance window)' if reboot_required_file.stat.exists else 'No reboot required' }}"

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Restart unattended-upgrades
      systemd:
        name: unattended-upgrades
        state: restarted
