# M73 — Kyverno guardrail: every container must declare CPU + memory requests.
# ✅ ENFORCING (2026-06-28). Safe because 02-add-default-resource-requests.yaml MUTATES a tiny
# default request (10m/32Mi) onto any container missing one BEFORE this validate webhook runs —
# so NO pod can be blocked, including injected sidecars and dynamically-created pods (tailscale
# proxies, ARC ephemeral runners, ceph csi). Well-configured charts (prometheus, grafana,
# alertmanager, …) keep their own larger requests — the mutate only fills gaps. failurePolicy:
# Ignore → a down/slow controller fails OPEN (never wedges admission). Existing pods aren't
# evicted; they get mutated-compliant on their next rollout.
# (Division of labour: PSA handles pod-security posture; Kyverno does the guardrails PSA can't —
#  resource requests, image tags, later image-signature/provenance for H30.)
# disallow-latest-tag (01-) also ENFORCING — see its header.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-requests
  annotations:
    policies.kyverno.io/title: Require Resource Requests
    policies.kyverno.io/severity: medium
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/description: >-
      Containers must set resources.requests.cpu and .memory so the scheduler can place
      them and one workload can't starve its neighbours. Audit-only for now (M73).
spec:
  background: true
  webhookConfiguration:
    failurePolicy: Ignore
  rules:
    - name: check-container-requests
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              # System + operator namespaces whose pods legitimately omit requests
              # (managed by their own charts/operators, out of our control).
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - flux-system
                - kyverno
                - cilium-secrets
                - metallb-system
                - multus-system
                - gpu-operator-system
                - gpu-operator
                - ceph-csi
                - velero
      validate:
        failureAction: Enforce
        message: "Every container must set resources.requests.cpu and resources.requests.memory."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    memory: "?*"
                    cpu: "?*"
