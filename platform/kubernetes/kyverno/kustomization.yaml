apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Kyverno ClusterPolicies (M73). The Kyverno ENGINE is a HelmRelease
# (clusters/wind/helm-releases/kyverno.yaml); these are the policies.
# 00 require-resource-requests = Audit (enforced via the 02 mutate below);
# 01 disallow-latest-tag = Enforce; 02 add-default-resource-requests = Mutate.
# All failurePolicy Ignore (fail-open) — see README.md.
resources:
  - 00-require-resource-requests.yaml
  - 01-disallow-latest-tag.yaml
  - 02-add-default-resource-requests.yaml
