apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: primary
  namespace: metallb-system
spec:
  addresses:
    - 10.10.201.5/32           # Technitium DNS VIP
    # Note: 10.10.201.20 reserved for WireGuard VIP (managed by Keepalived, not MetalLB)
    - 10.10.201.70-10.10.201.90
  autoAssign: true
  avoidBuggyIPs: false

# L2Advertisement REMOVED 2026-05-31 — BGP migration Phase D (cutover). The
# `primary` pool is now advertised BGP-only (BGPPeer + BGPAdvertisement below),
# which ends the L2 ARP / MAC-ownership churn behind the M36 .5/.71 IP-conflict
# alerts. Cross-VLAN VIP traffic was already flowing over BGP (more-specific /32
# preferred over the connected /24), so this just drops the redundant ARP path.
# Rollback: git-revert this change to restore the L2Advertisement — VIPs keep
# their IPs, so re-adding L2 is non-disruptive.

# =============================================================================
# BGP (M18/M36 migration, Phase C — runs ALONGSIDE the L2Advertisement above).
# Each speaker peers eBGP to the UDM (the VLAN-201 gateway since Phase B) and
# advertises the pool VIPs as /32s. The UDM prefers the more-specific /32 when
# the session is up and falls back to L2/ARP if it drops, so this is safe to run
# in parallel. Phase D removes the L2Advertisement, which is what finally stops
# the ARP/MAC ownership churn behind the M36 .5/.71 IP-conflict alerts.
# UDM side (not modelled by the paultyng provider — applied via the UDM BGP UI):
#   router bgp 64512 / remote-as 64513 / listen range 10.10.201.0/24.
# =============================================================================
---
apiVersion: metallb.io/v1beta2
kind: BGPPeer
metadata:
  name: udm
  namespace: metallb-system
spec:
  myASN: 64513          # MetalLB (cluster) ASN
  peerASN: 64512        # UDM ASN
  peerAddress: 10.10.201.1   # UDM VLAN-201 SVI (gateway since Phase B)
  # L24 Phase 3 — TCP-MD5 auth (FRR mode required; native MetalLB silently ignored this).
  # The matching key is set on the UDM peer-group `metallb` (neighbor metallb password …).
  # Secret = 02-bgp-md5-secret.sops.yaml (basic-auth, key `password`).
  passwordSecret:
    name: bgp-md5
    namespace: metallb-system

---
apiVersion: metallb.io/v1beta1
kind: BGPAdvertisement
metadata:
  name: primary-bgp
  namespace: metallb-system
spec:
  ipAddressPools:
    - primary
  aggregationLength: 32   # advertise each VIP as a /32

# L24 Phase 4 (2026-06-28): the TEMPORARY `primary-l2-temp-l24` L2Advertisement
# safety net was REMOVED here once FRR-mode BGP + TCP-MD5 were verified (8/8
# Established). Back to BGP-only for `primary` — which ends the L2 ARP/MAC churn
# (the M36 .5/.71 UDM IP-conflict alerts seen during the window). NB a stale
# `wind-l2` L2Advertisement (a Velero-restore orphan targeting a nonexistent
# `wind-pool`) was deleted 2026-06-28 — `primary` is the only pool, BGP-only.
