apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: primary
  namespace: metallb-system
spec:
  addresses:
    - 10.10.201.5/32           # Technitium DNS VIP
    # Note: 10.10.201.20 reserved for WireGuard VIP (managed by Keepalived, not MetalLB)
    - 10.10.201.70-10.10.201.90
  autoAssign: true
  avoidBuggyIPs: false

# L2Advertisement REMOVED 2026-05-31 — BGP migration Phase D (cutover). The
# `primary` pool is now advertised BGP-only (BGPPeer + BGPAdvertisement below),
# which ends the L2 ARP / MAC-ownership churn behind the M36 .5/.71 IP-conflict
# alerts. Cross-VLAN VIP traffic was already flowing over BGP (more-specific /32
# preferred over the connected /24), so this just drops the redundant ARP path.
# Rollback: git-revert this change to restore the L2Advertisement — VIPs keep
# their IPs, so re-adding L2 is non-disruptive.

# =============================================================================
# BGP (M18/M36 migration, Phase C — runs ALONGSIDE the L2Advertisement above).
# Each speaker peers eBGP to the UDM (the VLAN-201 gateway since Phase B) and
# advertises the pool VIPs as /32s. The UDM prefers the more-specific /32 when
# the session is up and falls back to L2/ARP if it drops, so this is safe to run
# in parallel. Phase D removes the L2Advertisement, which is what finally stops
# the ARP/MAC ownership churn behind the M36 .5/.71 IP-conflict alerts.
# UDM side (not modelled by the paultyng provider — applied via the UDM BGP UI):
#   router bgp 64512 / remote-as 64513 / listen range 10.10.201.0/24.
# =============================================================================
---
apiVersion: metallb.io/v1beta2
kind: BGPPeer
metadata:
  name: udm
  namespace: metallb-system
spec:
  myASN: 64513          # MetalLB (cluster) ASN
  peerASN: 64512        # UDM ASN
  peerAddress: 10.10.201.1   # UDM VLAN-201 SVI (gateway since Phase B)

---
apiVersion: metallb.io/v1beta1
kind: BGPAdvertisement
metadata:
  name: primary-bgp
  namespace: metallb-system
spec:
  ipAddressPools:
    - primary
  aggregationLength: 32   # advertise each VIP as a /32

# =============================================================================
# LoadBalancers VLAN pool (#9 / tracker M59) — VIPs on the dedicated
# 10.10.215.0/24 `LoadBalancers` VLAN (infra/terraform/unifi: unifi_network
# .loadbalancers). autoAssign:false ⇒ OPT-IN per service: every existing VIP
# stays on `primary` (201) until it is migrated deliberately, because each
# carries downstream references (DNS A-records, UDM/switch syslog targets,
# DHCP dhcp_dns) that must be cut over with the IP. Advertised BGP-only, the
# same as `primary`. Until a service opts in, MetalLB allocates nothing from
# this pool, so nothing is advertised — this block is safe/additive.
#   Staged migration runbook: docs/runbooks/lb-vlan-migration.md
# =============================================================================
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lb-vlan
  namespace: metallb-system
spec:
  addresses:
    # Dedicated VLAN with NO hosts — the whole /24 is available for VIPs, so the
    # pool is wide (the old .70-.90 squeeze was a VLAN-201 artifact: that subnet
    # shared node IPs/.50-56, DNS/.5-6, WG/.20, DHCP/.100-254). Reserve only
    # .1 (UDM SVI) + low/high headroom. Existing services keep their last octet
    # on migration (.201.70→.215.70, .73→.73, …) for muscle memory.
    - 10.10.215.10-10.10.215.250
    # NOTE: DNS deliberately NOT here. 10.10.201.5 (dns/technitium) is a
    # network-wide contract (dhcp_dns on every VLAN + VM cloud-init) and stays
    # on 201 permanently — decision 2026-05-31. Only non-DNS VIPs migrate here.
  autoAssign: false               # opt-in only: metallb.universe.tf/address-pool: lb-vlan
  avoidBuggyIPs: false

---
apiVersion: metallb.io/v1beta1
kind: BGPAdvertisement
metadata:
  name: lb-vlan-bgp
  namespace: metallb-system
spec:
  ipAddressPools:
    - lb-vlan
  aggregationLength: 32   # advertise each VIP as a /32 (same as primary-bgp)
