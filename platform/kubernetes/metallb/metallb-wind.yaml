apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: primary
  namespace: metallb-system
spec:
  addresses:
    - 10.10.201.5/32           # Technitium DNS VIP
    # Note: 10.10.201.20 reserved for WireGuard VIP (managed by Keepalived, not MetalLB)
    - 10.10.201.70-10.10.201.90
  autoAssign: true
  avoidBuggyIPs: false

---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: primary
  namespace: metallb-system
spec:
  ipAddressPools:
    - primary