---
# Single-node MinIO (SNSD) serving as velero's primary backup repo (M137).
# /data is an NFS mount from the NAS — velero backups + Kopia maintenance write
# here over the local network (zero S3 egress, zero pve NVMe). Single replica by
# design: it's a backup target, not an HA service; if it's down, backups fail
# (alerted) and restores fall back to the S3 DR copy. Recreate strategy so the
# single RWX-less NFS mount is never held by two pods at once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: minio
  labels:
    app: minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      securityContext:
        # ⚠️ Run as uid/gid 988 to MATCH the UniFi Drive share owner. The NAS
        # exports `VeleroBackup/.data` owned by 988:988 mode drwxrwx--- (verified
        # 2026-07-08), so a pod running as any other uid gets permission-denied on
        # /data. MinIO's static binary runs fine as an arbitrary uid. If UniFi ever
        # changes the share owner, re-check `ls -lan` on the NAS and update these.
        runAsUser: 988
        runAsGroup: 988
        fsGroup: 988
      containers:
        - name: minio
          # Renovate/Flux pin the digest; require-image-tag (Kyverno) needs a real tag.
          image: minio/minio:RELEASE.2025-09-07T16-13-09Z
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          envFrom:
            - secretRef:
                name: minio-credentials
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          # Inline NFS mount to the NAS — same pattern as plex / rclone / s3-sync.
          # The user creates this UniFi Drive share (~1 TB) before activation.
          nfs:
            server: sequoia.wind.etherport.net
            path: /var/nfs/shared/VeleroBackup
