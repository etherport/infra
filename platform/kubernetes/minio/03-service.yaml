---
# ClusterIP for MinIO. velero's BSL and the rclone DR job reach the S3 API at
# http://minio.minio.svc.cluster.local:9000. Console (:9001) is in-cluster only
# (front it via Traefik + Authentik forward-auth later if a UI is wanted).
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: minio
  labels:
    app: minio
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
