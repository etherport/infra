---
# Idempotent bucket creation (M137). MinIO does NOT auto-create buckets, and
# velero's BSL expects `velero` to exist. This Job waits for MinIO to be ready,
# then `mc mb --ignore-existing`. Re-runs harmlessly (Flux may re-apply). Enable
# object-lock/versioning here later if we want the local repo immutable too.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-init
  namespace: minio
  annotations:
    # Let Flux re-run it when the manifest changes without immutability errors.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: minio-bucket-init
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-08-13T08-35-41Z
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "waiting for MinIO..."
              until mc alias set local http://minio.minio.svc.cluster.local:9000 \
                    "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" 2>/dev/null; do
                sleep 3
              done
              mc mb --ignore-existing local/velero
              mc ls local
              echo "bucket ready: velero"
          env:
            # mc writes its config to $HOME/.mc; the pod runs as uid 988 which
            # can't write "/" → set a writable HOME (same gotcha as the IRSA CLIs).
            - name: HOME
              value: /tmp
          envFrom:
            - secretRef:
                name: minio-credentials
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
