---
# Additional scrape configs for non-K8s hosts
# This secret is referenced by the kube-prometheus-stack helm release
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-additional-scrape-configs
  namespace: monitoring
stringData:
  additional-scrape-configs.yaml: |
    # External hosts running node_exporter
    - job_name: 'external-nodes'
      scrape_interval: 30s
      scrape_timeout: 10s
      static_configs:
        - targets:
            - '10.10.201.6:9100'   # dns-fallback
            - '10.10.201.15:9100'  # vpn-fallback
            - '10.10.201.30:9100'  # gh-runner (self-hosted CI runner)
            - '10.10.201.45:9100'  # devbox (Claude Code dev-session host; node_exporter via base.yml)
            - '10.10.201.46:9100'  # step-ca (SSH CA — H42; the fleet's cert-SSH depends on it)
            - '10.10.201.40:9100'  # asterisk-sbc (Twilio⇄Talk SBC, telephony/911 — H42)
            - '10.10.200.41:9100'  # pve hypervisor OS (H42; via node-exporter.yml, NOT base.yml — see its header)
          labels:
            location: 'local'
            environment: 'production'
        - targets:
            # M110 (2026-07-02): ONE consolidated AWS box (edge — VPN + Tailscale +
            # Technitium DNS). The dns-aws instance (.5) was destroyed.
            - '10.10.100.10:9100'  # vpn-aws (the edge box)
          labels:
            location: 'aws'
            environment: 'production'
      relabel_configs:
        - source_labels: [__address__]
          regex: '10\.10\.201\.6:.*'
          target_label: instance
          replacement: 'dns-fallback'
        - source_labels: [__address__]
          regex: '10\.10\.201\.15:.*'
          target_label: instance
          replacement: 'vpn-fallback'
        - source_labels: [__address__]
          regex: '10\.10\.201\.30:.*'
          target_label: instance
          replacement: 'gh-runner'
        - source_labels: [__address__]
          regex: '10\.10\.201\.45:.*'
          target_label: instance
          replacement: 'devbox'
        - source_labels: [__address__]
          regex: '10\.10\.201\.46:.*'
          target_label: instance
          replacement: 'step-ca'
        - source_labels: [__address__]
          regex: '10\.10\.201\.40:.*'
          target_label: instance
          replacement: 'asterisk-sbc'
        - source_labels: [__address__]
          regex: '10\.10\.200\.41:.*'
          target_label: instance
          replacement: 'pve'
        - source_labels: [__address__]
          regex: '10\.10\.100\.10:.*'
          target_label: instance
          replacement: 'vpn-aws'

    # ---- Rack power: APC UPS + PDU via snmp_exporter (multi-target) -------------
    # One exporter serves all four devices; Prometheus supplies target/module/auth
    # per scrape and the relabel swaps __address__ to the exporter.
    # ⚠️ SNMP is UDP/161 — the monitoring tier's Cilium egress enumerates allowed
    # world ports, so 161/UDP had to be added there or these scrape silently.
    - job_name: 'snmp-ups'
      scrape_interval: 60s
      scrape_timeout: 30s
      metrics_path: /snmp
      params:
        module: [apc_ups]
        auth: [ups_v1]
      static_configs:
        - targets: ['10.10.200.10']
          labels: {device: 'ups1', model: 'smart-ups-1500-rm', feeds: 'pdu1', mains_voltage: '120'}
        - targets: ['10.10.200.11']
          labels: {device: 'ups2', model: 'smart-ups-srt-3000', feeds: 'pdu2', mains_voltage: '208'}
      relabel_configs:
        - {source_labels: [__address__], target_label: __param_target}
        - {source_labels: [__param_target], target_label: instance}
        - {target_label: __address__, replacement: 'snmp-exporter.monitoring.svc.cluster.local:9116'}

    - job_name: 'snmp-pdu'
      scrape_interval: 60s
      scrape_timeout: 30s
      metrics_path: /snmp
      params:
        module: [apc_pdu]
        auth: [pdu_v2]
      static_configs:
        - targets: ['10.10.200.15']
          labels: {device: 'pdu1', model: 'ap7900b', fed_by: 'ups1', mains_voltage: '120'}
        - targets: ['10.10.200.16']
          labels: {device: 'pdu2', model: 'ap7811b', fed_by: 'ups2', mains_voltage: '208'}
      relabel_configs:
        - {source_labels: [__address__], target_label: __param_target}
        - {source_labels: [__param_target], target_label: instance}
        - {target_label: __address__, replacement: 'snmp-exporter.monitoring.svc.cluster.local:9116'}

    # PVE host IPMI / BMC sensors (ASRock Rack B650D4U). Deployed by
    # infra/ansible/playbooks/ipmi-monitoring.yml — see that file for
    # the threshold + ipmievd + rsyslog forwarder context.
    - job_name: 'pve-ipmi'
      scrape_interval: 60s
      scrape_timeout: 30s   # freeipmi sensor reads can be slow
      static_configs:
        - targets:
            - '10.10.200.41:9290'  # pve in-band ipmi_exporter
          labels:
            instance: 'pve'
            location: 'local'
            hardware: 'asrock-rack-b650d4u'
