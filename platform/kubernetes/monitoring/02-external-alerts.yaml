---
# Alerting rules for external (non-K8s) hosts
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: external-hosts
  namespace: monitoring
  labels:
    release: monitoring
    app: kube-prometheus-stack
spec:
  groups:
    - name: external-hosts.rules
      rules:
        # Host availability. LOCAL hosts only at 2m — the AWS host (vpn-aws, the single
        # consolidated t4g.small edge box; dns-aws destroyed 2026-07, M110) sits behind an
        # intermittently lossy homelab→AWS WAN path (M124: ISP-side waves, NOT the instance),
        # so it gets its own relaxed rules below to avoid false pages.
        - alert: ExternalHostDown
          expr: up{job="external-nodes",location="local"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "External host {{ $labels.instance }} is down"
            description: "{{ $labels.instance }} ({{ $labels.location }}) has been unreachable for more than 2 minutes."

        # AWS host: only a SUSTAINED outage (>15m) pages — brief WAN path-loss waves are
        # expected and the services tolerate them (dns-sync is resilient; it's a failover replica).
        - alert: AWSReplicaHostDown
          expr: up{job="external-nodes",location="aws"} == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "AWS replica host {{ $labels.instance }} sustained-down (>15m)"
            description: "{{ $labels.instance }} (aws) unreachable >15m — beyond the expected brief WAN path-loss waves (M124: ISP-side, not the instance). Check the EC2 instance state and the homelab WAN path (mtr from both ends)."

        # The flap itself, tracked as a WARNING (dashboard-only, does not page) so it's a known
        # condition not silence. Root cause = ISP/WAN-side loss waves (M124), not the instance
        # (already resized to t4g.small; ENA/MTU/SG ruled out).
        - alert: AWSReplicaHostFlapping
          expr: changes(up{job="external-nodes",location="aws"}[1h]) > 12
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "AWS replica host {{ $labels.instance }} is flapping (WAN path-loss wave)"
            description: "{{ $labels.instance }} node_exporter scrape flapped >12x/h — an intermittent homelab-to-AWS WAN path-loss wave (M124: NOT the instance; ENA counters clean post-resize, MTU/SG/fail2ban ruled out; ISP/WAN-side, hours-scale). Service usually rides it out (WG re-handshakes); capture mtr from both ends while it fires, correlate UDM WAN events."

        # High CPU usage
        - alert: ExternalHostHighCPU
          expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle",job="external-nodes"}[5m])) * 100) > 80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage on {{ $labels.instance }}"
            description: "CPU usage on {{ $labels.instance }} is above 80% for more than 10 minutes. Current: {{ $value | printf \"%.1f\" }}%"

        # High memory usage. pve EXCLUDED from the generic 85% rule — the hypervisor
        # runs ~86% by design (~85 of 93 GiB committed to VMs + ZFS ARC; see the
        # M126 capacity-ceiling item) and would perma-fire; it gets its own rule
        # below at a pressure-signal threshold.
        - alert: ExternalHostHighMemory
          expr: (1 - (node_memory_MemAvailable_bytes{job="external-nodes",instance!="pve"} / node_memory_MemTotal_bytes{job="external-nodes",instance!="pve"})) * 100 > 85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage on {{ $labels.instance }}"
            description: "Memory usage on {{ $labels.instance }} is above 85%. Current: {{ $value | printf \"%.1f\" }}%"

        # pve hypervisor: alert only on REAL pressure (its steady state is ~86%).
        # 94% ≈ the VM commitment + ARC has been eaten into — investigate before OOM.
        - alert: PveHostMemoryPressure
          expr: (1 - (node_memory_MemAvailable_bytes{instance="pve"} / node_memory_MemTotal_bytes{instance="pve"})) * 100 > 94
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "pve hypervisor memory pressure ({{ $value | printf \"%.1f\" }}%)"
            description: "pve normally sits ~86% (committed VMs + ZFS ARC). >94% for 10m means the headroom is gone — check for a ballooning VM or ARC growth before the host OOM-kills a guest. Capacity context: tracker M126(c)."

        # Elevated swap (early warning before the CW reboot alarm at 80%)
        # Filtered to hosts that actually have swap configured so the
        # alert doesn't fire on hosts without swap (which would produce
        # NaN -> always >50 -> permanent firing).
        - alert: ExternalHostElevatedSwap
          expr: |
            (node_memory_SwapTotal_bytes{job="external-nodes"} > 0)
            and
            ((1 - (node_memory_SwapFree_bytes{job="external-nodes"} / node_memory_SwapTotal_bytes{job="external-nodes"})) * 100 > 50)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Elevated swap usage on {{ $labels.instance }}"
            description: "Swap on {{ $labels.instance }} is >50% for 10m. The CloudWatch reboot alarm fires at 80% for 10m — investigate the memory pressure before it triggers."

        # Low disk space
        - alert: ExternalHostLowDisk
          expr: (1 - (node_filesystem_avail_bytes{job="external-nodes",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{job="external-nodes",fstype!~"tmpfs|overlay"})) * 100 > 80
          for: 5m
          labels:
            severity: warning
            # AI advisor Phase 3 opt-in: prune_host_logdir auto-runs when
            # the culprit is Technitium query-log accumulation (the 2026-05-25
            # dns-aws pattern). Other disk causes diagnose to noop + recommend
            # operator investigation.
            ai_remediation: "auto"
          annotations:
            runbook_url: "https://github.com/sparked-diamond/infra/blob/main/docs/runbooks/alerts/ExternalHostLowDisk.md"
            summary: "Low disk space on {{ $labels.instance }}"
            description: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} is {{ $value | printf \"%.1f\" }}% full."

        - alert: ExternalHostCriticalDisk
          expr: (1 - (node_filesystem_avail_bytes{job="external-nodes",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{job="external-nodes",fstype!~"tmpfs|overlay"})) * 100 > 95
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Critical disk space on {{ $labels.instance }}"
            description: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} is {{ $value | printf \"%.1f\" }}% full. Immediate action required!"

        # High load average
        - alert: ExternalHostHighLoad
          expr: node_load15{job="external-nodes"} / count without(cpu, mode) (node_cpu_seconds_total{mode="idle",job="external-nodes"}) > 2
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "High load average on {{ $labels.instance }}"
            description: "15-minute load average on {{ $labels.instance }} is over 2x the number of CPUs."

        # Systemd service failures
        - alert: ExternalHostSystemdFailed
          expr: node_systemd_unit_state{job="external-nodes",state="failed"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Systemd unit failed on {{ $labels.instance }}"
            description: "Systemd unit {{ $labels.name }} on {{ $labels.instance }} is in failed state."

        # Host rebooted
        - alert: ExternalHostRebooted
          expr: time() - node_boot_time_seconds{job="external-nodes"} < 600
          for: 1m
          labels:
            severity: info
          annotations:
            summary: "External host {{ $labels.instance }} rebooted"
            description: "{{ $labels.instance }} was rebooted less than 10 minutes ago."

    # DNS-specific alerts
    - name: dns-service.rules
      rules:
        # Renamed from TechnitiumDNSDown 2026-06-30: it shared a name with the IN-CLUSTER
        # alert (comprehensive-alerts.yaml), and the auto-remediation controller matches by
        # alertname ONLY (controller.py — no auto_remediate gate), so an EXTERNAL host (dns-aws/
        # dns-fallback) going down wrongly force-restarted the in-cluster technitium StatefulSet
        # pods (8x overnight 06-29/30). Distinct name => the restart_pods rule no longer fires
        # for an external probe. This still alerts/emails normally.
        # location="local" => the AWS dns replica (now on the vpn-aws edge box; dns-aws destroyed
        # 2026-07, M110) is handled by AWSReplicaHostDown/Flapping above (its brief WAN-loss waves
        # shouldn't page); this stays tight (1m) for the LOCAL dns-fallback.
        - alert: TechnitiumExternalHostDown
          expr: up{job="external-nodes",instance=~"dns-.*",location="local"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            runbook_url: "https://github.com/sparked-diamond/infra/blob/main/docs/runbooks/alerts/TechnitiumExternalHostDown.md"
            summary: "External Technitium DNS host {{ $labels.instance }} is down"
            description: "External DNS server {{ $labels.instance }} has been unreachable for more than 1 minute. (In-cluster DNS is unaffected; this does NOT auto-restart the in-cluster pods.)"

    # step-ca — the SSH user/host CA the ENTIRE fleet's cert-only SSH depends on (M76).
    # H42 (2026-07-01): was a triple blind spot (no scrape, no probe, no alert). Two layers:
    # the CA SERVICE (blackbox probe on :8443/health — a wedged step-ca process breaks cert
    # renewal even while the VM is up) and the HOST (up{instance="step-ca"}, which the generic
    # ExternalHostDown also covers — the dedicated alert names the blast radius explicitly).
    - name: step-ca.rules
      rules:
        - alert: StepCADown
          expr: probe_success{appliance="step-ca"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "step-ca (SSH certificate authority) is not answering on :8443"
            description: "The step-ca /health probe has failed for 10m. Fleet SSH is CERT-ONLY (M76): cert renewal is broken — the devbox renew-loop (13h certs) and CI per-run certs (≤1h) will start failing on expiry. Break-glass: PVE console + IPMI 10.10.200.21. Check VM 1006: `qm status 1006` on pve, then `systemctl status step-ca` in the guest."

    # Devbox SSH-cert renew loop (M133). StepCADown above catches the CA being down; this catches
    # the CONSUMER side — the devbox renew loop stalling while the CA is healthy (user timer disabled,
    # linger lost, SOPS/JWK broken). step-ssh-renew.sh writes the freshly-minted cert's NotAfter to a
    # node_exporter textfile (step_ssh_cert.prom); the served value stops advancing if the loop stalls.
    # Fleet SSH is cert-only, so an expired cert = the autonomous agent loses SSH to all 15 hosts.
    - name: devbox-ssh-cert.rules
      rules:
        # Healthy floor is ~7h remaining (13h cert renewed every 6h); <4h => at least one renew cycle
        # fully missed and heading to expiry. Critical so it routes to email with ~3.5h of runway.
        - alert: DevboxSSHCertExpiringSoon
          expr: step_ssh_cert_not_after_seconds{instance="devbox"} - time() < 14400
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "Devbox step-ca SSH cert expires in <4h — renew loop has stalled"
            description: >-
              The devbox's short-lived SSH user cert has <4h left and isn't being renewed (healthy
              floor is ~7h). Fleet SSH is CERT-ONLY (M76) — on expiry the autonomous agent loses SSH
              to all 15 hosts. Check on the devbox (10.10.201.45): `systemctl --user status
              step-ssh-renew.service` and `list-timers step-ssh-renew.timer`; confirm step-ca is up
              (StepCADown) and SOPS/JWK still decrypt. Manual mint: run
              infra/devbox/step-ssh-renew.sh.
        # Backstop: the textfile persists on disk across reboots, so ExpiringSoon catches a stalled
        # timer even with stale data. absent() only trips if the file was never written / deleted or
        # node_exporter textfile is broken (devbox-down is already ExternalHostDown-critical). Warning.
        - alert: DevboxSSHCertNoMetric
          expr: absent(step_ssh_cert_not_after_seconds{instance="devbox"})
          for: 8h
          labels:
            severity: warning
          annotations:
            summary: "No devbox SSH-cert expiry metric (>8h)"
            description: >-
              step_ssh_cert_not_after_seconds is absent — the metric isn't being produced (renew loop
              never ran, the .prom file was deleted, or node_exporter --collector.textfile is broken
              on the devbox). Verify step-ssh-renew has run and
              /var/lib/node_exporter/textfile_collector/step_ssh_cert.prom exists.

    # VPN-specific alerts
    - name: vpn-service.rules
      rules:
        # location="local" => the AWS vpn gateway (vpn-aws) is covered by AWSReplicaHostDown above;
        # this stays tight (2m) for the LOCAL vpn-fallback endpoint.
        - alert: VPNGatewayDown
          expr: up{job="external-nodes",instance=~"vpn-.*",location="local"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "VPN gateway {{ $labels.instance }} is down"
            description: "VPN gateway {{ $labels.instance }} has been unreachable for more than 2 minutes. Site-to-site connectivity may be affected."

        # M153 (2026-07-25, probe corrected 2026-07-27): the WG VIP layers used to
        # fail SILENTLY. NB the blackbox exporter's ICMP module does NOT work from
        # the pod overlay to VLAN IPs (probe_success=0 even for the UDM) — the
        # original ICMP wg-vip probe was a false-positive generator and was removed.
        # (1) Primary WG holder down: the K8s wireguard Deployment has no available
        #     replica → the prio-150 VIP owner is gone; failover to vpn-fallback
        #     should catch it (WgVipOnFallback below), but if BOTH are down remote
        #     WG access is dead (vpn-fallback-down is separately VPNGatewayDown).
        - alert: WgPrimaryPodDown
          expr: kube_deployment_status_replicas_available{deployment="wireguard",namespace="wireguard"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "WireGuard primary pod (K8s, prio-150 VIP owner) is down"
            description: >-
              The in-cluster wireguard Deployment has 0 available replicas for >5m.
              The WG VIP 10.10.201.20 has failed (or should have failed) over to
              vpn-fallback — confirm via WgVipOnFallback; if that is ALSO silent,
              remote WG access is fully down. Check `kubectl -n wireguard get pods`
              + keepalived on both holders (VRRP split-brain = M77 proto-112 class).
        # (2) Silent failover: vpn-fallback holds the VIP. Legitimate DURING an
        #     incident, but the K8s pod (prio 150, preempt_delay 300) should reclaim
        #     within ~5m of recovery — >15m on the fallback means the pod is dead or
        #     VRRP is wedged, and nothing else would tell us. Metric = node_exporter
        #     textfile collector on vpn-fallback (wireguard.yml wg-vip-metric.timer).
        - alert: WgVipOnFallback
          expr: wg_vip_held{instance="vpn-fallback"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "WG VIP has been on vpn-fallback for >15m"
            description: >-
              vpn-fallback holds 10.10.201.20 — the K8s WG pod either died and never
              came back, or recovered but failed to reclaim (VRRP wedge). Check
              `kubectl -n wireguard get pods` and keepalived logs on both holders.

    # Weekly doc/IaC drift audit (devbox doc-drift-audit.timer, Mon 14:37). The audit also emails
    # every run (incl. a per-run "❗ audit error" on failure), so these add the off-box signal the
    # email can't give — a MISSED run (devbox down / timer disabled). The success-timestamp metric
    # comes via node_exporter --collector.textfile (base.yml) from doc-drift-audit.sh.
    - name: doc-drift-audit.rules
      rules:
        # No successful run in >8d (one weekly window + a day of slack) => failed, errored, or
        # missed. Critical so it routes to email (only critical does — 03-alertmanager-config).
        - alert: DocDriftAuditStale
          expr: time() - doc_drift_audit_last_success_timestamp_seconds{instance="devbox"} > 691200
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Weekly doc/IaC drift audit hasn't succeeded in >8 days"
            description: >-
              No successful doc/IaC drift audit on the devbox in >8d (failed, errored, or didn't
              run). Check `systemctl --user status doc-drift-audit.service` and
              `list-timers doc-drift-audit.timer`, and ~/.local/state/doc-drift-audit/*.log on the
              devbox (10.10.201.45).
        # Metric absent entirely => textfile never produced: devbox down long-term, linger/timer
        # off, or the textfile collector/dir not set up. 9d so a single weekly miss alone doesn't trip it.
        - alert: DocDriftAuditNoMetrics
          expr: absent(doc_drift_audit_last_success_timestamp_seconds{instance="devbox"})
          for: 9d
          labels:
            severity: critical
          annotations:
            summary: "No doc/IaC drift audit metric on the devbox (>9d)"
            description: >-
              doc_drift_audit_last_success_timestamp_seconds is absent — the metric isn't being
              produced (devbox down, linger/timer disabled, or node_exporter --collector.textfile /
              /var/lib/node_exporter/textfile_collector not set up). Verify base.yml was applied to the devbox.
        # Most recent run exited non-zero. Warning (not critical): the audit already emails a
        # per-run error directly; this is dashboard visibility + a backstop if that email fails.
        - alert: DocDriftAuditFailed
          expr: doc_drift_audit_last_rc{instance="devbox"} != 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Last doc/IaC drift audit run exited non-zero (rc={{ $value }})"
            description: "doc_drift_audit_last_rc={{ $value }} on the devbox — see ~/.local/state/doc-drift-audit/*.log."

    # M130: pve config + Ceph MON-store backup (daily systemd timer on pve →
    # NAS; pve-config-backup.yml). The metric comes via node_exporter
    # --collector.textfile from pve-config-backup.sh (instance="pve").
    - name: pve-config-backup.rules
      rules:
        # No successful backup in >36h (one daily window + slack) => the timer
        # failed, the NAS unmounted, or ceph/tar broke. Critical → email: this is
        # the only copy of the MON store + /etc/pve off the pve boot disk.
        - alert: PveConfigBackupStale
          expr: time() - pve_config_backup_last_success_timestamp_seconds{instance="pve"} > 129600
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "pve config/Ceph-MON backup hasn't succeeded in >36h"
            description: >-
              No successful pve config + Ceph MON-store backup in >36h. pve boot-disk loss would then
              mean rebuilding /etc/pve + the MON store from memory. Check on pve:
              `systemctl status pve-config-backup.service`, `journalctl -u pve-config-backup`, and that
              /mnt/pve/sequoia-backups (NAS) is mounted. Manual run: /usr/local/sbin/pve-config-backup.sh.
        # Metric absent entirely => the backup never ran / textfile collector broken.
        # (pve-down is already ExternalHostDown-critical.) 3d so a brief blip doesn't trip it.
        - alert: PveConfigBackupNoMetric
          expr: absent(pve_config_backup_last_success_timestamp_seconds{instance="pve"})
          for: 3d
          labels:
            severity: warning
          annotations:
            summary: "No pve config-backup metric (>3d)"
            description: >-
              pve_config_backup_last_success_timestamp_seconds is absent — pve-config-backup.yml may
              not be applied, or the textfile collector isn't producing it. Verify the timer + the
              /var/lib/node_exporter/textfile_collector/pve_config_backup.prom on pve.
