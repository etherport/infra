---
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: email-notifications
  namespace: monitoring
  labels:
    alertmanagerConfig: main
spec:
  route:
    groupBy: ['alertname', 'namespace']
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    receiver: email-alerts
    routes:
      # Don't send Watchdog alerts (it's a canary)
      - match:
          alertname: Watchdog
        receiver: 'null'
      # Send critical alerts immediately
      - match:
          severity: critical
        receiver: email-alerts
        repeatInterval: 1h
      # Send warning alerts
      - match:
          severity: warning
        receiver: email-alerts
        repeatInterval: 4h
  receivers:
    - name: 'null'
    - name: email-alerts
      emailConfigs:
        - to: graham.m.smith@me.com
          from: alerts@etherport.net
          smarthost: email-smtp.us-west-2.amazonaws.com:587
          authUsername: AKIA4C5DM33XKE5WUPG4
          authPassword:
            key: smtp_auth_password
            name: alertmanager-smtp-config
          requireTLS: true
          sendResolved: true
  inhibitRules:
    # Inhibit lower severity if critical is firing
    - sourceMatch:
        - name: severity
          value: critical
      targetMatch:
        - name: severity
          value: warning
      equal: ['alertname', 'namespace']
