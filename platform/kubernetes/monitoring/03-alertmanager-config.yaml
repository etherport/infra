---
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: email-notifications
  namespace: monitoring
  labels:
    alertmanagerConfig: main
spec:
  route:
    groupBy: ['alertname', 'namespace']
    groupWait: 30s
    groupInterval: 5m
    # Default repeatInterval — applies to anything that hits a matching
    # route's receiver (overridden per-route below).
    repeatInterval: 24h
    # Default receiver is `null` so any alert NOT matching a child
    # route is dropped. Prior config used email-alerts here, which
    # cascaded info/none-severity alerts (CPUThrottlingHigh,
    # InfoInhibitor, KubeJobFailed on stuck Job records, etc.) into
    # the inbox. Caught 2026-05-22 after ~4k emails accumulated in
    # graham.m.smith@me.com junk over the prior week.
    receiver: 'null'
    routes:
      # Don't send Watchdog alerts (it's a canary)
      - matchers:
          - name: alertname
            value: Watchdog
        receiver: 'null'
      # Auto-remediation webhook receives ALL alerts (no matchers) so
      # the controller can decide which alertnames have a rule defined
      # in platform/kubernetes/auto-remediation/configmap.yaml. The
      # controller's own 15-min cooldown prevents restart loops. The
      # `continue: true` flag lets matching alerts still flow into the
      # severity-based email routes below — webhook + email are not
      # mutually exclusive. Wired 2026-05-22 (M8 follow-up: prior to
      # this commit, all 22 remediation rules were dormant).
      - receiver: auto-remediation
        continue: true
      # M132: push severity=critical to the self-hosted ntfy (2nd channel → phone
      # via Tailscale) through the am2ntfy bridge. continue:true so criticals ALSO
      # still email via the severity=critical → email-alerts route below (ntfy is
      # additive, not a replacement). Placed before email-alerts (which is terminal).
      - matchers:
          - name: severity
            value: critical
        receiver: ntfy-critical
        continue: true
      # InfoInhibitor from kube-state-metrics — silent by design
      - matchers:
          - name: alertname
            value: InfoInhibitor
        receiver: 'null'
      # ONLY severity=critical reaches email. Warning + info + none
      # fall through to the parent's `null` receiver. Re-evaluate
      # rule severities in comprehensive-alerts.yaml if you want a
      # specific warning to email — bump it to critical there, don't
      # widen the route here.
      - matchers:
          - name: severity
            value: critical
        receiver: email-alerts
        repeatInterval: 6h
  receivers:
    - name: 'null'
    - name: auto-remediation
      webhookConfigs:
        - url: http://remediation-webhook.auto-remediation.svc.cluster.local:8080/webhook
          sendResolved: false
    # M132: severity=critical → am2ntfy bridge → ntfy → phone (Tailscale).
    - name: ntfy-critical
      webhookConfigs:
        - url: http://am2ntfy.ntfy.svc.cluster.local:8080/
          sendResolved: true
    - name: email-alerts
      emailConfigs:
        - to: graham.m.smith@me.com
          from: "Etherport Alerts <alertmanager@wind.etherport.net>"
          smarthost: email-smtp.us-west-2.amazonaws.com:587
          authUsername: AKIA4C5DM33XKE5WUPG4
          authPassword:
            key: smtp_auth_password
            name: alertmanager-smtp-config
          requireTLS: true
          sendResolved: true
          html: |
            <!DOCTYPE html><html><head><meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1.0">
            <meta name="color-scheme" content="light dark">
            <meta name="supported-color-schemes" content="light dark">
            <title>Etherport alert</title>
            <style>:root{color-scheme:light dark;
            --page:#e7e8ec;--surface:#f7f7f2;--border:#dedcd0;--titlebar:#eeece2;
            --text:#26241d;--prose:#6b6a5f;--dim:#8a897e;--dim2:#c9c5b6;--leader:#cfcdbc;
            --ok:#2f8f52;--cyan:#2a7d8c;--warn:#9a6100;--err:#a5342a;
            --dot-r:#c9483d;--dot-a:#c08a1e;--dot-g:#2f8f52}
            @media (prefers-color-scheme:dark){:root{
            --page:#05070b;--surface:#0a0e14;--border:#1b232e;--titlebar:#0d1219;
            --text:#e6edf3;--prose:#8a93a0;--dim:#6b7888;--dim2:#3a4553;--leader:#2a3542;
            --ok:#46c46a;--cyan:#5ac2d4;--warn:#e0a53a;--err:#f4685c;
            --dot-r:#f4685c;--dot-a:#e0a53a;--dot-g:#46c46a}}
            body{margin:0;padding:0;background:var(--page);color:var(--text);
            font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;
            -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
            .wrap{max-width:600px;margin:0 auto;padding:28px 16px 46px}
            .term{background:var(--surface);border:1px solid var(--border);border-radius:11px;overflow:hidden}
            .titlebar{display:flex;align-items:center;padding:11px 16px;background:var(--titlebar);
            border-bottom:1px solid var(--border);font-family:ui-monospace,SFMono-Regular,Menlo,"JetBrains Mono",monospace}
            .dots{display:flex;gap:7px}
            .dots i{width:11px;height:11px;border-radius:50%;display:inline-block}
            .d-r{background:var(--dot-r)}.d-a{background:var(--dot-a)}.d-g{background:var(--dot-g)}
            .brand{margin:0 auto;display:inline-flex;align-items:center;gap:8px;font-size:12.5px}
            .ring{width:15px;height:15px;border:2px solid var(--ok);border-radius:50%;
            display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;vertical-align:middle}
            .ring i{width:4px;height:4px;border-radius:50%;background:var(--ok)}
            .brand b{font-weight:600;color:var(--text)}
            .brand em{font-style:normal;color:var(--dim)}
            .tb-spacer{width:47px}
            .screen{padding:24px 26px 28px;font-family:ui-monospace,SFMono-Regular,Menlo,"JetBrains Mono",monospace;font-size:13px;line-height:1.7}
            .prompt{margin:0 0 20px;color:var(--text);word-break:break-all}
            .p-user{color:var(--ok)}.p-punc{color:var(--dim)}.p-path{color:var(--cyan)}
            .cursor{display:inline-block;width:8px;height:15px;background:var(--text);margin-left:4px;vertical-align:-2px;animation:blink 1.1s step-end infinite}
            @keyframes blink{50%{opacity:0}}
            h1{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;
            font-size:24px;font-weight:700;letter-spacing:-.02em;color:var(--text);margin:0 0 5px}
            .subhead{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;
            color:var(--prose);font-size:14px;line-height:1.5;margin:0 0 16px}
            .status-line{font-size:14px;margin:0 0 24px}
            .status-line i{width:9px;height:9px;border-radius:50%;background:currentColor;display:inline-block;margin-right:8px;vertical-align:middle}
            .t-ok{color:var(--ok)}.t-warn{color:var(--warn)}.t-err{color:var(--err)}.t-muted{color:var(--dim)}
            .card{margin:0}
            h2.sec{font-family:ui-monospace,SFMono-Regular,Menlo,"JetBrains Mono",monospace;
            font-size:11px;font-weight:400;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin:22px 0 10px}
            h2.sec:before{content:"── "}
            p{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;
            color:var(--text);font-size:14.5px;line-height:1.62;margin:0 0 12px}p:last-child{margin-bottom:0}
            ul{margin:0 0 16px;padding:0;list-style:none}
            li{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;
            color:var(--text);font-size:14px;line-height:1.55;margin:0 0 10px;padding-left:20px;position:relative}li:last-child{margin-bottom:0}
            li:before{content:"▸";position:absolute;left:2px;top:0;color:var(--cyan);
            font-family:ui-monospace,SFMono-Regular,Menlo,"JetBrains Mono",monospace}
            code{background:var(--titlebar);border:1px solid var(--border);padding:1px 5px;border-radius:4px;font-size:12.5px;
            font-family:ui-monospace,SFMono-Regular,Menlo,"JetBrains Mono",monospace;color:var(--warn)}
            a{color:var(--cyan);text-decoration:underline}
            em{font-style:italic;color:var(--prose)}
            strong{font-weight:700;color:var(--text)}
            .btn-wrap{margin:10px 0 2px}
            .btn{display:inline-block;padding:10px 16px;color:var(--ok);border:1px solid var(--ok);background:rgba(70,196,106,.08);
            font-weight:700;font-size:13px;border-radius:6px;text-decoration:none;line-height:1.2;
            font-family:ui-monospace,SFMono-Regular,Menlo,"JetBrains Mono",monospace}
            .footer{margin-top:24px;font-size:11px;color:var(--dim2);
            font-family:ui-monospace,SFMono-Regular,Menlo,"JetBrains Mono",monospace}
            .footer code{font-size:11px;background:none;border:none;padding:0;color:var(--dim)}</style></head><body><div class="wrap"><div class="term">
            <div class="titlebar"><span class="dots"><i class="d-r"></i><i class="d-a"></i><i class="d-g"></i></span><span class="brand"><span class="ring"><i></i></span><b>etherport</b><em>&middot; alerts</em></span><span class="tb-spacer"></span></div>
            <div class="screen">
            <div class="prompt"><span class="p-user">alertmanager@etherport</span><span class="p-punc">:</span><span class="p-path">~</span><span class="p-punc">$</span> alerts --status {{ .Status }}<span class="cursor"></span></div>
            <h1>{{ .Alerts | len }} alert{{ if ne (len .Alerts) 1 }}s{{ end }} {{ .Status }}</h1>
            {{ if .CommonLabels.severity }}<p class="subhead">Severity: {{ .CommonLabels.severity }}{{ if .CommonLabels.namespace }} &middot; ns {{ .CommonLabels.namespace }}{{ end }}</p>{{ end }}
            <div class="status-line {{ if eq .Status "firing" }}t-err{{ else }}t-ok{{ end }}"><i></i>{{ .Status | toUpper }}</div>
            {{ range .Alerts }}<div class="card"><div class="sec-head" style="display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin:0 0 6px">
            <b style="font-family:ui-monospace,Menlo,monospace">{{ .Labels.alertname }}</b>
            <span class="status-line {{ if eq .Labels.severity "critical" }}t-err{{ else if eq .Labels.severity "warning" }}t-warn{{ else }}t-muted{{ end }}" style="margin:0"><i></i>{{ if .Labels.severity }}{{ .Labels.severity | toUpper }}{{ else }}ALERT{{ end }}</span></div>
            {{ if .Annotations.summary }}<p style="margin:0 0 6px">{{ .Annotations.summary }}</p>{{ end }}
            {{ if .Annotations.description }}<p style="margin:0;color:var(--dim);font-size:13px">{{ .Annotations.description }}</p>{{ end }}
            <p style="margin:8px 0 0;color:var(--dim);font-size:12px">since {{ .StartsAt.Format "Jan 2 15:04 MST" }}{{ if .Labels.instance }} &middot; {{ .Labels.instance }}{{ end }}</p>
            </div>{{ end }}
            <div class="footer">&mdash; Alertmanager &middot; wind cluster &middot; also see the AI-advisor diagnosis email &amp; ntfy &mdash;</div>
            </div></div></div></body></html>
  inhibitRules:
    # Inhibit lower severity if critical is firing
    - sourceMatch:
        - name: severity
          value: critical
      targetMatch:
        - name: severity
          value: warning
      equal: ['alertname', 'namespace']
    # If a Deployment's replicas don't match (KubeDeploymentReplicasMismatch),
    # we expect cascading KubeContainerWaiting / KubePodNotReady alerts on
    # pods of that deployment. Suppress the noise — the root cause already
    # has its own alert. Added 2026-05-22.
    - sourceMatch:
        - name: alertname
          value: KubeDeploymentReplicasMismatch
      targetMatch:
        - name: alertname
          value: KubeContainerWaiting
      equal: ['namespace']
    - sourceMatch:
        - name: alertname
          value: KubeDeploymentReplicasMismatch
      targetMatch:
        - name: alertname
          value: KubePodNotReady
      equal: ['namespace']
