---
# Hardware-sensor alert rules for the PVE host via ipmi_exporter.
#
# Three classes of alert:
#   1. Sensor reading exceeds tuned threshold (slow, polled).
#   2. ipmi_exporter itself is down (we lose visibility entirely).
#   3. SEL events arriving via syslog (Loki LogQL alert — defined in
#      this file too via the Alloy/Loki side; the cluster's
#      AlertmanagerConfig already covers routing).
#
# Sensor thresholds in the playbook (ipmi-monitoring.yml) are the
# BMC's own assertion thresholds — when crossed, the BMC fires a SEL
# event that ipmievd → syslog → Loki picks up. The Prometheus alerts
# below are independent: they query ipmi_exporter scraped metrics so
# we get alerting even if the BMC's own SEL/syslog path is broken.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pve-ipmi-hardware
  namespace: monitoring
  labels:
    release: monitoring
    app: kube-prometheus-stack
spec:
  groups:
    - name: pve-ipmi.rules
      rules:
        # The exporter itself
        - alert: IpmiExporterDown
          expr: up{job="pve-ipmi"} == 0
          for: 5m
          labels:
            severity: critical
            component: hardware
          annotations:
            summary: "ipmi_exporter on {{ $labels.instance }} is unreachable"
            description: "Lost hardware-sensor visibility on {{ $labels.instance }}. Cannot detect CPU temp or fan failure from Prometheus side. Falls back to BMC syslog only."

        # CPU temperature — early warning. Threshold matches the BMC
        # sensor unc=82 from ipmi-monitoring.yml. Firing here AND in
        # the BMC means both paths agree; only one means the other
        # path is broken.
        - alert: PveCpuTempHigh
          expr: ipmi_temperature_celsius{job="pve-ipmi",name="TEMP_CPU"} > 80
          for: 5m
          labels:
            severity: warning
            component: hardware
          annotations:
            runbook_url: "https://github.com/etherport/infra/blob/main/docs/runbooks/alerts/PveCpuTempHigh.md"
            summary: "PVE CPU sustained >80°C ({{ $value }}°C)"
            description: "TEMP_CPU on {{ $labels.instance }} has been above 80°C for 5 minutes. Check fan curve in BMC UI (Settings → Fan Control). The 2026-05-02 incident pattern was brief spikes to 98°C with fans not ramping in time."

        # CPU temperature — emergency
        - alert: PveCpuTempCritical
          expr: ipmi_temperature_celsius{job="pve-ipmi",name="TEMP_CPU"} > 88
          for: 1m
          labels:
            severity: critical
            component: hardware
          annotations:
            summary: "PVE CPU >88°C — approaching TjMax ({{ $value }}°C)"
            description: "TEMP_CPU on {{ $labels.instance }} is at {{ $value }}°C. Ryzen 7000 TjMax is 95°C; the CPU will begin thermal throttling shortly. Investigate cooling immediately."

        # Fan failure — fan reads near zero
        - alert: PveFanFailed
          expr: ipmi_fan_speed_rpm{job="pve-ipmi",name=~"FAN[1-4]"} < 300
          for: 2m
          labels:
            severity: critical
            component: hardware
          annotations:
            summary: "PVE {{ $labels.name }} reads {{ $value }} RPM"
            description: "Chassis fan {{ $labels.name }} on {{ $labels.instance }} dropped to {{ $value }} RPM. Likely failed or unplugged. Other fans will need to compensate."

        # Fans pegged — cooling capacity exhausted.
        # ⚠️ THRESHOLD WAS 12000 RPM AND COULD NEVER FIRE. These fans top out at
        # ~6000 RPM (30d max/min across FAN1-4: 5800-6000), so the old threshold was
        # roughly TWICE the physical maximum. That is why 30+ days of fully-pegged
        # fans went unnoticed. Set from measured hardware behaviour, not a guess.
        - alert: PveFansPegged
          expr: ipmi_fan_speed_rpm{job="pve-ipmi",name=~"FAN[1-4]"} > 5000
          for: 15m
          labels:
            severity: warning
            component: hardware
          annotations:
            summary: "PVE {{ $labels.name }} running at max ({{ $value }} RPM) for 15m"
            description: "Sustained max-RPM operation indicates the cooling system is at capacity. Either ambient temperature is high or thermal load increased. Investigate before a thermal event."

        # The diagnostic companion to PveFansPegged: fans working hard while the
        # box is COLD means the BMC "Maximum Duty" clamp is missing or was reset —
        # not a thermal problem. That clamp is a web-UI-only setting with no IaC
        # representation, so this alert is the only thing that can detect its loss.
        # Observed signature 2026-08-19: 5800-6000 RPM with a 26C inlet for 30+ days.
        - alert: PveFansHighWhileCool
          expr: |
            min_over_time(ipmi_fan_speed_rpm{job="pve-ipmi",name="FAN1"}[6h]) > 4000
              and on(instance)
            avg_over_time(ipmi_temperature_celsius{job="pve-ipmi",name="TEMP_SYS_INLET"}[6h]) < 32
          for: 1h
          labels:
            severity: warning
            component: hardware
          annotations:
            summary: "PVE fans pinned high ({{ $value }} RPM) while the chassis is cool"
            description: "Fans have not dropped below 4000 RPM in 6h despite an inlet temperature under 32C. This is the signature of the BMC Fan Mode 'Maximum Duty' clamp being unset or reverted — it is a web-UI-only setting (not reachable via IPMI netfn 0x3a or Redfish on firmware 6.04). Re-apply it: BMC -> Settings -> Fan Control -> Fan Mode -> Maximum Duty 40-50%. Costs roughly 20-35W and makes the server audible from other floors. See docs/planning/power-reduction-plan-2026-08.md."

        # PSU degraded
        - alert: PvePsuPowerLoss
          expr: ipmi_chassis_power_state{job="pve-ipmi"} != 1
          for: 1m
          labels:
            severity: critical
            component: hardware
          annotations:
            summary: "PVE chassis power state abnormal"
            description: "ipmi_chassis_power_state on {{ $labels.instance }} reports {{ $value }} (expected 1=on). Possible PSU event."

        # Memory temperature (DIMMs)
        - alert: PveDimmTempHigh
          expr: ipmi_temperature_celsius{job="pve-ipmi",name=~"TEMP_DDR5.*"} > 75
          for: 10m
          labels:
            severity: warning
            component: hardware
          annotations:
            summary: "PVE {{ $labels.name }} >75°C"
            description: "DIMM thermal sensor {{ $labels.name }} on {{ $labels.instance }} at {{ $value }}°C. DDR5 throttling typically begins around 85°C; investigate airflow."

    # NOTE: a previous draft of this file mixed a Loki LogQL rule into
    # this PrometheusRule group. The Prometheus operator validates with
    # PromQL only — that LogQL rule caused the entire flux-system
    # kustomization to fail (drift detection blocked) until removed
    # 2026-05-23. LogQL alerts belong in a LokiRule resource via the
    # loki-ruler component, which we don't yet have enabled. Tracked
    # as a follow-up — for now the Prometheus-side metric alerts above
    # cover the same failure modes via ipmi_exporter scrape.
