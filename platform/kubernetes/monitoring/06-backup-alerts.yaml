---
# Alert rules for backup/transfer/sync workloads that publish
# metrics but had no PrometheusRule until now (gap surfaced by
# the 2026-05-24 audit). Each carries a `namespace` label so the
# AI advisor's `_build_context()` can pull the right Loki window
# + pod logs.
#
# Sister to:
# - comprehensive-alerts.yaml (VeleroDown — service liveness)
# - rclone-gdrive/03-prometheus-rules.yaml (rclone-specific)
# - unifi-cert-sync/05-prometheusrule.yaml (cert-specific)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backup-jobs
  namespace: monitoring
  labels:
    release: monitoring
    app: kube-prometheus-stack
spec:
  groups:
    # ---------- s3-sync (custom homelab metrics) ----------
    - name: s3-sync.rules
      rules:
        - alert: S3SyncFailed
          # `homelab_backup_last_run_success` is 1 = OK / 0 = fail. Pushed by each
          # per-share sync job itself (sync-and-verify.sh → pushgateway) at end of
          # run. NB a delete-guard approval hold reports success=1 with
          # batch_status="approval_pending"/"rejected_snoozed" — normal operation,
          # deliberately does NOT fire this alert (2026-06-26 change).
          expr: homelab_backup_last_run_success == 0
          for: 5m
          labels:
            severity: warning
            component: backup
            namespace: backups
          annotations:
            runbook_url: "https://github.com/etherport/infra/blob/main/docs/runbooks/alerts/S3SyncFailed.md"
            summary: "s3-sync failed for {{ $labels.share }}"
            description: |
              The last sync for share `{{ $labels.share }}` to S3
              failed. Investigate: kubectl -n backups logs job/<latest>
              or query Loki: {namespace="backups", container="sync"}

        - alert: S3SyncStale
          # No successful run in >36h (daily runs at 01:00 PT; 36h
          # covers one missed window + buffer).
          expr: (time() - homelab_backup_last_run_timestamp_seconds) > 129600
          for: 1h
          labels:
            severity: warning
            component: backup
            namespace: backups
          annotations:
            summary: "s3-sync for {{ $labels.share }} hasn't run in >36h"
            description: |
              Last successful run of s3-sync for `{{ $labels.share }}`
              was {{ $value | humanizeDuration }} ago. CronJob may be
              suspended or in a crashloop.

    # ---------- UniFi backup CronJob ----------
    - name: unifi-backup.rules
      rules:
        - alert: UnifiBackupFailed
          # `unifi_backup_status` is non-zero on failure (per the
          # backup.sh script pushed by 03-cronjob.yaml).
          expr: unifi_backup_status > 0
          for: 5m
          labels:
            severity: warning
            component: backup
            namespace: backups
          annotations:
            runbook_url: "https://github.com/etherport/infra/blob/main/docs/runbooks/alerts/UnifiBackupFailed.md"
            summary: "UniFi backup failed for {{ $labels.device }}"
            description: |
              The UDM/Protect backup for device `{{ $labels.device }}`
              failed. Status code: {{ $value }}. Check pod logs:
              kubectl -n backups logs -l app=unifi-backup --tail=100

        - alert: UnifiBackupStale
          expr: (time() - unifi_backup_last_run_timestamp) > 129600
          for: 1h
          labels:
            severity: warning
            component: backup
            namespace: backups
          annotations:
            summary: "UniFi backup hasn't completed for {{ $labels.device }} in >36h"
            description: |
              Last successful UniFi backup for device
              `{{ $labels.device }}` was {{ $value | humanizeDuration }}
              ago. Daily 04:00 PT schedule may be skipping.

    # ---------- CNPG / Barman postgres backups ----------
    - name: cnpg-backup.rules
      rules:
        - alert: CNPGBackupFailed
          # CNPG publishes `cnpg_collector_last_failed_backup_timestamp`
          # which is the unix-ts of the LAST failed backup attempt.
          # If it's newer than the last *successful* backup, alert.
          # Aggregate per (cluster, namespace) with max() — every pod
          # in a CNPG cluster publishes the same timestamps, so the raw
          # series has N>1 duplicates on each side which `> on (...)`
          # rejects ("found duplicate series for the match group").
          expr: |
            max by (cluster, namespace) (cnpg_collector_last_failed_backup_timestamp)
              > on (cluster, namespace) max by (cluster, namespace) (cnpg_collector_last_available_backup_timestamp)
          for: 30m
          labels:
            severity: critical
            component: backup
            # Deep-mode investigation: CNPG backup failure can be operator
            # issue, network to S3, storage exhaustion, or app bug. Advisor
            # iterates with tool-use to find root cause.
            ai_advisor_mode: "deep"
            namespace: postgres
          annotations:
            runbook_url: "https://github.com/etherport/infra/blob/main/docs/runbooks/alerts/CNPGBackupFailed.md"
            summary: "CNPG cluster {{ $labels.cluster }} has a backup failure"
            description: |
              The most recent backup attempt for CNPG cluster
              `{{ $labels.cluster }}` failed, AND it's newer than the
              last successful backup. Manual investigation needed:
              kubectl -n postgres get scheduledbackups,backups
              kubectl -n postgres logs cnpg-controller-manager-<pod>

        - alert: CNPGBackupStale
          # No successful backup in 36h (daily at 05:00 UTC).
          # max() per cluster — replicas that haven't witnessed any
          # backup report 0, which would otherwise trigger the alert
          # forever even when the primary just backed up successfully.
          expr: (time() - max by (cluster, namespace) (cnpg_collector_last_available_backup_timestamp)) > 129600
          for: 1h
          labels:
            severity: warning
            component: backup
            namespace: postgres
            # AI advisor Phase 3 opt-in: can autonomously call
            # trigger_cnpg_backup_now (uses cluster from $labels.cluster).
            ai_remediation: "auto"
          annotations:
            runbook_url: "https://github.com/etherport/infra/blob/main/docs/runbooks/alerts/CNPGBackupStale.md"
            summary: "CNPG cluster {{ $labels.cluster }} backup stale (>36h)"
            description: |
              Last successful CNPG backup for `{{ $labels.cluster }}`
              was {{ $value | humanizeDuration }} ago.

    # ---------- Velero backup metrics ----------
    # LIVE: Velero's serviceMonitor is enabled (clusters/wind/helm-releases/velero.yaml,
    # since 2026-05-24) and scraped — velero_backup_* series are present in Prometheus,
    # so these rules evaluate against real data. The bootstrap reference
    # backups/velero/values.yaml mirrors the SM setting; keep them in sync (M67).
    - name: velero-backups.rules
      rules:
        - alert: VeleroBackupFailed
          # velero_backup_*_total are monotonically-increasing counters
          # (never decrement). Use rate() over a 25h window so this fires
          # ONLY when a new failure has occurred in the last day, not
          # forever after a single historical failure.
          expr: increase(velero_backup_failure_total[25h]) > 0
          for: 5m
          labels:
            severity: warning
            component: backup
            namespace: velero
          annotations:
            runbook_url: "https://github.com/etherport/infra/blob/main/docs/runbooks/alerts/VeleroBackupFailed.md"
            summary: "Velero backup failure recorded for {{ $labels.schedule }} in last 25h"
            description: |
              At least one backup invocation for schedule
              `{{ $labels.schedule }}` has failed in the last 25h. Check:
              velero backup logs <name>
              kubectl -n velero get backups

        - alert: VeleroBackupPartial
          # Same as VeleroBackupFailed: monotonic counter needs a window.
          # 25h covers the daily backup cadence + small slop.
          expr: increase(velero_backup_partial_failure_total[25h]) > 0
          for: 5m
          labels:
            severity: warning
            component: backup
            namespace: velero
          annotations:
            runbook_url: "https://github.com/etherport/infra/blob/main/docs/runbooks/alerts/VeleroBackupPartial.md"
            summary: "Velero partial backup recorded for {{ $labels.schedule }} in last 25h"
            description: |
              A backup in the last 25h completed with partial failures.
              Some resources were not backed up. Investigate:
              velero describe backup <name> --details
              Common causes: namespace listed in schedule no longer
              exists; PV without CSI snapshotter wired.

        - alert: VeleroLastBackupAgeHigh
          # If no completion for any schedule in 36h, alert. Adjust per
          # schedule once Velero exposes the metric by schedule name.
          # `{schedule!=""}` filter: Velero exposes BOTH a per-schedule metric
          # and a global label-less metric. The global one isn't updated as
          # individual schedules complete — it's stuck at the oldest value,
          # which keeps the alert firing forever. Per-schedule is the actual
          # signal.
          expr: time() - velero_backup_last_successful_timestamp{schedule!=""} > 129600
          for: 1h
          labels:
            severity: warning
            component: backup
            namespace: velero
            # AI advisor Phase 3 opt-in: can autonomously call
            # trigger_velero_backup_now to kick a fresh backup.
            ai_remediation: "auto"
          annotations:
            runbook_url: "https://github.com/etherport/infra/blob/main/docs/runbooks/alerts/VeleroLastBackupAgeHigh.md"
            summary: "Velero hasn't completed a backup in >36h"
            description: |
              {{ $value | humanizeDuration }} since any Velero schedule
              completed successfully. All Velero schedules (12) should run daily.

    # ---------- etcd snapshot offsite (M62) ----------
    # Metrics pushed to Pushgateway by /usr/local/bin/etcd-snapshot.sh on each
    # control-plane node (job="etcd_snapshot", instance=<hostname>). See
    # infra/ansible/playbooks/etcd-backup.yml + outstanding-work M62.
    - name: etcd-snapshot.rules
      rules:
        - alert: EtcdSnapshotStale
          # No fresh snapshot in >36h on a cp node (daily 09:00 UTC timer). A
          # failed `etcdctl snapshot save` exits the script before it pushes, so
          # the timestamp goes stale → this fires. etcd is critical → human-in-
          # the-loop (kube-system is on the advisor denylist; advisory only).
          expr: (time() - etcd_snapshot_last_run_timestamp) > 129600
          for: 1h
          labels:
            severity: critical
            component: backup
            namespace: kube-system
          annotations:
            summary: "etcd snapshot stale on {{ $labels.instance }} (>36h)"
            description: |
              No fresh etcd snapshot from cp node `{{ $labels.instance }}` in
              {{ $value | humanizeDuration }}. The systemd timer may have stopped
              or `etcdctl snapshot save` is failing. Check:
              systemctl status etcd-snapshot.timer etcd-snapshot.service
              journalctl -u etcd-snapshot.service  (also Loki: app="etcd-snapshot")

        - alert: EtcdSnapshotS3UploadFailing
          # Snapshot saved locally but the offsite S3 copy failed — local-only
          # is the single-point-of-failure M62 set out to remove.
          expr: etcd_snapshot_s3_upload_success == 0
          for: 1h
          labels:
            severity: warning
            component: backup
            namespace: kube-system
          annotations:
            summary: "etcd snapshot S3 upload failing on {{ $labels.instance }}"
            description: |
              The local etcd snapshot on `{{ $labels.instance }}` is not reaching
              s3://etcd-snapshots.wind.etherport.net. Check awscli/creds on the node
              + the etcd-backup IAM user. Local snapshot still exists (14d retention).
