---
# LogQL alert rules for the loki-ruler — Cilium NetworkPolicy observability (H3).
# Two rules off the same hubble export (job="hubble-audit", verdict AUDIT+DROPPED):
#   - CiliumNetpolAuditFlow: would-be-drops during a tier's OBSERVATION (audit on)
#   - CiliumNetpolDropFlow:  real drops to/from an enforced tier (audit off) =
#     "a channel may need opening" (add to the per-tier CNP allowlist)
#
# Cilium runs in policy-audit-mode: traffic a NetworkPolicy WOULD deny is logged
# as an AUDIT verdict but allowed through. Cilium exports those AUDIT flows to a
# per-node file (hubble-export-allowlist={"verdict":["AUDIT"]}); Alloy tails it
# into Loki under job="hubble-audit" (see clusters/wind/helm-releases/alloy.yaml).
#
# Every AUDIT flow to an enforced namespace is a would-be-drop on enforcement —
# i.e. EITHER a missing allowlist entry (add it to the per-tier CNP in
# platform/kubernetes/networkpolicies/) OR genuinely-unwanted lateral movement
# (leave it to be blocked). This rule surfaces NEW/notable flows; it excludes the
# already-triaged known-good sources so it stays quiet otherwise. This replaces
# the interactive `audit-report.py` /loop (H39 follow-on; H3 observation).
#
# Picked up by the loki k8s-sidecar (label loki_rule="1") → /var/loki/rules-temp.
# As you ADD a flow to a CNP allowlist it stops being AUDIT (CNP forwards it) and
# drops out of the export automatically. As you ENFORCE a new tier, its AUDIT
# flows appear here with no rule change. Update the `src_ns` exclusion below only
# when a *new* source becomes known-good-but-not-yet-allowlisted.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-rules-cilium-audit
  namespace: monitoring
  labels:
    loki_rule: "1"
data:
  cilium-audit.yaml: |
    groups:
      - name: cilium-netpol-audit
        interval: 5m
        rules:
          # Fires when AUDIT (would-be-denied) flows reach an enforced namespace
          # from a source that is NOT already triaged as known-good. Known-good
          # (excluded): postgres→postgres (CNPG streaming replication) and
          # cnpg-system→postgres (operator/instance-manager). `for: 15m` so a
          # one-off probe doesn't page; sustained presence = real triage needed.
          - alert: CiliumNetpolAuditFlow
            expr: |
              sum by (src_ns, dst_ns, dport) (
                count_over_time(
                  {job="hubble-audit"}
                  | json src_ns="flow.source.namespace", dst_ns="flow.destination.namespace", dport="flow.l4.TCP.destination_port"
                  | __error__=""
                  | src_ns!~"postgres|cnpg-system"
                  [30m]
                )
              ) > 0
            for: 15m
            labels:
              severity: warning
              component: network
              source: cilium-hubble
            annotations:
              summary: "Cilium AUDIT flow {{ $labels.src_ns }} → {{ $labels.dst_ns }}:{{ $labels.dport }} (would be denied on enforcement)"
              description: |
                Cilium policy-audit-mode logged a would-be-denied (AUDIT) flow
                from namespace "{{ $labels.src_ns }}" to "{{ $labels.dst_ns }}"
                on port {{ $labels.dport }}, sustained for 15m. On enforcement
                this traffic is DROPPED. Decide: add it to the per-tier CNP
                allowlist in platform/kubernetes/networkpolicies/ if legit, or
                leave it to be blocked if it's unwanted lateral movement.
                Inspect the exact src→dst:port tuples in Grafana (Explore, Loki):
                  {job="hubble-audit"} | json
                  | line_format "{{`{{.flow_source_namespace}}/{{.flow_source_pod_name}} -> {{.flow_destination_namespace}}/{{.flow_destination_pod_name}}:{{.flow_l4_TCP_destination_port}}`}}"

          # Fires once policies ENFORCE (audit off): a real DROPPED flow involving
          # an enforced namespace (postgres/cue/dns/traefik/monitoring) from an
          # in-cluster source (src_ns!="" excludes external scans, which are
          # correctly-blocked noise). This is the "we may need to open a channel"
          # signal: an in-cluster pod's traffic to/from a segmented tier was DROPPED
          # — either a missing allowlist entry (add it to the per-tier CNP) or
          # unwanted lateral movement (leave blocked). The same hubble export now
          # carries DROPPED too (cilium-config hubble-export-allowlist verdict
          # AUDIT+DROPPED). NB: a DROPPED EXTERNAL client (src=world) won't alert
          # here — find those with `hubble observe --verdict DROPPED` (runbook).
          - alert: CiliumNetpolDropFlow
            expr: |
              sum by (src_ns, dst_ns, dport) (
                count_over_time(
                  {job="hubble-audit"}
                  | json verdict="flow.verdict", src_ns="flow.source.namespace", dst_ns="flow.destination.namespace", dport="flow.l4.TCP.destination_port"
                  | __error__=""
                  | verdict="DROPPED"
                  | src_ns!=""
                  | src_ns=~"postgres|cue|dns|traefik|monitoring" or dst_ns=~"postgres|cue|dns|traefik|monitoring"
                  [30m]
                )
              ) > 0
            for: 15m
            labels:
              severity: warning
              component: network
              source: cilium-hubble
            annotations:
              summary: "Cilium DROPPED flow {{ $labels.src_ns }} → {{ $labels.dst_ns }}:{{ $labels.dport }} (enforced — channel may need opening)"
              description: |
                A NetworkPolicy-enforced namespace DROPPED an in-cluster flow from
                "{{ $labels.src_ns }}" to "{{ $labels.dst_ns }}" on port
                {{ $labels.dport }}, sustained 15m. If this is legitimate (e.g. a
                newly-added service that needs to reach a segmented tier), add it to
                the per-tier CNP allowlist in platform/kubernetes/networkpolicies/
                (see docs/runbooks/networkpolicy-tiers.md "Adding or changing a
                service"). If it's unwanted lateral movement, leave it blocked.
                Tuples (Grafana Explore, Loki):
                  {job="hubble-audit"} | json | flow_verdict="DROPPED"
                  | line_format "{{`{{.flow_source_namespace}}/{{.flow_source_pod_name}} -> {{.flow_destination_namespace}}/{{.flow_destination_pod_name}}:{{.flow_l4_TCP_destination_port}}`}}"
