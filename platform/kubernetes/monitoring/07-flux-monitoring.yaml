---
# H36: Flux observability + reconciliation alerting.
#
# Flux's controllers export gotk_* metrics on :8080 (http-prom) but nothing scraped
# them, so a wedged reconcile was invisible — e.g. the 2026-06-17 CNPG webhook-cert
# incident silently blocked the flux-system Kustomization for hours. This PodMonitor
# scrapes the controllers (the flux-system `allow-scraping` NetworkPolicy already
# permits Prometheus → :8080) and the rule alerts on sustained reconcile errors
# (this flux build doesn't export gotk_reconcile_condition; see the rule comment).
#
# The monitoring kustomization's `namespace: monitoring` transformer places both in
# the monitoring namespace; the PodMonitor reaches flux-system via namespaceSelector.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flux-controllers
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - flux-system
  selector:
    matchLabels:
      app.kubernetes.io/part-of: flux
  podMetricsEndpoints:
    # honorLabels: keep the gotk metric's own kind/name/namespace (the Flux OBJECT),
    # not the controller pod's namespace (which would shadow them as exported_*).
    - port: http-prom
      honorLabels: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_app]
          targetLabel: app
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flux-alerts
  labels:
    release: monitoring
    app: kube-prometheus-stack
spec:
  groups:
    - name: flux.rules
      rules:
        - alert: FluxReconciliationErrors
          # This flux version does NOT export gotk_reconcile_condition (only
          # gotk_reconcile_duration_seconds + controller_runtime_*), so we alert on
          # sustained reconcile ERRORS instead: a wedged Kustomization/HelmRelease
          # keeps erroring (e.g. the 2026-06-17 CNPG webhook-cert incident, which
          # blocked the flux-system Kustomization for hours undetected). result=error
          # rate > 0 for 15m = a real, sustained failure (transient blips are normal).
          expr: |
            sum by (app, controller) (
              rate(controller_runtime_reconcile_total{namespace="flux-system", result="error"}[5m])
            ) > 0
          for: 15m
          labels:
            severity: warning
            component: gitops
            namespace: flux-system
          annotations:
            summary: "Flux {{ $labels.controller }} ({{ $labels.app }}) reconcile errors >15m"
            description: |
              Flux's {{ $labels.app }} has had sustained reconcile errors for the
              `{{ $labels.controller }}` kind for over 15 minutes — desired state is
              NOT being applied (a wedged Kustomization/HelmRelease blocks GitOps).
              Investigate:
                kubectl get kustomizations,helmreleases -A | grep -iv ' True '
                kubectl -n flux-system logs deploy/{{ $labels.app }} --tail=80
