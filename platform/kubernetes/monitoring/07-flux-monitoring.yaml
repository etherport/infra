---
# H36: Flux observability + reconciliation alerting.
#
# Flux's controllers export gotk_* metrics on :8080 (http-prom) but nothing scraped
# them, so a wedged reconcile was invisible — e.g. the 2026-06-17 CNPG webhook-cert
# incident silently blocked the flux-system Kustomization for hours. This PodMonitor
# scrapes the controllers (the flux-system `allow-scraping` NetworkPolicy already
# permits Prometheus → :8080) and the rule alerts on sustained Ready=False.
#
# The monitoring kustomization's `namespace: monitoring` transformer places both in
# the monitoring namespace; the PodMonitor reaches flux-system via namespaceSelector.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flux-controllers
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - flux-system
  selector:
    matchLabels:
      app.kubernetes.io/part-of: flux
  podMetricsEndpoints:
    # honorLabels: keep the gotk metric's own kind/name/namespace (the Flux OBJECT),
    # not the controller pod's namespace (which would shadow them as exported_*).
    - port: http-prom
      honorLabels: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_app]
          targetLabel: app
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flux-alerts
  labels:
    release: monitoring
    app: kube-prometheus-stack
spec:
  groups:
    - name: flux.rules
      rules:
        - alert: FluxReconciliationFailed
          # A Flux object (Kustomization/HelmRelease/GitRepository/…) has been
          # Ready=False for >15m — its GitOps changes aren't applying. Transient
          # reconcile blips are normal, hence 15m. Suspended objects are excluded.
          # The flux-system/flux-system Kustomization being stuck = ALL GitOps
          # blocked (the 2026-06-17 wedge); the labels make that obvious.
          expr: |
            gotk_reconcile_condition{type="Ready",status="False"} == 1
            unless on (kind, namespace, name) gotk_suspend_status == 1
          for: 15m
          labels:
            severity: warning
            component: gitops
            namespace: flux-system
          annotations:
            summary: "Flux {{ $labels.kind }} {{ $labels.namespace }}/{{ $labels.name }} not reconciling (>15m)"
            description: |
              Flux {{ $labels.kind }} `{{ $labels.namespace }}/{{ $labels.name }}` has
              been Ready=False for over 15 minutes — its desired state is NOT being
              applied. If this is the flux-system Kustomization, ALL GitOps is blocked.
              Investigate:
                kubectl get kustomizations,helmreleases -A | grep -iv ' True '
                kubectl -n {{ $labels.namespace }} describe {{ $labels.kind | toLower }} {{ $labels.name }}
