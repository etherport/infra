# Alerts for the Mac mini's off-cluster photos backup pipeline. The mini
# (10.10.202.101) pushes cairn_backup_*{job="photos"} / cairn_photos_* metrics to
# the cluster Pushgateway after every run. cairn_backup_last_success_timestamp_seconds
# is pushed under its own group (job="photos_lastsuccess") so a failed run can't wipe
# the last-success marker. Pushgateway persistence (see helm-releases/pushgateway.yaml)
# keeps these across pod restarts so the staleness alerts don't false-fire.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: photos-export-alerts
  namespace: monitoring
  labels:
    # kube-prometheus-stack ruleSelector matches release=monitoring
    release: monitoring
spec:
  groups:
    - name: photos-export
      rules:
        - alert: PhotosExportStale
          # No SUCCESSFUL run in >26h (nightly is 22:00 PT). max() so any of the
          # success-ts series (local/photokit/resume) keeps it fresh; catches
          # both failed and skipped runs.
          expr: time() - max(cairn_backup_last_success_timestamp_seconds{job="photos_lastsuccess",instance="mini"}) > 93600
          for: 15m
          labels:
            severity: critical
            component: backup
            namespace: backups
          annotations:
            summary: "Mac mini photos export hasn't succeeded in >26h"
            description: |
              No successful cairn photos run on the mini (10.10.202.101) in >26h
              (nightly schedule is 22:00 PT) — a failed or skipped run.
              Check: launchctl print gui/$(id -u)/net.wind.cairn on the
              mini; Loki {host="mini"}; the "Mac mini — Photos
              backup" Grafana dashboard.

        - alert: PhotosExportNoMetrics
          # The success-ts series is entirely absent for >48h — the mini stopped
          # pushing (job/Alloy down, network/firewall/DNS) or Pushgateway lost its
          # data (and persistence didn't restore it).
          expr: absent(cairn_backup_last_success_timestamp_seconds{job="photos_lastsuccess",instance="mini"})
          for: 48h
          labels:
            severity: warning
            component: backup
            namespace: backups
          annotations:
            summary: "No cairn photos metrics for >48h (mini not pushing / Pushgateway data lost)"
            description: |
              cairn_backup_last_success_timestamp_seconds{job="photos_lastsuccess"} has been absent for
              >48h. The mini may have stopped pushing (launchd job/Alloy down,
              firewall/DNS), or the Pushgateway lost its store. Check the mini and
              the pushgateway pod (kubectl -n monitoring get pod -l app.kubernetes.io/name=prometheus-pushgateway).

        - alert: PhotosExportFailed
          # Last run returned non-zero (rc persists in Pushgateway until the next
          # push).
          expr: max(cairn_backup_last_rc{job="photos",instance="mini"}) != 0
          for: 30m
          labels:
            severity: warning
            component: backup
            namespace: backups
          annotations:
            summary: "Mac mini photos export last run returned non-zero (rc={{ $value }})"
            description: |
              cairn_backup_last_rc{job="photos"}={{ $value }} (!=0) for >30m — the last export
              run failed. Logs: Loki {host="mini"} (look for
              "✗ export exited").

        - alert: PhotosExportNotParsed
          # cairn_photos_summary_parsed=0 means a run FINISHED but its summary/report
          # couldn't be trusted (watchdog-killed mid-run, or a truncated --report CSV over
          # SMB), so the count metrics carry -1 "unknown" sentinels and last_success was NOT
          # stamped. Distinct from Failed (rc!=0) — catches the silent "completed but counts
          # are garbage" case that would otherwise read as 0-missing. >1h so a mid-run
          # snapshot doesn't flap it.
          expr: max(cairn_photos_summary_parsed{instance="mini"}) == 0
          for: 1h
          labels:
            severity: warning
            component: backup
            namespace: backups
          annotations:
            summary: "Mac mini photos export ran but its summary was unparseable (counts untrusted)"
            description: |
              cairn_photos_summary_parsed=0 for >1h — the last run finished but its
              summary/report could not be parsed (watchdog-kill or truncated CSV), so
              exported/missing counts are -1 (unknown) and last_success was withheld.
              Treat coverage as UNKNOWN, not 0. Logs: Loki {host="mini"};
              "Mac mini — Photos backup" dashboard.

        - alert: PhotosExportCoverageRegressed
          # cairn_photos_missing is now split: _resolvable (genuinely-missing
          # originals a re-download could fetch — the actionable number) and
          # _unavailable (structurally un-fetchable edited Live-Photo clips Apple
          # won't serve, ~9, expected, deliberately NOT alerted). Fire only on
          # resolvable > 0: i.e. coverage of fetchable files dropped below 100%
          # and DOWNLOAD_MISSING=1 hasn't yet closed the gap. >1h so a single
          # mid-run snapshot or a download in progress doesn't flap it.
          expr: max(cairn_photos_missing_resolvable{instance="mini"}) > 0
          for: 1h
          labels:
            severity: warning
            component: backup
            namespace: backups
          annotations:
            summary: "Photos-export coverage <100%: {{ $value }} fetchable file(s) missing from backup"
            description: |
              cairn_photos_missing_resolvable={{ $value }} (>0 for >1h) — there
              are genuinely-missing originals a re-download could fetch, so backup
              coverage of available files has dropped below 100%. Normally
              DOWNLOAD_MISSING=1 closes this on the next run; if it persists,
              investigate (iCloud download failures, source items pending
              download). Note: _unavailable (edited Live-Photo clips, ~9) is
              expected and NOT counted here. Logs: Loki {host="mini"};
              "Mac mini — Photos backup" dashboard.

        - alert: PhotosExportOrphansGrowing
          # cairn_photos_orphans = files in the export dir not in osxphotos'
          # ledger (untracked duplicates). The absolute value is NOT alertable —
          # it has a large legitimate baseline that drops toward 0 after a
          # NAS-local orphan delete. We only care about GROWTH: a meaningful
          # increase means new dups are being produced (a run without --exportdb,
          # a race, etc.). Fire on a >50 rise within a rolling 26h window.
          expr: delta(cairn_photos_orphans{instance="mini"}[26h]) > 50
          for: 1h
          labels:
            severity: warning
            component: backup
            namespace: backups
          annotations:
            summary: "Photos-export orphan dup files growing (+{{ $value }} in 26h)"
            description: |
              cairn_photos_orphans rose by {{ $value }} over the last 26h (>50).
              Orphans are files in the export dir not tracked by osxphotos' ledger
              — growth means new untracked duplicates are being produced (e.g. a
              run without --exportdb, or a race), not the expected static/declining
              baseline. Investigate the mini's export invocation. Logs: Loki
              {host="mini"}; "Mac mini — Photos backup" dashboard.
