---
# M113 (2026-07-01): alert-coverage gaps found by the Fable-5 infra review —
# a dead postgres cluster, an expiring cert, a dark authentik, or a dead
# cloudflared tunnel previously paged NOTHING (CNPG had only backup alerts;
# cert-manager metrics weren't even scraped until the same change).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: service-alerts
  namespace: monitoring
  labels:
    release: monitoring
    app: kube-prometheus-stack
spec:
  groups:
    - name: cnpg-availability.rules
      rules:
        # 2026-07-29 incident: WAL backed up during a storage stall and filled the
        # 10Gi shared-PG PVC; CNPG's low-disk guard HALTED the whole cluster (no
        # primary -> SSO outage). KubePersistentVolumeFillingUp fired too late/generic.
        # This pages EARLY (65%) on the CNPG database PVCs specifically — at 32Gi,
        # 65% leaves ~11Gi of reaction headroom. Critical so it emails.
        - alert: CnpgPvcUsageHigh
          expr: >
            (1 - kubelet_volume_stats_available_bytes{persistentvolumeclaim=~"postgres-cluster-.*|cue-db-.*"}
               / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~"postgres-cluster-.*|cue-db-.*"}) * 100 > 65
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "CNPG PVC {{ $labels.persistentvolumeclaim }} is {{ $value | printf \"%.0f\" }}% full"
            description: >-
              A CNPG database PVC crossed 65% — usually WAL accumulating because
              archiving lags (storage stall / barman outage). If it fills, CNPG
              HALTS the whole cluster ("Not enough disk space" -> no primary ->
              dependent apps get connection refused; the 2026-07-29 SSO outage).
              Check pg_wal size + barman archiving; recovery = session-log 2026-07-29
              (patch PVC requests directly — CNPG won't self-resize from the halt).
        # absent()-based: when a CNPG cluster dies entirely its series VANISH,
        # so a `== 0` expr would never fire. One rule per cluster (absent()
        # can't be aggregated across label values).
        - alert: CNPGClusterDown
          expr: absent(cnpg_collector_up{cluster="postgres-cluster"}) == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "CNPG postgres-cluster is not reporting (shared HA postgres)"
            description: "No cnpg_collector_up series from postgres-cluster for 5m — the shared DB behind authentik/grafana/wiki/etc is likely down or unscrapeable. Check: kubectl -n postgres get cluster,pods."
        - alert: CNPGClusterDown
          expr: absent(cnpg_collector_up{cluster="cue-db"}) == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "CNPG cue-db is not reporting"
            description: "No cnpg_collector_up series from cue-db for 5m — Cue's database is likely down or unscrapeable. Check: kubectl -n cue get cluster,pods."

    - name: optional-secrets.rules
      rules:
        # L18: cue-api mounts the `cue-app` secret with `optional: true` so it can
        # boot before the secret is populated — but that secret carries AUTH material
        # (CUE_WEB_TOKEN_SECRET, VAPID_*, ANTHROPIC_API_KEY). If it's ever deleted,
        # cue-api keeps RUNNING in a degraded / reduced-auth state with no other
        # signal. absent() fires if the secret vanishes (the pod won't restart on its
        # own). Other optional refs (cloudflare-ddns config, drift-status, per-share
        # excludes) are non-auth config with safe defaults → intentionally not alerted.
        - alert: CueAppSecretMissing
          expr: absent(kube_secret_info{namespace="cue",secret="cue-app"}) == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "cue-api's optional auth secret `cue-app` is missing"
            description: "kube_secret_info for secret cue-app in ns cue has been absent for 15m. cue-api mounts it optional:true, so it is still running but WITHOUT its auth/API material (CUE_WEB_TOKEN_SECRET etc.). Restore the secret (sops -d platform/kubernetes/cue-api/03-secret-app.sops.yaml → apply) and roll cue-api."

    - name: certificates.rules
      rules:
        # DURATION-AGNOSTIC by design: the primary wildcard is a Let's Encrypt
        # SHORT-LIVED cert (~6.7d lifetime, renews every ~4.5d), so absolute
        # days-to-expiry thresholds would either page constantly or never.
        # cert-manager publishes its own planned renewal time - the correct
        # "renewal is failing" signal is that time being OVERDUE.
        - alert: CertManagerRenewalOverdue
          expr: (time() - certmanager_certificate_renewal_timestamp_seconds) > 12 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} renewal is >12h overdue"
            description: "cert-manager's own renewalTime passed >12h ago and the cert hasn't been reissued - the ACME/DNS01 path is failing. Check: kubectl describe certificate + certificaterequests/orders/challenges. A short-lived (6-7d) cert still has ~2d of slack after its renewal point."
        # Whatever the duration, <24h of validity left = renewal has failed
        # repeatedly and expiry is imminent.
        - alert: CertManagerCertExpiryCritical
          expr: min by (name, namespace) (certmanager_certificate_expiration_timestamp_seconds - time()) < 24 * 3600
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in <24h"
            description: "Renewal has been failing past its scheduled point and expiry is imminent - every HTTPS consumer of this cert breaks when it lapses. Fix the ACME/DNS01 path or issue manually NOW."

    - name: authentik.rules
      rules:
        - alert: AuthentikDown
          expr: probe_success{appliance="authentik"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "authentik SSO is not answering /-/health/live/"
            description: "The in-cluster health probe has failed for 5m — all OIDC logins (Grafana/wiki/Open WebUI) + every forward-auth admin UI are blocked. HA/Plex keep working (own auth). Check: kubectl -n authentik get pods; shared postgres health (no redis — removed with the 2026.x upgrade)."

    - name: cloudflared.rules
      rules:
        # Each replica holds 4 HA connections to the CF edge. Degraded = a
        # replica lost redundancy; Down = NO tunnel connections cluster-wide
        # (all external ingress dark). max_over_time guards scrape blips.
        - alert: CloudflaredTunnelDegraded
          expr: cloudflared_tunnel_ha_connections < 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "cloudflared {{ $labels.pod }} has {{ $value }} HA connections (<2)"
            description: "The tunnel replica lost edge redundancy (normal = 4). External ingress still works via the other replica/connections; investigate before it cascades."
        - alert: CloudflaredTunnelDown
          expr: sum(cloudflared_tunnel_ha_connections) == 0 or absent(cloudflared_tunnel_ha_connections) == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "cloudflared has ZERO edge connections — all external ingress is down"
            description: "No tunnel connections from any replica for 5m. Every externally-published service (incl. CF Access apps + cue) is unreachable from outside. Check: kubectl -n cloudflared get pods + logs; Cloudflare status page."
    - name: credential-expiry.rules
      rules:
        # 2026-07-03 sweep gap #2: hard-expiry creds (M92 dispatch PAT + the 3 CF
        # Access service tokens). Fed weekly by .github/workflows/
        # credential-expiry-check.yml -> pushgateway job "credential-expiry".
        - alert: CredentialExpirySoon
          expr: (credential_expiry_timestamp_seconds - time()) < 30*24*3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Credential {{ $labels.credential }} expires in <30 days"
            description: "{{ $labels.credential }} expires at {{ $value | humanizeTimestamp }}. Rotate BEFORE expiry: the dispatch PAT gates ALL Terraform ops (M82); CF service tokens gate Alexa->HA / HealthKit ingest / the cue health probe. Rotation: GH -> settings/tokens (fine-grained); CF tokens -> terraform taint the token resource + apply + update the consumer secret."
        - alert: CredentialExpiryCheckStale
          expr: absent(credential_expiry_check_last_run_timestamp_seconds) or (time() - credential_expiry_check_last_run_timestamp_seconds) > 8*24*3600
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: "The weekly credential-expiry check has not reported in >8 days"
            description: "credential-expiry-check.yml (Mondays, lifecycle runner) has not pushed metrics. Expiry blindness returns silently - check the workflow runs."
