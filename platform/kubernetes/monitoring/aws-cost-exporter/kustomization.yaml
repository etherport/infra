apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - serviceaccount.yaml
  - cronjob.yaml

# The exporter script is mounted from this ConfigMap (no image build).
configMapGenerator:
  - name: aws-cost-exporter-script
    files:
      - aws-cost-exporter.py

generatorOptions:
  disableNameSuffixHash: true
