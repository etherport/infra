---
# Pod identity for the aws-cost-exporter CronJob (M136). Talks only to the AWS
# Cost Explorer / Budgets APIs (via IRSA role wind-irsa-cloudwatch-read, which
# trusts this SA — see infra/terraform/aws/cluster-irsa/main.tf) and the cluster
# Pushgateway. No K8s RBAC required.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-cost-exporter
  namespace: monitoring
