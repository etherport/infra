---
# Grafana dashboard for the M41 AI advisor. Queries Loki for the
# structured `ai_advisor {...}` log lines the controller emits.
#
# Each panel uses LogQL to parse the JSON payload off the controller
# pod stdout and count/aggregate by event type, alertname, cost, etc.
# Provisioned via the grafana-dashboards sidecar (label
# grafana_dashboard: "1").
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-advisor-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  ai-advisor.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 1,
      "tags": ["ai-advisor", "auto-remediation"],
      "title": "Etherport AI Advisor",
      "uid": "ai-advisor",
      "schemaVersion": 41,
      "time": { "from": "now-24h", "to": "now" },
      "refresh": "1m",
      "panels": [
        {
          "type": "stat",
          "title": "Diagnoses (24h)",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": {"x": 0, "y": 0, "w": 4, "h": 4},
          "targets": [{
            "expr": "sum(count_over_time({namespace=\"auto-remediation\"} | json | tag=\"ai_advisor\" | event=\"success\" [24h]))",
            "refId": "A"
          }],
          "fieldConfig": {"defaults": {"unit": "short"}}
        },
        {
          "type": "stat",
          "title": "Skipped (noisy filter)",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": {"x": 4, "y": 0, "w": 4, "h": 4},
          "targets": [{
            "expr": "sum(count_over_time({namespace=\"auto-remediation\"} | json | tag=\"ai_advisor\" | event=\"skipped_noisy\" [24h]))",
            "refId": "A"
          }]
        },
        {
          "type": "stat",
          "title": "Daily cap hits",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": {"x": 8, "y": 0, "w": 4, "h": 4},
          "targets": [{
            "expr": "sum(count_over_time({namespace=\"auto-remediation\"} | json | tag=\"ai_advisor\" | event=\"cap_reached\" [24h]))",
            "refId": "A"
          }],
          "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}, "color": {"mode": "thresholds"}}}
        },
        {
          "type": "stat",
          "title": "Approved + executed",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": {"x": 12, "y": 0, "w": 4, "h": 4},
          "targets": [{
            "expr": "sum(count_over_time({namespace=\"auto-remediation\"} | json | tag=\"ai_advisor\" | event=\"approved_executed\" [24h]))",
            "refId": "A"
          }],
          "fieldConfig": {"defaults": {"color": {"mode": "fixed", "fixedColor": "green"}}}
        },
        {
          "type": "stat",
          "title": "Rejected by operator",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": {"x": 16, "y": 0, "w": 4, "h": 4},
          "targets": [{
            "expr": "sum(count_over_time({namespace=\"auto-remediation\"} | json | tag=\"ai_advisor\" | event=\"rejected\" [24h]))",
            "refId": "A"
          }]
        },
        {
          "type": "stat",
          "title": "API failures (24h)",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": {"x": 20, "y": 0, "w": 4, "h": 4},
          "targets": [{
            "expr": "sum(count_over_time({namespace=\"auto-remediation\"} | json | tag=\"ai_advisor\" | event=~\"api_failed|invalid_response|approve_bad_token|approved_failed\" [24h]))",
            "refId": "A"
          }],
          "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 5}]}, "color": {"mode": "thresholds"}}}
        },
        {
          "type": "timeseries",
          "title": "Events / 5m",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": {"x": 0, "y": 4, "w": 24, "h": 8},
          "targets": [{
            "expr": "sum by (event) (count_over_time({namespace=\"auto-remediation\"} | json | tag=\"ai_advisor\" [5m]))",
            "refId": "A"
          }]
        },
        {
          "type": "barchart",
          "title": "Top alertnames diagnosed (24h)",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": {"x": 0, "y": 12, "w": 12, "h": 8},
          "targets": [{
            "expr": "topk(10, sum by (alertname) (count_over_time({namespace=\"auto-remediation\"} | json | tag=\"ai_advisor\" | event=\"success\" [24h])))",
            "refId": "A",
            "instant": true
          }]
        },
        {
          "type": "barchart",
          "title": "Top noise-filtered (24h)",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": {"x": 12, "y": 12, "w": 12, "h": 8},
          "targets": [{
            "expr": "topk(10, sum by (alertname) (count_over_time({namespace=\"auto-remediation\"} | json | tag=\"ai_advisor\" | event=\"skipped_noisy\" [24h])))",
            "refId": "A",
            "instant": true
          }]
        },
        {
          "type": "table",
          "title": "Last 50 advisor events",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": {"x": 0, "y": 20, "w": 24, "h": 12},
          "targets": [{
            "expr": "{namespace=\"auto-remediation\"} | json | tag=\"ai_advisor\" | event != \"\" | line_format \"{{.event}} {{.alertname}} {{ if .confidence}}conf={{.confidence}} {{end}}{{ if .proposed_action_type}}action={{.proposed_action_type}} {{end}}{{ if .cost_usd}}cost=${{.cost_usd}}{{end}}\"",
            "refId": "A",
            "maxLines": 50
          }]
        },
        {
          "type": "row",
          "title": "Action execution + verification (Phase 2/3)",
          "gridPos": {"x": 0, "y": 32, "w": 24, "h": 1},
          "collapsed": false
        },
        {
          "type": "stat",
          "title": "Auto-executed (24h)",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": {"x": 0, "y": 33, "w": 4, "h": 4},
          "targets": [{
            "expr": "sum(count_over_time({namespace=\"auto-remediation\"} | json | tag=\"ai_advisor\" | event=\"auto_executed\" [24h]))",
            "refId": "A", "instant": true
          }]
        },
        {
          "type": "stat",
          "title": "Verification passed",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": {"x": 4, "y": 33, "w": 4, "h": 4},
          "targets": [{
            "expr": "sum(count_over_time({namespace=\"auto-remediation\"} | json | tag=\"ai_advisor\" | event=\"verification_passed\" [24h]))",
            "refId": "A", "instant": true
          }],
          "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}, "color": {"mode": "thresholds"}}}
        },
        {
          "type": "stat",
          "title": "Verification FAILED",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": {"x": 8, "y": 33, "w": 4, "h": 4},
          "targets": [{
            "expr": "sum(count_over_time({namespace=\"auto-remediation\"} | json | tag=\"ai_advisor\" | event=\"verification_failed\" [24h]))",
            "refId": "A", "instant": true
          }],
          "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}, "color": {"mode": "thresholds"}}}
        },
        {
          "type": "stat",
          "title": "Deep-mode runs (24h)",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": {"x": 12, "y": 33, "w": 4, "h": 4},
          "targets": [{
            "expr": "sum(count_over_time({namespace=\"auto-remediation\"} | json | tag=\"ai_advisor\" | event=\"success\" | mode=\"deep\" [24h]))",
            "refId": "A", "instant": true
          }]
        },
        {
          "type": "stat",
          "title": "Avg tool calls / deep run",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": {"x": 16, "y": 33, "w": 4, "h": 4},
          "targets": [{
            "expr": "avg_over_time({namespace=\"auto-remediation\"} | json | tag=\"ai_advisor\" | event=\"success\" | mode=\"deep\" | unwrap tool_calls [24h])",
            "refId": "A", "instant": true
          }]
        },
        {
          "type": "stat",
          "title": "Daily $ spent",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": {"x": 20, "y": 33, "w": 4, "h": 4},
          "targets": [{
            "expr": "last_over_time({namespace=\"auto-remediation\"} | json | tag=\"ai_advisor\" | event=\"success\" | unwrap daily_usd_spent [24h])",
            "refId": "A", "instant": true
          }]
        },
        {
          "type": "barchart",
          "title": "Auto-executed actions by type (24h)",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": {"x": 0, "y": 37, "w": 12, "h": 8},
          "targets": [{
            "expr": "sum by (action_type) (count_over_time({namespace=\"auto-remediation\"} | json | tag=\"ai_advisor\" | event=\"auto_executed\" [24h]))",
            "refId": "A", "instant": true
          }]
        },
        {
          "type": "barchart",
          "title": "Verification outcomes by action type (24h)",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": {"x": 12, "y": 37, "w": 12, "h": 8},
          "targets": [{
            "expr": "sum by (action_type, event) (count_over_time({namespace=\"auto-remediation\"} | json | tag=\"ai_advisor\" | event=~\"verification_(passed|failed|uncertain)\" [24h]))",
            "refId": "A", "instant": true
          }]
        },
        {
          "type": "table",
          "title": "Verification failures (7d) — alerts that auto-actions didn't fix",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": {"x": 0, "y": 45, "w": 24, "h": 8},
          "targets": [{
            "expr": "{namespace=\"auto-remediation\"} | json | tag=\"ai_advisor\" | event=\"verification_failed\" | line_format \"{{.ts}}  {{.alertname}}  action={{.action_type}}  vid={{.verification_id}}\"",
            "refId": "A",
            "maxLines": 50
          }]
        }
      ]
    }
