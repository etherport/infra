# Grafana dashboard — Blackbox appliance/endpoint probes.
# Visualizes the blackbox-exporter Probe CRs (platform/kubernetes/blackbox-exporter/):
# udm, protect, unas (HTTPS appliance web UIs) + cue-api (public /health via the
# CF tunnel). Data is probe_success / probe_duration_seconds / probe_ssl_* in
# Prometheus, labeled by `appliance`. Picked up by the Grafana sidecar via the
# grafana_dashboard="1" label.
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-appliances-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  blackbox-appliances.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 1,
      "time": { "from": "now-24h", "to": "now" },
      "refresh": "1m",
      "title": "Blackbox — Appliances & Endpoints",
      "uid": "blackbox-appliances",
      "schemaVersion": 39,
      "tags": ["blackbox", "appliances", "network"],
      "templating": { "list": [] },
      "panels": [
        {
          "id": 1,
          "title": "Current status",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 24, "x": 0, "y": 0 },
          "targets": [
            { "expr": "probe_success{job=\"blackbox-appliance\"}", "legendFormat": "{{appliance}}", "instant": true, "refId": "A" }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none", "textMode": "value_and_name" },
          "fieldConfig": { "defaults": {
            "mappings": [ { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } } ],
            "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] }
          } }
        },
        {
          "id": 2,
          "title": "Availability (probe_success)",
          "type": "state-timeline",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 7, "w": 24, "x": 0, "y": 5 },
          "targets": [
            { "expr": "probe_success{job=\"blackbox-appliance\"}", "legendFormat": "{{appliance}}", "refId": "A" }
          ],
          "fieldConfig": { "defaults": {
            "mappings": [ { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } } ],
            "color": { "mode": "thresholds" },
            "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] }
          } },
          "options": { "mergeValues": true, "showValue": "never" }
        },
        {
          "id": 3,
          "title": "Probe latency (probe_duration_seconds)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "targets": [
            { "expr": "probe_duration_seconds{job=\"blackbox-appliance\"}", "legendFormat": "{{appliance}}", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "drawStyle": "line", "fillOpacity": 10 } } }
        },
        {
          "id": 4,
          "title": "TLS cert — days until expiry",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "targets": [
            { "expr": "(probe_ssl_earliest_cert_expiry{job=\"blackbox-appliance\"} - time()) / 86400", "legendFormat": "{{appliance}}", "instant": true, "refId": "A" }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none", "textMode": "value_and_name" },
          "fieldConfig": { "defaults": {
            "unit": "d",
            "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "orange", "value": 14 }, { "color": "green", "value": 30 } ] }
          } }
        }
      ]
    }
