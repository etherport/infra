# Grafana dashboard — Mac mini off-cluster Photos backup pipeline.
# Metrics: cairn_photos_* / cairn_backup_*{job="photos"} pushed to Pushgateway by the mini after each run.
# Logs: {host="mini"} shipped to Loki by Grafana Alloy on the mini.
# Picked up by the Grafana sidecar via the grafana_dashboard="1" label.
apiVersion: v1
kind: ConfigMap
metadata:
  name: photos-export-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  photos-export.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 1,
      "title": "Mac mini — Photos backup",
      "uid": "photos-export",
      "tags": ["backup", "mini"],
      "time": { "from": "now-7d", "to": "now" },
      "schemaVersion": 39,
      "panels": [
        {
          "type": "stat",
          "title": "Coverage — available files",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Share of FETCHABLE originals that are backed up. 100% = every file a re-download (DOWNLOAD_MISSING=1) could retrieve is present (cairn_photos_missing_resolvable = 0). Structurally-unavailable items (edited Live-Photo clips Apple won't serve) are excluded from the denominator concept and shown separately.",
          "fieldConfig": { "defaults": {
            "unit": "percent",
            "decimals": 2,
            "thresholds": { "mode": "absolute", "steps": [
              { "color": "red", "value": null },
              { "color": "green", "value": 100 }
            ] } }, "overrides": [] },
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" },
            "expr": "100 * (1 - max(cairn_photos_missing_resolvable) / clamp_min(max(cairn_photos_total), 1))" } ]
        },
        {
          "type": "stat",
          "title": "Last success (age)",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": {
            "unit": "s",
            "thresholds": { "mode": "absolute", "steps": [
              { "color": "green", "value": null },
              { "color": "yellow", "value": 79200 },
              { "color": "red", "value": 93600 }
            ] } }, "overrides": [] },
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" },
            "expr": "time() - max(cairn_backup_last_success_timestamp_seconds{job=\"photos_lastsuccess\"})" } ]
        },
        {
          "type": "stat",
          "title": "Last run rc",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": {
            "thresholds": { "mode": "absolute", "steps": [
              { "color": "green", "value": null },
              { "color": "red", "value": 1 }
            ] } }, "overrides": [] },
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" },
            "expr": "max(cairn_backup_last_rc{job=\"photos\"})" } ]
        },
        {
          "type": "stat",
          "title": "Exported (last run)",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short", "color": { "mode": "fixed", "fixedColor": "green" } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" },
            "expr": "max(cairn_photos_exported)" } ]
        },
        {
          "type": "stat",
          "title": "Missing (resolvable)",
          "gridPos": { "h": 4, "w": 8, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Genuinely-missing originals a re-download could fix (the ACTIONABLE number). 0 = nothing to do. Any value >0 means files are missing from the backup that DOWNLOAD_MISSING=1 should recover — this is what PhotosExportCoverageRegressed alerts on.",
          "fieldConfig": { "defaults": {
            "unit": "short",
            "thresholds": { "mode": "absolute", "steps": [
              { "color": "green", "value": null },
              { "color": "red", "value": 1 }
            ] } }, "overrides": [] },
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" },
            "expr": "max(cairn_photos_missing_resolvable)" } ]
        },
        {
          "type": "stat",
          "title": "Unavailable (edited Live-Photo clips)",
          "gridPos": { "h": 4, "w": 8, "x": 8, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Structurally un-fetchable items (edited Live-Photo motion parts / *_edited*.mov that Apple won't serve). Expected non-zero (~9) and NOT actionable — informational only, deliberately un-alerted.",
          "fieldConfig": { "defaults": { "unit": "short", "color": { "mode": "fixed", "fixedColor": "blue" } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" },
            "expr": "max(cairn_photos_missing_unavailable)" } ]
        },
        {
          "type": "stat",
          "title": "Orphan dup files",
          "gridPos": { "h": 4, "w": 8, "x": 16, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Files present in the export dir but NOT in osxphotos' ledger (untracked duplicates). Should stay FLAT or trend down (a NAS-local delete drops it toward 0). GROWTH means new dups are being produced (a run without --exportdb, a race, etc.) — that is what PhotosExportOrphansGrowing alerts on, NOT the absolute value (which legitimately drops after cleanup). Sparkline shows the trend.",
          "fieldConfig": { "defaults": { "unit": "short", "color": { "mode": "fixed", "fixedColor": "blue" } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" },
            "expr": "max(cairn_photos_orphans)" } ]
        },
        {
          "type": "timeseries",
          "title": "Exported / missing (resolvable vs unavailable)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "short", "custom": { "drawStyle": "line", "fillOpacity": 10 } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "missing (resolvable)" },
                "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } } ] },
              { "matcher": { "id": "byName", "options": "unavailable (edited clips)" },
                "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "blue" } } ] }
            ]
          },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "max(cairn_photos_exported)", "legendFormat": "exported" },
            { "refId": "B", "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "max(cairn_photos_missing_resolvable)", "legendFormat": "missing (resolvable)" },
            { "refId": "C", "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "max(cairn_photos_missing_unavailable)", "legendFormat": "unavailable (edited clips)" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Run duration",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "drawStyle": "bars", "fillOpacity": 40 } }, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "max(cairn_backup_duration_seconds{job=\"photos\"})", "legendFormat": "duration" }
          ]
        },
        {
          "type": "logs",
          "title": "Mini logs ({host=\"mini\"})",
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 16 },
          "datasource": { "type": "loki", "uid": "loki" },
          "options": { "showTime": true, "wrapLogMessage": true, "sortOrder": "Descending" },
          "targets": [
            { "refId": "A", "datasource": { "type": "loki", "uid": "loki" }, "expr": "{host=\"mini\"}" }
          ]
        }
      ]
    }
