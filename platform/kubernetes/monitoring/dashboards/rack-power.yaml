            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 11,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "color": {
