---
# Grafana dashboard for rack power draw (M159).
#
# Sources: snmp_exporter against 2x APC Smart-UPS + 2x APC rack PDU, plus
# unpoller for PoE. Provisioned via the grafana-dashboards sidecar
# (label grafana_dashboard: "1").
#
# TWO THINGS THAT WILL MISLEAD IF FORGOTTEN:
#  1. UPS1 (Smart-UPS 1500 RM) does NOT report output watts — that OID returns
#     noSuchInstance. Its wattage here is DERIVED as load% x 980W nameplate. If
#     the true nameplate differs (some revisions are 1000W), every ups1 number
#     and the rack total are proportionally wrong. UPS2 (SRT 3000) reports watts
#     directly and is never derived.
#  2. The PDUs report CURRENT ONLY. pdu1 is a 120V leg, pdu2 is 208V — equal amps
#     are NOT equal watts, which is why the current panel is separate from the
#     watts panel rather than combined on a second axis.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rack-power-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  rack-power.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "title": "Rack Power",
      "uid": "rack-power",
      "tags": [
        "power",
        "ups",
        "pdu",
        "infrastructure"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "panels": [
        {
          "type": "stat",
          "title": "Rack draw (total)",
          "description": "UPS1 derived from load% x 980W nameplate (that card reports no watts); UPS2 measured directly. Everything in the rack sits behind one of these two UPSs.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "none",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(apc_ups_output_load_percent{device=\"ups1\"} / 100 * 980) + (apc_ups_output_active_power_watts{device=\"ups2\"})",
              "legendFormat": "",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Est. cost / month",
          "description": "At $0.20/kWh, 730h/month. Rack only \u2014 house total was ~$250/mo, so this is roughly a quarter of the bill.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 6,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "none",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "((apc_ups_output_load_percent{device=\"ups1\"} / 100 * 980) + (apc_ups_output_active_power_watts{device=\"ups2\"})) / 1000 * 730 * 0.20",
              "legendFormat": "",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "UPS1 load",
          "description": "Runtime falls sharply above ~80%.",
