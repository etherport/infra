# --- Basic components ---
prometheus:
  enabled: true
  prometheusSpec:
    # Discover all ServiceMonitors regardless of labels
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    # HA: 2 replicas with podAntiAffinity. Each replica scrapes
    # independently; queries hit either via the Service. Storage is
    # per-replica (Ceph RBD PVC) so we use 2x10Gi. Combined with the
    # PDB the prom-operator creates by default, node drains tolerate
    # one Prometheus out — required for the SDN-migration-style
    # rolling cluster maintenance we did 2026-05-22.
    replicas: 2
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: prometheus
            topologyKey: kubernetes.io/hostname
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ceph-rbd
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    # Wire the prometheus-additional-scrape-configs Secret (defined in
    # 01-external-scrape-config.yaml) into the Prometheus CR. Without
    # this reference the Secret exists but is never loaded — leaving
    # the external-nodes scrape job dormant and dns-fallback /
    # vpn-local / dns-aws / vpn-aws all rendering as UNKNOWN in the
    # service-status dashboard + email. Caught 2026-05-23.
    additionalScrapeConfigsSecret:
      enabled: true
      name: prometheus-additional-scrape-configs
      key: additional-scrape-configs.yaml

alertmanager:
  enabled: true
  alertmanagerSpec:
    # HA: 2 replicas — alertmanagers gossip with each other so an
    # alert fires once even across replicas. PDB created by default
    # by the operator.
    replicas: 2
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: alertmanager
            topologyKey: kubernetes.io/hostname
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: ceph-rbd
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

grafana:
  enabled: true

  # Admin login (change this later)
  adminUser: admin
  adminPassword: "ChangeMe123!"

  # Enable sidecar for dashboard provisioning from ConfigMaps
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

  # Persist Grafana dashboards & config
  persistence:
    enabled: true
    storageClassName: ceph-rbd
    accessModes: ["ReadWriteOnce"]
    size: 5Gi

  # Expose Grafana via Traefik
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations: {}
    hosts:
      - grafana.wind.etherport.net
    path: /
    pathType: Prefix
    # No tls section here; Traefik will terminate TLS using the wildcard cert
