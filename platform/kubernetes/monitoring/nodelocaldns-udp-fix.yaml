---
# NodeLocal DNS Corefile override.
#
# DELIBERATELY NOT in any kustomization. This file lives next to the
# monitoring stack because the troubleshooting runbook
# (docs/runbooks/dns-resolution-issues.md) references it, but applying
# it is a MANUAL one-shot: `kubectl apply -f <this>`. It's namespaced
# kube-system, which would collide with monitoring kustomization's
# `namespace: monitoring` directive if we tried to include it.
#
# Long-term: fold these Corefile changes into kubespray's nodelocaldns
# defaults so a cluster rebuild reproduces them. Until then, treat
# this file as the source of truth for what was applied + when.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nodelocaldns
  namespace: kube-system
  labels:
    addonmanager.kubernetes.io/mode: EnsureExists
data:
  Corefile: |
    cluster.local:53 {
        errors
        cache {
            success 9984 30
            denial 9984 5
        }
        reload
        loop
        bind 169.254.25.10
        forward . 10.43.0.3 {
            prefer_udp    # Changed from force_tcp
        }
        prometheus :9253
        health 169.254.25.10:9254
    }
    in-addr.arpa:53 {
        errors
        cache 30
        reload
        loop
        bind 169.254.25.10
        forward . 10.43.0.3 {
            prefer_udp    # Changed from force_tcp
        }
        prometheus :9253
    }
    ip6.arpa:53 {
        errors
        cache 30
        reload
        loop
        bind 169.254.25.10
        forward . 10.43.0.3 {
            prefer_udp    # Changed from force_tcp
        }
        prometheus :9253
    }
    .:53 {
        errors
        cache 30
        reload
        loop
        bind 169.254.25.10
        forward . /etc/resolv.conf {
            prefer_udp
        }
        prometheus :9253
    }
