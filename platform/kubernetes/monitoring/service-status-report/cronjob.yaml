# Daily service-status digest email.
# Queries Prometheus for deployment/statefulset/daemonset readiness +
# Alertmanager for firing alerts, then emails a styled HTML report via
# SMTP (the same SES relay alertmanager already uses, so no extra
# credentials live in this namespace).
#
# The script lives in a ConfigMap rather than baked into a custom image
# so iterating on the report doesn't require a Docker build.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: service-status-report
  namespace: monitoring
spec:
  # Same wall-clock as the s3-sync daily-report (6:00 AM PT) so both
  # land in the inbox together for a single morning check-in.
  schedule: "0 6 * * *"
  timeZone: "America/Los_Angeles"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # 25h (matches sibling backup CronJobs) so Alloy reliably scrapes
      # pod logs before GC. Was 1h — in practice enough for a 5s scrape
      # interval, but the outlier value was a foot-gun if Alloy stalled.
      ttlSecondsAfterFinished: 90000
      template:
        spec:
          serviceAccountName: service-status-report
          restartPolicy: Never
          containers:
            - name: report
              image: python:3.14-slim@sha256:d3400aa122fa42cf0af0dbe8ec3091b047eac5c8f7e3539f7135e86d855dc015 # {"$imagepolicy": "flux-system:python-slim"}
              imagePullPolicy: IfNotPresent
              # python:3.14-slim has no boto3 → install at start (same pattern as the
              # ai-advisor controller), then run the report (sends via SES API/IRSA).
              command: ["/bin/sh", "-c", "pip install --quiet boto3 && python3 /work/service-status-report.py"]
              env:
                - name: PROM_URL
                  value: "http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
                - name: ALERTMANAGER_URL
                  value: "http://monitoring-kube-prometheus-alertmanager.monitoring.svc.cluster.local:9093"
                - name: REPORT_TITLE
                  value: "Homelab status"
                # SES API via IRSA (role wind-irsa-cloudwatch-read trusts this SA) — no
                # static SMTP creds. From/To/Subject come from service-status-email.
                - name: AWS_REGION
                  value: "us-west-2"
                - name: AWS_ROLE_ARN
                  value: "arn:aws:iam::830881980142:role/wind-irsa-cloudwatch-read"
                - name: AWS_WEB_IDENTITY_TOKEN_FILE
                  value: "/var/run/secrets/eks.amazonaws.com/serviceaccount/token"
              envFrom:
                - configMapRef:
                    name: service-status-email
              volumeMounts:
                - name: script
                  mountPath: /work
                - name: aws-iam-token
                  mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
                  readOnly: true
                # Config-drift status, written by the CI detectors (report-drift-status
                # action). optional — absent until the first detector reports.
                - name: drift-status
                  mountPath: /drift
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 96Mi
                limits:
                  memory: 192Mi
          volumes:
            - name: script
              configMap:
                name: service-status-report-script
                defaultMode: 0755
            # NOT in the kustomization — created + merge-patched by the CI drift detectors
            # (Flux would revert the patches). optional so the pod starts before any detector
            # has run.
            - name: drift-status
              configMap:
                name: drift-status
                optional: true
            # M75 IRSA: projected SA token (aud sts.amazonaws.com) for web identity.
            - name: aws-iam-token
              projected:
                sources:
                  - serviceAccountToken:
                      audience: sts.amazonaws.com
                      expirationSeconds: 3600
                      path: token
