---
# Pod identity for the service-status-report CronJob. The script talks
# only to Prometheus + Alertmanager HTTP APIs and to SMTP, so no K8s
# RBAC is required — the SA exists solely to give the pod a stable
# identity (default SA's automounted token is the only thing it ever
# carries).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-status-report
  namespace: monitoring
