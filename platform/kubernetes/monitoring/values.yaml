# kube-prometheus-stack helm values
# Chart: prometheus-community/kube-prometheus-stack
# Version: 80.2.0
#
# Install/upgrade:
#   helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace -f values.yaml --version 80.2.0

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
          storageClassName: ceph-rbd
  enabled: true

grafana:
  # Admin credentials managed via Kubernetes Secret (grafana-admin-secret.sops.yaml)
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  enabled: true
  ingress:
    annotations: {}
    enabled: true
    hosts:
    - grafana.wind.etherport.net
    ingressClassName: traefik
    path: /
    pathType: Prefix
  persistence:
    accessModes:
    - ReadWriteOnce
    enabled: true
    size: 5Gi
    storageClassName: ceph-rbd

prometheus:
  enabled: true
  prometheusSpec:
    # Reference the additional scrape configs secret for external hosts
    additionalScrapeConfigsSecret:
      enabled: true
      name: prometheus-additional-scrape-configs
      key: additional-scrape-configs.yaml
    # Retain metrics for 15 days
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
          storageClassName: ceph-rbd
