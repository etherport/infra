# GPU Node Network Attachment Definitions
# k8s-gpu1 uses different interface naming (enp6s* instead of ens*)
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vlan202-client-gpu
  namespace: multus-system
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "enp6s19",
      "mode": "bridge",
      "ipam": {
        "type": "static"
      }
    }
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vlan204-iot-gpu
  namespace: multus-system
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "enp6s20",
      "mode": "bridge",
      "ipam": {
        "type": "static"
      }
    }
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vlan205-security-gpu
  namespace: multus-system
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "enp6s21",
      "mode": "bridge",
      "ipam": {
        "type": "static"
      }
    }
