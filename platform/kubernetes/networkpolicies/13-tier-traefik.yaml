# Tier 4 — Traefik (the cluster ingress controller / reverse proxy). ENFORCED 2026-06-22.
#
# Validated via the audit toggle: applied under policy-audit-mode ON, then the external
# device routes (UPS/PDU/Proxmox via :443/:80/:8006) + internal routes + public ingress
# were actively exercised → 0 AUDIT (would-be-drop) flows → flipped audit OFF to enforce.
# A point-in-time Hubble capture alone is NOT enough for Traefik (it only routes to a
# backend when that route is accessed), which is why the permissive-egress design below
# matters: it covers backends that weren't exercised too.
#
# Design rationale (high-fanout infra): Traefik legitimately talks to EVERY backend, so
# tight egress would cut routes on the next access + need editing for every new service.
# Egress is therefore deliberately PERMISSIVE — `toEntities: cluster` (all in-cluster
# backends, any port) + `world` on the external-device ports (PDU :80, IPMI/UPS :443,
# Proxmox :8006). The segmentation value is on INGRESS (who may reach the proxy) + the
# internal mgmt/api port. Refine ingress from the audit data, then enforce.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: traefik-tier
  namespace: traefik
spec:
  description: "Traefik: ingress on public entrypoint CONTAINER ports (:8000/:8443tcp/:8443udp/:8088) from all + mgmt (:8080) in-cluster; egress permissive (cluster any-port + world :80/:443/:8006) so backends never cut. ENFORCED."
  endpointSelector: {}
  ingress:
    # Public entrypoints — the proxy is meant to be reached by everyone: cluster pods,
    # the Cloudflare tunnel (cloudflared), LAN clients via the MetalLB VIP (world), and
    # Protect webhooks (IP-literal HTTP from the Protect host = world).
    #
    # ⚠️ CRITICAL: kube-proxy DNATs the LoadBalancer SERVICE port to the pod's CONTAINER
    # (target) port BEFORE Cilium evaluates ingress policy at the destination pod, so this
    # MUST list the *container* ports, not the service ports. Mapping (svc -> container):
    #   :80   web              -> :8000/TCP
    #   :443  websecure        -> :8443/TCP
    #   :443  websecure-http3  -> :8443/UDP
    #   :8088 webhook          -> :8088/TCP  (same number — why webhooks kept working when
    #                                          this block wrongly listed service ports)
    # Listing the service ports (80/443) instead silently dropped ALL world->VIP traffic
    # once this tier flipped audit->enforce (2026-06-23 incident: see session-log).
    - fromEntities:
        - all
      toPorts:
        - ports:
            - { port: "8000", protocol: TCP }
            - { port: "8443", protocol: TCP }
            - { port: "8443", protocol: UDP }
            - { port: "8088", protocol: TCP }
    # Internal mgmt/api/dashboard/ping/metrics (:8080) — in-cluster only (kubelet probes on
    # :8080 are also covered by allow-cluster-essentials host ingress; monitoring scrape by
    # allow-monitoring-scrape). :8443 is now world-reachable above (it's the public TLS
    # entrypoint), so it no longer needs a cluster-only allow.
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - { port: "8080", protocol: TCP }
    # Intra-namespace.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
  egress:
    # Internal backends — Traefik routes to services across many namespaces; allow all
    # in-cluster destinations/ports so routes never break (incl. future services).
    - toEntities:
        - cluster
    # External backends (the `*-external` ingressroutes): PDU :80, IPMI/UPS :443,
    # Proxmox :8006 on the management VLAN (10.10.200.x = `world`), plus general
    # external HTTPS. Extend ports here if a new external backend uses another port.
    - toEntities:
        - world
      toPorts:
        - ports:
            - { port: "80", protocol: TCP }
            - { port: "443", protocol: TCP }
            - { port: "8006", protocol: TCP }
    # Intra-namespace.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
  # DNS / kube-apiserver (Ingress/IngressRoute watch) / host comms via the cluster-wide
  # allow-dns + allow-cluster-essentials CCNPs (traefik ns is labelled enforced).
