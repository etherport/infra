# Tier 14 — home-automation (H46 tail, 2026-07-25). HA is edge-reachable (CF
# Access) + internally un-gated by design; de-privileged 2026-07-25 (H46). Its
# smart-device traffic (Roomba/Hue/HomeKit on VLANs 202/204/205) rides the MULTUS
# interfaces (net1-3), which Cilium does NOT govern — this tier bounds only eth0:
#   ingress :8123 <- traefik (ha.wind internal + webhook entrypoint) + cloudflared
#   egress  world :443/:80 (Nest/SmartThings/Tesla cloud APIs, HA cloud)
#   egress  world :123/UDP (NTP)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: home-automation-tier
  namespace: home-automation
spec:
  description: "home-automation allowlist: ingress :8123 (traefik/cloudflared); egress world :443/:80 + NTP. Multus device VLANs are outside Cilium."
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cloudflared
      toPorts:
        - ports:
            - { port: "8123", protocol: TCP }
  egress:
    - toEntities: [world]
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
            - { port: "80", protocol: TCP }
            - { port: "123", protocol: UDP }
            # SSDP (UPnP) + mDNS device discovery on eth0. The real device
            # traffic is on the Multus VLAN ifaces (outside Cilium); these are
            # the pod-net announces — allow to keep the audit clean.
            - { port: "1900", protocol: UDP }
            - { port: "5353", protocol: UDP }
    # home-radio (VM 1007, 10.10.201.41) — Z-Wave + Zigbee radios exposed over
    # TCP by ser2net. HA's ZHA integration talks socket:// to :6638; :3333 is the
    # Z-Wave port for zwave-js-ui when it lands. Scoped to a single /32 and two
    # ports on purpose: a raw serial port is an UNAUTHENTICATED control channel
    # for the entire radio network — anything that reaches it can pair, unpair
    # or actuate devices. See infra/ansible/playbooks/home-radio.yml.
    - toCIDR:
        - 10.10.201.41/32
      toPorts:
        - ports:
            - { port: "3333", protocol: TCP }
            - { port: "6638", protocol: TCP }
