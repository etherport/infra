apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Wired into clusters/wind/kustomization.yaml. ENFORCING (policy-audit-mode OFF).
# All 5 target tiers enforced: postgres, cue, dns, traefik, monitoring (namespaces
# labelled netpol.wind/enforced=true). Drop alerting live (CiliumNetpolDropFlow). To
# add another tier, briefly re-enable audit to observe it first — see README.md.

resources:
  # NOTE: no standalone default-deny object — Cilium's operator rejects an empty-rule
  # policy ("rule must have at least one of Ingress/Egress/..."). In Cilium, being
  # SELECTED by any policy with rules in a direction = default-deny for that direction.
  # The allow-* CCNPs below (which select enforced namespaces and carry both ingress and
  # egress rules) therefore establish the default-deny + allowlist. Keep both directions
  # represented across them or a direction silently reverts to allow-all.
  - 01-allow-dns.yaml
  - 02-allow-cluster-essentials.yaml
  - 03-allow-monitoring-scrape.yaml
  - 10-tier-postgres.yaml
  - 11-tier-cue.yaml
  - 12-tier-dns.yaml
  - 13-tier-traefik.yaml
  - 14-tier-monitoring.yaml  # OBSERVATION DRAFT — audit on; enforce after Loki audit confirms
