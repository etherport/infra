apiVersion: apps/v1
kind: Deployment
metadata:
  name: nordvpn-meshnet
  namespace: nordvpn-meshnet
  labels:
    app: nordvpn-meshnet
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nordvpn-meshnet
  template:
    metadata:
      labels:
        app: nordvpn-meshnet
    spec:
      # Use host network for proper routing
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      # Persistent hostname prevents Meshnet from seeing this as a new device on restart
      hostname: homelab-meshnet

      # Schedule on any worker node (not control-plane)
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist

      containers:
        - name: meshnet
          image: ghcr.io/mattstechinfo/meshnet:v3.17.0
          imagePullPolicy: IfNotPresent

          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW

          env:
            # Token from secret
            - name: NORDVPN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nordvpn-token
                  key: token

          envFrom:
            - configMapRef:
                name: nordvpn-meshnet-config

          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"

          # The container runs indefinitely, monitoring Meshnet status
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - "nordvpn meshnet peer list | grep -q 'Hostname'"
            initialDelaySeconds: 60
            periodSeconds: 60
            failureThreshold: 3

          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - "nordvpn status | grep -q 'Meshnet: enabled'"
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
