---
# am2ntfy — a ~50-line in-house bridge (ntfy has no native Alertmanager parser).
# Receives the Alertmanager webhook JSON, formats each alert, and publishes to
# the ntfy topic with an urgent priority + severity tag. Stdlib only (no deps).
apiVersion: v1
kind: ConfigMap
metadata:
  name: am2ntfy-script
  namespace: ntfy
data:
  am2ntfy.py: |
    #!/usr/bin/env python3
    """Alertmanager webhook -> ntfy publish bridge (M132)."""
    import json, os, sys, urllib.request
    from http.server import BaseHTTPRequestHandler
    from socketserver import ThreadingTCPServer

    NTFY_URL = os.environ.get("NTFY_URL", "http://ntfy.ntfy.svc.cluster.local")
    TOPIC = os.environ.get("NTFY_TOPIC", "wind-critical")
    PORT = int(os.environ.get("LISTEN_PORT", "8080"))

    def publish(alert):
        labels = alert.get("labels", {}) or {}
        ann = alert.get("annotations", {}) or {}
        status = alert.get("status", "firing")
        name = labels.get("alertname", "alert")
        scope = labels.get("namespace") or labels.get("instance") or ""
        summary = ann.get("summary") or ann.get("description") or name
        # HTTP headers are latin-1 — keep Title ASCII; the emoji lives in Tags.
        if status == "resolved":
            title = f"RESOLVED: {name}" + (f" ({scope})" if scope else "")
            prio, tags = "default", "white_check_mark"
        else:
            title = f"{name}" + (f" ({scope})" if scope else "")
            prio, tags = "urgent", "rotating_light"
        try:
            title_h = title.encode("ascii", "ignore").decode() or "alert"
            req = urllib.request.Request(
                f"{NTFY_URL}/{TOPIC}", data=summary[:900].encode("utf-8"),
                method="POST",
                headers={"Title": title_h, "Priority": prio, "Tags": tags})
            with urllib.request.urlopen(req, timeout=10) as r:
                r.read()
            print(f"published: {title_h}", flush=True)
        except Exception as e:  # never let one bad alert kill the handler
            print(f"ntfy publish failed for {name}: {e}", file=sys.stderr, flush=True)

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            try:
                n = int(self.headers.get("Content-Length", "0"))
                payload = json.loads(self.rfile.read(n) or b"{}")
                for a in payload.get("alerts", []):
                    publish(a)
                self.send_response(204)
            except Exception as e:
                print(f"bridge error: {e}", file=sys.stderr, flush=True)
                self.send_response(500)
            self.end_headers()

        def do_GET(self):  # health probe
            self.send_response(200); self.end_headers(); self.wfile.write(b"ok")

        def log_message(self, *a):
            pass

    if __name__ == "__main__":
        ThreadingTCPServer.allow_reuse_address = True
        with ThreadingTCPServer(("", PORT), Handler) as srv:
            print(f"am2ntfy listening :{PORT} -> {NTFY_URL}/{TOPIC}", flush=True)
            srv.serve_forever()
