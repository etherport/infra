apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ollama
      annotations:
        backup.velero.io/backup-volumes-excludes: ollama-data
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:0.30.2 # {"$imagepolicy": "flux-system:ollama"}
          ports:
            - containerPort: 11434
              name: http
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0"
            # Unload idle models after 5m so the P40 drops from its ~50W
            # active-idle (P0, CUDA context held) to ~10W deep idle (P8).
            # Trade-off: first request after idle reloads the model (~10-20s).
            - name: OLLAMA_KEEP_ALIVE
              value: "5m"
            # Default context cap. The Tesla P40 has 24GB VRAM; a model's
            # weights + KV-cache must fit or ollama spills layers to CPU and
            # inference crawls. qwen2.5:32b weights are ~19GB, so a 32K context
            # (~12GB KV) pushed it to 31GB → 24% CPU offload → near-unusable.
            # 8192 keeps the KV-cache small so models stay fully GPU-resident.
            # (open-webui can still raise num_ctx per-chat, but this is the
            # sane default for direct API + when the client doesn't specify.)
            - name: OLLAMA_CONTEXT_LENGTH
              value: "8192"
          resources:
            # The namespace-default LimitRange (policy-baseline) caps
            # memory at 4Gi for pods that don't set their own limit.
            # Ollama legitimately needs 8Gi+ to load real models, so
            # we set explicit limits here — the request stays 8Gi and
            # the limit gives headroom for whatever model is loaded
            # plus the inference working set.
            limits:
              nvidia.com/gpu.shared: 1
              memory: "12Gi"
            requests:
              memory: "8Gi"
              cpu: "2"
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-data
      # Schedule on GPU node
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
