apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      # L26 (2026-07-01): this workload never calls the kube API — don't hand
      # every pod a cluster credential by default.
      automountServiceAccountToken: false
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.11.0@sha256:72c0ba641ba75e7aa52655cb242570906ececd09b1140fb736483038a22b3228 # {"$imagepolicy": "flux-system:open-webui"}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: OLLAMA_BASE_URL
              value: "http://ollama.ollama.svc.cluster.local:11434"
            - name: WEBUI_AUTH
              value: "true"
            # First user to sign up becomes admin
            # Admin can manage users and disable signup later if needed
            - name: ENABLE_SIGNUP
              value: "true"
            # --- Authentik SSO (OIDC) ---
            - name: WEBUI_URL
              value: "https://chat.wind.etherport.net"
            - name: OAUTH_PROVIDER_NAME
              value: "Authentik"
            - name: OPENID_PROVIDER_URL
              value: "https://auth.wind.etherport.net/application/o/open-webui/.well-known/openid-configuration"
            - name: OAUTH_CLIENT_ID
              value: "open-webui"
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: open-webui-oidc
                  key: OAUTH_CLIENT_SECRET
            - name: OAUTH_SCOPES
              value: "openid email profile"
            - name: ENABLE_OAUTH_SIGNUP
              value: "true"
            # Link an OIDC login to an existing local account with the same email
            - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
              value: "true"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2"
          volumeMounts:
            - name: webui-data
              mountPath: /app/backend/data
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: webui-data
          persistentVolumeClaim:
            claimName: open-webui-data
