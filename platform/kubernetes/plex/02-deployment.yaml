apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
  namespace: plex
  labels:
    app: plex
spec:
  replicas: 1
  strategy:
    type: Recreate # Ensure only one instance due to PVC and GPU
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
      annotations:
        # Velero: back up ONLY the config volume (Ceph RBD — Plex DB/metadata),
        # never the media library. Plex mounts movies/tv over NFS and uses an
        # in-memory transcode scratch dir. Velero runs opt-out
        # (defaultVolumesToFsBackup: true on every schedule), so without this it
        # sweeps the entire ~5.7 TB media tree into the kopia repo in S3 — pure
        # duplication, since /var/nfs/shared/Media is already synced to S3 by the
        # backups/s3-sync-media CronJob. An exclude (not an opt-in include) is
        # used deliberately: it is honored by EVERY schedule that backs up this
        # pod (both plex-daily and critical-apps-daily), regardless of their
        # defaultVolumesToFsBackup setting. See docs/runbooks (velero media spike).
        backup.velero.io/backup-volumes-excludes: movies,tv,transcode
    spec:
      # Run on a node with an NVIDIA GPU. Matches the label automatically
      # set by gpu-operator's node-feature-discovery — no manual `gpu=true`
      # labelling required. Same selector as Ollama.
      nodeSelector:
        nvidia.com/gpu.present: "true"
      # Tolerate GPU node taint
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: plex
          image: plexinc/pms-docker:1.43.2.10687-563d026ea # {"$imagepolicy": "flux-system:plex"}
          # GPU resource request for hardware transcoding
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
              nvidia.com/gpu.shared: "1" # Request 1 GPU time-slice
            limits:
              cpu: 4000m
              memory: 8Gi
              nvidia.com/gpu.shared: "1"
          env:
            # NVIDIA Container Toolkit env vars for HW transcoding.
            # The Plex image (and time-slicing mode) defaults
            # NVIDIA_VISIBLE_DEVICES to "void" — that prevents the toolkit
            # from injecting NVENC/NVDEC even though /dev/nvidia* is mounted
            # by the device plugin. Override both:
            #   * VISIBLE_DEVICES=all — let the nvidia-container runtime
            #     bind the shared GPU device exposed by the device plugin.
            #   * DRIVER_CAPABILITIES needs `video` for NVENC/NVDEC
            #     (default is just `utility`, which gives nvidia-smi but
            #     not encode/decode access). `compute` covers CUDA paths
            #     Plex's HEVC decoder may use.
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,video,utility"
            # Timezone
            - name: TZ
              value: "America/Los_Angeles"
            # Advertise IP - The external URL where Plex is accessible
            # This tells Plex clients how to connect from outside
            - name: ADVERTISE_IP
              # Plex claim token (optional - for first-time setup)
              # Get from: https://www.plex.tv/claim/
              # - name: PLEX_CLAIM
              #   value: "claim-XXXXXXXXXXXXXXXXXXXX"

              value: "https://plex.wind.etherport.net:443"
            # Allowed networks for Plex without authentication
            # Include pod network, node network, and any trusted networks
            # This helps Plex understand it's behind a reverse proxy
            - name: ALLOWED_NETWORKS
              value: "10.42.0.0/16,10.10.201.0/24,10.10.200.0/24,172.16.0.0/12"
            # Plex UID/GID (optional - match your NFS permissions)
            - name: PLEX_UID
              value: "1000"
            - name: PLEX_GID
              value: "1000"
          ports:
            - name: plex
              containerPort: 32400
              protocol: TCP
          volumeMounts:
            # Plex config and metadata (Ceph RBD)
            - name: config
              mountPath: /config
            # Media libraries (NFS)
            - name: movies
              mountPath: /media/movies
              readOnly: true
            - name: tv
              mountPath: /media/tv
              readOnly: true
            # Transcode directory (ephemeral for GPU transcoding)
            - name: transcode
              mountPath: /transcode
          livenessProbe:
            httpGet:
              path: /web/index.html
              port: 32400
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /web/index.html
              port: 32400
            initialDelaySeconds: 30
            periodSeconds: 10
        # Log-tail sidecar — Plex writes its real logs to files under
        # /config/Library/Application Support/Plex Media Server/Logs/
        # rather than stdout, so the cluster-wide Alloy scraper sees
        # nothing useful. This sidecar tails the active log files and
        # writes each line to its own stdout, which Alloy picks up
        # under {namespace="plex", container="logtail"}.
        # Container name = "plex-logtail" (not just "logtail") so
        # Loki/Grafana Service Browser shows the sidecar's stream
        # under a meaningful name. Loki auto-derives service_name
        # from container, so a generic "logtail" would have hidden
        # these logs behind a name that says nothing about Plex.
        - name: plex-logtail
          image: busybox:1.36
          # Read-only mount of the same Plex config PVC. The sidecar
          # only needs to read the Logs/ subtree; never writes.
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          # tail -F handles log-rotation (file recreation) — Plex
          # rotates Plex Media Server.log to .1/.2/etc on size cap.
          # Wait for the directory to exist before tailing (first
          # boot, the dir doesn't exist until PMS has run once).
          command:
            - sh
            - -c
            - |
              LOGDIR="/config/Library/Application Support/Plex Media Server/Logs"
              while [ ! -d "$LOGDIR" ]; do
                echo "waiting for Plex log dir at $LOGDIR"
                sleep 30
              done
              echo "tailing Plex logs from $LOGDIR"
              # -F follows by name + handles rotation. * picks up
              # everything (PMS, scanner, transcoder, etc).
              exec tail -n 0 -F "$LOGDIR"/*.log
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        # Persistent config storage (Ceph RBD)
        - name: config
          persistentVolumeClaim:
            claimName: plex-config
        # NFS media volumes
        - name: movies
          nfs:
            server: sequoia.wind.etherport.net
            path: /var/nfs/shared/Media/Movies
            readOnly: true
        - name: tv
          nfs:
            server: sequoia.wind.etherport.net
            path: /var/nfs/shared/Media/TV Shows
            readOnly: true
        # Ephemeral transcode storage (tmpfs for fast GPU transcoding)
        - name: transcode
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
