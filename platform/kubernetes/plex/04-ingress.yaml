---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: plex-headers
  namespace: plex
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
    customResponseHeaders:
      X-Frame-Options: "SAMEORIGIN"

---
# NB: there is deliberately NO `buffering` middleware here. Traefik's buffering
# middleware accumulates the whole response before forwarding it — fatal for a
# media server's continuous transcode stream (client gets starved → 0kbps
# estimates, "changing to client buffered", throttle/sloth cycling → stalls and
# slow stream start). It was originally added "for uploads", but Traefik's
# default request-body limit is already unlimited, so it only ever added harm.
# A reverse proxy in front of Plex must pass streams through untouched.
# (Removed 2026-07-25 after diagnosing streaming instability over the TS path.)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: plex
  namespace: plex
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`plex.wind.etherport.net`)
      kind: Rule
      middlewares:
        - name: plex-headers
      services:
        - name: plex
          port: 32400
          passHostHeader: true
  tls: {}
