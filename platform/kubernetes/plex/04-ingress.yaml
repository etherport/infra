---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: plex-headers
  namespace: plex
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
    customResponseHeaders:
      X-Frame-Options: "SAMEORIGIN"

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: plex-buffering
  namespace: plex
spec:
  buffering:
    maxRequestBodyBytes: 104857600  # 100MB for uploads
    memRequestBodyBytes: 10485760   # 10MB in memory
    maxResponseBodyBytes: 104857600
    memResponseBodyBytes: 10485760

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: plex
  namespace: plex
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`plex.wind.etherport.net`)
      kind: Rule
      middlewares:
        - name: plex-headers
        - name: plex-buffering
      services:
        - name: plex
          port: 32400
          passHostHeader: true
  tls: {}
