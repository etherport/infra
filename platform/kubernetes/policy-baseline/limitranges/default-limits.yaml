# Default container requests/limits for tenant namespaces.
#
# Safety net: any pod that doesn't declare its own requests gets these
# defaults applied at admission. Doesn't override explicit specs —
# only fills in missing values.
#
# Numbers are deliberately conservative ("don't accidentally eat the
# whole node"). Real workloads should set their own requests/limits
# in their Deployment/StatefulSet/HelmRelease values.
#
# Applied to data-tier namespaces only. system-tier (plex, wireguard,
# kube-system, etc.) is excluded because legitimate workloads there
# often need higher limits and we don't want to surprise them.
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-container-limits
  namespace: home-automation
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
