apiVersion: batch/v1
kind: CronJob
metadata:
  name: gdrive-sync
  namespace: rclone
spec:
  schedule: "0 0 * * *"  # Daily at midnight
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid  # Don't allow overlapping syncs
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: gdrive-sync
        spec:
          restartPolicy: Never
          containers:
          - name: rclone
            image: rclone/rclone:latest
            command:
              - rclone
              - sync
              - "gdrive:"
              - "/backup/Graham/Google Drive/"
              - --config=/config/rclone/rclone.conf
              - --progress
              - --stats=1m
              - --stats-log-level=INFO
              - --log-level=INFO
              - --exclude=.DS_Store
              - --exclude=Thumbs.db
              - --exclude=desktop.ini
            volumeMounts:
            - name: rclone-config
              mountPath: /config/rclone
              readOnly: true
            - name: backup-nfs
              mountPath: /backup
            resources:
              requests:
                memory: 256Mi
                cpu: 100m
              limits:
                memory: 1Gi
                cpu: 1000m
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          - name: backup-nfs
            nfs:
              server: sequoia.wind.etherport.net
              path: /var/nfs/shared/Backups
