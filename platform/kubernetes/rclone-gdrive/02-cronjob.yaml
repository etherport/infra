apiVersion: batch/v1
kind: CronJob
metadata:
  name: gdrive-sync
  namespace: rclone
spec:
  schedule: "0 0 * * *" # Daily at midnight Pacific time
  timeZone: "America/Los_Angeles" # Automatically handles PST/PDT
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid # Don't allow overlapping syncs
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: gdrive-sync
        spec:
          restartPolicy: Never
          containers:
          - name: rclone
            image: rclone/rclone:1.73.0 # {"$imagepolicy": "flux-system:rclone"}
            command:
            - /bin/sh
            - /scripts/sync-and-report.sh
            volumeMounts:
            - name: rclone-config
              mountPath: /config/rclone
              readOnly: true
            - name: backup-nfs
              mountPath: /backup
            - name: sync-script
              mountPath: /scripts
              readOnly: true
            resources:
              requests:
                memory: 256Mi
                cpu: 100m
              limits:
                memory: 1Gi
                cpu: 1000m
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          - name: backup-nfs
            nfs:
              server: sequoia.wind.etherport.net
              path: /var/nfs/shared/Backups
          - name: sync-script
            configMap:
              name: rclone-sync-script
              defaultMode: 0755
