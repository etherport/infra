apiVersion: batch/v1
kind: CronJob
metadata:
  name: gdrive-sync
  namespace: rclone
spec:
  schedule: "0 0 * * *" # Daily at midnight Pacific time
  timeZone: "America/Los_Angeles" # Automatically handles PST/PDT
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid # Don't allow overlapping syncs
  jobTemplate:
    spec:
      backoffLimit: 1
      # GC Job records after 25h. Bumped from 1h on 2026-05-23 — 1h
      # was too aggressive when a daily-reporting tool needed to
      # enumerate the last 24h of runs. Failed-job noise is handled
      # by alertmanager routing (M8) and InfoInhibitor pruning.
      ttlSecondsAfterFinished: 90000
      template:
        metadata:
          labels:
            app: gdrive-sync
        spec:
          restartPolicy: Never
          containers:
          - name: rclone
            image: rclone/rclone:1.74.2 # {"$imagepolicy": "flux-system:rclone"}
            command:
            - /bin/sh
            - /scripts/sync-and-report.sh
            volumeMounts:
            - name: rclone-config
              mountPath: /config/rclone-secret
              readOnly: true
            - name: rclone-config-writable
              mountPath: /config/rclone
            - name: backup-nfs
              mountPath: /backup
            - name: sync-script
              mountPath: /scripts
              readOnly: true
            resources:
              requests:
                memory: 256Mi
                cpu: 100m
              limits:
                memory: 1Gi
                cpu: 1000m
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          - name: rclone-config-writable
            emptyDir: {}
          - name: backup-nfs
            nfs:
              server: sequoia.wind.etherport.net
              path: /var/nfs/shared/Backups
          - name: sync-script
            configMap:
              name: rclone-sync-script
              defaultMode: 0755
