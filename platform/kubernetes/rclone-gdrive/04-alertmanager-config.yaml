global:
  resolve_timeout: 5m
  smtp_smarthost: 'email-smtp.us-west-2.amazonaws.com:587'
  smtp_from: 'alerts@wind.etherport.net'
  smtp_auth_username: 'AKIA4C5DM33XO62FAELI'
  smtp_auth_password: 'BMaUacvmf3c8F4o73r8WRIgVJuNpab/QLdUBYZ7uJ95D'
  smtp_require_tls: true

inhibit_rules:
- equal:
  - namespace
  - alertname
  source_matchers:
  - severity = critical
  target_matchers:
  - severity =~ warning|info
- equal:
  - namespace
  - alertname
  source_matchers:
  - severity = warning
  target_matchers:
  - severity = info
- equal:
  - namespace
  source_matchers:
  - alertname = InfoInhibitor
  target_matchers:
  - severity = info
- target_matchers:
  - alertname = InfoInhibitor

receivers:
- name: "null"

- name: "email-alerts"
  email_configs:
  - to: 'graham.m.smith@me.com'
    from: 'alerts@wind.etherport.net'
    smarthost: 'email-smtp.us-west-2.amazonaws.com:587'
    auth_username: 'AKIA4C5DM33XO62FAELI'
    auth_password: 'BMaUacvmf3c8F4o73r8WRIgVJuNpab/QLdUBYZ7uJ95D'
    require_tls: true
    headers:
      From: 'Infrastructure Alerts <alerts@wind.etherport.net>'
      Subject: '{{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }} {{ .GroupLabels.alertname }} - {{ .GroupLabels.namespace }}'
    html: |
      <!DOCTYPE html>
      <html>
      <head>
        <style>
          body { font-family: Arial, sans-serif; line-height: 1.6; }
          .alert { margin: 20px 0; padding: 15px; border-left: 4px solid #d9534f; background: #f9f9f9; }
          .alert.resolved { border-left-color: #5cb85c; }
          .alert-header { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
          .alert-details { margin: 10px 0; }
          .label { display: inline-block; padding: 2px 8px; margin: 2px; background: #e0e0e0; border-radius: 3px; font-size: 12px; }
          .metric { font-family: monospace; background: #f5f5f5; padding: 2px 4px; }
        </style>
      </head>
      <body>
        <h2>{{ if eq .Status "firing" }}🚨 Alert Firing{{ else }}✅ Alert Resolved{{ end }}</h2>

        {{ range .Alerts }}
        <div class="alert {{ if eq .Status "resolved" }}resolved{{ end }}">
          <div class="alert-header">{{ .Labels.alertname }}</div>

          <div class="alert-details">
            <strong>Status:</strong> {{ .Status }}<br>
            <strong>Severity:</strong> {{ .Labels.severity }}<br>
            {{ if .Labels.namespace }}<strong>Namespace:</strong> {{ .Labels.namespace }}<br>{{ end }}
            {{ if .Labels.component }}<strong>Component:</strong> {{ .Labels.component }}<br>{{ end }}
            <strong>Started:</strong> {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}<br>
            {{ if eq .Status "resolved" }}<strong>Ended:</strong> {{ .EndsAt.Format "2006-01-02 15:04:05 MST" }}<br>{{ end }}
          </div>

          <div class="alert-details">
            <strong>Summary:</strong> {{ .Annotations.summary }}<br>
            <strong>Description:</strong> {{ .Annotations.description }}
          </div>

          {{ if .Labels }}
          <div class="alert-details">
            <strong>Labels:</strong><br>
            {{ range .Labels.SortedPairs }}
              <span class="label">{{ .Name }}={{ .Value }}</span>
            {{ end }}
          </div>
          {{ end }}
        </div>
        {{ end }}

        <p style="color: #666; font-size: 12px; margin-top: 30px;">
          Generated by Prometheus AlertManager<br>
          Cluster: wind.etherport.net
        </p>
      </body>
      </html>

route:
  group_by:
  - namespace
  - alertname
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: "null"
  routes:
  # Watchdog - suppress
  - matchers:
    - alertname = "Watchdog"
    receiver: "null"

  # Critical alerts - immediate email
  - matchers:
    - severity = "critical"
    receiver: "email-alerts"
    group_wait: 10s
    repeat_interval: 4h

  # Warning alerts - email
  - matchers:
    - severity = "warning"
    receiver: "email-alerts"
    group_wait: 5m
    repeat_interval: 12h

  # Info alerts - email with longer grouping
  - matchers:
    - severity = "info"
    receiver: "email-alerts"
    group_wait: 10m
    repeat_interval: 24h

templates:
- /etc/alertmanager/config/*.tmpl
