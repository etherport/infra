apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-rclone-gdrive
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  rclone-gdrive-sync.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "gnetId": null,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": "Prometheus",
          "description": "Outcome of each source's most recent run. One tile per sync source (Google Drive, OneDrive). Reflects the latest push only.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "0": {
                      "color": "red",
                      "text": "FAILED"
                    },
                    "1": {
                      "color": "green",
                      "text": "SUCCESS"
                    }
                  },
                  "type": "value"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            }
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "pluginVersion": "9.0.0",
          "targets": [
            {
              "expr": "max by (source) (rclone_sync_success{source=~\"$source\",destination=\"nfs\"})",
              "legendFormat": "{{source}}",
              "refId": "A"
            }
          ],
          "title": "Last Sync Status (per source)",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "description": "How long ago each source last completed a run. Turns yellow past 25h, red past 49h (jobs run nightly).",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "dateTimeFromNow"
            }
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "pluginVersion": "9.0.0",
          "targets": [
            {
              "expr": "max by (source) (rclone_sync_last_run_timestamp{source=~\"$source\",destination=\"nfs\"}) * 1000",
              "legendFormat": "{{source}}",
              "refId": "A"
            }
          ],
          "title": "Last Sync (per source)",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "description": "Wall-clock duration of each source's most recent run.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1800
                  },
                  {
                    "color": "red",
                    "value": 3600
                  }
                ]
              },
              "unit": "s"
            }
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "pluginVersion": "9.0.0",
          "targets": [
            {
              "expr": "max by (source) (rclone_sync_duration_seconds{source=~\"$source\",destination=\"nfs\"})",
              "legendFormat": "{{source}}",
              "refId": "A"
            }
          ],
          "title": "Last Sync Duration (per source)",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "description": "Errors in each source's MOST RECENT run. This is a per-run gauge (overwritten each sync), so it represents *unresolved* errors only: a file that errored last night but synced clean tonight drops back to 0 here. Non-zero (red) = the latest run still has failing files needing attention. Watch the 'Errors & Notices Over Time' panel below to see a spike resolve.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "id": 4,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "pluginVersion": "9.0.0",
          "targets": [
            {
              "expr": "max by (source) (rclone_sync_errors_total{source=~\"$source\",destination=\"nfs\"})",
              "legendFormat": "{{source}}",
              "refId": "A"
            }
          ],
          "title": "Unresolved Errors (latest run)",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "description": "Errors and notices per run, per source. Errors here are NOT cumulative — each point is one run, so a line returning to 0 means the previous run's failures resolved on the next sync. A persistent non-zero error line is the thing to act on. (rclone notices are usually benign: skipped/duplicate-name advisories.)",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 15,
                "gradientMode": "none",
                "hideFrom": {
                  "tooltip": false,
                  "viz": false,
                  "legend": false
                },
                "lineInterpolation": "stepAfter",
                "lineWidth": 2,
                "pointSize": 6,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "always",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "/^Errors/"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "red",
                      "mode": "fixed"
                    }
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "id": 9,
          "options": {
            "legend": {
              "calcs": ["last", "max", "sum"],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "max by (source) (rclone_sync_errors_total{source=~\"$source\",destination=\"nfs\"})",
              "legendFormat": "Errors — {{source}}",
              "refId": "A"
            },
            {
              "expr": "max by (source) (rclone_sync_notices_total{source=~\"$source\",destination=\"nfs\"})",
              "legendFormat": "Notices — {{source}}",
              "refId": "B"
            }
          ],
          "title": "Errors & Notices Over Time (per run)",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "description": "Files transferred (changed/new) and checked (compared) per run, per source.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 20,
                "gradientMode": "none",
                "hideFrom": {
                  "tooltip": false,
                  "viz": false,
                  "legend": false
                },
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "always",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "id": 5,
          "options": {
            "legend": {
              "calcs": ["last", "max"],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "targets": [
            {
              "expr": "max by (source) (rclone_sync_files_transferred{source=~\"$source\",destination=\"nfs\"})",
              "legendFormat": "Files Transferred — {{source}}",
              "refId": "A"
            },
            {
              "expr": "max by (source) (rclone_sync_files_checked{source=~\"$source\",destination=\"nfs\"})",
              "legendFormat": "Files Checked — {{source}}",
              "refId": "B"
            }
          ],
          "title": "Files Transferred & Checked Over Time",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "description": "Bytes transferred per run, per source.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 20,
                "gradientMode": "none",
                "hideFrom": {
                  "tooltip": false,
                  "viz": false,
                  "legend": false
                },
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "always",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "decbytes"
            }
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "id": 6,
          "options": {
            "legend": {
              "calcs": ["last", "max"],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "targets": [
            {
              "expr": "max by (source) (rclone_sync_bytes_transferred{source=~\"$source\",destination=\"nfs\"})",
              "legendFormat": "Bytes Transferred — {{source}}",
              "refId": "A"
            }
          ],
          "title": "Bytes Transferred Over Time",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "description": "Wall-clock run duration per source over time.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 20,
                "gradientMode": "none",
                "hideFrom": {
                  "tooltip": false,
                  "viz": false,
                  "legend": false
                },
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "always",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1800
                  },
                  {
                    "color": "red",
                    "value": 3600
                  }
                ]
              },
              "unit": "s"
            }
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "id": 7,
          "options": {
            "legend": {
              "calcs": ["last", "max", "mean"],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "targets": [
            {
              "expr": "max by (source) (rclone_sync_duration_seconds{source=~\"$source\",destination=\"nfs\"})",
              "legendFormat": "Sync Duration — {{source}}",
              "refId": "A"
            }
          ],
          "title": "Sync Duration Over Time",
          "type": "timeseries"
        }
      ],
      "schemaVersion": 36,
      "style": "dark",
      "tags": ["rclone", "backup", "gdrive", "onedrive"],
      "templating": {
        "list": [
          {
            "name": "source",
            "label": "Sync source",
            "type": "query",
            "datasource": "Prometheus",
            "query": "label_values(rclone_sync_success, source)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "current": { "text": "All", "value": "$__all", "selected": false },
            "sort": 1
          }
        ]
      },
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "America/Los_Angeles",
      "title": "Rclone Sync (Google Drive / OneDrive)",
      "uid": "rclone-gdrive-sync",
      "version": 2,
      "weekStart": ""
    }
