apiVersion: batch/v1
kind: CronJob
metadata:
  name: onedrive-sync
  namespace: rclone
spec:
  # Hourly at :30 — staggered from gdrive-sync (:00) so the two rclone pods don't
  # compete for NAS/network at once. concurrencyPolicy:Forbid skips a tick if a
  # run exceeds 1h (the first full pull will; it catches up). The daily NAS->S3
  # sync ships the freshest local copy offsite.
  schedule: "30 * * * *"
  timeZone: "America/Los_Angeles"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      # Bound a hung run to under the hourly cadence — with concurrencyPolicy:
      # Forbid, a permanently-hung run would block every future tick until the
      # 25h staleness alert. 50min frees the slot before the next hour.
      activeDeadlineSeconds: 3000
      ttlSecondsAfterFinished: 90000  # 25h — matches gdrive-sync
      template:
        metadata:
          labels:
            app: onedrive-sync
          annotations:
            # Never let Velero FS-backup the Backups NFS share or the rclone
            # working config into the kopia repo (same rationale as gdrive-sync).
            backup.velero.io/backup-volumes-excludes: backup-nfs,rclone-config-writable
        spec:
          restartPolicy: Never
          containers:
          - name: rclone
            image: rclone/rclone:1.74.3 # {"$imagepolicy": "flux-system:rclone"}
            command:
            - /bin/sh
            - /scripts/sync-and-report.sh
            # Conservative hardening (mirror gdrive M63): drop caps + block
            # privilege escalation. rclone writes its working config into the
            # /config/rclone emptyDir, so not readOnlyRootFilesystem.
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
            - name: rclone-config
              mountPath: /config/rclone-secret
              readOnly: true
            - name: rclone-config-writable
              mountPath: /config/rclone
            - name: backup-nfs
              mountPath: /backup
            - name: sync-script
              mountPath: /scripts
              readOnly: true
            resources:
              requests:
                memory: 256Mi
                cpu: 100m
              limits:
                memory: 1Gi
                cpu: 1000m
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-onedrive-config
          - name: rclone-config-writable
            emptyDir: {}
          - name: backup-nfs
            nfs:
              server: sequoia.wind.etherport.net
              path: /var/nfs/shared/Backups
          - name: sync-script
            configMap:
              name: rclone-onedrive-sync-script
              defaultMode: 0755
