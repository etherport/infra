apiVersion: v1
kind: ConfigMap
metadata:
  name: route53-ddns-config
  namespace: route53-ddns
data:
  # Comma-separated list of Route53 hosted zone IDs
  hosted_zones: "Z03500581XDWV5SKF5PK8"

  # Comma-separated list of DNS record names (must match order of hosted_zones)
  record_names: "wind.etherport.net"

  # DNS record TTL in seconds
  ttl: "300"

  # IP source: "auto" detects active WAN by comparing egress IP to wan1/wan2
  # Supports WAN failover - uses whichever WAN is currently active
  # Set to specific DNS name (e.g., "wan1.wind.etherport.net") to force a specific WAN
  ip_dns_source: "auto"

  # WAN DNS names for auto-detection (optional, defaults shown)
  ip_wan1_dns: "wan1.wind.etherport.net"
  ip_wan2_dns: "wan2.wind.etherport.net"

  # Fallback URL (not used when ip_dns_source is set)
  ip_service_url: "https://checkip.amazonaws.com"
