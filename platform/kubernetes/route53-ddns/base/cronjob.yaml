apiVersion: batch/v1
kind: CronJob
metadata:
  name: route53-ddns
  namespace: route53-ddns
spec:
  # SUSPENDED 2026-05-27: the Route53 etherport.net hosted zone was
  # deleted as part of the CF migration, so every-minute runs of this
  # CronJob fail with NoSuchHostedZone. The static value
  # `wind = 47.159.189.5` in infra/terraform/cloudflare/variables.tf
  # is currently authoritative; WAN failover detection is BROKEN until
  # the script is rewritten against the CF API (see CF-MIGRATION.md in
  # this dir + task #84). Suspend stops the failure spam without
  # removing the manifest, so the cutover is a single suspend=false +
  # image rebuild diff.
  suspend: true
  schedule: "* * * * *"  # Every minute (for fast failover response)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      # GC failed/successful Job records after 1h. Without this, every
      # failed Job lingers indefinitely and KubeJobFailed re-fires every
      # 4h per unique job_name label — produced ~300 spurious
      # alertmanager emails/day until 2026-05-22.
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: route53-ddns
            component: ddns-updater
            version: v1.0.1
        spec:
          serviceAccountName: route53-ddns
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: ddns
              image: ghcr.io/sparked-diamond/route53-ddns:main
              imagePullPolicy: Always
              command: ["/bin/bash", "-lc"]
              args:
                - |
                  set -euo pipefail
                  # Run DDNS update (auth validation happens in Route53 API calls)
                  /scripts/update-route53.sh
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: false
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "128Mi"
                  cpu: "100m"
              env:
                # CF migration 2026-05-27: HOSTED_ZONES (Route53 ID) replaced
                # by CF_ZONE_ID. All AWS_* envs dropped (no aws-cli call).
                # CF_API_TOKEN comes from the SOPS secret loaded via envFrom.
                - name: CF_ZONE_ID
                  valueFrom:
                    configMapKeyRef:
                      name: route53-ddns-config
                      key: cf_zone_id
                - name: RECORD_NAMES
                  valueFrom:
                    configMapKeyRef:
                      name: route53-ddns-config
                      key: record_names
                - name: TTL
                  valueFrom:
                    configMapKeyRef:
                      name: route53-ddns-config
                      key: ttl
                      optional: true
                - name: IP_SERVICE_URL
                  valueFrom:
                    configMapKeyRef:
                      name: route53-ddns-config
                      key: ip_service_url
                      optional: true
                - name: IP_DNS_SOURCE
                  valueFrom:
                    configMapKeyRef:
                      name: route53-ddns-config
                      key: ip_dns_source
                      optional: true
                - name: IP_WAN1_DNS
                  valueFrom:
                    configMapKeyRef:
                      name: route53-ddns-config
                      key: ip_wan1_dns
                      optional: true
                - name: IP_WAN2_DNS
                  valueFrom:
                    configMapKeyRef:
                      name: route53-ddns-config
                      key: ip_wan2_dns
                      optional: true
                - name: PUSHGATEWAY_URL
                  value: "http://pushgateway.monitoring.svc.cluster.local:9091"
              envFrom:
                # Holds CF_API_TOKEN. Create from
                # cloudflare-credentials.sops.yaml.template per
                # docs/runbooks/route53-ddns-cf-migration.md, then
                # rename to cloudflare-credentials.sops.yaml + add to
                # kustomization.yaml. The old route53-ddns-credentials
                # secret (AWS access key) is dropped from kustomization
                # at the same time.
                - secretRef:
                    name: cloudflare-credentials
