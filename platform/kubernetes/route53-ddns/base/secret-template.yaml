# Template for route53-ddns AWS credentials secret
#
# Create the actual secret with:
#   kubectl create secret generic route53-ddns-credentials \
#     --namespace=route53-ddns \
#     --from-literal=AWS_ACCESS_KEY_ID=<your-key-id> \
#     --from-literal=AWS_SECRET_ACCESS_KEY=<your-secret-key>
#
# Or create a file route53-ddns/base/secret.yaml (gitignored):
---
apiVersion: v1
kind: Secret
metadata:
  name: route53-ddns-credentials
  namespace: route53-ddns
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "REPLACE_WITH_YOUR_ACCESS_KEY"
  AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_YOUR_SECRET_KEY"
