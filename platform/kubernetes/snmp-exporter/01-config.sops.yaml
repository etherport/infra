# snmp_exporter config. Regenerated structurally (parse -> mutate -> dump) rather
# than string-patched: two attempts at surgical edits landed at the wrong indent
# because the anchor matched as a SUBSTRING of a longer indent, silently corrupting
# the file. If you edit this, do it the same way.
#
# auths: ups_v1 = SNMPv1 for the two Smart-UPS cards (community set via SSH CLI
# 2026-08-19). pdu_v2 = the factory 'public' still on the PDUs.
#
# apc_ups_battery_replace_date is the "RBC end of life" date the front panel warns
# about. SNMP returns it as a STRING ("09/22/2026"), which PromQL cannot compare, so
# regex_extracts splits it into numeric _year and _month for the alert to do
# arithmetic on. apc_ups_output_active_power_watts exists only on the SRT 3000; the
# 1500 RM returns noSuchInstance and that series is simply absent.
