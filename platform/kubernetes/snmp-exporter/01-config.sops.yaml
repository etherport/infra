# snmp_exporter config. Edit STRUCTURALLY (parse -> mutate -> dump), never by string
# patch: two surgical attempts landed at the wrong indent because the anchor matched
# as a SUBSTRING of a longer indent, silently corrupting the file.
#
# auths: ups_v1 = SNMPv1 for the Smart-UPS cards; pdu_v2 = factory 'public' on the PDUs.
#
# apc_ups_battery_replace_date is the "RBC end of life" date the front panel warns about.
# It is emitted as an INFO METRIC with the date as a LABEL (value 1), like apc_ups_model.
# ⚠️ regex_extracts was tried to split it into numeric _year/_month for alerting and
# emitted NOTHING AT ALL on snmp_exporter v0.26 — not even the base metric. Do not
# re-add it without verifying the exporter actually emits the series; an alert built on
# a non-existent metric silently never fires (see PveFansPegged, which sat at an
# unreachable 12000 RPM threshold for months).
#
# apc_ups_output_active_power_watts exists only on the SRT 3000; the 1500 RM returns
# noSuchInstance and that series is simply absent.
