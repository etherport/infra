# snmp_exporter — multi-target SNMP scraper for the rack power hardware.
#
# Targets: 2x APC Smart-UPS management cards (SNMPv1) + 2x APC rack PDUs
# (SNMPv2c). Prometheus passes ?target=&module=&auth= per scrape, so ONE
# exporter serves all four devices — see monitoring/01-external-scrape-config.yaml.
#
# ⚠️ The monitoring tier's Cilium egress allows only ENUMERATED ports to `world`.
# SNMP is UDP/161 and was not among them, so scrapes were silently dropped until
# 14-tier-monitoring.yaml was updated alongside this.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snmp-exporter
  namespace: monitoring
  labels: {app: snmp-exporter}
spec:
  replicas: 1
  selector:
    matchLabels: {app: snmp-exporter}
  template:
    metadata:
      labels: {app: snmp-exporter}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: snmp-exporter
          # Pinned tag (no :latest) — Kyverno's disallow-latest-tag rejects otherwise.
          image: prom/snmp-exporter:v0.26.0
          args:
            - --config.file=/etc/snmp_exporter/snmp.yml
            - --web.listen-address=:9116
          ports:
            - {name: http, containerPort: 9116}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: "10m", memory: "32Mi"}
            limits: {cpu: "200m", memory: "128Mi"}
          livenessProbe:
            httpGet: {path: /healthy, port: http}
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: {path: /healthy, port: http}
            initialDelaySeconds: 5
          volumeMounts:
            - {name: config, mountPath: /etc/snmp_exporter, readOnly: true}
      volumes:
        - name: config
          secret: {secretName: snmp-exporter-config}
