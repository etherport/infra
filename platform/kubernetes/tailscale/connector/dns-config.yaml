# Tailscale DNS Configuration - Split Horizon
#
# Routes queries for etherport.net to on-prem Technitium DNS servers
# while using Tailscale's default DNS for everything else.
#
apiVersion: tailscale.com/v1alpha1
kind: DNSConfig
metadata:
  name: homelab-dns
  namespace: tailscale
spec:
  nameservers:
    # Split DNS for internal domain
    - forDomains:
        - etherport.net
      addresses:
        - 10.10.201.5   # K8s cluster VIP (primary)
        - 10.10.201.6   # Standalone VM (fallback)
