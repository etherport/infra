apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: technitium
  namespace: dns
spec:
  serviceName: technitium-headless
  # 2 replicas for DNS HA. A replica is now DISPOSABLE: a fresh PVC self-bootstraps
  # — DNS_SERVER_ADMIN_PASSWORD (from the technitium-admin secret) sets the admin
  # password on first run, and dns-sync (07-dns-sync.yaml) now CREATES the
  # wind.etherport.net zone if missing before syncing records. (Briefly pinned to
  # 1 on 2026-06-18 after technitium-1 was re-provisioned fresh post-wedge, until
  # that zone-create automation landed; see session-log.)
  replicas: 2
  # OrderedReady (not Parallel): image bumps / rolling updates then update ONE
  # replica at a time, keeping the other serving DNS — avoids the brief full-DNS
  # outage that Parallel caused on the 2026-06-02 technitium 15.2.0 bump. This
  # field is immutable, so changing it required an STS recreate with
  # `--cascade=orphan` (pods kept running, then re-adopted) — zero downtime.
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: technitium
  template:
    metadata:
      labels:
        app: technitium
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: technitium
              topologyKey: kubernetes.io/hostname
      containers:
        - name: technitium
          image: technitium/dns-server:15.2.0@sha256:23d3b63d959e997800b095fe93009b3fae271b5258234ff2ade8535cb33682c8 # {"$imagepolicy": "flux-system:technitium"}
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: http
              containerPort: 5380
              protocol: TCP
            - name: https
              containerPort: 53443
              protocol: TCP
            - name: dot
              containerPort: 853
              protocol: TCP
          envFrom:
            - configMapRef:
                name: technitium-config
          env:
            - name: DNS_SERVER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: technitium-admin
                  key: password
          volumeMounts:
            - name: data
              mountPath: /etc/dns
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 5380
            initialDelaySeconds: 30
            periodSeconds: 10
          # Readiness gates .5-rotation on LOCAL zone-presence (H40): a freshly
          # re-provisioned replica stays OUT of the technitium (.5) service until
          # dns-sync has created the wind.etherport.net zone on it, so it never
          # serves empty/wrong answers during the bootstrap window. `+norecurse`
          # so only a locally-authoritative zone counts (not an upstream-recursed
          # SOA). Liveness stays the plain HTTP check (below) so a zone-less server
          # is kept out of rotation but NOT restart-looped — dns-sync reaches it
          # via the headless svc (publishNotReadyAddresses) to bootstrap it.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "dig +norecurse +short +time=2 +tries=1 @127.0.0.1 wind.etherport.net SOA | grep -q ."
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 4
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd
        resources:
          # Stays at 5Gi here because (a) STS volumeClaimTemplate is
          # immutable post-create (Flux dry-run fails: "updates to
          # statefulset spec for fields other than ..."), and (b) the
          # live PVCs use the static-PV recovery pattern
          # (`staticVolume: "true"` in the PV's volumeAttributes),
          # which the ceph-csi external-resizer refuses to expand
          # (resizer panics with "invalid memory address" — confirmed
          # 2026-05-23).
          #
          # Size pressure is handled by 02b-set-log-retention-job
          # capping logs at 7 days. If a future need to expand
          # arises, the path is: (1) delete STS with --cascade=orphan;
          # (2) delete recovery PVs; (3) `rbd resize` the RBD images
          # on the Ceph cluster directly; (4) bump capacity in
          # 02a-static-pv-recovery.yaml; (5) re-apply.
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: technitium-headless
  namespace: dns
spec:
  clusterIP: None
  # Publish not-ready pods so dns-sync can reach a freshly re-provisioned replica
  # (held NotReady by the zone-presence readiness gate above) to bootstrap its
  # zone — without this the gate deadlocks (NotReady → no headless DNS → dns-sync
  # can't reach it → zone never created). The .5 LB service stays Ready-only, so
  # clients never hit a not-ready replica. (H40, 2026-06-19.)
  publishNotReadyAddresses: true
  selector:
    app: technitium
  ports:
    - name: dns-udp
      port: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      protocol: TCP
