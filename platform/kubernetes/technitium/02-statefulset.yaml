apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: technitium
  namespace: dns
spec:
  serviceName: technitium-headless
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: technitium
  template:
    metadata:
      labels:
        app: technitium
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: technitium
              topologyKey: kubernetes.io/hostname
      containers:
        - name: technitium
          image: technitium/dns-server:15.2.0 # {"$imagepolicy": "flux-system:technitium"}
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: http
              containerPort: 5380
              protocol: TCP
            - name: https
              containerPort: 53443
              protocol: TCP
            - name: dot
              containerPort: 853
              protocol: TCP
          envFrom:
            - configMapRef:
                name: technitium-config
          env:
            - name: DNS_SERVER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: technitium-admin
                  key: password
          volumeMounts:
            - name: data
              mountPath: /etc/dns
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 5380
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 5380
            initialDelaySeconds: 10
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd
        resources:
          # Bumped from 5Gi → 10Gi on 2026-05-23 after technitium-1 hit
          # 96.8% with ~30MB/day of unrotated query logs. STS
          # volumeClaimTemplates are immutable on existing instances,
          # so the live PVCs were also patched + the static-PV recovery
          # PV capacities raised to 10Gi in 02a-static-pv-recovery.yaml.
          # The 02b-set-log-retention-job sets maxLogFileDays=7 via the
          # Technitium API so day-to-day usage stays well under 10Gi.
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: technitium-headless
  namespace: dns
spec:
  clusterIP: None
  selector:
    app: technitium
  ports:
    - name: dns-udp
      port: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      protocol: TCP
