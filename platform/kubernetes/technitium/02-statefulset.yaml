apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: technitium
  namespace: dns
spec:
  serviceName: technitium-headless
  # 2 replicas for DNS HA. A replica is now DISPOSABLE: a fresh PVC self-bootstraps
  # — DNS_SERVER_ADMIN_PASSWORD (from the technitium-admin secret) sets the admin
  # password on first run, and dns-sync (07-dns-sync.yaml) now CREATES the
  # wind.etherport.net zone if missing before syncing records. (Briefly pinned to
  # 1 on 2026-06-18 after technitium-1 was re-provisioned fresh post-wedge, until
  # that zone-create automation landed; see session-log.)
  replicas: 2
  # OrderedReady (not Parallel): image bumps / rolling updates then update ONE
  # replica at a time, keeping the other serving DNS — avoids the brief full-DNS
  # outage that Parallel caused on the 2026-06-02 technitium 15.2.0 bump. This
  # field is immutable, so changing it required an STS recreate with
  # `--cascade=orphan` (pods kept running, then re-adopted) — zero downtime.
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: technitium
  template:
    metadata:
      labels:
        app: technitium
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: technitium
              topologyKey: kubernetes.io/hostname
      containers:
        - name: technitium
          image: technitium/dns-server:15.2.0 # {"$imagepolicy": "flux-system:technitium"}
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: http
              containerPort: 5380
              protocol: TCP
            - name: https
              containerPort: 53443
              protocol: TCP
            - name: dot
              containerPort: 853
              protocol: TCP
          envFrom:
            - configMapRef:
                name: technitium-config
          env:
            - name: DNS_SERVER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: technitium-admin
                  key: password
          volumeMounts:
            - name: data
              mountPath: /etc/dns
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 5380
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 5380
            initialDelaySeconds: 10
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd
        resources:
          # Stays at 5Gi here because (a) STS volumeClaimTemplate is
          # immutable post-create (Flux dry-run fails: "updates to
          # statefulset spec for fields other than ..."), and (b) the
          # live PVCs use the static-PV recovery pattern
          # (`staticVolume: "true"` in the PV's volumeAttributes),
          # which the ceph-csi external-resizer refuses to expand
          # (resizer panics with "invalid memory address" — confirmed
          # 2026-05-23).
          #
          # Size pressure is handled by 02b-set-log-retention-job
          # capping logs at 7 days. If a future need to expand
          # arises, the path is: (1) delete STS with --cascade=orphan;
          # (2) delete recovery PVs; (3) `rbd resize` the RBD images
          # on the Ceph cluster directly; (4) bump capacity in
          # 02a-static-pv-recovery.yaml; (5) re-apply.
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: technitium-headless
  namespace: dns
spec:
  clusterIP: None
  selector:
    app: technitium
  ports:
    - name: dns-udp
      port: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      protocol: TCP
