# Static PV recovery for Technitium pgdata-equivalent volumes.
#
# Both Technitium pods have a 5Gi PVC dynamically provisioned at first
# install. After the 2026-05-12 cluster rebuild, the underlying Ceph RBD
# images survived but the K8s PVs/PVCs were gone — they were
# hand-recreated as `data-technitium-{0,1}-recovery` PVs that pre-bind
# to the existing images via `staticVolume: "true"`. This file commits
# that pattern so a future rebuild can recover the same way without
# needing a manual `kubectl create -f` step.
#
# Capacity stays at 5Gi here (matches the live RBD image size).
# Attempted to bump to 10Gi on 2026-05-23 — failed because:
#   1. STS volumeClaimTemplate is immutable (Flux dry-run rejects).
#   2. ceph-csi external-resizer panics on staticVolume: "true" PVs.
# Real expansion path needs an `rbd resize` on the Ceph cluster
# directly + an STS recreate with --cascade=orphan. Until then,
# size pressure is handled by 02b-set-log-retention-job capping
# query logs at 7 days (technitium-1 was at 96.8% on this 5Gi PVC
# with 17 days of unrotated logs; 7-day retention brings it well
# under 50%).
#
# See docs/runbooks/disaster-recovery.md §2.3 for the static-PV pattern
# in general.
#
# If the Ceph RBD images are ever rotated, update the imageName +
# volumeHandle here AND on disk via `rbd image-meta list k8s-ceph/<img>`.

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: data-technitium-0-recovery
  annotations:
    pv.kubernetes.io/provisioned-by: rbd.csi.ceph.com
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    # K8s capacity field carries 10Gi to match live (kubectl patch set
    # this 2026-05-23 attempting expansion; PVC shrink is forbidden so
    # we keep the source aligned). The underlying Ceph RBD image is
    # still 5Gi — `rbd info k8s-ceph/<image>` would show the truth.
    # 02b-set-log-retention-job keeps actual usage well under 5Gi
    # so the mismatch is benign.
    storage: 10Gi
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: data-technitium-0
    namespace: dns
  csi:
    driver: rbd.csi.ceph.com
    fsType: ext4
    nodeStageSecretRef:
      name: csi-rbd-secret
      namespace: ceph-csi
    controllerExpandSecretRef:
      name: csi-rbd-secret
      namespace: ceph-csi
    volumeAttributes:
      clusterID: 4de37616-ef82-4295-8ff0-7309d4b34812
      imageFeatures: layering
      imageName: csi-vol-7253f2ce-cfe3-433d-9daa-78ab5bc2fe36
      journalPool: k8s-ceph
      pool: k8s-ceph
      staticVolume: "true"
    volumeHandle: csi-vol-7253f2ce-cfe3-433d-9daa-78ab5bc2fe36
  mountOptions:
    - discard
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ceph-rbd
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: data-technitium-1-recovery
  annotations:
    pv.kubernetes.io/provisioned-by: rbd.csi.ceph.com
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    # K8s capacity field carries 10Gi to match live (kubectl patch set
    # this 2026-05-23 attempting expansion; PVC shrink is forbidden so
    # we keep the source aligned). The underlying Ceph RBD image is
    # still 5Gi — `rbd info k8s-ceph/<image>` would show the truth.
    # 02b-set-log-retention-job keeps actual usage well under 5Gi
    # so the mismatch is benign.
    storage: 10Gi
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: data-technitium-1
    namespace: dns
  csi:
    driver: rbd.csi.ceph.com
    fsType: ext4
    nodeStageSecretRef:
      name: csi-rbd-secret
      namespace: ceph-csi
    controllerExpandSecretRef:
      name: csi-rbd-secret
      namespace: ceph-csi
    volumeAttributes:
      clusterID: 4de37616-ef82-4295-8ff0-7309d4b34812
      imageFeatures: layering
      imageName: csi-vol-ba25c344-cf5c-4bf7-a0e3-f2036a7947ca
      journalPool: k8s-ceph
      pool: k8s-ceph
      staticVolume: "true"
    volumeHandle: csi-vol-ba25c344-cf5c-4bf7-a0e3-f2036a7947ca
  mountOptions:
    - discard
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ceph-rbd
  volumeMode: Filesystem
