# Idempotent CronJob that ensures Technitium's log/stat retention is set.
#
# Technitium has no env-var for maxLogFileDays — the only way to set it
# is via the admin web API after login. Without this, logs and stats
# accumulate forever (the 2026-05-23 incident: technitium-1's PVC hit
# 96.8% with 16 days of unrotated query logs in 4.2GB).
#
# Runs weekly at 03:00 PT. Per-fire it logs in, reads the current
# settings, and PATCHes them only if they differ from what's declared
# here. Idempotent: a second run within the same week is a no-op.
#
# Target settings:
#   maxLogFileDays  = 7     (query logs; ~30MB/day on busy node)
#   maxStatFileDays = 90    (small JSON files, cheap to keep)
#
# Companion files: 02a-static-pv-recovery.yaml (PV capacity 10Gi),
# 02-statefulset.yaml (volumeClaimTemplate 10Gi).

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: technitium-set-log-retention
  namespace: dns
spec:
  schedule: "0 10 * * 1"  # Mondays 03:00 PT (10:00 UTC)
  timeZone: "America/Los_Angeles"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: configure
              image: python:3.14-slim # {"$imagepolicy": "flux-system:python-slim"}
              command: ["python3", "/work/configure-retention.py"]
              env:
                # Comma-separated per-pod URLs — Technitium cluster mode
                # doesn't sync settings between replicas (verified
                # 2026-05-23), so we must hit each pod separately.
                - name: TECHNITIUM_URLS
                  value: "http://technitium-0.technitium-headless.dns.svc.cluster.local:5380,http://technitium-1.technitium-headless.dns.svc.cluster.local:5380"
                - name: ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: technitium-admin
                      key: username
                - name: ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: technitium-admin
                      key: password
                - name: MAX_LOG_FILE_DAYS
                  value: "7"
                - name: MAX_STAT_FILE_DAYS
                  value: "90"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 96Mi
              volumeMounts:
                - name: script
                  mountPath: /work
          volumes:
            - name: script
              configMap:
                name: technitium-retention-script
                defaultMode: 0755
