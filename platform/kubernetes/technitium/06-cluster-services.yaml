# Per-pod services for Technitium clustering
# These provide stable IPs for each pod that survive restarts
#
# technitium-0: 10.10.201.71 (cluster primary)
# technitium-1: 10.10.201.72 (cluster secondary)
---
apiVersion: v1
kind: Service
metadata:
  name: technitium-0
  namespace: dns
spec:
  type: LoadBalancer
  loadBalancerIP: 10.10.201.71
  selector:
    app: technitium
    statefulset.kubernetes.io/pod-name: technitium-0
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
    - name: http
      port: 5380
      targetPort: 5380
      protocol: TCP
    - name: https
      port: 53443
      targetPort: 53443
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: technitium-1
  namespace: dns
spec:
  type: LoadBalancer
  loadBalancerIP: 10.10.201.72
  selector:
    app: technitium
    statefulset.kubernetes.io/pod-name: technitium-1
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
    - name: http
      port: 5380
      targetPort: 5380
      protocol: TCP
    - name: https
      port: 53443
      targetPort: 53443
      protocol: TCP
