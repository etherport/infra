apiVersion: v1
kind: ConfigMap
metadata:
  name: dns-sync-script
  namespace: dns
data:
  sync.py: |
    #!/usr/bin/env python3
    """Sync DNS records from YAML to Technitium. Idempotent."""
    import json
    import os
    import sys
    import yaml
    from urllib.parse import urlencode
    from urllib.request import Request, urlopen

    def api_request(base_url, endpoint, token=None, params=None):
        params = params or {}
        if token:
            params["token"] = token
        url = f"{base_url}/api/{endpoint}?{urlencode(params)}"
        with urlopen(Request(url), timeout=30) as resp:
            data = json.loads(resp.read().decode())
            if data.get("status") != "ok":
                raise Exception(data.get("errorMessage", "API error"))
            return data

    def get_record_value(rec):
        rdata = rec.get("rData", {})
        t = rec.get("type", "")
        if t in ("A", "AAAA"):
            return rdata.get("ipAddress", "")
        elif t == "CNAME":
            return rdata.get("cname", "")
        elif t == "MX":
            return f"{rdata.get('preference', '')} {rdata.get('exchange', '')}"
        elif t == "TXT":
            return rdata.get("text", "")
        return ""

    # Drift-deletion safety knobs (consumed in sync_to_server below).
    DELETE_DRIFT = os.environ.get("DELETE_DRIFT", "false").lower() == "true"
    DRY_RUN_DELETE = os.environ.get("DRY_RUN_DELETE", "true").lower() == "true"
    MAX_DRIFT_DELETE = int(os.environ.get("MAX_DRIFT_DELETE", "10"))

    def sync_to_server(base_url, user, password, zone, default_ttl, desired):
        """Sync records to a single Technitium server."""
        # Auth: try the configured user, then fall back to the built-in "admin".
        # A FRESHLY-PROVISIONED replica has only the "admin" account (its password
        # is set on first run from DNS_SERVER_ADMIN_PASSWORD = the same secret this
        # uses), NOT the custom "graham" user that exists on the long-lived servers.
        # Falling back to admin lets a fresh replica be bootstrapped end-to-end
        # (zone-create + records below) with no manual user setup — the last piece
        # of making a Technitium replica disposable. (2026-06-18; see session-log.)
        token = None
        _autherr = None
        for _u in (user, "admin"):
            try:
                token = api_request(base_url, "user/login",
                                    params={"user": _u, "pass": password})["token"]
                print(f"✓ Authenticated to {base_url} as {_u}")
                break
            except Exception as e:
                _autherr = e
        if not token:
            print(f"✗ Failed to authenticate to {base_url} (tried {user}, admin): {_autherr}")
            return 0

        # Ensure the zone exists before syncing records. A freshly-provisioned /
        # rebuilt replica has NO zones, and the record-sync below only ADDS
        # records — it never creates the zone — so without this a fresh server
        # serves empty answers and can't be populated. Create it as Primary if
        # missing (idempotent: skip when already present). This is what makes a
        # Technitium replica disposable: blow away the PVC, the StatefulSet +
        # DNS_SERVER_ADMIN_PASSWORD + this zone-create + the record-sync rebuild
        # it from code. (2026-06-18; see session-log.)
        try:
            zlist = api_request(base_url, "zones/list", token)
            have = any(z.get("name") == zone
                       for z in zlist.get("response", {}).get("zones", []))
            if not have:
                api_request(base_url, "zones/create", token,
                            {"zone": zone, "type": "Primary"})
                print(f"  + created missing Primary zone {zone}")
        except Exception as e:
            print(f"  ⚠ zone ensure failed on {base_url}: {e}")

        # Get current records
        try:
            current_data = api_request(base_url, "zones/records/get", token, {
                "domain": zone, "zone": zone, "listZone": "true"
            })
        except Exception as e:
            print(f"✗ Failed to get records from {base_url}: {e}")
            return 0

        current = {
            (r["name"], r["type"]): get_record_value(r)
            for r in current_data.get("response", {}).get("records", [])
            if r["type"] not in ("SOA", "NS")
        }

        # Sync records
        added, updated, unchanged, failed = 0, 0, 0, 0
        for rec in desired:
            name = rec["name"]
            domain = zone if name == "@" else f"{name}.{zone}" if not name.endswith(f".{zone}") else name

            params = {
                "zone": zone,
                "domain": domain,
                "type": rec["type"],
                "ttl": rec.get("ttl", default_ttl),
                "overwrite": "true",
                "comments": rec.get("comment", "Managed by GitOps")
            }

            if rec["type"] in ("A", "AAAA"):
                params["ipAddress"] = rec["value"]
            elif rec["type"] == "CNAME":
                params["cname"] = rec["value"]
            elif rec["type"] == "MX":
                parts = rec["value"].split()
                params["preference"] = parts[0] if len(parts) > 1 else "10"
                params["exchange"] = parts[-1]
            elif rec["type"] == "TXT":
                params["text"] = rec["value"]

            key = (domain, rec["type"])
            current_val = current.get(key, "")

            try:
                if current_val == rec["value"]:
                    unchanged += 1
                elif key in current:
                    api_request(base_url, "zones/records/add", token, params)
                    updated += 1
                else:
                    api_request(base_url, "zones/records/add", token, params)
                    added += 1
            except Exception as e:
                # Don't let one bad record block the other 30+. Common case:
                # type change (e.g. A → CNAME) where Technitium rejects the
                # new type because the old record still exists. The
                # individual failure is logged; total is reported at the end.
                print(f"  ⚠ {rec.get('name','?')} {rec['type']}: {e}")
                failed += 1

        # =========================================================================
        # Drift deletion (optional, defense-in-depth).
        # When DELETE_DRIFT=true, remove records present on the server but
        # absent from the zone file. This catches:
        #   - UI-added records that someone forgot to commit
        #   - Stale records (e.g. wan1/wan2 frozen at old IPs because
        #     the DDNS Lambda updates Route53 but never Technitium)
        # Safety:
        #   - DRY_RUN_DELETE=true: log "would delete" but DON'T actually delete
        #   - MAX_DRIFT_DELETE caps the number deleted in one run (default 10)
        #   - SOA/NS are already excluded from `current` set above
        # =========================================================================
        deleted = 0
        if DELETE_DRIFT:
            desired_keys = set()
            for rec in desired:
                name = rec["name"]
                fqdn = zone if name == "@" else (
                    f"{name}.{zone}" if not name.endswith(f".{zone}") else name
                )
                desired_keys.add((fqdn, rec["type"]))

            drift = [(name, rtype, value) for (name, rtype), value in current.items()
                     if (name, rtype) not in desired_keys]

            if len(drift) > MAX_DRIFT_DELETE:
                print(f"  ⚠ refusing to delete {len(drift)} drift records "
                      f"(exceeds safety cap MAX_DRIFT_DELETE={MAX_DRIFT_DELETE}). "
                      f"Review or raise the cap.")
                for name, rtype, value in drift[:MAX_DRIFT_DELETE]:
                    print(f"    [skipped] {name} {rtype} → {value}")
            elif drift and DRY_RUN_DELETE:
                print(f"  [DRY-RUN] would delete {len(drift)} drift record(s):")
                for name, rtype, value in drift:
                    print(f"    - {name} {rtype} → {value}")
            elif drift:
                for name, rtype, value in drift:
                    try:
                        api_request(base_url, "zones/records/delete", token, {
                            "domain": name, "zone": zone, "type": rtype,
                            **({"ipAddress": value} if rtype in ("A", "AAAA") else {}),
                            **({"cname": value} if rtype == "CNAME" else {}),
                            **({"text": value} if rtype == "TXT" else {}),
                        })
                        print(f"  - deleted {name} {rtype} → {value}")
                        deleted += 1
                    except Exception as e:
                        print(f"  ⚠ delete failed for {name} {rtype}: {e}")
                        failed += 1

        print(f"  → {added} added, {updated} updated, "
              f"{unchanged} unchanged, {deleted} deleted, {failed} failed")
        return added + updated + deleted

    def main():
        # Get all server URLs to sync to
        primary_url = os.environ["TECHNITIUM_URL"]
        secondary_urls = os.environ.get("SECONDARY_URLS", "").split(",")
        secondary_urls = [u.strip() for u in secondary_urls if u.strip()]
        all_urls = [primary_url] + secondary_urls

        user = os.environ["TECHNITIUM_USER"]
        password = os.environ["TECHNITIUM_PASS"]
        zone_file = os.environ.get("ZONE_FILE", "/zones/zone.yaml")

        # Load zone file
        with open(zone_file) as f:
            zone_data = yaml.safe_load(f)

        zone = zone_data["zone"]
        default_ttl = zone_data.get("ttl", 3600)
        desired = zone_data.get("records", [])
        print(f"✓ Loaded {len(desired)} desired records for {zone}")

        # Sync to ALL Technitium servers directly
        total_changes = 0
        for url in all_urls:
            print(f"\n--- Syncing to {url} ---")
            changes = sync_to_server(url, user, password, zone, default_ttl, desired)
            total_changes += changes

        print(f"\n✅ Sync complete to {len(all_urls)} servers, {total_changes} total changes")
        return total_changes

    if __name__ == "__main__":
        main()
  watcher.py: |
    #!/usr/bin/env python3
    """Watch ConfigMap for changes and trigger sync."""
    import hashlib
    import os
    import subprocess
    import sys
    import time

    ZONE_FILE = os.environ.get("ZONE_FILE", "/zones/zone.yaml")
    CHECK_INTERVAL = int(os.environ.get("CHECK_INTERVAL", "5"))  # seconds
    # Periodic full re-sync — catches new replicas, drift, and push failures
    # that no longer trigger via file-hash change. 0 disables.
    FULL_SYNC_INTERVAL = int(os.environ.get("FULL_SYNC_INTERVAL", "3600"))  # seconds

    def get_file_hash(path):
        """Get MD5 hash of file contents."""
        try:
            with open(path, "rb") as f:
                return hashlib.md5(f.read()).hexdigest()
        except FileNotFoundError:
            return None

    def run_sync():
        """Run the sync script."""
        print(f"\n{'='*60}")
        print(f"[{time.strftime('%Y-%m-%d %H:%M:%S')}] Change detected, syncing...")
        print('='*60)
        result = subprocess.run(
            ["python", "/scripts/sync.py"],
            capture_output=False
        )
        return result.returncode == 0

    def main():
        print(f"DNS GitOps Watcher starting...")
        print(f"Watching: {ZONE_FILE}")
        print(f"Check interval: {CHECK_INTERVAL}s")
        print(f"Full re-sync interval: {FULL_SYNC_INTERVAL}s "
              f"({'disabled' if FULL_SYNC_INTERVAL == 0 else 'enabled'})")

        # Initial sync on startup
        print("\n[Startup] Running initial sync...")
        last_hash = get_file_hash(ZONE_FILE)
        last_full_sync = time.time()
        if last_hash:
            run_sync()
        else:
            print(f"Warning: Zone file not found at {ZONE_FILE}")

        # Watch loop
        while True:
            time.sleep(CHECK_INTERVAL)
            current_hash = get_file_hash(ZONE_FILE)
            now = time.time()

            # File changed → sync
            if current_hash and current_hash != last_hash:
                if run_sync():
                    last_hash = current_hash
                    last_full_sync = now
                else:
                    print("Sync failed, will retry on next check")
            # Periodic full re-sync (safety net for new replicas / drift /
            # silent push failures that no longer trigger via hash change)
            elif (FULL_SYNC_INTERVAL > 0
                  and current_hash
                  and now - last_full_sync >= FULL_SYNC_INTERVAL):
                print(f"\n[Periodic] {FULL_SYNC_INTERVAL}s elapsed since last "
                      f"sync — forcing full re-sync to all targets...")
                if run_sync():
                    last_full_sync = now
                else:
                    print("Periodic sync failed, will retry on next interval")
            elif current_hash is None:
                print(f"Warning: Zone file not found at {ZONE_FILE}")

    if __name__ == "__main__":
        main()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-sync-watcher
  namespace: dns
  labels:
    app: dns-sync-watcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dns-sync-watcher
  template:
    metadata:
      labels:
        app: dns-sync-watcher
    spec:
      containers:
        - name: watcher
          image: python:3.14-alpine@sha256:26730869004e2b9c4b9ad09cab8625e81d256d1ce97e72df5520e806b1709f92 # {"$imagepolicy": "flux-system:python-alpine"}
          command:
            - sh
            - -c
            - |
              pip install -q pyyaml
              python /scripts/watcher.py
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: TECHNITIUM_URL
              value: "http://technitium-0.technitium-headless.dns.svc.cluster.local:5380"
            - name: SECONDARY_URLS
              # M110 (2026-07-02): .10 = the consolidated edge box (DNS folded on). .5 stays
              # in the list only until the standalone dns-aws box is destroyed — remove it then.
              value: "http://technitium-1.technitium-headless.dns.svc.cluster.local:5380,http://10.10.201.6:5380,http://10.10.100.5:5380,http://10.10.100.10:5380"
            - name: TECHNITIUM_USER
              valueFrom:
                secretKeyRef:
                  name: technitium-admin
                  key: username
            - name: TECHNITIUM_PASS
              valueFrom:
                secretKeyRef:
                  name: technitium-admin
                  key: password
            - name: ZONE_FILE
              value: "/zones/zone.yaml"
            - name: CHECK_INTERVAL
              value: "5"
            - name: FULL_SYNC_INTERVAL
              value: "3600" # 1h periodic full re-sync (safety net)
            # Drift deletion — start DRY-RUN until reviewed, then flip.
            # See sync.py for the safety model.
            - name: DELETE_DRIFT
              value: "true"
            - name: DRY_RUN_DELETE
              value: "false" # set to "true" to log-only without deleting
            - name: MAX_DRIFT_DELETE
              value: "10"
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: zone-data
              mountPath: /zones
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      volumes:
        - name: script
          configMap:
            name: dns-sync-script
        - name: zone-data
          configMap:
            name: dns-zone-wind
