# DNS Zone: wind.etherport.net
# Managed via GitOps - changes here are synced to Technitium DNS
#
# Record types supported: A, AAAA, CNAME, MX, TXT, SRV, CAA
# SOA and NS records are auto-managed by Technitium and should not be defined here
#
zone: wind.etherport.net
ttl: 3600  # Default TTL (1 hour)

records:
  # =============================================================================
  # Infrastructure - Core Services
  # =============================================================================

  # Kubernetes Cluster — must match `infra/ansible/inventory/wind/inventory.ini`.
  # Historical drift (pre-2026-05-17): zone had k8s-w1=.51, k8s-w2=.52, k8s-w3=.53;
  # actual cluster is .53/.54/.55. The archived K8S-W3 deployment plan changed
  # worker IPs but the zone was never updated. Fixed below.
  - name: k8s-cp1
    type: A
    value: 10.10.201.50
    comment: Kubernetes control plane 1

  - name: k8s-cp2
    type: A
    value: 10.10.201.51
    comment: Kubernetes control plane 2

  - name: k8s-cp3
    type: A
    value: 10.10.201.52
    comment: Kubernetes control plane 3

  - name: k8s-w1
    type: A
    value: 10.10.201.53
    comment: Kubernetes worker 1

  - name: k8s-w2
    type: A
    value: 10.10.201.54
    comment: Kubernetes worker 2

  - name: k8s-w3
    type: A
    value: 10.10.201.55
    comment: Kubernetes worker 3

  - name: k8s-w4
    type: A
    value: 10.10.201.56
    comment: Kubernetes worker 4

  - name: k8s-gpu1
    type: A
    value: 10.10.201.60
    comment: Kubernetes GPU worker

  - name: gh-runner
    type: A
    value: 10.10.201.30
    comment: GitHub Actions self-hosted runner

  # Traefik Ingress (LoadBalancer VIP)
  - name: traefik
    type: A
    value: 10.10.201.70
    comment: Traefik ingress controller VIP

  # =============================================================================
  # Infrastructure - DNS
  # =============================================================================

  - name: dns
    type: A
    value: 10.10.201.70
    comment: Technitium DNS web UI (via Traefik)

  - name: dns-fallback
    type: A
    value: 10.10.201.6
    comment: Technitium DNS fallback VM (local)

  - name: dns-aws
    type: A
    value: 10.10.100.5
    comment: Technitium DNS on AWS (remote failover)

  # =============================================================================
  # Infrastructure - WAN DDNS
  # =============================================================================
  # wan1 and wan2 records are NOT defined here - they are dynamic and managed
  # by Route53 via the DDNS Lambda. Technitium forwards these queries upstream.
  # See: infra/terraform/aws/ddns-lambda/ and docs/setup/network/ubiquiti-ddns.md

  # =============================================================================
  # Infrastructure - Network Equipment
  # =============================================================================

  # UDM Pro Max gateway. Canonical name is `gw` (production convention).
  # `windroute` kept as A (not CNAME → gw) to avoid a CNAME-conflicts-
  # with-existing-A error in dns-sync-watcher when transitioning. `udm`
  # is a fresh CNAME (no prior record to conflict with).
  - name: gw
    type: A
    value: 10.10.200.1
    comment: UDM Pro Max gateway (canonical)

  - name: windroute
    type: A
    value: 10.10.200.1
    comment: Legacy name for gw (pre-wildcard naming)

  - name: udm
    type: CNAME
    value: gw.wind.etherport.net
    comment: Device-class alias for the UniFi UDM

  - name: pve
    type: A
    value: 10.10.200.41
    comment: Proxmox VE hypervisor

  - name: sequoia
    type: A
    value: 10.10.209.10
    comment: Sequoia NAS/storage

  - name: devbox
    type: A
    value: 10.10.201.45
    comment: Dev VM (Claude Code sessions + kubectl); ansible playbooks/devbox.yml

  # =============================================================================
  # Infrastructure - VPN
  # =============================================================================

  - name: vpn-local
    type: A
    value: 10.10.201.15
    comment: WireGuard VPN local endpoint

  - name: vpn-aws
    type: A
    value: 10.10.100.10
    comment: WireGuard VPN AWS endpoint

  # =============================================================================
  # Applications - Via Traefik Ingress
  # =============================================================================

  - name: grafana
    type: A
    value: 10.10.201.70
    comment: Grafana monitoring (via Traefik)

  - name: ha
    type: A
    value: 10.10.201.70
    comment: Home Assistant (via Traefik)

  - name: plex
    type: A
    value: 10.10.201.70
    comment: Plex media server (via Traefik)

  - name: ollama
    type: A
    value: 10.10.201.70
    comment: Ollama LLM API (via Traefik)

  - name: chat
    type: A
    value: 10.10.201.70
    comment: Open WebUI chat interface (via Traefik)

  - name: prox
    type: A
    value: 10.10.201.70
    comment: Proxmox UI proxy (via Traefik)

  - name: wiki
    type: A
    value: 10.10.201.70
    comment: Wiki.js (via Traefik)

  # =============================================================================
  # Infrastructure - Power Management (via Traefik)
  # =============================================================================

  - name: ups1
    type: A
    value: 10.10.201.70
    comment: UPS 1 web UI (via Traefik to 10.10.200.10)

  - name: ups2
    type: A
    value: 10.10.201.70
    comment: UPS 2 web UI (via Traefik to 10.10.200.11)

  - name: pdu1
    type: A
    value: 10.10.201.70
    comment: PDU 1 web UI (via Traefik to 10.10.200.15)

  - name: pdu2
    type: A
    value: 10.10.201.70
    comment: PDU 2 web UI (via Traefik to 10.10.200.16)

  - name: prox-ipmi
    type: A
    value: 10.10.201.70
    comment: Proxmox IPMI/BMC (via Traefik for valid SSL)

  - name: prox-ipmi-direct
    type: A
    value: 10.10.200.21
    comment: Proxmox IPMI/BMC (direct fallback when k8s is down)

  - name: approve
    type: A
    value: 10.10.201.70
    comment: AI advisor approval URL (Traefik fallback for the CF Tunnel path at approve.etherport.net)

  # =============================================================================
  # Devices - Direct Access
  # =============================================================================

  - name: protect
    type: A
    value: 10.10.212.10
    comment: UniFi Protect NVR

  - name: print
    type: A
    value: 10.10.202.20
    comment: Raspberry Pi print server (Pi, currently powered off)

  - name: canon
    type: A
    value: 10.10.202.50
    comment: Canon MF743C network printer

  - name: gdisplay
    type: A
    value: 10.10.202.45
    comment: Graham's display/workstation

  - name: mac-workroom
    type: A
    value: 10.10.202.101
    comment: Workroom Mac Mini

  - name: mac-graham
    type: A
    value: 10.10.202.110
    comment: Graham's MacBook Pro (WiFi)

  - name: hue1
    type: A
    value: 10.10.204.51
    comment: Philips Hue bridge 1 (Cabin)

  - name: hue2
    type: A
    value: 10.10.204.52
    comment: Philips Hue bridge 2 (Cabin)
