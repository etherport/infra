apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Production Let's Encrypt server
    server: https://acme-v02.api.letsencrypt.org/directory
    email: dervish_guess_0n@icloud.com
    # Short-lived certificates (6 days) - no OCSP/CRL checks needed
    # Requires cert-manager v1.18.0+ and Let's Encrypt ACME profile support
    profile: shortlived
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      # Migrated 2026-05-27 from Route53 → Cloudflare. The etherport.net
      # Route53 hosted zone was deleted as part of the CF migration;
      # DNS-01 challenges via Route53 fail with NoSuchHostedZone.
      # Pre-cutover this file used route53 solver — git blame for the
      # legacy spec if needed. Secret `cloudflare-credentials` lives in
      # cert-manager namespace; see ../cloudflare-credentials.sops.yaml.
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-credentials
              key: api-token
        # Note: cert-manager uses --dns01-recursive-nameservers=8.8.8.8:53,1.1.1.1:53
        # (configured in Helm values) for public DNS propagation checks
