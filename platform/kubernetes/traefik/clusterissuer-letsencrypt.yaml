apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Production Let's Encrypt server
    server: https://acme-v02.api.letsencrypt.org/directory
    email: dervish_guess_0n@icloud.com
    # Short-lived certificates (6 days) - no OCSP/CRL checks needed
    # Requires cert-manager v1.18.0+ and Let's Encrypt ACME profile support
    profile: shortlived
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          route53:
            region: us-west-2
            hostedZoneID: Z03500581XDWV5SKF5PK8
            accessKeyIDSecretRef:
              name: route53-credentials
              key: AWS_ACCESS_KEY_ID
            secretAccessKeySecretRef:
              name: route53-credentials
              key: AWS_SECRET_ACCESS_KEY
        # Note: cert-manager uses --dns01-recursive-nameservers=8.8.8.8:53,1.1.1.1:53
        # (configured in Helm values) for public DNS propagation checks
