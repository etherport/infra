apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: traefik

resources:
  # route53-credentials.sops.yaml removed 2026-05-27 — was the AWS
  # access key for the cert-manager DNS-01 Route53 solver; both
  # ClusterIssuers now use Cloudflare via
  # platform/kubernetes/cert-manager-issuer/cloudflare-credentials.sops.yaml.
  - ingressroute-infrastructure.yaml
  - ingressroute-proxmox.yaml
  # cert-manager integration for OCSP stapling
  - clusterissuer-letsencrypt.yaml
  - clusterissuer-letsencrypt-classic.yaml  # for legacy compatibility (UniFi OS needs CN + RSA)
  - certificate-wildcard.yaml
  - certificate-wildcard-rsa.yaml            # RSA + classic profile for unifi-cert-sync
  - tlsstore-default.yaml
  # Default middlewares wired to entrypoints via the HelmRelease
  # (see clusters/wind/helm-releases/traefik.yaml additionalArguments)
  - middlewares/secure-headers.yaml
