apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: traefik-ceph-pvc
  namespace: traefik
  annotations:
    # Bound to static PV traefik-ceph-pvc-recovery (original RBD image —
    # contains acme.json with active Let's Encrypt cert state).
    # See docs/planning/long-term-stability-review-2026-05-12.md.
    kustomize.toolkit.fluxcd.io/reconcile: disabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: ceph-rbd