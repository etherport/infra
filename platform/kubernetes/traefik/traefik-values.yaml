ports:
  web:
    # New syntax since chart v34+
    redirections:
      entryPoint:
        to: websecure
        scheme: https
        permanent: true
  websecure:
    tls:
      enabled: true
    # HTTP/3 (QUIC) - faster connection establishment, 0-RTT on repeat visits
    http3:
      enabled: true

service:
  enabled: true
  type: LoadBalancer
  # LB-VLAN migration (M59): dual-homed 201.70 + 215.70 during the DNS cutover;
  # drop 201.70 after the wind.etherport.net A-records (TTL 3600) age out.
  # NOTE: reference-only — operative values are inline in
  # clusters/wind/helm-releases/traefik.yaml.
  annotations:
    metallb.universe.tf/loadBalancerIPs: 10.10.201.70,10.10.215.70
  labels: {}
  spec: {}

ingressClass:
  enabled: true
  isDefaultClass: true

# TLS certificates managed by cert-manager (not Traefik's built-in ACME)
# Certificate: wildcard-wind-etherport-net-tls (in traefik namespace)
# TLSStore: default (references the cert-manager certificate)
additionalArguments:
  # Enable OCSP stapling (when certificates support it)
  # Note: Let's Encrypt discontinued OCSP in Aug 2025, so this has no effect
  # for LE certs. Kept enabled for potential future use with other CAs.
  - "--ocsp=true"

# AWS env vars no longer needed - cert-manager handles Route53 DNS challenge
env: []

persistence:
  enabled: true
  existingClaim: traefik-ceph-pvc
  path: /data

ingressRoute:
  dashboard:
    enabled: true
    entryPoints:
      - websecure
    # Restrict to a hostname on your domain
    matchRule: "Host(`traefik.wind.etherport.net`)"
    # TODO later: add middlewares here for auth
