apiVersion: v1
kind: ConfigMap
metadata:
  name: unas-health-script
  namespace: backups
data:
  # UNAS host public key (public — safe in git). Pins StrictHostKeyChecking=yes
  # so the health-check SSH can't be silently MITM'd. Regenerate after a UNAS
  # factory-reset / host-key change with:
  #   ssh-keyscan -t ed25519 10.10.209.10
  known_hosts: |
    10.10.209.10 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPlSisPD07yBZCKjNPb8pIKMq04CSaVDw8b1eH5aPols

  # Read-only md (software-RAID) health probe for the UNAS. SSHes in with the
  # same unifi-backup-ssh key (already authorized on the UNAS), reads
  # /proc/mdstat, and pushes per-array degraded/active/total gauges to
  # Pushgateway for the unas-health PrometheusRule. Built 2026-06-19 after the
  # nvme0 SSD-cache APST controller-hang incident: the md array ran DEGRADED for
  # hours with no alert (the UI even showed both drives "healthy"); this closes
  # that gap. See docs/runbooks/unas-nvme-cache-apst-hang.md.
  check.sh: |
    #!/usr/bin/env bash
    set -uo pipefail

    # alpine/k8s may not ship openssh-client; install if missing (cheap, cached).
    if ! command -v ssh >/dev/null 2>&1; then
      apk add --no-cache openssh-client >/dev/null 2>&1 || true
    fi

    PUSHGATEWAY="${PUSHGATEWAY_URL:-http://pushgateway.monitoring.svc.cluster.local:9091}"
    JOB="unas_health"
    HOST="${UNAS_SSH_TARGET:-root@10.10.209.10}"

    log() { echo "[$(date -Iseconds)] $*"; }

    mkdir -p /tmp/.ssh
    cp /ssh/id_ed25519 /tmp/.ssh/id_ed25519
    cp /config/known_hosts /tmp/.ssh/known_hosts
    chmod 700 /tmp/.ssh
    chmod 600 /tmp/.ssh/id_ed25519 /tmp/.ssh/known_hosts
    SSH_OPTS=(-i /tmp/.ssh/id_ed25519
              -o UserKnownHostsFile=/tmp/.ssh/known_hosts
              -o StrictHostKeyChecking=yes
              -o ConnectTimeout=15
              -o BatchMode=yes)

    # 0 = ssh+read ok, 1 = couldn't reach the NAS / read mdstat.
    check_status=0
    mdstat="$(ssh "${SSH_OPTS[@]}" "$HOST" 'cat /proc/mdstat' 2>/dev/null)" || check_status=1
    [[ -z "$mdstat" ]] && check_status=1

    metrics="$(mktemp)"
    {
      echo "# TYPE unas_md_health_last_run_timestamp gauge"
      echo "unas_md_health_last_run_timestamp $(date +%s)"
      echo "# TYPE unas_md_health_check_status gauge"
      echo "unas_md_health_check_status ${check_status}"
    } > "$metrics"

    if [[ $check_status -eq 0 ]]; then
      # /proc/mdstat is two lines per array:
      #   md4 : active raid1 nvme0n1p2[2] nvme1n1p2[1]
      #         976101376 blocks super 1.2 [2/1] [_U]
      # The [total/active] token is the redundancy state: active<total =>
      # degraded (a member failed/dropped OR the array is rebuilding).
      echo "$mdstat" | awk '
        /^md[0-9]+ :/ { dev=$1; next }
        dev && match($0, /\[[0-9]+\/[0-9]+\]/) {
          s=substr($0, RSTART+1, RLENGTH-2); split(s, a, "/");
          total=a[1]; active=a[2];
          t[dev]=total; ac[dev]=active; deg[dev]=(active<total)?1:0; seen[dev]=1;
          dev="";
        }
        END {
          print "# TYPE unas_md_disks_total gauge";
          for (d in seen) print "unas_md_disks_total{array=\"" d "\"} " t[d];
          print "# TYPE unas_md_disks_active gauge";
          for (d in seen) print "unas_md_disks_active{array=\"" d "\"} " ac[d];
          print "# TYPE unas_md_array_degraded gauge";
          for (d in seen) print "unas_md_array_degraded{array=\"" d "\"} " deg[d];
        }
      ' >> "$metrics"
      log "mdstat:"; echo "$mdstat" | grep -E '^(md[0-9]| .*blocks)' | sed 's/^/  /'
    else
      log "FAILED to ssh/read mdstat from ${HOST} (NAS down or SSH disabled)"
    fi

    if curl --max-time 5 --data-binary @"$metrics" "${PUSHGATEWAY}/metrics/job/${JOB}" 2>/dev/null; then
      log "pushed metrics to ${PUSHGATEWAY}/metrics/job/${JOB}"
    else
      log "warning: pushgateway push failed (non-fatal)"
    fi
    rm -f "$metrics"

    # Exit non-zero only if we couldn't reach the NAS, so a genuinely degraded
    # array does NOT mark the Job Failed (the PrometheusRule handles degrade).
    exit $check_status
