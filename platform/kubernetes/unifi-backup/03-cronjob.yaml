---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: unifi-backup
  namespace: backups
spec:
  # Daily at 04:00 PT — after the UDM's own 07:00 UTC autobackup
  # writes a fresh .unf, and before the 06:00 PT daily-report email so
  # status metrics are visible in the morning digest.
  schedule: "0 4 * * *"
  timeZone: "America/Los_Angeles"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 90000  # 25h — same pattern as other CronJobs
      template:
        spec:
          serviceAccountName: unifi-backup
          restartPolicy: Never
          containers:
            - name: backup
              # alpine/k8s ships with kubectl, curl, openssh-client AND aws CLI.
              # Same image the unifi-cert-sync CronJob uses, keeping the
              # ssh client+aws CLI bundle in one place. (aws-s3-sync image
              # lacks ssh; tried 2026-05-23 and the SCP step failed.)
              image: alpine/k8s:1.31.13
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "/config/backup.sh"]
              env:
                # Lives under archive.wind.etherport.net/unifi/ because
                # the kubernetes-s3-backup IAM user already has write
                # access to that bucket (s3-sync writes there for the
                # tenant shares). The velero.wind.etherport.net bucket
                # is owned by Velero's IAM user; granting cross-user
                # access there would be more plumbing for the same
                # outcome.
                - name: S3_BUCKET
                  value: "infra.wind.etherport.net"
                - name: PUSHGATEWAY_URL
                  value: "http://pushgateway.monitoring.svc.cluster.local:9091"
                # M75 IRSA: short-lived creds for `aws s3 cp` via web identity
                # (replaces the aws-backup-credentials static key). The
                # alpine/k8s image's aws CLI v2 uses the SDK default chain.
                - name: AWS_REGION
                  value: "us-west-2"
                - name: AWS_ROLE_ARN
                  value: "arn:aws:iam::830881980142:role/wind-irsa-s3-sync"
                - name: AWS_WEB_IDENTITY_TOKEN_FILE
                  value: "/var/run/secrets/eks.amazonaws.com/serviceaccount/token"
              volumeMounts:
                - name: ssh-key
                  mountPath: /ssh
                  readOnly: true
                - name: script
                  mountPath: /config
                  readOnly: true
                - name: aws-iam-token
                  mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 96Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: ssh-key
              secret:
                secretName: unifi-backup-ssh
                defaultMode: 0600
            - name: script
              configMap:
                name: unifi-backup-script
                defaultMode: 0755
            # M75 IRSA: projected SA token (aud sts.amazonaws.com) for web identity.
            - name: aws-iam-token
              projected:
                sources:
                  - serviceAccountToken:
                      audience: sts.amazonaws.com
                      expirationSeconds: 3600
                      path: token
