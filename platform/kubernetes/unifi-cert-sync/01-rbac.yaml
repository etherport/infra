apiVersion: v1
kind: ServiceAccount
metadata:
  name: unifi-cert-sync
  namespace: unifi-cert-sync
---
# Cross-namespace read on the wildcard Secret in the traefik namespace.
# Scoped to resourceName so we can't accidentally read other secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-wildcard-cert
  namespace: traefik
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["wildcard-wind-etherport-net-rsa-tls"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: unifi-cert-sync-reads-wildcard
  namespace: traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: read-wildcard-cert
subjects:
  - kind: ServiceAccount
    name: unifi-cert-sync
    namespace: unifi-cert-sync
