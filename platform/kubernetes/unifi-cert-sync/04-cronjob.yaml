apiVersion: batch/v1
kind: CronJob
metadata:
  name: unifi-cert-sync
  namespace: unifi-cert-sync
  labels:
    app: unifi-cert-sync
spec:
  # Weekly Monday 04:00 local. cert-manager renews wildcard cert ~60 days
  # before expiry; weekly polling catches the new cert within a week of
  # rotation. Also catches UDM/Protect firmware updates that reset the cert.
  schedule: "0 4 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: unifi-cert-sync
        spec:
          serviceAccountName: unifi-cert-sync
          restartPolicy: Never
          containers:
            - name: sync
              # alpine/k8s ships with kubectl + bash + curl + openssl pre-installed.
              # Just need to add openssh-client + jq at runtime (~5s).
              # See https://hub.docker.com/r/alpine/k8s
              image: alpine/k8s:1.31.13
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "-lc"]
              args:
                - |
                  set -e
                  apk add --no-cache --quiet openssh-client jq coreutils >/dev/null
                  exec /bin/bash /scripts/sync.sh
              env:
                - name: PUSHGATEWAY_URL
                  value: "http://pushgateway.monitoring.svc.cluster.local:9091"
              volumeMounts:
                - name: script
                  mountPath: /scripts
                - name: config
                  mountPath: /config
                - name: ssh
                  mountPath: /ssh
                  readOnly: true
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
          volumes:
            - name: script
              configMap:
                name: unifi-cert-sync-script
                items:
                  - key: sync.sh
                    path: sync.sh
                    mode: 0755
            - name: config
              configMap:
                name: unifi-cert-sync-script
                items:
                  - key: targets
                    path: targets
            - name: ssh
              secret:
                secretName: unifi-cert-sync-ssh
                defaultMode: 0400
