apiVersion: batch/v1
kind: CronJob
metadata:
  name: unifi-cert-sync
  namespace: unifi-cert-sync
  labels:
    app: unifi-cert-sync
spec:
  # Weekly Monday 04:00 local. cert-manager renews wildcard cert ~60 days
  # before expiry; weekly polling catches the new cert within a week of
  # rotation. Also catches UDM/Protect firmware updates that reset the cert.
  schedule: "0 4 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: unifi-cert-sync
        spec:
          serviceAccountName: unifi-cert-sync
          restartPolicy: Never
          containers:
            - name: sync
              # alpine + openssh + kubectl + curl + openssl. Use an image
              # we already have around if possible. Build a thin image
              # later if this becomes a hot path; for now use bitnami's
              # kubectl image which ships with bash + curl + openssl, then
              # apk add openssh-client at runtime.
              image: alpine:3.20
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-lc"]
              args:
                - |
                  set -e
                  apk add --no-cache --quiet \
                    bash openssh-client openssl curl coreutils kubectl
                  exec /bin/bash /scripts/sync.sh
              env:
                - name: PUSHGATEWAY_URL
                  value: "http://pushgateway.monitoring.svc.cluster.local:9091"
              volumeMounts:
                - name: script
                  mountPath: /scripts
                - name: config
                  mountPath: /config
                - name: ssh
                  mountPath: /ssh
                  readOnly: true
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
          volumes:
            - name: script
              configMap:
                name: unifi-cert-sync-script
                items:
                  - key: sync.sh
                    path: sync.sh
                    mode: 0755
            - name: config
              configMap:
                name: unifi-cert-sync-script
                items:
                  - key: targets
                    path: targets
            - name: ssh
              secret:
                secretName: unifi-cert-sync-ssh
                defaultMode: 0400
