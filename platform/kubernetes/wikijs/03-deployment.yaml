apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiki-js
  namespace: wikijs
  labels:
    app: wiki-js
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wiki-js
  template:
    metadata:
      labels:
        app: wiki-js
    spec:
      # L26 (2026-07-01): this workload never calls the kube API — don't hand
      # every pod a cluster credential by default.
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: fix-permissions
          image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616 # {"$imagepolicy": "flux-system:busybox"}
          command: ['sh', '-c', 'chown -R 1000:1000 /wiki/data']
          volumeMounts:
            - name: data
              mountPath: /wiki/data
      containers:
        - name: wiki-js
          image: ghcr.io/requarks/wiki:2.5.314@sha256:68f0d1848261ae76492ba358e30a96a76fed5d97a3fff381656082bf90f70d7e # {"$imagepolicy": "flux-system:wikijs"}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            # Database configuration
            - name: DB_TYPE
              value: "postgres"
            - name: DB_HOST
              value: "postgres-cluster-rw.postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "wikijs"
            - name: DB_USER
              value: "wikijs"
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: wiki-js-db-credentials
                  key: DB_PASS
            # SSL not required for internal cluster traffic
            - name: DB_SSL
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /wiki/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wiki-js-data
