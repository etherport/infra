apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiki-js
  namespace: wikijs
  labels:
    app: wiki-js
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wiki-js
  template:
    metadata:
      labels:
        app: wiki-js
    spec:
      containers:
        - name: wiki-js
          image: ghcr.io/requarks/wiki:2
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            # Database configuration
            - name: DB_TYPE
              value: "postgres"
            - name: DB_HOST
              value: "postgres-cluster-rw.postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "wikijs"
            - name: DB_USER
              value: "wikijs"
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: wiki-js-db-credentials
                  key: DB_PASS

            # SSL not required for internal cluster traffic
            - name: DB_SSL
              value: "false"

          volumeMounts:
            - name: data
              mountPath: /wiki/data

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10

          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wiki-js-data
