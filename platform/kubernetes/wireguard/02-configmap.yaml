apiVersion: v1
kind: ConfigMap
metadata:
  name: wireguard-config
  namespace: wireguard
data:
  README: |
    WireGuard VPN Configuration
    ===========================

    This pod runs WireGuard site-to-site tunnel:
    - wg0: Site-to-site tunnel to vpn-aws (10.255.255.2/30)

    Remote access (wg1) is handled by vpn-aws only.
    Clients connect to vpn-aws:51821, then route through wg0 to homelab.

    VIP: 10.10.201.20 (managed by Keepalived)

    Failover:
    - K8s pod is primary (priority 150)
    - vpn-fallback VM is backup (priority 100)
    - Keepalived moves VIP automatically on failure
