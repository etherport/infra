apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireguard
  namespace: wireguard
  labels:
    app: wireguard
spec:
  replicas: 1
  strategy:
    type: Recreate  # Never run two pods simultaneously (VIP conflict)
  selector:
    matchLabels:
      app: wireguard
  template:
    metadata:
      labels:
        app: wireguard
      annotations:
        kubectl.kubernetes.io/default-container: wireguard
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      # Schedule on any worker node (not control-plane)
      # Cleanup DaemonSet handles orphaned interfaces when pod moves
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
      containers:
        - name: wireguard
          image: ubuntu:24.04
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - SYS_MODULE
            privileged: false
          ports:
            - name: wg0
              containerPort: 9820
              protocol: UDP
              hostPort: 9820
            - name: wg1
              containerPort: 9821
              protocol: UDP
              hostPort: 9821
          volumeMounts:
            - name: wireguard-keys
              mountPath: /secrets
              readOnly: true
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
          command:
            - /bin/bash
            - -c
            - |
              set -e

              echo "Installing WireGuard tools..."
              apt-get update && apt-get install -y wireguard-tools iproute2 iptables

              # Clean up any orphaned interfaces from previous runs
              echo "Cleaning up any existing WireGuard interfaces..."
              ip link del wg0 2>/dev/null || true
              ip link del wg1 2>/dev/null || true

              echo "Setting up WireGuard interfaces..."
              mkdir -p /etc/wireguard

              # Create wg0 config (site-to-site tunnel to AWS)
              # Uses /29 to allow multiple regional VPN endpoints (vpn-aws=.1, homelab=.2, regional=.3-.6)
              cat > /etc/wireguard/wg0.conf <<EOF
              [Interface]
              Address = 10.255.255.2/29
              ListenPort = 9820
              PrivateKey = $(cat /secrets/wg0-private.key)
              MTU = 1420
              # NAT for regional VPN traffic (so replies route back via wg0)
              PostUp = iptables -t nat -I POSTROUTING 1 -s 10.255.255.0/29 -o eth0 -j MASQUERADE
              # NAT for LAN traffic going to AWS via wg0
              PostUp = iptables -t nat -I POSTROUTING 1 -o wg0 -j MASQUERADE
              PostUp = iptables -I FORWARD 1 -i wg0 -o eth0 -j ACCEPT
              PostUp = iptables -I FORWARD 1 -i eth0 -o wg0 -j ACCEPT
              PostDown = iptables -t nat -D POSTROUTING -s 10.255.255.0/29 -o eth0 -j MASQUERADE || true
              PostDown = iptables -t nat -D POSTROUTING -o wg0 -j MASQUERADE || true
              PostDown = iptables -D FORWARD -i wg0 -o eth0 -j ACCEPT || true
              PostDown = iptables -D FORWARD -i eth0 -o wg0 -j ACCEPT || true

              [Peer]
              # vpn-aws (us-west-2) - primary site-to-site
              PublicKey = kHjcUM33FcpYWHgsE4Nwchaqky+iuJ7JfLTzC7lgOmU=
              Endpoint = 44.240.60.80:51820
              AllowedIPs = 10.10.100.0/22, 10.255.255.1/32
              PersistentKeepalive = 25

              # vpn-mumbai (ap-south-1) peer block removed 2026-05-23.
              # vpn-use1 (us-east-1) peer block removed 2026-07-01 (M110 Phase 6):
              # us-east-1 spoke decommissioned (Tailscale covers remote reach; the
              # standing t4g.nano + EIP were dead weight). AWS stack destroyed.
              EOF

              # Create wg1 config (remote access - direct connection)
              # Uses same keys as vpn-aws wg1 for seamless endpoint switching
              cat > /etc/wireguard/wg1.conf <<EOF
              [Interface]
              Address = 10.254.0.1/24
              ListenPort = 9821
              PrivateKey = $(cat /secrets/wg1-private.key)
              MTU = 1420
              # NAT for full-tunnel clients (route all traffic through VPN)
              # Use -I to insert at beginning - must run BEFORE Cilium/K8s rules
              PostUp = iptables -t nat -I POSTROUTING 1 -s 10.254.0.0/24 ! -d 10.0.0.0/8 -j MASQUERADE
              # NAT for VPN clients accessing homelab LAN (so replies route back correctly)
              PostUp = iptables -t nat -I POSTROUTING 1 -s 10.254.0.0/24 -o eth0 -j MASQUERADE
              PostDown = iptables -t nat -D POSTROUTING -s 10.254.0.0/24 ! -d 10.0.0.0/8 -j MASQUERADE
              PostDown = iptables -t nat -D POSTROUTING -s 10.254.0.0/24 -o eth0 -j MASQUERADE

              [Peer]
              # Graham
              PublicKey = 7FAI4YiWGRtKDl3AaG+jxjf0vDVaTtUisf68nQRFozA=
              AllowedIPs = 10.254.0.10/32
              EOF

              chmod 600 /etc/wireguard/*.conf

              # Bring up wg0 (site-to-site)
              echo "Bringing up wg0..."
              if ip link show wg0 > /dev/null 2>&1; then
                echo "wg0 already exists, syncing config..."
                wg syncconf wg0 <(wg-quick strip wg0)
              else
                wg-quick up wg0
              fi

              # Bring up wg1 (remote access)
              echo "Bringing up wg1..."
              if ip link show wg1 > /dev/null 2>&1; then
                echo "wg1 already exists, syncing config..."
                wg syncconf wg1 <(wg-quick strip wg1)
              else
                wg-quick up wg1
              fi

              echo "WireGuard interfaces active:"
              wg show wg0
              wg show wg1

              # Setup policy routing for VPN clients connecting via AWS
              # When traffic from VPN clients (10.254.0.0/24) arrives via wg0 (from AWS),
              # responses must go back via wg0, not via the local wg1 interface
              echo "Setting up policy routing for AWS VPN client traffic..."

              # Create routing table for wg0 return traffic
              grep -q "100 wg0_return" /etc/iproute2/rt_tables || echo "100 wg0_return" >> /etc/iproute2/rt_tables

              # Get default gateway
              DEFAULT_GW=$(ip route | grep "^default" | awk '{print $3}')

              # Route VPN client traffic via default gateway (returns through wg0 to AWS)
              ip route replace 10.254.0.0/24 via $DEFAULT_GW table wg0_return

              # Mark connections from VPN clients arriving via wg0 (not wg1)
              iptables -t mangle -C PREROUTING -s 10.254.0.0/24 ! -i wg1 -j CONNMARK --set-mark 100 2>/dev/null || \
              iptables -t mangle -A PREROUTING -s 10.254.0.0/24 ! -i wg1 -j CONNMARK --set-mark 100

              # Restore mark on response packets
              iptables -t mangle -C OUTPUT -d 10.254.0.0/24 -j CONNMARK --restore-mark 2>/dev/null || \
              iptables -t mangle -A OUTPUT -d 10.254.0.0/24 -j CONNMARK --restore-mark

              # Use wg0_return table for marked packets
              ip rule del fwmark 100 table wg0_return 2>/dev/null || true
              ip rule add fwmark 100 table wg0_return prio 99

              # Also add source-based rule for local host responses
              HOST_IP=$(ip -4 addr show eth0 | grep -oP '(?<=inet\s)\d+(\.\d+){3}')
              ip rule del from $HOST_IP to 10.254.0.0/24 table wg0_return 2>/dev/null || true
              ip rule add from $HOST_IP to 10.254.0.0/24 table wg0_return prio 97

              echo "Policy routing configured"

              # Keep container running and monitor interfaces
              while true; do
                if ! ip link show wg0 > /dev/null 2>&1; then
                  echo "WARNING: wg0 down, restarting..."
                  wg-quick up wg0 || true
                fi
                if ! ip link show wg1 > /dev/null 2>&1; then
                  echo "WARNING: wg1 down, restarting..."
                  wg-quick up wg1 || true
                fi
                sleep 30
              done
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - "wg-quick down wg1 || true; wg-quick down wg0 || true"
          # Startup probe: allows up to 5 minutes for apt-get install
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - "which wg && ip link show wg0"
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30  # 30 * 10s = 5 minutes max startup
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - "ip link show wg0 && ip link show wg1"
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - "wg show wg0 && wg show wg1"
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
        - name: keepalived
          image: ubuntu:24.04
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_BROADCAST
                - NET_RAW
            privileged: false
          command:
            - /bin/bash
            - -c
            - |
              set -e

              echo "Installing keepalived..."
              # procps required for pkill/pgrep used by the preStop hook —
              # without it, the hook silently fails (FailedPreStopHook event
              # in `kubectl -n wireguard get events`), no priority-0 VRRP
              # advert is sent, and vpn-fallback takes ~3.6s of master_down_interval
              # to detect the gap. Caught 2026-05-22 during PR 5 of SDN migration.
              apt-get update && apt-get install -y keepalived iproute2 procps

              # Detect primary network interface (first non-lo interface with an IP)
              PRIMARY_IF=$(ip -o -4 addr show | grep -v '127.0.0.1' | head -1 | awk '{print $2}')
              echo "Detected primary interface: $PRIMARY_IF"

              # Clean up any orphaned VIP from previous runs
              echo "Cleaning up any existing VIP..."
              ip addr del 10.10.201.20/24 dev $PRIMARY_IF 2>/dev/null || true

              # Create keepalived config
              cat > /etc/keepalived/keepalived.conf <<EOF
              global_defs {
                script_user root
                enable_script_security
              }

              vrrp_script check_wg {
                script "/usr/local/bin/check-wireguard.sh"
                interval 2
                weight -50
                fall 3
                rise 2
                # init_fail: keep the script's "failed" state at startup so
                # we don't go MASTER before wg-quick has brought up wg0/wg1.
                # Without this, the pod went MASTER 4s after process start
                # (preempt_delay is silently discarded for state MASTER —
                # see below) and immediately stole the VIP from vpn-fallback
                # while its own tunnels were still being installed.
                # Caught 2026-05-22 during SDN migration.
                init_fail
              }

              vrrp_instance WG_VIP {
                # state BACKUP (not MASTER) so preempt_delay is honored.
                # Keepalived silently clears preempt_delay when state=MASTER:
                #   "(WG_VIP) Warning - preempt delay will not work with
                #    initial state MASTER - clearing"
                # With state BACKUP + higher priority (150 vs vpn-fallback's
                # 100), we still win the election — but now we wait
                # preempt_delay seconds before promoting, AND init_fail
                # on check_wg gates that promotion on wg0/wg1 being ready.
                state BACKUP
                interface $PRIMARY_IF
                virtual_router_id 51
                priority 150
                advert_int 1
                # When the K8s pod returns after a failover, wait 5 min
                # before reclaiming the VIP from vpn-fallback — gives
                # wg-quick + Multus + Cilium time to fully settle.
                preempt_delay 300

                authentication {
                  auth_type PASS
                  auth_pass wgvrrp51
                }

                virtual_ipaddress {
                  10.10.201.20/24
                }

                track_script {
                  check_wg
                }
              }
              EOF

              # Create health check script (checks both wg0 and wg1)
              cat > /usr/local/bin/check-wireguard.sh <<'SCRIPT'
              #!/bin/bash
              # Check both WireGuard interfaces exist
              if ! ip link show wg0 > /dev/null 2>&1; then
                exit 1
              fi
              if ! ip link show wg1 > /dev/null 2>&1; then
                exit 1
              fi
              exit 0
              SCRIPT
              chmod +x /usr/local/bin/check-wireguard.sh

              echo "Starting keepalived..."
              keepalived -n -l --dont-fork
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    # Graceful VRRP master release.
                    #
                    # Order matters:
                    #   1. SIGTERM keepalived. It sends a priority-0 VRRP
                    #      advertisement on graceful shutdown — vpn-fallback
                    #      (the BACKUP) elects itself MASTER within one
                    #      advert_int (~1s) and claims the VIP via
                    #      gratuitous ARP. NO wait-for-VRRP-timeout (~3s)
                    #      blackhole.
                    #   2. Wait up to 5s for keepalived to exit; if it
                    #      hangs, SIGKILL it.
                    #   3. Only THEN strip the VIP from our local NIC,
                    #      as a final cleanup. By this point the BACKUP
                    #      already owns the VIP on its own NIC — leaving
                    #      our copy creates a duplicate-IP situation that
                    #      the cleanup DaemonSet handles, but doing it
                    #      here is faster.
                    #
                    # Previous version: ip-addr-del BEFORE pkill, which
                    # left a ~3s blackhole because keepalived noticed the
                    # VIP gone and tried to re-add it before we killed it,
                    # and there was no priority-0 advert sent.
                    set +e
                    PRIMARY_IF=$(ip -o -4 addr show | grep -v '127.0.0.1' | head -1 | awk '{print $2}')
                    pkill -TERM keepalived
                    for i in 1 2 3 4 5; do
                      pgrep keepalived >/dev/null || break
                      sleep 1
                    done
                    pkill -KILL keepalived 2>/dev/null
                    ip addr del 10.10.201.20/24 dev "$PRIMARY_IF" 2>/dev/null
                    exit 0
          resources:
            requests:
              memory: "64Mi"
              cpu: "10m"
            limits:
              memory: "256Mi"
              cpu: "100m"
      volumes:
        - name: wireguard-keys
          secret:
            secretName: wireguard-keys
            defaultMode: 0600
        - name: lib-modules
          hostPath:
            path: /lib/modules
            type: Directory
