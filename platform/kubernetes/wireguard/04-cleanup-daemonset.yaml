apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: wireguard-cleanup
  namespace: wireguard
  labels:
    app: wireguard-cleanup
spec:
  selector:
    matchLabels:
      app: wireguard-cleanup
  template:
    metadata:
      labels:
        app: wireguard-cleanup
    spec:
      hostNetwork: true
      # Run on all worker nodes
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: cleanup
          image: alpine:3.19
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          command:
            - /bin/sh
            - -c
            - |
              apk add --no-cache iproute2 curl jq

              HOSTNAME=$(hostname)
              echo "WireGuard cleanup daemon starting on $HOSTNAME"

              while true; do
                # Check if the main wireguard pod is running on THIS node
                # by checking if there's a wg0 interface with an active WireGuard process

                # Check if any WireGuard interfaces exist on this node
                if ip link show wg0 > /dev/null 2>&1 || ip link show wg1 > /dev/null 2>&1; then
                  # WireGuard interface(s) exist - check if the main pod is running here
                  # The main pod runs wg-quick which creates the interfaces

                  # Check for wireguard pod on this node via kubernetes API
                  # Use KUBERNETES_SERVICE_HOST (auto-injected) since hostNetwork can't resolve DNS
                  API_SERVER="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
                  POD_ON_NODE=$(curl -sk \
                    -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
                    "${API_SERVER}/api/v1/namespaces/wireguard/pods?labelSelector=app=wireguard&fieldSelector=spec.nodeName=$HOSTNAME" \
                    2>/dev/null | jq -r '.items | length')

                  if [ "$POD_ON_NODE" = "0" ] || [ -z "$POD_ON_NODE" ]; then
                    echo "$(date): Orphaned WireGuard interfaces found on $HOSTNAME (no wireguard pod here), cleaning up..."
                    ip link del wg0 2>/dev/null || true
                    ip link del wg1 2>/dev/null || true

                    # Also remove VIP if present
                    PRIMARY_IF=$(ip -o -4 addr show | grep -v '127.0.0.1' | head -1 | awk '{print $2}')
                    ip addr del 10.10.201.20/24 dev $PRIMARY_IF 2>/dev/null || true

                    echo "$(date): Cleanup complete on $HOSTNAME"
                  fi
                fi

                sleep 30
              done
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"
      serviceAccountName: wireguard-cleanup
      terminationGracePeriodSeconds: 5
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wireguard-cleanup
  namespace: wireguard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wireguard-cleanup
  namespace: wireguard
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wireguard-cleanup
  namespace: wireguard
subjects:
  - kind: ServiceAccount
    name: wireguard-cleanup
    namespace: wireguard
roleRef:
  kind: Role
  name: wireguard-cleanup
  apiGroup: rbac.authorization.k8s.io
